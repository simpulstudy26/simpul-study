마가 다 얘기한 줄 알았는데, 언니는 아무것도 모르고 있었다. 언니가 답답한 듯 말했다.\n“여기, 반지하야.”\n나는 조그맣게 대꾸했다.\n“나도 알아.”\n우리는 트럭 앞에 모여 피아노를 올려다봤다. 그것은 몰락한 러시아 귀족처럼 끝까지 체면을 차리며 우아하고 담담하게 서 있었다. 외삼촌의 트럭은 길 한가운데를 막고 있었다. 우리는 서둘러\n\n[읽기 중 활동 2] ‘나는 체르니를 배우고 싶기보단 체르니란 말이 갖고 싶었다.’라는 말에 담긴 ‘나’의 마음을 파악해 보자.\n[읽기 중 활동 3] ‘나’의 가정 형편이 어려워진 이유가 무엇인지 찾아보자.\n[읽기 중 활동 4] 트럭 위의 피아노를 ‘몰락한 러시아 귀족’에 빗대어 표현한 이유를 짐작해 보자.\n[낱말 풀이]\n바이엘, 체르니, 하농: 피아노 교본 이름.\n차압(差押): 압류와 같은 말로서, 체납자의 재산에 대하여 법원이 행하는 강제 처분.\n쇼바: 용수철이나 고무와 같은 탄성체 따위를 이용하여 충격이나 진동을 약하게 하는 장치. 표준어는 댐퍼(damper).\n보증(保證): 채무자가 채무를 이행하지 아니할 경우, 채무자를 대신하여 채무를 이행할 것을 부담하는 일.","notes":[],"kind":"교과서"},{"id":"book87","group":"dodo","page":87,"title":"교과서 87쪽","text":"[86쪽에서 이어짐]\n목장갑을 꼈다. 외삼촌이 피아노의 한쪽 끝을, 언니와 내가 반대쪽을 잡았다. 외삼촌이 신호를 보냈다. 나는 깊은 숨을 쉰 뒤 피아노를 번쩍 들어 올렸다. 1980년대산(産) 피아노가 잠시 세기말 도시의 하늘 위로 비상했다. 그 모습이 꽤 아름다워 하마터면 탄성을 지를 뻔했다. 우리는 한 걸음씩 이동했다. 다리가 후들거리고 진땀이 났다. 사람들이 우리를 흘깃거렸다. 뒤에서 승용차 한 대가 비켜 달라는 듯 경적을 울려 댔다. 곧 건물 2층에 사는 집주인이 체육복 차림으로 내려왔다. 동글동글한 체구에, 아침 체조를 빼먹지 않을 것 같이 생긴 50대 중반의 사내였다. 그는 집 앞에서 벌어진 풍경이 믿기지 않는다는 듯 아연한 표정으로 서 있었다. 나는 피아노를 든 채 어색하게 웃으며 목례했다. 언니 역시 눈치껏 사내에게 인사했다. 좁고 가파른 계단 아래로 피아노가 천천히 머리를 디밀고 있었다. 세탁기도, 냉장고도 아닌 피아노라니. 우리 삶이 세 뼘쯤 민망해지는 기분이었다. 갑자기 쿵— 하는 소리가 났다. 외삼촌이 피아노를 놓친 모양이었다. 우당탕탕— 피아노가 계단을 미끄러져 나갔다. 언니와 나는 다급하게 피아노 다리를 붙잡았다. 웡— 하는 공명감 사이로, 악기 속 여러 개의 시간이 뭉개지는 소리가 났다. 피아노 넝쿨무늬가 고장 난 스프링처럼 흔들리고 있는 모습이 보였다. 충격 때문에 몸에서 떨어져 나간 모양이었다. 그제야 나는 내가 오랫동안 양각된 거라 믿어 온 문양이 사실은 본드로 붙여져 있던 것이라는 걸 깨달았다. 우리는 외삼촌의 안색을 살폈다. 외삼촌은 괜찮다는 신호를 보낸 뒤 다시 계단을 내려갔다. 나는 외삼촌의 부상이나 피아노의 상태가 걱정되지 않았다. 그보다는 쿵— 소리, 내가 처음 도착한 도시에 울려 퍼지는 그 사실적이고, 커다랗고, 노골적인 소리에 얼굴이 붉어졌다. 집주인은 어이없고 못마땅하다는 표정으로 언니와, 나와, 피아노와, 외삼촌과, 다시 피아노를 번갈아 쳐다봤다.\n“학생.”\n\n[낱말 풀이]\n아연(啞然)하다: 너무 놀라거나 어이가 없어서 또는 기가 막혀서 입을 딱 벌리고 말을 못 하는 상태이다.\n공명감(共鳴感): 진동하는 계의 진폭이 급격하게 늘어나는 느낌.\n양각(陽刻): 조각에서, 평평한 면에 글자나 그림 따위를 도드라지게 새기는 일. 또는 그 조각.","notes":[],"kind":"교과서"},{"id":"book88","group":"dodo","page":88,"title":"교과서 88쪽","text":"주인 남자가 언니를 불렀다. 언니는 재빨리 계단을 올라갔다. 출구 쪽, 네모난 햇살 아래 뭔가 열심히 설명하고 있는 언니의 모습이 보였다. 언니는 승용차 운전자에게도 양해를 구했다. 우리는 결국 관리비를 더 내고, 피아노를 절대 치지 않겠다는 조건으로 집주인을 돌려보냈다. 집주인은 돌아서며 한마디 했는데, 치지도 않을 피아노를 왜 갖고 있느냐는 거였다.\n\n(중략)\n[중략 부분의 줄거리]\n전문 대학 치기공과를 다니다가 휴학 중인 언니는 취업이 잘된다는 말에 서둘러 원서를 쓴 것이 후회된다며 영문과에 편입하고 싶어 한다. 언니는 헤어진 남자 친구가 만취해 집으로 찾아와 쓰러졌을 때 자기도 모르게 그 사람의 입술을 벌려 이를 보았다는 경험을 이야기한다. 반지하방에 이불을 펴고 자리에 누운 ‘나’는 창밖을 보며 언니에게 어쩐지 여기가 서울 같지 않다는 말을 한다.\n\n언니의 컴퓨터는 엄마가 대학 입학 선물로 사 준 거였다. 언니는 같은 과 친구를 따라 용산에서 조립식 컴퓨터를 샀다. 친구는 전자 상가 직원과 암호 같은 말을 주고받은 뒤, 마지막으로 언니에게 본체 케이스를 골라 보라고 했다. 상가 한쪽에는 여러 종류의 케이스가 궤짝처럼 쌓여 있었다. 언니는 그중 하나를 수줍게 가리켰다. 전투 로봇의 갑옷처럼 번쩍하니 투박하게 생긴 거였다. 친구가 놀란 표정으로 “왜 그런 걸 고르냐?”고 묻자, 언니는 얼굴을 붉히며 “저게 가장 21세기적인 느낌 같아서…….”라고 답했다 한다. 언니는 가장 21세기적인 컴퓨터와 함께 반지하에 살게 되었다. 21세기가 얼마나 ‘슬림’한 것인지를 알게 되는 데는 많은 시간이 필요하지 않았겠지만. 그것은 방 한쪽에 불룩하게 자리를 잡았다.\n\n나는 아르바이트를 시작했다. 인쇄소와 연결돼 학원 교재나 시험지를 만드는 일이었다. 처음엔 커피숍이나 호프집에서 서빙 을 할 생각이었다. 이제 막 스무 살이 된 내 상식으로 아르바이트란 무릇 그런 것이었다. 그러나 나는 구인 광고란에 적힌 ‘준수 한 외모’라는 말의 진정한 뜻을 모르고 있었다. 나는 준수할까말까 한 ‘귀여운’ 외모로, 다른 일을 찾아 벼룩 시장을 훑어 나갔 다. 터무니없이 많은 돈을 준다는 곳과, 믿을 수 없이 적은 돈을 준다는 곳 사이에, A4지 한 장당 1,500원을 주는 곳이 있었다.  그 돈이 많은 건지 적은 건지는 알 수 없었지만, 워드 작업 정도면 나도 할 수 있을 거라는 생각이 들었다. 일은 생각만큼 쉽지 않았다. 어깨도 결리고, 눈이 아픈 데다, 타자 치랴, 오탈자 확인하랴, 도표 갖다 붙이랴, 영어에, 한자  표기까지 정신이 없었다. 인쇄소에서는 오탈자가 날 경우 돈을 줄 수 없다고 했다.\n그곳에선 정해진 시간에 결코 소화할 수 없는 양의 일을\n\n[낱말 풀이]\n준수(俊秀)하다: 재주와 슬기, 풍채가 빼어나다.\n결리다: 숨을 크게 쉬거나 몸을 움직일 때에, 몸의 어떤 부분이 뜨끔뜨끔 아프거나 뻐근한 느낌이 들다.","notes":[],"kind":"교과서"},{"id":"book89","group":"dodo","page":89,"title":"교과서 89쪽","text":"[88쪽에서 이어짐]\n주고, 아무렇지 않게 3일 안에 해 달라고 했다.\n나는 ‘당장 저만큼이면 얼마 벌 수 있겠다.’란 생각에 덥석 일을  안고 와 시뻘게진 눈으로 밤을 새웠다. 언니의 컴퓨터는 디귿 키가 잘 먹지 않아 작업 속도를 떨어트리곤 했다. 나는 신나게  손가락을 놀리다 번번이 디귿키 앞에서 멈춰 섰다. 나는 도로 위로 뛰어든 사슴이라도 본 양 디귿만 보면 긴장했고, 그제야 세 상에 디귿이 들어가는 글자가 얼마나 많은지 깨달으며 한탄해야 했다. 나는 목을 길게 뺀 채 모니터 앞에 붙박여 있었다. 언니 는 “흑백은 눈에 가장 피로를 많이 주는 색이라던데.”라며 나를 걱정스럽게 바라봤다. 백 년 전 사람들은 상상하지 못할 정도로  진보적인 기계 앞에서, 내 등은 네안데르탈인처럼 점점 굽어 갔다.\n\n언니는 편입 시험을 준비하고 있었다. 언니는 4년제 영문과에 들어가 어학연수도 가고, 취직도 하고 싶다 했다. 나는 ‘재수’ 나 ‘전학’이라는 말과 달리 ‘편입’이란 말은 묘한 빈곤감을 준다고 생각했다. 언니는 “세상에 영어 하나만 돼도 주어지는 기회가  얼마나 많은 줄 아느냐.”며 훈수를 뒀다. 나는 언니가 ‘영어 하나만 돼도 주어지는 기회가 많다.’는 걸, 어째서 20대 초반이 다  지나서야 깨달은 것일까 의아했다. 언니는 문제집을 잔뜩 안고 와, 단어를 외우고 테이프를 청취했다. 내가 미친 듯이 타이핑을  하는 동안, 언니는 피아노 위에 문법책을 펼쳐 놓고 외국어를 웅얼거렸다. 밤마다, 조그마한 불빛이 새어 나오는 이곳 반지하에 는 타자 소리와, 영어 단어 외우는 소리가 끊이지 않았다. 어느 날 언니는 도저히 이해가 안 된다는 듯 볼펜을 집어던지며 소리 쳤다. “야, ‘미래’가 어떻게 ‘완료’되냐?” 나는 지층 단면도를 따다 붙이다 말고, 키보드에 머리를 박으며 외쳤다. “아! 과학이 제일 싫어!”\n\n초여름이었다. 이따금 비가 오다 그쳤고, 다시 내렸다. 창밖, 보도 위의 빗방울들이 수많은 원을 그리며 내 머리 위에 아름답게 떠 있었다. 비는, 하늘이 아닌 지상에서 내리는 것 같았다. 나는 입안에 건포도를 털어 넣으며 창밖을 바라봤다. 건포도는 내가 가장 좋아하는 간식이었다. 그걸 먹으면 왠지 까맣게 졸아붙은 캘리포니아 햇빛을 씹어 먹는 기분이었다. 언니는 번화가에 있는 프랜차이즈 식당에서 계산대 보는 일을 하고 있었다. 언니는 새벽마다 어깨에 쌀 포대만 한 졸음을 이고 학원에 갔고, 주말이면 다리 사이에 그 포대를 끼고 한없이 깊은 잠을 잤다. 언니는 종종 옛 애인과 통화했다. 그는 훌쩍이며 집 앞에 찾아오기도 하는 모양이었다. 이따금 비가 오다 그쳤고, 다시 내렸다. 나는 티브이 앞에 앉아 ‘오늘의 날씨’를 경청했\n\n[낱말 풀이] 네안데르탈인: 1856년 독일 네안데르탈의 석회암 동굴에서 머리뼈가 발견된 화석 인류.","notes":[],"kind":"교과서"},{"id":"book90","group":"dodo","page":90,"title":"교과서 90쪽","text":"[89쪽에서 이어짐]\n다. 언니가 집을 비우면, 청소를 하고 손쉬운 반찬을 만들고 햇빛 알갱이가 들어 있다는 합성 세제로 빨래를 했다. 티브이에선 곧 장마가 시작될 거라는 소식을 전해 왔다. 나는 플라스틱 통에 든 습기 제거제를 사다 싱크대 안쪽과 옷장, 신발장에 넣어 두었다. 저축한 돈이 있으니 사소한 재해쯤이야 아무래도 좋다는 마음이었다.\n\n나는 어서 학교에 가고 싶었다. 얼추 한 학기 등록금을 모았고, 무엇보다도 사람들과 관계 맺으며 ‘피로’나 ‘긴장’을 느끼고  싶었다. 긴장되는 옷을 입고, 긴장된 표정을 짓고, 평판을 의식하며, 사랑하고, 아첨하고, 농담하고, 험담하고, 계산적이거나 정 치적인 인간도 한번 돼 보고 싶었다. 나는 누군가에게 좋은 사람일 수도 있고 나쁜 사람일 수도 있지만, 사실 아무것도 될 수  없었다. 지금 나를 둘러싸고 있는 것들은 가전제품뿐이었다. 나는 냉장고에게 잘 보이거나, 전기밥통을 헐뜯고 싶지 않았다. 첫  월급을 탔을 때 누구를 만나, 어떻게 돈을 써야 할지 몰라 당황했었다. 이대로 아무도 모르게, 아무도 모르는 일만 하다 죽을  수는 없다고, 매일 어깨에 의자를 이고 등교하는 아이처럼 평생 아르바이트만 하고 살 순 없다고 생각했다. 가끔은 손가락이  나뭇가지처럼 기다랗게 자라나는 꿈을 꾸기도 했다. 나는 손가락만 진화한 인간 타자수가 되어 ‘다음 중 맞는 답을 고르시오.’ 라는 문장을 끊임없이 치고 있었다. 그리고 산더미만 한 문제지를 들고 인쇄소에 찾아가면, 그걸 전부 나더러 풀라는 것이었다.  나는 건포도를 오물거리며 ‘가을이 얼마 남지 않았으니까.’하고 안도했다. ‘8월에는 동대문에 옷을 사러 가야지. 화장은 언니에 게 배우고, 아르바이트는 반드시 집 밖에서 하는 걸로 해야겠다.’도 다음엔 레가 오는 것처럼 여름이 끝난 후 반드시 가을이 올  것 같았지만, 계절은 느릿느릿 지나가고, 우리의 청춘은 너무 환해서 창백해져 있었다. 방 안은 눅눅했다. 자판을 치다 주위를 둘러보면, 습기 때문에 자글자글 운 공기가 미역처럼 나풀대며 날아다니는 것 같았다.  벽지 위론 하나둘 곰팡이 꽃이 피었다. 피아노 뒤의 벽은 상태가 더 심했다. 건반 하나라도 누르면 꼭 그 음의 파동만큼 날아올 라, 곳곳에 포자를 흩날릴 것 같은 모양이었다. 나는 피아노가 썩을까 봐 걱정이었다. 몇 번 마른걸레로 닦아 봤지만 소용없었 다. 우선 달력 몇 장을 찢어 피아노 뒷면에 덧대 놓는 수밖에 없었다. 그러다 곧 피아노 건반을 확인해 보고 싶은 마음이 들었 다. 시골에서부터 이고온 것인데, 이대로 망가지면 억울할 것 같았다. 한날 마음을 먹고 피아노 의자 위에 앉았다. 그런 뒤 두  손으로 건반 뚜껑을 들어 올렸다. 손안에 익숙한 무게감이 전해져 왔다. 내가 알고 있는 무게감이었다. 곧 88개의 깨끗한 건반 이 눈에 들어왔다. 악기는 악기답게 고요했다. 나는 건반 위에 손가락을 얹어 보았다. 손목에 힘을 푼 채 뭔가 부드럽게 감아쥐 는 모양을 하고. 서늘하고 매끄러운 감촉이 전해졌다. 조금만 힘을 주면 원하는 소리가 날 터였다. 밖에선 공사음이 들려왔다.  며칠 전부터 주인집을 보수하는 소리였다. 문득 피아노를 치고 싶은 마음이 들었다. 이사 후 처음 있는 일이었다. 그리고 일단  그런 마음이 들자, 주체할 수 없는 감정이 솟구쳤다. 한 음 정도는 괜찮지 않을까. 소리는 금방 사라져 아무도 모를 것이다. 나 는 용기 내어 손가락에 힘을 주었다. “도―”\n도는 방 안에 갇힌 나방처럼 긴 선을 그리며 오래오\n\n[읽기 중 활동 5] ‘나’가 문득 피아노를 치고 싶다고 생각한 이유가 무엇일지 생각해 보자.","notes":[],"kind":"교과서"},{"id":"book91","group":"dodo","page":91,"title":"교과서 91쪽","text":"[90쪽에서 이어짐]\n래 날아다녔다. 나는 그 소리가 아름답다고 생각했다.\n가슴속 어떤 것이  엷게 출렁여 사그라지는 기분이었다. 도는 생각보다 오래 도― 하고 울었다. 나는 한 음이 완전하게 사라지는 느낌을 즐기려  눈을 감았다. 밖에서 문 두드리는 소리가 났다. 쿵쿵쿵쿵. 주먹으로 네 번이었다. 나는 얼른 피아노 뚜껑을 덮었다. 다시 쿵쿵  소리가 들렸다. 현관문을 열어 보니 주인집 식구들이었다. 체육복을 입은 남자와 그의 아내, 두 아이가 나란히 서 있었다. 사내아 이는 아빠와, 계집아이는 엄마와 똑 닮아 있었다. 외식이라도 갔다 오는지 그들 모두 입에 이쑤시개를 물고 있었다. 남자가 입을  열었다. “학생, 혹시 좀 전에 피아노 쳤어?” 나는 천진하게 말했다. “아닌데요.” 주인 남자는 고개를 갸웃거리며 물었다. “친 거 같은데……?” 나는 다시 아니라고 했다. 주인 남자는 의심스러운 표정을 짓다가, 내가 곰팡이 얘길 꺼내자 “지하는 원래 그렇다.”고 말한  뒤, 서둘러 2층으로 올라갔다. 나는 방으로 돌아와 피아노 옆에 기대어 앉았다. 그런 뒤 무심코 휴대 전화 폴더를 열었다. 휴대  전화는 번호마다 고유한 음이 있어 단순한 연주가 가능했다. 1번은 도, 2번은 레, 높은음은 별표나 영을 함께 누르면 되는 식이 었다. 더듬더듬 버튼을 눌렀다. 미 솔미 레도시도 파, 미 솔미 레도시도 레레레 미……. ‘원래 그렇다.’는 말 같은 거, 왠지 나쁘 다는 생각이 들었다. 저녁부터 폭우가 내렸다. 언니는 아르바이트 때문에 늦는다고 했다. 벌써 퇴근했어야 하는 시간인데 정산을 잘못한 모양이었 다. 언니는 계산서를 처음부터 끝까지 살펴본 뒤, 안 맞을 경우 다시 계산기를 두드리고, 같은 일을 반복하며 밤을 새울 터였다.  나는 만두라면을 먹으며 연속극을 보고 있었다. 볼륨을 한껏 높였는데도 배우들의 목소리가 잘 들리지 않았다. 리모컨을 잡으 니 뭔가 축축한 게 만져졌다. 한참 손바닥을 들여다본 후에야 그것이 빗물이란 걸 깨달았다. 나는 화들짝 자리에서 일어났다.  현관에서부터 물이 새고 있었다. 이물질이 잔뜩 섞인 새까만 빗물이었다. 그것은 벽지를 더럽히며 창틀 아래로 흘러내렸다. 벽 면은 검은 눈물을 뚝뚝 흘리는 누군가의 얼굴 같았다. 허둥지둥 언니에게 전화를 걸었다. 언니는 한참 만에 전화를 받았다. 언 니는 의외로 담담했다. 언니는 그런 적이 몇 번 있다고, 걸레로 닦아 내면 괜찮을 거라고 말한 뒤 바쁜 듯 전화를 끊었다. 언니 가 그렇게 말해주니, 섭섭하면서도 안심이 되는 기분이었다. 나는 멍하니 서 있다, 양말을 벗고 바지를 걷어 올렸다. 현관 앞  신발들을 모두 신발장 안에 넣고, 컴퓨터와 티브이 등 가전제품의 콘센트를 뽑았다. 피아노 주위엔 마른 수건 몇 장을 단단히  둘러 놓았다. 방바닥에 고인 물은 걸레로 훔쳐 내면 될 일이었다. 나는 걸레로 바닥을 닦은 뒤 세숫대야에 물을 짜내고 훔쳐  내는 일을 반복했다. 구정물은 화장실에 버리고, 마른 수건으로 한 번 더 물기를 없앴다. 순서대로 일을 처리하다 보니 언니 말 대로 별일 아닌 것처럼 느껴졌다. 조금쯤 내가 어른이 된 것 같은 기분도 들었다. 한바탕 집 안을 정리하고 숨을 돌리며 허리를  폈다. 그리고 상쾌한 표정으로 주위를 둘러봤다. 조금 전 물기를 닦아 낸 곳에 다시 빗물이 고여 있었다. 아까보다 더 많은 양이 었다. 나는 하얗게 질려 언니에게 전화했다. “언니.”\n\n[읽기 중 활동 6] 주인 남자가 “지하는 원래 그렇다.”라고 말하며, 서둘러 2층으로 올라간 이유가 무엇일지 짐작해 보자.","notes":[],"kind":"교과서"},{"id":"book92","group":"dodo","page":92,"title":"교과서 92쪽","text":"언니가 주위 눈치를 보는 듯 조그맣게 대꾸했다. “왜?” 나는 울먹이며 말했다. “비 와.” 언니가 한숨을 쉬며 답했다. “그래, 아까도 말했잖아.” 나는 아이처럼 훌쩍였다. “응, 근데 자꾸 와.” 언니는 조용히 나를 타이르며 집으로 갈 테니, 그때까지만 참으라고 했다. “언제 올 건데?” 언니는 모르겠다고, 하지만 곧 가겠다는 말만 반복했다. 나는 전화를 끊고 손등으로 눈물을 훔쳤다. 물은 발등까지 차올랐다.  빗물에서 매캐하고 비릿한 도시 냄새가 났다. 주인집에 도움을 청할까 싶었지만, 너무 늦은 시간이었다. 어쨌든 다시 일을 시작 해야 했다. 우선 컴퓨터 전선을 한데 묶어 서랍장 위에 올려놓았다. 그리고 쓰레받기를 이용해 빗물을 퍼내기 시작했다. 물은  계단과 창문을 타고 자꾸자꾸 들어왔다. 안 되겠다 싶어 쓰레받기 대신 바가지를 이용했다. 내 손은 기계적으로 움직이고 있었 다. 온몸에 땀인지 빗물인지 모를 것이 흘러내렸다. 밖에선 천둥소리가 났다. 무모한 일을 하는 것 같아 힘이\n\n[읽기 중 활동 7] ‘나’가 빗물에서 ‘매캐하고 비릿한 도시 냄새’가 난다고 느낀 까닭이 무엇일지 짐작해 보자.","notes":[],"kind":"교과서"},{"id":"book93","group":"dodo","page":93,"title":"교과서 93쪽","text":"빠졌지만, 가만히  있을 수만도 없었다. 방에서 휴대전화 벨소리가 났다. 재빨리 달려가 폴더를 열었다. “언니야?” 전화기 너머, 나직한 목소리가 들려왔다. “아빠야.” 나는 당황했다. 아빠가 우리에게 먼저 전화하는 경우는 드물었다. 나는 이마에 땀을 훔치며 대답했다. “어? 어…….” 아빠는 내게 “잘 지내냐?”고 물었다. 잠시 고민하다 “그렇다.”고 답했다. 말주변이 없는 아빠는 통화할 때마다 늘 같은 말만  물어 왔다. 다음 말은 아마 ‘저녁 먹었냐?’쯤 될 것이다. “저녁 먹었니?” 나는 그렇다고 했다. 아빠는 뜸을 들이다 “뭘 먹었냐?”고 물었다. 나는 시시한 대꾸를 한 뒤 침묵했다. 아빠는 내게 아르바이 트는 잘하고 있는지, 언니는 어떻게 지내는지, 집에는 언제 내려올 건지 물었다. 나는 어색한 듯 예의 바르게 말을 이었다. 침묵 이 흘렀다. 누군가 서둘러 작별 인사를 하거나, 다른 화제를 꺼내야 했다. 아빠가 먼저 입을 열었다. 돈 얘기였다. 도와 달란  말은 없었지만, 도와 달란 말이었다. 나는 한참 동안 아빠 말을 경청했다. 얼추 내 등록금과 맞먹는 돈이었다. 나는 물에 불은  맨발을 방바닥에 비벼 댔다. 그러곤 “어떻게 해 보겠다.”고 한 뒤 전화를 끊었다. 세상은 비 닿는 소리로 가득했다.\n바가지를 든 채 우두커니 서 있는데 밖에서 인기척이 났다. 나는 현관으로 달려가 반갑게 소리쳤다.\n“언니야?”\n웬 그림자 하나가 스윽 나타났다. 무서운 얼굴을 한 사내였다. 나는 뒤로 자빠지며 엉덩방아를 찧었다. 손등 위로 출렁 빗물이 느껴졌다. 사내는 초점 없는 눈으로 나를 바라봤다. 나는 후들후들 떨며 “누구세요?”라고 말했다. 폭우에, 부채에, 겁탈까지 당할 생각을 하니 뭐 이따위 인생이 다 있나 서러워지려는 참이었다. 사내는 나를 노려보다 신발장 옆으로 고꾸라졌다. 그러더니 신발장에 볼을 비비며 중얼거렸다.\n“미영아…….”\n언니의 이름이었다. 나는 그가 언니의 예전 애인이라는 걸 알아챘다. 그는 조그마한 체구에 순한 얼굴을 가지고 있었다. 자세히 보면 조금 귀염성 있는 얼굴이기도 했다. 나는 조심스럽게 사내에게 다가갔다. 그리고 손끝으로 사내의 어깨를 건드렸다. 사내는 도— 하고 울지 않고, 음냐— 하고 뒤척였다.\n“저기요.”\n사내는 꼼짝하지 않았다. 나는 다시 사내를 깨웠다.\n“저기요.”\n사내는 눈을 크게 뜨더니, 멍청하게 나를 바라봤다. 여기가 어딘지, 내가 누군지 모르는 눈치였다.\n“여기 이렇게 계시면 안 돼요. 일어나세요.”\n사내는 빗물에 흠뻑 젖어 있었다. 사내는 고개를 끄덕이며 다시 눈을 감았다. 사내를 옮기고 싶었지만, 곳곳에 물이 흘러 어떻게 해야 할지 몰랐다.\n‘그냥 둘까?’\n사내가 현관 앞에 있으면 물을 퍼낼 수 없었다. 언니에게 전화를 걸까 싶었지만, 눈치를 보며 쉬쉬 말하던 목소리가 떠올랐다. 곧 온다고 했으니까, 오면 다 알아서 할 테니까 사내를 우선 옮겨 놓는 게 좋을 것 같았다. 주위를 살폈다. 피아노 의자가 눈에 들어왔다. 저 위라면 웬만큼 물이 차지 않는 이상 안전할 것 같았다. 사내를 부축해 일으켜 세웠다. 사내는 문어처럼 흐느적거렸다. 어깨에 사내의 팔을 걸치고 한 발 한 발 자\n\n[읽기 중 활동 8] 아빠가 ‘나’에게 전화한 의도가 무엇인지 말해 보자.","notes":[],"kind":"교과서"},{"id":"book95","group":"dodo","page":95,"title":"교과서 95쪽","text":"[94쪽 자료 미제공: 앞 문장을 임의로 복원하지 않음]\n리를 옮겼다. 사내는 무너지고, 쓰러지고, 주저앉았다.\n“아저씨!”\n사내는 고꾸라진 뒤, 차가움에 놀라 부르르 떨다 다시 코를 골았다.\n“저기요!”\n그는 ‘음냐’ 하고 몸을 뒤척였다. 성질이 났지만 그대로 둘 순 없었다.\n물은 정강이까지 올라와 있었다. 책장 아래 칸의 책들은 빗물에 퉁퉁 불어 가고 있었다. 그중에는 언니가 아직 풀지 못한 영어  문제집도 있었다. 나는 가까스로 사내를 옮겨 피아노 의자 위에 누일 수 있었다. 사내는 평온한 표정을 지었다. 몸통이 기역 자 로 꺾여, 발목은 물에 잠긴 채였다. 나는 한숨을 쉰 뒤 사내를 바라봤다. 양 볼이 불그스레한 게 좀 모자라 보였다. 한참 사내의  얼굴을 보고 있자니, 언니가 말한 이 얘기가 떠올랐다. 그러자 나도 사내의 이를 보고 싶다는 마음이 들었다. 신속하게, 잠깐만  보면 괜찮지 않을까 하고. 나는 사내의 입술을 향해 조심스럽게 손을 뻗었다. 그는 자세가 불편한지 돌아 누웠다. 나는 다급히  손을 거두며 스스로를 책망했다. 셋방이 물에 잠겨 가는데 무슨 짓인가 싶었다. 빗물은 어느새 무릎까지 차 있었다. 나는 피아노 가 물에 잠겨가고 있다는 걸 깨달았다. 저대로 두다간 못 쓰게 될 게 분명했다. 순간 ‘쇼바’를 잔뜩 올린 오토바이 한 대가 부르 릉― 가슴을 긁고 가는 기분이 들었다. 오토바이가 일으키는 흙먼지 사이로 수천 개의 만두가 공기방울처럼 떠올랐다 사라졌다.  언니의 영어 교재도, 컴퓨터와 활자 디귿도, 아버지의 전화도, 우리의 여름도 모두 하늘 위로 떠올랐다 톡톡 터져 버렸다. 나는  피아노 뚜껑을 열었다. 깨끗한 건반이 한눈에 들어왔다. 건반 위에 가만 손가락을 얹어 보았다. 엄지는 도, 검지는 레, 중지와  약지는 미 파. 아무 힘도 주지 않았는 데 어떤 음 하나가 긴 소리로 우는 느낌이 들었다. 나는 나도 모르게 손가락에 힘을 주었 다. “도―” 도는 긴 소리를 내며 방 안을 날아다녔다. 나는 레를 짚었다. “레―” 사내가 자세를 틀어 기역 자로 눕는 모습이 보였다. 나는 편안하게 피아노를 연주하기 시작했다. 하나둘 손끝에서 돋아나는  음표들이 눅눅했다. “솔 미 도레 미파솔라솔…….” 물에 잠긴 페달에 뭉텅뭉텅 공기 방울이 새어 나왔다. 음은 천천히 날아올라 어우러졌다 사라졌다. “미미 솔 도라 솔…….” 사내의 몸에서 만두처럼 김이 모락모락 피어났다. 빗줄기는 거세졌다 잦아지길 반복하고, 검은 비가 출렁이는 반지하에서 나 는 피아노를 치고, 발목이 물에 잠긴 채 그는 어떤 꿈을 꾸는지 웃고 있었다. ― 《침이 고인다》\n\n[읽기 중 활동 9] 반지하방에 물이 들어차고, 더는 퍼낼 수 없는 상황에서 ‘나’가 피아노를 연주하는 까닭은 무엇일지 짐작해 보자.\n[작가 소개] 김애란(1980~) 소설가. 저서로 소설집 《달려라, 아비》, 《침이 고인다》, 《비행운》, 《바깥은 여름》, 산문집 《잊기 좋은 이름》 등이 있다.","notes":[],"kind":"교과서"},{"id":"book115","group":"climate","page":115,"title":"교과서 115쪽","text":"제재 2 탈탄소 경쟁력이 국가 경쟁력이 되는 시대 / 홍종호\n\n기후 위기가 심각해지면서 실물 경제와 금융 시장이 요동치고 있습니다. 자본이 기후를 중심으로 움직이는 것이죠. 국제 무역 질서가 기후 대응 기조에 따라 재편되고 있고, 기관 투자자들이 기업의 기후 경영을 투자 결정의 최우선 기준으로 삼고 있습니다. 저는 확신을 갖고 예측합니다. 향후 10년 내 탈탄소 무역 질서가 새로운 국제 무역 규범으로 자리 잡을 것이라고. 그 까닭을 글로벌 기업, 국제 금융 시장, 국가 정책의 관점에서 얘기해 보겠습니다. 이 세 가지를 각각 영어 약자인 ‘RE 100, ESG, CBAM’으로 기억하면 좋습니다.\n먼저 살펴볼 것은 글로벌 기업의 녹색 전환 경영 전략입니다. 세계적인 기업들이 전력의 100%를 재생 에너지로만 공급받겠다는 ‘알이(RE) 100’ 선언을 했는데요. 여기에 가입한 기업은 재생 에너지로 만든 전기만 써서 공장을 가동하고 사무실을 운영할 것을 약속합니다. 이게 끝이 아닙니다. ‘알이(RE) 100’을 주도하는 기업들은 글로벌 공급 사슬로 연결돼 있는 다른 기업들에도 재생 에너지 사용을 요구하고 있습니다. 물건을 납품하려면 재생 에너지로 만든 전기를 사용하라는 것이죠. 앞으로 우리 기업들이 재생 에너지로 만든 전력을 사용하지 않는다면 수출길이 막힐 수도 있다는 뜻입니다.\n이유는 분명합니다. 기후 위기에 적극 대처하지 않은 기업은 글로벌 시장에서 외면당할 것이라는 현실 인식 때문입니다. 탄소 배출을 줄이면서 재생 에너지를 활용하는 기후 경영에 전념하는 기업들을 투자자와 소비자들이 환영한다는 사실을 온몸으로 느끼고 있는 것이죠. 기후 리스크를 기업 경영의 핵심 요소로 포함할 때 궁극적으로 시장에서의 경쟁력을 높일 수 있다는 고도의 전략적 판단을 한 것입니다.\n두 번째로는, 국제 금융 시장이 환경 보전과 사회적 책임과 같은 기업의 비재무적 성과에 주목하고 있습니다. 바로 ‘이에스지(ESG) 투자’입니다. ‘ESG’란 환경(Environmental)·사회(Social)·지배 구조(Governance)를 뜻합니다. 금융 기관\n\n[옆 설명] ‘알이(RE) 100’은 ‘재생 에너지(Renewable Electricity) 100%’의 약자이다.\n[읽기 중 활동 1] 글쓴이가 새로운 국제 무역 규범으로 자리 잡을 것이라고 예상하는 ‘탈탄소 무역 질서’는 무엇인지 정리해 보자.\n[읽기 중 활동 2] 글로벌 기업들이 가입한 ‘알이(RE) 100’ 선언의 내용을 파악해 보자.\n[낱말 풀이]\n실물 경제(實物經濟): 이론이 아닌 실제의 동향으로 나타나는 경제.\n기관 투자자(機關投資者): 투자를 하는 법인이나 은행, 보험 회사, 증권 회사 등의 단체나 기관.","notes":[{"quote":"탈탄소 경쟁력이 국가 경쟁력이 되는 시대","text":"필기: 갈래=논설문. 주제=탈탄소 무역 질서 도입에 대응하는 인식 변화 촉구. 특징=①문답법 사용 ②탈탄소 무역 질서를 세 가지로 체계적으로 제시."},{"quote":"RE 100, ESG, CBAM","text":"필기: 서론. 탈탄소 국제 무역 질서의 3가지 요소. 자본→기후 중심의 투자 전략."},{"quote":"글로벌 공급 사슬","text":"필기: RE100 선언을 하지 않은 기업도 따를 수밖에 없음."},{"quote":"수출길이 막힐 수도","text":"필기: 국제 무역 질서를 따라야 하는 이유."},{"quote":"기후 위기에 적극 대처하지 않은","text":"필기: 기후 대응에 민감하게 대처해야 함."},{"quote":"경쟁력을 높일 수 있다는","text":"필기: 결국 소비자가 기후 대응 기업을 좋아함."}],"kind":"교과서"},{"id":"book116","group":"climate","page":116,"title":"교과서 116쪽","text":"[115쪽에서 이어짐]\n이 투자를 결정할 때, 탄소 줄이기에 최선을 다하고, 아동 노동과 같은 사회적 불의에 타협하지 않으며, 투명하고 책임성 있는 경영을 하는 기업에 투자하겠다는 의미입니다. 반대로 그렇지 않은 기업에는 투자하지 않거나, 투자한 자금을 회수하겠다는 것이고요.\n국제 금융 시장이 왜 이런 변화를 주도하고 있을까요? 기후 위기에 대한 도덕적 책무 때문일까요? 물론 금융 기관과 기업들이 환경이나 지역 주민에 대한 사회적 책임을 고려했을 수 있습니다. 하지만 더 중요한 것은, 수많은 소비자와 투자자의 선호와 가치, 의사 결정 기준이 달라지고 있다는 데 있습니다. 이들은 당면한 기후 위기를 극복하기 위한 경영 혁신에 최선을 다하는 기업, 탈탄소 경쟁력을 기준으로 기업 실적과 성장 가능성을 평가하고 투자하는 금융 기관에 눈을 돌리고 있습니다. 탄소를 많이 배출하는 기업에서는 물건을 사지도 않고, 돈을 투자하지도 않겠다는 의지를 실천에 옮기고 있는 것이죠.\n마지막으로, 제품을 수입할 때 국가 간 탄소 비용의 차이를 조정하겠다는 정책 흐름이 구체화되고 있습니다. 국제 무역 질서 자체를 탈탄소를 기준으로 재정립하겠다는 것인데요, 유럽 연합이 주도하고 있는 ‘탄소 국경 조정 제도(CBAM)’입니다. 유럽 내에서 생산되는 제품에 포함된 탄소 비용과 유럽 밖에서 유럽 연합에 수출하려는 제품에 매겨져 있는 탄소 비용의 차이를 조정하겠다는 의지입니다.\n탄소 국경 조정 제도가 도입되면 어떤 일이 일어날까요? 우리나라 철강 산업의 수출 물량 11%가 유럽 연합을 향하고 있는데요, 여기에 탄소 국경 조정 제도가 도입되면 수출에 부정적인 영향을 미칠 가능성이 높습니다. 탄소 비용의 국가 간 차\n\n[읽기 중 활동 3] 국제 금융 시장이 이에스지(ESG) 투자를 주도하는 이유를 정리해 보자.","notes":[{"quote":"탄소 줄이기에 최선을","text":"ESG의 E=환경, 아동 노동 등 사회적 불의 거부는 S=사회, 투명하고 책임성 있는 경영은 G=지배 구조로 대응한 필기."},{"quote":"국제 금융 시장이 왜","text":"필기: 문답법."},{"quote":"선호와 가치, 의사 결정 기준이 달라지고","text":"필기: 소비자·투자자 인식 변화."},{"quote":"탄소 비용","text":"필기: 온실가스 배출→비용 부과."},{"quote":"차이를 조정하겠다는 의지","text":"필기: CBAM의 취지."}],"kind":"교과서"},{"id":"book117","group":"climate","page":117,"title":"교과서 117쪽","text":"[116쪽에서 이어짐]\n액을 지불해야 하는 만큼 당장 수출 단가가 올라가기 때문이죠. 우리나라가 탄소 국경 조정 제도에 선제적으로 대응하지 않는다면, 이는 기후 문제를 넘어 한국 경제에 충격으로 다가올 수 있습니다. 최근에는 미국, 캐나다, 일본도 탄소 국경 조정 제도를 찬성하거나 도입하려는 움직임을 보이고 있습니다.\n선진국들의 기후 위기 대응책을 보니 어떠시나요? 과거에는 기업이 환경 보전 기술과 설비에 투자하면 원가 상승으로 경쟁력을 잃는다고 생각했습니다. 그래서 기업들은 정부의 환경 규제를 매우 못마땅하게 여겼죠. 하지만 기후 변화 시대, 이제는 경제가 돌아가는 근본 원리가 바뀌고 있습니다. 부가 가치나 에너지 소비량 대비 탄소를 얼마나 적게 배출하는가를 측정하는 탈탄소 경쟁력이 기업 경쟁력의 핵심 요소로 떠올랐으니까요. 탈탄소 경쟁력이 곧 산업의 기후 경쟁력이고, 이것이 모여 국가 경쟁력을 가늠하는 시대가 된 것입니다.\n이제 우리나라로 눈을 돌려 보겠습니다. 한국은 아직 갈 길이 멉니다. 한국 정부가 제대로 대응하지 않는다면 우리나라는 기후 변화에 따른 피해에 더 크게 노출될 뿐만 아니라, 기후 정책에 소극적이라는 비판에 부딪히면서 외교적으로도 고립될 가능성이 있습니다. 무엇보다 ‘RE 100, ESG, CBAM’의 삼각 파고 속에 경제가 매우 어려운 상황으로 빠져들게 될 것입니다.\n솔직히 말씀드리면 대한민국에는 선택의 여지가 없습니다. 탈탄소 국가를 향해 나아갈 것인가, 말 것인가를 선택할 수 있는 상황이 아닙니다. 이미 방향은 정해졌고, 여기에 우리나라가 얼마나 기민하게 대처하느냐의 문제만 남은 것이죠. 우리 경제 주체들의 인식과 행동 변화가 필요한 시점입니다.\n— 《기후 위기 부의 대전환》\n\n[읽기 중 활동 4] 글쓴이가 기업과 국가 경쟁력의 핵심으로 언급한 것은 무엇인지 정리해 보자.\n[낱말 풀이] 파고(波高): 물결의 높이. 어떤 관계에서의 긴장의 정도를 비유적으로 이르는 말.","notes":[{"quote":"수출 단가가 올라가기","text":"필기 예시(실제 세율 자료 아님): 우리나라 탄소 배출량 1t당 탄소세10원, 유럽20원→차액10원을 유럽에 징수[납부]하거나 한국 자체 세금을20원으로 올림. 세수 방어와 국내 기업 탈탄소 설비 투자→탄소 배출량↓→기업 탄소세↓. 우리나라 탄소 비용 적게 부과/유럽 높게 부과."},{"quote":"선진국들의 기후 위기 대응책","text":"필기: 본론. 환경 투자 이유와 과거/현재 인식의 변화."},{"quote":"부가 가치나 에너지 소비량 대비","text":"필기: 탈탄소 경쟁력의 개념."},{"quote":"외교적으로도 고립될 가능성","text":"필기: 탈탄소 국제 무역 질서에 따라가야 함."},{"quote":"인식과 행동 변화","text":"필기: 결론."}],"kind":"교과서"},{"id":"book118","group":"climate","page":118,"title":"교과서 118쪽","text":"[활동 안내]\n읽기 목적을 생각하며 두 편의 글의 내용과 관점을 비교해 봅니다. 그리고 관점과 형식이 다른 글이나 자료를 더 찾아본 후, 기후 위기라는 화제에 대한 자신의 생각과 관점을 정리해 봅니다.\n1 다음 읽기 목적을 생각하며 글의 내용을 정리해 보자.\n읽기 목적: 기후 위기의 심각성을 이해하고 대응 방법 모색하기.\n[도움말] 읽기 목적을 구체적으로 설정하면 자신이 원하는 정보를 더 효율적으로 파악할 수 있습니다.\n(1) 제재1 <더워진 지구에서 가장 위험한 건 무엇일까?>에서 제시한 기후 변화로 나타나는 문제점과 기후 위기 대응 방법을 정리해 보자.\n* 기후 변화로 나타나는 문제점: [빈칸]\n* 기후 위기 대응 방법 — 탈탄소 문명 만들기\n①화석 연료 사용 줄이기 ②[빈칸] ③[빈칸] ④자연 생태계 회복 ⑤기후 변화를 감시하고 대응하는 역량 높이기 ⑥[빈칸]\n→구체적인 이행 계획을 세우고 점검 및 보완하기.\n(2) 제재2 <탈탄소 경쟁력이 국가 경쟁력이 되는 시대>에서 제시한 탈탄소 무역 질서가 우리 경제에 미칠 영향과 그에 따른 대응 방법을 정리해 보자.\n탈탄소 무역 질서 | 우리 경제에 미칠 영향\n알이(RE)100 | [빈칸]\n이에스지(ESG)투자 | 금융 기관이 사회적 책임을 다하지 않는 기업에 투자하지 않을 수 있다.\n탄소 국경 조정 제도 | [빈칸]\n* 국가 경쟁력을 갖추기 위한 방법: [빈칸]","notes":[{"quote":"기후 변화로 나타나는 문제점","text":"작성된 답: 극한 기후 & 악기상, 자연재해, 환경오염. 제재1 원문은 제공 자료에 없으므로 활동지에 적힌 답으로만 수록함."},{"quote":"②[빈칸]","text":"작성된 답: 재생 에너지 상용화."},{"quote":"③[빈칸]","text":"작성된 답: 산업 방식 바꾸기."},{"quote":"⑥[빈칸]","text":"작성된 답: 육류 소비↓→공장식 방식을 줄임."},{"quote":"알이(RE)100 | [빈칸]","text":"작성된 답: 재생 에너지 사용X→수출X. 본문에서는 “수출길이 막힐 수도 있다”는 가능성으로 서술됨."},{"quote":"탄소 국경 조정 제도 | [빈칸]","text":"작성된 답: 수출 단가(탄소세 비용↑)↑→부정적 영향→대처 필요."},{"quote":"국가 경쟁력을 갖추기 위한 방법","text":"작성된 답: 탈탄소 무역 질서 인식 & 개선."}],"kind":"교과서"},{"id":"book153","group":"language","page":153,"title":"교과서 153쪽","text":"[알아 두기]\n1 언어의 역사성\n언어는 시간이 흐르면서 변화한다. 오늘날 우리가 사용하는 국어도 여러 측면에서 변화해 왔다. 단어의 소리나 표기가 달라지기도 하고, 의미나 문법 요소에 변화가 생기기도 한다. 이처럼 언어가 시간의 흐름에 따라 변화하는 특성을 언어의 역사성이라고 한다.\n2 국어의 역사\n일반적으로 신라 말까지의 국어를 고대 국어라 하고, 고려 건국부터 16세기 말까지의 국어를 중세 국어라 한다. 중세 국어는 1443년 한글 창제를 기점으로 전기 중세 국어와 후기 중세 국어로 구분하는데, 한글이 창제되면서 국어 생활의 모습이 이전과 크게 달라진다. 17세기부터 19세기까지의 국어를 근대 국어, 그 후 오늘날까지의 국어를 현대 국어라 한다.\n3 국어 문화 발전에 참여하는 태도\n국어 문화 발전을 위해서는 국어를 바르게 사용하려는 노력을 해야 한다. 한글 맞춤법이나 표준어 규정과 같은 어문 규범을 잘 지키고, 외래어보다는 고유어를 살려 쓰는 습관을 가져야 한다. 국어와 국어 문화에 대해 자긍심을 갖고 국어를 바르고 정확하게 사용할 때 우리의 언어문화도 발전하며 세계 속 한국어의 위상도 함께 높아진다.\n\n[핵심 질문] 우리 말과 글은 어떻게 변화할까?\n[탐구 과정]\n01 <세종어제훈민정음>을 살펴보며 중세 국어와 현대 국어의 차이를 이해한다.\n02 새롭게 형성된 말을 탐구하며 국어가 변화하는 실체임을 이해한다.\n03 고유어의 가치를 발견하고 국어의 소중함을 이해한다.\n04 어려운 외래어나 외국어를 우리말로 다듬으며 우리말을 주체적으로 사용하는 태도를 기른다.\n궁금한 점을 질문 형식으로 적어 봅시다. [메모 빈칸]\n[배운 내용 활용하기]\n언어의 역사성: 언어의 본질에 대한 이해를 바탕으로 하여 국어 생활을 한다. (중학교 <국어>1학년)\n한글 창제의 원리: 한글의 창제 원리를 이해한다. (중학교 <국어>2학년)","notes":[{"quote":"언어의 역사성","text":"필기—언어의 특성: 자의성=말소리와 의미 사이는 필연적이지 않다. 사회성=말소리와 의미가 사회적 약속을 하면 바꿀 수 없다. 역사성=언어는 시간의 흐름에 따라 바뀐다. 창조성=기존의 언어를 활용해 새로운 단어·문장을 만들고 새로운 언어를 만든다."},{"quote":"의미나 문법 요소","text":"필기 예: “놈”은 사람→남자 비하로 의미가 변함. 주격 조사 “가” 등장(중세에는 “이” 계열만 있음). 밑줄 위에 문법 요소의 예로 ‘조사’ 표시."}],"kind":"교과서"},{"id":"book154","group":"language","page":154,"title":"교과서 154쪽","text":"[활동 안내]\n<세종어제훈민정음>에 드러난 중세 국어의 표기, 음운, 어휘가 현대 국어와 어떻게 다른지 알아봅니다. 그리고 오늘날 새롭게 만들어진 말을 조사하며 역동적으로 변화하고 있는 국어의 모습을 확인해 봅니다.\n1 우리말의 역사\n다음은 훈민정음 창제의 뜻을 밝힌 <세종어제훈민정음>이다. 이를 바탕으로 중세 국어와 현대 국어의 차이를 비교하며 국어의 변화 양상을 탐구해 보자.\n[옆 설명] <세종어제훈민정음>: 한문으로 쓴 한글 창제 해설서인 <훈민정음> 가운데 서문 부분을 우리말로 풀어 쓴 것이다. 중세 국어의 특징을 알 수 있는 대표적인 국어사 자료이다.\n\n[원문—옛한글을 유니코드로 전사. 방점은 앞의 ·(1점), :(2점)으로 표현]\n世·솅宗조ᇰ御·ᅌᅥᆼ製·졩訓·훈民민正·졍音ᅙᅳᆷ\n나·랏:말ᄊᆞ·미\n中듕國·귁·에 달·아\n文문字·ᄍᆞᆼ·와·로 서르 ᄉᆞᄆᆞᆺ·디 아·니 ᄒᆞᆯ·ᄊᆡ\n·이런 젼·ᄎᆞ·로 어·린 百·ᄇᆡᆨ姓·셩·이 니르·고·져 ·호ᇙ·배 이·셔·도\nᄆᆞ·ᄎᆞᆷ:내 제 ·ᄠᅳ·들 시·러 펴·디 :몯ᄒᆞᇙ ·노·미 하·니·라\n·내 ·이·ᄅᆞᆯ 爲·윙·ᄒᆞ·야 :어엿·비 너·겨\n·새·로 ·스믈여·듧 字·ᄍᆞᆼ·ᄅᆞᆯ ᄆᆡᇰ·ᄀᆞ·노·니\n:사ᄅᆞᆷ:마·다 :ᄒᆡ·ᅇᅧ :수·ᄫᅵ 니·겨 ·날·로 ·ᄡᅮ·메 便뼌安ᅙᅡᆫ·킈 ᄒᆞ·고·져\nᄒᆞᇙ ᄯᆞᄅᆞ·미니·라\n— 《월인석보(月印釋譜)》, 세조5년(1459년)\n\n[현대어 풀이]\n세종어제훈민정음\n우리나라의 말이\n중국과 달라\n한자와는 서로 통하지 아니하여서\n이런 까닭으로 어리석은 백성이 이르고자 하는 바가 있어도\n마침내 제 뜻을 능히 펴지 못하는 사람이 많다.\n내가 이것을 가엾게 여겨\n새로 스물여덟 글자를 만드니,\n모든 사람으로 하여금 쉬이 익혀서 날마다 씀에 편하게 하고자 할 따름이다.\n\n[낱말 풀이]\n말ᄊᆞ미: 말이. 달아: 달라. ᄉᆞᄆᆞᆺ디: 통하지. 젼ᄎᆞ로: 까닭으로. 어린: 어리석은.\n니르고져: 이르고자, 말하고자. 호ᇙ배 이셔도: 하는 바가 있어도. ᄠᅳ들: 뜻을. 펴디: 펴지, 펼치지.\n노미: 사람이. 어엿비: 불쌍히, 가엾게. ᄆᆡᇰᄀᆞ노니: 만드니. ᄒᆡᅇᅧ: 하여금.\n수ᄫᅵ: 쉬이, 쉽게. ᄡᅮ메: 씀에, 사용함에. ᄯᆞᄅᆞ미니라: 따름이다.","notes":[{"quote":"世·솅宗","text":"필기: 동국정운식 한자음 표기. 초성 옛이응(ㆁ)은 [ŋ] 음가가 있고, 일반 초성 ㅇ은 음가가 없음. 音의 여린히읗(ㆆ) 초성도 동국정운식 표기로 표시함."},{"quote":"나·랏:말ᄊᆞ·미","text":"필기: 관형격 조사 ‘ㅅ’. 관형격에는 유정 명사의 의/ᄋᆡ, 무정 명사·유정 높임의 ㅅ, 특수한 ㅣ가 쓰임. ‘말ᄊᆞ미’는 연철=이어적기(표음적 표기)."},{"quote":"中듕國·귁·에 달·아","text":"필기: 부사격 조사 에/애는 모음 조화에 따르며 여기서는 비교의 부사격. ‘달아’의 ㅇ은 음가가 없음. 주격 조사: 자음 뒤 이, 모음 뒤 ㅣ, ㅣ모음 뒤 ∅."},{"quote":"文문字·ᄍᆞᆼ·와·로","text":"필기: ‘와’는 비교의 부사격 조사(동반·공동과 구별). 서로 다른 대상의 비교임."},{"quote":"ᄉᆞᄆᆞᆺ·디","text":"필기: ᄉᆞᄆᆞᆺ→ᄉᆞᄆᆞᆮ(표음적 표기와 관련). 8종성법 받침=ㄱ·ㄴ·ㄷ·ㄹ·ㅁ·ㅂ·ㅅ·ㆁ. 구개음화가 적용되지 않은 모습."},{"quote":"아·니 ᄒᆞᆯ·ᄊᆡ","text":"필기: ‘-ㄹᄊᆡ’는 종속적 연결 어미(~하므로). 현대에 쓰는 관형사형 어미와 구별."},{"quote":"어·린","text":"필기: 어리석다→나이가 적다(의미 이동)."},{"quote":"니르·고·져","text":"필기: 두음법칙X. ‘-고져’는 연결 어미(의미상 목적), ~바를 말하고자 하더라도."},{"quote":"·호ᇙ·배","text":"필기: 호ᇙ의 ㆆ 뒤 자음은 된소리로 읽는 표시. ᄒᆞ다·ᄒᆞᆫ다와 현대 하다·한다를 대조하고, 호ᇙ의 -오- 관련 형태 분석을 적음. 형태 분석의 일부 글자는 희미하여 확정하지 않음."},{"quote":"제 ·ᄠᅳ·들","text":"필기: 제=관형격, ᄠᅳ들=목적격 조사. 여백 부사격 조사 정리: 애/에(모음 조화, 비교·목적), 예(ㅣ모음 뒤), ᄋᆡ/의(특수한 체언 뒤)."},{"quote":"펴·디 :몯ᄒᆞᇙ","text":"필기: 펴디→펴지에서 구개음화를 대조. 몯ᄒᆞᆯ의 형태도 구개음화X에 연결한 표시."},{"quote":"·노·미 하·니·라","text":"필기: 놈=사람. 의미 축소 표시가 있음. -니-를 객관적 믿음의 선어말 어미로 표시함."},{"quote":"·내 ·이·ᄅᆞᆯ","text":"필기: 내=대명사(여기서는 주격), -ᄅᆞᆯ=목적격 조사. 為윙=동국정운식."},{"quote":":어엿·비","text":"필기: 불쌍하다→예쁘다(의미 이동). 여백 파생 예시 ‘죡ᄒᆞ다’는 형용사 파생 접사 설명."},{"quote":"ᄆᆡᇰ·ᄀᆞ·노·니","text":"필기: 두음법칙X에 관한 표시. 선어말 어미 -오-가 주어1인칭을 강조(‘내가’ 있음). 왼쪽 여백의 먹ᄂᆞ니 예시는 현재·선어말 어미 구분 표시가 있으나 일부 불명확."},{"quote":":수·ᄫᅵ","text":"필기: 수비→쉬이로의 변화를 표시함. 순경음 비읍 ㅸ을 구분."},{"quote":"니·겨","text":"필기: 니기다→익히다 관련 변화, 두음법칙과 연결한 표시."},{"quote":"·ᄡᅮ·메","text":"필기: 명사형 전성 어미 -옴/-움과 명사 파생 접미사 -음/-ᄋᆞᆷ을 비교. ‘ᄡᅮ메’는 쓰는 행위를 명사처럼 나타낸 구성. 예: ᄆᆞᄎᆞᆷ+내→ᄆᆞᄎᆞᆷ내→마침내, ‘ᄆᆞᆾ다(마치다)’에서 유래한 명사."},{"quote":"便뼌安ᅙᅡᆫ·킈","text":"필기: 便安ᄒᆞ+긔→편안킈 형태와 히읗 관련 설명. 킈(ㅢ)는 이중 모음임."},{"quote":"ᄒᆞ·고·져","text":"필기: ~고 싶다/~게 하다의 차이를 사동 표현과 관련하여 적음. 정확한 약칭은 판독이 불확실함. 본문 -고져는 목적·의도 표현."},{"quote":"ᄯᆞᄅᆞ·미니·라","text":"필기: -니-는 객관적 믿음의 선어말 어미. 여백의 어두 자음군 예: ᄇᄃ·ᄇᄉᄃ·ᄉᄀ 계열, 긴장된 발음에 관한 설명. 일부 예시는 글자 판독이 불확실함."}],"kind":"교과서"},{"id":"print1","group":"josin","page":1,"title":"프린트 1쪽","text":"설화\n조신몽(조신의 꿈)\n작자 미상\n  옛날 신라 때, 본조(本朝, 고려) 흥교사(興敎寺)의 장원(莊舍)이 명주(溟州) 날신군(捺新郡, 혹은 내한군이라고도 함)에 \n있었는데, 절에서 승려 조신(調信)을 보내 장원을 관리하게 했다.\n  조신이 장원에 이르러 태수 김흔(金炘) 공의 딸을 보고 깊이 반하여 연모하는 정이 몹시 두터워졌다. 그는 여러 번 \n낙산사 관음보살상 앞에 나아가 남몰래 그녀와 맺어지기를 기도했다. 그러나 몇 년이 지나도록 뜻을 이루지 못하고, 그 \n여인은 다른 사람에게 시집을 가고 말았다. 조신은 다시 불전으로 가 관음보살이 자신의 소원을 들어주지 않은 것을 \n원망하며 저물도록 슬피 울다가 지쳐 잠이 들었다.\n  꿈에 홀연히 김 씨 낭자가 문을 열고 들어와 환하게 웃으며 말했다.\n  \"제가 일찍이 스님의 얼굴을 뵙고 마음속으로 사모하여 잠시도 잊지 못하였는데, 어찌 다른 사람의 아내가 될 뜻이 \n있었겠습니까? 이제 스님과 부부가 되기를 원하여 이렇게 찾아왔습니다.\"\n  조신은 크게 기뻐하며 그녀와 함께 고향으로 돌아갔다. 두 사람이 함께 산 지 40여 년에 자녀 다섯을 두었으나 집안\n은 네 벽뿐으로 가난했고, 쌀독은 자주 비었으며, 명아줏국도 넉넉지 못했다. 마침내 곤궁함이 극에 달해 온 가족을 이\n끌고 사방으로 구걸하며 떠돌아다녔다. 그렇게 10년 동안 누더기 옷을 걸치고 여러 주와 현을 유랑했다.\n  명주 우현령(羽縣嶺)을 지나던 중, 열다섯 살 난 큰아이가 갑자기 굶어 죽어 길가에 묻고 통곡하였다. 남은 네 아이\n를 데리고 명지현(明旨縣)에 이르러 볏짚으로 움막을 짓고 살았다. 부부는 늙고 병든 데다 굶주려 일어날 힘조차 없었\n다. 열 살 난 딸아이가 밥을 얻으러 나갔다가 동네 개에게 물려 아파 울부짖으며 쓰러지니, 부모는 눈물을 흘리며 마주 \n앉아 탄식할 따름이었다.\n  이에 아내가 눈물을 훔치며 말했다.\n  \"처음 당신을 만났을 때는 얼굴도 아름답고 옷차림도 깨끗했으며, 맛있는 음식 하나라도 반드시 나누어 먹으며 수십 \n년간 정이 깊었고 사랑 또한 지극했습니다. 그러나 근년에는 늙고 병들어 굶주림과 추위가 날로 심해지니, 뉘라서 한 \n그릇 밥을 빌려주며 동냥 문턱마다 부끄러움과 수치뿐입니다. 태산 같은 무거운 짐을 견디기 어렵고, 지난날의 기쁨은 \n도리어 근심의 밑천이 되었습니다. 차라리 함께 굶어 죽느니 어찌 서로 헤어져 각자 살길을 도모하지 않겠습니까?\"\n조신이 이 말을 듣고 매우 기뻐하여, 마침내 아이 둘씩을 나누어 데리고 떠나기로 했다. 길을 나누어 헤어지며 서로 손\n을 맞잡고 눈물로 옷깃을 적셨다.\n  이때 문득 잠에서 깨어나니, 꿈이었다. 타다 남은 등불은 가물거리고 먼동이 트고 있었다.\n  자신의 수염과 귀밑머리를 만져보니 모두 눈처럼 하얗게 세어 있었다. 인간 세상의 모든 욕망이 허망하게 느껴졌고, \n백 년의 괴로움과 집착에 대한 마음이 얼음 녹듯, 기와 부서지듯 사라졌다.\n  조신은 관음보살의 거룩한 모습에 부끄러움을 느끼고, 발을 씻은 뒤 우현령에 묻었던 아이의 자리를 파보았다. 그러\n자 그곳에는 돌로 된 미륵불이 묻혀 있었다. 조신은 미륵불을 깨끗이 씻어 인근 절에 모셨으며, 장원 관리직을 그만두\n고 경주로 돌아갔다. 사재를 기울여 ‘정토사(淨土寺)’를 창건하고 백업을 닦았는데, 그 뒤 어떻게 되었는지는 알 수 없\n다.","notes":[{"quote":"설화","text":"빨간 필기: 전설."}],"kind":"프린트"},{"id":"print2","group":"baegun","page":2,"title":"프린트 2쪽","text":"패관문학\n백운소설 (수록 작품 중 한 편)\n이규보\n  시중(侍中) 김부식과 학사(學士) 정지상은 문장으로 당대에 대등하게 이름을 떨쳤으나, 두 사람은 서로 알력(軋轢)이 \n있어 화합하지 못했다. 세상에 전하기를, 일찍이 정지상에게\n   琳宮梵語罷, 天色淨琉璃 (절간에 불경 외는 소리 멎으니, 하늘빛은 맑은 유리 같구나)\n  라는 시구가 있었는데, 김부식이 이를 몹시 좋아하여 자기 시로 삼고자 넘겨달라고 청했으나 정지상이 끝내 허락하\n지 않았다. 후에 정지상은 김부식에게 주살(誅殺)당하여 저승의 귀신(음귀)이 되었다.\n  어느 날 김부식이 봄의 정취를 노래하며 다음과 같이 읊었다.\n  柳色千絲綠, 桃花萬點紅 (버들빛은 일천 가닥 푸르고, 복사꽃은 일만 점 붉구나)\n  그러자 난데없이 공중에서 정지상의 귀신이 나타나 김부식의 뺨을 치며 꾸짖었다.\n  \"천 가닥, 만 점이라니 대체 누가 그것을 세어 보았느냐? 어찌하여 ‘柳色絲絲綠, 桃花點點紅’(버들빛은 가닥가닥 푸\n르고, 복사꽃은 점점이 붉구나)이라 하지 못하는가?“\n  김부식은 이를 몹시 언짢아했다.\n  그 뒤 김부식이 어느 절을 찾아갔다가 우연히 뒷간에 들어갔는데, 정지상의 귀신이 뒤에서 나타나 그의 음낭(고환)을 \n꽉 움켜쥐며 물었다.\n  \"술도 마시지 않았는데 어찌 얼굴이 붉은가?“\n  김부식이 태연하고 천천히 대답했다.\n  \"건너편 언덕의 붉은 단풍잎이 얼굴에 비쳐서 붉은 것이라네.“\n  정지상의 귀신이 더욱 세게 움켜쥐며 물었다.\n  \"이 가죽 주머니는 대체 무슨 물건인가?“\n  김부식은 안색 하나 변하지 않고 말했다.\n  \"네 애비의 알은 무쇠로 만들었더냐?“\n  정지상의 귀신이 더욱 힘껏 쥐어짜니, 김부식은 마침내 뒷간에서 목숨을 잃고 말았다.","notes":[{"quote":"패관문학","text":"빨간 필기: 수집한 내용을 가공."}],"kind":"프린트"},{"id":"print3","group":"gongbang","page":3,"title":"프린트 3쪽","text":"가전체 문학\n공방전\n임춘\n  공방의 자(字)1)는 관지(貫之:꿴다는 뜻)니, 그의 조상은 일찍이 수양산의 굴속에 살았었는데, 일찍 세상으로 나왔지만 \n쓰이지 못했다. 황제(黃帝)2) 때에 최초로 초빙되어 채용되었으나 성질이 강경하여3) 세상 일에 매우 단련되지 못했다4). \n황제가 관상쟁이 신하로 하여금 그의 관상을 보게 하니, 그 신하가 한참 동안 그를 들여다보고는 이렇게 말했다.\n  \"산과 들에 아무렇게나 자란 바탕이라 아무리 씻고 닦고 하여도 쓸 수가 없습니다. 그러나 만일 폐하께서 조정의 신\n하들로 하여금 그를 풀무5) 속에 넣고 녹여서 변화시킨 뒤에 광채를 내게 한다면 본래의 자질이 드러날 것입니다. 임금\n은 신하를 임용하는 데 있어서 이와 같이 그 자질과 됨됨이를 따라 변화도 시키고 키우기도 하는 것이니, 바라건대 폐\n하는 그를 무딘 동(銅)이나 쇠붙이와 같이 취급하지 마십시오.\"\n  드디어 황제가 관상쟁이의 말에 따라 그를 풀무 속에 넣고 변화시킨 결과, 공방은 비로소 세상에 알려지게 되었다. \n그러나 뒷날 난리를 만나 다시 강물 가의 용광로로 옮겨 갔는데 이때부터 그곳에서 살게 되었다.\n…(중략)…\n  공방은 성품이 탐욕스럽고 염치가 없었는데 나라의 재산을 총괄하면서 경중을 저울질하는 것을 좋아했다. 공방은 국\n가를 이롭게 하는 것에는 도자기와 철을 주조하는 것만 있는 것이 아니라면서, 백성들과 함께 조그만 이익을 다투고, \n물가를 올리고 내리고, 곡식을 천대하고, 자신(화폐)을 귀중하게 여겼다. 그리하여 백성으로 하여금 근본을 버리고 말\n단6)의 이익을 추구하게 하여 농사의 중요성을 방해하게 하였다. 그리하여 간관(諫官)7) 등이 그를 비판하는 상소를 올\n렸으나 임금은 이를 받아들이지 않았다.\n  공방은 또 권세 있는 사람의 비위를 잘 맞추어 그들의 집을 마음대로 드나들며 권력을 빙자하여 벼슬을 사고 팔게 \n하니 모든 권력이 그의 손바닥에서 놀아났다. 마침내 공경대부 같은 높은 벼슬아치들도 모두 그에게 고개를 숙이고 아\n첨하게 되었다. …(후략)…\n1) 자: 성인이 된 후 본명을 대신하여 사용한 공식적인 이름. 옛날 사람들은 이름을 함부로 부르지 않는 것이 미덕이었기 때문에 존\n중의 의미로 본명보다는 자를 불렀음. 예) 제갈공명의 본명은 제갈량, 공명은 제갈량의 자이다. 참고로 호(號)는 개인이 자신의 성\n향, 철학, 거주지, 이상 등을 반영하여 지은 별칭.\n2) 황제: 헌원씨. 중국 전설상의 제왕 중 하나로, 곡물 재배, 문자, 음악, 도량형 제정 등 중국 문명의 시조로 추앙됨.\n3) 강경하다: 성격이나 기질이 꿋꿋하고 굳세다.\n4) 세상 일에 단련되지 못했다: 돈이 널리 사용되지 않았음을 의미함.\n5) 풀무: 불을 피울 때에 바람을 일으키는 기구.\n6) 말단: 상업을 의미함. 농경사회에서는 농업이 근본, 상업은 말업이었음.\n7) 간관: 왕의 잘못을 간언하고 백관의 비행을 규탄하던 벼슬아치.","notes":[{"quote":"가전체 문학","text":"빨간 필기: 사물이나 동물을 의인화한 전기."},{"quote":"공방","text":"필기: 돈."}],"kind":"프린트"},{"id":"print4","group":"gimwon","page":4,"title":"프린트 4쪽","text":"고전소설\n김원전(2024학년도 수능 출제)\n작자 미상\n황상과 만조백관이 어찌할 줄 모르더니 좌장군 서경태가 급히 입직군을 동원하여 칼을 들고 내달아 크게 꾸짖길,\n  “이 몹쓸 흉악한 놈아, 어찌 이런 변을 짓느냐?”\n하고 칼을 들어 치니 아귀가 몸을 기울여 피하고 입을 벌려 숨을 들이쉬니 서경태가 날리어 아귀 입으로 들어갔다. \n상이\n보시다가 크게 놀라,\n  “짐이 여러 번 전장을 지내었으되 이런 일은 보도 듣도 못하였으니 제신 중에 뉘 이 짐승을 잡아 짐의 한을 씻으\n리오.”\n  정서장군 한세충이 나와 아뢰길,\n  “소장이 비록 재주 없으나 저것을 베어 황상께 바치리이다.”\n하고 황금투구에 엄신갑을 입고 팔 척 장창을 들고 청룡마를 내달아 외쳐 말하길,\n  “흉적은 목을 늘여 내 칼을 받으라.”\n  아귀가 크게 웃고 말하길,\n  “아까는 내 숨을 들이쉬니 모기 같은 것도 삼켰으니 지금은 숨을 내쉴 것이니 네 눈을 부릅뜨고 자세히 보라.”\n하고 입을 벌려 숨을 내부니 황상과 만조백관이 오 리나 밀려갔다. 아귀가 궁중이 텅 빈 것을 보고 세 공주를 등에 \n업고 돌아갔다.\n  이때 황상이 제신과 함께 정신을 겨우 차려 환궁하시니 세 공주가 다 없었다. 상께 이 연고를 아뢰니 상이 크게 놀\n라 하교하시되,\n  “이런 해괴한 변이 천고에 없으니 경들의 소견이 어떠하뇨?”\n하고 용루를 흘리시니 조정에 모인 여러 신하가 감히 우러러 보지 못하였다.\n  이우영이 아뢰길,\n  “전 좌승상 김규가 지모 넉넉하오니 불러 문의하심이 마땅할까 하나이다.”\n  상이 깨달아 조서를 내려 김규를 부르셨다.\n  이때 승상이 원을 데리고 평안히 지내더니 천만의외에 사관이 조서를 가지고 왔거늘 받자와 본즉,\n  “전임 좌승상에게 부치나니 그 사이 고향에서 무사한가. ⓐ짐은 불행하여 공주를 잃고 종적을 모르니 통한함을 어찌 측량\n하리오. 경에게 옛 벼슬을 다시 내리나니 바삐 올라와 고명한 소견으로 짐의 아득함을 깨닫게 하라.”\n하였다. 승상이 사관을 후대하고 ㉠국변을 물으니 아귀 작란하던 일과 세 공주 잃은 말을 대강 고하니 승상이 못내 슬퍼하\n며 상경하여 사은숙배하니, 상이 보시고,\n  “경이 고향에 돌아감은 짐이 불명한 탓이로다. 국운이 불행하여 세 공주를 일시에 잃었으니 짐의 이 원을 어찌하리오? 경\n의 소견으로 이 일을 도모하면 평생의 한을 풀리로다.”\n  승상이 엎드려 아뢰길,\n  “소신이 자식이 있삽는데 창법 검술이 일세에 무쌍하와 매일 종적 없이 다니옵기 연고를 물으니 철마산에 가 무예를 익\n히다가 일일은 그 산에서 아귀라 하는 짐승을 만나 겨루고 그 뒤를 좇아 바위 구멍으로 들어감을 보았노라 하옵기 과연 허\n언이 아닌가 싶사오니 ⓑ자식을 불러 들으심이 마땅하올까 하나이다.”\n[중략 부분의 줄거리] 원은 황상을 뵙고 원수가 되어 철마산 아귀의 소굴로 들어간다.\n  원수가 백계를 생각하다가 갑자기 깨달아 공주께 아뢰기를,\n  “독한 술을 많이 빚어 좋은 안주를 장만하여야 계교를 베풀리이다.”\n하고, 약속을 정해 여러 여자를 청하여 여차여차하게 계교를 갖추고 기다리라고 하였다.\n  이때 아귀가 원의 칼에 상한 머리 거의 나으니 모든 시녀를 불러 말하기를,\n  ⓒ“내 병이 조금 나았으니 사오 일 후 세상에 나가 남두성을 잡아 죽여 이 원한을 풀리라. 너희는 나를 위하여 마음을\n[A]","notes":[{"quote":"황상과 만조백관","text":"필기: 황상=황제를 높임, 만조백관=모든 관리. 입직군=당직·숙직, 궁 지키는 군인."},{"quote":"제신","text":"필기: 모든 신하."},{"quote":"소장이","text":"필기: 소장·소관·소인 등 자신을 낮춤. 황금투구·엄신갑은 외양 묘사."},{"quote":"모기 같은 것도","text":"필기: 서경태를 지칭."},{"quote":"오 리","text":"필기: 2km."},{"quote":"해괴한 변","text":"필기: 이상한 형태의 변란."},{"quote":"승상","text":"필기: 정승=승상=재상≈총리."},{"quote":"원을 데리고","text":"필기: 아들/김원."},{"quote":"남두성","text":"필기: 남두성→적강 모티프→김원→영웅적 행위. 남두성(생명 관장)과 북두성(죽음 관장)을 대조."}],"kind":"프린트"},{"id":"print5","group":"gimwon","page":5,"title":"프린트 5쪽","text":"위로하라.”\n  여자들이 이 말을 듣고 크게 기뻐하여 각각 술과 성찬을 권하기를,\n  “대왕의 상처가 나으시면 첩 등의 복인가 하나이다. ⓓ수이 차도를 얻사오면 남두성 잡기야 어찌 근심하리오? 주찬을 대\n령 하였사오니 다 드시어 첩 등의 우러르는 마음을 즐겁게 하소서.”\n  아귀가 가져오라 하거늘, 여러 여자가 일시에 한 그릇씩 드리니 아홉 입으로 권하는 대로 먹으니 그 수를 알 수 없었다. \n술이 취하매 여러 여자가 거짓으로 위로하여,\n  “장군은 잠깐 잠을 청하여 아픔을 잊으소서.”\n  아귀가 듣고 잠을 자려하거늘, 막내 공주가 곁에 앉아 말하길,\n  “보검을 놓고 주무소서. 취중에 보검을 한번 휘둘러 치면 잔명이 죄 없이 상할까 하나이다.”\n  아귀가 말하기를,\n  “장수가 잠이 드나 칼을 어찌 손에서 놓으리오마는 혹 실수함이 있을까 하노니 머리맡에 세워 두라.”\n하고 주거늘, 공주가 받아 놓고 잠들기를 기다렸다. 아귀가 깊이 잠들었거늘, 비수를 가지고 협실로 나와 원수에게 잠들었음\n을 이르고 함께 후원에 이르러 큰 기둥을 가리키며,\n  “원수의 칼로 저 기둥을 쳐보소서.”\n  원수가 칼을 들어 기둥을 치니 반쯤 부러졌다. 공주가 크게 놀라 말하기를,\n  “만일 그 칼을 썼더라면 성사도 못하고 도리어 큰 화가 미칠 뻔하였습니다.”\n  아귀가 쓰던 비수로 기둥을 치니 썩은 풀이 베어지는 듯하였다.\n18. [A]의 서술상 특징에 대한 설명으로 가장 적절한 것은?\n① 서술자가 개입하여 인물에 대한 평가를 제시하고 있다.\n② 대화를 통해 인물 간의 위계나 관계를 보여 주고 있다.\n③ 현재와 과거를 교차하여 장면의 전환을 보여 주고 있다.\n④ 인물의 회상을 통해 인물 간 갈등의 원인을 암시하고 있다.\n⑤ 상황에 대한 인물의 반응을 과장되게 서술하여 사건의 비극성을 완화하고 있다.\n19. ㉠과 관련하여 윗글을 이해한 내용으로 적절하지 않은 것은?\n① 황상은 ㉠의 심각성을 이전의 ‘전장’과 비교하고, 그때의 경험에 근거하여 ㉠에 대한 대처 방안을 찾아낸다.\n② 이우영은 ㉠의 해결을 위해 ‘조정’에서 황상의 질문에답하며 ㉠에 대처할 방안을 찾아 줄 지모 있는 인물을 거명한다.\n③ 황상은 ㉠의 여파가 미치지 않은 ‘고향’에서 편안히 지내던 승상에게 ㉠으로 인한 위기 상황을 알린다.\n④ 승상은 ㉠의 원흉인 아귀를 원이 ‘철마산’에서 본 것을 황상에게 아뢰고, ㉠을 해결할 단서를 제공할 인물을 천거한다.\n⑤ 원은 ㉠의 해결 방안을 떠올리고, ‘협실’에서 공주를 만나 ㉠을 해결할 수 있는 기회가 왔음을 알게 된다.\n20. ⓐ～ⓓ에 대한 설명으로 가장 적절한 것은?\n① ⓐ와 ⓑ에서는 상대에 대한 신뢰를 바탕으로, 숨겨 온 사실을 드러내고 있다.\n② ⓑ와 ⓒ에서는 자신의 위세를 드러내어, 상대의 복종을 이끌어 내고 있다.\n③ ⓐ에서는 자신의 감정을 상대에게 드러내고, ⓓ에서는 자신들의 의도를 상대에게 숨기고 있다.\n④ ⓑ에서는 당위를 내세워 상대의 행위를 요구하고, ⓓ에서는 상대의 안위를 우려하여 자제를 요청하고 있다.\n⑤ ⓒ에서는 상대에게 자신의 목표를 위해 행동할 것을 촉구하고, ⓓ에서는 상대의 목표를 위해 행동할 것을 약속하고 있\n다.","notes":[{"quote":"수이","text":"필기: 쉽게, 잘됨."},{"quote":"잔명","text":"필기: 남은 목숨."},{"quote":"18. [A]","text":"표시 답②. 여백: ①편집자적 논평 ③·④역순행적 ⑤해학적."},{"quote":"19. ㉠","text":"정답 표시①. 황상은 과거 전장과 비교했지만 대처 방안을 스스로 찾아낸 것은 아님. ③에 별도 표시가 있으나 정답으로 확정하지 않음."},{"quote":"20. ⓐ","text":"표시 답③. 황상의 감정 표출과 여자들의 의도 은폐를 대비."}],"kind":"프린트"},{"id":"print6","group":"gimwon","page":6,"title":"프린트 6쪽","text":"21. <보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은? [3점]\n< 보 기 >\n  ｢김원전｣은 당대의 보편적 가치인 충군을 주제로, 초월적 능력을 지닌 주인공과 기이한 존재인 적대자의 필연적 대\n결 관계를 보여 준다. 특히 적대자의 압도적 무력에 맞서는 과정에서 인물에 따라, 혹은 인물이 처한 상황에 따라 다른 \n대응 방식을 보여 줌으로써 독자의 흥미를 자극한다.\n① 서경태가 입직군을 동원해 아귀와 맞서고 원수가 계교를 마련해 아귀를 상대하는 데서, 압도적 무력을 지닌 적대자에 대\n응하는 양상이 서로 다름을 알 수 있군.\n② 한세충이 황상의 한을 씻고자 아귀에게 대항하고 승상이 황상의 불행에 슬퍼하며 상경하는 데서, 인물들이 충군의 가치\n를 지키고 있음을 알 수 있군.\n③ 원이 아귀의 머리를 상하게 한 것과 아귀가 남두성인 원에게 원한을 갚겠다고 다짐하는 데서, 주인공과 적대자의 대결이 \n피할 수 없는 것임을 알 수 있군.\n④ 공주가 황상에게는 국운의 불행으로 잃은 대상이지만 원수에게는 약속대로 아귀를 잠들게 하는 인물인 데서, 여성 인물\n이 사건의 피해자이자 해결을 돕는 존재임을 알 수 있군.\n⑤ 일세에 무쌍한 무예를 갖춘 원수가 아귀의 비수로 기둥을 베어 보는 데서, 주인공이 적대자를 처치하기 위해 자신의 계\n획대로 초월적 능력을 시험하고 있음을 알 수 있군.","notes":[{"quote":"21.","text":"표시 답⑤. 기둥 시험은 공주의 제안으로 하며, 원수 자신의 계획대로 초월적 능력을 시험한다는 진술은 부적절."}],"kind":"프린트"},{"id":"print7","group":"jeongeul","page":7,"title":"프린트 7쪽","text":"고전소설\n정을선전(2025학년도 수능 출제)\n작자 미상\n[앞부분의 줄거리] 승상 정을선이 출정한 사이 정렬부인의 모략으로 충렬부인이 옥에 갇히자 시비 금섬이 충렬부인을 피신시키고 자진한\n다. 옥에서 얼굴이 상한 금섬의 시신이 발견되자 왕비는 월매를 문초한다. 전장에서 정을선은 호첩이 전한 편지를 읽는다.\n  원수가 대경하여 호첩을 불러 연고를 물으시고 인하여 중군장에게 분부하시되 ‘나는 집에변이 있어 먼저 가니 중군장은 \n차후에 인솔 하여 오라.’ 하고 밤낮 삼 일만에 득달하니 이때에 왕비의 시비 월매가 종시 토설치 아니하매 매를 많이 맞고 \n여쭈오되\n  “어서 바삐 죽이시면 금섬의 뒤를 쫓아가겠나이다.”\n한데 왕비 크게 노하여 목을 베라 할 즈음에 이때 승상이 필마로 달려오다가 월매 죽이려 하는 거동을 보고 급히 소리를 \n지르며 말에서 내려 이를 구호하매 문왈\n  “충렬부인은어디계시냐?”\n  월매 인사를 모르다가 승상을 보고 방성통곡 왈\n  “승상은 바삐 충렬부인을 살리소서.”\n한데 승상이 급히 문왈\n  “어디계시냐?”\n한데 월매 울며 왈\n  “소인이 걷지 못하오니 어찌 가오리까?”\n한데 급히 종을 불러 월매를 업히고 구덩이를 찾아가 보니 부인이 아기를 안고 있거늘 아기는 잠을 깊이 들었는지라. 승상\n이 통곡 왈\n  “부인은 눈을 떠 나를 보소서.”\n한데 부인이 눈을 떠 보니 승상이 왔거늘 정신 아득하여 인사를 모르다가 겨우 인사를 차려 왈\n  “이것이 꿈인가 생시인가 구년지수의 해 같고 칠년대한의 빗발 같이 바라더니 지금 구덩이에서 만날 줄 알았으리까. 승상\n은 나의 누명을 씻겨 주소서.”\n하며 인사를 모르는지라. 그 참혹한 형상을 어디에 비하리오. 슬픔에 매우 야위어 뼈가 드러나게 되었는지라. 승상이 아기를 \n안아 월매를 주고 부인을 구한 후에 자리를 마련하여 옥석을 구별할새, 왕비전에 뵈온대 왕비 못내 반기시며 사연을 낱낱이 \n이르시되 승상 왈\n  ㉠“이 일은 소자가 이미 아는 바이오니 염려 마옵소서.”\n하며 왈\n  ㉡“처음에 그놈이 충렬부인 방에 간 줄 어찌 알으셨나이까?”\n  왕비 왈\n  “사촌 오라비가 이르기로 알았노라.”\n하신대 승상이 복록을 찾는데 벌써 제 죄를 알고 후원에 올라가 이미 죽었는지라. 하릴없어 옥졸을 잡아들여 엄히 문왈\n  “너희는 어찌 충렬부인 아닌 줄 알았느냐? 바로 아뢰라.”\n하신대 옥졸이 급히 여쭈오되\n  “얼굴이 상하여 아모란 줄 모르오나 손길이 곱지 못하오매 소인 등 소견에 충렬부인이 천하일색이라 하더니 손이 곱지\n아니하더라 하올 제 정렬부인의 시비 금연이 이를 듣고 묻기에 자세히 이르고 부디 다른 데 가서 이 말 말라 당부하옵더니,\n필연 금연의 입을 통해 발설이 된가 하나이다.”\n한데 승상이 금연을 잡아들여 문왈\n  “이 말을 듣고 네게 국문하니 바른대로 고하라.”\n하는 소리가 벼락이 꼭두에 임한 듯하고 궁궐이 뒤집히는 듯하더라. 이때에 정렬부인이 승상의 호통 소리를 듣고 똥을 한 \n무더기를 싸고 자빠졌는지라. 금연이 하릴없어 바로 아뢰나니라 하고 정렬부인 하던 말이며 제가 남복을 하고 충렬부인 침","notes":[{"quote":"신시키고","text":"앞부분 줄거리의 “신시키고” 앞에 ‘피’를 빨간 글자로 보충함. 전사 본문에는 “피신시키고”로 반영."},{"quote":"원수가","text":"필기: 정을선. 정승·재상, 고사(古史)와 관련한 짧은 표시."},{"quote":"종시 토설치","text":"필기: 토설=토로."},{"quote":"관계도","text":"필기 관계도: 정렬부인→모략→충렬부인(구덩이 피신), 정렬부인의 금연, 충렬부인의 금섬(시비, 대신 자살). 정을선은 승상·원수이며 왕비의 소자. 월매(시비)는 충렬부인을 보호. 호첩은 정을선에게 소식을 전함."},{"quote":"필마","text":"필기: 왕비에게 알려 준 사촌 오라비=복록. 필마=혼자 타고 가는 한 필의 말."},{"quote":"구년지수","text":"필기: 9년의 비→해. 칠년대한=7년의 큰 가뭄→비. 직유법, 정을선의 구원에 대한 간절한 바람."},{"quote":"참혹한 형상","text":"필기: 고통을 과장함. 충렬부인을 정을선이 구출함."},{"quote":"복록","text":"필기: 충렬부인을 죄가 있음으로 알려진 [일부 판독 불확실]. 복록은 사건 진상 규명 전에 자진함."},{"quote":"천하일색","text":"필기: 최고의 미인. 시신의 거친 손은 충렬부인이 아님을 추측하는 단서."},{"quote":"똥을 한 무더기를","text":"필기: 정렬부인, 해학."}],"kind":"프린트"},{"id":"print8","group":"jeongeul","page":8,"title":"프린트 8쪽","text":"소로 들어간 말이며 이불 속에 누웠다가 달아난 말이며 정렬부인이 앓는 체하고 누웠사오매 충렬부인이 약으로 구병하며 곁\n에 있으시매 침소로 가라 강권하여 침소로 마지못하여 가시매 복록이 왕비께 참소하던 연유를 낱낱이 아뢴대 왕비 곁에 있\n다가 앙천통곡하시며 왈\n  “내 밝지 못하여 악녀의 꾀에 빠져 충렬부인을 죽이려 하였나니 무슨 면목으로 충렬부인을 보리오.”\n하시며 자결코자 하거늘 승상이 붙들고 울며 왈\n  “모친이 너무 과도히 하시면 소자가 먼저 죽으려 하나이다.”\n  왕비 금침에 누워 일어나지 못하더라. 승상이 정렬부인을 결박하여 땅에 꿇리고 크게 노하여 왈\n  “너는 무엇이 부족하여 충렬부인을 해코자 하느냐. 어찌 일시를 살리리오. 내 임의로는 죽이고 싶으나 황상께 아뢰고 죽\n게 하리라.”\n  하고 상소하니 그 글에 하였으되\n  “대사마 대도독 대원수 정을선은 돈수백배하고 아뢰나니 신이 서융을 쳐 사로잡고, 백성을 진무하고 돌아오려 할 때, 집\n에서 급한 소식을 듣고 군사를 중군장에게 맡기옵고 필마로 올라와 본즉, 정렬부인이 이러이러한 변을 일으켰사오니 세상에\n이러하온 일이 있사오닛가.”\n하고 금연이 흉계를 꾸민 일과 월매가 당하던 고초를 낱낱이 아뢰었다.\n18. ㉠, ㉡과 관련하여 윗글을 이해한 내용으로 적절하지 않은 것은?\n① ㉠을 보니, 호첩에게 물은 ‘연고’의 내용은 왕비가 말한‘사연’의 내용과 관련이 있겠군.\n② ㉠을 보니, 승상이 황상에게 올린 ‘상소’에 들어있는 내용은 ‘이미 아는 바’와 같겠군.\n③ ㉡을 보니, 승상은 ‘사연’의 진상을 밝히는 데에 왕비가 ‘그놈’의 행위를 알게 된 경위가 중요하다고 생각했겠군.\n④ ㉡에 대한 왕비의 대답을 보니, 왕비에게 ‘그놈’의 행위에 대해 제보한 사람이 있었군.\n⑤ ㉡이 제시된 후에 드러난 복록의 상황을 보니, 복록은 자신이 지은 ‘죄’에 대하여 심리적 중압감을 느꼈겠군.\n19. 누명 과 관련한 설명으로 가장 적절한 것은?\n① 누명이 벗겨지면서, 누명을 썼던 인물은 자신의 어리석음을 탓하고 있다.\n② 누명을 쓴 인물의 요청으로 남주인공은 누명을 씌운 인물의 처벌을 유보한다.\n③ 누명의 내용은 누명을 쓴 인물이 남몰래 자신의 처소에서 벗어나 구덩이에 있다는 사실이다.\n④ 누명을 씌우기 위한 계략에는 누명을 쓰는 인물을 특정 장소로 가게 하는 것이 포함되어 있다.\n⑤ 누명이 벗겨지는 계기는 남주인공이 자신의 어머니가 극단적 선택을 하겠다는 것을 만류한 것이다.\n20. <학습 활동>을 수행한 결과로 적절하지 않은 것은?\n< 학습 활동 >\n  ｢정을선전｣은 모략을 중심으로 사건이 전개되므로 인물 간 소통 양상을 파악하는 것이 중요하다. 윗글을 바탕으로 \n인물 간에 나타난 소통의 내용을 정리해 보자.\n인물 A | 인물 B | 소통의 내용\n① 원수 | 중군장 | A가 B에게 군사를 이끌고 가 서융을 사로잡으라고 명령함.\n② 승상 | 월매 | A가 B에게 충렬부인이 있는 곳이 어디인지 물음.\n③ 옥졸 | 금연 | B가 A로부터 옥중 시신의 정체와 관련한 정보를 얻음.\n④ 옥졸 | 승상 | A가 B에게, 금연이 옥중 시신에 대하여 발설했을 것이라는 의혹을 제기함.\n⑤ 금연 | 승상 | B가 A로부터 정렬부인이 거짓으로 앓아 누웠었다는 정보를 얻음.","notes":[{"quote":"악녀","text":"필기: 정렬부인."},{"quote":"너는 무엇이 부족하여","text":"필기: 비판 이유, 시기·질투. 정렬부인=첩, 충렬부인=정실."},{"quote":"18.","text":"표시 답②. 승상이 조사 전에 알던 내용과 조사 후 상소 내용은 동일하다고 할 수 없음."},{"quote":"19.","text":"표시 답④. 충렬부인을 침소로 가게 한 것이 모략에 포함됨."},{"quote":"20.","text":"표시 답①. 서융을 사로잡으라는 새 명령이 아니라 귀환 군사를 인솔하라는 명령."}],"kind":"프린트"},{"id":"print9","group":"jeongeul","page":9,"title":"프린트 9쪽","text":"21. <보기>를 참고하여 윗글을 이해한 내용으로 적절하지 않은 것은? [3점]\n< 보 기 >\n  ｢정을선전｣은 영웅소설과 가정소설의 상투적인 면모가 혼재되어 나타난다. 이를테면, 가정 안팎의 서사는 남주인공을 \n매개로 연결되고, 사건이 선악 구도로 전개되며, 인물의 고난과 감정은 극대화된다. 이 과정에서 일부다처제에서 비롯\n되는 가정 내 갈등이 개인의 인성 문제로 축소된다. 그러면서도 상전의 수족에 불과한 하층의 시비가 능동적인 행위자\n로 등장하거나, 가정과 사회에서 상층인 인물이 희화화된다.\n① 정을선이 황상에게 올린 상소에서, 대원수와 가장으로서의 모습이 드러나는 것으로 보아, 가정 안팎의 사건에 남주인공\n이 두루 관여하고 있음을 알 수 있군.\n② 승상이 충렬부인을 구출하는 장면에서, ‘슬픔에 매우 야위어 뼈가 드러’난 부인의 모습과 ‘통곡’하는 승상의 모습은 인물\n의 고난과 감정이 극대화된 형상임을 알 수 있군.\n③ 왕비가 ‘앙천통곡’하는 장면에서, 충렬부인의 수난이 ‘악녀’의 탓이라는 인식이 드러나면서 일부다처제의 문제가 개인의 \n인성 문제로 축소되고 있음을 알 수 있군.\n④ 월매가 ‘매를’ 맞는 장면에서, 월매는 자신이 모시는 주인에게 죽음을 각오하고 진실을 밝힘으로써 능동적인 행위자를 지\n향하고 있음을 알 수 있군.\n⑤ 정렬부인이 ‘승상의 호통 소리’에 반응하는 장면에서, 가정의 상층 인물이 자신의 위엄이 실추되는 행동을 보이면서 희화\n화되고 있음을 알 수 있군.","notes":[{"quote":"21.","text":"표시 답④. 월매는 죽음을 각오하고 비밀을 지켰음. 진실을 밝혔다고 바꾸면 부적절. 나머지 선지에는 O 표시."}],"kind":"프린트"},{"id":"print10","group":"mask","page":10,"title":"프린트 10쪽","text":"고전 극 갈래 / 가면극 / 작자 미상\n[통영 오광대—제2과장 풍자탈]\n원양반, 다음 양반, 홍백(紅白), 먹탈, 손님, 비뚜르미, 조리중, 말뚝이 순으로 ㉠춤을 추며 등장하여 새면*을 향하여 일 열로 선다.\n원양반: 여러분.\n양반들: 왜요?\n원양반: 오늘 심심한데 말뚝이 요놈이나 불러다가 농담이나 하여 봅시다.\n양반들: 그럽시다.\n원양반: 이놈, 말뚝아.\n말뚝이: 아— 어, 옳소이다.\n원양반: 소년당상 애기 도령님은 좌우로 둘러서서 소 잡아 장고 메고 말 잡아 북 메고 개 잡아 소고 메고 안성맞춤 꽹과리 치고 운봉내기 징 치고 떡 치고 술 걸러 차려 놓고, 홍문연 높은 잔치 항우장사 칼춤 출 때 이내 마음이 심란하여 초당에 비켜 앉아 높은 베개 돋워 베고 고금(古今)의 삶을 곰곰이 생각하니 어따 괴롭고, 운봉 담양으로 귀양 갈 놈 양반의 철통 뒤에서 웅매 깽깽하는 소리 양반이 잠을 이루지 못하여서 이미 시끄럽게 떠드는 것을 금하려고 나온 김에 춤이나 한번 추고 가자. (불림) 처절 철철 철철 철— (굿거리장단에 맞춰 모두 ㉡춤을 춘다.)\n말뚝이: 쉬— 이—. (음악과 춤 멈춘다.) 동정(洞庭)은 광활하고 천봉만학(千峯萬壑)은 그림을 그려 있고, 양유천만사(楊柳千萬絲)는 각유춘풍을 자랑하고 탐화봉접(探花蜂蝶)은 춘풍에 흔들흔들, 별유천지(別有天地)는 비인간(非人間)이로구나. 어디서 말뚝이를 불러 계시는지 말뚝이 문안이요.\n양반들: 음— 에헴!\n— 통영 오광대(2024학년도 수능특강 문학)\n\n[양주 별산대 놀이—제13과장 신할아비와 미얄할미놀이]\n신할아비: (도포를 입고, 볏이 그려진 부채를 들고 등장하여) 웬 사람이 이렇게 흰 차일을 친 듯 많아? 예전에 하던 짓거리나 하여 볼까? (노래로) 아이들아 산대굿을 다 보았느냐? 탈 쓴 팔십 노인 나도 보자. 나도 엊그제는 청춘이더니 홍안백발 늙은이가 되었구나. 쳐다보니 깊고 큰 골짜기와 수많은 봉우리요, 굽어 보니 흰 모래땅이로구나. 흰 구름과 푸른 시냇물이요, 황혼은 유록한데, 적막강산이 여기로구나. (노래를 부르고 나서 한숨을 쉬며) 아— 하—.\n미얄할미: (산대놀이를 구경하며 바스락바스락 소리를 낸다.)\n신할아비: (미얄할미를 보고 깜짝 놀라면서) 그 무엇이 앞에서 곰실곰실 움직이나 했더니 청개구리 밑으로 쉰별이 쫓아다니듯 무엇 하러 늙은 것이 쫓아왔나? 그 모습 대단히 창피하네. 떡동구리, 술, 부등가리 같은 그릇은 다 어떻게 하고 나왔나?\n미얄할미: (지팡이를 번쩍 들어 한 곳을 가리킨다.)\n신할아비: 본래 똑똑하니까 건넛마을 김 동지한테 맡겼어?\n미얄할미: (고개를 끄덕인다.)\n신할아비: 송아지와 개 새끼는 어찌했나? 오! 구장한테 맡겼어?\n미얄할미: (고개를 끄덕인다.)\n신할아비: 원래 모자란 사람은 아니니, 잘 알아서 하였겠지. 하지만 그것도 젊었을 때나 쓸모 있지, 지금은 쓸모가 없어. 자네도 늙고 나도 늙었으니 우리 이별이나 한번 해 볼까?\n미얄할미: (고개를 끄덕인다.)\n신할아비: 아, 이것 보게. 하지 말자 말하지 아니하고 그렇게 하자고 그러네. 할 수 없다. (노래로) 죽어라 죽어라, 제발 덕분에 죽어라. 너 죽으면 나 못 살고, 나 죽은들 너 못 살랴? 제발 덕분에 죽어라. 옥단춘이가 죽었으랴? 제발 덕분에 죽어라. 두 손뼉을 척척 치며, 노란 머리를 박박 뜯고서, 제발 덕분에 죽어라.\n— 양주 별산대 놀이(2019학년도 수능특강 문학)","notes":[{"quote":"가면극","text":"상단 빨간 필기: 양주별산대놀이. 본문 두 갈래를 각각 구별하여 전사함."}],"kind":"프린트"},{"id":"print11","group":"dodo-print","page":11,"title":"프린트 11쪽","text":"현대소설\n도도한 생활\n김애란\n[전략 부분의 줄거리]\n9살인 ‘나’는 시골 동네의 하나뿐인 음악 학원(웅변도 가르침)에서 피아노를 배운다. 실력이 형편 없는 음악 학원 원장 딸의 바이올린 연주\n를 듣거나, 웅변 연습을 하는 아이의 외침을 들으며 때리고 싶다는 충동을 느끼기도 하지만, 대체로 즐겁게 피아노를 배운다.\n(전략)\n만둣집을 했던 엄마가 어떻게 피아노를 가르칠 생각을 했는지 알 수 없다. 욕심이거나 뭔가 강요하려 한 것은 아니었다. 엄마\n는 배움이 짧았고, 자신의 교육적 선택에 늘 자신감을 갖지 못했다. 다만 그때 엄마는 어떤 ‘보통’의 기준들을 따라가고 있었으\n리라. 놀이공원에 가고, 엑스포에 가는 것처럼, 어느 시기에는 어떠어떠한 것을 해야 한다는 풍문들을 말이다. 돌이켜보면 어릴 \n때 엑스포에 가고 박물관에 간 것이 그렇게 재밌었던 것 같지는 않다. 하지만 나를 엑스포에 보내주고, 놀이공원에 함께 가 준 \n엄마에게 고마운 마음이 든다. 누구나 겪는, 평범한 유년의 프로그램 중 하나였을 뿐이지만, 무지한 눈으로 시대의 풍문들에 고\n개 끄덕였을, 김밥을 싸고 관광버스에 올랐을 엄마의 피로한 얼굴이 떠오르는 까닭이다. 이따금 내가 회전목마 위에서 비명을 \n지르는 동안, 한 손으로 얼굴을 가린 채 벤치에 누워 있던 엄마의 모습이 떠오르곤 한다. 신을 벗고 짧은 잠을 청하던 엄마의 \n얼굴은 도―처럼 낮고 고요했던가 그렇지 않았던가. 엄마를 따라 하느라, 피아노 의자 위에 누워 있던 나를 보고, 선생님은 라―\n처럼 놀랐던가 그렇지 않았던가. 일과 중 가장 중요한 일이 ‘엄마 100원만.’인 줄 알았던 때이긴 했지만. 나는 헨델이 없는 헨델\n의 방에서 음악을 했고, 엄마는 베토벤같이 풀린 파마머리를 한 채 귀머거리처럼 만두를 빚었다. 마침 동네에 음악 학원이 생겼\n고, 엄마의 만두가 불티나게 팔리던 시절이라 가능했던 일인지도 모른다.\n엄마는 내게 피아노를 사 줬다. 읍내서부터 먼짓길을 달려온 파란 트럭이 집 앞에 섰을 때, 엄마가 무척 기뻐했던 기억이 난\n다. 세탁기도 냉장고도 아닌 피아노라니. 어쩐지 우리 삶의 질이 한 뼘쯤 세련돼진 것 같았다. 피아노는 노릇한 원목으로 돼, \n학원에 있는 어떤 것보다 좋아 보였다. 원목 위에 양각된 우아한 넝쿨 무늬, 은은한 광택의 금속 페달, 건반 위에 깔린 레드 카\n펫은 또 얼마나 선정적인 빛깔이던지. 그것은 우리집에 있는 가재들과 때깔부터 달랐다. 다만 좀 멋쩍은 것은 피아노가 가정집 \n‘거실’이 아닌, 만두 가게 안에 놓인다는 사실이었다. 우리 가족은 생계와 주거를 한 건물 안에서 해결하고 있었다. 낮에는 방에 \n손님을 들이고, 밤에는 식구들이 이불을 펴고 자는 식으로 말이다. 피아노는 나와 언니가 쓰는 작은방에 놓였다. 안방은 주방\n을, 작은방은 홀을 마주 보고 있었다.\n나는 오후 내 가게에 붙어 피아노를 연주했다. 울림폭을 크게 해 주는 오른쪽 페달을 밟고, 멋을 부려 <소녀의 기도>나 <아\n드린느를 위한 발라드>와 같은 곡을 말이다. 찜통에선 수증기가 푹푹 나고, 홀에서는 장사꾼과 농부들이 흙 묻은 장화를 신은 \n채 우적우적 만두를 씹고 있는 공간에서, 누구라도 만두를 삼키다 말고 울고 가게 만들었을 그런 연주를. 쉽고 아름답지만 촌스\n러워서 누구라도 가게 앞을 지나다 얼굴을 붉히게 만들었을, 그러나 좀 더 정직한 사람이라면 만두 접시를 집어 던지며 ‘다 때\n려치우라 그래!’ 소리쳤을 그런 연주를 말이다. 한번은 연주가 끝난 뒤 박수 소리가 들려 고개를 돌린 적이 있다. 홀에서 웬 백\n인 남자가 손뼉을 치며 “원더풀.”이라 외치고 있었다. 외국인과 나 사이에 어정쩡한 침묵이 흘렀다. 나는 부끄러웠지만 수줍게 \n한마디 했다. 땡큐……. 집 안에선 밀가루 입자가 햇빛을 받으며 분분히 날렸고, 건반을 짚은 손가락 아래론 지문이 하얗게 묻\n어났다.\n학원은 2년 정도 다녔다. 그사이 나는 바이엘 두 권을 떼고, 체르니와 하농에 입문했다. 체르니란 말은 이국에서 불어오는 \n바람 같아서, 돼지 비계나 단무지란 말과는 다른 울림을 주었다. 나는 체르니를 배우고 싶기보단 체르니란 말이 갖고 싶었다. \n(중략)\n[중략 부분의 줄거리]\n‘나’는 중학교에 올라가서는 가끔 악보를 사다가 유행가를 연주하지만 고등학교에 가서는 더 이상 피아노를 치지 않는다. 고3 겨울 방학에 \n‘나’의 집은 아빠가 선 빚보증 때문에 망하고, ‘나’는 그즈음 서울권 대학의 컴퓨터학과에 합격한다.\n엄마는 차압 딱지가 붙기 전, 값나가는 물건을 팔아 버리자고 했다. 아빠와 나는 고개를 끄덕이며 열심히 고가품을 찾아 움직\n였다. 그러나 10분도 지나지 않아 우리는 우리 집서 값나가는 물건이 피아노밖에 없다는 걸 깨달았다. 그것도 팔면 80만 원이","notes":[],"kind":"프린트"},{"id":"print12","group":"dodo-print","page":12,"title":"프린트 12쪽","text":"안 되는 물건이었다. 엄마는 고민하더니, 다시 피아노를 팔지말자고 했다. 나는 손사래를 치며 “나 때문이면 괜찮다.”고 했다. \n피아노를 치지 않은 지 한참 됐고, 진심으로 미련도 없었다. 피아노 위에 올려진 인형들은 말똥말똥한 표정을 짓고 있었다. 모\n두 아빠가 뽑아 온 것이었다. 엄마는 고민하다 피아노는 일단 갖고 있자고 했다.\n“어떻게?”\n엄마가 천천히 입을 열었다. 네가 서울로 갖고 가 주었으면 좋겠다고.\n“…….”\n나는 눈을 둥그렇게 뜨고 말했다.\n“거기 반지하야, 엄마.”\n엄마가 그 사실을 모를 리 없었다. 나는 계속 피아노를 팔자고 설득했다. 사실 그것은 우리에게 아무 쓸모도 없었다. 엄마는 \n그게 무슨 기념비라도 되는 양, “사정이 좋아질지도 모르니까…….” 하고 말끝을 흐렸다. 결국 나는 피아노를 이고 상경해야 했\n다. 내가 집을 떠나던 날, 아빠는 오토바이 ‘쇼바’를 잔뜩 올린 채 도로 위를 달리며 울고 있었다. 아빠는 오토바이 속도가 최절\n정에 다다랐을 때, 앞바퀴를 들며 “얘들아 너흰 절대 보증 서지 마!”라고 오열했고, 비닐하우스 옆에서 머리를 조아리며 속도위\n반 딱지를 뗐다고 했다. 벌금은 고스란히 만두 가게서 일하는 엄마 앞으로 전가됐다. \n(중략)\n[중략 부분의 줄거리]\n‘나’는 피아노를 외삼촌의 트럭에 싣고 언니의 서울 반지하 방에 온다. 피아노를 방으로 옮기던 과정에서 피아노를 떨어뜨려 음이 울린다. \n이로 인해 주인집 눈치를 더 보게 되었고, 결국 관리비를 더 내되 피아노를 절대 치지 말라는 주인의 요구 조건을 수용하고서야 피아노를 방\n으로 옮길 수 있게 된다.\n전문 대학 치기공과를 다니다가 휴학 중인 언니8)는 취업이 잘된다는 말에 서둘러 원서를 쓴 것이 후회된다며 영문과에 편입하고 싶어 한다. \n언니는 헤어진 남자 친구가 만취해 집으로 찾아와 쓰러졌을 때 자기도 모르게 그 사람의 입술을 벌려 이를 보았다는 경험9)을 이야기한다. 반\n지하방에 이불을 펴고 자리에 누운 ‘나’는 창밖을 보며 언니에게 어쩐지 여기가 서울 같지 않다는 말을 한다.\n나는 아르바이트를 시작했다. 인쇄소와 연결돼 학원 교재나 시험지를 만드는 일이었다. 처음엔 커피숍이나 호프집에서 서빙\n을 할 생각이었다. 이제 막 스무 살이 된 내 상식으로 아르바이트란 무릇 그런 것이었다. 그러나 나는 구인 광고란에 적힌 ‘준수\n한 외모’라는 말의 진정한 뜻을 모르고 있었다. 나는 준수할까말까 한 ‘귀여운’ 외모로, 다른 일을 찾아 벼룩 시장을 훑어 나갔\n다. 터무니없이 많은 돈을 준다는 곳과, 믿을 수 없이 적은 돈을 준다는 곳 사이에, A4지 한 장당 1,500원을 주는 곳이 있었다. \n그 돈이 많은 건지 적은 건지는 알 수 없었지만, 워드 작업 정도면 나도 할 수 있을 거라는 생각이 들었다.\n일은 생각만큼 쉽지 않았다. 어깨도 결리고, 눈이 아픈 데다, 타자 치랴, 오탈자 확인하랴, 도표 갖다 붙이랴, 영어에, 한자 \n표기까지 정신이 없었다. 인쇄소에서는 오탈자가 날 경우 돈을 줄 수 없다고 했다. 그곳에선 정해진 시간에 결코 소화할 수 없\n는 양의 일을 주고, 아무렇지 않게 3일 안에 해 달라고 했다. 나는 ‘당장 저만큼이면 얼마 벌 수 있겠다.’란 생각에 덥석 일을 \n안고 와 시뻘게진 눈으로 밤을 새웠다. 언니의 컴퓨터는 디귿 키가 잘 먹지 않아 작업 속도를 떨어트리곤 했다. 나는 신나게 \n손가락을 놀리다 번번이 디귿키 앞에서 멈춰 섰다. 나는 도로 위로 뛰어든 사슴이라도 본 양 디귿만 보면 긴장했고, 그제야 세\n상에 디귿이 들어가는 글자가 얼마나 많은지 깨달으며 한탄해야 했다. 나는 목을 길게 뺀 채 모니터 앞에 붙박여 있었다. 언니\n는 “흑백은 눈에 가장 피로를 많이 주는 색이라던데.”라며 나를 걱정스럽게 바라봤다. 백 년 전 사람들은 상상하지 못할 정도로 \n진보적인 기계 앞에서, 내 등은 네안데르탈인처럼 점점 굽어 갔다.\n8) 아버지의 빚 보증 때문에 집 사정이 어려워진 것도 있고, 무엇보다도 적성에 안 맞음.(취업이 잘 된다는 말에 서둘러 지원서를 썼\n음.) 또한 대학 학습실에서 가스 폭발 사고가 난 후로 두려움이 들었고, (치아 시술 동안 계속 서 있어야 하다 보니) 허리 디스크\n와 기침 때문에 고생도 했다고 함.\n9) 중략된 부분에 “요즘 계급을 나누는 건 집이나 자동차가 아니래. 피부(잡티 없이 깨끗하고 하얀 피부)하고 치아(가지런하고 하얀 \n치아)라더라. 좀 징그럽지 않니? 이빨이 계급을 표시한다는 게(피부과나 치과에서 관리 받을 수 있는 부유한 사람이란 의미).”라\n는 언니의 대사가 있음. 이로 보아 전 남자 친구의 치아를 통해 남자 친구의 계급을 확인하고 싶었던 듯함. \n     아마도 언니는 가난에서 빨리 벗어나고 싶었고, 그 방법 중의 하나가 부유한 남자와의 결혼이었을 수 있음. 그런데 전 남자 친\n구를 만나면서 그를 통해 경제적 계층이 상승할 것이라는 확신을 받지 못했을 수 있음. 이에 그의 치아를 들여다봄으로써 계층이 \n어느 정도 될지 가늠해 본 것으로 보임.\n     정반대의 해석도 가능함. 전 남자 친구의 치아가 너무나 잘 관리된 것을 보고, 언니 자신과는 너무나 다른 세계의 사람임을 확\n인한 후 자신의 초라함 때문에 그와 헤어진 것일 수도 있음.","notes":[],"kind":"프린트"},{"id":"print13","group":"dodo-print","page":13,"title":"프린트 13쪽","text":"언니는 편입 시험을 준비하고 있었다. 언니는 4년제 영문과에 들어가 어학연수도 가고, 취직도 하고 싶다 했다. 나는 ‘재수’\n나 ‘전학’이라는 말과 달리 ‘편입’이란 말은 묘한 빈곤감을 준다고 생각했다. 언니는 “세상에 영어 하나만 돼도 주어지는 기회가 \n얼마나 많은 줄 아느냐.”며 훈수를 뒀다. 나는 언니가 ‘영어 하나만 돼도 주어지는 기회가 많다.’는 걸, 어째서 20대 초반이 다 \n지나서야 깨달은 것일까 의아했다. 언니는 문제집을 잔뜩 안고 와, 단어를 외우고 테이프를 청취했다. 내가 미친 듯이 타이핑을 \n하는 동안, 언니는 피아노 위에 문법책을 펼쳐 놓고 외국어를 웅얼거렸다. 밤마다, 조그마한 불빛이 새어 나오는 이곳 반지하에\n는 타자 소리와, 영어 단어 외우는 소리가 끊이지 않았다. 어느 날 언니는 도저히 이해가 안 된다는 듯 볼펜을 집어던지며 소리\n쳤다.\n“야, ‘미래’가 어떻게 ‘완료’되냐?”\n나는 지층 단면도를 따다 붙이다 말고, 키보드에 머리를 박으며 외쳤다.\n“아! 과학이 제일 싫어!”\n(중략)\n[중략 부분의 줄거리]\n언니는 프랜차이즈 식당에서 식사비를 정산을 하는 아르바이트를 하면서도 새벽마다 학원에 나가 편입 준비를 했고, ‘나’는 언니가 없\n는 동안 집에서 과중한 아르바이트를 하면서 집안 살림도 같이 한다.\n나는 어서 학교에 가고 싶었다. 얼추 한 학기 등록금을 모았고, 무엇보다도 사람들과 관계 맺으며 ‘피로’나 ‘긴장’을 느끼고 \n싶었다. 긴장되는 옷을 입고, 긴장된 표정을 짓고, 평판을 의식하며, 사랑하고, 아첨하고, 농담하고, 험담하고, 계산적이거나 정\n치적인 인간도 한번 돼 보고 싶었다. 나는 누군가에게 좋은 사람일 수도 있고 나쁜 사람일 수도 있지만, 사실 아무것도 될 수 \n없었다. 지금 나를 둘러싸고 있는 것들은 가전제품뿐이었다. 나는 냉장고에게 잘 보이거나, 전기밥통을 헐뜯고 싶지 않았다. 첫 \n월급을 탔을 때 누구를 만나, 어떻게 돈을 써야 할지 몰라 당황했었다. 이대로 아무도 모르게, 아무도 모르는 일만 하다 죽을 \n수는 없다고, 매일 어깨에 의자를 이고 등교하는 아이처럼 평생 아르바이트만 하고 살 순 없다고 생각했다. 가끔은 손가락이 \n나뭇가지처럼 기다랗게 자라나는 꿈을 꾸기도 했다. 나는 손가락만 진화한 인간 타자수가 되어 ‘다음 중 맞는 답을 고르시오.’\n라는 문장을 끊임없이 치고 있었다. 그리고 산더미만 한 문제지를 들고 인쇄소에 찾아가면, 그걸 전부 나더러 풀라는 것이었다. \n나는 건포도를 오물거리며 ‘가을이 얼마 남지 않았으니까.’하고 안도했다. ‘8월에는 동대문에 옷을 사러 가야지. 화장은 언니에\n게 배우고, 아르바이트는 반드시 집 밖에서 하는 걸로 해야겠다.’도 다음엔 레가 오는 것처럼 여름이 끝난 후 반드시 가을이 올 \n것 같았지만, 계절은 느릿느릿 지나가고, 우리의 청춘은 너무 환해서 창백해져 있었다.\n방 안은 눅눅했다. 자판을 치다 주위를 둘러보면, 습기 때문에 자글자글 운 공기가 미역처럼 나풀대며 날아다니는 것 같았다. \n벽지 위론 하나둘 곰팡이 꽃이 피었다. 피아노 뒤의 벽은 상태가 더 심했다. 건반 하나라도 누르면 꼭 그 음의 파동만큼 날아올\n라, 곳곳에 포자를 흩날릴 것 같은 모양이었다. 나는 피아노가 썩을까 봐 걱정이었다. 몇 번 마른걸레로 닦아 봤지만 소용없었\n다. 우선 달력 몇 장을 찢어 피아노 뒷면에 덧대 놓는 수밖에 없었다. 그러다 곧 피아노 건반을 확인해 보고 싶은 마음이 들었\n다. 시골에서부터 이고온 것인데, 이대로 망가지면 억울할 것 같았다. 한날 마음을 먹고 피아노 의자 위에 앉았다. 그런 뒤 두 \n손으로 건반 뚜껑을 들어 올렸다. 손안에 익숙한 무게감이 전해져 왔다. 내가 알고 있는 무게감이었다. 곧 88개의 깨끗한 건반\n이 눈에 들어왔다. 악기는 악기답게 고요했다. 나는 건반 위에 손가락을 얹어 보았다. 손목에 힘을 푼 채 뭔가 부드럽게 감아쥐\n는 모양을 하고. 서늘하고 매끄러운 감촉이 전해졌다. 조금만 힘을 주면 원하는 소리가 날 터였다. 밖에선 공사음이 들려왔다. \n며칠 전부터 주인집을 보수하는 소리였다. 문득 피아노를 치고 싶은 마음이 들었다. 이사 후 처음 있는 일이었다. 그리고 일단 \n그런 마음이 들자, 주체할 수 없는 감정이 솟구쳤다. 한 음 정도는 괜찮지 않을까. 소리는 금방 사라져 아무도 모를 것이다. 나\n는 용기 내어 손가락에 힘을 주었다.\n“도―”\n도는 방 안에 갇힌 나방처럼 긴 선을 그리며 오래오래 날아다녔다. 나는 그 소리가 아름답다고 생각했다. 가슴속 어떤 것이 \n엷게 출렁여 사그라지는 기분이었다. 도는 생각보다 오래 도― 하고 울었다. 나는 한 음이 완전하게 사라지는 느낌을 즐기려 \n눈을 감았다. 밖에서 문 두드리는 소리가 났다. 쿵쿵쿵쿵. 주먹으로 네 번이었다. 나는 얼른 피아노 뚜껑을 덮었다. 다시 쿵쿵 \n소리가 들렸다. 현관문을 열어 보니 주인집 식구들이었다. 체육복을 입은 남자와 그의 아내, 두 아이가 나란히 서 있었다. 사내아","notes":[],"kind":"프린트"},{"id":"print14","group":"dodo-print","page":14,"title":"프린트 14쪽","text":"이는 아빠와, 계집아이는 엄마와 똑 닮아 있었다. 외식이라도 갔다 오는지 그들 모두 입에 이쑤시개를 물고 있었다. 남자가 입을 \n열었다.\n“학생, 혹시 좀 전에 피아노 쳤어?”\n나는 천진하게 말했다.\n“아닌데요.”\n주인 남자는 고개를 갸웃거리며 물었다.\n“친 거 같은데……?”\n나는 다시 아니라고 했다. 주인 남자는 의심스러운 표정을 짓다가, 내가 곰팡이 얘길 꺼내자 “지하는 원래 그렇다.”고 말한 \n뒤, 서둘러 2층으로 올라갔다. 나는 방으로 돌아와 피아노 옆에 기대어 앉았다. 그런 뒤 무심코 휴대 전화 폴더를 열었다. 휴대 \n전화는 번호마다 고유한 음이 있어 단순한 연주가 가능했다. 1번은 도, 2번은 레, 높은음은 별표나 영을 함께 누르면 되는 식이\n었다. 더듬더듬 버튼을 눌렀다. 미 솔미 레도시도 파, 미 솔미 레도시도 레레레 미……. ‘원래 그렇다.’는 말 같은 거, 왠지 나쁘\n다는 생각이 들었다.\n저녁부터 폭우가 내렸다. 언니는 아르바이트 때문에 늦는다고 했다. 벌써 퇴근했어야 하는 시간인데 정산을 잘못한 모양이었\n다. 언니는 계산서를 처음부터 끝까지 살펴본 뒤, 안 맞을 경우 다시 계산기를 두드리고, 같은 일을 반복하며 밤을 새울 터였다. \n나는 만두라면을 먹으며 연속극을 보고 있었다. 볼륨을 한껏 높였는데도 배우들의 목소리가 잘 들리지 않았다. 리모컨을 잡으\n니 뭔가 축축한 게 만져졌다. 한참 손바닥을 들여다본 후에야 그것이 빗물이란 걸 깨달았다. 나는 화들짝 자리에서 일어났다. \n현관에서부터 물이 새고 있었다. 이물질이 잔뜩 섞인 새까만 빗물이었다. 그것은 벽지를 더럽히며 창틀 아래로 흘러내렸다. 벽\n면은 검은 눈물을 뚝뚝 흘리는 누군가의 얼굴 같았다. 허둥지둥 언니에게 전화를 걸었다. 언니는 한참 만에 전화를 받았다. 언\n니는 의외로 담담했다. 언니는 그런 적이 몇 번 있다고, 걸레로 닦아 내면 괜찮을 거라고 말한 뒤 바쁜 듯 전화를 끊었다. 언니\n가 그렇게 말해주니, 섭섭하면서도 안심이 되는 기분이었다. 나는 멍하니 서 있다, 양말을 벗고 바지를 걷어 올렸다. 현관 앞 \n신발들을 모두 신발장 안에 넣고, 컴퓨터와 티브이 등 가전제품의 콘센트를 뽑았다. 피아노 주위엔 마른 수건 몇 장을 단단히 \n둘러 놓았다. 방바닥에 고인 물은 걸레로 훔쳐 내면 될 일이었다. 나는 걸레로 바닥을 닦은 뒤 세숫대야에 물을 짜내고 훔쳐 \n내는 일을 반복했다. 구정물은 화장실에 버리고, 마른 수건으로 한 번 더 물기를 없앴다. 순서대로 일을 처리하다 보니 언니 말\n대로 별일 아닌 것처럼 느껴졌다. 조금쯤 내가 어른이 된 것 같은 기분도 들었다. 한바탕 집 안을 정리하고 숨을 돌리며 허리를 \n폈다. 그리고 상쾌한 표정으로 주위를 둘러봤다. 조금 전 물기를 닦아 낸 곳에 다시 빗물이 고여 있었다. 아까보다 더 많은 양이\n었다. 나는 하얗게 질려 언니에게 전화했다.\n“언니.”\n언니가 주위 눈치를 보는 듯 조그맣게 대꾸했다.\n“왜?”\n나는 울먹이며 말했다.\n“비 와.”\n언니가 한숨을 쉬며 답했다.\n“그래, 아까도 말했잖아.”\n나는 아이처럼 훌쩍였다.\n“응, 근데 자꾸 와.”\n언니는 조용히 나를 타이르며 집으로 갈 테니, 그때까지만 참으라고 했다.\n“언제 올 건데?”\n언니는 모르겠다고, 하지만 곧 가겠다는 말만 반복했다. 나는 전화를 끊고 손등으로 눈물을 훔쳤다. 물은 발등까지 차올랐다. \n빗물에서 매캐하고 비릿한 도시 냄새가 났다. 주인집에 도움을 청할까 싶었지만, 너무 늦은 시간이었다. 어쨌든 다시 일을 시작\n해야 했다. 우선 컴퓨터 전선을 한데 묶어 서랍장 위에 올려놓았다. 그리고 쓰레받기를 이용해 빗물을 퍼내기 시작했다. 물은 \n계단과 창문을 타고 자꾸자꾸 들어왔다. 안 되겠다 싶어 쓰레받기 대신 바가지를 이용했다. 내 손은 기계적으로 움직이고 있었\n다. 온몸에 땀인지 빗물인지 모를 것이 흘러내렸다. 밖에선 천둥소리가 났다. 무모한 일을 하는 것 같아 힘이 빠졌지만, 가만히 \n있을 수만도 없었다. 방에서 휴대전화 벨소리가 났다. 재빨리 달려가 폴더를 열었다.\n“언니야?”","notes":[],"kind":"프린트"},{"id":"print15","group":"dodo-print","page":15,"title":"프린트 15쪽","text":"전화기 너머, 나직한 목소리가 들려왔다.\n“아빠야.”\n나는 당황했다. 아빠가 우리에게 먼저 전화하는 경우는 드물었다. 나는 이마에 땀을 훔치며 대답했다.\n“어? 어…….”\n아빠는 내게 “잘 지내냐?”고 물었다. 잠시 고민하다 “그렇다.”고 답했다. 말주변이 없는 아빠는 통화할 때마다 늘 같은 말만 \n물어 왔다. 다음 말은 아마 ‘저녁 먹었냐?’쯤 될 것이다.\n“저녁 먹었니?”\n나는 그렇다고 했다. 아빠는 뜸을 들이다 “뭘 먹었냐?”고 물었다. 나는 시시한 대꾸를 한 뒤 침묵했다. 아빠는 내게 아르바이\n트는 잘하고 있는지, 언니는 어떻게 지내는지, 집에는 언제 내려올 건지 물었다. 나는 어색한 듯 예의 바르게 말을 이었다. 침묵\n이 흘렀다. 누군가 서둘러 작별 인사를 하거나, 다른 화제를 꺼내야 했다. 아빠가 먼저 입을 열었다. 돈 얘기였다. 도와 달란 \n말은 없었지만, 도와 달란 말이었다. 나는 한참 동안 아빠 말을 경청했다. 얼추 내 등록금과 맞먹는 돈이었다. 나는 물에 불은 \n맨발을 방바닥에 비벼 댔다. 그러곤 “어떻게 해 보겠다.”고 한 뒤 전화를 끊었다. 세상은 비 닿는 소리로 가득했다.\n(중략)\n[중략 부분의 줄거리]\n‘나’가 빗물이 차고 있는 반지하방에서 빗물을 퍼내려 하고 있을 때, 술에 취한 채 반지하방으로 찾아온 언니의 예전 애인 때문에 공포\n심을 갖는다. 그러나 언니의 옛 애인은 신발장 옆으로 고꾸라져 잠이 들고 만다. 그 사람이 현관문을 막고 있기 때문에 빗물을 퍼내지 못\n하게 되자, ‘나’는 그를 피아노 의자로 옮긴다.\n물은 정강이까지 올라와 있었다. 책장 아래 칸의 책들은 빗물에 퉁퉁 불어 가고 있었다. 그중에는 언니가 아직 풀지 못한 영어 \n문제집도 있었다. 나는 가까스로 사내를 옮겨 피아노 의자 위에 누일 수 있었다. 사내는 평온한 표정을 지었다. 몸통이 기역 자\n로 꺾여, 발목은 물에 잠긴 채였다. 나는 한숨을 쉰 뒤 사내를 바라봤다. 양 볼이 불그스레한 게 좀 모자라 보였다. 한참 사내의 \n얼굴을 보고 있자니, 언니가 말한 이 얘기가 떠올랐다. 그러자 나도 사내의 이를 보고 싶다는 마음이 들었다. 신속하게, 잠깐만 \n보면 괜찮지 않을까 하고. 나는 사내의 입술을 향해 조심스럽게 손을 뻗었다. 그는 자세가 불편한지 돌아 누웠다. 나는 다급히 \n손을 거두며 스스로를 책망했다. 셋방이 물에 잠겨 가는데 무슨 짓인가 싶었다. 빗물은 어느새 무릎까지 차 있었다. 나는 피아노\n가 물에 잠겨가고 있다는 걸 깨달았다. 저대로 두다간 못 쓰게 될 게 분명했다. 순간 ‘쇼바’를 잔뜩 올린 오토바이 한 대가 부르\n릉― 가슴을 긁고 가는 기분이 들었다. 오토바이가 일으키는 흙먼지 사이로 수천 개의 만두가 공기방울처럼 떠올랐다 사라졌다. \n언니의 영어 교재도, 컴퓨터와 활자 디귿도, 아버지의 전화도, 우리의 여름도 모두 하늘 위로 떠올랐다 톡톡 터져 버렸다. 나는 \n피아노 뚜껑을 열었다. 깨끗한 건반이 한눈에 들어왔다. 건반 위에 가만 손가락을 얹어 보았다. 엄지는 도, 검지는 레, 중지와 \n약지는 미 파. 아무 힘도 주지 않았는 데 어떤 음 하나가 긴 소리로 우는 느낌이 들었다. 나는 나도 모르게 손가락에 힘을 주었\n다.\n“도―”\n도는 긴 소리를 내며 방 안을 날아다녔다. 나는 레를 짚었다.\n“레―”\n사내가 자세를 틀어 기역 자로 눕는 모습이 보였다. 나는 편안하게 피아노를 연주하기 시작했다. 하나둘 손끝에서 돋아나는 \n음표들이 눅눅했다.\n“솔 미 도레 미파솔라솔…….”\n물에 잠긴 페달에 뭉텅뭉텅 공기 방울이 새어 나왔다. 음은 천천히 날아올라 어우러졌다 사라졌다.\n“미미 솔 도라 솔…….”\n사내의 몸에서 만두처럼 김이 모락모락 피어났다. 빗줄기는 거세졌다 잦아지길 반복하고, 검은 비가 출렁이는 반지하에서 나\n는 피아노를 치고, 발목이 물에 잠긴 채 그는 어떤 꿈을 꾸는지 웃고 있었다.\n― 《침이 고인다》","notes":[],"kind":"프린트"},{"id":"print16","group":"umbrella","page":16,"title":"프린트 16쪽","text":"현대소설\n매우 잘생긴 우산 하나(2022학년도 수능 출제)\n윤흥길\n[24～27] 다음 글을 읽고 물음에 답하시오.\n김달채 씨는 퇴근하기 무섭게 뽀르르 집으로 달려가던 묵은 습관을 버리고 밤늦도록 하릴없이 길거리를 배회하\n면서 시간을 보내는 새로운 습관을 몸에 붙였다. 지하철이나 버스 혹은 공중변소나 포장마차 안에서, 백화점에서 \n사지도 않을 물건을 흥정하거나 정류장에서 토큰 아니면 올림픽복권을 사면서, 그리고 행인에게 담뱃불을 빌거나 \n더욱 과감하게는 파출소에 들어가 경찰관에게 길을 묻는 시늉을 하는 사이에 마주치는 각계각층의 사람들을 상\n대로 달채 씨는 실수를 가장하기도 하고 때로는 또렷한 목적의식을 드러내기도 해 가며 우산의 존재를 알리기 \n위해 갖가지 수단과 방법을 다 동원했다. 그런 다음 상대방의 눈에 과연 우산이 어떻게 비치는지, 그리하여 상대\n방이 우산 임자인 자기를 어떻게 대우하는지 반응을 떠보는 작업을 일삼아 계속해 나갔다. 참으로 긴장과 전율이 \n넘치는 뻐근한 나날들이었다. 구청 호적계장의 직위에 오르기까지 여태껏 전혀 몰랐던 세계가 구청과 자기 집구\n석 바깥에 따로 있음을 그는 우산을 통해서 비로소 실질적으로 체험할 수가 있었다.\n그는 사람들의 반응을 종합해서 몇 가지 결론을 얻어내는 데 성공했다.\n  첫째는, 진짜 무전기에 익숙한 일부 극소수의 사람들을 제외한 거개의 서민들은 의외로 쉽사리 우산에 속아 넘어간\n다는 사실이었다.\n  둘째는, 상대방이 무전기를 지니고 있다고 알아차리는 그 순간부터 사람들의 태도가 확 달라진다는 사실이었다. 일껏 \n하던 이야기를 뚝 그치거나 얼렁뚱땅 말머리를 돌리는 등으로 지은 죄도 없이 공연히 겁부터 집어먹고는 꾀죄죄한 몰\n골의 자기한테 갑자기 저자세로 구는 것이었다. 밤늦도록 수고가 많다면서 한사코 술값을 받지 않으려 하던 어떤 포장\n마찻집 주인의 경우가 단적인 예였다.\n  셋째는, 노골적으로 손에 쥐고 보여 줄 때보다 그냥 뒤꽁무니에 꿰 찬 채 부주의한 몸가짐인 척하면서 웃옷 자락을 \n슬쩍 들어 ㉠케이스의 끝부분만 감질나게 보여 주는 편이 오히려 사람들을 놀라게 하는 데 훨씬 더 효과적이고 반응도 \n민감하다는 사실이었다.\n  김달채 씨는 그러잖아도 짧은 머리를 더욱 짧게 깎았다. 옷차림도 낡은 양복에서 스포티한 잠바 스타일로 개비했는\n가 하면 구청 밖에서는 항상 선글라스를 끼고 다녀 버릇했다. 달채 씨는 그처럼 달라진 모습으로 짬만 생기면 하릴없\n이 길거리를 나다니며 청명한 가을날에 우산을 이용해서 사람들을 떠보는 색다른 취미에 점점 깊숙이 빠져 들어가기 \n시작했다.            (중략)\n  그리 멀지 않은 곳에서 뭔가 벌어지고 있는 중이라고 생각하자 까닭 모를 흥분과 기대감이 그를 사로잡아 버렸다. \n한 건 올리는 정도가 아니라 뭔가 이제껏 맛보지 못한 엄청난 보람을 느끼게 될 일대 사건을 만날 듯싶은 예감 때문이\n었다. 그는 다른 행인들이 종종걸음으로 달아나는 방향과는 정반대 편을 향해 정신없이 달려가기 시작했다.\n  예상했던 그대로의 살벌한 풍경이었다. 깨진 보도블록 조각이나 돌멩이들이 인도와 차도 가릴 것 없이 사방에 흩어\n져 나뒹굴고 있었다. 시커먼 그을음 연기를 피워 올리며 불타는 자동차와 창유리가 박살 난 건물도 보였다. 김달채 씨\n는 주체 못할 지경으로 쏟아지는 눈물 콧물도 돌볼 겨를 없이 여전히 선글라스를 착용한 채 최루 가스에 심하게 오염\n된 지역을 향해 가까이 접근했다. 중무장한 전경대에 의해 도로가 완전 차단되어 더 이상 접근이 불가능해지자 달채 \n씨는 구경꾼들 뒷전에서 작은 키를 한껏 발돋움하고는 시위 현장의 분위기를 살폈다. 어디선가 보이지 않는 저쪽 건물 \n모퉁이에서 어기찬 함성이 아직도 기세를 올리는 중이었다. 사복 경찰관들한테 붙잡혀 끌려오는 학생의 모습이 구경꾼\n들 어깨 너머로 내다보였다. 달채 씨는 저도 모르는 사이에 앞사람들 틈바귀를 비집고 전면으로 썩 나섰다.\n  “이봐요, 거기!”\n  김달채 씨는 창문마다 철망이 쳐진 버스 안으로 학생들을 마구 밀어 넣는 사복들을 향해 느닷없이 목청을 높였다.\n  “아직도 어린애야! 다치지 않게 살살 좀 다뤄!”\n  어디서 그런 용기가 솟아나는지 김달채 씨 자신도 깜짝 놀랄 지경이었다.\n  “당신 뭐야?”\n  옷깃에 비표를 단 사복 차림의 청년 하나가 달려와서 김달채 씨의 가슴을 떼밀었다.\n  “나 이런 사람이오.”\n  김달채 씨는 엉겁결에 잠바 자락 한끝을 슬쩍 들어 뒷주머니에 꿰 찬 우산 케이스를 내보였다. 하지만 상대방 청년\n[A]","notes":[{"quote":"매우 잘생긴 우산 하나","text":"필기: 독일제3단우산(가죽 케이스)."},{"quote":"낡은 습관","text":"필기: 무력한 설움."},{"quote":"토큰","text":"필기: 버스표."},{"quote":"우산","text":"원으로 강조. 어떻게 비치는지·어떻게 대우하는지 밑줄. 권력의 외양에 대한 반응을 실험함."},{"quote":"첫째는","text":"필기: 우산을 무전기로 인식. 거의의 뜻은 대부분."},{"quote":"케이스의 끝부분만","text":"필기: 앞치부 요리, 사법경찰 [첫 말 판독 불확실]. 끝부분이 드러난 무기처럼 보이는 외양을 강조한 표시."},{"quote":"짧은 머리","text":"필기: 요원인 듯한 코디. 짧은 머리·선글라스·잠바 스타일."},{"quote":"(중략)","text":"필기: 김달채=소시민→용감."},{"quote":"시커먼 그을음 연기","text":"불타는 자동차와 살어치는 눈물 콧물에 표시. 눈물 콧물=최루병[최루탄 관련 필기]. 전경대=전투경찰."},{"quote":"수송버스","text":"필기: 수송버스(경찰차, 닭장차). 비표 원 표시."}],"kind":"프린트"},{"id":"print17","group":"umbrella","page":17,"title":"프린트 17쪽","text":"은 그런 물건 따위는 애당초 거들떠볼 생심조차 하지 않았다.\n  “당신도 저 차에 같이 타고 싶어? 여러 소리 말고 빨리 집에나 들어가 봐요!”\n  이른바 닭장차에 어린 학생들과 함께 실리고 싶은 생각은 물론 털끝만큼도 없었다. 옷깃에 비표를 단 청년이 우산을 \n㉡우산 이상의 것으로 보아 주지 않는다면 그건 어쩔 도리 없는 노릇이었다. 김달채 씨는 남의 채마밭에서 무 뽑아 먹\n다 들킨 아이처럼 무르춤한 꼬락서니가 되어 맥없이 돌아설 수밖에 없었다.\n-윤흥길, ｢매우 잘생긴 우산 하나｣\n24. [A]의 서술상 특징으로 가장 적절한 것은?\n① 중심인물이 알지 못하는 사건을 제시해 긴장감을 조성하고 있다.\n② 공간 이동에 따른 인물의 내면 변화를 회상을 통해 제시하고 있다.\n③ 동시적 사건들의 병치로 사건에 대한 서로 다른 관점을 드러내고 있다.\n④ 한 가지의 목적으로 수렴되는 인물의 의도적인 행위들을 나열하고 있다.\n⑤ 상대를 달리하여 벌이는 인물의 행동을 서술하여 점진적으로 심화되는 갈등을 묘사하고 있다.\n25. 윗글의 내용에 대한 이해로 가장 적절한 것은?\n① 거리를 배회하며 새로운 습관을 익히려는 김달채는 생활의 활기를 찾기 위해 비 오는 날을 기다린다.\n② 꾀죄죄한 몰골의 김달채는 사람들이 자신을 무시하는 태도를 변화시키기 위해 무전기를 보여 준다.\n③ 흥미를 느낄 만한 일이 벌어지고 있음을 짐작한 김달채는 달아나는 행인들과 달리 시위 현장으로 향한다.\n④ 시위 진압의 영향으로 고통 받던 김달채는 전경대의 위세에 압도되어 구경꾼들 뒤로 물러선다.\n⑤ 닭장차에 끌려가게 된 김달채는 건물 모퉁이에서 들려오는 함성에 안도감을 느낀다.\n26. ㉠, ㉡에 대한 이해로 적절하지 않은 것은?\n① 김달채는 ㉠을 그 생김새로 인해 ㉡으로 인식하는 사람들이 있다는 사실을 발견한다.\n② 김달채는 사람들로부터 기대하는 반응을 효과적으로 이끌어 낼 수 있는 ㉠의 사용법을 알게 된다.\n③‘일부 극소수의 사람들’에게는 ㉡을 가진 사람으로 보이려는 김달채의 의도가 실현되지 않는다.\n④ 김달채는 ㉡에 익숙하지 않은 ‘거개의 서민들’이 ㉠을 ㉡으로 오인한다고 판단한다.\n⑤‘사복 차림의 청년’은 ㉡에 익숙하여 ㉠을 이용하려는 김달채의 의도를 알아챈다\n27. <보기>를 바탕으로 윗글을 감상한 내용으로 적절하지 않은 것은? [3점]\n< 보  기 >\n  소시민은 자신의 기득권을 지키기 위해 권력관계에 민감하게 반응한다. 권력관계가 형성되기 위해서는 타인의 \n승인이 요구되며, 이로 인해 힘의 우열 관계가 발생한다. 이 작품은 허구적 권력 표지를 통해 타인의 승인을 얻음\n으로써 자신감을 갖게 된 인물이, 승인을 거부하는 타인 앞에서는 소시민적 면모를 드러내는 상황을 그려낸다. 이\n를 통해 상황 논리를 따르는 소시민의 타산적 태도를 비판하고 있다.\n① 김달채가 각계각층 사람들의 반응을 떠보는 것은, 권력이 타인들에게 미치는 영향을 살핀다는 점에서 김달채가 권\n력관계를 의식하는 인물임을 드러내는군.\n② 김달채가 준 술값을 포장마찻집 주인이 받지 않으려는 것은, 권력에 대한 사람들의 태도를 나타낸다는 점에서 권력\n이 인물 간의 우열 관계를 형성하는 요인임을 보여 주는군.\n③ 김달채가 외양에 변화를 준 것은, 타인의 승인을 용이하게 받으려 한다는 점에서 허구적 권력 표지를 이용하는 데 \n더 적극적으로 나서려는 김달채의 의도를 나타내는군.\n④ 김달채가 사복들에게 목청을 높이며 항의하는 것은, 자신도 모르게 용기를 드러냈다는 점에서 승인받은 경험들을 \n통해 얻게 된 김달채의 자신감을 보여 주는군.\n⑤ 김달채가 비표를 단 청년 앞에서 돌아서는 것은, 학생들과 맺은 유대 관계를 단절하여 기득권을 지키려 한다는 점\n에서 상황 논리를 따르는 김달채의 타산적 태도를 드러내는군.","notes":[{"quote":"무르춤한","text":"필기: 멈칫."},{"quote":"비표","text":"필기: 무언[짧은 글자 불확실]. 옷깃 표지가 실제 권력의 승인 표지임."},{"quote":"24.","text":"표시 답④. 인물의 목적에 수렴되는 의도적 행위를 나열."},{"quote":"25.","text":"표시 답③. 현장을 향해 달려가는 행인과 김달채의 행동."},{"quote":"26.","text":"표시 답⑤. 청년이 김달채의 무전기 의도를 알아챘다는 설명은 부적절."},{"quote":"27.","text":"표시 답⑤. 물러서는 것은 연대를 단절해 기득권을 지키려 한다는 판단과 다름. ①~④에는 O 표시."}],"kind":"프린트"},{"id":"print18","group":"obaltan","page":18,"title":"프린트 18쪽","text":"현대소설\n오발탄\n이범선\n[전략 줄거리]\n    계리사10) 사무실 서기인 송철호는 퇴근 시간임에도 퇴근하지 않고 멍하니 앉아 있다. 사환의 독촉으로 퇴근하려고 손\n을 씻는 도중, 물속에 비친 자신의 얼굴을 보며 식구들을 위해 사냥하는 원시인을 연상한다. 자신의 능력으로는 곰, 멧\n돼지, 노루, 꿩 등은 잡을 수 없고, 토끼는 잡을 수 있겠지만 사회에 사냥꾼이 많아 토끼조차 쉽지 않음을 느낀다. 결국 \n누군가 숲속에 버린 어느 짐승의 내장을 주워 오는 자신의 모습을 연상하며 까닭 모를 울분이 끓어오름을 느낀다.\n    송철호의 가족은 해방촌11) 언덕의 허름한 판잣집에서 산다. 7년째 정신병을 앓으며 고향인 북으로 ‘가자’는 어머니12), \n만삭의 아내와 자신의 딸, 양공주로 돈을 벌고 있는 누이동생 명숙, 남동생 영호 등과 살고 있다. 특히 고학으로 대학 \n다니다가 군대에 갔다 온 동생 영호은 취직도 못하고 있으면서 친구들과 어울려서 술을 마시고, 양담배를 피우며, 우리\n집도 근사한 양옥, 비싼 세단 차를 사서 살자고 제안한다.\n(전략)\n \n  \"형님은 절 오해하시고 계셔요.\" \n  \"……?\" \n  \"제가 무슨 돈이 있어서 양담배를 사서 피우겠어요. 어쩌다 친구들이 사주는 것이니 피우는 거지요. 형님은 또 제\n가 거의 저녁마다 술을 마시고 또 제법 합승을 타고 들어오는 것도 못마땅하시죠. 저도 알고 있어요. 형님은 때때로 \n25환 전차값도 없어서 종로서 근 십 리를 집에까지 터덜터덜 걸어서 돌아오시는 것을, 그렇지만 형님이 걸으신다고 \n해서, 한사코 같이 타고 가자는 친구들의 호의, 아니 그건 호의도 채 못 되는 싱거운 수작인지도 모르죠. 어쨌든 그\n것을 굳이 뿌리치고 저마다 걸어야 할 아무 까닭도 없지 않습니까? 이상한 놈들이죠. 술, 담배는 사주고 합승은 태\n워줘도 돈은 안 주거든요.\" \n영호는 손끝으로 뱅글뱅글 비벼 돌리는 담뱃불을 들여다보며 말했다. \n  \"어쨌든 너도 이제 좀 정신 차려 줘야지. 벌써 군대에서 나온 지도 이태나 되지 않니.\" \n  \"정신 차려야죠. 그렇지 않아도 이달 안으로는 어찌 되든 간에 결판을 내고 말 생각입니다.\" \n  \"어디 취직을 해야지.\" \n  \"취직이요? 형님처럼요? 전차값도 안 되는 월급을 받고 남의 살림이나 계산해 주란 말이지요?\" \n  \"그럼 뭐 별 뾰족한 수가 있는 줄 아니.\" \n  \"있지요. 남처럼 용기만 조금 있으면.\" \n  \"……?\" \n어처구니 없는 영호의 수작에 철호는 그저 멍청하니 영호의 얼굴을 쳐다보았다. 손끝이 따가웠다. 철호는 비루13) 깡\n통으로 만든 재떨이에 담배를 비벼 껐다. \n  \"용기?\" \n  \"네. 용기.\" \n  \"용기라니?\" \n  \"적어도 까마귀만한 용기만이라도 말입니다. 영리할 필요는 없더군요. 우둔해도 상관 없어요. 까마귀는 도무지 허\n수아비를 무서워하지 않습니다. 참새처럼 영리하지 못한 탓으로 그놈의 까마귀는 애당초에 허수아비를 무서워할 줄\n조차 모르거든요.\" \n영호의 입가에는 좀 전에 파랑새 꽁초에다 불을 당기는 철호를 바라보던 때와 같은 야릇한 웃음이 또 소리 없이 감\n돌고 있었다. \n  \"너, 설마 무슨 엉뚱한 계획을 세우고 있는 것은 아니겠지.\" \n10) 계리사: 보험 계리에 관한 업무를 전문적으로 처리할 수 있는 법적 자격을 갖춘 사람. 주로 보험료 산출, 배당금 계산 따위\n의 정당성 여부를 확인하는 일을 함. ‘공인 회계사’의 전 용어로도 사용됨.\n11) 해방촌: 광복과 함께 해외에서 돌아온 사람들과 북쪽에서 월남한 사람들, 한국 전쟁으로 인하여 피난을 온 사람들이 남산 밑\n의 언덕에 정착하여 만든 마을. 서울특별시 용산구 용산동 2가 대부분과 용산동 1가 일부가 포함되는 지역.\n12) 어머니는 북한에서 큰 부자는 아니었지만 그래도 꽤 큰 지주로서 풍족한 삶을 살았음. 현재 해방촌에서의 삶과는 매우 대조\n적인 삶이었음. 이에 이렇게 지지리 고생하면서도 고향으로 돌아갈 생각만은 죽어도 하지 않는 아들(철호)을 매우 못마땅하\n게 여기고 있음.\n13) 비루: 맥주. 맥락상 미군 부대에서 유출된 수입 캔맥주 깡통에 담배를 끈 것으로 보임.","notes":[{"quote":"서기인 송철호","text":"원으로 표시. 사환=사장? [옆 메모 한 글자 불확실]. 본문에서는 사환이 퇴근을 재촉하는 심부름 담당자임."},{"quote":"투끼는","text":"필기: 퇴근 전에 정신없는 때=여유가 없는 때. 창밖으로 고개 내미는 모습과 연결."},{"quote":"경색","text":"필기: 정형에 얽매여 굳음."},{"quote":"해방촌","text":"필기: 6·25전쟁의 영향(전후, 유민·피란민 관련 표시). 폭주처럼 살고 있다→상세 표시."},{"quote":"앙상한","text":"필기: 탄압·스트레스를 꾹꾹 눌러 참음[여백 필기 일부 불확실]."},{"quote":"양담배","text":"원 표시. 옆 숫자 메모: 술200환, 양복20~2500환, 담배88=60~100환, 디스=70~100환으로 읽히나 숫자 일부가 불확실하여 암기 정보에서 제외."},{"quote":"결판","text":"필기: 취직X."},{"quote":"용기","text":"필기 대조: 까마귀=영리·출세 / 허수아비=법률·도덕, 무서운 존재. 영리한 참새는 무서워하지 않으나 까마귀만 두려워함."},{"quote":"파랑 껍쪼에다 불을 당기는","text":"필기: 브랜드. 괄호로 전후 반복 행동 표시."}],"kind":"프린트"},{"id":"print19","group":"obaltan","page":19,"title":"프린트 19쪽","text":"철호는 약간 긴장한 얼굴을 하고 영호를 바라보며 꿀꺽하고 침을 삼켰다. \n  \"아니요. 엉뚱하긴 뭐가 엉뚱해요. 그저 우리들도 남처럼 다 벗어 던지고 홀가분한 몸차림으로 달려보자는 것이죠, \n뭐.\" \n  \"벗어 던지고?\" \n  \"네, 벗어던지고 양심이고, 윤리고, 관습이고, 법률이고 다 벗어 던지고 말입니다.\" \n영호의 큰 두 눈이 유난히 빛나는가 하자 철호의 눈을 정면으로 밀고 들었다. \n  \"양심이고, 윤리고, 관습이고, 법률이고?\" \n  \"……\" \n  \"너는, 너는…….\" \n  \"…….\" \n영호는 아무 대답도 하지 않았다. 그러나 눈만은 똑바로 형 철호를 쳐다보고 있었다. \n  \"그렇게나 살자면 이 형도 벌써 잘 살 수 있었다.\" \n철호의 목소리는 떨리고 있었다. \n  \"그렇게나라니요?\" \n  \"양심을 버리고, 윤리와 관습을 무시하고, 법률까지도 범하고!\" \n흥분한 철호의 큰 목소리에 영호는 지금까지 철호의 얼굴에 주었던 시선을 앞으로 죽 뻗치고 앉은 자기의 발끝으로 \n떨구었다. \n  \"저도 형님을 존경하고 있어요. 고생하시는 형님을, 용케 이 고생을 참고 견디는 형님을... 그렇지만 형님은 약한 \n사람이야요. 용기가 없는 거지요. 너무 양심이 강해요. 아니 어쩌면 사람이 약하면 약한 만치, 그만치 반대로 양심이\n란 가시는 여물고 굳어지는 것인지도 모르죠.\" \n  \"양심이란 가시?\" \n  \"네. 가시지요. 양심이란 손끝의 가십니다. 빼어버리면 아무렇지도 않은데 공연히 그냥 두고 건드릴 때마다 깜짝깜\n짝 놀라는 거야요. 윤리요? 그건 나이롱 빤쯔 같은 것이죠. 입으나 마나 불알이 덜렁 비쳐 보이기는 매한가지죠. 관\n습이요? 그건 소녀의 머리 위에 달린 리본이라고나 할까요? 있으면 예쁠 수도 있어요. 그러나 없대서 뭐 별일도 없\n어요. 법률? 그건 마치 허수아비 같은 것입니다. 허수아비. 덜 굳은 바가지에다 되는대로 눈과 코를 그리고 수염만 \n크게 그린 허수아비. 누더기를 걸치고 팔을 쩍 벌리고 서 있는 허수아비. 참새들을 향해서는 그것이 제법 공갈이 되\n지요. 그러나 까마귀쯤만 돼도 벌써 무서워하지 않아요. 아니 무서워하기는커녕 그놈이 상투 끝에 턱 올라 앉아서 \n썩은 흙을 쑤시던 더러운 주둥이를 쓱쓱 문질러도 별일 없거든요. 흥.\" \n(중략)\n  \"저도 형님의 그 생활 태도를 잘 알아요. 가난하더라도 깨끗이 살자는. 그렇지요, 깨끗이 사는 게 좋지요. 그런데 \n형님 하나 깨끗하기 위하여 치르는 식구들의 희생이 너무 어처구니 없이 크고 많단 말입니다. 헐벗고 굶주리고. 형\n님 자신만 해도 그렇죠. 밤낮 쑤시는 충치 하나 처치 못 하시고 이가 쑤시면 치과에 가서 치료를 하거나 빼어버리거\n나 해야 할 거 아니야요. 그런데 형님은 그것을 참고 있어요. 낯을 잔뜩 찌푸리고 참는단 말입니다. 물론 치료비가 \n없으니까 그러는 수밖에 없겠지요. 그겁니다. 바로 그겁니다. 그 돈을 어떻게든가 구해야죠. 이가 쑤시는데 그럼 어\n떻게 해요. 그걸 형님처럼, 마치 이 쑤시는 것을 참고 견디는 그것이 돈을－치료비를 버는 것이기나 한 것처럼 생각\n하는 것. 안 쓰는 것을 혹 버는 셈이라고는 할 수도 있을 거야요. 그렇지만 꼭 써야 할 데 못 쓰는 것이 버는 셈이\n라고는 할 수 없지 않아요. 세상에는 이런 세 층의 사람들이 있다고 봅니다. 즉 돈을 모으기 위해서만으로 필요 이\n상의 돈을 버는 사람과, 필요하니까 그 필요하니 만치의 돈을 버는 사람과 또 하나는 이건 꼭 필요한 돈도 채 못 벌\n고서 그 대신 생활을 졸이는 사람들. 신발에다 발들 맞추는 격으로 형님은 아마 그 맨 끝의 층에 속하겠지요. 필요\n한 돈도 미처 벌지 못하는 사람, 깨끗이 살자니까 그럴 수밖에 없다고 하시겠지요. 그래요. 그것은 깨끗하기는 할지 \n모르죠. 그렇지만 그저 그것뿐이지요. 언제까지나 충치가 쏘아 부은 볼을 싸쥐고 울상일 수밖에 없지요. 그렇지 않\n습니까? 그야 형님! 인생이 저 골목 안에서 십 환짜리를 받고 코 흘리는 어린애들에게 보여 주는 요지경이라면야 \n자기가 가지고 있는 돈값만치 구멍으로 들여다보고 말 수도 있겠지요. 그렇지만 어디 인생이 자기 주머니 속의 돈 \n액수만치만 살고 그만 두고 싶으면 그만둘 수 있는 요지경인가요 어디. 돈 만치만 말 수 있는 그런 편리한 목구멍인\n가요, 어디. 싫어도 살아야 하니까 문제지요. 사실이지 자살을 할 만치 소중한 인생도 아니고요. 살자니까 돈이 필요\n하구요. 필요한 돈이니까 구해야죠. 왜 우리라고 좀더 넓은 테두리, 법률선까지 못 나가란 법이 어디 있어요. 아니 \n남들은 다 벗어던지구 법률선까지도 넘나들면서 사는데, 왜 우리만이 옹색한 양심의 울타리 안에서 숨이 막혀야 해","notes":[{"quote":"양심이란","text":"필기: 간. “속골의 가시”=공통 속성, “공연히”=쓸데."},{"quote":"윤리","text":"나이롱 빤쓰에 대응, “입으나 마나…볼기” 밑줄."},{"quote":"관습","text":"리본에 대응, 소녀 머리 장식에 비유."},{"quote":"법률","text":"허수아비에 대응. 법률·도덕 같은 규범에 얽매인 사람과 그렇지 않은 사람을 대조."},{"quote":"꼭 써야 할 데 못 쓰는 것이","text":"긴 밑줄: 돈의 실용적 가치, 필요한 돈을 벌지 못하는 형의 생활 비판."},{"quote":"돌아보고 말 수도","text":"필기: 만족감. 인생이 주머니 속 돈 액수로 환원될 수 없다는 반론."},{"quote":"돈이 필요하구요","text":"“싫어도 살아야 하니까 문제지요”와 연결하여 밑줄."}],"kind":"프린트"},{"id":"print20","group":"obaltan","page":20,"title":"프린트 20쪽","text":"요. 법률이란 뭐야요. 우리들이 피차에 약속한 선이 아니야요?\" \n  영호는 얼굴을 번쩍 들며 반쯤 끌러놓았던 넥타이를 마저 끌러서 방 구석에 픽 던졌다. 철호는 여전히 턱을 가슴\n에 푹 묻은 채 묵묵히 앉아 두 짝 다 엄지발가락이 몽땅 밖으로 나온 뚫어진 양말을 내려다보고 있었다. 나일론 양\n말을 한 켤레 사면 반년은 무난히 뚫어지지 않고 견딘다는 말은 들었다. 그러나 뻔히 알면서도 번번이 백 환짜리 무\n명 양말을 사들고 들어오는 철호였다. 칠백 환이란 돈을 단번에 잘라낼 여유가 도저히 없는 월급이었던 것이다.\n…(후략)…","notes":[],"kind":"프린트"},{"id":"print21","group":"obaltan-play","page":21,"title":"프린트 21쪽","text":"현대소설\n오발탄(2019학년도 수능 출제)\n이범선\n#68. 산비탈 길\n뚜벅뚜벅 걷고 있는 철호.\n#69. 피난민 수용소 안(회상)\n  담요바지 철호의 아내가 주워 모은 널빤지 조각을 이고 들어와 부엌에 내려놓고 흩어진 머리칼을 치키며 숨을 돌리\n고 있다.\n철호Ⓔ*: 저걸 저토록 고생시킬 줄이야.\n  담요바지 아내의 모습 위에 ―O･L*\n  여학교 교복을 입고 강당에 서서 노래를 부르고 있는 그 시절의 아내. 또 O･L되며 신부 차림의 아내가 노래를 부르\n고 있다. 그 옆에 상기되어 앉아 있는 결혼 피로연 석상의 철호. 노래는 ‘돌아오라 소렌토’.\n#70. 산비탈\n  철호가 멍하니 시가지를 내려다보고 섰다. 황홀에 묻힌 거리.\n#71. 자동차 안\n  해방촌의 골목길을 운전수가 땀을 빼며 빠져나와서 뒤를 돌아보고\n운전수: 손님! 이상 더 올라가지 못하겠는데요.\n영호: 그럼 내립시다. 시시한 동네까지 몰구 오느라고 수고했소. \n  천 환짜리 한 장을 꺼내 준다.\n운전수: (공손히) 감사합니다.\n#72. 철호의 방 안\n철호의 아내가 만삭의 배를 안고 누더기를 꿰매고 있다. 옆에서 콜콜 자고 있는 혜옥.\n영호: (들어오며) 혜옥아!\n(중략)\n#73. 철호의 집 부엌 안\n민호가 팔다 남은 신문을 끼고 들어와 신들메를 끌르며\n민호: 에이 날씨도 꼭 겨울 같네.\n철호Ⓔ: 어쨌든 너도 인젠 정신을 차려야지! 군대에서 나온 지도 이태나 되잖니.\n영호Ⓔ: 정신 차려야죠. 그렇잖아도 금명간 판결이 날 겁니다.\n철호Ⓔ: 어디 취직을 해야지.\n#74. 철호의 집 방 안\n영호: 취직이요. 형님처럼 전차 값도 안 되는 월급을 받고 남의 살림이나 계산해 주란 말에요? 싫습니다.\n철호: 그럼 뭐 뾰죽한 수가 있는 줄 아니?\n영호: 있지요. 남처럼 용기만 조금 있으면.\n철호: 용기?\n영호: 네. 분명히 용기지요.\n철호: 너 설마 엉뚱한 생각을 하고 있는 건 아니겠지.\n영호: 엉뚱하긴 뭐가 엉뚱해요.","notes":[],"kind":"프린트"},{"id":"print22","group":"obaltan-play","page":22,"title":"프린트 22쪽","text":"철호: (버럭 소리를 지르며) 영호야! 그렇게 살자면 이 형도 벌써 잘살 수 있었단 말이다.\n영호: 저도 형님을 존경하지 않는 건 아녜요. 가난하더라도 깨끗이 살자는 형님을……. 허지만 형님! 인생이 저 골목에\n서 십 환짜리를 받고 코 흘리는 어린애들에게 보여 주는 요지경이라면야 가지고 있는 돈값만치 구멍으로 들여다보\n고 말 수도 있죠. 그렇지만 어디 인생이 자기 주머니 속의 돈 액수만치만 살고 그만둘 수 있는 요지경인가요? 형님\n의 어금니만 해도 푹푹 쑤시고 아픈 걸 견딘다고 절약이 되는 건 아니죠. 그러니 비극이 시작되는 거죠. 지긋지긋\n하게 살아야 하니까 문제죠. 왜 우리라고 좀 더 넓은 테두리까지 못 나가라는 법이 어디 있어요.\n  영호는 반쯤 끌러 놨던 넥타이를 풀어서 방구석에 픽 던진다. 철호가 무겁게 입을 연다.\n철호: 그건 억설이야.\n영호: 억설이오?\n철호: 네 말대로 꼭 잘살자면 양심이구 윤리구 버려야 한다는 것 아니야.\n영호: 천만에요.\n#75. 철호의 집 골목\n  스카프를 두르고 핸드백을 걸친 명숙이가 엿듣고 있다.\n철호Ⓔ: 그게 바루 억설이란 말이다. 마음 한구석이 어딘가 비틀려서 하는 억지란 말이다.\n영호Ⓔ: 비틀렸죠. 분명히 비틀렸어요. 그런데 그 비틀리기가 너무 늦었단 말입니다.\n-이범선 원작, 이종기 각색, ｢오발탄｣\n*Ⓔ : 효과음(effect). 화면에 삽입된 음향.\n*O･L(overlap) : 하나의 화면이 끝나기 전에 다음 화면이 겹치면서 먼저 화면이 차차 사라지게 하는 기법.\n21. (가)와 (나)의 공통점으로 가장 적절한 것은?\n① 인물 간의 대결 의식을 통해 사건의 긴장감을 조성하고 있다.\n② 인물 간의 대화를 통해 특정 인물의 생각과 행동을 희화화하고 있다.\n③ 인물의 회상 장면을 통해 사건 해결의 실마리를 과거에서 찾고 있다.\n④ 인물 간의 갈등을 다각적으로 조명하여 사건 전개의 양상을 다면화하고 있다.\n⑤ 인물의 내면을 행위로 제시하여 상황을 받아들이기 어려워하는 심리를 보여 주고 있다.\n24. (가)와 (나)에 대한 감상으로 적절하지 않은 것은?\n①(가)의 짧게 느껴지는 ‘골목’은 어머니의 아쉬움을, (나)의 빠져나오기 힘든 ‘골목길’은 ‘시시한 동네’의 열악함을 보여 \n주고 있다.\n②(가)는 딸이 멀리 떠나는 모습을 통해, (나)는 명숙이 집 밖에서 엿듣는 모습을 통해 가족들 간의 갈등 상황을 보여 \n주고 있다.\n③(가)의 ‘눈물’은 가족을 떠나보내는 자의 아픔을, (나)의 ‘어금니’는 가족의 생계를 꾸려 나가는 자의 견딤을 보여 주\n고 있다.\n④(가)는 주인 영감의 명령만을 기다리는 신전 집 가족들을 통해, (나)는 만삭의 몸에도 누더기를 꿰매는 아내의 모습을 \n통해 가족이 처한 불우한 상황을 보여 주고 있다.\n⑤(가)는 ‘도회에서의 패잔자’가 낙향하는 모습을 통해, (나)는 영호가 취직을 거부하는 모습을 통해 현실에 적응하지 \n못하는 인물의 처지를 보여 주고 있다.\n25. (나)의 ‘#68～#71’에 대한 이해로 적절하지 않은 것은?\n①#68의 장면에 이어지는 #69에서 ‘철호Ⓔ’를 삽입하여 회상의 주체가 철호임을 알려 주고 있다.\n②#69에서 ‘철호Ⓔ’를 삽입하여 아내에 대한 연민을 드러내고 있다.\n③#69에서 ‘노래’를 활용하여 학창 시절 아내의 화면을 결혼 피로연장 아내의 화면으로 전환하고 있다.\n④#70에서 침묵하는 철호의 모습과 시가지의 분위기를 대비하여, 거리를 바라보는 철호의 심리를 암시하고 있다.\n⑤#70의 침묵과 #71의 대화를 상호 대비하여 영호의 소심함을 드러내고 있다.","notes":[{"quote":"21. (가)와 (나)","text":"원문 비교 대상 (가)는 이 프린트에 실려 있지 않음. 문항은 그대로 전사하되 확정 정답이나 근거를 만들어 넣지 않음.","kind":"추가 대조 메모"},{"quote":"25.","text":"지문 근거 학습: #69의 회상 주체는 철호. 회상→현재로 노래가 연결되고 #70의 침묵과 활기찬 거리 대비. #71에서 영호는 운전수에게 사례를 제시하므로 ⑤의 소심함은 부적절(추가 해설이며 원자료 답안 표시는 없음).","kind":"추가 대조 메모"}],"kind":"프린트"},{"id":"print23","group":"obaltan-play","page":23,"title":"프린트 23쪽","text":"26. <보기>를 바탕으로 (가)의 ㉠～㉢과 (나)의 ‘#71～#75’에 대해 이해한 내용으로 적절하지 않은 것은? [3점]\n< 보  기 >\n  작가는 시간의 흐름에 따라 나타나는 모든 상황을 서술하지는 않는다. 일련의 상황이나 사건들 중 작가의 시선\n에 의해 특정한 부분이 부각되어 서술되는 것이다. 즉, 서사는 시간과 공간을 배경으로 하는 사건의 선택과 결합\n을 통해 구성된다. 선택이란 시간과 공간을 분할한 후 의미 있는 부분을 선택하는 것을, 결합이란 이렇게 선택된 \n시간과 공간을 다양한 방식으로 연결하여 새롭게 사건을 구성하는 것을 의미한다. 이렇게 서사는 다양한 사건 구\n성의 방식을 통해 인간의 문제를 총체적으로 파악하고자 하는 고민을 담고 있다.\n① ㉠에서는 두 인물 사이에서 발생한 여러 상황에서 몇 개의 상황만을 선택적으로 제시하여 그 상황에 대한 인물의 \n심리를 암시하고 있고, #71과 #72에서는 서로 다른 두 공간을 동일 인물의 등장으로 연결하여 인물의 공간 이동을 \n나타내는군.\n② ㉡에서는 같은 날에 서로 다른 공간을 배경으로 하는 사건이 일어났음을 밝혀 ㉡의 공간에서 일어나는 사건과 ㉠의 \n공간에서 일어나는 사건을 결합하고 있고, #73과 #74의 서로 다른 공간은 동일한 인물들의 이어지는 대화를 통해 \n서로 결합하고 있군.\n③ ㉡에서는 일련의 상황을 선택적으로 제시하면서 인물들에 대한 감정을 서술하고 있고, #73∼#75에서는 두 인물의 \n대화를 매개로 서로 다른 공간을 결합함으로써 #73과 #75의 장면에 등장하는 인물들이 #74의 상황을 공유할 수 \n있도록 구성하고 있군.\n④ ㉠과 ㉡의 연결은 같은 날에 서로 다른 공간에서 발생하는 사건의 연결이라는 점에서는 #74와 #75의 연결과 유사\n하지만, 인물의 목소리를 활용하는 #74와 #75의 연결과 비교하면 연결 방식에서 구별되는군.\n⑤ ㉢은 시간의 흐름을 분할하고 대상의 특징적인 변화를 선택하여 제시한다는 점에서 #75와 유사하지만, 서로 다른 \n두 공간의 결합이 나타나지 않는다는 점에서는 #75와 구별되는군.","notes":[{"quote":"26.","text":"비교 대상 (가)의 ㉠~㉤ 자료가 제공되지 않음. 문항과 보기만 보존함.","kind":"추가 대조 메모"}],"kind":"프린트"},{"id":"print24","group":"seongtan","page":24,"title":"프린트 24쪽","text":"현대시\n현대시+α\n성탄제\n김종길\n어두운 방 안엔\n빠알간 숯불이 피고,\n외로이 늙으신 할머니가\n애처로이 잦아드는 어린 목숨을 지키고 계시었다.\n이윽고 눈 속을\n아버지가 약을 가지고 돌아오시었다.\n아 아버지가 눈을 헤치고 따 오신\n그 붉은 산수유 열매\n나는 한 마리 어린 짐승,\n젊은 아버지의 서느런 옷자락에\n열로 상기한 볼을 말없이 부비는 것이었다.\n이따금 뒷문을 눈이 치고 있었다.\n그날 밤이 어쩌면 성탄제의 밤이었을지도 모른다.\n어느새 나도\n그때의 아버지만큼 나이를 먹었다.\n옛것이라곤 찾아볼 길 없는\n성탄제 가까운 도시에는\n이제 반가운 그 옛날의 것이 내리는데,\n서러운 서른 살 나의 이마에\n불현듯 아버지의 서느런 옷자락을 느끼는 것은,\n눈 속에 따 오신 산수유 붉은 알알이\n아직도 내 혈액 속에 녹아 흐르는 까닭일까.\n    *성탄제: 성탄절. 곧 크리스마스를 의미함.\n<보 기>\n 위 작품은 김종길이 1953년 12월 20일 경 성탄제를 준비하는 대구 거리를 걷다가 그 분\n위기에 영감을 얻어 창작한 시이다. 시인은 그 거리에서 어릴 적 추억을 떠올리며 “그 회\n상이 성탄제 가까운 대구의 거리에서 이루어진 점과 애처로이 잦아드는 어린 목숨이 할머\n니와 아버지 덕분에 살아난 것을 하나의 거룩한 탄생과 견주어 생각\"하여 이 시의 제목을 \n「성탄제」라고 지었다고 회고한다. 이 작품은 시인이 태어난 지 2년 반만에 어머니를 여의\n고, 그 일 년 후 감기 뒤 폐렴으로 한 달 가량 몹시 앓았던 기억에서 출발한다. 이 시에서 \n할머니와 아버지의 행동은 성탄제의 분위기와 어울려 그 성스러움이 배가된다. 특히 화자\n의 붉은 혈액 속에 흐르는 것은, 예수의 탄생과 부활이라는 성탄제의 의미와 같은 가치를 \n갖는다. 시인은 이 시를 통해 전쟁 직후 도시의 황폐함을 작품 전편에 걸쳐 느낄 수 있는 \n이 가치를 통해 회복시키고자 한 것이다.","notes":[],"kind":"프린트"},{"id":"print25","group":"slpeum","page":25,"title":"프린트 25쪽","text":"현대시\n현대시+α\n그날 나는 슬픔도 배불렀다\n함민복\n아래층에서 물 틀면 단수가 되는\n좁은 계단을 올라야 하는 전세방에서\n만학을 하는 나의 등록금을 위해\n사글셋방으로 이사를 떠나는 형님네\n달그락거리던 밥그릇들\n베니어판으로 된 농짝을 리어카로 나르고\n집안 형편을 적나라하게 까 보이던 이삿짐\n가슴이 한참 덜컹거리고 이사가 끝났다\n형은 시장 골목에서 자장면을 시켜주고\n쉽게 정리될 살림살이를 정리하러 갔다\n나는 전날 친구들과 깡소주를 마신 대가로\n냉수 한 대접으로 조갈증을 풀면서\n자장면을 앞에 놓고\n이상한 중국집 젊은 부부를 보았다\n바쁜 점심시간 맞춰 잠자주는 아기를 고마워하며\n젊은 부부는 밀가루, 그 연약한 반죽으로\n튼튼한 미래를 꿈꾸듯 명랑하게 전화를 받고\n서둘러 배달을 나아갔다\n나는 그 모습이 눈물처럼 아름다워\n물배가 부른데도 자장면을 남기기 미안하여\n마지막 면발까지 다 먹고 나니\n더부룩하게 배가 불렀다, 살아간다는 게\n그날\n나는 분명 슬픔도 배불렀다\n    *만학: 나이가 들어 뒤늦게 공부함. 또는 그 공부.\n    *사글셋방: 월세를 받고 빌려주는 방. 또는 월세를 주고 빌려 쓰는 방.\n    *조갈증: 입술이나 입안, 목 따위가 몹시 마르는 느낌.\n<보 기>\n  이 시기, 한국 사회에서 '대학 졸업장'은 가난을 벗어나 계층을 상승시킬 수 있는 거의 \n유일하고도 확실한 동아줄로 여겨졌다. 이에 계층 상승을 노리는 가난한 집에서는 가장 \n가능성 있는 자식의 대학 공부를 위해 온 가족이 허리띠를 졸라매고 희생하는 일이 매우 \n흔했다. 그만큼 가족의 기대와 지원을 받는 자식이 느끼는 부담감과 미안함도 만만치 않\n는 것이었다. 이 시에서는 이런 상황을, 대비되는 정서나 태도, 이미지 등을 제시하여 강\n조하였다. 특히 화자는 표면적으로 모순이 있는 것처럼 보이는 것들을 통해서 표면적 진\n술 너머에 있는 보다 높은 차원의 인식을 보여 준다.","notes":[],"kind":"프린트"},{"id":"print26","group":"chanbab","page":26,"title":"프린트 26쪽","text":"현대시\n현대시+α\n찬밥\n문정희\n아픈 몸 일으켜 혼자 찬밥을 먹는다\n찬밥 속에 서릿발이 목을 쑤신다\n부엌에는 각종 전기 제품이 있어\n일 분만 단추를 눌러도 따끈한 밥이 되는 세상\n찬밥을 먹기도 쉽지 않지만\n오늘 혼자 찬밥을 먹는다\n가족에겐 따스한 밥 지어 먹이고\n찬밥을 먹던 사람\n이 빠진 그릇에 찬밥 훑어\n누가 남긴 무 조각에 생선 가시를 핥고\n몸에서는 제일 따스한 사랑을 뿜던 그녀\n깊은 밤에도\n혼자 달그락거리던 그 손이 그리워\n나 오늘 아픈 몸 일으켜 찬밥을 먹는다\n집집마다 신을 보낼 수 없어\n신 대신 보냈다는 설도 있지만\n홀로 먹는 찬밥 속에서 그녀를 만난다\n나 오늘\n세상의 찬밥이 되어\n*서릿발: 서리가 엉겨 붙어서 성에꽃처럼 된 모양. 여기서는 차갑고 날카로운 느낌을 비유적으로 이르는 말.","notes":[],"kind":"프린트"},{"id":"print27","group":"heungbu","page":27,"title":"프린트 27쪽","text":"현대시\n현대시+α\n흥부 부부상\n박재삼\n흥부 부부가 박덩이를 사이하고\n가르기 전에 건넨 웃음살을 헤아려 보라.\n금이 문제리,\n황금 벼 이삭이 문제리,\n웃음의 물살이 반짝이며 정갈하던\n그것이 확실히 문제다.\n없는 떡방아 소리도\n있는 듯이 드러내고\n손발 닳은 처지끼리\n같이 웃어 비추던 거울 면들아.\n웃다가 서로 불쌍해\n서로 구슬을 나누었으리.\n그러다 금시\n절로 면(面)에 온 구슬까지를 서로 부끄리며\n먼 물살이 가다가 소스라쳐 반짝이듯\n서로 소스라쳐\n본 웃음 물살을 지었다고 헤아려 보라.\n그것은 확실히 문제다.\n*웃음살: 웃음으로 얼굴에 번지는 환한 기운","notes":[],"kind":"프린트"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('app-data').textContent),SOURCES=JSON.parse(document.getElementById('source-data').textContent);
const UNITS=DATA.units,QUIZ=DATA.quiz,UNIT_BY_ID=Object.fromEntries(UNITS.map(u=>[u.id,u])),Q_BY_ID=Object.fromEntries(QUIZ.map(q=>[q.id,q]));
const CATEGORIES=['문학의 기초','고전 문학','현대 소설','현대 시','독서','국어사','통합 비교'];
const STORAGE_KEY='common-korean2-study-v1';
let storageOK=true,saved={};
try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')||{}}catch(e){storageOK=false}
const state={done:Array.isArray(saved.done)?saved.done.filter(id=>UNIT_BY_ID[id]):[],bookmarks:Array.isArray(saved.bookmarks)?saved.bookmarks.filter(id=>UNIT_BY_ID[id]):[],notes:saved.notes&&typeof saved.notes==='object'?saved.notes:{},history:saved.history&&typeof saved.history==='object'?saved.history:{},lastUnit:UNIT_BY_ID[saved.lastUnit]?saved.lastUnit:'story',large:!!saved.large,session:null,filterUnit:UNIT_BY_ID[saved.filterUnit]?saved.filterUnit:'all',filterType:['mix','ox','mc','hard','wrong'].includes(saved.filterType)?saved.filterType:'mix'};
if(saved.session&&Array.isArray(saved.session.ids)&&saved.session.ids.length&&saved.session.ids.every(id=>Q_BY_ID[id])){state.session={ids:saved.session.ids,idx:Math.min(Math.max(Number(saved.session.idx)||0,0),saved.session.ids.length-1),answers:saved.session.answers&&typeof saved.session.answers==='object'?saved.session.answers:{}}}
let homeFilter='all',query='',currentView='home',currentUnit=state.lastUnit,currentSourceGroup='dodo',sourceQuery='',toastTimer,noteTimer;
const main=document.getElementById('main');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=x=>{const d=document.createElement('div');d.innerHTML=x;return d.textContent||''};
const tagClass=cat=>cat==='독서'?'teal':cat==='국어사'?'purple':cat==='현대 시'?'rose':'';
const unitTags=u=>`<div class="tags"><span class="tag ${tagClass(u.category)}">${esc(u.category)}</span>${u.tags.map(t=>`<span class="tag ${tagClass(u.category)}">${esc(t)}</span>`).join('')}</div>`;
const footer=()=>'<footer class="footer"><span>공통국어2 통합 학습실 · 교과서와 제공된 기말 프린트 기반</span><span>문제는 자료의 내용을 바탕으로 구성한 연습문제입니다. 원자료 기출은 원문 자료에서 확인하세요.</span></footer>';
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}renderStorage()}
function renderStorage(){const w=document.getElementById('storage-warning');w.textContent=storageOK?'':'이 브라우저에서는 기록을 저장할 수 없습니다. 현재 화면에서는 계속 학습할 수 있습니다.';w.className=storageOK?'':'storage-warning'}
function toast(text){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true},2400)}
function setHeaderHeight(){document.documentElement.style.setProperty('--header',document.getElementById('page-header').offsetHeight+'px')}
function closeMenu(){document.getElementById('library').classList.remove('open');document.getElementById('menu-shade').classList.remove('visible');document.getElementById('menu-toggle').setAttribute('aria-expanded','false')}
function showMenu(){const open=document.getElementById('library').classList.toggle('open');document.getElementById('menu-shade').classList.toggle('visible',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));if(open)document.getElementById('search-input').focus()}
function renderLibrary(){const t=query.trim().toLocaleLowerCase();let out='';for(const cat of CATEGORIES){const list=UNITS.filter(u=>u.category===cat).filter(u=>!t||[u.title,u.summary,...u.tags,...u.sections.map(s=>s.title+' '+strip(s.body))].join(' ').toLocaleLowerCase().includes(t));if(!list.length)continue;out+=`<div class="group-label">${esc(cat)}</div>`;for(const u of list){const hit=t?u.sections.find(s=>(s.title+' '+strip(s.body)).toLocaleLowerCase().includes(t)):null;out+=`<button class="unit-link ${currentView==='study'&&currentUnit===u.id?'selected':''}" data-unit="${u.id}" ${hit?`data-anchor="${hit.id}"`:''} ${currentView==='study'&&currentUnit===u.id?'aria-current="page"':''}><span class="unit-dot ${state.done.includes(u.id)?'done':''}" aria-hidden="true">${state.done.includes(u.id)?'✓':state.bookmarks.includes(u.id)?'★':'·'}</span><span>${esc(u.title)}${hit?`<span class="search-hit">${esc(hit.title)}</span>`:''}</span></button>`}}
document.getElementById('unit-list').innerHTML=out||'<p class="empty">검색 결과가 없습니다.</p>';const count=state.done.length;document.getElementById('library-progress').innerHTML=`<div class="line-label"><span>읽은 단원</span><b>${count} / ${UNITS.length}</b></div><progress value="${count}" max="${UNITS.length}" aria-label="읽은 단원 진행률"></progress>`}
function renderHome(){const attempted=Object.keys(state.history).filter(id=>Q_BY_ID[id]).length,wrong=Object.values(state.history).filter(a=>a&&a.correct===false).length;const list=homeFilter==='bookmarks'?UNITS.filter(u=>state.bookmarks.includes(u.id)):homeFilter==='all'?UNITS:UNITS.filter(u=>u.category===homeFilter);main.innerHTML=`<div class="home-top"><div class="eyebrow">문학 · 독서 · 국어사</div><h1>공통국어2, 한 흐름으로 공부하기</h1><p class="lead">작품과 개념을 읽고, 서로 연결하고, 문제로 확인하세요.<br>「도도한 생활」은 교과서 수록본을 기준으로 정리했습니다.<br>본문 53쪽과 구절별 필기를 텍스트로 읽을 수 있습니다.</p><div class="stats"><div class="stat"><strong>${UNITS.length}<small>개</small></strong><span>학습 단원</span></div><div class="stat"><strong>${QUIZ.length}<small>문항</small></strong><span>해설형 연습문제</span></div><div class="stat"><strong>${attempted}<small>문항</small></strong><span>최근 답변 기록</span></div><div class="stat"><strong>${wrong}<small>문항</small></strong><span>복습할 오답</span></div></div></div><div class="continue"><div><strong>이어서 읽기 · ${esc(UNIT_BY_ID[state.lastUnit].title)}</strong><span>단원 정리를 읽은 뒤 ‘학습 완료’를 표시해 보세요.</span></div><button class="btn primary" data-unit="${state.lastUnit}">이어서 학습</button></div><div class="home-row"><h2>학습할 단원</h2><button class="btn small ghost" data-view="map">개념지도 보기</button></div><div class="category-row" aria-label="학습 분야 선택">${[['all','전체'],...CATEGORIES.map(c=>[c,c]),['bookmarks','책갈피']].map(([v,l])=>`<button class="filter ${homeFilter===v?'active':''}" data-home-filter="${esc(v)}" aria-pressed="${homeFilter===v}">${esc(l)}</button>`).join('')}</div><div class="unit-grid">${list.map(u=>`<article class="unit-card"><div><span class="tag ${tagClass(u.category)}">${esc(u.category)}</span></div><h3>${esc(u.title)}</h3><p>${esc(u.summary)}</p>${state.done.includes(u.id)?'<div class="status">✓ 읽은 단원</div>':''}<a href="#study/${u.id}">학습하기</a></article>`).join('')||'<p class="empty">표시할 단원이 없습니다. 단원에서 책갈피를 추가해 보세요.</p>'}</div>${footer()}`}
function renderUnit(id,anchor){const u=UNIT_BY_ID[id]||UNITS[0];currentUnit=u.id;state.lastUnit=u.id;save();const done=state.done.includes(u.id),bookmarked=state.bookmarks.includes(u.id);main.innerHTML=`<article><div class="lesson-head"><div class="eyebrow">${esc(u.category)} · 학습 정리</div><h1>${esc(u.title)}</h1><p class="lead">${esc(u.summary)}</p>${unitTags(u)}<p class="lesson-source">기준 자료: ${esc(u.source)}</p><div class="actions"><button class="btn ${done?'active':'primary'}" data-complete="${u.id}" aria-pressed="${done}">${done?'✓ 학습 완료':'학습 완료 표시'}</button><button class="btn ${bookmarked?'active':''}" data-bookmark="${u.id}" aria-pressed="${bookmarked}">${bookmarked?'★ 책갈피됨':'☆ 책갈피'}</button><button class="btn" data-quiz-unit="${u.id}">이 단원 문제</button>${u.sourceGroups.map(g=>`<button class="btn" data-source-group="${g}">${g==='obaltan-play'?'시나리오 원문':'원문·필기 읽기'}</button>`).join('')}</div><nav class="section-jumps" aria-label="단원 안 이동">${u.sections.map(s=>`<a href="#study/${u.id}/${s.id}">${esc(s.title)}</a>`).join('')}${annotationPages(u).length?`<a href="#study/${u.id}/annotations">구절별 필기</a>`:''}<a href="#study/${u.id}/recall">스스로 확인</a><a href="#study/${u.id}/notes">내 메모</a></nav></div>${u.sections.map(s=>`<section class="lesson-section" id="a-${u.id}-${s.id}"><h2>${esc(s.title)}</h2>${s.body}</section>`).join('')}${renderUnitAnnotations(u)}<section class="lesson-section recall" id="a-${u.id}-recall"><div class="eyebrow">책을 덮고 떠올리기</div><h2>스스로 확인</h2><p class="subtle">먼저 말로 답해 보고 질문을 눌러 핵심 답을 확인하세요.</p>${u.recall.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</section><section class="lesson-section" id="a-${u.id}-notes"><div class="line-label"><h2>내 메모</h2><span class="subtle" id="note-status">브라우저에 저장</span></div><label for="unit-note" class="sr-only">${esc(u.title)} 학습 메모</label><textarea class="note-area" id="unit-note" data-note="${u.id}" placeholder="헷갈리는 구절, 선지의 함정, 나만의 설명을 적어 보세요.">${esc(state.notes[u.id]||'')}</textarea><div class="related">${u.related.map(id=>`<a href="#study/${id}">${esc(UNIT_BY_ID[id].title)}</a>`).join('')}</div></section><div class="pager">${UNITS.indexOf(u)>0?`<a class="btn" href="#study/${UNITS[UNITS.indexOf(u)-1].id}">이전 단원</a>`:'<span></span>'}${UNITS.indexOf(u)<UNITS.length-1?`<a class="btn" href="#study/${UNITS[UNITS.indexOf(u)+1].id}">다음 단원</a>`:'<a class="btn" href="#quiz">문제로 확인하기</a>'}</div></article>${footer()}`;if(id==='climate')updateCarbon();if(anchor)requestAnimationFrame(()=>{const el=document.getElementById(`a-${u.id}-${anchor}`);if(el)el.scrollIntoView({behavior:'auto',block:'start'})})}
