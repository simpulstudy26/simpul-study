function renderMap(){main.innerHTML=`<div class="eyebrow">개념을 찾는 지도</div><h1>학습 내용 한눈에 보기</h1><p class="lead">작품 제목은 단원 처음으로, 작은 항목은 해당 설명으로 이동합니다. 내용 순서와 같은 순서로 배치했습니다.</p>${CATEGORIES.map(cat=>`<section class="map-group"><h2>${cat}</h2>${UNITS.filter(u=>u.category===cat).map(u=>`<div class="map-unit"><a href="#study/${u.id}">${esc(u.title)}</a><div class="map-sections">${u.sections.map(s=>`<a href="#study/${u.id}/${s.id}">${esc(s.title)}</a>`).join('')}</div></div>`).join('')}</section>`).join('')}${footer()}`}
function quizCounts(){const done=Object.values(state.history).filter(x=>x&&typeof x.correct==='boolean');return{done:done.length,correct:done.filter(x=>x.correct).length,wrong:done.filter(x=>!x.correct).length}}
function renderQuiz(){const c=quizCounts();main.innerHTML=`<div class="eyebrow">읽은 내용을 내 것으로</div><h1>문제로 확인하기</h1><p class="lead">OX 38문항 · 객관식 38문항 · 고난도 24문항. 답을 고르면 해설을 바로 볼 수 있습니다. 오답 복습은 가장 최근 답변을 기준으로 합니다.</p><section class="quiz-setup"><div class="quiz-controls"><label>학습 범위<select id="quiz-unit"><option value="all">전체 단원</option>${UNITS.map(u=>`<option value="${u.id}" ${state.filterUnit===u.id?'selected':''}>${esc(u.title)}</option>`).join('')}</select></label><label>문제 유형<select id="quiz-type">${[['mix','모든 유형'],['ox','OX'],['mc','객관식'],['hard','고난도'],['wrong','오답만 복습']].map(([v,l])=>`<option value="${v}" ${state.filterType===v?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn primary" id="quiz-start">선택한 범위 시작</button></div><div class="line-label subtle" style="margin-top:17px;margin-bottom:0"><span id="recent-record">최근 기록: ${c.correct}개 정답 / ${c.done}개 풀이 · 오답 ${c.wrong}개</span><button class="btn small ghost" id="wrong-export">오답 노트 저장</button></div></section><div id="quiz-stage"></div>${footer()}`;renderQuizStage()}
function renderQuizStage(){const record=document.getElementById('recent-record');if(record){const c=quizCounts();record.textContent=`최근 기록: ${c.correct}개 정답 / ${c.done}개 풀이 · 오답 ${c.wrong}개`}const stage=document.getElementById('quiz-stage');if(!stage)return;const s=state.session;if(!s){stage.innerHTML='<div class="quiz-empty">범위와 유형을 선택해 시작하세요.<br>풀이 중 나가도 답변과 진행 위치가 저장됩니다.</div>';return}const q=Q_BY_ID[s.ids[s.idx]],answer=s.answers[q.id],answered=typeof answer==='number'&&answer>=0&&answer<q.opts.length;const allAnswered=s.ids.filter(id=>Number.isInteger(s.answers[id])).length,correct=s.ids.filter(id=>s.answers[id]===Q_BY_ID[id].a).length;const unit=UNIT_BY_ID[q.unit];stage.innerHTML=`<div class="quiz-topline"><b>${s.idx+1} / ${s.ids.length}번 문제</b><span>풀이 ${allAnswered} · 정답 ${correct}</span></div><progress value="${allAnswered}" max="${s.ids.length}" aria-label="현재 문제 모음 풀이 진행률"></progress><article class="quiz-card" id="current-question"><div class="tags"><span class="tag ${q.type==='hard'?'purple':q.type==='ox'?'':'teal'}">${q.type==='ox'?'OX':q.type==='hard'?'고난도':'객관식'}</span><span class="tag">${esc(unit.title)}</span></div><h2>${esc(q.q)}</h2><div class="options">${q.opts.map((opt,i)=>`<button class="option ${answered?(i===q.a?'correct':i===answer?'wrong':''):''}" data-answer="${i}" ${answered?'disabled':''} aria-pressed="${answered&&i===answer}"><span class="option-letter">${q.type==='ox'?(i===0?'O':'X'):String.fromCharCode(65+i)}</span><span>${esc(opt)}${answered&&i===q.a?' <b>· 정답</b>':''}${answered&&i===answer&&i!==q.a?' <b>· 내 답</b>':''}</span></button>`).join('')}</div>${answered?`<div class="feedback ${answer===q.a?'':'wrong'}" id="q-feedback" role="status"><strong>${answer===q.a?'정답입니다.':'다시 짚어 보세요.'}</strong><p>${esc(q.exp)}</p><a href="#study/${unit.id}">관련 학습 정리 보기</a></div>`:'<p class="subtle" style="margin:16px 0 0">숫자 1–4로 선택할 수 있습니다. OX는 O·X 키도 사용할 수 있습니다.</p>'}<div class="quiz-navrow"><button class="btn" id="quiz-prev" ${s.idx===0?'disabled':''}>이전 문제</button><button class="btn ${answered?'primary':''}" id="quiz-next" ${s.idx===s.ids.length-1?'disabled':''}>다음 문제</button></div></article>${allAnswered===s.ids.length?`<section class="quiz-summary" role="status"><div class="eyebrow">이 범위 학습 완료</div><h2><span class="quiz-score">${correct} / ${s.ids.length}</span> 정답</h2><p>정답률 ${Math.round(correct/s.ids.length*100)}% · 틀린 문제 ${s.ids.length-correct}개</p><div class="actions"><button class="btn primary" id="session-wrong">이번 범위 오답 복습</button><button class="btn" id="session-retry">같은 범위 다시 풀기</button></div></section>`:''}<details class="quiz-setup"><summary>문제 번호로 이동 · 정답/오답 표시</summary><p class="subtle" style="margin-top:12px">연두색은 정답, 분홍색은 오답입니다. 현재 문제에는 파란 테두리가 표시됩니다.</p><div class="q-nav">${s.ids.map((id,i)=>`<button data-q-index="${i}" class="${Number.isInteger(s.answers[id])?(s.answers[id]===Q_BY_ID[id].a?'correct':'wrong'):''} ${i===s.idx?'current':''}" aria-label="${i+1}번 ${Number.isInteger(s.answers[id])?(s.answers[id]===Q_BY_ID[id].a?'정답':'오답'):'미응답'}" ${i===s.idx?'aria-current="step"':''}>${i+1}</button>`).join('')}</div></details>`}
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function startQuiz(ids){if(!ids){state.filterUnit=document.getElementById('quiz-unit').value;state.filterType=document.getElementById('quiz-type').value;ids=QUIZ.filter(q=>(state.filterUnit==='all'||q.unit===state.filterUnit)&&(state.filterType==='mix'||state.filterType==='wrong'||q.type===state.filterType)&&(state.filterType!=='wrong'||state.history[q.id]?.correct===false)).map(q=>q.id)}if(!ids.length){toast('선택한 범위에 복습할 문제가 없습니다.');return}state.session={ids:shuffle(ids),idx:0,answers:{}};save();renderQuiz();scrollQuestion()}
function scrollQuestion(){requestAnimationFrame(()=>document.getElementById('current-question')?.scrollIntoView({block:'start',behavior:'smooth'}))}
function answerQuestion(pick){const s=state.session;if(!s)return;const q=Q_BY_ID[s.ids[s.idx]];if(Number.isInteger(s.answers[q.id])||pick<0||pick>=q.opts.length)return;s.answers[q.id]=pick;state.history[q.id]={pick,correct:pick===q.a,at:Date.now()};save();renderQuizStage()}
function moveQuestion(delta){const s=state.session;if(!s)return;s.idx=Math.max(0,Math.min(s.ids.length-1,s.idx+delta));save();renderQuizStage();scrollQuestion()}
function sourceGroupFor(id){return UNIT_BY_ID[id]?.sourceGroups?.[0]||'flow'}
function annotationPages(u){return SOURCES.pages.filter(s=>u.sourcePageIds.includes(s.id)&&s.notes.length)}
function notesHTML(page){return page.notes.map(n=>`<div class="source-note"><div class="note-quote">${n.kind?`<span class="tag">${esc(n.kind)}</span> `:''}${esc(n.quote)}</div><p>${esc(n.text)}</p></div>`).join('')}
function renderUnitAnnotations(u){const pages=annotationPages(u);if(!pages.length)return'';return`<section class="lesson-section" id="a-${u.id}-annotations"><div class="eyebrow">자료 속 필기와 함께 읽기</div><h2>구절별 필기 대조</h2><p class="subtle">표시된 쪽을 펼치면 해당 표현에 붙은 필기를 볼 수 있습니다. 판독이 불확실한 글자는 별도로 표시했습니다. 추가 대조 메모는 별도 꼬리표로 구분합니다.</p>${pages.map(s=>`<details class="annotation-details"><summary>${esc(s.title)} · 필기·메모 ${s.notes.length}개</summary>${notesHTML(s)}<button class="btn small" data-source-id="${s.id}">이 쪽 본문 읽기</button></details>`).join('')}</section>`}
function sourceSearchText(s){return(s.title+' '+s.text+' '+s.notes.map(n=>n.quote+' '+n.text).join(' ')).normalize('NFC').toLocaleLowerCase()}
function sourcePageHTML(s){return`<article class="lesson-section source-page" id="text-${s.id}"><div class="source-page-head"><div><span class="tag">${esc(s.kind)}</span><h2>${esc(s.title)}</h2></div><a class="btn small" href="#sources/${s.group}/${s.id}">이 쪽만 보기</a></div><div class="source-body">${esc(s.text)}</div>${s.notes.length?`<aside class="source-notes" aria-label="${esc(s.title)} 필기"><h3>필기·대조 메모 · ${s.notes.length}개</h3>${notesHTML(s)}</aside>`:'<p class="subtle source-no-note">이 쪽에는 별도 손글씨 필기가 없습니다.</p>'}</article>`}
function renderSources(group,pageId){if(SOURCES.groups.some(g=>g.id===group))currentSourceGroup=group;const g=SOURCES.groups.find(g=>g.id===currentSourceGroup)||SOURCES.groups[0],list=SOURCES.pages.filter(s=>s.group===g.id),selected=list.find(s=>s.id===pageId),shown=selected?[selected]:list;main.innerHTML=`<div class="eyebrow">본문 · 주석 · 문항 · 필기</div><h1>텍스트로 읽는 원문</h1><p class="lead">교과서 26쪽과 프린트 27쪽을 텍스트로 옮겼습니다. 읽고 검색하며 필요한 구절을 복사할 수 있습니다.</p><section class="quiz-setup"><label for="source-search" class="search-label">전체 53쪽의 본문·필기 검색</label><input class="search" id="source-search" type="search" value="${esc(sourceQuery)}" placeholder="문장이나 개념을 입력하세요" autocomplete="off"><div id="source-results" aria-live="polite"></div><label for="source-group" style="display:block;margin-top:20px"><b>작품·자료 선택</b></label><select class="source-select" id="source-group">${SOURCES.groups.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><p class="subtle" style="margin:14px 0">${esc(g.note)}</p><nav class="source-pagination" aria-label="원문 쪽 선택"><a class="btn small ${!selected?'active':''}" href="#sources/${g.id}">전체 이어 읽기</a>${list.map(s=>`<a class="btn small ${selected?.id===s.id?'active':''}" href="#sources/${g.id}/${s.id}" ${selected?.id===s.id?'aria-current="page"':''}>${s.page}쪽${s.notes.length?' · 필기':''}</a>`).join('')}</nav>${g.id==='dodo'?'<div class="callout neutral"><strong>교과서 기준 · 85·94쪽 미제공</strong><p>제공된 82–84·86–93·95쪽을 전사했습니다. 빠진 두 쪽은 임의로 복원하지 않았습니다. 교과서에 인쇄된 중략과 미제공 쪽을 구별해 읽으세요.</p></div>':''}${g.id==='dodo-print'?'<div class="callout neutral"><strong>축약된 프린트 대조본</strong><p>「도도한 생활」의 기준 본문과 학습 정리는 교과서입니다. 이 대조본의 각주8·9는 프린트 작성자의 해석입니다. 특히 각주9의 상반된 두 해석을 하나의 확정 사실로 읽지 마세요.</p></div>':''}</section><div id="source-reading">${shown.map(sourcePageHTML).join('')}</div><p class="subtle">인쇄된 본문과 별도 손글씨 필기를 구분했습니다. 옛한글은 기기의 글꼴에 따라 자모가 나뉘어 보일 수 있습니다. 방점은 ·와 :로 전사했습니다.</p>${footer()}`;renderSourceResults()}
function renderSourceResults(){const el=document.getElementById('source-results');if(!el)return;const t=sourceQuery.trim().normalize('NFC').toLocaleLowerCase();if(!t){el.innerHTML='';return}const hits=SOURCES.pages.filter(s=>sourceSearchText(s).includes(t));el.innerHTML=`<p class="subtle" style="margin:12px 0">검색 결과 ${hits.length}쪽</p>${hits.map(s=>{const text=s.text+' '+s.notes.map(n=>n.quote+' '+n.text).join(' '),i=text.toLocaleLowerCase().indexOf(t),preview=i>=0?text.slice(Math.max(0,i-35),i+t.length+85):text.slice(0,100);return`<button class="source-result" data-source-id="${s.id}"><strong>${esc(SOURCES.groups.find(g=>g.id===s.group).title)} · ${esc(s.title)}</strong><span>${esc(preview.replace(/\n/g,' '))}…</span></button>`}).join('')||'<p class="empty">검색 결과가 없습니다.</p>'}`}
function openSource(id){const src=SOURCES.pages.find(x=>x.id===id);if(src)navigate('sources/'+src.group+'/'+src.id)}

function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function exportWrong(){const qs=QUIZ.filter(q=>state.history[q.id]?.correct===false);if(!qs.length){toast('아직 저장된 오답이 없습니다.');return}const text='공통국어2 · 오답 노트\n\n'+qs.map((q,i)=>{const h=state.history[q.id];return `${i+1}. [${UNIT_BY_ID[q.unit].title}] ${q.q}\n${q.opts.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join('\n')}\n내 답: ${q.opts[h.pick]||'—'}\n정답: ${q.opts[q.a]}\n해설: ${q.exp}`}).join('\n\n');downloadBlob(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}),'공통국어2_오답노트.txt')}
function updateCarbon(){const eu=Number(document.getElementById('carbon-eu')?.value),home=Number(document.getElementById('carbon-home')?.value),ton=Number(document.getElementById('carbon-ton')?.value),out=document.getElementById('carbon-result');if(!out)return;if([eu,home,ton].some(x=>!Number.isFinite(x)||x<0||x>1000000)){out.textContent='0부터 1,000,000 사이의 값을 입력하세요.';return}const diff=Math.max(0,eu-home);out.textContent=`톤당 차액 ${diff.toLocaleString('ko-KR')} × ${ton.toLocaleString('ko-KR')}톤 = 추가 부담 ${Number((diff*ton).toFixed(4)).toLocaleString('ko-KR')} (같은 비용 단위)`}
function route(){const parts=decodeURIComponent(location.hash.slice(1)).split('/'),view=parts[0]||'home',allowed=['home','study','quiz','connect','map','sources'];currentView=allowed.includes(view)?view:'home';document.querySelectorAll('.nav-btn').forEach(b=>{const active=b.dataset.view===currentView;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(currentView==='study')renderUnit(parts[1]||state.lastUnit,parts[2]);else if(currentView==='connect')renderUnit('integration');else if(currentView==='quiz')renderQuiz();else if(currentView==='map')renderMap();else if(currentView==='sources')renderSources(parts[1],parts[2]);else renderHome();renderLibrary();closeMenu();if(!(currentView==='study'&&parts[2]))window.scrollTo({top:0,behavior:'auto'});document.title=(currentView==='study'?UNIT_BY_ID[currentUnit].title+' · ':'')+'공통국어2 통합 학습실';setHeaderHeight()}
function navigate(hash){if(location.hash==='#'+hash)route();else location.hash=hash}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view==='study'?'study/'+state.lastUnit:b.dataset.view);return}if(b.dataset.unit){navigate('study/'+b.dataset.unit+(b.dataset.anchor?'/'+b.dataset.anchor:''));return}if(b.dataset.homeFilter){homeFilter=b.dataset.homeFilter;renderHome();return}if(b.dataset.complete){const id=b.dataset.complete;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();b.classList.toggle('active',state.done.includes(id));b.classList.toggle('primary',!state.done.includes(id));b.textContent=state.done.includes(id)?'✓ 학습 완료':'학습 완료 표시';b.setAttribute('aria-pressed',String(state.done.includes(id)));renderLibrary();return}if(b.dataset.bookmark){const id=b.dataset.bookmark;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();b.classList.toggle('active',state.bookmarks.includes(id));b.textContent=state.bookmarks.includes(id)?'★ 책갈피됨':'☆ 책갈피';b.setAttribute('aria-pressed',String(state.bookmarks.includes(id)));renderLibrary();return}if(b.dataset.quizUnit){state.filterUnit=b.dataset.quizUnit;state.filterType='mix';state.session={ids:shuffle(QUIZ.filter(q=>q.unit===state.filterUnit).map(q=>q.id)),idx:0,answers:{}};save();navigate('quiz');return}if(b.dataset.sourceGroup){navigate('sources/'+b.dataset.sourceGroup);return}if(b.dataset.sourceId){openSource(b.dataset.sourceId);return}if(b.dataset.answer!==undefined){answerQuestion(Number(b.dataset.answer));return}if(b.dataset.qIndex!==undefined){state.session.idx=Number(b.dataset.qIndex);save();renderQuizStage();scrollQuestion();return}switch(b.id){case'menu-toggle':showMenu();break;case'font-toggle':state.large=!state.large;applyFont();save();break;case'print-button':window.print();break;case'totop':window.scrollTo({top:0,behavior:'smooth'});break;case'quiz-start':startQuiz();break;case'quiz-prev':moveQuestion(-1);break;case'quiz-next':moveQuestion(1);break;case'session-retry':startQuiz([...state.session.ids]);break;case'session-wrong':{const ids=state.session.ids.filter(id=>state.session.answers[id]!==Q_BY_ID[id].a);startQuiz(ids);break}case'wrong-export':exportWrong();break;}});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){query=e.target.value;renderLibrary()}if(e.target.id==='source-search'){sourceQuery=e.target.value;renderSourceResults()}if(e.target.dataset.note){const id=e.target.dataset.note;state.notes[id]=e.target.value;document.getElementById('note-status').textContent='저장 중…';clearTimeout(noteTimer);noteTimer=setTimeout(()=>{save();const status=document.getElementById('note-status');if(status)status.textContent=storageOK?'저장됨':'현재 화면에만 유지됨'},250)}if(['carbon-eu','carbon-home','carbon-ton'].includes(e.target.id))updateCarbon()});
document.addEventListener('change',e=>{if(e.target.id==='source-group')navigate('sources/'+e.target.value);if(e.target.id==='quiz-unit'){state.filterUnit=e.target.value;save()}if(e.target.id==='quiz-type'){state.filterType=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(currentView!=='quiz'||!state.session)return;const q=Q_BY_ID[state.session.ids[state.session.idx]],key=e.key.toLowerCase();if(/^[1-4]$/.test(key)){e.preventDefault();answerQuestion(Number(key)-1)}else if(q.type==='ox'&&(key==='o'||key==='x')){e.preventDefault();answerQuestion(key==='o'?0:1)}});
function applyFont(){document.body.classList.toggle('large-text',state.large);const b=document.getElementById('font-toggle');b.textContent=state.large?'글자 기본':'글자 크게';b.setAttribute('aria-pressed',String(state.large));requestAnimationFrame(setHeaderHeight)}
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'})});document.getElementById('menu-shade').addEventListener('click',closeMenu);window.addEventListener('hashchange',route);window.addEventListener('resize',setHeaderHeight);window.addEventListener('pagehide',save);applyFont();renderStorage();route();
</script>
</body>
</html>
