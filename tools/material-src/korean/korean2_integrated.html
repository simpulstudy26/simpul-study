<script id="app-data" type="application/json">{"units":[{"id":"story","title":"이야기 문학의 흐름","category":"문학의 기초","summary":"갈래의 변화와 신화·전설·민담의 차이에서 출발하기.","tags":["문학사","설화","판소리계 소설"],"source":"교과서 61쪽","sections":[{"id":"history","title":"이야기 문학이 걸어온 길","body":"<ol class=\"flow\"><li>고대: 신화·전설·민담의 구전<\/li><li>고려: 패관 문학·가전체 문학<\/li><li>조선: 한문·국문 고전 소설, 판소리계 소설<\/li><li>근대 초기의 신소설과 현대 소설<\/li><\/ol><p>이는 이야기 문학의 큰 흐름이다. 앞선 갈래가 완전히 사라지고 다음 갈래로 교체되었다는 뜻은 아니다. 서사 문학은 서술자가 이야기를 전달하고, 극 문학은 인물의 말과 행동으로 사건을 보여 준다. 극 문학은 굿·놀이에서 가면극·인형극 등의 민속극을 거쳐 무대 예술로 발전했다.<\/p>"},{"id":"folklore","title":"신화·전설·민담 비교","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">기준<\/th><th scope=\"col\">신화<\/th><th scope=\"col\">전설<\/th><th scope=\"col\">민담<\/th><\/tr><\/thead><tbody><tr><td>전승 태도<\/td><td>신성한 사실로 믿음<\/td><td>실제로 있었던 일로 믿음<\/td><td>흥미로운 허구로 받아들임<\/td><\/tr><tr><td>시간·장소<\/td><td>아득한 태초·신성한 공간<\/td><td>특정 시대와 장소<\/td><td>옛날 어느 마을 등 비교적 막연함<\/td><\/tr><tr><td>증거물<\/td><td>국가·민족 등 포괄적 대상<\/td><td>바위·산·유적 등 구체적 대상<\/td><td>특정 증거물이 필수적이지 않음<\/td><\/tr><tr><td>주인공과 세계<\/td><td>신성한 주인공이 질서를 세움<\/td><td>인간이 세계의 힘에 부딪히는 경우가 많음<\/td><td>평범한 사람이 지혜로 난관을 넘는 경우가 많음<\/td><\/tr><\/tbody><\/table><\/div><p>표의 마지막 행은 대표적 경향이다. 모든 작품을 승리·패배의 공식 하나로만 분류하지 말고, 전승 태도와 증거물도 함께 확인한다.<\/p>"},{"id":"hero","title":"영웅의 일대기와 판소리계 소설","body":"<p>「주몽 신화」의 영웅적 서사 구조는 「홍길동전」·「조웅전」·「박씨전」 등 후대 영웅 소설과 연결된다. 고귀하거나 비범한 출생, 고난, 조력, 위기 극복 등의 요소를 작품 속 근거와 연결해 읽는다.<\/p><p>판소리계 소설은 판소리 사설의 영향을 받은 소설이다. 말로 전승되고 문자로 기록되는 과정에서 여러 <b>이본<\/b>이 생겼으며, 삶의 갈등을 풍자와 해학으로 풀어내기도 한다.<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">구분<\/th><th scope=\"col\">핵심<\/th><\/tr><\/thead><tbody><tr><td>경판본<\/td><td>서울에서 간행한 목판본<\/td><\/tr><tr><td>완판본<\/td><td>전주에서 간행한 목판본<\/td><\/tr><tr><td>이본<\/td><td>기본 이야기를 공유하되 인물·사건·표현 등이 다른 판본<\/td><\/tr><\/tbody><\/table><\/div>"}],"recall":[["설화 세 갈래를 증거물로 구별하면?","신화는 포괄적 대상, 전설은 구체적 사물·장소, 민담은 특정 증거물이 필수적이지 않다."],["판소리계 소설에 이본이 생기는 까닭은?","구전과 문자 정착 과정에서 전승자·기록자의 의식과 표현이 반영되기 때문이다."]],"related":["chunhyang","josin","mask"],"sources":["book61"],"sourceGroups":["flow"],"sourcePageIds":["book61"]},{"id":"chunhyang","title":"춘향전","category":"고전 문학","summary":"신분을 넘는 사랑과 정절, 탐관오리에 대한 비판을 함께 읽기.","tags":["판소리계 소설","풍자와 해학","서술자"],"source":"교과서 66–72쪽","sections":[{"id":"plot","title":"사건과 갈등","body":"<ol class=\"flow\"><li>몽룡과 춘향의 만남·이별<\/li><li>변 사또의 수청 강요와 춘향의 저항<\/li><li>암행어사가 된 몽룡의 귀환<\/li><li>생일잔치에서 학정 비판·출두<\/li><li>춘향의 마음 확인·재회·보상<\/li><\/ol><p>제공된 본문은 변 사또의 잔치부터 암행어사 출두, 춘향과의 재회 및 결말에 집중한다. 춘향과 변 사또의 갈등에는 정절의 문제와 함께 권력을 이용한 억압의 문제가 담긴다.<\/p>"},{"id":"poem","title":"금준미주 한시: 잔치의 이면","body":"<blockquote>금준미주는 천인혈이요 / 옥반가효는 만성고라.<br>촉루낙시에 민루락이요 / 가성고처에 원성고라.<\/blockquote><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">잔치의 겉모습<\/th><th scope=\"col\">그 이면의 백성들<\/th><\/tr><\/thead><tbody><tr><td>금 술잔의 좋은 술<\/td><td>수많은 사람의 피<\/td><\/tr><tr><td>옥쟁반의 좋은 안주<\/td><td>만백성의 기름<\/td><\/tr><tr><td>떨어지는 촛농<\/td><td>떨어지는 백성의 눈물<\/td><\/tr><tr><td>높아지는 노랫소리<\/td><td>높아지는 원망의 소리<\/td><\/tr><\/tbody><\/table><\/div><p>대조와 비유로 관리들의 사치가 백성의 고통을 바탕으로 함을 폭로한다. 몽룡이 술과 안주를 먹었다는 말은 상황과 속마음을 함께 보아야 한다.<\/p>"},{"id":"style","title":"웃음을 만드는 방식","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">표현<\/th><th scope=\"col\">작용<\/th><\/tr><\/thead><tbody><tr><td>“갈비 한 대 먹읍시다.” / “다리도 잡수시오.”<\/td><td>음식과 신체를 겹쳐 떠올리게 하는 언어유희<\/td><\/tr><tr><td>출두 소리가 강산을 무너뜨리고 천지를 뒤집는 듯함<\/td><td>과장으로 출두의 기세를 강조<\/td><\/tr><tr><td>도장 궤 대신 음식, 갓 대신 밥상 등 뒤바뀐 행동<\/td><td>관리들의 당황과 무능을 희화화<\/td><\/tr><tr><td>“그 꼴이 가관이다.”<\/td><td>서술자의 직접 평가가 드러나는 편집자적 논평<\/td><\/tr><tr><td>“문 들어온다 바람 닫아라. 물 마르다 목 들여라.”<\/td><td>뒤섞인 말을 통해 극도의 당황을 해학적으로 제시<\/td><\/tr><\/tbody><\/table><\/div><p>운문과 산문이 섞이고, 열거와 율문적 표현이 나타난다. 풍자는 비판의 대상을 웃음거리로 만들고, 해학은 익살스러운 표현으로 웃음을 유발한다. 두 효과는 한 장면에서 함께 나타날 수 있다.<\/p>"},{"id":"values","title":"주제와 결말을 함께 판단하기","body":"<div class=\"callout purple\"><strong>함께 읽을 두 축<\/strong><p>신분을 초월한 사랑과 부당한 권력에 대한 저항은 기존 질서에 도전하는 면을 보인다. 정절을 인정받고 임금의 보상을 받는 결말은 유교적 가치와 기존 질서의 테두리도 드러낸다.<\/p><\/div><p>춘향이 몽룡의 수청 요구를 거절할 때, 춘향은 그가 자신의 남편인 줄 아직 모른다. 몽룡의 요구는 춘향의 마음을 확인하기 위한 시험이다. 변 사또의 수청 강요와 인물의 의도까지 같다고 보아서는 안 된다.<\/p>"}],"recall":[["관리들의 도망 장면을 길게 묘사하는 효과는?","권위 있던 관리들의 체면과 위엄을 무너뜨려 풍자와 해학을 강화한다."],["춘향은 출두 직후 몽룡의 정체를 알고 있는가?","수청을 거절하는 시점에는 정체를 모르며, 얼굴을 확인한 뒤 알아본다."]],"related":["story","mask","jeongeul"],"sources":["book66","book67","book68","book69","book70","book71","book72"],"sourceGroups":["chunhyang"],"sourcePageIds":["book66","book67","book68","book69","book70","book71","book72"]},{"id":"josin","title":"조신몽","category":"고전 문학","summary":"꿈속의 일생을 통해 세속적 욕망의 허망함을 깨닫기.","tags":["설화","현실–꿈–현실","깨달음"],"source":"프린트 1쪽","sections":[{"id":"frame","title":"현실–꿈–현실의 구조","body":"<ol class=\"flow\"><li>현실: 태수의 딸을 연모하고 관음보살을 원망함<\/li><li>꿈: 혼인·자녀·극심한 빈곤·자녀의 죽음·이별<\/li><li>꿈에서 깸: 욕망과 집착이 사라짐<\/li><li>현실: 미륵불을 모시고 정토사를 세움<\/li><\/ol><p>꿈의 시작에는 소원 성취가 있지만, 꿈 전체는 행복한 결혼 생활로 끝나지 않는다. 긴 고통을 체험한 뒤 가치관이 바뀌는 구조이다.<\/p>"},{"id":"meaning","title":"꿈의 기능과 전설적 성격","body":"<p>꿈속 수십 년은 현실의 하룻밤과 대비되어 서사 시간을 압축한다. 혼인이라는 욕망의 실현을 빈곤·상실·이별의 체험으로 뒤집어 <b>인생무상과 세속적 욕망의 허망함<\/b>을 드러낸다.<\/p><p>꿈에서 아이를 묻었던 자리에서 돌미륵이 발견되는 장면은 꿈과 현실을 연결한다. 낙산사·우현령·정토사 등 구체적 장소와 불교적 대상이 제시된다. 환몽 구조를 가진 후대 서사와 연결해서 살펴볼 수 있다.<\/p><div class=\"callout rose\"><strong>오독 주의<\/strong><p>꿈에서 깨어난 뒤 연모의 소원을 다시 비는 것이 아니다. 집착을 벗어나 수행과 신앙으로 향한다.<\/p><\/div>"}],"recall":[["꿈속에서 소원이 이루어졌는데 왜 고통을 길게 보여 줄까?","욕망의 성취가 지속적인 행복을 보장하지 못함을 체험하게 하여 깨달음을 이끌기 위해서다."]],"related":["story","dodo"],"sources":[],"sourceGroups":["josin"],"sourcePageIds":["print1"]},{"id":"baegun","title":"백운소설","category":"고전 문학","summary":"문인들의 일화가 가공된 패관 문학의 성격 파악하기.","tags":["패관 문학","문인 일화","시구"],"source":"프린트 2쪽","sections":[{"id":"events","title":"김부식과 정지상의 일화","body":"<ol class=\"flow\"><li>문장으로 이름난 두 문인의 불화<\/li><li>정지상의 시구를 갖고 싶어 하는 김부식<\/li><li>죽은 정지상의 귀신이 나타나 시구를 비판<\/li><li>뒷간에서 이어지는 문답과 김부식의 죽음<\/li><\/ol><p>정지상의 귀신은 “일천 가닥·일만 점”이라는 수량 표현을 문제 삼아 “가닥가닥·점점이”로 고친다. 수량의 정확성을 따지는 말과 시적 표현에 대한 평가가 결합한다.<\/p>"},{"id":"genre","title":"패관 문학으로 읽기","body":"<p>견문·일화 등을 모으고 서술자의 가공을 더한 이야기이다. 실존 문인이 등장한다고 해서 귀신의 행위까지 역사적 사실로 받아들이지 않는다. 문인들의 경쟁, 문장에 대한 자부심, 재치 있는 대화와 기이한 사건이 흥미를 만든다.<\/p><div class=\"callout purple\"><strong>제목의 ‘소설’<\/strong><p>오늘날의 현대 소설과 동일한 갈래를 곧바로 뜻하는 말로 보지 않는다. 여기서는 고려 시대 패관 문학의 사례로 읽는다.<\/p><\/div>"}],"recall":[["실존 인물이 등장하는데 왜 역사 기록과 구별해야 할까?","귀신의 출현과 복수 등 허구적·가공된 사건이 결합하기 때문이다."]],"related":["story","gongbang"],"sources":[],"sourceGroups":["baegun"],"sourcePageIds":["print2"]},{"id":"gongbang","title":"공방전","category":"고전 문학","summary":"돈의 일생으로 탐욕과 부패한 권력의 문제를 드러내기.","tags":["가전체","의인화","우의"],"source":"프린트 3쪽","sections":[{"id":"personification","title":"돈이 인물이 되는 방식","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">인물의 이력·성격<\/th><th scope=\"col\">돈과 연결되는 뜻<\/th><\/tr><\/thead><tbody><tr><td>공방의 자 ‘관지’<\/td><td>돈을 꿰는 성질을 떠올리게 함<\/td><\/tr><tr><td>조상들이 수양산 굴속에 삶<\/td><td>광물의 존재와 연결<\/td><\/tr><tr><td>성질이 강경하고 단련되지 못함<\/td><td>금속의 성질, 아직 널리 쓰이지 않는 돈<\/td><\/tr><tr><td>풀무에서 변화하고 광채를 냄<\/td><td>금속의 제련·주조<\/td><\/tr><tr><td>권세가를 드나들며 벼슬을 사고팔게 함<\/td><td>돈에 좌우되는 부패한 권력<\/td><\/tr><\/tbody><\/table><\/div><p>사물을 사람처럼 말하게 하는 데 그치지 않고 가계·행적을 전기의 형식으로 엮는다. 이것이 가전체의 핵심이다.<\/p>"},{"id":"criticism","title":"화폐의 폐해를 통한 현실 비판","body":"<p>공방은 백성과 작은 이익을 다투고, 곡식을 천대하며 자신을 귀하게 여긴다. 농업을 근본으로 보던 사회에서 상업적 이익만 좇게 하는 현상이 비판된다. 권세가와 결탁한 돈은 매관매직을 가능하게 한다.<\/p><p>비판의 초점은 돈을 숭배하는 탐욕과 그에 기대는 사회의 부패이다. 작품의 인물 평가를 현실의 돈·권력 관계와 연결하는 <b>우의적 읽기<\/b>가 필요하다.<\/p><div class=\"callout purple\"><strong>갈래 구별<\/strong><p>설화 속 돈 이야기가 아니라, 돈을 의인화하여 인물의 전기처럼 꾸민 가전체 문학이다.<\/p><\/div>"}],"recall":[["‘성질이 강경하다’를 단순한 성격 설명으로만 읽으면 놓치는 것은?","인물 뒤에 있는 금속·화폐의 물질적 성질과 의인화의 대응 관계를 놓친다."]],"related":["story","umbrella","climate"],"sources":[],"sourceGroups":["gongbang"],"sourcePageIds":["print3"]},{"id":"gimwon","title":"김원전","category":"고전 문학","summary":"압도적 적대자에 맞서는 무력·지략·조력의 차이 읽기.","tags":["영웅 소설","충군","여성 조력자"],"source":"프린트 4–6쪽 · 2024학년도 수능 수록","sections":[{"id":"conflict","title":"국가적 위기와 대응","body":"<ol class=\"flow\"><li>아귀가 신하들을 압도하고 세 공주를 데려감<\/li><li>황상이 김규를 다시 불러 조언을 구함<\/li><li>김규가 아들 원을 천거함<\/li><li>원이 계교를 마련하고 공주들과 협력함<\/li><\/ol><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">인물<\/th><th scope=\"col\">대응<\/th><\/tr><\/thead><tbody><tr><td>서경태·한세충<\/td><td>무력으로 정면 대결을 시도하지만 압도당함<\/td><\/tr><tr><td>황상·김규<\/td><td>정보와 인재를 구해 위기 해결의 실마리를 찾음<\/td><\/tr><tr><td>원<\/td><td>독한 술과 안주를 이용하는 계책을 세움<\/td><\/tr><tr><td>공주·시녀들<\/td><td>속마음을 숨기고 아귀를 안심시켜 술을 권하며 보검을 확보함<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"sword","title":"기둥을 베는 장면의 핵심","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">시험<\/th><th scope=\"col\">결과<\/th><th scope=\"col\">해석<\/th><\/tr><\/thead><tbody><tr><td>원의 칼<\/td><td>기둥이 반쯤 부러짐<\/td><td>기존 칼로는 계획을 성사시키기 어려움<\/td><\/tr><tr><td>아귀의 비수<\/td><td>썩은 풀이 베어지듯 쉽게 잘림<\/td><td>적대자의 무기를 활용해야 함을 확인<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout rose\"><strong>기출 함정<\/strong><p>이 시험은 원이 계획대로 자신의 초월적 능력을 과시한 장면이 아니다. 공주가 제안한 시험을 통해 무기의 성능 차이와 위험을 확인한다.<\/p><\/div>"},{"id":"speech","title":"대화와 인물의 역할","body":"<p>신하와 임금의 대화에는 위계와 충군의 가치가 드러난다. 공주들이 아귀를 걱정하고 찬양하는 듯 말하는 것은 그를 잠들게 하려는 실제 의도를 숨기는 말이다.<\/p><p>공주는 납치된 피해자이면서 해결 과정에 참여하는 조력자이다. 여성 인물을 수동적 대상으로만 단정하면 장면의 기능을 놓친다.<\/p>"}],"recall":[["공주가 아귀에게 술을 권하는 말과 진짜 의도는 어떻게 다른가?","겉으로는 회복과 승리를 기원하지만 실제로는 취하게 하고 잠들게 하여 원의 계획을 돕는다."]],"related":["jeongeul","chunhyang"],"sources":[],"sourceGroups":["gimwon"],"sourcePageIds":["print4","print5","print6"]},{"id":"jeongeul","title":"정을선전","category":"고전 문학","summary":"모략과 누명의 경로를 인물 관계와 정보의 흐름으로 풀기.","tags":["영웅·가정 소설","누명","소통"],"source":"프린트 7–9쪽 · 2025학년도 수능 수록","sections":[{"id":"people","title":"인물부터 정확히 구별하기","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">인물<\/th><th scope=\"col\">역할<\/th><\/tr><\/thead><tbody><tr><td>정을선<\/td><td>원수·승상으로도 불리는 동일 인물. 귀환하여 진상을 조사함<\/td><\/tr><tr><td>충렬부인<\/td><td>누명을 쓰고 고난을 당하는 인물<\/td><\/tr><tr><td>정렬부인<\/td><td>충렬부인을 해치려 모략을 꾸밈<\/td><\/tr><tr><td>금섬<\/td><td>충렬부인을 피신시키고 대신 죽음을 맞는 시비<\/td><\/tr><tr><td>월매<\/td><td>끝내 비밀을 말하지 않다가 정을선에게 구출을 요청함<\/td><\/tr><tr><td>금연<\/td><td>정렬부인의 시비. 남장하여 모략에 가담하고 나중에 진상을 말함<\/td><\/tr><tr><td>복록<\/td><td>왕비에게 참소한 인물. 정을선이 찾았을 때 이미 죽음<\/td><\/tr><tr><td>왕비<\/td><td>정을선의 어머니. 모략에 속았다가 진상을 알고 자책함<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"information","title":"사건 해결을 이끄는 정보의 흐름","body":"<ol class=\"flow\"><li>호첩이 전한 급보로 정을선이 귀환<\/li><li>죽을 위기의 월매를 구하고 충렬부인의 위치를 확인<\/li><li>왕비에게 제보의 경위를 질문<\/li><li>옥졸의 진술로 금연에게 수사를 집중<\/li><li>금연이 모략을 자백<\/li><li>황상에게 상소하여 처벌을 요청<\/li><\/ol><p>정을선이 처음부터 모든 진상을 알고 있던 것은 아니다. “이미 아는 바”는 앞서 전해 들은 사정과 관련되며, 이후 심문에서 새로 확인한 사실까지 모두 처음부터 알았다고 확대하면 안 된다.<\/p>"},{"id":"genre","title":"상투성과 변화가 함께 드러나는 서사","body":"<p>남주인공이 가정 밖의 전쟁과 가정 안의 갈등을 잇는다. 선악 구도가 뚜렷하고 고난·감정이 극대화된다. 일부다처제에서 생긴 갈등이 악한 개인의 인성 문제로 축소되는 한계도 읽을 수 있다.<\/p><p>한편 시비들은 모략에 가담하거나 주인을 구하는 능동적인 행위자로 등장한다. 상층 인물인 정렬부인이 호통 소리에 똥을 싸고 쓰러지는 모습은 위엄을 무너뜨리는 희화화이다.<\/p><div class=\"callout rose\"><strong>기출 함정<\/strong><p>월매는 매를 맞으면서 진실을 털어놓은 것이 아니다. 끝내 발설하지 않아 죽을 위기에 처했다.<\/p><\/div>"}],"recall":[["충렬부인과 정렬부인의 이름을 구별하는 방법은?","충렬부인은 누명의 피해자, 정렬부인은 모략을 꾸민 인물로 사건 역할을 먼저 대응시킨다."]],"related":["gimwon","chunhyang"],"sources":[],"sourceGroups":["jeongeul"],"sourcePageIds":["print7","print8","print9"]},{"id":"mask","title":"가면극","category":"고전 문학","summary":"말뚝이의 언어와 신할아비·미얄할미의 장면을 각각 읽기.","tags":["극 갈래","양반 풍자","무대 지시"],"source":"프린트 10쪽","sections":[{"id":"tongyeong","title":"통영 오광대: 양반과 말뚝이","body":"<p>양반들은 말뚝이를 불러 놀고자 한다. 말뚝이는 양반을 모시는 듯하면서도 거친 말, 과장된 열거, 한자어 표현과 조롱을 섞는다. 신분이 낮은 인물의 말이 높은 신분의 허위를 드러내는 전도가 웃음을 만든다.<\/p><p>지문에는 춤을 추며 등장하는 모습, 악기와 장단, 춤을 멈추는 행동이 제시된다. 대사만 읽지 말고 공연의 움직임·음악이 함께 사건을 구성한다는 점을 확인한다.<\/p>"},{"id":"yangju","title":"양주 별산대 놀이: 신할아비와 미얄할미","body":"<p>신할아비는 늙음을 탄식하고 미얄할미를 만난다. 미얄할미는 고개를 끄덕이거나 물건을 가리키는 행동으로도 응답한다. 부부의 재회가 화해로만 이어지지 않고 갈등과 원망을 드러내는 방향으로 전개된다.<\/p><p>이 발췌의 끝에는 신할아비가 죽으라고 반복하는 대사가 나타난다. 제공 범위 뒤의 사건을 이 장면 안에서 이미 일어난 일처럼 처리하지 않는다.<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">서사 문학<\/th><th scope=\"col\">극 문학<\/th><\/tr><\/thead><tbody><tr><td>서술자의 설명으로 인물·사건을 전달할 수 있음<\/td><td>대사와 행동, 무대 지시로 인물·사건을 보여 줌<\/td><\/tr><tr><td>읽는 사람이 서술을 통해 장면을 상상함<\/td><td>몸짓·음악·말투를 포함한 공연을 전제로 함<\/td><\/tr><\/tbody><\/table><\/div>"}],"recall":[["가면극 지문의 괄호 속 행동은 왜 중요한가?","인물의 반응, 장면의 리듬, 공연의 움직임을 대사와 함께 보여 주기 때문이다."]],"related":["story","chunhyang"],"sources":[],"sourceGroups":["mask"],"sourcePageIds":["print10"]},{"id":"dodo","title":"도도한 생활","category":"현대 소설","summary":"교과서의 유년 이야기부터 마지막 연주까지, 피아노의 의미 변화를 따라가기.","tags":["김애란","1인칭 주인공","공간·소재"],"source":"교과서 수록본 기준 · 82–84, 86–93, 95쪽 텍스트","sections":[{"id":"reading","title":"교과서 기준으로 읽는 순서","body":"<ol class=\"flow\"><li>유년: 피아노의 ‘도’를 배우고 손을 움직이는 법을 익힘<\/li><li>만둣집: 엄마의 지원과 피아노가 주는 문화적 기대<\/li><li>가세의 몰락: 피아노와 함께 서울 반지하로 이동<\/li><li>타자 노동·언니의 편입 준비·고립<\/li><li>폭우와 침수, 아빠의 금전 요청<\/li><li>더는 물을 퍼낼 수 없는 상황에서 피아노를 연주<\/li><\/ol><p>‘나’가 자기 경험과 생각을 전하는 1인칭 주인공 시점이다. 과거의 유년 경험을 돌아보는 서술과 서울에서 겪는 사건이 연결된다. 교과서의 중략 표시는 그대로 중략으로 이해한다.<\/p>"},{"id":"piano","title":"피아노의 의미가 바뀌는 과정","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">장면<\/th><th scope=\"col\">피아노의 의미와 기능<\/th><\/tr><\/thead><tbody><tr><td>처음 도를 배움<\/td><td>소리와 시간, 손의 움직임을 발견하는 즐거움<\/td><\/tr><tr><td>엄마가 피아노를 사 줌<\/td><td>가족의 애정과 희망, 보통의 삶과 문화에 대한 기대<\/td><\/tr><tr><td>가세가 기울어도 팔지 않음<\/td><td>과거의 삶을 기억하는 물건과 회복의 희망<\/td><\/tr><tr><td>서울로 옮기는 과정<\/td><td>체면과 희망을 지키려 하지만 현실의 부담도 됨<\/td><\/tr><tr><td>주인의 연주 금지·곰팡이<\/td><td>욕망이 현실의 제약에 가로막힌 상태<\/td><\/tr><tr><td>침수 속 마지막 연주<\/td><td>자신의 감각과 삶의 존엄을 지키려는 행위로 읽을 수 있음<\/td><\/tr><\/tbody><\/table><\/div><p>상징은 한 단어로 고정되지 않는다. 작품 앞뒤에서 피아노가 놓인 공간과 ‘나’의 태도가 어떻게 달라지는지 함께 본다.<\/p>"},{"id":"space","title":"공간과 인물의 삶","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">공간<\/th><th scope=\"col\">특징<\/th><th scope=\"col\">의미<\/th><\/tr><\/thead><tbody><tr><td>시골의 만둣집<\/td><td>주거와 생업이 한 공간에 있음<\/td><td>피아노의 우아함과 생계 노동이 공존<\/td><\/tr><tr><td>서울 반지하<\/td><td>곰팡이·습기·침수, 집주인의 통제<\/td><td>청년의 빈곤과 사회적 제약을 구체화<\/td><\/tr><tr><td>바라던 학교<\/td><td>사람들과 관계를 맺을 수 있는 곳<\/td><td>고립된 타자 노동을 벗어나고 싶은 바람<\/td><\/tr><\/tbody><\/table><\/div><p>주인집의 보수 공사 소리는 들리지만 ‘나’의 피아노 소리는 제지된다. 같은 소리라도 누가 내는가에 따라 허용 여부가 달라지는 관계를 주목한다. “지하는 원래 그렇다.”는 말은 열악한 현실을 당연하게 만드는 태도를 드러낸다.<\/p>"},{"id":"motifs","title":"손가락·말·기계의 대비","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">표현·소재<\/th><th scope=\"col\">읽을 방향<\/th><\/tr><\/thead><tbody><tr><td>체르니라는 말을 갖고 싶음<\/td><td>생계의 언어와 다른 문화적 세계를 동경함<\/td><\/tr><tr><td>피아노 건반과 컴퓨터 자판<\/td><td>같은 손가락의 움직임이 예술과 생계 노동으로 갈라짐<\/td><\/tr><tr><td>진보적인 컴퓨터 앞에서 굽는 등<\/td><td>기술의 발전과 인간다운 삶의 발전이 일치하지 않는 역설<\/td><\/tr><tr><td>“미래가 어떻게 완료되냐?”<\/td><td>문법 공부의 말이 불안한 미래에 대한 감각과 겹침<\/td><\/tr><tr><td>끝없이 문제를 입력하고 자신이 풀게 되는 꿈<\/td><td>삶의 과제에 쫓기는 노동의 반복과 불안<\/td><\/tr><tr><td>만두·오토바이·교재 등이 떠올랐다 터지는 환상<\/td><td>가족의 생계와 청춘을 둘러싼 기억·좌절이 겹쳐 나타남<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"ending","title":"제목과 결말: 해결보다 태도","body":"<div class=\"callout purple\"><strong>결말의 핵심<\/strong><p>피아노를 친다고 침수나 가난이 해결되지는 않는다. 그럼에도 연주하는 행위에서 현실에 눌리기만 하지 않으려는 태도, 감각의 회복과 자기 존엄을 읽을 수 있다.<\/p><\/div><p>‘도도’는 반복되는 음 ‘도’를 떠올리게 하고, 함부로 꺾이지 않는 태도의 의미와도 연결해 읽을 수 있다. 제목의 중의성을 결말의 행위와 연결해 설명하되, 성공이나 계층 상승이 확정되었다고 단정하지 않는다.<\/p><p>아빠의 전화는 안부로 시작하지만 결국 경제적 도움을 구하는 말로 이어진다. 위로가 절실한 ‘나’에게 가족의 부담이 더해지며 상황의 막막함이 심화된다.<\/p>"},{"id":"textbook","title":"교과서 원문 대조","body":"<p>원문·필기에는 제공된 교과서 12쪽을 순서대로 텍스트로 옮겼다. 별도 프린트의 축약본이나 추가 해석 주석을 이 작품의 기준 본문으로 사용하지 않았다.<\/p><div class=\"callout neutral\"><strong>원문 제공 범위<\/strong><p>82–84, 86–93, 95쪽 텍스트이 제공되었다. 85·94쪽은 제공되지 않아 본문을 임의로 복원하지 않았다.<\/p><\/div><button class=\"btn\" data-source-group=\"dodo\">교과서 원문 텍스트 읽기<\/button>"}],"recall":[["같은 손가락으로 피아노와 자판을 치는 장면이 드러내는 차이는?","즐거움과 표현의 움직임이 생계와 반복 노동의 움직임으로 바뀌었다가, 마지막 연주에서 다시 자신의 감각으로 돌아온다."],["마지막 연주를 낙관적 해결로만 볼 수 없는 까닭은?","비와 침수, 경제적 어려움은 계속되기 때문이다. 변화는 외적 조건의 해결보다 인물의 태도에서 읽어야 한다."]],"related":["obaltan","umbrella","slpeum","integration"],"sources":["book82","book83","book84","book86","book87","book88","book89","book90","book91","book92","book93","book95"],"sourceGroups":["dodo"],"sourcePageIds":["book82","book83","book84","book86","book87","book88","book89","book90","book91","book92","book93","book95"]},{"id":"umbrella","title":"매우 잘생긴 우산 하나","category":"현대 소설","summary":"허구적 권력 표지에 대한 타인의 승인이 만들어 낸 자신감 읽기.","tags":["윤흥길","소시민","권력의 승인"],"source":"프린트 16–17쪽 · 2022학년도 수능 수록","sections":[{"id":"behavior","title":"우산을 둘러싼 행동의 변화","body":"<ol class=\"flow\"><li>무전기처럼 보이는 우산 케이스를 지님<\/li><li>사람들의 반응을 여러 방식으로 시험함<\/li><li>외양을 바꾸고 권력자처럼 행동함<\/li><li>시위 현장에서 학생을 거칠게 다루지 말라고 항의<\/li><li>사복 청년에게 제지당하고 물러남<\/li><\/ol><p>서술자는 김달채의 목적 있는 행동들을 나열하고 심리를 드러낸다. 그는 실제 권력을 얻은 것이 아니라, 사람들이 우산을 무전기로 오인할 때 생기는 대우의 변화를 이용한다.<\/p>"},{"id":"approval","title":"세 가지 관찰과 권력의 작동","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">김달채의 발견<\/th><th scope=\"col\">의미<\/th><\/tr><\/thead><tbody><tr><td>거개의 서민이 우산에 속음<\/td><td>물건의 외양이 권력의 표지로 읽힘<\/td><\/tr><tr><td>무전기를 지녔다고 생각하면 태도가 낮아짐<\/td><td>타인의 인정·승인이 우열 관계를 만듦<\/td><\/tr><tr><td>끝부분만 슬쩍 보여 줄 때 더 효과적임<\/td><td>감추기와 암시도 권위 연출에 작용함<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout purple\"><strong>우산과 비표<\/strong><p>우산은 김달채가 이용하는 허구적 권력 표지이다. 사복 청년의 비표는 실제 시위 진압 현장의 소속·권력과 연결된다.<\/p><\/div>"},{"id":"ending","title":"항의와 후퇴를 함께 읽기","body":"<p>항의하는 순간에는 타인에게 승인받은 경험에서 나온 자신감이 드러난다. 그러나 자신도 닭장차에 실릴 수 있다는 말을 듣자 물러선다. 행동의 전후를 함께 보아야 소시민적 한계를 파악할 수 있다.<\/p><p>청년이 우산의 속임수를 정확히 알아챘다는 것은 본문으로 확정할 수 없다. 그는 우산을 거들떠보지 않았을 뿐이다. 또 김달채와 학생들 사이에 지속적인 유대가 형성되었다고 볼 근거도 부족하다.<\/p><div class=\"callout rose\"><strong>주제<\/strong><p>권력에 민감하게 반응하고 상황에 따라 태도를 바꾸는 소시민의 타산성과 허위를 비판한다.<\/p><\/div>"}],"recall":[["우산의 힘은 물건 자체에서 나오는가?","아니다. 타인이 그것을 권력의 표지로 받아들이고 대우할 때 관계 속에서 작동한다."]],"related":["gongbang","obaltan","dodo","integration"],"sources":[],"sourceGroups":["umbrella"],"sourcePageIds":["print16","print17"]},{"id":"obaltan","title":"오발탄","category":"현대 소설","summary":"전후 빈곤 속 윤리와 생존의 충돌, 소설과 시나리오의 차이 읽기.","tags":["이범선","전후 현실","매체 비교"],"source":"프린트 18–23쪽 · 소설 / 이종기 각색 시나리오","sections":[{"id":"family","title":"가족과 현실의 조건","body":"<p>해방촌 판잣집에서 살아가는 송철호는 사무실 서기로 일하지만 생계를 감당하기 어렵다. 고향으로 가자고 하는 어머니, 만삭의 아내, 딸, 취직하지 못한 동생 영호, 누이 명숙의 삶에 전쟁과 빈곤의 상처가 겹친다.<\/p><p>서술자는 철호가 자신을 사냥꾼에 빗대어 상상하는 장면과 내면을 전한다. 풍족한 사냥감은커녕 남이 버린 내장을 주워 오는 자신의 모습을 떠올리는 데서 무력감과 울분이 드러난다.<\/p>"},{"id":"ethics","title":"철호와 영호의 가치관 충돌","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">철호<\/th><th scope=\"col\">영호<\/th><\/tr><\/thead><tbody><tr><td>가난하더라도 양심과 윤리를 지키려 함<\/td><td>살기 위해 양심·윤리·관습·법률의 테두리를 벗어나자고 함<\/td><\/tr><tr><td>규범을 버린 삶을 비판함<\/td><td>규범에 얽매인 삶이 가족에게 큰 희생을 강요한다고 비판함<\/td><\/tr><tr><td>아픈 충치를 치료할 비용조차 없음<\/td><td>고통을 참고 필수 지출을 줄이는 것을 소득처럼 여길 수 없다고 주장함<\/td><\/tr><\/tbody><\/table><\/div><p>작품은 이 대립을 통해 부조리한 전후 현실을 드러낸다. 영호의 말을 작품 전체의 정답이나 작가의 직접 주장으로 곧바로 동일시하지 않는다.<\/p>"},{"id":"metaphors","title":"영호의 비유를 해석하기","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">대상<\/th><th scope=\"col\">빗댄 것<\/th><th scope=\"col\">영호의 판단<\/th><\/tr><\/thead><tbody><tr><td>양심<\/td><td>손끝의 가시<\/td><td>제거하면 편해질 불편한 제약<\/td><\/tr><tr><td>윤리<\/td><td>속이 비치는 나일론 속옷<\/td><td>있어도 실효가 없다고 비꼼<\/td><\/tr><tr><td>관습<\/td><td>소녀의 머리 리본<\/td><td>있으면 보기 좋지만 필수적이지 않음<\/td><\/tr><tr><td>법률<\/td><td>허수아비<\/td><td>약한 자에게만 위협적이라고 봄<\/td><\/tr><tr><td>까마귀 / 참새<\/td><td>법을 두려워하지 않는 자 / 두려워하는 자<\/td><td>기존 도덕적 판단을 뒤집는 논리를 폄<\/td><\/tr><\/tbody><\/table><\/div><p>낡은 무명 양말을 반복해 살 수밖에 없는 철호는, 더 오래 가는 나일론 양말을 살 목돈조차 없다. 사소한 물건이 가난의 구조를 구체적으로 보여 준다.<\/p>"},{"id":"scenario","title":"소설과 시나리오: 같은 갈등을 다르게 전달","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">소설 발췌<\/th><th scope=\"col\">시나리오 발췌<\/th><\/tr><\/thead><tbody><tr><td>서술과 대화로 인물의 심리를 직접 제시<\/td><td>장면 번호·지시문·대사·음향·화면 전환으로 제시<\/td><\/tr><tr><td>철호와 영호의 대립과 비유를 자세히 제시<\/td><td>서로 다른 공간을 인물의 이동과 이어지는 목소리로 연결<\/td><\/tr><tr><td>서술자가 사건과 내면을 전달<\/td><td>보이고 들리는 장면으로 내면을 간접 드러냄<\/td><\/tr><\/tbody><\/table><\/div><p><b>O·L(오버랩)<\/b>은 다음 화면이 앞 화면과 겹치며 전환되는 기법이다. #69에서는 아내의 고생하는 현재와 학창·결혼 시절을 연결한다. <b>Ⓔ<\/b> 표시는 화면에 삽입된 음향을 나타내며, #73·#75에서는 화면 밖 인물들의 대화가 서로 다른 공간을 잇는다.<\/p><p>#70의 침묵하는 철호와 황홀한 시가지는 대비된다. #71의 영호가 택시 운전수에게 돈을 주는 모습과 이어지는 대화는 철호와 다른 태도를 보여 준다.<\/p><div class=\"callout neutral\"><strong>문항의 제공 범위<\/strong><p>원자료의 비교 문항 일부는 별도의 (가) 지문을 참조한다. 이 학습실에서는 제공된 「오발탄」만으로 판단할 수 있는 내용과 매체 차이를 다룬다.<\/p><\/div>"}],"recall":[["영호가 법률을 허수아비에 빗댄 이유는?","참새처럼 약한 자는 두려워하지만 까마귀처럼 대담한 자는 무시하는 규범으로 보기 때문이다."],["화면 밖 대화가 서로 다른 장소를 이어 주는 예는?","#73의 부엌, #74의 방, #75의 골목이 철호·영호의 이어지는 목소리로 연결된다."]],"related":["dodo","umbrella","integration"],"sources":[],"sourceGroups":["obaltan","obaltan-play"],"sourcePageIds":["print18","print19","print20","print21","print22","print23"]},{"id":"seongtan","title":"성탄제","category":"현대 시","summary":"눈과 붉은 이미지, 과거와 현재를 잇는 아버지의 사랑.","tags":["김종길","감각적 이미지","부성애"],"source":"프린트 24쪽","sections":[{"id":"scene","title":"현재에서 되살아난 과거","body":"<ol class=\"flow\"><li>현재의 성탄제 가까운 도시에서 눈을 봄<\/li><li>어릴 적 앓던 밤과 아버지를 회상<\/li><li>현재에도 자신의 혈액 속에 흐르는 사랑을 느낌<\/li><\/ol><p>시의 제시 순서에서는 병든 어린 시절의 장면을 먼저 보여 준 뒤 성장한 현재로 옮겨 간다. 현재의 눈이 과거의 눈을 환기하여 두 시간을 연결한다.<\/p>"},{"id":"images","title":"차갑고 붉은 것의 관계","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">이미지<\/th><th scope=\"col\">효과<\/th><\/tr><\/thead><tbody><tr><td>눈·아버지의 서느런 옷자락<\/td><td>추위와 촉각을 환기하지만 아버지의 헌신과 연결됨<\/td><\/tr><tr><td>빠알간 숯불·붉은 산수유·혈액<\/td><td>생명과 사랑의 지속을 감각적으로 형상화<\/td><\/tr><tr><td>한 마리 어린 짐승<\/td><td>연약하면서 본능적으로 아버지에게 기대는 어린 ‘나’<\/td><\/tr><tr><td>서러운 서른 살·옛것 없는 도시<\/td><td>현재의 상실감과 과거 사랑에 대한 그리움을 드러냄<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout rose\"><strong>제목과 가치<\/strong><p>성탄제의 거룩한 탄생 이미지가 할머니와 아버지 덕에 살아난 어린 생명과 겹친다. 붉은 열매가 혈액 속에 녹아 흐른다는 표현은 사랑과 생명력이 현재에도 지속됨을 드러낸다.<\/p><\/div>"},{"id":"poem","title":"원문 읽기","body":"<div class=\"poem\">어두운 방 안엔\n빠알간 숯불이 피고,\n외로이 늙으신 할머니가\n애처로이 잦아드는 어린 목숨을 지키고 계시었다.\n이윽고 눈 속을\n아버지가 약을 가지고 돌아오시었다.\n아 아버지가 눈을 헤치고 따 오신\n그 붉은 산수유 열매\n나는 한 마리 어린 짐승,\n젊은 아버지의 서느런 옷자락에\n열로 상기한 볼을 말없이 부비는 것이었다.\n이따금 뒷문을 눈이 치고 있었다.\n그날 밤이 어쩌면 성탄제의 밤이었을지도 모른다.\n어느새 나도\n그때의 아버지만큼 나이를 먹었다.\n옛것이라곤 찾아볼 길 없는\n성탄제 가까운 도시에는\n이제 반가운 그 옛날의 것이 내리는데,\n서러운 서른 살 나의 이마에\n불현듯 아버지의 서느런 옷자락을 느끼는 것은,\n눈 속에 따 오신 산수유 붉은 알알이\n아직도 내 혈액 속에 녹아 흐르는 까닭일까.<\/div>"}],"recall":[["서느런 옷자락은 아버지의 냉정함을 뜻하는가?","아니다. 눈을 헤치고 약을 구해 온 아버지의 옷에서 느끼는 촉각이며, 사랑과 보호의 기억에 연결된다."]],"related":["chanbab","slpeum","heungbu","integration"],"sources":[],"sourceGroups":["seongtan"],"sourcePageIds":["print24"]},{"id":"slpeum","title":"그날 나는 슬픔도 배불렀다","category":"현대 시","summary":"가족의 희생에 대한 미안함과 타인의 삶에 대한 공감을 읽기.","tags":["함민복","역설","서사적 전개"],"source":"프린트 25쪽","sections":[{"id":"events","title":"한 끼의 식사로 모이는 감정","body":"<ol class=\"flow\"><li>‘나’의 등록금을 위해 형님네가 전세방에서 사글셋방으로 이사<\/li><li>이삿짐을 옮기며 집안 형편과 형의 희생을 느낌<\/li><li>중국집의 젊은 부부가 일하는 모습을 봄<\/li><li>자장면을 다 먹고 육체적 포만과 슬픔을 함께 느낌<\/li><\/ol><p>화자는 형의 희생에 미안함을 느낀다. 연약한 밀가루 반죽으로 튼튼한 미래를 꿈꾸듯 일하는 젊은 부부의 모습은 아름답고도 안타깝게 다가온다. 다른 사람의 노동을 보며 자신의 삶을 넘어 공감하는 시선이 드러난다.<\/p>"},{"id":"paradox","title":"대비와 역설의 작용","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">표현<\/th><th scope=\"col\">의미<\/th><\/tr><\/thead><tbody><tr><td>연약한 반죽 / 튼튼한 미래<\/td><td>현재의 어려움과 미래에 대한 희망의 대비<\/td><\/tr><tr><td>명랑한 젊은 부부 / 슬픔을 느끼는 화자<\/td><td>태도와 정서의 대비<\/td><\/tr><tr><td>“눈물처럼 아름다워”<\/td><td>아름다움과 슬픔이 함께 느껴지는 복합 정서<\/td><\/tr><tr><td>“슬픔도 배불렀다”<\/td><td>배부름의 감각으로 가득 찬 슬픔을 표현하는 역설<\/td><\/tr><\/tbody><\/table><\/div><p>마지막의 배부름을 단순히 음식을 많이 먹어 만족했다는 뜻으로 축소하지 않는다. 자장면을 남기기 미안한 마음에는 젊은 부부의 노동을 존중하는 시선도 담긴다.<\/p>"},{"id":"poem","title":"원문 읽기","body":"<div class=\"poem\">아래층에서 물 틀면 단수가 되는\n좁은 계단을 올라야 하는 전세방에서\n만학을 하는 나의 등록금을 위해\n사글셋방으로 이사를 떠나는 형님네\n달그락거리던 밥그릇들\n베니어판으로 된 농짝을 리어카로 나르고\n집안 형편을 적나라하게 까 보이던 이삿짐\n가슴이 한참 덜컹거리고 이사가 끝났다\n형은 시장 골목에서 자장면을 시켜주고\n쉽게 정리될 살림살이를 정리하러 갔다\n나는 전날 친구들과 깡소주를 마신 대가로\n냉수 한 대접으로 조갈증을 풀면서\n자장면을 앞에 놓고\n이상한 중국집 젊은 부부를 보았다\n바쁜 점심시간 맞춰 잠자주는 아기를 고마워하며\n젊은 부부는 밀가루, 그 연약한 반죽으로\n튼튼한 미래를 꿈꾸듯 명랑하게 전화를 받고\n서둘러 배달을 나아갔다\n나는 그 모습이 눈물처럼 아름다워\n물배가 부른데도 자장면을 남기기 미안하여\n마지막 면발까지 다 먹고 나니\n더부룩하게 배가 불렀다, 살아간다는 게\n그날\n나는 분명 슬픔도 배불렀다<\/div>"}],"recall":[["화자가 자장면을 남기지 않은 마음에는 무엇이 담기는가?","젊은 부부의 성실한 노동에 대한 공감과 미안함, 그 삶을 존중하는 태도가 담긴다."]],"related":["dodo","seongtan","chanbab","integration"],"sources":[],"sourceGroups":["slpeum"],"sourcePageIds":["print25"]},{"id":"chanbab","title":"찬밥","category":"현대 시","summary":"혼자 먹는 찬밥에서 어머니의 사랑과 소외를 되짚기.","tags":["문정희","중의성","그리움"],"source":"프린트 26쪽","sections":[{"id":"contrast","title":"찬밥과 따스한 사랑","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">현재의 ‘나’<\/th><th scope=\"col\">회상 속 그녀<\/th><\/tr><\/thead><tbody><tr><td>아픈 몸을 일으켜 혼자 찬밥을 먹음<\/td><td>가족에게 따스한 밥을 지어 주고 자신은 찬밥을 먹음<\/td><\/tr><tr><td>찬밥의 차가움과 외로움을 느낌<\/td><td>남은 음식과 이 빠진 그릇을 감수하면서 사랑을 베풂<\/td><\/tr><tr><td>찬밥 속에서 그녀를 만남<\/td><td>부재 속에서도 기억과 사랑으로 현재에 되살아남<\/td><\/tr><\/tbody><\/table><\/div><p>전기 제품을 이용하면 쉽게 밥을 데울 수 있는데도 찬밥을 먹는다. 기술이 부족해서 차가운 밥을 먹는 상황이라기보다, 몸의 아픔과 고독 속에서 어머니를 떠올리는 행위로 읽는다.<\/p>"},{"id":"meaning","title":"차가운 음식에서 사회적 소외로","body":"<p>“찬밥 속에 서릿발이 목을 쑤신다.”는 차갑고 날카로운 감각으로 몸과 마음의 고통을 구체화한다. 차가운 밥과 “제일 따스한 사랑”의 대비는 어머니의 희생을 강조한다.<\/p><p>“세상의 찬밥이 되어”에서 찬밥은 식은 음식뿐 아니라 소외되고 대접받지 못하는 처지를 떠올리게 한다. ‘나’가 비슷한 처지에서 어머니를 이해하며 그리움을 느끼는 결말이다.<\/p>"},{"id":"poem","title":"원문 읽기","body":"<div class=\"poem\">아픈 몸 일으켜 혼자 찬밥을 먹는다\n찬밥 속에 서릿발이 목을 쑤신다\n부엌에는 각종 전기 제품이 있어\n일 분만 단추를 눌러도 따끈한 밥이 되는 세상\n찬밥을 먹기도 쉽지 않지만\n오늘 혼자 찬밥을 먹는다\n가족에겐 따스한 밥 지어 먹이고\n찬밥을 먹던 사람\n이 빠진 그릇에 찬밥 훑어\n누가 남긴 무 조각에 생선 가시를 핥고\n몸에서는 제일 따스한 사랑을 뿜던 그녀\n깊은 밤에도\n혼자 달그락거리던 그 손이 그리워\n나 오늘 아픈 몸 일으켜 찬밥을 먹는다\n집집마다 신을 보낼 수 없어\n신 대신 보냈다는 설도 있지만\n홀로 먹는 찬밥 속에서 그녀를 만난다\n나 오늘\n세상의 찬밥이 되어<\/div>"}],"recall":[["‘찬밥’의 두 의미를 구별하면?","문자적으로는 식은 밥이며, 결말에서는 소외되고 대접받지 못하는 존재의 처지로 확장된다."]],"related":["seongtan","slpeum","heungbu","integration"],"sources":[],"sourceGroups":["chanbab"],"sourcePageIds":["print26"]},{"id":"heungbu","title":"흥부 부부상","category":"현대 시","summary":"박을 가르기 전의 웃음에서 가난을 넘어서는 사랑의 가치를 찾기.","tags":["박재삼","고전의 재해석","반복"],"source":"프린트 27쪽","sections":[{"id":"moment","title":"시선이 머무는 순간","body":"<div class=\"callout rose\"><strong>박을 가르기 전<\/strong><p>시가 주목하는 것은 보물을 얻은 뒤의 부유함이 아니다. 박을 가르기 전에 서로를 바라보며 나눈 웃음과 눈물이다.<\/p><\/div><p>“금이 문제리, / 황금 벼 이삭이 문제리,”는 물질이 중요하겠느냐는 반문이다. 이어 “그것이 확실히 문제다.”라고 하며 웃음과 부부애의 가치를 강조한다.<\/p>"},{"id":"images","title":"웃음과 눈물이 함께 흐르는 장면","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">표현<\/th><th scope=\"col\">읽기<\/th><\/tr><\/thead><tbody><tr><td>웃음의 물살<\/td><td>웃음을 맑고 반짝이는 물의 이미지로 형상화<\/td><\/tr><tr><td>서로 구슬을 나눔<\/td><td>서로의 처지를 가엾게 여기며 흘리는 눈물을 구슬에 빗댐<\/td><\/tr><tr><td>같이 웃어 비추던 거울 면들<\/td><td>서로의 감정에 공감하고 비추어 주는 관계<\/td><\/tr><tr><td>“헤아려 보라”의 반복<\/td><td>독자에게 부부의 내면과 가치를 생각하도록 요청<\/td><\/tr><\/tbody><\/table><\/div><p>가난을 아무 고통도 없는 상태로 미화하는 것이 아니다. 가난 속에서 서로를 불쌍히 여기고 위로하는 관계의 아름다움을 발견한다.<\/p>"},{"id":"poem","title":"원문 읽기","body":"<div class=\"poem\">흥부 부부가 박덩이를 사이하고\n가르기 전에 건넨 웃음살을 헤아려 보라.\n금이 문제리,\n황금 벼 이삭이 문제리,\n웃음의 물살이 반짝이며 정갈하던\n그것이 확실히 문제다.\n없는 떡방아 소리도\n있는 듯이 드러내고\n손발 닳은 처지끼리\n같이 웃어 비추던 거울 면들아.\n웃다가 서로 불쌍해\n서로 구슬을 나누었으리.\n그러다 금시\n절로 면(面)에 온 구슬까지를 서로 부끄리며\n먼 물살이 가다가 소스라쳐 반짝이듯\n서로 소스라쳐\n본 웃음 물살을 지었다고 헤아려 보라.\n그것은 확실히 문제다.<\/div>"}],"recall":[["구슬을 금은보화로 보면 왜 해석이 어긋나는가?","박을 가르기 전 서로 불쌍해하는 장면에서 나누는 것은 눈물이며, 시는 물질보다 사랑의 가치를 강조한다."]],"related":["chunhyang","slpeum","chanbab","integration"],"sources":[],"sourceGroups":["heungbu"],"sourcePageIds":["print27"]},{"id":"climate","title":"탈탄소 경쟁력이 국가 경쟁력이 되는 시대","category":"독서","summary":"세 가지 무역 질서를 통해 주장·근거·대응의 연결을 읽기.","tags":["홍종호","논설문","RE100·ESG·CBAM"],"source":"교과서 115–118쪽","sections":[{"id":"argument","title":"글의 주장과 전개","body":"<div class=\"callout teal\"><strong>중심 주장<\/strong><p>탈탄소 경쟁력이 기업과 국가 경쟁력의 핵심이 되는 흐름에 맞추어, 우리 경제 주체들의 인식과 행동을 바꾸어야 한다.<\/p><\/div><ol class=\"flow\"><li>서론: 기후 위기로 자본과 무역 질서가 바뀐다고 진단<\/li><li>본론: 기업·국제 금융 시장·국가 정책의 세 관점 제시<\/li><li>결론: 한국의 대응 필요성과 인식·행동 전환 촉구<\/li><\/ol><p>이 글의 “향후 10년” 등은 글이 쓰인 시점에서의 전망이다. 현재의 정책 시행 일정이나 세율을 새로 설명하는 자료와 구별하여, 지문에 제시된 논리와 근거를 읽는다.<\/p>"},{"id":"three","title":"RE100·ESG·CBAM을 구별하기","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">구분<\/th><th scope=\"col\">행위 주체·관점<\/th><th scope=\"col\">핵심 내용<\/th><th scope=\"col\">대응하지 않을 때<\/th><\/tr><\/thead><tbody><tr><td>RE100<\/td><td>글로벌 기업·공급망<\/td><td>사용 전력을 재생 에너지 전력 100%로 충당하겠다는 약속. 공급망의 다른 기업에도 요구가 확산됨<\/td><td>재생 에너지 전력을 쓰지 못하면 납품·수출이 어려워질 수 있음<\/td><\/tr><tr><td>ESG 투자<\/td><td>국제 금융 시장·소비자·투자자<\/td><td>환경(E)·사회(S)·지배 구조(G) 등 비재무적 성과를 고려한 투자<\/td><td>투자가 중단되거나 투자금이 회수될 수 있음<\/td><\/tr><tr><td>CBAM<\/td><td>국가 정책·유럽 연합<\/td><td>수입 제품에 대해 국가 간 탄소 비용의 차이를 조정하는 제도<\/td><td>탄소 비용 증가로 수출 단가와 경쟁력에 부담이 생길 수 있음<\/td><\/tr><\/tbody><\/table><\/div><p>RE100의 100%는 모든 원료나 모든 에너지가 아니라 <b>전력의 재생 에너지 조달<\/b>과 연결된다. ESG 투자도 재무 성과를 전혀 보지 않는다는 뜻이 아니다. 비재무적 요소를 중요하게 고려한다는 뜻이다.<\/p>"},{"id":"reasons","title":"도덕적 책임과 경제적 유인","body":"<p>글쓴이는 금융 시장의 변화가 도덕적 책무 때문이냐고 묻고, 그것만으로 설명하지 않는다. 소비자·투자자의 선호와 의사 결정 기준이 달라진 것이 더 중요하다고 설명한다.<\/p><p>과거에는 환경 설비 투자를 원가 상승과 경쟁력 약화로 여겼지만, 이제는 적은 탄소 배출 자체가 경쟁력의 핵심이 된다는 인식 전환이 강조된다. 문답법은 독자의 질문을 예상하고 답하면서 논리를 선명하게 한다.<\/p>"},{"id":"cbam","title":"탄소 비용 차액을 직접 비교하기","body":"<p>같은 배출량의 제품이라도 국내에서 부담한 탄소 비용이 수입국보다 적다면 차액 부담이 생기는 원리를 설명한다. 아래는 지문의 원리를 단순화한 학습 예시이며 실제 제도 계산식이 아니다.<\/p><div class=\"simulator\"><label>수입국의 톤당 탄소 비용<input id=\"carbon-eu\" type=\"number\" min=\"0\" max=\"1000000\" value=\"20\" inputmode=\"decimal\"><\/label><label>생산국에서 낸 톤당 비용<input id=\"carbon-home\" type=\"number\" min=\"0\" max=\"1000000\" value=\"10\" inputmode=\"decimal\"><\/label><label>제품의 탄소 배출량(톤)<input id=\"carbon-ton\" type=\"number\" min=\"0\" max=\"1000000\" value=\"1\" inputmode=\"decimal\"><\/label><output id=\"carbon-result\" aria-live=\"polite\"><\/output><\/div><p>차액 부담은 생산국의 탄소 비용을 높이거나 탄소 배출량을 줄이면 달라진다. 글의 필기는 탄소 관련 재원을 국내 탈탄소 설비 투자에 쓰는 대응도 연결한다.<\/p>"}],"recall":[["세 약어를 세 관점에 대응시키면?","RE100은 글로벌 기업과 공급망, ESG는 금융 시장과 투자 판단, CBAM은 국가 간 탄소 비용 조정 정책이다."],["환경에 투자하면 경쟁력이 낮아진다는 생각을 글쓴이는 어떻게 바꾸는가?","탈탄소 능력이 거래·투자·수출의 조건이 되므로 오히려 경쟁력을 좌우하는 핵심이라고 본다."]],"related":["integration","gongbang"],"sources":["book115","book116","book117","book118"],"sourceGroups":["climate"],"sourcePageIds":["book115","book116","book117","book118"]},{"id":"historylang","title":"언어의 역사성과 국어의 역사","category":"국어사","summary":"말이 변하는 원리와 시대 구분, 창제·반포의 차이 익히기.","tags":["언어의 특성","국어사","1443·1446"],"source":"교과서 153쪽","sections":[{"id":"traits","title":"언어의 특성을 구별하기","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">특성<\/th><th scope=\"col\">뜻<\/th><th scope=\"col\">판단 기준<\/th><\/tr><\/thead><tbody><tr><td>자의성<\/td><td>말소리와 의미 사이에 필연적 관계가 없음<\/td><td>같은 대상을 언어마다 다른 소리로 표현함<\/td><\/tr><tr><td>사회성<\/td><td>언어는 공동체의 사회적 약속임<\/td><td>개인이 마음대로 약속을 바꾸면 소통하기 어려움<\/td><\/tr><tr><td>역사성<\/td><td>언어가 시간의 흐름에 따라 변함<\/td><td>소리·표기·의미·문법 요소의 과거와 현재가 다름<\/td><\/tr><tr><td>창조성<\/td><td>제한된 언어 요소로 새로운 표현을 만들어 냄<\/td><td>전에 듣지 못한 문장도 만들고 이해할 수 있음<\/td><\/tr><\/tbody><\/table><\/div><p>사회성이 있다고 해서 언어가 영원히 고정되는 것은 아니다. 개인이 마음대로 바꾸기 어렵다는 것과 공동체의 언어가 오랜 시간에 걸쳐 변한다는 것은 함께 성립한다.<\/p>"},{"id":"period","title":"교과서가 제시한 국어사 구분","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">시기<\/th><th scope=\"col\">범위<\/th><\/tr><\/thead><tbody><tr><td>고대 국어<\/td><td>일반적으로 신라 말까지<\/td><\/tr><tr><td>중세 국어<\/td><td>고려 건국부터 16세기 말까지<\/td><\/tr><tr><td>전기 / 후기 중세 국어<\/td><td>교과서에서는 한글 창제(1443)를 기준으로 구분<\/td><\/tr><tr><td>근대 국어<\/td><td>17세기부터 19세기까지<\/td><\/tr><tr><td>현대 국어<\/td><td>그 이후 오늘날까지<\/td><\/tr><\/tbody><\/table><\/div><p>시대 구분은 학술적 기준에 따라 달라질 수 있으므로 이 학습실에서는 제공된 교과서의 기준을 따른다. 한글 창제 이전에도 우리말은 존재했다. 문자 체계의 창제와 언어 자체의 탄생을 혼동하지 않는다.<\/p>"},{"id":"creation","title":"창제·반포·수록의 시점","body":"<ol class=\"flow\"><li>1443년: 훈민정음 창제<\/li><li>1446년: 훈민정음 반포<\/li><li>1459년: 『월인석보』에 수록된 언해 서문<\/li><\/ol><p>「세종어제훈민정음」은 한글 창제의 뜻을 밝힌 서문을 우리말로 풀어 쓴 자료이다. ‘어제’는 임금이 지었다는 뜻이다. 중세 국어를 알 수 있는 대표 자료이지만, 서문이 『월인석보』에 실린 해와 창제 연도를 같게 보지 않는다.<\/p>"}],"recall":[["언어의 사회성과 역사성은 모순되는가?","아니다. 개인은 사회의 약속을 함부로 바꿀 수 없지만, 공동체의 언어는 시간에 따라 변할 수 있다."]],"related":["hunmin","integration"],"sources":["book153"],"sourceGroups":["language"],"sourcePageIds":["book153"]},{"id":"hunmin","title":"세종어제훈민정음과 중세 국어","category":"국어사","summary":"창제 정신과 표기·음운·문법·어휘의 변화를 원문 근거로 분석하기.","tags":["중세 국어","연철","조사·어미"],"source":"교과서 154쪽 본문·필기","sections":[{"id":"purpose","title":"서문을 논리의 흐름으로 읽기","body":"<ol class=\"flow\"><li>우리말이 중국과 다르고 한자와 잘 통하지 않음<\/li><li>백성이 뜻을 표현하지 못하는 어려움을 겪음<\/li><li>이를 가엾게 여겨 새 스물여덟 글자를 만듦<\/li><li>누구나 쉽게 익혀 일상에서 편리하게 쓰게 하려 함<\/li><\/ol><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">창제 정신<\/th><th scope=\"col\">근거와 연결<\/th><\/tr><\/thead><tbody><tr><td>자주 정신<\/td><td>중국과 다른 우리말의 특성을 인식함<\/td><\/tr><tr><td>애민 정신<\/td><td>뜻을 펴지 못하는 백성을 가엾게 여김<\/td><\/tr><tr><td>창조 정신<\/td><td>새 문자 스물여덟 글자를 만듦<\/td><\/tr><tr><td>실용 정신<\/td><td>쉽게 익혀 날마다 쓰기에 편하도록 함<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"writing","title":"표기와 음운: 지금과 다른 요소","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">중세 국어 자료에서의 특징<\/th><th scope=\"col\">구별할 점<\/th><\/tr><\/thead><tbody><tr><td>옛 자모<\/td><td>ㆍ(아래아), ㅿ(반치음), ㆁ(옛이응), ㆆ(여린히읗) 등의 흔적<\/td><td>현대 표준 국어에서 같은 방식으로 모두 쓰이지 않음<\/td><\/tr><tr><td>연철<\/td><td>받침 있는 말 뒤에 모음으로 시작하는 요소가 오면 이어 적음<\/td><td>표기 방식과 음운 변화 자체를 구별함<\/td><\/tr><tr><td>방점<\/td><td>글자 왼쪽 점으로 성조를 표시: 무점=평성, 한 점=거성, 두 점=상성<\/td><td>강조점이나 문장 부호가 아님<\/td><\/tr><tr><td>8종성법<\/td><td>받침에 ㄱ·ㄴ·ㄷ·ㄹ·ㅁ·ㅂ·ㅅ·ㆁ을 사용<\/td><td>현대의 음절 끝 발음 7개와 그대로 같지 않음<\/td><\/tr><tr><td>동국정운식 한자음 표기<\/td><td>현실의 한자음을 그대로 적기보다 규범적인 한자음 체계를 반영<\/td><td>한자 아래의 작은 글씨를 단순한 현대 독음으로 옮기지 않음<\/td><\/tr><\/tbody><\/table><\/div><p>ㅸ은 순경음 비읍이다. ‘수비’로 단순히 옮겨 읽기 쉬운 ‘수ᄫᅵ’의 원문에는 이 글자가 쓰인다. 원문·필기의 154쪽에서 옛한글 전사와 구절별 설명을 함께 확인한다.<\/p>"},{"id":"particles","title":"조사와 이어 적기 분석","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">형태·예<\/th><th scope=\"col\">분석<\/th><th scope=\"col\">핵심<\/th><\/tr><\/thead><tbody><tr><td>나랏<\/td><td>나라 + 관형격 조사 ㅅ<\/td><td>오늘날의 ‘나라의’. ㅅ은 현대의 단순한 사이시옷 표기로만 처리하지 않음<\/td><\/tr><tr><td>말ᄊᆞ미<\/td><td>말ᄊᆞᆷ + 주격 조사 이<\/td><td>받침 ㅁ을 뒤 음절 첫소리로 이어 적음<\/td><\/tr><tr><td>노미<\/td><td>놈 + 주격 조사 이<\/td><td>‘사람이’라는 의미와 연철을 함께 확인<\/td><\/tr><tr><td>주격 조사 이 / ㅣ / Ø<\/td><td>앞말이 자음 뒤 / ㅣ 계열을 제외한 모음 뒤 / ㅣ·반모음 ㅣ 뒤인지에 따라 구별<\/td><td>현대 국어의 이/가 체계와 다름<\/td><\/tr><tr><td>관형격 조사<\/td><td>의/ᄋᆡ 계열과 ㅅ 등이 사용됨<\/td><td>유정·무정, 높임 대상 여부와 모음 환경을 함께 살핌<\/td><\/tr><tr><td>부사격 조사<\/td><td>에·애·예 등의 형태가 모음 환경 등에 따라 나타남<\/td><td>원문의 형태를 현대 형태로 무조건 바꾸어 적지 않음<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout purple\"><strong>주격 조사 ‘가’<\/strong><p>제공된 중세 국어 서문에서는 현대처럼 주격 조사 ‘가’를 쓰지 않는다. 국어의 역사에서 문법 요소가 변한 예로 연결한다.<\/p><\/div>"},{"id":"endings","title":"어미·접사·문법 기능 구별","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">예·요소<\/th><th scope=\"col\">기능과 읽기<\/th><\/tr><\/thead><tbody><tr><td>-고져<\/td><td>오늘날 ‘-고자’에 대응하는 의도·바람<\/td><\/tr><tr><td>-게 ᄒᆞ다<\/td><td>어떤 상태나 행위를 하도록 하는 사동 표현과 연결<\/td><\/tr><tr><td>-니라<\/td><td>설명·진술을 맺는 종결 표현<\/td><\/tr><tr><td>명사형 어미 / 명사 파생 접미사<\/td><td>겉모양이 비슷해도 문장에서의 기능과 새 단어 형성 여부로 구별<\/td><\/tr><tr><td>받침·자음의 변화<\/td><td>구개음화·두음 법칙 등이 아직 현대와 같은 모습으로 적용되지 않은 예를 살핌<\/td><\/tr><\/tbody><\/table><\/div><p>필기에 적힌 문법 용어를 암기할 때에는 문장 안의 역할을 함께 확인한다. 연결·종결 어미인지, 단어를 만드는 접사인지, 문장 안에서 명사처럼 쓰이게 하는 어미인지가 판단의 기준이다.<\/p>"},{"id":"vocabulary","title":"어휘의 의미 변화","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">옛말·표현<\/th><th scope=\"col\">본문에서의 뜻<\/th><th scope=\"col\">오늘날과의 차이<\/th><\/tr><\/thead><tbody><tr><td>어린 백성<\/td><td>어리석은 백성<\/td><td>나이가 어린 사람으로만 읽으면 어긋남<\/td><\/tr><tr><td>놈<\/td><td>사람<\/td><td>현대의 낮잡는 쓰임과 다름<\/td><\/tr><tr><td>어엿비<\/td><td>가엾게·불쌍히<\/td><td>현대 ‘어엿하다’의 당당한 의미와 혼동하지 않음<\/td><\/tr><tr><td>말ᄊᆞᆷ<\/td><td>말<\/td><td>현대 ‘말씀’은 높임의 쓰임이 두드러짐<\/td><\/tr><tr><td>수ᄫᅵ<\/td><td>쉽게<\/td><td>현재와 소리·표기가 달라짐<\/td><\/tr><tr><td>펴디<\/td><td>펴지·펼치지<\/td><td>현대 구개음화가 반영된 형태와 비교<\/td><\/tr><tr><td>니르고져<\/td><td>이르고자·말하고자<\/td><td>단순히 어느 장소에 이르다로만 읽지 않음<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"close-reading","title":"필기의 핵심을 문장에 적용하기","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">본문 형태<\/th><th scope=\"col\">확인할 내용<\/th><\/tr><\/thead><tbody><tr><td>나랏 / 말ᄊᆞ미<\/td><td>나랏의 ㅅ은 관형격 조사, 말ᄊᆞ미의 이는 주격 조사. 둘을 같은 조사로 처리하지 않는다.<\/td><\/tr><tr><td>中듕國귁에 / 文字와로<\/td><td>중국에와 문자와로는 비교 관계를 나타낸다. 와가 보인다고 언제나 접속 조사로 판단하지 않는다.<\/td><\/tr><tr><td>어린 / 어엿비 / 놈<\/td><td>어리석은 / 가엾게 / 사람. 현대의 대표 의미로 대입하지 않는다.<\/td><\/tr><tr><td>니르고져 / 펴디<\/td><td>니르-에는 현대 두음 법칙이, -디에는 현대 구개음화가 아직 적용되지 않은 형태가 보인다.<\/td><\/tr><tr><td>ᄡᅮ메<\/td><td>명사처럼 기능하게 하는 명사형 어미와 부사격 조사를 구별한다. 명사형 전성 어미와 새 단어를 만드는 파생 접미사는 같지 않다.<\/td><\/tr><tr><td>ᄆᆡᇰᄀᆞ노니<\/td><td>주어 내가와 연결되는 1인칭 선어말 어미 -오-의 기능을 필기에서 강조한다.<\/td><\/tr><tr><td>이셔도 / -ㄹᄊᆡ / -고져<\/td><td>연결 어미의 양보·원인·목적 기능을 문장 전체 뜻으로 구별한다.<\/td><\/tr><tr><td>ㆁ / ㅇ / ㆆ / ㅸ<\/td><td>옛이응·이응·여린히읗·순경음 비읍을 구별한다. 중세 국어 일반의 자모 목록과 이 서문에 실제 쓰인 글자도 구별한다.<\/td><\/tr><\/tbody><\/table><\/div><p>필기의 약칭이나 희미한 글자는 원문·필기 화면에서 판독 불확실로 표시했다. 그 부분을 확정된 정답 근거로 사용하지 않는다.<\/p>"},{"id":"original","title":"원문 필기와 대조하기","body":"<p>옛한글은 화면의 글꼴에 따라 자모 결합이 다르게 보일 수 있다. 154쪽 원문을 옛한글 텍스트로 옮기고 필기를 구절별로 연결했다. 방점은 ·(1점)와 :(2점)으로 나타냈다.<\/p><button class=\"btn\" data-source-id=\"book154\">154쪽 원문·필기 열기<\/button>"}],"recall":[["‘노미’에서 형태소를 나누면?","놈 + 주격 조사 이. 본문에서 ‘놈’은 ‘사람’이며, 받침 ㅁ을 이어 적은 연철이다."],["연철과 구개음화는 같은 종류의 개념인가?","아니다. 연철은 이어 적는 표기 방식이고 구개음화는 소리의 변화이다."]],"related":["historylang","integration"],"sources":["book154"],"sourceGroups":["language"],"sourcePageIds":["book154"]},{"id":"integration","title":"작품과 개념 연결하기","category":"통합 비교","summary":"공통점은 묶고, 각 작품의 근거와 차이는 남겨 두기.","tags":["서술 방식","소재","현실과 가치"],"source":"교과서·프린트 종합","sections":[{"id":"satire","title":"풍자와 해학으로 권력을 읽기","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">작품<\/th><th scope=\"col\">비판 대상·장면<\/th><th scope=\"col\">차이<\/th><\/tr><\/thead><tbody><tr><td>춘향전<\/td><td>출두 후 허둥대는 관리와 변 사또의 학정<\/td><td>판소리계 소설의 과장·열거·언어유희<\/td><\/tr><tr><td>통영 오광대<\/td><td>말뚝이가 양반을 대하는 언어<\/td><td>무대의 몸짓·음악·대사를 통한 신분 질서 풍자<\/td><\/tr><tr><td>정을선전<\/td><td>정렬부인이 위엄을 잃고 쓰러지는 장면<\/td><td>가정 내 모략 서사 속 상층 인물의 희화화<\/td><\/tr><tr><td>공방전<\/td><td>돈과 권력이 결탁한 탐욕<\/td><td>의인화된 사물의 전기를 통한 우의<\/td><\/tr><tr><td>매우 잘생긴 우산 하나<\/td><td>허구적 권위에 기대는 소시민<\/td><td>타인의 승인과 실제 권력 앞에서의 후퇴<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"poverty","title":"가난을 제시하는 방식은 같지 않다","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">작품<\/th><th scope=\"col\">구체적인 현실<\/th><th scope=\"col\">읽어야 할 가치·태도<\/th><\/tr><\/thead><tbody><tr><td>도도한 생활<\/td><td>반지하·과도한 타자 노동·침수<\/td><td>고립과 좌절 속에서도 자신의 감각과 존엄을 지키려 함<\/td><\/tr><tr><td>오발탄<\/td><td>전후 판잣집·충치·낡은 양말<\/td><td>윤리를 지키는 삶과 생존 사이의 갈등<\/td><\/tr><tr><td>그날 나는 슬픔도 배불렀다<\/td><td>형의 이사와 등록금, 중국집의 노동<\/td><td>가족의 희생에 대한 미안함과 타인의 삶에 대한 공감<\/td><\/tr><tr><td>흥부 부부상<\/td><td>손발 닳은 가난한 부부<\/td><td>물질보다 귀한 사랑과 위로<\/td><\/tr><tr><td>찬밥<\/td><td>홀로 먹는 차가운 밥<\/td><td>소외 속에서 이해하는 어머니의 희생<\/td><\/tr><\/tbody><\/table><\/div><p>같은 가난을 다루어도 갈등·정서·결말은 다르다. 공통 소재 하나로 모든 작품의 주제를 같은 문장으로 만들지 않는다.<\/p>"},{"id":"symbols","title":"소재는 장면 속에서 의미를 얻는다","body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">소재<\/th><th scope=\"col\">작품 속 의미의 근거<\/th><\/tr><\/thead><tbody><tr><td>피아노<\/td><td>가족의 희망에서 현실의 부담을 거쳐 마지막 자기 표현으로 변함<\/td><\/tr><tr><td>우산 케이스<\/td><td>다른 사람이 무전기로 오인하고 대우할 때 허구적 힘을 얻음<\/td><\/tr><tr><td>산수유<\/td><td>아버지가 눈을 헤쳐 구해 온 약이므로 사랑과 생명력으로 연결됨<\/td><\/tr><tr><td>찬밥<\/td><td>몸의 차가운 감각에서 소외된 처지와 어머니의 기억으로 확장됨<\/td><\/tr><tr><td>박덩이 앞의 웃음<\/td><td>보물 획득 이전의 감정이므로 물질보다 부부애를 강조함<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"methods","title":"갈래를 넘어서 적용하는 읽기 순서","body":"<ol class=\"flow\"><li>지문에 직접 제시된 사실 확인<\/li><li>말하는 주체·시간·공간 파악<\/li><li>반복·대조·비유·서술 방식 찾기<\/li><li>주장·주제와 연결<\/li><li>선지의 과장·주체 바꾸기·근거 없는 추론 점검<\/li><\/ol><div class=\"callout teal\"><strong>독서와 문학의 연결<\/strong><p>탈탄소 지문에서는 주장과 근거의 연결을, 문학에서는 인물의 말·행동과 해석의 연결을 점검한다. 인물의 발언을 곧바로 작가의 결론으로 보거나, 전망을 확정된 사실로 바꾸는 선지를 경계한다.<\/p><\/div>"}],"recall":[["공통점을 찾은 뒤 반드시 덧붙여야 할 것은?","작품마다 다른 구체적인 근거와 차이이다. 같은 소재가 같은 의미를 자동으로 가지지는 않는다."]],"related":["dodo","obaltan","climate","hunmin"],"sources":[],"sourceGroups":[],"sourcePageIds":[]}],"quiz":[{"unit":"story","type":"ox","q":"서사 문학은 서술자가 이야기를 전달하는 반면, 극 문학은 주로 인물의 말과 행동으로 사건을 보여 준다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"서술자의 전달과 인물의 대사·행동은 두 갈래를 구별하는 주요 기준이다.","id":"q001"},{"unit":"story","type":"ox","q":"민담은 특정 바위나 유적 같은 구체적인 증거물이 반드시 있어야 성립한다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"구체적인 증거물은 전설을 구별하는 중요한 기준이다. 민담에서 특정 증거물은 필수적이지 않다.","id":"q002"},{"unit":"story","type":"mc","q":"고려 시대 이야기 문학에 해당하는 조합은?","opts":["패관 문학·가전체 문학","신소설·현대 소설","시나리오·신파극","판소리계 소설·신소설"],"a":0,"exp":"교과서는 고대 설화 다음 고려의 패관 문학·가전체 문학을 제시한다.","id":"q003"},{"unit":"story","type":"mc","q":"판소리계 소설에 여러 이본이 나타나는 이유로 가장 적절한 것은?","opts":["작품이 오직 한 사람에 의해 암기되었기 때문에","구전과 문자 정착 과정에서 다양한 의식과 표현이 반영되었기 때문에","모든 판본에서 사건이 완전히 같아야 하기 때문에","서울에서만 소설이 출판되었기 때문에"],"a":1,"exp":"전승과 기록 과정에서 인물·사건·표현이 달라질 수 있다. 경판은 서울, 완판은 전주에서 간행된 목판본이다.","id":"q004"},{"unit":"chunhyang","type":"ox","q":"몽룡의 한시는 관리들의 잔치와 백성의 고통을 연결하여 학정을 비판한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"좋은 술·안주·촛농·노랫소리가 백성의 피·기름·눈물·원망에 대응한다.","id":"q005"},{"unit":"chunhyang","type":"ox","q":"춘향은 수청을 요구하는 암행어사가 몽룡임을 이미 알고 순순히 요구에 따른다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"춘향은 정체를 모르고 수청을 거절한다. 얼굴을 확인한 뒤 몽룡임을 알아본다.","id":"q006"},{"unit":"chunhyang","type":"mc","q":"“도장 궤 잃고 유밀과 들고”처럼 물건을 뒤바꿔 드는 관리들의 모습이 만드는 효과는?","opts":["관리들의 침착한 업무 능력을 찬양함","초월적 인물의 탄생을 예고함","권위 있던 인물들의 당황을 희화화함","시간의 흐름을 역순으로 제시함"],"a":2,"exp":"뒤죽박죽된 행동과 열거는 관리들의 체면을 무너뜨리고 풍자·해학을 강화한다.","id":"q007"},{"unit":"chunhyang","type":"mc","q":"서술자가 인물의 모습을 직접 평가하는 표현은?","opts":["“금준미주는 천인혈이요”","“그 꼴이 가관이다.”","“춘향이 빨리 불러 올려라.”","“얼굴을 들어 나를 보아라.”"],"a":1,"exp":"“가관이다”는 상황에 대한 서술자의 직접 평가로 편집자적 논평에 해당한다.","id":"q008"},{"unit":"josin","type":"ox","q":"조신의 꿈은 소원 성취로 시작하지만 빈곤과 상실, 이별을 겪게 한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"원하던 혼인이 이루어져도 가족은 극심한 고통을 겪는다. 욕망의 성취와 행복이 같지 않음을 드러낸다.","id":"q009"},{"unit":"josin","type":"ox","q":"꿈에서 깨어난 조신은 김 씨 낭자와의 혼인을 다시 간절히 기원한다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"조신은 세속적 욕망과 집착을 벗어나 미륵불을 모시고 정토사를 세운다.","id":"q010"},{"unit":"josin","type":"mc","q":"꿈과 현실을 직접 연결하는 사건은?","opts":["김 씨 낭자가 다른 사람과 혼인함","큰아이가 굶어 죽음","꿈속 아이를 묻었던 자리에서 돌미륵이 발견됨","딸이 개에게 물림"],"a":2,"exp":"꿈에서 체험한 장소의 돌미륵이 현실에서 발견되어 두 세계가 이어진다.","id":"q011"},{"unit":"josin","type":"mc","q":"현실의 하룻밤에 꿈속 수십 년의 삶을 담은 구조의 효과는?","opts":["서사 시간을 압축해 일생의 고통과 깨달음을 체험하게 한다.","꿈과 현실이 완전히 무관함을 증명한다.","조신의 전쟁 영웅적 활약을 강조한다.","혼인하면 모든 갈등이 사라짐을 보여 준다."],"a":0,"exp":"환몽 구조는 긴 삶의 체험을 압축하고, 욕망에 대한 인식 변화를 드러낸다.","id":"q012"},{"unit":"baegun","type":"ox","q":"「백운소설」의 이 일화에는 실제 문인의 이름과 귀신의 복수가 함께 나타난다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"김부식·정지상은 실존 인물이지만 이 일화는 기이한 허구적 사건을 결합한 패관 문학이다.","id":"q013"},{"unit":"baegun","type":"ox","q":"정지상의 귀신은 김부식의 “천 가닥·만 점”을 세어 보았느냐며 시구를 비판한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"정확히 셀 수 없는 수량을 문제 삼아 “가닥가닥·점점이”로 고치라고 한다.","id":"q014"},{"unit":"baegun","type":"mc","q":"이 자료를 역사적 사실의 직접 기록으로만 읽기 어려운 이유는?","opts":["인물이 말을 하지 않아서","귀신의 등장과 복수 등 가공된 사건이 들어 있어서","시구가 한 편도 나오지 않아서","작가가 현대인이어서"],"a":1,"exp":"문인 일화에 허구적·기이한 사건이 결합한다는 점을 고려해야 한다.","id":"q015"},{"unit":"baegun","type":"mc","q":"이 작품의 갈래에 대한 설명으로 적절한 것은?","opts":["현대 장편 소설의 한 유형이다.","돈을 의인화한 가전체이다.","견문·일화에 가공을 더한 패관 문학이다.","인물의 대사만으로 이루어진 가면극이다."],"a":2,"exp":"자료에는 패관 문학으로 제시되어 있다. 제목의 “소설”을 현대 소설과 곧바로 동일시하지 않는다.","id":"q016"},{"unit":"gongbang","type":"ox","q":"「공방전」은 돈을 인물로 만들어 가계와 행적을 전기처럼 서술한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"사물의 의인화와 전기적 구성은 가전체의 핵심 특징이다.","id":"q017"},{"unit":"gongbang","type":"ox","q":"공방이 권세가를 드나들며 벼슬을 사고팔게 하는 장면은 돈과 권력의 부패한 관계를 드러낸다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"화폐의 힘이 매관매직과 아첨을 가능하게 하는 현실을 우의적으로 비판한다.","id":"q018"},{"unit":"gongbang","type":"mc","q":"“풀무 속에 넣고 변화시킨 뒤에 광채를 내게 한다”는 이력과 대응하는 것은?","opts":["농작물의 성장","바다의 조류","금속의 제련과 주조","관료의 과거 시험"],"a":2,"exp":"공방은 화폐를 의인화한 인물이다. 그의 이력은 금속·화폐의 성질과 대응한다.","id":"q019"},{"unit":"gongbang","type":"mc","q":"공방이 곡식을 천대하고 자신을 귀하게 여기는 모습의 비판 방향은?","opts":["농업보다 이익과 돈만 좇게 하는 탐욕","백성에게 농사를 너무 권하는 태도","화폐가 전혀 사용되지 않는 현실","모든 관리가 돈을 거부하는 태도"],"a":0,"exp":"농업을 근본으로 보던 사회에서 돈과 말단의 이익에만 몰두하는 풍조를 비판한다.","id":"q020"},{"unit":"gimwon","type":"ox","q":"공주들은 아귀에게 잡혀간 피해자이면서 원의 계책을 실행하는 조력자이다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"술을 권하고 보검을 확보하며 시험을 제안하는 등 사건 해결에 능동적으로 참여한다.","id":"q021"},{"unit":"gimwon","type":"ox","q":"기둥을 베는 장면은 원의 칼이 아귀의 비수보다 뛰어나다는 것을 보여 준다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"원의 칼로는 반쯤 부러졌지만 아귀의 비수로는 쉽게 베어진다. 무기의 차이를 확인하는 장면이다.","id":"q022"},{"unit":"gimwon","type":"mc","q":"공주들이 아귀의 상처 회복을 기뻐하며 술을 권하는 실제 목적은?","opts":["아귀를 황상으로 추대하려고","아귀에게 원의 정체를 알리려고","아귀와 원의 화해를 축하하려고","아귀를 취하게 하고 잠들게 하려고"],"a":3,"exp":"겉으로는 위로와 찬양이지만, 실제로는 원과 약속한 계책을 실행하는 말이다.","id":"q023"},{"unit":"gimwon","type":"mc","q":"황상과 신하들이 주고받는 대화의 특징으로 적절한 것은?","opts":["인물 간의 위계와 충군의 가치를 드러낸다.","과거의 사건을 모두 회상 장면으로 전환한다.","인물의 모든 말이 거짓임을 선언한다.","주인공이 전혀 필요 없다는 사실을 증명한다."],"a":0,"exp":"대화에서 임금과 신하의 관계, 위기 해결을 위한 천거와 충성의 태도가 드러난다.","id":"q024"},{"unit":"jeongeul","type":"ox","q":"「정을선전」의 원수와 승상은 정을선을 가리키는 호칭이다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"전쟁과 가정의 사건은 같은 남주인공을 매개로 연결된다.","id":"q025"},{"unit":"jeongeul","type":"ox","q":"월매는 왕비의 매를 견디지 못해 충렬부인이 숨은 곳을 모두 털어놓는다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"월매는 끝내 토설하지 않는다. 정을선이 도착한 뒤 충렬부인을 살려 달라고 요청한다.","id":"q026"},{"unit":"jeongeul","type":"mc","q":"인물과 역할의 연결이 옳은 것은?","opts":["금연—충렬부인 대신 죽은 시비","정렬부인—누명을 쓰고 구덩이에 숨은 인물","금섬—충렬부인을 피신시키고 자진한 시비","복록—전쟁터에서 군사를 지휘한 중군장"],"a":2,"exp":"금섬이 충렬부인을 대신하여 죽고, 정렬부인과 금연은 모략에 가담한다.","id":"q027"},{"unit":"jeongeul","type":"mc","q":"누명의 진상을 밝히는 데 직접 연결되는 조사 과정은?","opts":["한시의 운자를 비교한다.","왕비에게 제보의 경위를 묻고 옥졸의 진술을 통해 금연을 심문한다.","정렬부인의 회복을 기다리며 모든 심문을 멈춘다.","월매가 애초에 모략의 주인공임을 전제한다."],"a":1,"exp":"정을선은 전달된 정보의 경로를 추적하여 금연의 자백을 이끈다.","id":"q028"},{"unit":"mask","type":"ox","q":"가면극에서는 괄호 안의 춤·몸짓·음악 지시도 공연과 의미 형성에 참여한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"대사뿐 아니라 움직임과 장단도 장면을 구성한다.","id":"q029"},{"unit":"mask","type":"ox","q":"통영 오광대에서 말뚝이의 신분이 낮으므로 그의 말에는 양반을 풍자하는 기능이 없다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"모시는 듯한 말 속에 조롱과 과장을 섞어 양반의 허위를 드러내는 것이 중요한 풍자 방식이다.","id":"q030"},{"unit":"mask","type":"mc","q":"제공된 양주 별산대 놀이 발췌의 인물 조합은?","opts":["신할아비·미얄할미","원·김규","철호·영호","금섬·월매"],"a":0,"exp":"해당 발췌는 제13과장 신할아비와 미얄할미놀이이다.","id":"q031"},{"unit":"mask","type":"mc","q":"극 문학의 읽기 방법으로 적절한 것은?","opts":["서술자가 인물의 내면을 모두 직접 설명한다고 가정한다.","행동 지시는 줄거리와 무관하므로 생략한다.","대사·행동·무대 지시의 관계를 함께 살핀다.","공연에서 음악은 언제나 의미를 방해한다고 본다."],"a":2,"exp":"극에서는 보이는 행동과 들리는 대사·음악이 함께 인물과 사건을 제시한다.","id":"q032"},{"unit":"dodo","type":"ox","q":"「도도한 생활」은 ‘나’가 자신의 경험과 생각을 전하는 1인칭 주인공 시점이다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"유년의 경험과 서울에서의 생활을 ‘나’의 시선으로 읽게 된다.","id":"q033"},{"unit":"dodo","type":"ox","q":"마지막 연주 직후 반지하의 물이 모두 빠지고 ‘나’의 경제적 어려움도 해결된다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"침수와 어려움은 계속된다. 연주는 외적 문제의 해결보다 자기 감각과 존엄을 지키려는 태도와 연결된다.","id":"q034"},{"unit":"dodo","type":"mc","q":"“체르니를 배우고 싶기보단 체르니란 말이 갖고 싶었다”의 의미로 적절한 것은?","opts":["가족의 만둣집을 경영하고 싶음","생계의 말과 다른 문화적 세계를 동경함","외국어 시험 점수를 이미 얻음","음악의 가치를 전면 부정함"],"a":1,"exp":"체르니라는 이국적인 말은 돼지 비계·단무지 같은 생계의 말과 다른 울림을 지닌다.","id":"q035"},{"unit":"dodo","type":"mc","q":"진보적인 컴퓨터 앞에서 ‘나’의 등이 네안데르탈인처럼 굽는 모습의 효과는?","opts":["기술의 진보가 인간다운 삶의 진보를 자동으로 보장하지 않음을 드러낸다.","컴퓨터 기술이 전혀 존재하지 않던 시대임을 알려 준다.","타자 노동이 신체적으로 매우 편안함을 강조한다.","‘나’가 과거로 실제 시간 여행을 했음을 밝힌다."],"a":0,"exp":"발전한 기계와 퇴행하는 듯한 신체를 대비하여 과도한 노동과 삶의 역설을 드러낸다.","id":"q036"},{"unit":"umbrella","type":"ox","q":"김달채가 우산을 통해 얻는 힘은 타인이 그것을 권력의 표지로 받아들이는 데 의존한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"상대가 우산을 무전기로 보고 태도를 바꾸는 승인 과정에서 힘의 관계가 생긴다.","id":"q037"},{"unit":"umbrella","type":"ox","q":"사복 청년이 우산을 거들떠보지 않았다는 사실만으로, 청년이 우산의 속임수를 정확히 간파했다고 확정할 수 있다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"본문은 청년이 우산을 보지 않았다고 말한다. 속임수를 알아챘다는 내면 판단은 제시되지 않는다.","id":"q038"},{"unit":"umbrella","type":"mc","q":"김달채가 더 효과적이라고 판단한 우산의 노출 방식은?","opts":["손에 들고 온몸을 흔듦","우산을 완전히 펼쳐 비를 맞음","케이스의 끝부분만 슬쩍 보여 줌","우산을 사람들에게 선물함"],"a":2,"exp":"끝부분만 부주의한 듯 보여 주는 편이 더 민감한 반응을 일으켰다고 판단한다.","id":"q039"},{"unit":"umbrella","type":"mc","q":"시위 현장에서 항의하다 물러나는 장면에서 함께 읽어야 할 것은?","opts":["실제 경찰 신분과 높은 직급","승인받은 경험에서 온 자신감과 자신의 안위를 지키려는 소시민적 한계","학생들과의 오랜 우정과 군사적 승리","권력에 대한 완전한 무관심"],"a":1,"exp":"타인의 대우에 고무되지만 실제 권력 앞에서는 위험을 피한다는 전후의 태도 차이가 핵심이다.","id":"q040"},{"unit":"obaltan","type":"ox","q":"영호는 양심·윤리·관습·법률을 생존을 제약하는 것으로 바라본다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"가시·속옷·리본·허수아비의 비유로 각각의 규범을 깎아내린다.","id":"q041"},{"unit":"obaltan","type":"ox","q":"시나리오의 O·L은 두 화면이 겹치며 바뀌는 화면 전환 기법이다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"#69에서는 아내의 현재 모습과 학창·결혼 시절의 모습이 겹치며 연결된다.","id":"q042"},{"unit":"obaltan","type":"mc","q":"영호가 법률을 빗댄 대상은?","opts":["붉은 산수유","허수아비","재생 에너지","박덩이"],"a":1,"exp":"허수아비를 두려워하는 참새와 무시하는 까마귀를 통해 규범의 실효성을 비꼰다.","id":"q043"},{"unit":"obaltan","type":"mc","q":"#73 부엌과 #74 방, #75 골목의 장면을 잇는 주요 장치는?","opts":["시간을 거꾸로 흐르게 하는 자막","아무 관련 없는 풍경의 나열","이어지는 철호와 영호의 목소리","서술자가 읽는 한 편의 시"],"a":2,"exp":"같은 대화가 화면 밖 목소리로 이어져 서로 다른 공간의 인물들이 상황을 공유하게 한다.","id":"q044"},{"unit":"seongtan","type":"ox","q":"현재의 눈은 어린 시절 눈 속에서 약을 구해 온 아버지의 기억을 환기한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"눈이 과거와 현재를 잇는 매개이며, 부성애의 기억이 현재에 되살아난다.","id":"q045"},{"unit":"seongtan","type":"ox","q":"아버지의 서느런 옷자락은 자식을 대하는 냉정하고 무관심한 태도를 뜻한다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"옷자락의 서늘함은 눈을 헤치고 약을 구해 온 아버지에 대한 촉각적 기억으로 사랑과 연결된다.","id":"q046"},{"unit":"seongtan","type":"mc","q":"붉은 산수유가 혈액 속에 녹아 흐른다는 표현의 의미는?","opts":["아버지의 사랑과 생명력이 현재까지 이어짐","현재의 화자가 약을 전혀 기억하지 못함","화자가 도시의 부유함에만 만족함","어린 시절의 병이 완전히 허구였음"],"a":0,"exp":"열매의 붉은빛과 혈액이 연결되며 사랑의 지속과 생명력이 형상화된다.","id":"q047"},{"unit":"seongtan","type":"mc","q":"시의 제시 순서에 맞는 것은?","opts":["과거의 병든 밤 → 성장한 현재","미래의 성공 → 고대의 전설","현재의 전쟁 → 미래의 전쟁","어린 시절의 학교 → 시위 현장"],"a":0,"exp":"어릴 적 아팠던 밤과 아버지의 모습을 먼저 제시한 뒤 서른 살 현재로 옮겨 간다.","id":"q048"},{"unit":"slpeum","type":"ox","q":"형님네의 이사 재 자체를 부정함"],"a":2,"exp":"황금이나 벼보다 박을 가르기 전 나눈 웃음과 사랑의 가치에 초점을 맞춘다.","id":"q059"},{"unit":"heungbu","type":"mc","q":"“헤아려 보라”의 반복이 하는 일은?","opts":["독자에게 부부의 내면과 사랑의 가치를 생각하게 함","서사 시간을 역전시킴","시의 모든 감정을 없앰","박을 가르는 기술을 가르침"],"a":0,"exp":"독자가 인물의 마음을 상상하고 그 의미를 숙고하도록 요청한다.","id":"q060"},{"unit":"climate","type":"ox","q":"RE100의 100%는 기업이 사용하는 전력을 재생 에너지 전력으로 조달한다는 내용과 연결된다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"모든 원료나 모든 종류의 에너지 100%를 뜻하는 것으로 넓혀 읽지 않는다.","id":"q061"},{"unit":"climate","type":"ox","q":"글쓴이는 ESG 투자 확대를 오직 금융 기관의 도덕적 책임만으로 설명한다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"도덕적 책임도 고려될 수 있지만 소비자와 투자자의 선호·가치·의사 결정 기준 변화가 더 중요하다고 설명한다.","id":"q062"},{"unit":"climate","type":"mc","q":"글이 제시한 세 관점의 연결이 옳은 것은?","opts":["RE100—국가 간 세금 / ESG—한글 / CBAM—피아노","RE100—글로벌 기업 / ESG—국제 금융 시장 / CBAM—국가 정책","RE100—개인 소비만 / ESG—문학사 / CBAM—장단","RE100·ESG·CBAM—모두 동일한 기업의 이름"],"a":1,"exp":"세 약어는 각각 공급망, 투자 판단, 국가 간 탄소 비용 조정이라는 다른 관점을 맡는다.","id":"q063"},{"unit":"climate","type":"mc","q":"문답법의 기능으로 가장 적절한 것은?","opts":["독자의 예상 질문을 제시하고 답하며 논리를 분명하게 한다.","자료가 없음을 숨기기 위해 문장을 반복한다.","인물의 신분을 바꾸어 희화화한다.","과거의 꿈을 현실의 일생으로 압축한다."],"a":0,"exp":"금융 시장이 왜 변하는지 등 독자의 의문을 예상하고 답변을 제공하여 설명과 설득을 돕는다.","id":"q064"},{"unit":"historylang","type":"ox","q":"사회성은 개인이 언어의 약속을 마음대로 바꾸기 어렵다는 성질이며, 역사성과 함께 성립한다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"공동체의 약속은 개인에게 제약을 주지만 오랜 시간에 걸쳐 공동체의 언어는 변할 수 있다.","id":"q065"},{"unit":"historylang","type":"ox","q":"한글이 창제되기 전에는 우리말 자체가 존재하지 않았다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"언어와 문자는 다르다. 우리말은 한글 창제 이전에도 존재했다.","id":"q066"},{"unit":"historylang","type":"mc","q":"제공된 교과서가 전기·후기 중세 국어를 나누는 기준은?","opts":["1443년 한글 창제","1459년 『월인석보』 수록","19세기 말","신라 건국"],"a":0,"exp":"교과서는 한글 창제인 1443년을 기준으로 중세 국어를 전기와 후기로 나눈다.","id":"q067"},{"unit":"historylang","type":"mc","q":"훈민정음 창제와 반포를 정확히 연결한 것은?","opts":["1446년 창제·1443년 반포","1459년 창제·1446년 반포","1443년 창제·1446년 반포","둘 다 1459년"],"a":2,"exp":"1443년 창제, 1446년 반포이며 『월인석보』의 언해 서문 수록은 1459년이다.","id":"q068"},{"unit":"hunmin","type":"ox","q":"‘노미’는 ‘놈+이’를 이어 적은 것으로, 본문에서 ‘놈’은 ‘사람’이라는 뜻이다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"연철과 어휘 의미의 차이를 함께 파악할 수 있는 예이다.","id":"q069"},{"unit":"hunmin","type":"ox","q":"방점의 점 두 개는 단어가 아주 중요하다는 강조 표시이다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"방점은 성조를 표시한다. 무점은 평성, 한 점은 거성, 두 점은 상성이다.","id":"q070"},{"unit":"hunmin","type":"mc","q":"서문에서 “쉽게 익혀 날마다 쓰기에 편하게” 하려는 뜻과 가장 직접적으로 연결되는 정신은?","opts":["실용 정신","배타적 신분 의식","외국어 우월 의식","권력의 승인"],"a":0,"exp":"일상에서 편리하게 사용할 수 있도록 하려는 목적은 실용 정신과 연결된다.","id":"q071"},{"unit":"hunmin","type":"mc","q":"‘어린 백성’의 ‘어린’을 본문의 뜻에 맞게 풀이한 것은?","opts":["나이가 어리기만 한","어리석은","어여쁜","당당한"],"a":1,"exp":"중세 국어의 ‘어리다’는 이 문맥에서 어리석다는 뜻이다. 현대어 뜻을 그대로 대입하지 않는다.","id":"q072"},{"unit":"integration","type":"ox","q":"작품들이 같은 빈곤을 다룬다면 소재의 의미와 결말의 태도도 모두 같다고 보아야 한다.","opts":["O · 옳다","X · 옳지 않다"],"a":1,"exp":"공통 소재를 묶은 뒤에도 각 작품의 구체적 갈등·정서·결말의 차이를 남겨 두어야 한다.","id":"q073"},{"unit":"integration","type":"ox","q":"인물의 발언은 인물의 관점이므로, 언제나 작가의 결론과 동일하다고 단정할 수 없다.","opts":["O · 옳다","X · 옳지 않다"],"a":0,"exp":"영호의 규범 비판처럼 작품이 제시하는 대립 속에서 그 발언의 위치를 살펴야 한다.","id":"q074"},{"unit":"integration","type":"mc","q":"소재와 해석의 연결이 적절하지 않은 것은?","opts":["산수유—아버지의 사랑과 생명력","우산 케이스—타인이 승인하는 허구적 권력 표지","침수 속 피아노—가난의 즉각적 해결을 증명하는 도구","찬밥—차가운 음식과 소외된 처지"],"a":2,"exp":"연주를 해도 침수와 경제적 문제는 해결되지 않는다. 현실 속 인물의 태도와 존엄을 읽어야 한다.","id":"q075"},{"unit":"integration","type":"mc","q":"독서와 문학 모두에 적용할 수 있는 읽기 태도는?","opts":["해석에 앞서 지문에 제시된 근거와 말하는 주체를 확인한다.","전망은 언제나 이미 확정된 사실로 읽는다.","같은 소재는 문맥에 관계없이 같은 뜻으로 외운다.","인물의 말은 언제나 객관적 사실이라고 가정한다."],"a":0,"exp":"주장과 근거, 발언과 주체, 사실과 해석을 구별하는 태도가 공통으로 필요하다.","id":"q076"},{"unit":"story","type":"hard","q":"다음 설명 중 옳은 것만 고르면?\nㄱ. 전설은 구체적 장소·사물과 연결되는 경우가 많다.\nㄴ. 신화는 전승 공동체에서 신성성을 지닌 이야기로 받아들여진다.\nㄷ. 판소리계 소설은 이본이 존재할 수 없다.","opts":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ","ㄴ"],"a":0,"exp":"ㄱ과 ㄴ이 옳다. 구전과 기록 과정에서 판소리계 소설의 다양한 이본이 형성된다.","id":"q077"},{"unit":"chunhyang","type":"hard","q":"춘향의 저항과 임금에게 보상받는 결말을 함께 읽은 내용으로 가장 적절한 것은?","opts":["작품은 기존 질서를 완전히 폐지하는 결말만 제시한다.","신분·권력에 대한 도전과 유교적 정절·기존 질서의 인정이 함께 나타난다.","춘향의 저항은 존재하지 않으며 모든 수청 요구에 따른다.","신분과 권력의 문제는 작품과 아무 관계가 없다."],"a":1,"exp":"신분을 넘는 사랑과 학정 비판이 있는 한편, 정절과 임금의 보상으로 맺는 결말도 있다. 하나의 가치로만 단순화하지 않는다.","id":"q078"},{"unit":"chunhyang","type":"hard","q":"다음 설명 중 옳은 것만 고르면?\nㄱ. 뒤바뀐 물건을 드는 관리들의 행동은 희화화이다.\nㄴ. ‘문 들어온다 바람 닫아라’는 침착한 업무 처리를 드러낸다.\nㄷ. 서술자의 직접 평가는 편집자적 논평으로 볼 수 있다.","opts":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":2,"exp":"ㄱ과 ㄷ이 옳다. ㄴ의 뒤섞인 말은 관리가 몹시 당황했음을 해학적으로 보여 준다.","id":"q079"},{"unit":"josin","type":"hard","q":"「조신몽」의 꿈을 해석한 내용으로 가장 적절한 것은?","opts":["꿈은 사랑의 성취가 언제나 영원한 행복을 준다는 증거이다.","꿈과 현실은 장소나 사건에서 전혀 연결되지 않는다.","꿈에서 깨어난 뒤 조신은 수행을 모두 버린다.","원하던 삶을 고통까지 체험하게 하여 욕망에 대한 인식 전환을 이끈다."],"a":3,"exp":"혼인이라는 소원을 이루어도 빈곤과 상실을 겪는다. 꿈에서 깨어나 집착을 버리는 변화와 연결된다.","id":"q080"},{"unit":"baegun","type":"hard","q":"실존 문인이 등장하는 「백운소설」의 일화를 읽는 태도로 적절한 것은?","opts":["실존 인물·문장 평가·기이한 허구가 결합한 이야기로 읽는다.","패관 문학이므로 말과 대화의 재치를 고려하지 않는다.","인물이 실제했으므로 귀신의 행동도 모두 사실이라고 본다.","한시가 있으므로 사건은 전혀 없다고 본다."],"a":0,"exp":"실제 인물과 일화적 소재가 가공되어 문학적 흥미를 만든다. 사실성과 허구성을 구별해야 한다.","id":"q081"},{"unit":"gongbang","type":"hard","q":"“가계·생애를 서술한다”와 “권세가를 드나들며 벼슬을 사고팔게 한다”를 함께 설명한 것은?","opts":["화자가 자신의 병든 몸만 고백하는 서정시이다.","전기적 형식과 돈·권력의 부패에 대한 우의가 결합한다.","자연 풍경만 사실적으로 기록한다.","신성한 국가의 탄생을 찬양하는 건국 신화이다."],"a":1,"exp":"사물을 인물화하여 전기처럼 꾸미는 형식이 현실 비판과 연결되는 가전체 문학이다.","id":"q082"},{"unit":"gimwon","type":"hard","q":"원의 칼과 아귀의 비수로 같은 기둥을 베는 시험에서 확인할 수 있는 것은?","opts":["시험은 원의 개인적 초월 능력만을 입증하며 도구와 무관하다.","원은 처음부터 두 무기의 성능 차이를 완벽히 알고 있었다.","공주의 제안으로 무기의 성능 차이를 확인하여 계획의 위험을 줄인다.","아귀의 칼은 쓸모가 없으므로 원의 칼을 고른다."],"a":2,"exp":"공주는 원의 칼로는 일이 실패할 수 있음을 확인하게 한다. 주인공의 능력 과시가 아니라 조언과 도구의 차이가 핵심이다.","id":"q083"},{"unit":"jeongeul","type":"hard","q":"“이미 아는 바”라는 정을선의 말과 이후의 심문을 함께 이해한 것으로 적절한 것은?","opts":["월매가 모략을 꾸몄음을 그 말 한마디로 확정할 수 있다.","심문을 통해 새로 안 내용도 처음부터 모두 알고 있었다.","왕비의 말과 앞서 들은 소식은 아무 관련이 없다.","앞서 사정을 전해 들었지만, 모략의 진상은 질문과 진술을 통해 더 확인한다."],"a":3,"exp":"인물의 정보량이 언제 늘어나는지 구별해야 한다. 이후의 조사는 단순한 중복이 아니라 진상 확인 과정이다.","id":"q084"},{"unit":"jeongeul","type":"hard","q":"다음 설명 중 옳은 것만 고르면?\nㄱ. 금섬과 월매는 주인을 지키는 행위를 한다.\nㄴ. 하층 시비들은 사건에서 모두 수동적이다.\nㄷ. 정렬부인의 과장된 추태는 상층 인물의 위엄을 무너뜨린다.","opts":["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ"],"a":0,"exp":"ㄱ과 ㄷ이 옳다. 금연도 모략에 능동적으로 가담하므로 하층 인물이 모두 수동적이라는 ㄴ은 틀리다.","id":"q085"},{"unit":"mask","type":"hard","q":"「춘향전」과 통영 오광대의 공통점과 차이를 적절하게 짝지은 것은?","opts":["둘 다 시공간 배경과 인물의 신분이 전혀 제시되지 않는다.","둘 다 권위를 가진 인물을 웃음거리로 만들 수 있으나, 가면극은 대사·몸짓·음악의 공연성을 함께 읽어야 한다.","둘 다 서술자가 내면을 모두 직접 설명하므로 행동 지시를 무시해도 된다.","둘 다 문학적 웃음이 없고 오직 법률 조항만 설명한다."],"a":1,"exp":"권위의 전도와 풍자는 공통으로 읽을 수 있다. 전달 매체와 갈래의 차이는 남겨 두어야 한다.","id":"q086"},{"unit":"dodo","type":"hard","q":"피아노의 의미 변화에 대한 설명 중 가장 적절한 것은?","opts":["연주가 금지된 뒤에는 작품에서 어떤 기능도 하지 않는다.","처음부터 끝까지 팔기 위한 고가의 상품으로만 기능한다.","가족의 희망과 기억을 담다가 현실의 부담도 되며, 마지막에는 자기 표현과 존엄의 행위에 연결된다.","서울에 도착한 순간 모든 경제적 문제가 해결된다."],"a":2,"exp":"같은 사물의 의미가 장면과 인물의 태도에 따라 복합적으로 달라진다. 하나의 고정된 상징으로만 외우지 않는다.","id":"q087"},{"unit":"dodo","type":"hard","q":"주인집 공사 소리는 들리지만 ‘나’의 피아노 소리는 제지되는 대비를 가장 적절하게 읽은 것은?","opts":["주인집은 ‘나’에게 연주 직업을 보장한다.","모든 소리는 정확히 같은 기준으로 허용된다.","피아노 소리는 물리적으로 존재하지 않는다.","소리의 허용 여부에도 공간을 점유한 사람들의 불평등한 관계가 작용한다."],"a":3,"exp":"누가 어떤 공간에서 내는 소리인지에 따라 허용이 달라진다. 거주 조건과 권력의 불평등을 함께 볼 수 있다.","id":"q088"},{"unit":"dodo","type":"hard","q":"교과서 결말의 마지막 연주를 설명한 내용으로 적절하지 않은 것은?","opts":["빈곤과 침수가 해결되어 성공적인 계층 상승이 확정되었음을 증명한다.","현실이 계속 어려워도 자기 감각을 되찾는 행위로 읽을 수 있다.","피아노가 담은 가족의 기억과 청춘의 감각이 함께 떠오른다.","외적 조건의 즉각적 해결과 구별하여 인물의 태도를 살핀다."],"a":0,"exp":"비는 계속되고 물도 남아 있다. 결말은 물질적 성공을 확정하지 않는다.","id":"q089"},{"unit":"umbrella","type":"hard","q":"다음 중 본문에 근거한 판단만 고르면?\nㄱ. 김달채는 우산의 존재를 알리려 의도적으로 행동한다.\nㄴ. 사복 청년이 우산의 속임수를 간파한 내면이 직접 서술된다.\nㄷ. 우산의 효과에는 타인의 승인이 필요하다.","opts":["ㄴ, ㄷ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ"],"a":1,"exp":"ㄱ과 ㄷ이 옳다. 청년은 거들떠보지 않았으며 속임수를 알아챘다는 내면은 확정할 수 없다.","id":"q090"},{"unit":"obaltan","type":"hard","q":"영호의 “양심은 가시, 법률은 허수아비”라는 말을 읽는 태도로 적절한 것은?","opts":["철호도 그 말을 즉시 전부 받아들인다고 본다.","비유이므로 전후 현실과는 관련이 없다고 본다.","인물의 생존 논리를 보여 주는 비유로 읽고, 철호와의 가치관 대립 속에 놓는다.","작가가 모든 범법 행위를 무조건 찬성한다고 확정한다."],"a":2,"exp":"영호의 발언은 인물의 관점이다. 전후 빈곤과 철호의 윤리 의식이 충돌하는 전체 맥락과 함께 읽어야 한다.","id":"q091"},{"unit":"obaltan","type":"hard","q":"시나리오 #73–#75에서 공간과 소리의 관계를 적절하게 설명한 것은?","opts":["골목의 인물은 어떤 소리도 들을 수 없는 것으로 제시된다.","공간 결합은 오직 같은 인물이 걸어서 이동할 때만 가능하다.","장소가 바뀔 때마다 대화 내용도 완전히 무관하게 바뀐다.","대화가 이어져 서로 다른 공간의 인물들이 방 안의 갈등을 공유하도록 한다."],"a":3,"exp":"철호와 영호의 목소리가 부엌과 골목 장면에서도 들려 공간들을 연결한다. 인물의 이동만이 공간 결합 방식은 아니다.","id":"q092"},{"unit":"seongtan","type":"hard","q":"차가운 눈·서느런 옷자락과 붉은 산수유·혈액을 함께 읽은 내용으로 적절한 것은?","opts":["감각의 대비 속에서 사랑과 생명력이 과거에서 현재로 이어진다.","현재의 화자는 과거와 아무 관계가 없다.","차가운 이미지는 모두 아버지에 대한 적대감이다.","붉은 이미지는 오직 도시의 광고를 뜻한다."],"a":0,"exp":"촉각과 색채를 통해 어린 생명을 지킨 사랑을 되살린다. 차가운 촉각이 곧 차가운 마음은 아니다.","id":"q093"},{"unit":"slpeum","type":"hard","q":"화자가 젊은 부부를 “눈물처럼 아름다워”라고 느끼고 자장면을 끝까지 먹는 맥락으로 적절한 것은?","opts":["그들의 노동을 조롱하고 음식을 낭비하려 함","타인의 성실한 삶에 공감하며 가족의 희생과 자신의 미안함을 겹쳐 느낌","부부가 이미 막대한 재산을 모았음을 확인함","자기 등록금을 전혀 의식하지 않음"],"a":1,"exp":"아름다움과 안타까움이 함께하는 복합 정서이다. 육체적 포만과 슬픔의 충만이 결말에 겹친다.","id":"q094"},{"unit":"chanbab","type":"hard","q":"‘찬밥’의 의미가 확장되는 과정을 적절하게 설명한 것은?","opts":["전기 제품이 없다는 사실만을 설명한다.","가족의 사랑을 모두 부정하는 선언으로 끝난다.","차가운 음식의 감각이 소외된 처지와 겹치며 어머니를 이해하는 매개가 된다.","아무도 배고프지 않다는 과학적 증거가 된다."],"a":2,"exp":"찬밥의 문자적 의미와 비유적 의미가 겹친다. 홀로 먹는 현재의 경험이 회상 속 그녀에 대한 이해로 이어진다.","id":"q095"},{"unit":"heungbu","type":"hard","q":"박을 가르기 전의 웃음에 초점을 맞춘 시인의 의도를 가장 적절하게 설명한 것은?","opts":["가난한 사람에게는 어떤 감정도 없다고 보이려고","보물을 확인해야 사랑이 생긴다고 말하려고","부부의 눈물을 물질적 재산으로 바꾸려고","부유함을 얻기 이전부터 존재한 사랑과 위로의 가치를 드러내려고"],"a":3,"exp":"시의 가치는 물질 획득의 결과가 아니라 그 이전부터 존재한 관계의 아름다움에 놓인다.","id":"q096"},{"unit":"climate","type":"hard","q":"수입국의 톤당 탄소 비용이 20, 생산국에서 낸 비용이 10이고 배출량이 2톤이라고 하자. 지문의 원리를 단순화한 차액 부담과 그 설명으로 옳은 것은?","opts":["20이며, 국가 간 톤당 차액 10에 배출량 2를 곱한 학습 예시이다.","40이며, 생산국에서 이미 낸 비용은 언제나 무시한다.","10이며, 배출량은 어떤 경우에도 고려하지 않는다.","0이며, 국가 간 비용 차이는 무역에 아무 영향이 없다."],"a":0,"exp":"단순화한 차액은 max(0,20−10)×2=20이다. 실제 제도 전부의 계산식을 뜻하는 것은 아니다.","id":"q097"},{"unit":"climate","type":"hard","q":"다음 설명 중 옳은 것만 고르면?\nㄱ. RE100 요구는 공급망을 통해 다른 기업에 영향을 줄 수 있다.\nㄴ. ESG는 비재무적 요소를 투자 판단에서 고려한다.\nㄷ. 글은 환경 투자와 경쟁력이 항상 반대 방향이라고 결론짓는다.","opts":["ㄴ","ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ"],"a":1,"exp":"ㄱ과 ㄴ이 옳다. 글은 탈탄소 능력이 경쟁력의 핵심이 된다고 주장하여 과거의 인식을 전환한다.","id":"q098"},{"unit":"historylang","type":"hard","q":"다음 진술 중 함께 성립할 수 있는 조합은?\nㄱ. 개인은 언어의 사회적 약속을 마음대로 바꾸기 어렵다.\nㄴ. 공동체의 언어는 시간에 따라 변한다.\nㄷ. 말소리와 의미의 관계는 반드시 자연적으로 정해진다.","opts":["ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ","ㄱ, ㄷ"],"a":2,"exp":"ㄱ은 사회성, ㄴ은 역사성으로 양립한다. ㄷ은 자의성에 어긋난다.","id":"q099"},{"unit":"hunmin","type":"hard","q":"다음 분석 중 옳은 것만 고르면?\nㄱ. ‘노미’는 ‘놈+이’의 연철이다.\nㄴ. 연철은 이어 적는 표기 방식이다.\nㄷ. 방점 두 개는 상성을 나타낸다.","opts":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":3,"exp":"세 진술 모두 옳다. 형태소 분석, 표기 방식, 성조 표시를 서로 다른 분석 층위로 구별한다.","id":"q100"}]}</script>
<script id="source-data" type="application/json">{"groups":[{"id":"flow","title":"이야기 문학의 흐름","note":"교과서61쪽 본문·필기."},{"id":"chunhyang","title":"춘향전","note":"교과서66–72쪽 본문·낱말 풀이·활동·필기."},{"id":"dodo","title":"도도한 생활 · 교과서 기준","note":"교과서82–84·86–93·95쪽. 85·94쪽은 자료 미제공. 인쇄된 중략은 본문과 구별함."},{"id":"climate","title":"탈탄소 경쟁력이 국가 경쟁력이 되는 시대","note":"교과서115–118쪽 본문·활동지·필기. 글이 쓰인 당시의 전망과 논리를 읽음."},{"id":"language","title":"국어의 역사 · 세종어제훈민정음","note":"교과서153–154쪽. 동일한153쪽3개 파일은 중복1회 수록. 옛한글은 유니코드로 전사."},{"id":"josin","title":"조신몽","note":"프린트1쪽."},{"id":"baegun","title":"백운소설","note":"프린트2쪽."},{"id":"gongbang","title":"공방전","note":"프린트3쪽."},{"id":"gimwon","title":"김원전","note":"프린트4–6쪽. 본문·기출문항·필기·답안 표시."},{"id":"jeongeul","title":"정을선전","note":"프린트7–9쪽. 본문·인물 관계·기출문항·필기."},{"id":"mask","title":"통영 오광대 · 양주 별산대 놀이","note":"프린트10쪽의 삽입 지문을 직접 전사함."},{"id":"dodo-print","title":"도도한 생활 · 프린트 대조본","note":"프린트11–15쪽의 축약 수록본. 학습 기준은 교과서. 각주8·9는 프린트 작성자의 해석이며 특히9는 상반된 해석을 함께 제시함."},{"id":"umbrella","title":"매우 잘생긴 우산 하나","note":"프린트16–17쪽. 본문·문항·필기."},{"id":"obaltan","title":"오발탄 · 소설","note":"프린트18–20쪽. 본문·각주·필기."},{"id":"obaltan-play","title":"오발탄 · 시나리오","note":"프린트21–23쪽. 본문·문항. 비교 지문(가)는 자료 미제공."},{"id":"seongtan","title":"성탄제","note":"프린트24쪽의 전문·각주·보기."},{"id":"slpeum","title":"그날 나는 슬픔도 배불렀다","note":"프린트25쪽의 전문·각주·보기."},{"id":"chanbab","title":"찬밥","note":"프린트26쪽의 전문·각주."},{"id":"heungbu","title":"흥부 부부상","note":"프린트27쪽의 전문·각주."}],"pages":[{"id":"book61","group":"flow","page":61,"title":"교과서 61쪽","text":"[알아 두기]\n1 우리 이야기 문학의 흐름\n우리 이야기 문학은 고대에 신화, 전설, 민담과 같은 설화가 창작되어 구전되었으며, 이를 바탕으로 고려 시대에 패관 문학, 가전체 문학 등이 창작되었다. 조선 시대에는 한글이 창제되며 판소리를 국문으로 기록한 판소리계 소설을 비롯하여 한문과 국문으로 쓰인 고전 소설이 활발하게 향유되었다. 이러한 소설의 전통은 근대 초기의 신소설과 현대 소설로 계승되었다.\n우리 이야기 문학에서는 소설처럼 서술자가 이야기를 전달하는 서사 문학 외에도 인물의 말과 행동으로 이야기를 전달하는 극 문학이 한 흐름을 형성하고 있다. 극 문학은 고대의 축제 때 벌어진 굿이나 놀이로부터 출발하여, 가면극, 인형극 등의 민속극으로 발전했으며, 근대에 이르러 본격적인 무대 예술로 정착하였다.\n\n2 우리 이야기 문학의 특징\n우리 이야기 문학은 신화, 전설, 민담 등의 구전 설화에서 비롯되었다. 신화 가운데 국가의 창업 기원을 다룬 신화를 건국 신화라고 하는데, 고구려 건국 신화인 <주몽 신화>는 영웅의 일대기 구조를 취하고 있다. 이러한 구조는 <홍길동전>, <조웅전>, <박씨전>과 같은 영웅 소설에 계승되었으며, 전쟁과 같은 삶의 역경 속에서 소망을 이야기하는 중요한 서사 구조로 자리 잡았다.\n판소리계 소설은 구전되던 판소리 사설의 영향을 받아 정착된 소설로, 문자로 기록되는 과정에서 작가들의 다양한 의식을 반영한 이본들이 나타나게 되었다. 판소리계 소설에서는 삶의 슬픔이나 갈등을 풍자와 해학으로 풀어내는 경향이 나타나는데, 이는 후대의 다양한 이야기 문학 작품에서도 찾아볼 수 있다.\n\n[핵심 질문] 이야기 문학은 어떻게 이어지고 변화되어 왔을까?\n[탐구 과정]\n01 문학사적 맥락을 고려하여 한국 이야기 문학의 특징이 드러난 작품들을 감상한다.\n02 우리 이야기 문학의 주된 특징이 무엇인지 알아본다.\n03 문학사적 맥락을 고려하여 한국 이야기 문학이 현대에 어떻게 이어져 오고 있는지 탐구한다.\n[배운 내용 활용하기] 서사/극 갈래의 개념과 특성: 갈래에 따른 형상화 방법의 특성을 고려하여 작품을 수용한다.","notes":[{"quote":"신화, 전설, 민담","text":"필기 비교: 신화는 진실로 믿음(신성성), 아득한 고대·신성한 장소. 전설은 사실로 믿음, 구체적 과거·특정 시대와 장소. 민담은 허구로 인식하며 흥미성·교훈성이 있고, 막연한 시간과 장소(옛날 어느 마을)가 제시됨."},{"quote":"신화 가운데","text":"필기 표: 신화는 주인공 승리와 국가·질서 수립, 증거물은 민족·왕조 등 포괄적·추상적 대상. 전설은 주인공 패배와 비극적 결말의 경향, 증거물은 구체적·개별적 대상. 민담은 주인공 승리로 독자의 희망을 반영하는 해피엔딩의 경향, 특정 증거물은 없음. 이는 대표적 경향이며 모든 작품에 기계적으로 적용할 공식은 아님."},{"quote":"이본","text":"필기: 경판본은 서울에서 출판, 완판본은 완주(전주)에서 출판. 이본에 따라 인물 수와 에피소드 수가 적거나 많아질 수 있음."},{"quote":"서사 문학","text":"문학사의 첫 문단은 서사 갈래의 흐름, 두 번째 문단은 극 갈래의 흐름으로 구별한 필기."},{"quote":"영웅의 일대기","text":"건국 신화의 서사 구조가 후대 영웅 소설에 계승됨을 밑줄로 강조함."}],"kind":"교과서"},{"id":"book66","group":"chunhyang","page":66,"title":"교과서 66쪽","text":"작품 2 춘향전 / 작자 미상\n[감상의 초점] 신분을 초월한 남녀 간의 사랑을 다룬 판소리계 소설입니다. 고전 문학의 특성과 흐름을 고려하며 주체적인 관점에서 읽어 봅시다.\n\n[앞부분의 줄거리]\n조선조 숙종 때, 전라도 남원에 사는 퇴기 월매는 성 참판과의 사이에서 춘향을 낳아 정성껏 기른다. 남원 부사로 부임한 아버지를 따라 한양에서 내려온 몽룡은 단옷날 경치를 구경하고자 광한루 오작교에 나왔다가 그네를 타러 나온 춘향을 보고 첫눈에 반한다. 그날로 둘은 부부의 연을 맺는다. 그러던 어느 날 몽룡의 아버지가 동부승지에 임명되어 가족 모두가 남원을 떠나게 되고, 몽룡은 후일을 기약하며 춘향을 두고 한양으로 떠난다.\n그 후, 새로운 남원 부사로 변학도가 부임하고 춘향을 불러 수청을 강요한다. 하지만 춘향은 정절을 지키려고 수청 요구를 거부하다 옥에 갇혀 고초를 겪는다. 한편 한양으로 떠났던 몽룡은 전라도 어사가 되어 남원으로 오는 길에 농부들로부터 남원의 변 사또가 학정을 일삼고 있다는 사실과 춘향이 옥에 갇혔다는 소식을 듣는다. 몽룡은 신분을 숨긴 채 거지 행색으로 월매와 춘향을 만나고, 이에 월매는 몽룡을 박대하고 원망하나 춘향은 변함없는 애정을 보이며 몽룡에게 유언을 남긴다.\n\n이튿날 날이 밝자 조회를 끝내고 이웃 읍의 수령들이 남원으로 몰려들었다. 운봉·구례·곡성·순창·진안·장수의 원님들이 아랫사람들을 거느리고 차례로 잔치 마당으로 들어왔다. 왼편에 행수 군관, 오른편에 명을 전하는 사령, 한가운데 본관 사또는 주인이 되어 하인 불러 분부하되,\n“관청색 불러 다과상 올려라. 육고자 불러 큰 소 잡고, 예방 불러 악공을 대령하라. 승발 불러 차일 대령하라. 사령 불러 잡인을 금하라.”\n이렇듯 요란한 가운데 깃발들이 휘날리고, 삼현 육각 음악 소리 공중에 떠 있고, 초록 저고리에 붉은 치마를 입은 기생들이 하얀 손을 높이 들어 춤을 춘다.\n“지화자, 두둥실, 좋다.”\n\n[낱말 풀이]\n학정(虐政): 포학하고 가혹한 정치.\n관청색(官廳色): 조선 시대에 수령(守令)의 음식물을 맡아보던 구실아치.\n육고자(肉庫子): 푸줏간에서 육류를 공급하는 관아에 속한 노비.\n승발(承發): 지방 관아의 구실아치 밑에서 잡무를 맡아보던 사람.\n차일(遮日): 햇볕을 가리기 위하여 치는 포장.\n삼현 육각(三絃六角): 삼현(거문고, 가야금, 향비파)과 육각(북, 장구, 해금, 피리, 태평소 등으로 이루어진 악기 편성)의 갖가지 악기.","notes":[{"quote":"퇴기 월매","text":"필기: 월매는 관기 출신. 성 참판은 고위직 양반."},{"quote":"춘향을 낳아","text":"필기: 춘향은 천민 신분(종모법)으로 표시됨."},{"quote":"동부승지","text":"필기: 승지=왕의 비서."},{"quote":"변 사또가 학정을 일삼고 있다는","text":"학정과 춘향의 옥살이가 몽룡의 귀환에 앞서 제시되는 핵심 정보로 밑줄 표시됨."}],"kind":"교과서"},{"id":"book67","group":"chunhyang","page":67,"title":"교과서 67쪽","text":"[앞쪽에서 이어짐]\n하는 소리에 어사또 마음이 심란하다. 화를 누르고 한번 놀려 줄 심산으로 어슬렁어슬렁 잔치판으로 걸어 들어갔다.\n“여봐라, 사령들아. 너희 사또께 여쭈어라. 먼 데 있는 걸인이 마침 잔치를 만났으니 고기하고 술이나 좀 얻어먹자고 여쭈어라.”\n사령 하나가 뛰어나와 등을 밀쳐 낸다.\n“어느 양반인데 이리 시끄럽소. 사또께서 거지는 들이지도 말라고 했으니 말도 내지 말고 나가시오.”\n운봉 수령이 그 거동을 지켜보다가 무슨 짐작이 있었는지 변 사또에게 청했다.\n“저 걸인이 의관은 남루하나 양반의 후예인 듯하니 저 끝자리에 앉히고 술이나 한잔 먹여 보내는 것이 어떻겠소?”\n“운봉 생각대로 하지요마는…….”\n마지못해 입맛을 다시며 허락을 한다. 어사또 속으로 ‘오냐, 도적질은 내가 하마. 오랏줄은 네가 져라.’ 되뇌며 주먹을 꽉 쥐고 있는데 운봉 수령이 사령을 부른다.\n“저 양반 드시라고 해라.”\n어사또 들어가 단정히 앉아 좌우를 살펴보니 마루 위의 모든 수령들이 다과상을 앞에 놓고 진양조 느린 가락을 즐기는데, 어사또 상을 보니 어찌 아니 통분하랴. 귀퉁이가 떨어진 개다리소반에 닳나무 젓가락, 콩나물에 깍두기, 막걸리 한 사발이 놓였구나. 상을 발로 탁 차 던지며 운봉의 갈비를 슬쩍 집어 들고,\n“갈비 한 대 먹읍시다.”\n“다리도 잡수시오.”\n하고 운봉이 하는 말이,\n“이런 잔치에 풍류로만 놀아서는 맛이 적으니 운자(韻字)를 내라 시 한 수씩 지어 보면 어떻겠소?”\n\n[읽기 중 활동 1] 변 사또의 생일잔치를 보고 어사또가 심란해하는 이유를 짐작해 보자.\n[낱말 풀이]\n오랏줄: 도둑이나 죄인을 묶을 때에 쓰던, 붉고 굵은 줄.\n진양조: 민속 음악에서 쓰는 판소리 및 산조 장단의 하나. 가장 느리다.\n개다리소반: 상다리 모양이 개의 다리처럼 휜 작은 밥상.\n운자(韻字): 한시의 운으로 다는 글자.","notes":[{"quote":"갈비 한 대 먹읍시다.","text":"필기: 갈비·다리를 음식과 신체에 겹쳐 사용하는 언어유희."},{"quote":"운자(韻字)","text":"필기: 압운은 같은 계열의 운모를 사용하는 것. 운자를 맞추는 방식과 연결됨."}],"kind":"교과서"},{"id":"book68","group":"chunhyang","page":68,"title":"교과서 68쪽","text":"“그 말이 옳다.”\n다들 찬성을 했다. 운봉이 먼저 운을 낼 때 ‘높을 고(高)’ 자, ‘기름 고(膏)’ 자 두 자를 내어놓고 차례로 운을 달아 시를 지었다. 앞사람이 끝나면 뒷사람이 받아 시를 지을 때 어사또 끼어들어 하는 말이,\n“이 걸인도 어려서 글을 좀 읽었는데, 좋은 잔치를 맞아 술과 안주를 포식하고 그냥 가기가 염치가 아니니 한 수 하겠소이다.”\n운봉이 반갑게 듣고 붓과 벼루를 내주니, 백성들의 사정과 본관 사또의 정체를 생각하여 시 한 편을 써 내려갔다.\n\n금준미주(金樽美酒)는 천인혈(千人血)이요,\n옥반가효(玉盤佳肴)는 만성고(萬姓膏)라.\n촉루낙시(燭淚落時)에 민루락(民淚落)이요,\n가성고처(歌聲高處)에 원성고(怨聲高)라.\n\n이 글의 뜻은,\n금 술잔의 좋은 술은 수많은 사람의 피요,\n옥쟁반의 좋은 안주는 만백성의 기름이라.\n촛농이 떨어질 때 백성들 눈물도 떨어지고,\n노랫소리 높은 곳에 원망의 소리도 높구나.\n\n이렇게 시를 지어 보이니 술에 취한 변 사또는 무슨 뜻인지도 모르나, 글을 받아 본 운봉은 속으로 ‘아뿔싸! 일 났다.’ 가슴이 철렁 내려앉았다.\n이때 어사또 하직하고 간 연후에 운봉이 공형 불러 분부한다.\n“야야, 일 났다!”\n공방 불러 자리 단속, 병방 불러 역마 단속, 관청색 불러 다과상 단속, 옥사장 불러 죄인 단속, 집사 불러 형벌 기구 단속, 형방 불러 서류 단속, 사령 불러 숙직 단속, 한참 이렇게 요란할 때 눈치 없는 본관 사또, 운봉을 향해 말을 던진다.\n“여보 운봉, 어딜 그리 바삐 다니시오.”\n“소피 보고 들어오.”\n\n[읽기 중 활동 2] 어사또가 한시를 지은 의도를 추측해 보자.\n[낱말 풀이]\n공형(公兄): 조선 시대에 각 고을의 세 구실아치. 호장, 이방, 수형리를 이른다.\n소피: ‘오줌’을 완곡하게 이르는 말.","notes":[{"quote":"좋은 잔치를 맞아","text":"필기: 반어적 표현. 백성들의 사정은 가렴주구, 본관 사또의 정체는 학정으로 적어 놓음."},{"quote":"금 술잔의 좋은 술","text":"생일잔치에서 관리들이 먹는 술과 안주를 백성의 피와 기름에 대응시킴."},{"quote":"노랫소리 높은 곳","text":"필기: 잔치의 소리와 백성의 원망을 대응시킴. 촛농과 백성들의 눈물도 같은 방식으로 연결됨."}],"kind":"교과서"},{"id":"book69","group":"chunhyang","page":69,"title":"교과서 69쪽","text":"그때 술이 거나하게 취한 변 사또가 술주정을 하느라고 느닷없이 명을 내렸다.\n“춘향이 빨리 불러 올려라.”\n이때 어사또가 서리에게 눈길을 주어 신호를 하니, 서리·중방이 역졸 불러 단속할 때 이리 가며 수군, 저리 가며 수군수군 신호를 전한다. 서리·역졸 거동 보자. 한 가닥 올로 지은 망건에 두터운 비단 자쌈개, 새 패랭이 눌러쓰고, 석 자 길이 발감개에 새 짚신 신고, 속적삼·속바지 산뜻이 입고, 여섯 모 방망이에 사슴 가죽끈을 매달아 손목에 걸어 쥐고, 여기서 번뜩 저기서 번뜩, 남원읍이 웅성웅성거렸다.\n이때 청파의 역졸들이 달 같은 마패를 햇빛같이 번쩍 들고 우렁차게 소리를 질렀다.\n“암행어사 출두야!”\n역졸들이 일시에 외치는 소리에 강산이 무너지고 천지가 뒤집히는 듯하니 산천초목인들 금수인들 아니 떨겠는가. 한번 소리가 나자 남문에서도 “출두야!” 북문에서도 “출두야!” 동문에서도 서문에서도 “출두야!” 소리가 맑은 하늘에 천둥 치듯 진동했다.\n“공형 들라.”\n\n[낱말 풀이]\n서리(胥吏): 관아에 속하여 말단 행정 실무에 종사하던 구실아치.\n중방(中房): 고을 원의 시중을 들던 사람.\n패랭이: 대를 쪼개어 만든 갓.","notes":[{"quote":"새 패랭이","text":"필기: 기능성 모자."},{"quote":"여섯 모 방망이","text":"필기: 육각형."},{"quote":"강산이 무너지고","text":"필기: 자연(강산·천지·산천초목)과 짐승(금수)을 들어 출두의 기세를 과장함."}],"kind":"교과서"},{"id":"book70","group":"chunhyang","page":70,"title":"교과서 70쪽","text":"외치는 소리에 육방이 넋을 잃는다.\n“공형이오.”\n서둘러 나오는데 등나무 채찍으로 따라 치니,\n“애고, 죽네.”\n“공방, 공방!”\n공방이 자리를 들고 들어오며,\n“안 하려는 공방을 하라더니 저 불 속에 어찌 들어가라?”\n등나무 채찍으로 따라 치니,\n“애고, 박 터졌네.”\n좌수·별감은 넋을 잃고, 이방·호장은 혼을 잃고, 삼색 옷 입은 나졸들은 분주하네. 모든 수령들이 도망하는데 그 꼴이 가관이다. 도장 궤 잃고 유밀과 들고, 병부 잃고 송편 들고, 탕건 잃고 용수 쓰고, 갓 잃고 밥상 쓰고, 칼집 쥐고 오줌 누기, 부서지니 거문고요, 깨지나니 북·장구라.\n본관 사또 똥을 싸고, 명석 구멍에 새앙쥐 눈 뜨듯 하면서 관아 깊숙한 안채로 들어가며 급히 내뱉는 말이,\n“어, 추워라. 문 들어온다 바람 닫아라. 물 마르다 목 들여라.”\n관청색은 상을 잃고 문짝을 이고 내달으니 서리, 역졸 달려들어 후다닥 땀아 친다.\n“애고, 나 죽네.”\n이때 암행어사 분부하되,\n“이 고을은 대감께서 계시던 곳이다. 소란을 금하고 객사로 옮기라.”\n관아를 한차례 정리하고 동헌에 올라앉은 후에,\n“본관은 봉고파직하라.”\n“본관은 봉고파직이오.”\n동서남북 문밖에 봉고파직이라는 암행어사의 명이 나붙었다. 절차에 따라 옥의 형리를 불러 분부하되,\n“옥에 갇힌 죄인들을 다 올리라.”\n호령하니 죄인을 올리거늘 다 각각 죄를 물은 후에 죄 없는 자들을 풀어 줄 때,\n“저 계집은 무엇인고?”\n형리가 아뢴다.\n“기생 월매의 딸이온데 관가에서 포악을 떤 죄로 옥중에 있사옵니다.”\n“무슨 죄인고?”\n\n[읽기 중 활동 3] 수령들의 모습을 희화화한 의도를 파악해 보자.\n[낱말 풀이]\n좌수(座首): 조선 시대에, 지방의 자치 기구인 향청(鄕廳)의 우두머리.\n별감(別監): 조선 시대에, 조사·감독 따위를 위하여 지방에 보내던 임시 벼슬.\n유밀과(油蜜菓): 밀가루나 쌀가루 반죽을 적당한 모양으로 빚어 바싹 말린 후에 기름에 튀기어 꿀이나 조청을 바르고 튀밥, 깨 따위를 입힌 과자.\n탕건(宕巾): 벼슬아치가 갓 아래 받쳐 쓰던 관(冠)의 하나.\n용수: 싸리나 대오리로 만든 둥글고 긴 통. 술이나 장을 거르는 데 쓴다.\n명석 구멍에 새앙쥐 눈 뜨듯: 겁이 나 몸을 숨기고 바깥을 살피는 모양을 비유적으로 이르는 말.\n봉고파직(封庫罷職): 어사나 감사가 못된 짓을 많이 한 고을의 원을 파면하고 관가의 창고를 봉하여 잠금. 또는 그런 일.","notes":[{"quote":"그 꼴이 가관이다.","text":"필기: 편집자적 논평. “가관이다”는 ‘볼만하다’를 비꼬는 평가임."},{"quote":"도장 궤 잃고 유밀과 들고","text":"필기: 해학적 표현. 관리들이 엉뚱한 물건을 챙기며 도망하는 모습을 희화화함."},{"quote":"명석 구멍에 새앙쥐 눈 뜨듯","text":"필기: 직유법."},{"quote":"문 들어온다 바람 닫아라. 물 마르다 목 들여라.","text":"‘문/바람’, ‘물/목’의 자리를 뒤바꾼 말. 당황한 상태를 드러냄."},{"quote":"좌수·별감","text":"곁의 필기에서는 남원 부사를 서울시장에, 좌수·별감을 구청장·동사무소장에 견주어 위계를 설명함. 현대 제도와 정확히 같은 직위라는 뜻은 아님."}],"kind":"교과서"},{"id":"book71","group":"chunhyang","page":71,"title":"교과서 71쪽","text":"“본관 사또를 모시라고 불렀더니 절개를 지킨다면서 사또 명을 거역하고 사또 앞에서 악을 쓴 춘향이로소이다.”\n어사또 분부하되,\n“너만 한 년이 수절한다고 나라의 관리를 욕보였으니 살기를 바랄 것이냐. 죽어 마땅할 것이나 기회를 한 번 더 주마. 내 수청도 거역할 테냐?”\n이 어사는 춘향의 마음을 떠보려고 짐짓 한번 다그쳐 보는 것인데, 춘향은 어이가 없고 기가 꽉 막힌다.\n“내려오는 사또마다 빠짐없이 명관이로구나! 어사또 들으시오. 층층이 높은 절벽 높은 바위가 바람이 분들 무너지며, 푸른 솔 푸른 대가 눈이 온들 변하리까. 그런 분부 마옵시고 어서 빨리 죽여 주오.”\n하면서 무슨 생각이 났는지 황급히 이리저리 두리번거리며 향단이를 찾는다.\n“향단아, 서방님 혹시 어디 계신가 살펴보아라. 어젯밤 오셨을 때 천만당부하였는데 어디를 가셨는지, 나 죽는 줄도 모르시는가? 어서 찾아보아라.”\n어사또 다시 분부하되,\n“얼굴을 들어 나를 보아라.”\n하시기에 춘향이 천천히 고개를 들어 대 위를 살펴보니, 거지로 왔던 낭군이 어사또로 뚜렷이 앉아 있었다. 순간, 춘향은 깜짝 놀라 눈을 질끈 감았다가 떴다.\n“나를 알아보겠느냐? 네가 찾는 서방이 바로 여기 있느니라.”\n어사또는 즉시 춘향의 몸을 묶은 오라를 풀고 동헌 위로 모시라 명을 내렸다. 몸이 풀린 춘향은 웃음 반 울음 반으로,\n“얼씨구나 좋을씨고, 어사 낭군 좋을씨고. 남원읍에 가을 들어 낙엽처럼 질 줄 알았더니 객사에 봄이 들어 봄바람에 핀 오얏꽃이 날 살리네. 꿈이나 생시냐? 꿈이 깰까 염려로다.”\n\n[읽기 중 활동 4] 어사또에게 수청 요구를 들은 춘향의 심정이 어떠할지 생각해 보자.","notes":[],"kind":"교과서"},{"id":"book72","group":"chunhyang","page":72,"title":"교과서 72쪽","text":"한참 이렇게 즐길 적에 뒤늦게 달려온 춘향 모도 입이 찢어져라 벙글벙글 웃으며 어깨춤을 추고, 구경 왔던 남원 고을 백성들도 얼씨구 덩실 춤을 추었다. 어사또는 춘향의 손을 잡고 놓을 줄 모르고 쌓였던 사연의 실타래는 끝날 줄을 몰랐으니, 그 한없이 즐거운 일을 어찌 일일이 말로 하겠는가.\n춘향의 높은 절개가 광채 있게 되었으니 어찌 아니 좋을 것인가. 어사또 남원읍의 공사를 모두 처리하고 춘향 모녀와 향단이를 데리고 서울로 길을 떠나는데, 위의가 찬란하니 세상 사람들 누가 칭찬하지 않으랴.\n이때 춘향이 남원을 하직할 때, 영화롭고 귀하게 되었건만 정든 고향을 이별하려니 한편으로는 기쁘고 한편으로는 울적했다.\n“놀고 자던 내 방 부용당아 부디 잘 있거라. 광한루 오작교야 잘 있거라. 영주각도 잘 있거라. ‘봄풀들은 해마다 푸르건만 왕손은 가서 돌아오지 않는구나.’라더니 나를 두고 이름이라. 다 각기 이별할 제 만수무강하옵소서. 다시 보기 아득해라.”\n이렇듯 마음속으로 빌며 작별을 고했다.\n이때 어사또는 좌도, 우도 여러 읍을 순행하여 백성들의 사정을 살핀 후에 서울로 올라가 어전에 나아가 임금께 엎드려 절하니 판서, 참판, 참의들이 들어와 보고서들을 일일이 점검했다. 심사를 마친 후 임금께서 크게 칭찬을 했다. 신하들도 입을 모아 큰 공을 세웠다고 칭찬하면서 춘향의 이야기도 덧붙였다. 임금은 즉시 이몽룡에게 이조 참의, 대사성이라는 벼슬을 내리고 춘향에게는 정렬부인 칭호를 내렸다. 이몽룡은 임금의 은혜에 감사하며 절을 하고 물러 나와 부모를 뵈오니 성은 입음을 축하해 주셨다.\n그 후 이몽룡은 벼슬이 점점 높아져 이조 판서, 호조 판서, 우의정, 좌의정, 영의정을 다 지내고 벼슬에서 물러난 후에 정렬부인 성춘향과 더불어 백년해로했다. 이몽룡은 정렬부인에게서 세 아들과 세 딸을 두었는데, 자식들은 모두 총명하여 그 부친보다도 오히려 재주가 나은 점이 많더니 부친을 이어 계계승승 모두 일품의 벼슬자리를 만세토록 유전하더라.\n— <열녀춘향수절가>(완판 84장본)\n\n[낱말 풀이]\n위의(威儀): 위엄이 있고 엄숙한 태도나 차림새.\n봄풀들은 해마다~돌아오지 않는구나: 중국 당나라의 시인 왕유의 시 <산중송별(山中送別)>에서 차용한 것이다.\n정렬부인(貞烈夫人): 조선 시대에 정조와 지조를 굳게 지킨 부인에게 내리던 칭호.\n백년해로(百年偕老): 부부가 되어 한평생을 사이좋게 지내고 즐겁게 함께 늙음.\n유전(遺傳)하다: 물려받아 내려오다. 또는 그렇게 전하다.\n완판: 완판본(完板本). 조선 후기에 전라북도 전주에서 간행된 목판본의 고전 소설을 통틀어 이르는 말로서, 서울에서 판각한 책인 경판본(京板本)과 구분된다.","notes":[],"kind":"교과서"},{"id":"book82","group":"dodo","page":82,"title":"교과서 82쪽","text":"작품 2 도도한 생활 / 김애란\n[감상의 초점] 청년의 고단한 삶을 다루고 있는 소설입니다. 작품의 주요 소재와 주인공이 머무는 공간의 의미를 파악하고, 주인공이 겪는 삶의 문제에 주목하며 작품을 주체적으로 읽어 봅시다.\n\n학원에서 처음 배운 것은 도를 짚는 법이었다. 첫 번째 음이니까, 첫 번째 손가락으로 도. 내가 건반을 누르자, 도는 겨우 도— 하고 울었다. 나는 조금 전의 도를 기억하며 한 번 더 건반을 눌러 보았다. 도는 당황한 듯 다시 도— 하고 소리 낸 뒤 제 이름이 지나가는 동선을 바라봤다. 나는 음 하나가 깨끗하게 사라진 자리에 앉아, 새끼손가락을 세운 채 굳어 있었다. 녹색 코팅지가 발린 유리 벽 사이론 오후의 볕이 탁하게 들어왔고, 피아노와, 그것을 처음 만진 나 사이로 정적이 흘렀다. 나는 신중하게 고른 단어를 내뱉듯 작게, 중얼거렸다. 도…….\n\n건반에 손을 얹는 법은 단순한 듯 어려웠다. 손에 힘을 풀고 뭔가 부드럽게 감아쥐는 모양을 만들어 보라는 것이었는데, 그때 나는 힘을 주지 않고도 뭔가를 움켜쥘 수 있다는 게, 또 세상에 그런 것이 존재한다는 게 믿기지 않았다. 나는 두 개의 손가락을 이용해 온종일 ‘도레 도레’를 연습했다. 낮은음과 높은음을 함께 눌렀을 때 낮은음이 더 오래간다는 사실은 나중에 알았다.\n\n피아노 건반의 모양은 똑같았다. 그것은 희거나 검었고, 동일한 크기와 질감을 갖고 있었다. 나는 도의 위치를 자주 잊었다. 그것이 레가 아니라 도라는 것을, 미가 아니라 파라는 것을 만져 보기 전에 확신할 수 없었다. 내가 찾는 도는 왼쪽 가장자리 건반으로부터 스물네 손가락 떨어진 곳에 있었다. 건반 위에서 길을 잃을 때마다 1부터 24까지의 숫자를 일일이 세어 봐야 했다. 그렇게 도를 찾아낸 뒤 할 수 있는 일이란, 고작 도를 다시 치는 일일 수밖에 없었지만, 나는 덩치 크고 내성적인 악기가 처음으로 낸 소리, 완고하고 편안한 그 도—의 울림을 좋아했다. 다행히 도를 찾고 나면 레","notes":[],"kind":"교과서"},{"id":"book83","group":"dodo","page":83,"title":"교과서 83쪽","text":"[82쪽에서 이어짐]\n를 짚기가 수월했다. 레는 도 바로 옆에 있었다. 미는 레 옆이고, 파는 미 다음이니까, 일단 도를 찾는 것이 중요했다.\n\n연습실 문에는 죽은 음악가의 이름이 씌어 있었다. 나는 베토벤실에 앉아 ‘도레 도레’를 연습했다. 리스트 방에서는 ‘도레미’를, 헨델 방에서는 ‘도레미파솔’을 연주했다. 두 손가락만 사용했을 땐 ‘이만하면 할 만하네.’ 싶었고, 세 손가락을 움직였을 땐 ‘시시하다.’ 자만했고, 다섯 손가락을 써야 했을 땐 ‘이거 어려워서 못해 먹겠다.’ 소리쳤다. 내가 살던 시골 마을엔 음악 학원이 하나밖에 없었다. 그곳에선 어설프게 바이올린도 가르치고, 플루트도 가르치고, 웅변까지 지도했다. 다행히 바이올린이나 플루트를 신청하는 학생은 거의 없었다. 만일 배우고자 했다면 학원에서 먼저 말렸으리라. 동네에서 바이올린을 켤 줄 아는 아이는 음악 학원 원장의 딸 한 명뿐이었다. 그 애는 학예회에 날개 달린 원피스를 입고 나와, 초등학생이 듣기에도 참을 수 없는 연주를 했다. 그 애의 형편없는 연주를 들으며 나는 처음으로 누군가를 때리고 싶다는 충동에 시달렸다. 음악 학원에서 왜 웅변을 가르쳤는지는 모르겠다. 웅변은 음악이 아닌데. 그래도 수강생은 있는 듯했다. 교내 웅변대회를 앞둔 학생이나, 소극적인 성격 탓에 부모 손에 끌려온 아이들이었다. 연습실에서 내가 친 음이 정갈하게 사라지는 느낌을 즐기고 있을 때면, 어디선가 찢어질 듯 “나는 공산당이 싫어요!”라는 외침이 들려오곤 했다. 베토벤은 귀가 먹어 그 소리를 못 들었겠지만. 나는 두 번째로 누군가를 때리고 싶다는 욕구에 시달렸다. 어쨌든 헨델이 없는 헨델 방이었고, 리스트가 없는 리스트 방이었다. 나는 그들이 누군지도 몰랐다.\n\n연습이 지루할 때면 각 소리의 표정을 그려 봤다. 레는 곁눈질하는 느낌이고, 솔은 까치발 선 인상을 줬다. 미는 시치미를 잘 떼고, 파는 솔보다 낮지만 쾌활할 것 같았다. 나는 다섯 음에 적응해 갔다. 피아노는 건반 자체가 아닌 자기 내부의 어떤 것을 ‘때려서’ 음을 만든다는 것도 이해했다. 높은음일수록 빨리 사라진다는 것도, 음마다 자기 시간을 따로 갖고 있다는 것도 말이다. 그러니 각 음이 모여 음악이 된다는 건, 여러 개의 시간이 만나 벌어지는 어떤 일일지도 몰랐다.\n문제는 ‘라’에서부터 시작됐다. 라를 만나기 전 나는 근심에 싸여 있었다. 다섯 손가락으로 다섯 음을 연주하는 건 무난하고 상식적인 일이었다. 하지만 다섯 손가락으로 여섯 음 이상을 칠 땐 어떻게 해야 하는지 알 수 없었다. 그것은 오진법밖에 쓸 줄 모르는 문명인이 만난 십이진법 같은 거였다. 나는 라를 알고 싶었다. 하지만 라를 알게 되는 즉시 귀찮은 일이 생길 것 같아 두려웠다. 어려운 건 싫은데. 오음계로 된 노래도 많으니까, 평생 오음계만 연주해도 되지 않을까. 라를 배우던 날, 나는 선생님의 손동작을 숨죽여 바라보고 있었다. 선생님은 내 옆에서 도를 쳤다. 내가 치는 방식대로였다. 선생님은 레를 쳤다. 그것도 같은 방법이었다. 선생님은 예상대로 미를 짚었다. 나는 초조함을 느꼈다. 이윽고 선생님이 파를 치는 순간, 눈앞으로 뭔가 휙 지나가는 것이 보였다. 그녀는 약지로 파를 치지 않고, 파 자리에 재빨리 엄지를 옮겨 놓은 뒤, 두 번째 손가락으로 솔을 짚은 것이었다. 나머지 손가락들이 자연스럽게 라와 시를 건드렸다. 도레미파솔라시도. 완전한 칠음계였다. 나는 선생님의 손놀림을 보며 감탄한 듯 중얼거렸다. 이제, 음악이 뭔지 알 것 같다고.","notes":[],"kind":"교과서"},{"id":"book84","group":"dodo","page":84,"title":"교과서 84쪽","text":"만둣집을 했던 엄마가 어떻게 피아노를 가르칠 생각을 했는지 알 수 없다. 욕심이거나 뭔가 강요하려 한 것은 아니었다. 엄마 는 배움이 짧았고, 자신의 교육적 선택에 늘 자신감을 갖지 못했다. 다만 그때 엄마는 어떤 ‘보통’의 기준들을 따라가고 있었으 리라. 놀이공원에 가고, 엑스포에 가는 것처럼, 어느 시기에는 어떠어떠한 것을 해야 한다는 풍문들을 말이다. 돌이켜보면 어릴  때 엑스포에 가고 박물관에 간 것이 그렇게 재밌었던 것 같지는 않다. 하지만 나를 엑스포에 보내주고, 놀이공원에 함께 가 준  엄마에게 고마운 마음이 든다. 누구나 겪는, 평범한 유년의 프로그램 중 하나였을 뿐이지만, 무지한 눈으로 시대의 풍문들에 고 개 끄덕였을, 김밥을 싸고 관광버스에 올랐을 엄마의 피로한 얼굴이 떠오르는 까닭이다. 이따금 내가 회전목마 위에서 비명을  지르는 동안, 한 손으로 얼굴을 가린 채 벤치에 누워 있던 엄마의 모습이 떠오르곤 한다. 신을 벗고 짧은 잠을 청하던 엄마의  얼굴은 도―처럼 낮고 고요했던가 그렇지 않았던가. 엄마를 따라 하느라, 피아노 의자 위에 누워 있던 나를 보고, 선생님은 라― 처럼 놀랐던가 그렇지 않았던가. 일과 중 가장 중요한 일이 ‘엄마 100원만.’인 줄 알았던 때이긴 했지만. 나는 헨델이 없는 헨델 의 방에서 음악을 했고, 엄마는 베토벤같이 풀린 파마머리를 한 채 귀머거리처럼 만두를 빚었다. 마침 동네에 음악 학원이 생겼 고, 엄마의 만두가 불티나게 팔리던 시절이라 가능했던 일인지도 모른다. 엄마는 내게 피아노를 사 줬다. 읍내서부터 먼짓길을 달려온 파란 트럭이 집 앞에 섰을 때, 엄마가 무척 기뻐했던 기억이 난 다. 세탁기도 냉장고도 아닌 피아노라니. 어쩐지 우리 삶의 질이 한 뼘쯤 세련돼진 것 같았다. 피아노는 노릇한 원목으로 돼,  학원에 있는 어떤 것보다 좋아 보였다. 원목 위에 양각된 우아한 넝쿨 무늬, 은은한 광택의 금속 페달, 건반 위에 깔린 레드 카 펫은 또 얼마나 선정적인 빛깔이던지. 그것은 우리집에 있는 가재들과 때깔부터 달랐다. 다만 좀 멋쩍은 것은 피아노가 가정집  ‘거실’이 아닌, 만두 가게 안에 놓인다는 사실이었다. 우리 가족은 생계와 주거를 한 건물 안에서 해결하고 있었다. 낮에는 방에  손님을 들이고, 밤에는 식구들이 이불을 펴고 자는 식으로 말이다. 피아노는 나와 언니가 쓰는 작은방에 놓였다. 안방은 주방 을, 작은방은 홀을 마주 보고 있었다. 나는 오후 내 가게에 붙어 피아노를 연주했다. 울림폭을 크게 해 주는 오른쪽 페달을 밟고, 멋을 부려 <소녀의 기도>나 <아 드린느를 위한 발라드>와 같은 곡을 말이다. 찜통에선 수증기가 푹푹 나고, 홀에서는 장사꾼과 농부들이 흙 묻은 장화를 신은  채 우적우적 만두를 씹고 있는 공간에서, 누구라도 만두를 삼키다 말고 울고 가게 만들었을 그런 연주를. 쉽고 아름답지만 촌스 러워서 누구라도 가게 앞을 지나다 얼굴을 붉히게 만들었을, 그러나 좀 더 정직한 사람이라면 만두 접시를 집어 던지며 ‘다 때 려치우라 그래!’ 소리쳤을 그런 연주를 말이다. 한번은 연주가 끝난 뒤 박수 소리가 들려 고개를 돌린 적이 있다. 홀에서 웬 백 인 남자가 손뼉을 치며 “원더풀.”이라 외치고 있었다. 외국인과 나 사이에 어정쩡한 침묵이 흘렀다. 나는 부끄러웠지만 수줍게  한마디 했다. 땡큐……. 집 안에선 밀가루 입자가 햇빛을 받으며 분분히 날렸고, 건반을 짚은 손가락 아래론 지문이 하얗게 묻 어났다.\n\n[읽기 중 활동 1] 엄마가 ‘나’에게 피아노를 가르칠 생각을 한 이유는 무엇일지 생각해 보자.\n[낱말 풀이]\n귀머거리: ‘청각 장애인’을 낮잡아 이르는 말.\n가재(家財): 한집안의 재물이나 재산. 살림 도구나 돈 따위를 이른다.","notes":[],"kind":"교과서"},{"id":"book86","group":"dodo","page":86,"title":"교과서 86쪽","text":"학원은 2년 정도 다녔다. 그사이 나는 바이엘 두 권을 떼고, 체르니와 하농에 입문했다. 체르니란 말은 이국에서 불어오는  바람 같아서, 돼지 비계나 단무지란 말과는 다른 울림을 주었다. 나는 체르니를 배우고 싶기보단 체르니란 말이 갖고 싶었다.  (중략) [중략 부분의 줄거리] ‘나’는 중학교에 올라가서는 가끔 악보를 사다가 유행가를 연주하지만 고등학교에 가서는 더 이상 피아노를 치지 않는다. 고3 겨울 방학에  ‘나’의 집은 아빠가 선 빚보증 때문에 망하고, ‘나’는 그즈음 서울권 대학의 컴퓨터학과에 합격한다.\n\n엄마는 차압 딱지가 붙기 전, 값나가는 물건을 팔아 버리자고 했다. 아빠와 나는 고개를 끄덕이며 열심히 고가품을 찾아 움직 였다. 그러나 10분도 지나지 않아 우리는 우리 집서 값나가는 물건이 피아노밖에 없다는 걸 깨달았다. 그것도 팔면 80만 원이 안 되는 물건이었다. 엄마는 고민하더니, 다시 피아노를 팔지말자고 했다. 나는 손사래를 치며 “나 때문이면 괜찮다.”고 했다.  피아노를 치지 않은 지 한참 됐고, 진심으로 미련도 없었다. 피아노 위에 올려진 인형들은 말똥말똥한 표정을 짓고 있었다. 모 두 아빠가 뽑아 온 것이었다. 엄마는 고민하다 피아노는 일단 갖고 있자고 했다. “어떻게?” 엄마가 천천히 입을 열었다. 네가 서울로 갖고 가 주었으면 좋겠다고. “…….” 나는 눈을 둥그렇게 뜨고 말했다. “거기 반지하야, 엄마.” 엄마가 그 사실을 모를 리 없었다. 나는 계속 피아노를 팔자고 설득했다. 사실 그것은 우리에게 아무 쓸모도 없었다. 엄마는  그게 무슨 기념비라도 되는 양, “사정이 좋아질지도 모르니까…….” 하고 말끝을 흐렸다. 결국 나는 피아노를 이고 상경해야 했 다. 내가 집을 떠나던 날, 아빠는 오토바이 ‘쇼바’를 잔뜩 올린 채 도로 위를 달리며 울고 있었다. 아빠는 오토바이 속도가 최절 정에 다다랐을 때, 앞바퀴를 들며 “얘들아 너흰 절대 보증 서지 마!”라고 오열했고, 비닐하우스 옆에서 머리를 조아리며 속도위 반 딱지를 뗐다고 했다. 벌금은 고스란히 만두 가게서 일하는 엄마 앞으로 전가됐다.\n\n언니의 표정은 뜨악했다. 외삼촌이 담배를 피우는 사이, 나는 사정을 설명하느라 애를 먹었다. 엄
