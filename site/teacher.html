<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>/* 저장된 화면 모드를 먼저 적용해 깜빡임을 막는다 (기본 다크) */try{if(localStorage.getItem('simpul.theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
  <meta name="robots" content="noindex">
  <script>/* 자료 채우기는 관리자 맥북(로컬 서버)에서만. 배포된 사이트에서는 관리자 페이지로 보냄 */
    if (!/^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname)) location.replace('./admin.html');</script>
  <title>출제실 (선생님용) · 심풀스터디</title>
  <meta name="theme-color" content="#09090b">
  <link rel="stylesheet" href="./styles/site.css">
  <script src="./scripts/catalog.js" defer></script>
  <script src="./scripts/common.js" defer></script>
  <script src="./scripts/teacher.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-logo" href="./index.html"><img src="./assets/simpul-logo-white.png" alt="심풀스터디 홈" width="695" height="257"></a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./index.html#subjects">과목</a>
        <a href="./index.html#search">자료 찾기</a>
      </nav>
    </div>
  </header>

  <main class="wrap practice-wrap">
    <div class="page-head">
      <nav class="crumbs" aria-label="현재 위치"><a href="./index.html">홈</a> › 출제실</nav>
      <h1>AI 문제 초안 만들기</h1>
      <p>과목과 단원을 고르면 AI가 문제 5개와 정답·해설 초안을 만들어요. 학생에게 내기 전에 정답을 꼭 직접 확인하세요.</p>
    </div>

    <p class="notice" id="server-notice" role="status">출제 서버 연결을 확인하고 있어요.</p>

    <form class="section" id="bank-form" novalidate>
      <div class="form-grid">
        <label class="field">
          <span>과목</span>
          <select class="select" id="bank-subject" name="subject" required></select>
        </label>
        <label class="field">
          <span>단원·자료</span>
          <select class="select" id="bank-unit" name="unit"></select>
        </label>
        <label class="field">
          <span>난이도</span>
          <select class="select" id="bank-difficulty" name="difficulty">
            <option value="easy">쉬움</option>
            <option value="medium" selected>보통</option>
            <option value="hard">어려움</option>
          </select>
        </label>
        <label class="field span-all">
          <span>요청 사항 (선택)</span>
          <textarea class="textarea" id="bank-instructions" name="instructions" maxlength="2000" placeholder="예: 첨부한 문제의 유형을 참고해 숫자와 상황을 바꾼 서술형 문제를 만들어 주세요."></textarea>
        </label>
        <div class="field span-all">
          <span id="files-label">참고 파일 (선택 · PDF, JPG, PNG, WEBP · 최대 5개, 합계 14MB)</span>
          <input class="input" id="bank-files" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" multiple aria-labelledby="files-label">
          <ul class="file-list" id="bank-file-list"></ul>
          <p class="status-line" id="bank-files-status">첨부한 파일은 문제를 만들 때 Google AI로 전송돼요.</p>
        </div>
      </div>
      <div class="toolbar" style="margin-top: 16px">
        <button class="btn btn-primary" id="generate-bank" type="submit">문제 5개 만들기</button>
      </div>
      <p class="status-line" id="bank-status" role="status"></p>
    </form>

    <section class="section" aria-labelledby="bank-result-title">
      <h2 class="section-title" id="bank-result-title">만든 문제 <small id="bank-count">아직 없음</small></h2>
      <div class="question-list" id="bank-questions"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>출제실은 맥북에서 ‘SIMPUL 실행’으로 연 로컬 서버에서만 작동해요. 만든 문제는 새로고침하면 사라져요.</span>
      <a href="./index.html">학생용 홈으로</a>
    </div>
  </footer>
</body>
</html>
