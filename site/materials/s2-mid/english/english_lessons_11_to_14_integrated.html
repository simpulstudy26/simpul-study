<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 부교재 학습 | 2026-2학기 중간고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb; --primary-light:#eff6ff;
  --green:#16a34a;   --green-light:#f0fdf4;
  --purple:#7c3aed;  --purple-light:#f5f3ff;
  --orange:#ea580c;  --orange-light:#fff7ed;
  --teal:#0d9488;    --teal-light:#f0fdfa;
  --rose:#e11d48;    --rose-light:#fff1f2;
  --ink:#d6263b;
  --bg:#f8fafc; --surface:#fff; --border:#e2e8f0;
  --text:#0f172a; --text-sec:#475569;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --en:'Source Serif 4',Georgia,'Times New Roman',serif;
  --pen:'Nanum Pen Script','Noto Sans KR',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;font-size:14.5px;line-height:1.8;color:var(--text);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* ── Header ── */
.page-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.header-inner{max-width:980px;margin:0 auto;padding:12px 20px 10px}
.header-inner.has-tabs{padding-bottom:0}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:12px;color:var(--text-sec)}
.crumbs button{border:none;background:none;color:var(--primary);font-size:12px;font-weight:500;padding:0 2px}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{color:#cbd5e1;padding:0 3px}
.crumbs .here{font-weight:700;color:var(--text)}
.page-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.badge-unit{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--primary-light);color:var(--primary)}
.badge-unit.rose{background:var(--rose-light);color:var(--rose)}
.tab-bar{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.tab-bar::-webkit-scrollbar{display:none}
.tab-group-label{font-size:10.5px;color:var(--text-sec);opacity:.6;padding:0 4px 0 10px;white-space:nowrap;user-select:none}
.tab-group-label:first-child{padding-left:0}
.tab-btn{display:flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:none;border-bottom:3px solid transparent;padding:9px 10px 8px;font-size:13.5px;color:var(--text-sec);font-weight:500}
.tab-btn:hover{color:var(--text)}
.tab-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10.5px;font-weight:700;background:#e2e8f0;color:var(--text-sec)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.tab-btn.active .tab-num{background:var(--primary);color:#fff}

/* ── Layout ── */
.content-wrap{max-width:980px;margin:0 auto;padding:28px 20px 100px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.unit-banner{display:inline-block;font-size:12px;font-weight:500;padding:3px 12px;border-radius:999px;background:#fff;border:1px solid var(--border);color:var(--text-sec);margin-bottom:14px}
.section-title{font-size:17.5px;font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--primary);margin:30px 0 14px;scroll-margin-top:150px}
.tab-panel>.section-title:first-of-type{margin-top:4px}
.subsection-title{font-size:14.5px;font-weight:700;border-left:3px solid var(--primary);padding-left:9px;margin:20px 0 10px}
.sub2-title{display:inline-block;font-size:13px;font-weight:700;background:#f1f5f9;padding:2px 10px;border-radius:6px;margin:12px 0 6px}
p.lead{color:var(--text-sec);font-size:13.5px;margin-bottom:12px}

/* ── Home / Lesson ── */
.home-head h1{font-size:24px;font-weight:900;letter-spacing:-.5px}
.home-head p{color:var(--text-sec);font-size:13.5px;margin-top:2px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px}
.lesson-card{text-align:left;background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.lesson-card:hover{border-color:var(--primary)}
.lesson-no{font-size:34px;font-weight:900;line-height:1;color:var(--text)}
.lesson-no small{font-size:16px;font-weight:700;margin-left:2px;color:var(--text-sec)}
.lesson-meta{font-size:12.5px;color:var(--text-sec)}
.type-section{margin-top:22px}
.type-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--rose);margin-bottom:12px}
.type-head .cnt{font-size:12px;font-weight:500;color:var(--text-sec)}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.p-card{text-align:left;background:#fff;border:1px solid var(--border);border-left:4px solid var(--rose);border-radius:10px;padding:12px 14px}
.p-card:hover{border-color:var(--rose);background:var(--rose-light)}
.p-card .pid{font-size:20px;font-weight:900}
.p-card .pv{font-family:var(--en);font-size:13.5px;color:#334155;margin-top:4px;line-height:1.55}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:24px;text-align:center;color:var(--text-sec)}

/* ── Box library ── */
.def-box,.green-box,.purple-box,.teal-box,.orange-box,.rose-box{border-left:4px solid var(--primary);background:var(--primary-light);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;font-size:13.5px}
.green-box{border-color:var(--green);background:var(--green-light)}
.purple-box{border-color:var(--purple);background:var(--purple-light)}
.teal-box{border-color:var(--teal);background:var(--teal-light)}
.orange-box{border-color:var(--orange);background:var(--orange-light)}
.rose-box{border-color:var(--rose);background:var(--rose-light)}
.note,.tip,.warning{border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px}
.note{background:#fefce8;border:1px solid #fde047}
.tip{background:var(--green-light);border:1px solid #bbf7d0}
.warning{background:var(--rose-light);border:1px solid #fecdd3}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin:1px 2px;background:#f1f5f9;color:#334155;white-space:nowrap}
.badge-blue{background:var(--primary-light);color:var(--primary)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.badge-teal{background:var(--teal-light);color:var(--teal)}
.badge-rose{background:var(--rose-light);color:var(--rose)}
button.badge{border:none}
button.badge:hover{filter:brightness(.95);text-decoration:underline}
.en{font-family:var(--en);font-size:1.06em}

.factor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.factor-grid.three{grid-template-columns:repeat(3,1fr)}
.factor-card{background:#fff;border:1px solid var(--border);border-top:4px solid var(--primary);border-radius:8px;padding:12px 14px;font-size:13px}
.factor-card h4{font-size:14px;margin-bottom:4px}
.factor-card.green{border-top-color:var(--green)}.factor-card.purple{border-top-color:var(--purple)}
.factor-card.orange{border-top-color:var(--orange)}.factor-card.teal{border-top-color:var(--teal)}
.factor-card.rose{border-top-color:var(--rose)}.factor-card.gray{border-top-color:#94a3b8}

.table-wrap{overflow-x:auto;margin:10px 0}
.cmp-table,.ex-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.cmp-table th,.cmp-table td,.ex-table th,.ex-table td{border:1px solid var(--border);padding:8px 10px;vertical-align:top;text-align:left}
.cmp-table thead th{background:var(--primary);color:#fff}
.cmp-table.orange-th thead th{background:var(--orange)}
.cmp-table.teal-th thead th{background:var(--teal)}
.cmp-table tbody td:first-child{font-weight:700;color:#1e3a8a;white-space:nowrap}
.ex-table thead th{background:#334155;color:#fff}

.stage-row{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:12px 0}
.stage-item{flex:1 1 180px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12.5px}
.stage-item b{display:block;font-size:13.5px;margin-bottom:2px}
.stage-item.hi{border:2px solid var(--rose);background:var(--rose-light)}
.flow-arrow{align-self:center;color:#94a3b8;font-weight:700}

.rule-card{background:#fff;border:2px solid var(--primary);border-radius:10px;padding:14px 16px;margin:14px 0;scroll-margin-top:150px}
.rule-card.green{border-color:var(--green)}.rule-card.purple{border-color:var(--purple)}
.rule-card.orange{border-color:var(--orange)}.rule-card.teal{border-color:var(--teal)}
.rule-card.rose{border-color:var(--rose)}
.rule-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rule-head h3{font-size:15px}
.rule-num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700}
.rule-card.green .rule-num{background:var(--green)}.rule-card.purple .rule-num{background:var(--purple)}
.rule-card.orange .rule-num{background:var(--orange)}.rule-card.teal .rule-num{background:var(--teal)}
.rule-card.rose .rule-num{background:var(--rose)}
.src-line{font-family:var(--en);font-size:15px;background:#f8fafc;border-radius:6px;padding:8px 12px;margin:8px 0;line-height:1.7}
.src-line mark{background:#fef08a;padding:0 2px;border-radius:2px}
.src-tag{font-family:'Noto Sans KR',sans-serif;font-size:11px;color:var(--text-sec);margin-right:6px}
.exam-line{font-size:13px;margin-top:6px}
.exam-line .en{background:var(--orange-light);padding:1px 6px;border-radius:4px}

.totop{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(37,99,235,.35);z-index:60}

/* ── Passage (필기 레이어) ── */
.layer-bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;align-items:center}
.layer-bar .lbl{font-size:12px;color:var(--text-sec);margin-right:2px}
.lay-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--text-sec);font-weight:500}
.lay-btn.on{background:var(--text);color:#fff;border-color:var(--text)}
.lay-btn.pen.on{background:var(--ink);border-color:var(--ink)}
.passage{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 26px 14px;box-shadow:var(--shadow)}
.sent{position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--border)}
.sent:last-of-type{border-bottom:none}
.sent-num{position:absolute;left:0;top:18px;width:28px;height:28px;border-radius:50%;border:none;background:var(--text);color:#fff;font-weight:700;font-size:13px}
.sent-num:hover{background:var(--primary)}
.sent-en{font-family:var(--en);font-size:18.5px;line-height:3.1;color:#111827;transition:filter .2s}
.sent-tr{display:none;font-size:13.5px;color:#334155;background:var(--primary-light);border-radius:8px;padding:8px 12px;margin:2px 0 6px;line-height:1.75}
.sent.open .sent-tr,.passage.show-tr .sent-tr{display:block}
.mnote{display:none;font-family:var(--pen);color:var(--ink);font-size:21px;line-height:1.3;margin:0 0 6px}
.passage.notes .mnote{display:block}
.footnote{font-size:12.5px;color:var(--text-sec);text-align:right;margin-top:6px}
.an,.st,.ci,.br,.ul{position:relative}
.passage.notes .an::after{content:attr(data-n);position:absolute;left:50%;top:calc(100% - 4px);transform:translateX(-50%);font-family:var(--pen);font-size:19px;line-height:1;color:var(--ink);white-space:nowrap;pointer-events:none}
.passage.notes .st::before{content:"★";position:absolute;right:-7px;top:-.85em;font-size:12px;line-height:1;color:var(--ink)}
.passage.notes .ci{box-shadow:0 0 0 1.5px var(--ink);border-radius:40%;padding:0 2px}
.passage.notes .ul{text-decoration:underline;text-decoration-color:var(--ink);text-decoration-thickness:1.5px;text-underline-offset:4px}
.passage.notes .br::before{content:"(";color:var(--ink);font-weight:600}
.passage.notes .br::after{content:")";color:var(--ink);font-weight:600}
.passage.notes .br.sq::before{content:"["}
.passage.notes .br.sq::after{content:"]"}
.sl{display:none}
.passage.chunks .sl{display:inline;color:var(--primary);font-weight:700;padding:0 4px;font-family:'Noto Sans KR',sans-serif}

/* ── 문장 해부 ── */
.s-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow);scroll-margin-top:150px}
.s-card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.s-card-head h3{font-size:15.5px}
.s-card-head .spacer{flex:1}
.mini-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text-sec)}
.mini-btn.on{background:var(--text);color:#fff;border-color:var(--text)}
.sv-row{display:flex;flex-wrap:wrap;gap:8px 6px;margin:6px 0 12px}
.sv-seg{display:flex;flex-direction:column;align-items:center;max-width:100%}
.sv-seg .t{font-family:var(--en);font-size:14.5px;padding:2px 8px;border-radius:6px;background:#f1f5f9;border-bottom:3px solid #94a3b8;text-align:center}
.sv-seg .r{font-size:11px;font-weight:700;margin-top:2px;color:#64748b}
.sv-seg.S .t{border-color:var(--primary);background:var(--primary-light)}.sv-seg.S .r{color:var(--primary)}
.sv-seg.V .t{border-color:var(--rose);background:var(--rose-light)}.sv-seg.V .r{color:var(--rose)}
.sv-seg.O .t{border-color:var(--green);background:var(--green-light)}.sv-seg.O .r{color:var(--green)}
.sv-seg.C .t{border-color:var(--purple);background:var(--purple-light)}.sv-seg.C .r{color:var(--purple)}
.sv-seg.M .t{border-color:var(--teal);background:var(--teal-light)}.sv-seg.M .r{color:var(--teal)}
.sv-seg.X .t{border-color:var(--orange);background:var(--orange-light)}.sv-seg.X .r{color:var(--orange)}
.chunk-table{width:100%;border-collapse:collapse;font-size:13px}
.chunk-table th{background:#334155;color:#fff;padding:6px 10px;text-align:left;font-weight:600}
.chunk-table td{border-bottom:1px solid var(--border);padding:7px 10px;vertical-align:top}
.chunk-table td.no{color:#94a3b8;width:28px;font-weight:700}
.chunk-table td.ck{font-family:var(--en);font-size:14.5px;width:46%}
.chunk-table td.ko{color:#334155}
.s-card.hide-ko td.ko{color:transparent;background:repeating-linear-gradient(-45deg,#f1f5f9,#f1f5f9 6px,#e2e8f0 6px,#e2e8f0 12px);cursor:pointer;border-radius:4px}
.s-card.hide-ko td.ko.peek{color:#334155;background:#fef9c3}
.s-card.hide-ko td.ko .badge{visibility:hidden}
.s-card.hide-ko td.ko.peek .badge{visibility:visible}

/* ── 훈련 ── */
.drill{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
.drill-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.drill-top .score{font-size:12.5px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:2px 10px;border-radius:999px}
.drill-top .spacer{flex:1}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ch-item{padding:10px 0;border-bottom:1px dashed var(--border)}
.ch-item:last-child{border-bottom:none}
.ch-s{font-family:var(--en);font-size:15px;line-height:1.9}
.ch-s .n{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;color:#94a3b8;margin-right:6px}
.ch-opt{font-family:var(--en);font-size:14.5px;border:1.5px solid #cbd5e1;background:#fff;border-radius:6px;padding:0 9px;margin:0 2px;line-height:1.6}
.ch-opt:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.ch-opt.correct{background:var(--green-light);border-color:var(--green);color:var(--green);font-weight:600}
.ch-opt.wrong{background:var(--rose-light);border-color:var(--rose);color:var(--rose);text-decoration:line-through}
.ch-opt:disabled{cursor:default}
.ch-exp{font-size:12.5px;margin-top:4px;padding:5px 10px;border-radius:6px}
.ch-exp.ok{background:var(--green-light);color:#14532d}
.ch-exp.no{background:var(--rose-light);color:#881337}
.act-btn{border:none;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;background:var(--primary);color:#fff}
.act-btn.ghost{background:#fff;color:var(--text-sec);border:1px solid var(--border)}
.act-btn.ghost.on{background:var(--text);color:#fff;border-color:var(--text)}

/* 훈련 3: 문장 속 어휘 해석 */
.vt-item{padding:12px 0 14px;border-bottom:1px dashed var(--border)}
.vt-item:last-child{border-bottom:none}
.vt-en{font-family:var(--en);font-size:16px;line-height:2;color:#111827}
.vt-ko{font-size:14px;line-height:2.3;color:#334155;background:#f8fafc;border-radius:8px;padding:6px 12px;margin-top:4px}
.vt-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--text-sec);background:#e2e8f0;border-radius:4px;padding:0 6px;margin-right:8px;line-height:1.7}
.voc-sn{font-family:'Noto Sans KR',sans-serif;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;font-size:11px;vertical-align:2px;margin-right:6px}
.voc-w{text-decoration:underline;text-decoration-color:var(--primary);text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;font-weight:600;color:#1e3a8a}
.voc-w.ok{text-decoration-color:var(--green);color:var(--green)}
.voc-w.no{text-decoration-color:var(--rose);color:var(--rose)}
.voc-w sup,.vt-blank sup{font-family:'Noto Sans KR',sans-serif;font-size:10px;color:var(--primary);font-weight:700;margin-right:1px}
.vt-blank{display:inline-flex;align-items:baseline;gap:1px;margin:0 2px;flex-wrap:wrap}
.vt-blank input{font-family:inherit;font-size:13.5px;border:none;border-bottom:2px solid #94a3b8;background:#fff;padding:0 5px;border-radius:4px 4px 0 0;max-width:100%}
.vt-blank input.ok{border-color:var(--green);background:var(--green-light);color:#14532d}
.vt-blank input.no{border-color:var(--rose);background:var(--rose-light);color:#881337}
.voc-key{font-family:var(--pen);font-size:18px;color:var(--ink);margin-left:3px;line-height:1}

.ord-given{background:#f8fafc;border-radius:8px;padding:10px 12px;font-family:var(--en);font-size:14.5px;line-height:1.75;margin-bottom:8px}
.ord-box{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:6px 0;font-family:var(--en);font-size:14.5px;line-height:1.75;background:#fff;display:block;width:100%;text-align:left}
.ord-box:hover{border-color:var(--primary)}
.ord-box b{font-family:'Noto Sans KR',sans-serif;color:var(--primary);margin-right:6px}
.ord-box.used{opacity:.45}
.ord-seq{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;font-weight:700;min-height:34px}
.ord-slot{min-width:48px;height:32px;border:2px dashed #cbd5e1;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.ord-slot.filled{border-style:solid;border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.scr-item{padding:12px 0;border-bottom:1px dashed var(--border)}
.scr-item:last-child{border-bottom:none}
.scr-ko{font-size:13.5px;font-weight:500;margin-bottom:6px}
.scr-ans{min-height:40px;border:2px dashed #cbd5e1;border-radius:8px;padding:5px;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.scr-ans.ok{border-color:var(--green);background:var(--green-light)}
.scr-ans.no{border-color:var(--rose);background:var(--rose-light)}
.scr-pool{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.tok{font-family:var(--en);font-size:14.5px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:2px 9px}
.tok:hover{border-color:var(--primary)}
.scr-ans .tok{background:var(--primary-light);border-color:#bfdbfe}
.scr-key{font-family:var(--en);font-size:13.5px;color:var(--rose);margin-top:4px}

/* ── 한눈에 보기 ── */
.map-root{background:#fff;border:1px solid var(--border);border-radius:12px;margin:12px 0;overflow:hidden}
.map-root-head{display:flex;align-items:center;gap:8px;width:100%;border:none;text-align:left;padding:10px 14px;font-size:14.5px;font-weight:700;color:#fff;background:var(--primary)}
.map-root.green .map-root-head{background:var(--green)}.map-root.purple .map-root-head{background:var(--purple)}
.map-root.orange .map-root-head{background:var(--orange)}.map-root.teal .map-root-head{background:var(--teal)}
.map-root-head .tabno{font-size:11px;background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px}
.map-children{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.map-node{border:1px solid var(--border);background:#f8fafc;border-radius:8px;padding:6px 12px;font-size:13px;text-align:left}
.map-node:hover{border-color:var(--primary);background:var(--primary-light)}
.map-group{display:flex;flex-direction:column;gap:4px}
.map-group>.map-node{border:none;background:none;padding:2px 4px;font-weight:700}
.map-subrow{display:flex;flex-wrap:wrap;gap:5px;border-left:2px solid #cbd5e1;margin-left:8px;padding-left:10px}
.map-subchip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:1px 10px;font-size:12px}
.map-subchip:hover{border-color:var(--primary);color:var(--primary)}

@media (max-width:680px){
  .factor-grid,.factor-grid.three{grid-template-columns:1fr}
  .passage{padding:14px 14px 10px}

  .sent-en{font-size:16.5px;line-height:3.2}
  .chunk-table td.ck{width:auto}
  .content-wrap{padding:20px 14px 100px}
}

         <div class="table-wrap"><table class="ex-table">
          <thead><tr><th>본문 근거 표현</th><th>의미</th><th>빈칸과의 연결</th></tr></thead>
          <tbody>
           <tr><td class="en">safer mutual interdependence</td><td>더 안전한 서로 간의 상호 의존</td><td>서로를 위해 일함 = 서로에게 의존</td></tr>

           <tr><td class="en">relying on the services provided to you by other people</td><td>다른 사람들이 제공하는 서비스에 의지</td><td>남이 나를 위해 일함</td></tr>
           <tr><td class="en">work for a fraction of a second … to turn on an electric lamp for an hour</td><td>아주 짧게 일하고 한 시간의 빛을 누림</td><td>분업 덕분에 적은 노동으로 큰 혜택</td></tr>
          </tbody></table></div>
         <button class="act-btn" onclick="this.nextElementSibling.style.display='block';this.remove()">빈칸 정답 확인</button>
         <div class="green-box" style="display:none">정답: <b class="en">enabling people to work for each other</b> (사람들이 서로를 위해 일할 수 있도록 함)</div>
        </div>`},
      {id:'a-contrast', icon:'⚖️', title:'과거 vs 현재 대비', html:`
        <div class="table-wrap"><table class="cmp-table orange-th">
         <thead><tr><th>구분</th><th>과거 (자급자족)</th><th>현재 (상호 의존)</th></tr></thead>

          <tr><td>빛을 얻는 법</td><td>참기름이나 양의 지방을 <b>직접</b> 모으고 정제해 단순한 등에 태움</td><td>아주 짧은 시간 일한 대가로 전등을 한 시간 켬</td></tr>

         </tbody></table></div>`},
      {id:'a-logicword', icon:'🌟', title:'★ 표시 어휘의 문맥 논리', html:`
        <p class="lead">필기에서 ★로 표시된 단어는 문맥상 낱말 쓰임 문제로 바뀌기 쉬운 자리입니다. 왜 그 단어여야 하는지 논리로 기억하세요.</p>

         <div class="factor-card"><h4 class="en">specialized</h4><b>생산</b>은 한 가지 일(직업)에 집중 → 전문화</div>
         <div class="factor-card green"><h4 class="en">diversified</h4><b>소비</b>는 여러 사람이 제공하는 서비스에 의지 → 다양화</div>
         <div class="factor-card rose"><h4 class="en">unstable</h4>자급자족은 벗어나야 할(<span class="en">move away from</span>) 상태 → 불안정한 ↔ <span class="en">safer</span> 상호 의존</div>
        </div>
        <div class="warning">생산 ↔ 소비의 짝(<span class="en">specialized ↔ diversified</span>)을 뒤바꾼 진술, 자급자족을 '안전하다'고 한 진술은 오답 함정!</div>`}
    ]
  },

    {title:'타인의 경험까지 활용',en:`This way,<b class="sl">/</b> you get the advantage <span class="br">of everybody else's experience</span>,<b class="sl">/</b> and not just your own idiosyncratic path <span class="br">through the space of mistakes</span>.`,tr:'이런 식으로 당신은 단지 실수라는 공간을 거친 당신 자신의 특유한 길에서 얻은 이익뿐만 아니라, 다른 모든 사람들의 경험이라는 이익을 얻는다.',sv:[['M','This way','M'],['S','you','S'],['V','get','V'],['O',"the advantage of everybody else's experience",'O'],['X','and not just …','병렬']],chunks:[['This way, you get the advantage','이런 식으로 당신은 이익을 얻는다'],["of everybody else's experience,",'다른 모든 사람의 경험에서'],['and not just your own idiosyncratic path','단지 자기만의 특유한 길뿐 아니라'],['through the space of mistakes.','실수의 공간을 거친']]},
    {title:'인간이 더 영리한 이유',en:`This, by the way, is another reason <span class="br sq">why we humans are so much smarter than every other species</span>.`,tr:'한편, 이는 왜 우리 인간이 다른 모든 종보다 훨씬 더 영리한지에 대한 또 다른 이유이다.',sv:[['S','This','S'],['M','by the way','M'],['V','is','V'],['C','another reason why …','C']],chunks:[['This, by the way,','한편 이는'],['is another reason','또 다른 이유이다'],['why we humans are so much smarter','왜 우리 인간이 훨씬 더 영리한지'],['than every other species.','다른 모든 종보다']]},
    {title:'공유가 만드는 지능',en:`It is <span class="ci">not</span> <span class="br sq">that our brains are bigger or more powerful, or even that we have the ability to reflect on our own past errors</span>, <span class="ul">but</span> <span class="br sq">that we <span class="ci st">share the benefits</span> <span class="br sq">that our individual brains have learned from their individual histories of trial and error</span></span>.`,tr:'그것은 우리의 뇌가 더 크거나 더 강력해서, 혹은 심지어 우리가 자신의 과거 실수를 반추하는 능력을 가져서가 아니라, 우리 개개인의 뇌가 그들 개개인의 시행착오의 역사로부터 얻어낸 이익들을 나눠서이다.',sv:[['S','It','가S'],['V','is','V'],['C','not that A, but that B','C']],chunks:[['It is not that our brains are bigger or more powerful,','우리 뇌가 더 크거나 강력해서가 아니고'],['or even that we have the ability','심지어 능력이 있어서도 아니라'],['to reflect on our own past errors,','자기 과거 실수를 반추하는'],['but that we share the benefits','우리가 이익을 공유하기 때문이다',[['not A but B','g49-notbut']]],['that our individual brains have learned','개인의 뇌가 얻어낸'],['from their individual histories of trial and error.','각자의 시행착오 역사로부터']]}

  flow:{tabLabel:'흐름·빈칸 근거',sections:[{id:'a49-flow',icon:'🧭',title:'글의 흐름',html:`<div class="stage-row"><div class="stage-item"><b>① 과학의 특징</b>실수를 공개함</div><span class="flow-arrow">→</span><div class="stage-item"><b>② 공개의 효과</b>모두가 타인의 실수에서 배움</div><span class="flow-arrow">→</span><div class="stage-item"><b>③ 인간의 강점</b>개인의 시행착오를 집단의 자산으로 만듦</div><span class="flow-arrow">→</span><div class="stage-item hi"><b>④ 핵심</b>얻은 이익을 서로 공유함</div></div>`},{id:'a49-blank',icon:'🎯',title:'빈칸 추론 근거',html:`<div class="rule-card rose"><div class="src-line">… but that we <span style="display:inline-block;min-width:220px;border-bottom:2px solid var(--rose)">&nbsp;</span> that our individual brains have learned …</div><p>과학자는 실수를 공개하여 모두가 서로의 경험에서 배웁니다. 따라서 인간의 강점은 개인이 얻은 이익을 공유하는 데 있습니다.</p><div class="green-box">정답: <b class="en">share the benefits</b></div></div>`},{id:'a49-title',icon:'🏷️',title:'제목·주제·요약',html:`<div class="purple-box"><b>Why We Learn Best by Sharing Our Mistakes</b><br>인간은 각자의 시행착오에서 얻은 지식과 이익을 공개하고 공유하기 때문에 다른 종보다 영리해질 수 있다.</div>`}]},
  drills:{gram:[{pre:'One big difference … ',o:['is','are'],a:0,post:' that …',e:'주어의 핵 difference는 단수'},{pre:'so that everybody ',o:['can learn','can learns'],a:0,post:' from them',e:'조동사 can 뒤 동사원형'},{pre:"everybody else's ",o:['experience','experiences'],a:0,post:'',e:'문맥상 모든 사람의 집합적 경험'},{pre:'another reason ',o:['why','which'],a:0,post:' we humans are smarter',e:'reason을 설명하는 관계부사 why'},{pre:'It is not that A ',o:['but','and'],a:0,post:' that B.',e:'not A but B 구조'}],word:[{pre:'magicians ',o:['hide','show'],a:0,post:' their mistakes from the audience.',e:'마술사는 실수를 숨김'},{pre:'in science you make your mistakes ',o:['in public','in secret'],a:0,post:'.',e:'과학은 공개적으로 실수함'},{pre:'You ',o:['show them off','cover them up'],a:0,post:' so everybody can learn.',e:'실수를 드러내 보임'},{pre:'we humans are much ',o:['smarter','weaker'],a:0,post:' than other species.',e:'공유를 통해 더 영리해짐'},{pre:'we ',o:['share','conceal'],a:0,post:' the benefits of trial and error.',e:'시행착오의 이익을 공유'}],vocab:[{s:0,en:'hide',ko:'숨기는',k:['숨기']},{s:0,en:'in public',ko:'공공연히',k:['공공연','공개']},{s:1,en:'show them off',ko:'드러내 보여준다',k:['드러내','보여']},{s:2,en:'advantage',ko:'이익을',k:['이익','장점']},{s:2,en:'experience',ko:'경험이라는',k:['경험']},{s:2,en:'idiosyncratic',ko:'특유한',k:['특유']},{s:3,en:'species',ko:'종보다',k:['종']},{s:4,en:'reflect on',ko:'반추하는',k:['반추','되돌아']},{s:4,en:'share',ko:'나눠서이다',k:['나누','공유']},{s:4,en:'trial and error',ko:'시행착오의',k:['시행착오']}],order:{given:0,boxes:[{k:'A',s:4},{k:'B',s:1},{k:'C',s:3}],answer:['B','C','A'],exp:'(B) 실수를 공개하는 이유 → (C) 이것이 인간이 영리한 이유라는 연결 → (A) 뇌의 크기가 아니라 공유가 핵심이라는 결론.'},scr:[{ko:'과학에서는 공개적으로 실수한다.',s:'In science you make your mistakes in public.'},{ko:'당신은 모두가 그것들로부터 배울 수 있도록 실수를 드러내 보여준다.',s:'You show them off so that everybody can learn from them.'},{ko:'이는 인간이 다른 종보다 더 영리한 또 다른 이유이다.',s:'This is another reason why we humans are much smarter than every other species.'},{ko:'우리는 개개인의 뇌가 시행착오에서 얻은 이익을 공유한다.',s:'We share the benefits that our individual brains have learned fro {
  id:'11-50', lesson:11, type:'빈칸 추론',
  sents:[
    {title:'지적 능력으로서의 능력',en:`<span class="br">For many people</span>, ability refers to intellectual competence,<b class="sl">/</b> so they want everything <span class="br sq">they do</span> to reflect <span class="br sq">how smart they are</span> — writing a brilliant legal brief, getting the highest grade on a test, writing elegant computer code, saying something exceptionally wise or witty in a conversation.`,tr:'많은 사람들에게 ‘능력’은 지적 능력을 의미하기 때문에 그들은 자신이 하는 모든 것이 자신이 얼마나 똑똑한지를 보여주기를 원한다. 예컨대 훌륭한 법률 보고서를 작성하는 것, 시험에서 최고의 성적을 받는 것, 정연한 컴퓨터 코드를 작성하는 것, 대화에서 비범하게 현명하거나 재치 있는 말을 하는 것이다.',sv:[['M','For many people','M'],['S','ability','S'],['V','refers to','V'],['O','intellectual competence','O'],['X','so','결과'],['S','they','S'],['V','want','V'],['O','everything they do','O'],['C','to reflect how smart they are','O.C.']],chunks:[['For many people, ability refers to intellectual competence,','많은 사람에게 능력은 지적 능력을 의미한다'],['so they want everything they do','그래서 그들은 자신이 하는 모든 것이'],['to reflect how smart they are','얼마나 똑똑한지를 보여주길 원한다',[['want O to V','g50-5v']]],['writing a brilliant legal brief,','훌륭한 법률 보고서 작성'],['getting the highest grade on a test,','시험 최고 성적 취득'],['writing elegant computer code,','정연한 컴퓨터 코드 작성'],['saying something exceptionally wise or witty.','비범하게 현명하거나 재치 있는 말 하기']]},
    {title:'기술과 재능으로서의 능력',en:`You could also define ability <span class="br">in terms of a particular skill or talent</span>,<b class="sl">/</b> such as <span class="br sq">how well one plays the piano, learns a language, or serves a tennis ball</span>.`,tr:'여러분은 또한 피아노를 얼마나 잘 치는지, 언어를 얼마나 잘 배우는지, 테니스공을 얼마나 잘 서브하는지와 같은 특정 기술이나 재능의 관점에서 능력을 정의할 수도 있다.',sv:[['S','You','S'],['V','could define','V'],['O','ability','O'],['M','in terms of a particular skill or talent','M'],['X','such as how well …','예시']],chunks:[['You could also define ability','능력을 정의할 수도 있다'],['in terms of a particular skill or talent,','특정 기술이나 재능의 관점에서'],['such as how well one plays the piano,','피아노를 얼마나 잘 치는지처럼'],['learns a language, or serves a tennis ball.','언어를 배우거나 테니스공을 서브하는지']]},
    {title:'매력과 유행으로서의 능력',en:`Some people focus on their ability <span class="br sq">to be attractive, entertaining, up on the latest trends, or to have the newest gadgets</span>.`,tr:'어떤 사람들은 매력적이고, 재미있고, 최신 유행에 맞추거나, 최신 기기를 가질 수 있는 그들의 능력에 초점을 맞춘다.',sv:[['S','Some people','S'],['V','focus on','V'],['O','their ability to be … or to have …','O']],chunks:[['Some people focus on their ability','어떤 사람들은 자신의 능력에 초점을 맞춘다'],['to be attractive, entertaining,','매력적이고 재미있는'],['up on the latest trends,','최신 유행에 밝은'],['or to have the newest gadgets.','또는 최신 기기를 갖는']]},
    {title:'자기 가치의 유일한 결정 요인',en:`<span class="br">However ability may be defined</span>,<b class="sl">/</b> a problem occurs<b class="sl">/</b> <span class="br sq">when <span class="ul st">it is the sole determinant of one's self-worth</span></span>.`,tr:'능력이 어떻게 정의되든지, 그것이 자신의 가치를 결정하는 유일한 결정 요인일 때 문제가 발생한다.',sv:[['M','However ability may be defined','양보'],['S','a problem','S'],['V','occurs','V'],['M',"when it is the sole determinant of one's self-worth",'때']],chunks:[['However ability may be defined,','능력이 어떻게 정의되든지',[['복합관계부사 however','g50-however']]],['a problem occurs','문제가 발생한다'],['when it is the sole determinant','그것이 유일한 결정 요인일 때'],["of one's self-worth.",'자기 가치의']]},
    {title:'수행만이 사람이 됨',en:`The performance becomes the <span class="ci">only</span> measure of the person;<b class="sl">/</b> nothing else is <span class="ul">taken into account</span>.`,tr:'수행이 그 사람의 ‘유일한’ 척도가 되며, 다른 것은 고려되지 않는다.',sv:[['S','The performance','S'],['V','becomes','V'],['C','the only measure of the person','C'],['S','nothing else','S'],['V','is taken into account','수동태']],chunks:[['The performance becomes','수행이 된다'],['the only measure of the person;','그 사람의 유일한 척도가'],['nothing else is taken into account.','다른 것은 고려되지 않는다',[['수동태','g50-passive']]]]},
    {title:'수행과 사람의 동일시',en:`An outstanding performance means an outstanding person;<b class="sl">/</b> an average performance means an average person.`,tr:'뛰어난 수행은 뛰어난 사람을 의미하고, 평범한 수행은 평범한 사람을 의미한다.',sv:[['S','An outstanding performance','S'],['V','means','V'],['O','an outstanding person','O'],['S','an average performance','S'],['V','means','V'],['O','an average person','O']],chunks:[['An outstanding performance means','뛰어난 수행은 의미한다'],['an outstanding person;','뛰어난 사람을'],['an average performance means','평범한 수행은 의미한다'],['an average person.','평범한 사람을']]},

  flow:{tabLabel:'흐름·빈칸 근거',sections:[{id:'a50-flow',icon:'🧭',title:'글의 흐름',html:`<div class="stage-row"><div class="stage-item"><b>① 능력의 여러 정의</b>지적 능력·기술·재능·매력·유행</div><span class="flow-arrow">→</span><div class="stage-item hi"><b>② 문제 조건</b>능력이 자기 가치의 유일한 결정 기준이 됨</div><span class="flow-arrow">→</span><div class="stage-item"><b>③ 결과</b>수행 외의 모든 요소가 배제됨</div><span class="flow-arrow">→</span><div class="stage-item"><b>④ 극단적 동일시</b>뛰어난 수행=뛰어난 사람</div></div>`},{id:'a50-blank',icon:'🎯',title:'빈칸 추론 근거',html:`<div class="rule-card rose"><div class="src-line">a problem occurs when <span style="display:inline-block;min-width:280px;border-bottom:2px solid var(--rose)">&nbsp;</span>.</div><p>뒤에서 수행이 사람을 평가하는 유일한 척도가 되고 다른 요소는 고려되지 않는다고 설명합니다.</p><div class="green-box">정답: <b class="en">it is the sole determinant of one's self-worth</b></div></div>`},{id:'a50-title',icon:'🏷️',title:'제목·주제·요약',html:`<div class="purple-box"><b>When Ability Becomes the Only Measure of Worth</b><br>능력을 자기 가치의 유일한 기준으로 삼으면 한 번의 수행을 사람 전체의 가치와 동일시하는 문제가 생긴다.</div>`}]},
  drills:{gram:[{pre:'they want everything they do ',o:['to reflect','reflecting'],a:0,post:' how smart they are.',e:'want O to V'},{pre:'how smart they ',o:['are','do'],a:0,post:'',e:'how+형용사 뒤 주어+be동사'},{pre:'such as how well one ',o:['plays','play'],a:0,post:' the piano',e:'주어 one은 단수'},{pre:'However ability may ',o:['be defined','define'],a:0,post:', a problem occurs.',e:'능력은 정의되는 대상 → 수동태'},{pre:'nothing else is ',o:['taken','taking'],a:0,post:' into account.',e:'수동태 is taken'}],word:[{pre:'ability refers to intellectual ',o:['competence','entertainment'],a:0,post:'.',e:'지적 능력'},{pre:'define ability in terms of a particular ',o:['skill','period'],a:0,post:' or talent',e:'특정 기술·재능 관점'},{pre:'a problem ',o:['occurs','disappears'],a:0,post:' when ability determines self-worth.',e:'문제가 발생함'},{pre:'the ',o:['sole','partial'],a:0,post:' determinant of self-worth',e:'유일한 결정 요인'},{pre:'nothing else is ',o:['taken into account','reflected'],a:0,post:'.',e:'다른 것은 고려되지 않음'}],vocab:[{s:0,en:'refers to',ko:'의미하기',k:['의미','나타내']},{s:0,en:'intellectual competence',ko:'지적 능력을',k:['지적능력','지적']},{s:0,en:'reflect',ko:'보여주기를',k:['보여','나타내']},{s:0,en:'brilliant',ko:'훌륭한',k:['훌륭','뛰어난']},{s:0,en:'exceptionally',ko:'비범하게',k:['비범','각별']},{s:1,en:'define',ko:'정의할',k:['정의']},{s:2,en:'entertaining',ko:'재미있고',k:['재미']},{s:2,en:'gadgets',ko:'기기를',k:['기기','도구']},{s:3,en:'sole determinant',ko:'유일한 결정 요인',k:['유일한결정','유일']},{s:4,en:'taken into account',ko:'고려되지 않는다',k:['고려']},{s:5,en:'outstanding',ko:'뛰어난',k:['뛰어난','현저']},{s:5,en:'average',ko:'평범한',k:['평범','보통']}],order:{given:0,boxes:[{k:'A',s:4},{k:'B',s:3},{k:'C',s:5}],answer:['B','A','C'],exp:'(B) 여러 정의와 무관하게 능력이 자기 가치의 유일한 기준일 때 문제 → (A) 다른 요소 배제 → (C) 수행과 사람을 동일시.'},scr:[{ko:'그들은 자신이 하는 모든 것이 자신이 얼마나 똑똑한지를 보여주기를 원한다.',s:'They want everything they do to reflect how smart they are.'},{ko:'능력이 어떻게 정의되든지 문제가 발생한다.',s:'However ability may be defined a problem occurs.'},{ko:'수행이 그 사람의 유일한 척도가 된다.',s:'The performance becomes the only measure of {
  id:'11-51', lesson:11, type:'빈칸 추론',
  sents:[
    {title:'엘리트 명성을 향한 수단',en:`<span class="br">While social media attention is potentially an instrument <span class="br sq">to achieve ends like elite celebrity</span></span>,<b class="sl">/</b> some content creators desire ordinary fame <span class="br">as a social end in itself</span>.`,tr:'소셜 미디어 관심은 잠재적으로 엘리트 명성과 같은 목적을 달성하기 위한 도구인 반면, 일부 콘텐츠 제작자들은 사회적 목적 그 자체로서 평범한 명성을 원한다.',sv:[['M','While social media attention is potentially an instrument …','대조'],['S','some content creators','S'],['V','desire','V'],['O','ordinary fame','O'],['C','as a social end in itself','C']],chunks:[['While social media attention is potentially an instrument','소셜 미디어 관심은 잠재적으로 도구인 반면'],['to achieve ends like elite celebrity,','엘리트 명성과 같은 목적을 달성하기 위한'],['some content creators desire ordinary fame','일부 콘텐츠 제작자는 평범한 명성을 원한다'],['as a social end in itself.','사회적 목적 그 자체로']]},
    {title:'평범한 유명인에 대한 비판',en:`<span class="br">Not unlike reality television stars</span>,<b class="sl">/</b> social media celebrities are often criticized <span class="br">for not having skills and talents <span class="br sq">associated with traditional, elite celebrity</span></span>,<b class="sl">/</b> such as acting or singing ability.`,tr:'리얼리티 텔레비전 스타들과 다르지 않게, 소셜 미디어 유명인들은 연기나 가창력과 같은 전통적인 엘리트 명성과 관련된 기술과 재능을 가지고 있지 않다는 이유로 종종 비판을 받는다.',sv:[['M','Not unlike reality television stars','비교'],['S','social media celebrities','S'],['V','are criticized','수동태'],['M','for not having skills and talents …','이유']],chunks:[['Not unlike reality television stars,','리얼리티 TV 스타와 다르지 않게'],['social media celebrities are often criticized','소셜 미디어 유명인은 종종 비판받는다'],['for not having skills and talents','기술과 재능이 없다는 이유로'],['associated with traditional, elite celebrity,','전통적인 엘리트 명성과 관련된'],['such as acting or singing ability.','연기나 가창력 같은']]},
    {title:'엘리트 영역의 실제 장벽',en:`This criticism highlights the fact <span class="br sq">that digital content creators face real barriers <span class="br">to crossing over to the sphere of elite celebrity</span></span>.`,tr:'이러한 비판은 디지털 콘텐츠 제작자들이 엘리트 명성의 영역으로 넘어가는 데 있어 실제적인 장벽에 직면하고 있다는 사실을 강조한다.',sv:[['S','This criticism','S'],['V','highlights','V'],['O','the fact that …','O']],chunks:[['This criticism highlights the fact','이 비판은 사실을 강조한다'],['that digital content creators face real barriers','디지털 콘텐츠 제작자가 실제 장벽에 직면한다는'],['to crossing over to the sphere of elite celebrity.','엘리트 명성의 영역으로 넘어가는 데']]},
    {title:'명성의 의미 재구성',en:`However,<b class="sl">/</b> the criticism also misses the point <span class="br sq">that the phenomenon of ordinary celebrity <span class="ul st">reconstructs the meaning of fame</span></span>.`,tr:'그러나 이 비판은 또한 평범한 명성의 현상이 명성의 의미를 재구성한다는 점을 놓친다.',sv:[['M','However','전환'],['S','the criticism','S'],['V','misses','V'],['O','the point that …','O']],chunks:[['However, the criticism also misses the point','그러나 그 비판은 또한 요점을 놓친다'],['that the phenomenon of ordinary celebrity','평범한 명성이라는 현상이'],['reconstructs the meaning of fame.','명성의 의미를 재구성한다는']]},
    {title:'엘리트 유명인의 성격',en:`The elite celebrity is symbolized <span class="br">by the metaphor of the star</span>,<b class="sl">/</b> characterized <span class="br">by mystery and hierarchical distance</span><b class="sl">/</b> and associated <span class="br">with naturalized qualities of talent and class</span>.`,tr:'엘리트 유명인은 스타라는 은유로 상징되고, 신비로움과 계층적 거리로 특징지어지며, 타고난 자질의 재능 및 계층과 연관되어 있다.',sv:[['S','The elite celebrity','S'],['V','is symbolized, characterized, and associated','병렬 수동태']],chunks:[['The elite celebrity is symbolized','엘리트 유명인은 상징된다'],['by the metaphor of the star,','스타라는 은유로'],['characterized by mystery and hierarchical distance','신비와 계층적 거리로 특징지어지고'],['and associated with naturalized qualities','타고난 자질과 연관된다'],['of talent and class.','재능과 계층의']]},
    {title:'평범한 유명인의 방식',en:`The ordinary celebrity attracts attention<b class="sl">/</b> through regular and frequent interactions <span class="br">with other ordinary people</span>.`,tr:'평범한 유명인은 다른 평범한 사람들과의 정기적이고 빈번한 상호작용을 통해 관심을 끈다.',sv:[['S','The ordinary celebrity','S'],['V','attracts','V'],['O','attention','O'],['M','through regular and frequent interactions …','수단']],chunks:[['The ordinary celebrity attracts attention','평범한 유명인은 관심을 끈다'],['through regular and frequent interactions','정기적이고 빈번한 상호작용을 통해'],['with other ordinary people.','다른 평범한 사람들과의']]},
    {title:'관심 점수로서의 명성',en:`Achieving ordinary fame <span class="br">as a social media celebrity</span> is like doing well at a game,<b class="sl">/</b> because <span class="br">in this sphere</span>, fame is nothing more nor less than relatively high scores <span class="br">on attention scales</span>,<b class="sl">/</b> the metrics of subscribers, followers, Likes, or clicks <span class="br sq">built into social media applications</span>.`,tr:'소셜 미디어 유명인으로서 평범한 명성을 얻는 것은 게임에서 잘하는 것과 같은데, 왜냐하면 이 영역에서 명성은 소셜 미디어 애플리케이션에 내장된 구독자, 팔로워, 좋아요 또는 클릭의 측정 기준인 관심 척도에서 상대적으로 높은 점수 그 이상도 그 이하도 아니기 때문이다.',sv:[['S','Achieving ordinary fame as a social media celebrity','동명사 S'],['V','is','V'],['C','like doing well at a game','C'],['M','because …','이유']],chunks:[['Achieving ordinary fame as a social media celebrity','소셜 미디어 유명인으로 평범한 명성을 얻는 것은'],['is like doing well at a game,','게임에서 잘하는 것과 같다'],['because in this sphere, fame is nothing more nor less than','왜냐하면 이 영역에서 명성은 그 이상도 이하도 아니기 때문이다'],['relatively high scores on attention scales,','관심 척도의 비교적 높은 점수'],['the metrics of subscribers, followers, Likes, or clicks','구독자·팔로워·좋아요·클릭의 측정 기준'],['built into social media applications.','소셜 미디어 앱에 내장된']]}
  ],
  footnote:'* sphere 영역 &nbsp; ** metric 측정 기준',
  grammar:[{group:'문장 1·2',items:[{id:'g51-while',title:'대조의 While',body:`<div class="src-line"><mark>While</mark> social media attention is …, some creators desire …</div><div class="def-box">엘리트 명성의 수단과 평범한 명성 자체의 목적을 대비합니다.</div>`},{id:'g51-unlike',color:'orange',title:'Not unlike = like',star:true,body:`<div class="src-line"><mark>Not unlike</mark> reality television stars</div><div class="orange-box">‘다르지 않은’은 곧 ‘비슷한’이라는 뜻입니다. 이중 부정 의미에 주의합니다.</div>`}]},{group:'문장 5·7',items:[{id:'g51-parallel',color:'teal',title:'수동태 병렬',body:`<div class="src-line">is <mark>symbolized</mark> …, <mark>characterized</mark> … and <mark>associated</mark> …</div><div class="teal-box">세 과거분사가 하나의 be동사에 병렬로 연결됩니다.</div>`},{id:'g51-gerund',color:'purple',title:'동명사구 주어',body:`<div class="src-line"><mark>Achieving ordinary fame</mark> … <mark>is</mark> like …</div><div class="purple-box">동명사구 전체가 단수 주어이므로 동사는 <b class="en">is</b>입니다.</div>`}]}],
  flow:{tabLabel:'흐름·빈칸 근거',sections:[{id:'a51-flow',icon:'🧭',title:'글의 흐름',html:`<div class="stage-row"><div class="stage-item"><b>① 기존 비판</b>평범한 유명인은 전통적 재능이 없음</div><span class="flow-arrow">→</span><div class="stage-item"><b>② 인정</b>엘리트 영역 진입 장벽은 실제 존재</div><span class="flow-arrow">→</span><div class="stage-item hi"><b>③ 반전</b>평범한 명성은 명성의 의미 자체를 재구성</div><span class="flow-arrow">→</span><div class="stage-item"><b>④ 새 명성</b>대중과의 빈번한 상호작용과 관심 점수</div></div>`},{id:'a51-blank',icon:'🎯',title:'빈칸 추론 근거',html:`<div class="rule-card rose"><div class="src-line">the phenomenon of ordinary celebrity <span style="display:inline-block;min-width:260px;border-bottom:2px solid var(--rose)">&nbsp;</span>.</div><p>뒤에서는 신비와 거리의 엘리트 명성과 달리 평범한 명성이 상호작용과 수치화된 관심으로 성립한다고 설명합니다. 즉 명성의 정의가 바뀝니다.</p><div class="green-box">정답: <b class="en">reconstructs the meaning of fame</b></div></div>`},{id:'a51-title',icon:'🏷️',title:'제목·주제·요약',html:`<div class="purple-box"><b>How Ordinary Fame Is Redefining Celebrity</b><br>소셜 미디어의 평범한 유명인은 전통적 재능 대신 대중과의 상호작용과 관심 지표를 통해 명성의 의미를 재구성한다.</div>`}]},

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function plainText(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('.sl').forEach(e=>e.remove());return d.textContent.replace(/\s+/g,' ').trim();}
function circled(n){return n<=20?String.fromCharCode(0x2460+n-1):'('+n+')';}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function unitTypes(l){const base=UNITS.filter(u=>u.lesson===l).map(u=>u.type);return [...new Set([...base,...typesOf(PASSAGES.filter(p=>p.lesson===l))])];}
function typesOf(list){const ts=[...new Set(list.map(p=>p.type))];return ts.sort((a,b)=>{const ia=TYPE_ORDER.indexOf(a),ib=TYPE_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});}
function sortId(a,b){return a.id.localeCompare(b.id,undefined,{numeric:true});}

/* ── 훈련 1~3 전체 문장 반영 보정 ──
   기존의 핵심 문제는 유지하고, 어느 훈련에서도 빠진 문장이 없도록
   문장 번호를 연결한 뒤 누락분만 자동으로 보충한다. */
function drillNorm(s){return String(s||'').toLowerCase().replace(/[“”‘’'".,?!;:—–()\[\]]/g,' ').replace(/\s+/g,' ').trim();}
function drillWords(s){return drillNorm(s).split(' ').filter(w=>w.length>1);}
function inferQuestionSentence(p,q){
  const target=drillNorm(q.pre+(q.o[q.a]||'')+q.post);
  if(!target)return -1;
  let best=-1,bestScore=0;
  p.sents.forEach((s,i)=>{
    const sent=drillNorm(plainText(s.en));
    if(sent.includes(target)||target.includes(sent)){best=i;bestScore=2;return;}
    const tw=drillWords(target),sw=new Set(drillWords(sent));
    const score=tw.length?tw.filter(w=>sw.has(w)).length/tw.length:0;
    if(score>bestScore){best=i;bestScore=score;}
  });
  return bestScore>=.5?best:-1;
}
function wrongGrammarForm(word){
  const low=word.toLowerCase();
  const map={am:'is',is:'are',are:'is',was:'were',were:'was',has:'have',have:'has',does:'do',do:'does',who:'whom',
    means:'mean',works:'work',exists:'exist',reveals:'reveal',allows:'allow',offers:'offer',
    becomes:'become',occurs:'occur',attracts:'attract',refers:'refer',shows:'show',makes:'make',
    can:'can to',could:'could to',should:'should to',would:'would to',might:'might to',will:'will to',
    being:'be',having:'have',conducting:'conduct',facing:'face',pursuing:'pursue',assessing:'assess',reading:'read',
    focus:'focuses',misses:'miss',noticed:'notice',admitted:'admit'};
  let wrong=map[low];
  if(!wrong){
    if(/ied$/.test(low))wrong=low.replace(/ied$/,'y');
    else if(/ed$/.test(low)){
      wrong=low.slice(0,-2);
      if(/([a-z])\1$/.test(wrong))wrong=wrong.slice(0,-1);
      else if(/c$/.test(wrong))wrong+='e';
    }
    else if(/ing$/.test(low))wrong=low.replace(/ing$/,'');
    else if(/s$/.test(low))wrong=low.slice(0,-1);
    else wrong=low+'s';
  }
  return /^[A-Z]/.test(word)?wrong[0].toUpperCase()+wrong.slice(1):wrong;
}
function grammarQuestionFor(p,si){
  const s=p.sents[si],text=plainText(s.en);
  const v=(s.sv.find(x=>x[0]==='V')||[])[1]||'';
  const candidates=(v.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]).concat(text.match(/\b(?:is|are|was|were|has|have|does|do|can|could|should|would|might|will|\w+(?:ed|ing|s))\b/gi)||[]);
  let word=/\bThat's\b/i.test(text)?"That's":candidates.find(w=>w.length>1&&new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(text));
  if(!word)word=(text.match(/[A-Za-z]+/)||['Sentence'])[0];
  const at=text.toLowerCase().indexOf(word.toLowerCase());
  const actual=text.slice(at,at+word.length),wrong=actual.toLowerCase()==="that's"?'Those are':wrongGrammarForm(actual);
  const correctFirst=si%2===0;
  return {s:si,pre:text.slice(0,at),o:correctFirst?[actual,wrong]:[wrong,actual],a:correctFirst?0:1,
    post:text.slice(at+actual.length),e:`문장 ${si+1}의 원문 어법은 '${actual}'입니다.`};
}
function vocabFallbackFor(p,si){
  const s=p.sents[si],en=plainText(s.en),ko=plainText(s.tr);
  const curated={
    '11-42:2':['on and on and on','계속해서 끊임없이'],
    '11-42:5':['no good at all','전혀 좋지 않다'],
    '11-44:1':['solo','혼자서'],
    '11-44:7':['all voices','모든 의견'],
    '11-47:3':['repeated','반복될'],
    '11-47:9':['ensure','보장할지도'],
    '11-48:3':['do have to leave','정말 떠나야'],
    '11-50:6':['Period','끝'],
    '11-52:3':['position','위치'],
    '11-52:6':['face forward','앞쪽을 향하는']
  };
  const fixed=curated[p.id+':'+si];
  if(fixed)return {s:si,en:fixed[0],ko:fixed[1],k:[fixed[1].replace(/[\s.,·~()\-'"“”]/g,'')]};
  let pair=(s.chunks||[]).find(c=>c[0]&&c[1]&&en.includes(c[0].replace(/[“”]/g,'"'))&&ko.includes(c[1]));
  if(!pair)pair=[en,ko];
  return {s:si,en:pair[0].replace(/[“”]/g,'"'),ko:pair[1],k:[pair[1].replace(/[\s.,·~()\-'"“”]/g,'')]};
}
function wordQuestionFor(p,si,vi){
  const s=p.sents[si],text=plainText(s.en),v=p.drills.vocab[vi];
  let at=text.indexOf(v.en);
  if(at<0){v.en=text;at=0;}
  const wordDistractors={
    enabling:'preventing','on and on and on':'briefly','up front':'indirectly','no good at all':'excellent',
    termed:'ignored',solo:'jointly',promising:'hopeless','all voices':'no voices','collective intelligence':'individual bias',
    'in common':'different',observations:'assumptions',conclusions:'questions',repeated:'dismissed',outcome:'method',
    involved:'excluded',ensure:'prevent',client:'stranger','do have to leave':'do have to stay',admitted:'denied',
    rude:'polite',advantage:'disadvantage',entertaining:'boring',outstanding:'average',Period:'Beginning',
    criticized:'praised',symbolized:'hidden',species:'individuals',distinguishes:'confuses','face forward':'face outward'
  };
  const others=p.drills.vocab.filter(x=>x.en!==v.en&&x.s!==si);
  const distractor=wordDistractors[v.en]||(others[(si+vi)%Math.max(1,others.length)]||{en:'unrelated'}).en;
  const correctFirst=si%2!==0;
  return {s:si,pre:text.slice(0,at),o:correctFirst?[v.en,distractor]:[distractor,v.en],a:correctFirst?0:1,
    post:text.slice(at+v.en.length),e:`문장 ${si+1}에서는 '${v.en}'(${v.ko})이 문맥에 맞습니다.`};
}
function ensureSentenceCoverage(){
  PASSAGES.forEach(p=>{
    /* 훈련 3: 모든 문장에 최소 한 개의 실제 해석 빈칸 */
    const vocabCovered=new Set(p.drills.vocab.map(v=>v.s));
    p.sents.forEach((s,si)=>{if(!vocabCovered.has(si))p.drills.vocab.push(vocabFallbackFor(p,si));});

    /* 기존 문제를 가장 가까운 원문 문장과 연결 */
    ['gram','word'].forEach(key=>p.drills[key].forEach(q=>{if(q.s===undefined)q.s=inferQuestionSentence(p,q);}));

    /* 훈련 1: 어법 문제가 없는 문장 보충 */
    const gramCovered=new Set(p.drills.gram.map(q=>q.s).filter(i=>i>=0));
    p.sents.forEach((s,si)=>{if(!gramCovered.has(si))p.drills.gram.push(grammarQuestionFor(p,si));});

    /* 훈련 2: 문맥 어휘 문제가 없는 문장 보충 */
    const wordCovered=new Set(p.drills.word.map(q=>q.s).filter(i=>i>=0));
    p.sents.forEach((s,si)=>{
      if(wordCovered.has(si))return;
      const vi=p.drills.vocab.findIndex(v=>v.s===si);
      p.drills.word.push(wordQuestionFor(p,si,vi));
    });
    p.drills.gram.sort((a,b)=>(a.s??99)-(b.s??99));
    p.drills.word.sort((a,b)=>(a.s??99)-(b.s??99));
  });
}

function go(hash){if(location.hash===hash)route();else location.hash=hash;}
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(h.startsWith('P/')){const p=PASSAGES.find(x=>x.id===h.slice(2));if(p){renderStudy(p);return;}}
  if(h.startsWith('L/')){const l=Number(h.slice(2));if(lessons().includes(l)){renderLesson(l);return;}}
  renderHome();
}
function setHeader(crumbs,titleHtml,tabsHtml){
  $('crumbs').innerHTML=crumbs.map((c,i)=>i===crumbs.length-1?`<span class="here">${c[0]}</span>`:`<button onclick="go('${c[1]}')">${c[0]}</button><span class="sep">›</span>`).join('');
  $('ptitle').innerHTML=titleHtml;
  $('tabbar').innerHTML=tabsHtml||'';
  $('tabbar').style.display=tabsHtml?'flex':'none';
  $('hdr').classList.toggle('has-tabs',!!tabsHtml);
  window.scrollTo({top:0});
}

function renderHome(){
  P=null;

  document.title=`${APP_TITLE} | ${APP_SUB}`;

function renderLesson(l){
  P=null;
  document.body.dataset.lesson=String(l);
  const list=PASSAGES.filter(p=>p.lesson===l);
  document.title=`${l}과 | ${APP_TITLE}`;

function switchTab(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));

}
function goTo(tabIdx,anchorId){
  switchTab(tabIdx);
  if(anchorId)setTimeout(()=>{const el=$(anchorId);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},120);
}

function renderStudy(p){
  P=p;

  const tabs=TABS.map((t,i)=>(t.group?`<span class="tab-group-label">${t.group}</span>`:'')+

    `${esc(p.id)} <span class="badge-unit">${p.lesson}과</span><span class="badge-unit rose">${typeIcon(p.type)} ${esc(p.type)}</span>`,tabs);

}

/* 훈련 1·2 */
function renderChoice(key){
  const data=P.drills[key],st=S()[key];
  $(key+'-box').innerHTML=data.map((d,i)=>{
    const pick=st[i],done=pick!==undefined;
    const opts=d.o.map((o,j)=>{
      let c='ch-opt';if(done){if(j===d.a)c+=' correct';else if(j===pick)c+=' wrong';}
      return `<button class="${c}" ${done?'disabled':''} onclick="pickChoice('${key}',${i},${j})">${esc(o)}</button>`;
    }).join(' / ');
    const no=d.s>=0?`문장 ${d.s+1}`:`${i+1}`;
    return `<div class="ch-item"><div class="ch-s"><span class="n">${no}</span>${esc(d.pre)}[ ${opts} ]${esc(d.post)}</div>${done?`<div class="ch-exp ${pick===d.a?'ok':'no'}">${pick===d.a?'✅':'❌'} ${esc(d.e)}</div>`:''}</div>`;
  }).join('');
  const ans=st.filter(v=>v!==undefined).length,cor=data.filter((d,i)=>st[i]===d.a).length;
  $(key+'-score').textContent=`${cor} / ${ans} 정답 · ${ans}/${data.length}문항`;
}
function pickChoice(key,i,j){S()[key][i]=j;renderChoice(key);}
function resetChoice(key){S()[key]=[];renderChoice(key);}

/* 훈련 3 : 문장 대응 어휘 해석 */
function vocabNorm(s){return String(s||'').replace(/[\s.,·~()\-'"]/g,'');}
function vocabLayout(){
  /* 영어 등장 순서대로 번호를 매기고, 영어/한국어 위치를 계산 */
  const V=P.drills.vocab;let n=0;
  return P.sents.map((s,si)=>{
    const en=plainText(s.en),ko=plainText(s.tr);
    const items=V.map((v,vi)=>({...v,vi})).filter(v=>v.s===si)
      .map(v=>({...v,ep:en.indexOf(v.en),kp:ko.indexOf(v.ko)}))
      .sort((a,b)=>a.ep-b.ep);
    items.forEach(v=>{v.no=++n;});
    return {si,en,ko,items};
  });
}
function markUp(text,items,posKey,lenKey,make){
  let cur=0,out='';
  items.filter(v=>v[posKey]>=0).slice().sort((a,b)=>a[posKey]-b[posKey]).forEach(v=>{
    if(v[posKey]<cur)return;
    out+=esc(text.slice(cur,v[posKey]))+make(v);
    cur=v[posKey]+v[lenKey].length;
  });
  return out+esc(text.slice(cur));
}
function renderVocab(){
  const st=S().vocab,L=vocabLayout();
  const total=P.drills.vocab.length;
  $('vocab-box').innerHTML=L.map(r=>{
    const enHtml=markUp(r.en,r.items,'ep','en',v=>{
      const res=st.res[v.vi];
      return `<span class="voc-w${res===true?' ok':res===false?' no':''}" onclick="focusVocab(${v.vi})"><sup>${v.no}</sup>${esc(v.en)}</span>`;});
    const koHtml=markUp(r.ko,r.items,'kp','ko',v=>{
      const res=st.res[v.vi];
      const w=Math.max(56,[...v.ko].length*15+18);
      return `<span class="vt-blank"><sup>${v.no}</sup><input id="voc-${v.vi}" autocomplete="off" aria-label="${v.no}번 빈칸" style="width:${w}px" value="${esc(st.vals[v.vi]||'')}" class="${res===true?'ok':res===false?'no':''}" oninput="S().vocab.vals[${v.vi}]=this.value" onkeydown="vocabKey(event,${v.no})">${st.show?`<span class="voc-key">${esc(v.ko)}</span>`:''}</span>`;});
    return `<div class="vt-item"><div class="vt-en"><span class="voc-sn">${r.si+1}</span>${enHtml}</div><div class="vt-ko"><span class="vt-tag">해석</span>${koHtml}</div></div>`;
  }).join('');
  const c=st.res.filter(x=>x===true).length;
  $('vocab-score').textContent=st.res.length?`${c} / ${total} 정답`:`빈칸 ${total}개`;
  const b=$('vocab-show');if(b){b.classList.toggle('on',st.show);b.textContent=st.show?'정답 숨기기':'정답 보기';}
}
function vocabKey(e,no){
  if(e.key!=='Enter')return;
  e.preventDefault();
  const next=vocabLayout().flatMap(r=>r.items).find(v=>v.no===no+1);
  if(next)focusVocab(next.vi);
}
function focusVocab(i){
  const inp=$('voc-'+i);if(!inp)return;
  inp.focus({preventScroll:true});
  inp.scrollIntoView({behavior:'smooth',block:'center'});
}
function checkVocab(){
  const V=P.drills.vocab,st=S().vocab;
  st.res=V.map((v,i)=>{const n=vocabNorm(st.vals[i]);return n.length>0&&v.k.some(k=>n.includes(vocabNorm(k)));});
  renderVocab();
}
function toggleVocabShow(){S().vocab.show=!S().vocab.show;renderVocab();}
function resetVocab(){S().vocab={vals:[],res:[],show:false};renderVocab();}

/* 훈련 4 : 순서 */
function renderOrder(){
  const O=P.drills.order,seq=S().order;
  $('ord-boxes').innerHTML=O.boxes.map(b=>`<button class="ord-box${seq.includes(b.k)?' used':''}" onclick="pickOrder('${b.k}')"><b>(${b.k})</b>${esc(plainText(P.sents[b.s].en))}</button>`).join('');
  $('ord-seq').innerHTML=O.boxes.map((b,i)=>`<span class="ord-slot${seq[i]?' filled':''}">${seq[i]?'('+seq[i]+')':''}</span>`).join('<span class="flow-arrow">→</span>');
  $('ord-fb').innerHTML=S().orderFb;
}
function pickOrder(k){
  const st=S(),i=st.order.indexOf(k);
  if(i>=0)st.order.splice(i,1);else if(st.order.length<P.drills.order.boxes.length)st.order.push(k);
  st.orderFb='';renderOrder();
}
function checkOrder(){
  const O=P.drills.order,st=S();
  if(st.order.length<O.boxes.length)st.orderFb='<div class="ch-exp no">모든 단락을 순서대로 눌러 주세요.</div>';
  else{const ok=st.order.join()===O.answer.join();
    st.orderFb=`<div class="ch-exp ${ok?'ok':'no'}">${ok?'✅ 정답!':'❌ 정답은 '+O.answer.map(k=>'('+k+')').join(' → ')}<br>${esc(O.exp)}</div>`;}
  renderOrder();
}
function resetOrder(){S().order=[];S().orderFb='';renderOrder();}

/* 훈련 5 : 배열 */
function newScr(i){
  const words=P.drills.scr[i].s.replace(/\.$/,'').split(' ').map((w,k)=>({w,k}));
  let pool=shuffle(words);
  if(pool.map(x=>x.k).join()===words.map(x=>x.k).join())pool=pool.reverse();
  return {pool,ans:[],result:null,show:false};
}
function renderScr(){
  const all=S().scr;
  $('scr-box').innerHTML=P.drills.scr.map((d,i)=>{const st=all[i];return `<div class="scr-item">
    <div class="scr-ko">${i+1}. ${esc(d.ko)}</div>
    <div class="scr-ans${st.result===true?' ok':st.result===false?' no':''}">${st.ans.map((t,p)=>`<button class="tok" onclick="scrBack(${i},${p})">${esc(t.w)}</button>`).join('')}</div>
    <div class="scr-pool">${st.pool.map((t,p)=>`<button class="tok" onclick="scrPick(${i},${p})">${esc(t.w)}</button>`).join('')}</div>
    <div class="btn-row" style="margin-top:0"><button class="act-btn" onclick="scrCheck(${i})">확인</button><button class="act-btn ghost" onclick="scrShow(${i})">정답 보기</button><button class="act-btn ghost" onclick="scrReset(${i})">다시 섞기</button></div>
    ${st.result===false?'<div class="ch-exp no">❌ 순서를 다시 확인해 보세요.</div>':''}
    ${st.result===true?'<div class="ch-exp ok">✅ 정답!</div>':''}
    ${st.show?`<div class="scr-key">${esc(d.s)}</div>`:''}</div>`;}).join('');
  $('scr-score').textContent=`${all.filter(s=>s.result===true).length} / ${all.length} 완성`;
}
function scrPick(i,p){const st=S().scr[i];st.ans.push(st.pool.splice(p,1)[0]);st.result=null;renderScr();}
function scrBack(i,p){const st=S().scr[i];st.pool.push(st.ans.splice(p,1)[0]);st.result=null;renderScr();}
function scrCheck(i){const st=S().scr[i];st.result=st.pool.length===0&&st.ans.map(t=>t.w).join(' ')===P.drills.scr[i].s.replace(/\.$/,'');renderScr();}
function scrShow(i){S().scr[i].show=true;renderScr();}
function scrReset(i){S().scr[i]=newScr(i);renderScr();}

{
  id:'11-54',lesson:11,type:'빈칸 추론',
  sents:[
    addSent('역할에 따른 상호작용',`People engage in typical patterns of interaction <span class="br">based on the relationship between their roles and the roles of others</span>.`,'사람들은 자신의 역할과 다른 사람의 역할 사이의 관계에 근거하여 전형적인 양식의 상호 작용에 참여한다.'),
    addSent('고용주와 의사의 사례',`Employers are expected to interact with employees in a certain way, <span class="an" data-n="도치">as are doctors with patients</span>.`,'의사들이 환자들과 그러한 것처럼 고용주들은 직원들과 특정한 식으로 상호 작용하도록 기대된다.'),
    addSent('지위가 행동을 제한함',`In each case, actions are restricted by the role responsibilities and obligations <span class="br">associated with individuals’ positions within society</span>.`,'각각의 경우에 행동은 사회 내의 개인의 지위와 관련된 역할 책임과 의무에 의해 제한된다.'),
    addSent('부모와 자녀의 권리·의무',`For instance, parents and children are linked by certain rights, privileges, and obligations.`,'예를 들어 부모와 자식은 특정한 권리, 특권, 의무에 의해 연결된다.'),
    addSent('부모의 책임',`Parents are responsible for providing their children with the basic necessities of life — food, clothing, shelter, and so forth.`,'부모는 자기 자녀에게 의식주 등 기본적인 생활필품을 제공할 책임이 있다.'),
    addSent('기대의 강제력',`These expectations are <span class="an" data-n="so-that">so powerful that</span> not meeting them may make the parents vulnerable to charges of negligence or abuse.`,'이러한 기대가 너무 강해서 그것을 충족시키지 못하는 것은 부모를 태만이나 학대 혐의로 비난받기 쉽도록 할지도 모른다.'),
    addSent('자녀에게 향하는 기대',`Children, in turn, are expected to do <span class="br">as their parents say</span>.`,'이번에는 아이들이 자신의 부모가 말하는 대로 하도록 기대된다.'),
    addSent('성격뿐 아니라 지위',`Thus, interactions within a relationship are functions <span class="ul">not only</span> of the individual personalities of the people involved <span class="ul">but also</span> of the role requirements associated with the <span class="ci">statuses</span> they have.`,'그러므로 관계 내의 상호 작용은 관련된 사람들 개개의 성격의 작용일 뿐만 아니라 그들이 지닌 지위와 관련된 역할 요구의 작용이다.')
  ],

  flow:addedFlow(54,'We Interact by Our Roles, Not Just Our Personalities','사람들의 상호작용은 개인 성격뿐 아니라 사회적 역할과 지위에 따른 권리·의무·기대의 영향을 받는다.','statuses',[['일반 원리','역할 관계에 따라 상호작용 양식이 정해짐'],['사례','고용주·의사·부모·자녀에게 서로 다른 기대가 적용됨'],['강제력','기대를 어기면 태만이나 학대 혐의도 생김'],['결론','상호작용은 성격과 지위 모두의 함수임']]),

{
  id:'11-55',lesson:11,type:'빈칸 추론',
  sents:[
    addSent('세계화의 약속',`The title of Thomas Friedman’s 2005 book, <i>The World Is Flat</i>, was based on the belief <span class="br sq">that globalization would inevitably bring us closer together</span>.`,'Thomas Friedman의 2005년 저서의 제목인 ‘The World Is Flat’은 세계화가 필연적으로 우리를 더 가깝게 만들 것이라는 믿음에 근거하였다.'),
    addSent('가까워짐과 장벽',`It has done that, <span class="ul">but</span> it has also inspired us <span class="ci">to build barriers</span>.`,'그것은 그렇게 해왔지만 또한 우리가 장벽을 쌓도록 해왔다.'),
    addSent('위협 앞의 집단 결속',`<span class="br">When faced with perceived threats</span> — the financial crisis, terrorism, violent conflict, refugees and immigration, the increasing gap between rich and poor — people cling more tightly to their groups.`,'금융 위기, 테러 행위, 폭력적 분쟁, 난민과 이민자, 증가하는 빈부 격차 같은 인지된 위협들에 직면할 때, 사람들은 자신의 집단에 더 단단히 달라붙는다.'),
    addSent('소셜 미디어의 이상',`One founder of a famous social media company believed <span class="br sq">social media would unite us</span>.`,'한 유명 소셜 미디어 회사 설립자는 소셜 미디어가 우리를 결합시킬 것이라고 믿었다.'),
    addSent('사이버 부족의 등장',`In some respects, it has, but it has simultaneously given voice and organizational ability to new cyber tribes, <span class="br sq">some of whom spend their time spreading blame and division across the World Wide Web</span>.`,'어떤 면에서는 그래 왔지만 그것은 동시에 새로운 사이버 부족들에게 목소리와 조직력을 부여해 왔고, 이들 중 일부는 자신들의 시간을 월드 와이드 웹에 비난과 분열을 퍼뜨리는 데 보낸다.'),
    addSent('부족과 갈등의 증가',`There seem now to be <span class="an" data-n="비교">as many tribes</span>, and <span class="an" data-n="비교">as much conflict</span> between them, as there have ever been.`,'지금까지 그래 온 만큼이나 현재 많은 부족들, 그리고 그들 사이의 많은 분쟁이 존재하는 것처럼 보인다.'),
    addSent('공존의 가능성',`Is it possible <span class="br">for these tribes to coexist</span> in a world <span class="br sq">where the concept of “us and them” remains</span>?`,'‘우리와 그들’이라는 개념이 남아 있는 세계에서 이러한 부족들이 공존하는 것이 가능할까?')
  ],
  footnote:'',

  flow:addedFlow(55,'Globalization: Bringing Us Together, Yet Building Walls','세계화와 소셜 미디어는 사람들을 연결하지만, 위협과 집단 정체성은 새로운 장벽과 사이버 부족 간 갈등을 만든다.','to build barriers',[['기대','세계화가 사람들을 더 가깝게 함'],['반전','동시에 장벽을 쌓게 함'],['사례','위협 앞에서 집단 결속과 사이버 부족이 강화됨'],['질문','우리와 그들이 남은 세계에서 공존 가능한가']]),

{

  sents:[
    addSent('흥미로운 문제',`Back in 1996, an American airline was <span class="br">faced with an interesting problem</span>.`,'1996년 한 미국 항공사가 흥미로운 문제에 직면했다.'),

    addSent('진짜 흥미로운 부분',`However, that’s not the interesting part.`,'하지만 그것이 흥미로운 부분은 아니다.'),

    addSent('성장의 상한선',`It turned down tremendous growth because <span class="ci">company leadership had set an upper limit for growth</span>.`,'그것은 엄청난 성장을 거절했는데 회사 수뇌부가 성장의 상한선을 설정했기 때문이다.'),

    addSent('지속 가능한 속도',`Unlike other famous companies, they wanted to set their own pace, one <span class="br sq">that could be sustained in the long term</span>.`,'다른 유명한 회사들과는 달리, 그들은 장기간 지속될 수 있는 것, 즉 자신만의 속도를 정하기를 원했다.'),

  sents:[
    addSent('당대에 오해받은 작곡가들',`You hear again and again <span class="br sq">that some of the greatest composers were misunderstood in their own day</span>.`,'여러분은 몇몇 가장 위대한 작곡가들이 그들의 시대에 진가를 인정받지 못했다고 몇 번이고 듣는다.'),
    addSent('이해하기 어려웠던 음악',`Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day.`,'그들의 시대에 베토벤, 브람스, 스트라빈스키의 작품을 모든 사람이 이해할 수 있었던 것은 아니었다.'),
    addSent('낯섦이 만든 거부',`The reason for this initial lack of acceptance is <span class="ci">unfamiliarity</span>.`,'이러한 초기의 수용 부족의 이유는 낯섦이다.'),

    addSent('유능한 작곡가의 생각',`Effective composers have their own ideas.`,'유능한 작곡가는 그들 자신만의 생각을 갖는다.'),

{
  id:'11-60',lesson:11,type:'빈칸 추론',
  sents:[
    addSent('문어의 최고의 방어',`The best defence <span class="br sq">most species of octopus have</span> is to stay hidden as much as possible and do their own hunting at night.`,'대부분의 문어 종이 가진 최고의 방어는 가능한 한 많이 숨어 있는 것과 밤에 그들 자신의 사냥을 하는 것이다.'),
    addSent('낮에 발견된 문어',`So <span class="br">to find one in full view in the shallows in daylight</span> was a surprise for two Australian underwater photographers.`,'그래서 낮에 얕은 곳에서 전체가 보이는 문어를 발견한 것은 두 명의 호주 수중 사진작가에게 놀라운 일이었다.'),
    addSent('처음에는 넙치',`Actually, <span class="br sq">what they saw at first</span> was a flounder.`,'실제로, 그들이 처음 봤던 것은 넙치였다.'),
    addSent('다시 보고 발견한 위장',`<span class="an" data-n="강조">It was only when they looked again that</span> they saw a medium-sized octopus, with all eight of its arms folded and its two eyes staring upwards <span class="ci">to create the illusion</span>.`,'오직 그들이 다시 봤을 때서야 그들은 여덟 개의 팔이 전부 접혀 있고 두 눈이 위쪽으로 향한 중간 크기의 문어를 보았는데, 그것은 착시를 만들기 위한 것이었다.'),
    addSent('변신에 쓰인 능력',`An octopus has a big brain, excellent eyesight and the ability to change colour and pattern and this one was using these assets to turn itself into a completely different creature.`,'문어는 큰 뇌, 뛰어난 시력과 색깔과 무늬를 바꾸는 능력을 지니고 있고, 이 문어는 완전히 다른 생물체로 변신하기 위해 이러한 이점을 사용하고 있었다.'),
    addSent('바다뱀으로 변신',`Many more of this species have been found since then, and there are now photographs of octopuses <span class="br sq">that could be said to be transforming into sea snakes</span>.`,'그 이후 이 종이 더 많이 발견되어 왔으며, 지금은 바다뱀으로 변신하는 중이라고 말할 수 있는 문어의 사진이 있다.'),
    addSent('모방하며 사냥하기',`And <span class="br">while they mimic</span>, they hunt — producing the spectacle of, say, a flounder suddenly developing an octopodian arm, sticking it down a hole and grabbing <span class="br sq">whatever’s hiding there</span>.`,'그리고 그들이 모방하는 동안 그들은 사냥을 한다. 이를테면 넙치가 갑자기 문어 다리 같은 팔을 발달시켜 그것을 구멍으로 찔러 넣어 그곳에 숨어 있는 무엇이든 움켜잡는 광경을 만들어 낸다.')
