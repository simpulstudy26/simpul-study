<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사 정O수 선생님 파트 연대기</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#0c0b09;
 --ink-2:#14120e;
 --ink-3:#1c1914;
 --ivory:#ece3cf;
 --ivory-dim:#b9ae97;
 --muted:#8a8069;
 --gold:#c9a75d;
 --gold-hi:#e4c886;
 --gold-lo:rgba(201,167,93,.28);
 --line:rgba(201,167,93,.18);
 --w:#7fa89c;   /* 국제·냉전 — 청록 녹 */
 --s:#8ea7c9;   /* 남한 정치 — 쪽빛 */
 --u:#93b07c;   /* 통일 운동 — 쑥 */
 --e:#c49a52;   /* 경제·사회 — 청동 */
 --n:#ae92c9;   /* 북한 — 자수정 */
 --x:#c0634a;   /* 6·25 전쟁 — 주홍 */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
 font-family:'Noto Serif KR','Nanum Myeongjo',serif;
 font-size:15px;line-height:1.8;color:var(--ivory);
 background-color:var(--ink);
 background-image:
  radial-gradient(ellipse at 50% -10%,rgba(201,167,93,.10),transparent 55%),
  radial-gradient(ellipse at 50% 120%,rgba(120,70,40,.10),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
 background-attachment:fixed;
 min-height:100vh;
}
::selection{background:rgba(201,167,93,.35)}

/* ── Masthead ── */
.mast{max-width:900px;margin:0 auto;padding:54px 22px 26px;text-align:center}
.mast .eyebrow{font-family:'Cormorant Garamond',serif;letter-spacing:.42em;font-size:12px;color:var(--gold);text-transform:uppercase}
.mast h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(28px,5.4vw,44px);letter-spacing:.06em;margin:12px 0 6px;color:var(--ivory)}
.mast .sub{font-size:14px;color:var(--ivory-dim);letter-spacing:.14em}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);margin:18px auto 0;max-width:420px}
.orn::before,.orn::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 40%,var(--gold) 60%,transparent)}
.orn span{font-size:15px;letter-spacing:.5em;padding-left:.5em}

/* ── Sticky controls ── */
.bar{position:sticky;top:0;z-index:40;background:rgba(12,11,9,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;padding:10px 22px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flt{font:inherit;font-size:12.5px;letter-spacing:.04em;background:none;border:1px solid var(--line);color:var(--ivory-dim);padding:2px 12px 3px;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s}
.flt i{width:7px;height:7px;transform:rotate(45deg);background:var(--c);display:inline-block}
.flt:hover{border-color:var(--gold-lo);color:var(--ivory)}
.flt.off{opacity:.35}
.flt.off i{background:transparent;outline:1px solid var(--c)}
.search{flex:1 1 180px;min-width:150px;font:inherit;font-size:14px;color:var(--ivory);background:transparent;border:none;border-bottom:1px solid var(--gold-lo);padding:3px 2px;outline:none}
.search::placeholder{color:var(--muted)}
.search:focus{border-bottom-color:var(--gold)}
.txt{font:inherit;font-size:12.5px;background:none;border:none;color:var(--gold);cursor:pointer;letter-spacing:.06em;padding:2px 6px}
.txt:hover{color:var(--gold-hi);text-decoration:underline;text-underline-offset:4px}
.dnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.dnav::-webkit-scrollbar{display:none}
.dnav button{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;background:none;border:none;color:var(--ivory-dim);padding:0 10px;cursor:pointer;white-space:nowrap;letter-spacing:.04em}
.dnav button:hover{color:var(--gold-hi)}
.dnav button+button{border-left:1px solid var(--line)}

/* ── Body ── */
main{max-width:900px;margin:0 auto;padding:10px 22px 120px}
.guide{margin:26px auto 8px;max-width:640px;text-align:center;font-size:13.5px;color:var(--ivory-dim)}
.guide b{color:var(--ivory);font-weight:600}

.era{margin-top:64px;scroll-margin-top:130px}
.era-head{text-align:center;margin-bottom:26px}
.era-yr{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(40px,8vw,64px);line-height:1;color:var(--gold);letter-spacing:.02em}
.era-name{margin-top:8px;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:17px;letter-spacing:.3em;padding-left:.3em;color:var(--ivory)}
.era-desc{font-size:12.5px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.era-head .orn{margin-top:12px;max-width:260px}

.yr{display:grid;grid-template-columns:92px 1fr;gap:0 36px;position:relative}
.yr::before{content:'';position:absolute;left:110px;top:0;bottom:0;width:1px;background:var(--line)}
.yr-n{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;color:var(--gold-hi);text-align:right;line-height:1;padding-top:14px;letter-spacing:.02em}
.yr-list{padding:4px 0 14px}
.ev{position:relative;border-bottom:1px solid rgba(201,167,93,.08)}
.ev::before{content:'';position:absolute;left:-22px;top:19px;width:8px;height:8px;transform:rotate(45deg);background:var(--ink);border:1px solid var(--c)}
.ev.open::before{background:var(--c)}
.ev button{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:10px;width:100%;padding:10px 4px 10px 2px;cursor:pointer}
.ev button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.ev .t{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16.5px;color:var(--ivory);transition:color .2s}
.ev .y{font-size:13.5px;color:var(--ivory-dim);white-space:nowrap}
.ev .k{margin-left:auto;font-size:11px;letter-spacing:.12em;color:var(--c);white-space:nowrap;opacity:.85}
.ev:hover .t{color:var(--gold-hi)}
.ev .d{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease,padding .3s ease;opacity:0;font-size:14px;color:var(--ivory-dim);padding:0 4px 0 2px;border-left:2px solid transparent}
.ev.open .d{max-height:160px;opacity:1;padding:0 8px 12px 12px;border-left-color:var(--c)}
.ev.open .t{color:var(--gold-hi)}
mark{background:rgba(201,167,93,.3);color:var(--ivory);padding:0 2px}
.empty{display:none;text-align:center;color:var(--muted);padding:60px 0;font-style:italic}

.c-w{--c:var(--w)}.c-s{--c:var(--s)}.c-u{--c:var(--u)}.c-e{--c:var(--e)}.c-n{--c:var(--n)}.c-x{--c:var(--x)}

.foot{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2em;margin-top:70px}
.totop{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold-lo);background:rgba(12,11,9,.85);color:var(--gold);font-size:16px;cursor:pointer}
.totop:hover{border-color:var(--gold);color:var(--gold-hi)}

@media (max-width:640px){
 body{font-size:14.5px}
 .mast{padding:36px 16px 18px}
 .bar-in{padding:8px 14px}
 .row.flts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 .row.flts::-webkit-scrollbar{display:none}
 .flt{flex:none}
 main{padding:6px 14px 100px}
 .yr{grid-template-columns:54px 1fr;gap:0 30px}
 .yr::before{left:69px}
 .ev::before{left:-19px}
 .yr-n{font-size:20px}
 .ev button{flex-wrap:wrap;gap:2px 8px}
 .ev .t{font-size:15.5px}
 .ev .k{margin-left:0;width:100%}
 .era{scroll-margin-top:150px}
}
</style>
</head>
<body>

<header class="mast">
 <div class="eyebrow">Chronicle · 1939 — 1959</div>
 <h1>한국사 정O수 선생님 파트</h1>
 <div class="sub">대한민국 정부 수립과 6·25 전쟁 · 연대기</div>
 <div class="orn"><span>❖</span></div>
</header>

<div class="bar">
 <div class="bar-in">
  <div class="row flts" id="flts"></div>
  <div class="row">
   <input class="search" id="q" type="search" placeholder="사건 · 인물 찾기">
   <button class="txt" onclick="openAll(true)">모두 펼치기</button>
   <button class="txt" onclick="openAll(false)">모두 접기</button>
  </div>
  <nav class="dnav" id="dnav"></nav>
 </div>
</div>

<main>
 <p class="guide">사건을 누르면 <b>한 줄 설명</b>이 펼쳐집니다. 위의 분야를 눌러 원하는 흐름만 볼 수 있습니다.</p>
 <div id="tl"></div>
 <div class="empty" id="empty">찾는 사건이 없습니다.</div>
 <div class="foot">❖ &nbsp; 1960 · 4·19 혁명으로 &nbsp; ❖</div>
</main>

<button class="totop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="맨 위로">▲</button>

<script>
const CATS={w:'국제·냉전',s:'남한 정치',u:'통일 운동·좌우 대립',e:'경제·사회',n:'북한',x:'6·25 전쟁'};

/* y 연도 · m 월(정렬·시기 구분용) · yl 표시 연도 · c 분야 · t 사건 · d 한 줄 설명 */
const EV=[
{y:1939,m:9,yl:'1939',c:'w',t:'제2차 세계 대전 발발',d:'독일의 폴란드 침공으로 시작되어 1945년 일본의 항복으로 끝났고, 연합국이 승리하였다.'},
{y:1945,m:2,yl:'1945. 2.',c:'w',t:'얄타 회담',d:'미국의 요청으로 소련이 대일전 참전을 약속하였고, 이는 한반도 분할 점령의 배경이 되었다.'},
{y:1945,m:8,yl:'1945. 8. 8.',c:'w',t:'소련, 대일 선전 포고',d:'소련군이 일주일 만에 만주를 함락하고 한반도로 빠르게 내려왔다.'},
{y:1945,m:8,yl:'1945. 8.',c:'w',t:'38도선 설정',d:'소련의 한반도 독점을 막으려는 미국의 제안으로 그어진 일본군 무장 해제용 경계선이 훗날 분단선이 되었다.'},
{y:1945,m:8,yl:'1945. 8. 15.',c:'s',t:'8·15 광복',d:'독립운동의 결실이자 연합국 승리의 결과였기에, 한반도의 운명은 강대국의 전후 처리에 좌우되었다.'},
{y:1945,m:8,yl:'1945. 8. 15.',c:'s',t:'조선 건국 준비 위원회 결성',d:'여운형·안재홍이 총독부로부터 치안 유지권을 넘겨받아 전국에 지부를 두고 치안과 행정을 맡았다.'},
{y:1945,m:8,yl:'1945. 8. 26.',c:'n',t:'소련군, 평양 진주',d:'소련군은 인민 위원회에 행정권을 넘겨 간접 통치하며 사회주의 세력을 지원하였다.'},
{y:1945,m:9,yl:'1945. 9. 6.',c:'s',t:'조선 인민 공화국 선포',d:'좌익 영향력이 커진 건준이 미군 진주에 앞서 서둘러 선포하고 지부를 인민 위원회로 바꾸었다.'},
{y:1945,m:9,yl:'1945. 9.',c:'s',t:'한국 민주당 창당',d:'김성수·송진우 중심의 지주·자본가 정당으로, 미군정에 적극 참여해 요직을 차지하였다.'},
{y:1945,m:9,yl:'1945. 9.',c:'n',t:'김일성, 평양 귀국',d:'항일 유격대 세력이 원산항을 거쳐 평양에 들어와 소련의 지원을 받았다.'},
{y:1945,m:9,yl:'1945. 9. 9.',c:'s',t:'미군 진주 · 미군정 실시',d:'맥아더 포고 제1호로 직접 통치를 시작했고, 총독부 관리와 경찰을 그대로 써서 친일파 재기의 길을 열었다.'},
{y:1945,m:10,yl:'1945',c:'w',t:'국제 연합(UN) 창설',d:'국제 연맹과 달리 경제 제재뿐 아니라 군사적 제재 수단까지 갖춘 국제기구이다.'},
{y:1945,m:10,yl:'1945',c:'s',t:'독립 촉성 중앙 협의회',d:'귀국한 이승만이 좌우를 망라하려 했으나 곧 이승만 지지 단체가 되었다.'},
{y:1945,m:10,yl:'1945',c:'e',t:'미곡 자유화 정책',d:'미군정이 식량 통제를 풀자 쌀이 투기 대상이 되어 오히려 식량난이 심해졌다.'},
{y:1945,m:11,yl:'1945',c:'s',t:'김구 등 임시 정부 요인 귀국',d:'미군정의 방침에 따라 정부가 아닌 개인 자격으로 들어와 임정 법통론을 내세웠다.'},
{y:1945,m:11,yl:'1945 – 1946',c:'w',t:'뉘른베르크 국제 군사 재판',d:'나치 핵심 인물과 유대인 학살 관련자들을 처벌하였다.'},
{y:1945,m:12,yl:'1945. 12.',c:'u',t:'모스크바 3국 외상 회의',d:'미소 공동 위원회 설치 → 임시 민주 정부 수립 → 최대 5년의 4개국 신탁 통치를 결정하였다.'},
{y:1945,m:12,yl:'1945. 12. 27.',c:'u',t:'신탁 통치 왜곡 보도',d:'『동아일보』가 미국과 소련의 입장을 뒤바꾸어 보도하고 임시 정부 수립 내용을 빠뜨렸다.'},
{y:1945,m:12,yl:'1945. 12.',c:'u',t:'반탁 운동 시작',d:'우익은 신탁 통치를 식민 통치의 연장으로 보고 반대하며 정국의 주도권을 잡았다.'},
{y:1946,m:1,yl:'1946. 1.',c:'u',t:'좌익, 3상 회의 지지로 전환',d:'좌익은 결정의 핵심을 임시 정부 수립으로 보고 총체적 지지로 돌아서 좌우 대립이 격해졌다.'},
{y:1946,m:1,yl:'1946',c:'n',t:'조만식 등 민족주의 세력 제거',d:'3상 회의 결정에 반대하자 소련군이 이들을 몰아냈다.'},
{y:1946,m:1,yl:'1946',c:'e',t:'미곡 수집령',d:'미군정이 다시 식량을 통제했지만 농민의 식량 사정은 나아지지 않았다.'},
{y:1946,m:2,yl:'1946. 2.',c:'n',t:'북조선 임시 인민 위원회',d:'김일성을 위원장으로 한 중앙 권력 기구로, 사실상 정부 역할을 하였다.'},
{y:1946,m:3,yl:'1946. 3.',c:'n',t:'북한 토지 개혁',d:'5정보 이상 토지를 무상 몰수·무상 분배했지만, 분배 토지의 매매·소작·저당은 금지하였다.'},
{y:1946,m:3,yl:'1946. 3.',c:'u',t:'제1차 미소 공동 위원회',d:'협의에 참여할 단체 자격(미국: 모든 단체 / 소련: 3상 결정 지지 단체만)을 두고 맞서 결렬되었다.'},
{y:1946,m:5,yl:'1946',c:'w',t:'극동 국제 군사 재판 개시',d:'A급 전범 28명 중 7명이 교수형을 받았지만 일왕은 기소되지 않아 처벌에 한계가 있었다(~1948).'},
{y:1946,m:6,yl:'1946. 6.',c:'s',t:'이승만, 정읍 발언',d:'남쪽만이라도 임시 정부를 세우자며 처음으로 단독 정부 수립을 주장하였다.'},
{y:1946,m:7,yl:'1946. 7.',c:'u',t:'좌우 합작 위원회 조직',d:'여운형(중도 좌파)과 김규식(중도 우파)이 미군정의 지원 아래 분단을 막으려 나섰다.'},
{y:1946,m:8,yl:'1946',c:'n',t:'중요 산업 국유화법 · 노동법 · 남녀 평등권법',d:'북조선 임시 인민 위원회가 사회주의 경제의 기반을 다졌다.'},
{y:1946,m:10,yl:'1946. 10.',c:'e',t:'대구 10월 사건',d:'식량 배급을 요구하던 시위가 경찰 발포로 격화되어 남한 전역으로 번졌다.'},
{y:1946,m:10,yl:'1946. 10.',c:'u',t:'좌우 합작 7원칙',d:'유상 매상·무상 분배 토지 개혁, 친일파 처벌 조례 등 절충안을 냈으나 한민당·조선 공산당 모두 반대하였다.'},
{y:1946,m:11,yl:'1946',c:'s',t:'남조선노동당 결성',d:'박헌영 중심으로 조선 공산당과 좌익 정당들이 통합하였다.'},

];

const ERAS=[
 {k:'e1', from:193901,to:194507, yr:'1939 – 1945', name:'새 로 운 국 제 질 서', desc:'제2차 세계 대전 · 얄타 회담'},
 {k:'e2', from:194508,to:194512, yr:'1945', name:'광 복 과 분 할 점 령', desc:'38도선 · 건준 · 미군정 · 모스크바 3국 외상 회의'},
 {k:'e3', from:194601,to:194807, yr:'1946 – 1948', name:'통 일 정 부 를 향 한 노 력', desc:'미소 공위 · 좌우 합작 · 유엔 이관 · 남북 협상 · 5·10 총선거'},
 {k:'e4', from:194808,to:195005, yr:'1948 – 1950', name:'두 개 의 정 부', desc:'정부 수립 · 반민 특위 · 농지 개혁 · 냉전의 확산'},
 {k:'e5', from:195006,to:195307, yr:'1950 – 1953', name:'6·25 전 쟁', desc:'남침 · 인천 상륙 · 중국군 개입 · 정전'},
 {k:'e6', from:195308,to:195912, yr:'1953 – 1959', name:'분 단 의 고 착 화', desc:'이승만 장기 집권 · 삼백 산업 · 김일성 독재 · 천리마 운동'}
];

const on=new Set(Object.keys(CATS));
EV.forEach((e,i)=>{e.i=i;e.m=e.m||0});
const SORTED=[...EV].sort((a,b)=>a.y-b.y||a.m-b.m||a.i-b.i);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)}

document.getElementById('flts').innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="flt c-${k}" data-k="${k}" onclick="flt('${k}')"><i></i>${v}</button>`).join('')+`<button class="txt" onclick="fltAll()">전체</button>`;
function flt(k){on.has(k)?on.delete(k):on.add(k);syncF();render()}
function fltAll(){Object.keys(CATS).forEach(k=>on.add(k));syncF();render()}
function syncF(){document.querySelectorAll('.flt').forEach(b=>b.classList.toggle('off',!on.has(b.dataset.k)))}

function render(){
 const q=document.getElementById('q').value.trim(), ql=q.toLowerCase();
 const opened=new Set([...document.querySelectorAll('.ev.open')].map(x=>x.dataset.i));
 let h='',nav='',n=0;
 for(const E of ERAS){
  const L=SORTED.filter(e=>(e.y*100+e.m)>=E.from&&(e.y*100+e.m)<=E.to&&on.has(e.c)&&(!q||(e.t+' '+e.d+' '+e.yl).toLowerCase().includes(ql)));
  if(!L.length)continue;
  n+=L.length;
  nav+=`<button onclick="go('${E.k}')">${E.yr}</button>`;
  h+=`<section class="era" id="${E.k}"><div class="era-head"><div class="era-yr">${E.yr}</div><div class="era-name">${E.name}</div><div class="era-desc">${E.desc}</div><div class="orn"><span>◆</span></div></div>`;
  for(const y of [...new Set(L.map(e=>e.y))]){
   h+=`<div class="yr"><div class="yr-n">${y}</div><div class="yr-list">`;
   for(const e of L.filter(x=>x.y===y)){
    const o=opened.has(String(e.i))||(q&&e.d.toLowerCase().includes(ql));
    h+=`<div class="ev c-${e.c}${o?' open':''}" data-i="${e.i}"><button aria-expanded="${o}" onclick="tg(this)"><span class="t">${hl(e.t,q)}</span><span class="y">(${esc(e.yl)})</span><span class="k">${CATS[e.c]}</span></button><div class="d">${hl(e.d,q)}</div></div>`;
   }
   h+=`</div></div>`;
  }
  h+=`</section>`;
 }
 document.getElementById('tl').innerHTML=h;
 document.getElementById('dnav').innerHTML=nav;
 document.getElementById('empty').style.display=n?'none':'block';
}
function tg(b){const ev=b.parentElement;ev.classList.toggle('open');b.setAttribute('aria-expanded',ev.classList.contains('open'))}
function openAll(o){document.querySelectorAll('.ev').forEach(ev=>{ev.classList.toggle('open',o);ev.firstElementChild.setAttribute('aria-expanded',o)})}
function go(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('q').addEventListener('input',render);
render();
</script>
</body>
</html>
