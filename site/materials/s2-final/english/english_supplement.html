=\"sl\">/</b> <span class=\"an ul\" data-n=\"부정 동명사구 주어\"><span class=\"an-word\">is</span></span> the central problem of <span class=\"ul st\">cross-cultural communication</span>.","tr":"다른 공동체의 규범을 모르는 것은 문화 간 의사소통의 핵심 문제이다.","sv":[["S","Not knowing the norms of another community","주어"],["V","is","동사"],["C","the central problem of cross-cultural communication","보어"]],"chunks":[["Not knowing the norms of another community","다른 공동체의 규범을 모르는 것은",[]],["is the central problem of cross-cultural communication.","문화 간 의사소통의 핵심 문제이다.",[["부정 동명사구 주어","g12-8"]]]],"mnote":"부정 동명사구 주어: 필기에서 주제로 표시했다. Not knowing ... 전체는 하나의 주어라 단수 is이다.","isSummary":false},{"title":"문장 9 · be동사 뒤 형용사 보어","en":"To continue the Thank you example, even though another culture may have an expression that appears translatable (many don’t), <b class=\"sl\">/</b> there may be different norms for its usage, for example, such that you should say Thank you only when the cost someone has caused is <span class=\"an ul\" data-n=\"be동사 뒤 형용사 보어\"><span class=\"an-word\">considerable</span></span>.","tr":"감사의 예를 이어 가면, 다른 문화에 번역 가능한 듯한 표현이 있더라도, 없는 문화도 많지만 그 사용 규범은 다를 수 있다. 예를 들어 누군가 치른 대가가 상당할 때만 감사해야 할 수도 있다.","sv":[["M","To continue ... / even though another culture may have ...","수식어"],["X","there may be different norms","절·구조"],["M","for its usage","수식어"],["X","when the cost someone has caused is considerable","절·구조"]],"chunks":[["To continue the Thank you example, even though another culture may have an expression that appears translatable (many don’t),","감사의 예를 이어 가면, 다른 문화에 번역 가능한 듯한 표현이 있더라도, 없는 문화도 많지만",[]],["there may be different norms for its usage, for example, such that you should say Thank you only when the cost someone has caused is considerable.","그 사용 규범은 다를 수 있다. 예를 들어 누군가 치른 대가가 상당할 때만 감사해야 할 수도 있다.",[["be동사 뒤 형용사 보어","g12-9"]]]],"mnote":"be동사 뒤 형용사 보어: 필기: cost가 주어이고 someone has caused는 수식절이다. is 뒤에는 상당한 상태를 나타내는 considerable이 온다.","isSummary":false},{"title":"문장 10 · hold + O + 형용사 보어","en":"In such a case it would sound ridiculous (i.e., unexpected, surprising, and worthy of criticism) <b class=\"sl\">/</b> if you were to thank someone for something so minor as <span class=\"an\" data-n=\"hold + O + 형용사 보어\"><span class=\"an-word\">holding</span></span> a door <span class=\"an ul\" data-n=\"hold + O + 형용사 보어\"><span class=\"an-word\">open</span></span> for you.","tr":"그런 경우에는 우스꽝스럽게, 곧 예상 밖이고 놀라우며 비판받을 만하게 들릴 것이다 여러분을 위해 문을 잡아 주는 것처럼 사소한 일로 누군가에게 감사한다면.","sv":[["S","it","주어"],["V","would sound","동사"],["C","ridiculous","보어"],["M","if you were to thank ...","수식어"],["X","holding a door open for you","절·구조"]],"chunks":[["In such a case it would sound ridiculous (i.e., unexpected, surprising, and worthy of criticism)","그런 경우에는 우스꽝스럽게, 곧 예상 밖이고 놀라우며 비판받을 만하게 들릴 것이다",[]],["if you were to thank someone for something so minor as holding a door open for you.","여러분을 위해 문을 잡아 주는 것처럼 사소한 일로 누군가에게 감사한다면.",[["hold + O + 형용사 보어","g12-10"]]]],"mnote":"hold + O + 형용사 보어: 필기: hold a door open에서 door가 목적어, open이 목적격 보어이다. were to thank는 가정 상황을 제시한다.","isSummary":false}],"grammar":[{"group":"문장 1","items":[{"id":"g12-1","title":"분사구문의 병렬","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Norms are everywhere, defining what is “normal” and <mark>guiding</mark> our interpretations of social life at every turn.</div><div class=\"def-box\">defining과 guiding은 규범이 행하는 능동적 작용으로 병렬이다. 필기: what is normal은 정의하는 내용인 명사절이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[guiding / guided]</span></div>"}]},{"group":"문장 2","items":[{"id":"g12-2","title":"병렬 동사원형","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>As a simple example, there is a norm in Anglo society to say Thank you to strangers who have just done something to help, such as open a door for you, point out that you’ve just dropped something, or <mark>give</mark> you directions.</div><div class=\"def-box\">필기: open, point out, give가 to help의 구체적 도움 행동으로 병렬 연결된다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[give / giving]</span></div>"}]},{"group":"문장 3","items":[{"id":"g12-3","title":"force + O + to V","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>There is no law that forces you <mark>to say</mark> Thank you.</div><div class=\"def-box\">필기: forces가 동사, you가 목적어, to say가 목적격 보어이다. 규범은 법적 강제가 없어도 작동한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to say / saying]</span></div>"}]},{"group":"문장 4","items":[{"id":"g12-4","title":"복수 주어 people의 부정","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>But if people <mark>don’t say</mark> Thank you in these cases it is marked.</div><div class=\"def-box\">people은 복수 주어이므로 don’t say이다. 필기: marked는 눈에 띄다, 부적절하게 여겨지다의 뜻이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[don’t say / doesn’t say]</span></div>"}]},{"group":"문장 5","items":[{"id":"g12-5","title":"완전한 내용절을 이끄는 that","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>People expect <mark>that</mark> you will say it.</div><div class=\"def-box\">expect의 목적어절에서 you will say it은 완전하므로 that을 쓴다. it은 Thank you를 가리킨다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[that / what]</span></div>"}]},{"group":"문장 6","items":[{"id":"g12-6","title":"become 뒤 형용사 보어","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>You become <mark>responsible</mark>.</div><div class=\"def-box\">상태를 나타내는 responsible이 보어이다. 규범적 기대에 따를 책임을 말한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[responsible / responsibly]</span></div>"}]},{"group":"문장 7","items":[{"id":"g12-7","title":"동명사구 주어","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span><mark>Failing</mark> to say it will be both surprising and worthy of criticism.</div><div class=\"def-box\">필기: Failing to say it 전체가 주어이다. both A and B가 두 형용사 보어를 병렬 연결한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[Failing / Fail]</span></div>"}]},{"group":"문장 8","items":[{"id":"g12-8","title":"부정 동명사구 주어","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>Not knowing the norms of another community <mark>is</mark> the central problem of cross-cultural communication.</div><div class=\"def-box\">필기에서 주제로 표시했다. Not knowing ... 전체는 하나의 주어라 단수 is이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is / are]</span></div>"}]},{"group":"문장 9","items":[{"id":"g12-9","title":"be동사 뒤 형용사 보어","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>To continue the Thank you example, even though another culture may have an expression that appears translatable (many don’t), there may be different norms for its usage, for example, such that you should say Thank you only when the cost someone has caused is <mark>considerable</mark>.</div><div class=\"def-box\">필기: cost가 주어이고 someone has caused는 수식절이다. is 뒤에는 상당한 상태를 나타내는 considerable이 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[considerable / considerably]</span></div>"}]},{"group":"문장 10","items":[{"id":"g12-10","title":"hold + O + 형용사 보어","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>In such a case it would sound ridiculous (i.e., unexpected, surprising, and worthy of criticism) if you were to thank someone for something so minor as holding a door <mark>open</mark> for you.</div><div class=\"def-box\">필기: hold a door open에서 door가 목적어, open이 목적격 보어이다. were to thank는 가정 상황을 제시한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[open / openly]</span></div>"}]}],"originalNumber":48,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>규범이 정상과 사회생활의 해석을 규정함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>Anglo 사회에서 사소한 도움에도 감사하기를 기대함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>다른 공동체의 규범을 모르는 것이 문화 간 소통의 문제임</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>감사할 때의 규범이 달라 사소한 감사가 우스울 수도 있음</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>규범을 모르면 생기는 문화 간 오해</b><p>문화마다 행동을 평가하는 규범이 달라 번역 가능한 감사 표현을 알아도 언제 사용해야 하는지 모르면 오해가 생길 수 있다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 8","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">Not knowing the norms of another community is the central problem of cross-cultural communication.</div><p>다른 공동체의 규범을 모르는 것은 문화 간 의사소통의 핵심 문제이다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>Anglo 사회의 감사 규범</td><td>간단한 예로 Anglo 사회에는 방금 도움을 준 낯선 이에게 감사하다고 말하는 규범이 있다 문을 열어 주거나, 방금 물건을 떨어뜨렸다고 알려 주거나, 길을 안내해 준 사람에게.</td></tr><tr><td>7</td><td>규범 위반은 비판의 대상임</td><td>그 말을 하지 못하는 것은 놀라우면서 비판받을 만한 일이 될 것이다.</td></tr><tr><td>9</td><td>같은 표현도 사용 규범은 다름</td><td>감사의 예를 이어 가면, 다른 문화에 번역 가능한 듯한 표현이 있더라도, 없는 문화도 많지만 그 사용 규범은 다를 수 있다. 예를 들어 누군가 치른 대가가 상당할 때만 감사해야 할 수도 있다.</td></tr><tr><td>10</td><td>사소한 감사가 오히려 우스울 수도 있음</td><td>그런 경우에는 우스꽝스럽게, 곧 예상 밖이고 놀라우며 비판받을 만하게 들릴 것이다 여러분을 위해 문을 잡아 주는 것처럼 사소한 일로 누군가에게 감사한다면.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-48","lesson":16,"type":"장문의 이해","title":"광고 속 통계를 믿어도 될까","source":"2019년 6월 41~42번","page":100,"summary":"광고가 인용하는 수치만 믿기보다 조사 문항, 표본, 객관적 측정 여부를 확인하고 소비자가 스스로 판단해야 한다.","footnote":"","sents":[{"title":"문장 1 · 복수 주어의 수 일치","en":"Many advertisements <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"인용하다\"><span class=\"an-word\">cite</span></span> statistical surveys.","tr":"많은 광고는 통계 조사를 인용한다.","sv":[["S","Many advertisements","주어"],["V","cite","동사"],["O","statistical surveys","목적어"]],"chunks":[["Many advertisements","많은 광고는",[]],["cite statistical surveys.","통계 조사를 인용한다.",[["복수 주어의 수 일치","g13-1"]]]],"mnote":"복수 주어의 수 일치: 필기: cite는 인용하다이며 복수 advertisements에 맞춰 cite를 쓴다.","isSummary":false},{"title":"문장 2 · 간접의문문의 어순","en":"But we should be cautious <b class=\"sl\">/</b> because we usually do not know how these surveys <span class=\"an ul\" data-n=\"간접의문문의 어순\"><span class=\"an-word\">are conducted</span></span>.","tr":"하지만 우리는 신중해야 한다 보통 이런 조사가 어떻게 실시되는지 모르기 때문이다.","sv":[["S","we","주어"],["V","should be","동사"],["C","cautious","보어"],["M","because we do not know how these surveys are conducted","수식어"]],"chunks":[["But we should be cautious","하지만 우리는 신중해야 한다",[]],["because we usually do not know how these surveys are conducted.","보통 이런 조사가 어떻게 실시되는지 모르기 때문이다.",[["간접의문문의 어순","g13-2"]]]],"mnote":"간접의문문의 어순: 필기: how 뒤에는 these surveys가 주어, are conducted가 동사인 평서문 어순이 온다.","isSummary":false},{"title":"문장 3 · 비율 표현의 수 일치","en":"For example, a toothpaste manufacturer once had a poster that said, <b class=\"sl\">/</b> “More than 80% of dentists <span class=\"an ul\" data-n=\"비율 표현의 수 일치\"><span class=\"an-word\">recommend</span></span> Smiley Toothpaste.”","tr":"예를 들어 한 치약 제조업체는 이런 포스터를 게시한 적이 있다 80%보다 많은 치과의사가 Smiley 치약을 추천한다는.","sv":[["S","a toothpaste manufacturer / More than 80% of dentists","주어"],["V","had / recommend","동사"],["O","a poster / Smiley Toothpaste","목적어"],["X","that said ...","절·구조"]],"chunks":[["For example, a toothpaste manufacturer once had a poster that said,","예를 들어 한 치약 제조업체는 이런 포스터를 게시한 적이 있다",[]],["“More than 80% of dentists recommend Smiley Toothpaste.”","80%보다 많은 치과의사가 Smiley 치약을 추천한다는.",[["비율 표현의 수 일치","g13-3"]]]],"mnote":"비율 표현의 수 일치: 80% of dentists는 복수 치과의사들을 가리키므로 recommend이다.","isSummary":false},{"title":"문장 4 · prefer A to B","en":"This seems to say <b class=\"sl\">/</b> that most dentists <span class=\"an ul\" data-n=\"prefer A to B\"><span class=\"an-word\">prefer</span></span> Smiley Toothpaste <span class=\"an ul\" data-n=\"prefer A to B\"><span class=\"an-word\">to other brands</span></span>.","tr":"이는 말하는 것처럼 보인다 대부분의 치과의사가 다른 브랜드보다 Smiley 치약을 선호한다고.","sv":[["S","This / most dentists","주어"],["V","seems / prefer","동사"],["O","to say that ... / Smiley Toothpaste","목적어"],["M","to other brands","수식어"]],"chunks":[["This seems to say","이는 말하는 것처럼 보인다",[]],["that most dentists prefer Smiley Toothpaste to other brands.","대부분의 치과의사가 다른 브랜드보다 Smiley 치약을 선호한다고.",[["prefer A to B","g13-4"]]]],"mnote":"prefer A to B: 필기: prefer A to B는 B보다 A를 선호하다이다. 아직 실제 조사 결론이 아닌 광고가 주는 인상을 설명한다.","isSummary":false},{"title":"문장 5 · allow + O + to V","en":"But it turns out that the survey questions allowed the dentists <span class=\"an ul\" data-n=\"allow + O + to V\"><span class=\"an-word\">to recommend</span></span> more than one brand, <b class=\"sl\">/</b> and in fact another competitor’s brand was recommended just as often as Smiley Toothpaste!","tr":"하지만 조사 문항은 치과의사가 한 가지 이상 브랜드를 추천하도록 허용한 것으로 드러났다 실제로 경쟁 업체의 다른 브랜드도 Smiley 치약만큼 자주 추천되었다.","sv":[["S","it / the survey questions / another competitor’s brand","주어"],["V","turns out / allowed / was recommended","동사"],["O","the dentists","목적어"],["X","to recommend more than one brand","절·구조"]],"chunks":[["But it turns out that the survey questions allowed the dentists to recommend more than one brand,","하지만 조사 문항은 치과의사가 한 가지 이상 브랜드를 추천하도록 허용한 것으로 드러났다",[["allow + O + to V","g13-5"]]],["and in fact another competitor’s brand was recommended just as often as Smiley Toothpaste!","실제로 경쟁 업체의 다른 브랜드도 Smiley 치약만큼 자주 추천되었다.",[]]],"mnote":"allow + O + to V: 필기: allowed가 동사, the dentists가 목적어, to recommend가 목적격 보어이다. 중복 추천이 가능해 선호라는 해석이 성립하지 않는다.","isSummary":false},{"title":"문장 6 · 게시되는 대상의 수동태","en":"No wonder the UK Advertising Standards Authority <span class=\"an\" data-n=\"판결을 내렸다\"><span class=\"an-word\">ruled</span></span> in 2007 <b class=\"sl\">/</b> that the poster was misleading and it could no longer <span class=\"an ul\" data-n=\"게시되는 대상의 수동태\"><span class=\"an-word\">be displayed</span></span>.","tr":"영국 광고 기준 기구가 2007년에 판결을 내린 것은 당연하다 그 포스터가 오해를 유발하여 더 이상 게시할 수 없다고.","sv":[["X","No wonder (it is no wonder 생략)","절·구조"],["S","the UK Advertising Standards Authority","주어"],["V","ruled","동사"],["O","that the poster was misleading and ...","목적어"]],"chunks":[["No wonder the UK Advertising Standards Authority ruled in 2007","영국 광고 기준 기구가 2007년에 판결을 내린 것은 당연하다",[]],["that the poster was misleading and it could no longer be displayed.","그 포스터가 오해를 유발하여 더 이상 게시할 수 없다고.",[["게시되는 대상의 수동태","g13-6"]]]],"mnote":"게시되는 대상의 수동태: 포스터는 게시되는 대상이므로 could be displayed이다. 필기: rule은 판결을 내리다이다.","isSummary":false},{"title":"문장 7 · 회사를 수식하는 현재분사","en":"A similar case concerns a well-known cosmetics firm <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"회사를 수식하는 현재분사\"><span class=\"an-word\">marketing</span></span> a cream that is supposed to rapidly reduce <span class=\"an\" data-n=\"주름\"><span class=\"an-word\">wrinkles</span></span>.","tr":"유사한 사례는 유명 화장품 회사와 관련된다 주름을 빠르게 줄인다는 크림을 판매하는.","sv":[["S","A similar case","주어"],["V","concerns","동사"],["O","a well-known cosmetics firm marketing a cream ...","목적어"]],"chunks":[["A similar case concerns a well-known cosmetics firm","유사한 사례는 유명 화장품 회사와 관련된다",[]],["marketing a cream that is supposed to rapidly reduce wrinkles.","주름을 빠르게 줄인다는 크림을 판매하는.",[["회사를 수식하는 현재분사","g13-7"]]]],"mnote":"회사를 수식하는 현재분사: 회사가 크림을 판매하는 주체라 marketing이다. that절은 cream을 수식한다.","isSummary":false},{"title":"문장 8 · 근거를 수식하는 과거분사","en":"But the only evidence <span class=\"an ul\" data-n=\"근거를 수식하는 과거분사\"><span class=\"an-word\">provided</span></span> is <b class=\"sl\">/</b> that “76% of 50 women agreed.”","tr":"하지만 제공된 유일한 근거는 여성 50명 중 76%가 동의했다는 것이다.","sv":[["S","the only evidence provided","주어"],["V","is","동사"],["C","that 76% of 50 women agreed","보어"]],"chunks":[["But the only evidence provided is","하지만 제공된 유일한 근거는",[["근거를 수식하는 과거분사","g13-8"]]],["that “76% of 50 women agreed.”","여성 50명 중 76%가 동의했다는 것이다.",[]]],"mnote":"근거를 수식하는 과거분사: 근거는 제공된 대상이므로 provided이다. 뒤의 that절은 보어이다.","isSummary":false},{"title":"문장 9 · 주어인 what 명사절","en":"But <span class=\"an ul\" data-n=\"주어인 what 명사절\"><span class=\"an-word\">what</span></span> this means is <b class=\"sl\">/</b> that the evidence is based on just the personal opinions from a small sample <span class=\"an\" data-n=\"without\"><span class=\"an-word\">with no</span></span> objective measurement of their skin’s condition.","tr":"그러나 이것이 뜻하는 바는 피부 상태에 대한 객관적 측정 없이 작은 표본의 개인적 의견에만 근거한다는 것이다.","sv":[["S","what this means","주어"],["V","is","동사"],["C","that the evidence is based on ...","보어"],["M","with no objective measurement ...","수식어"]],"chunks":[["But what this means is","그러나 이것이 뜻하는 바는",[["주어인 what 명사절","g13-9"]]],["that the evidence is based on just the personal opinions from a small sample with no objective measurement of their skin’s condition.","피부 상태에 대한 객관적 측정 없이 작은 표본의 개인적 의견에만 근거한다는 것이다.",[]]],"mnote":"주어인 what 명사절: 필기: what this means가 주어이고 that절이 보어이다. with no는 without의 의미로 객관적 측정이 없었음을 나타낸다.","isSummary":false},{"title":"문장 10 · 간접의문문 평서문 어순","en":"Furthermore, we are not told <b class=\"sl\">/</b> how <span class=\"an ul\" data-n=\"간접의문문 평서문 어순\"><span class=\"an-word\">these women were selected</span></span>.","tr":"더구나 우리는 듣지 못했다 이 여성들이 어떻게 선정되었는지를.","sv":[["S","we","주어"],["V","are not told","동사"],["O","how these women were selected","목적어"]],"chunks":[["Furthermore, we are not told","더구나 우리는 듣지 못했다",[]],["how these women were selected.","이 여성들이 어떻게 선정되었는지를.",[["간접의문문 평서문 어순","g13-10"]]]],"mnote":"간접의문문 평서문 어순: 필기: how절에서 these women이 주어, were selected가 동사이다. 표본 선정 방식이 알려지지 않았다.","isSummary":false},{"title":"문장 11 · evidence를 수식하는 수동 분사","en":"Without such information, <b class=\"sl\">/</b> the “evidence” <span class=\"an ul\" data-n=\"evidence를 수식하는 수동 분사\"><span class=\"an-word\">provided</span></span> is pretty much useless.","tr":"그런 정보가 없으면 제공된 근거는 거의 쓸모가 없다.","sv":[["M","Without such information","수식어"],["S","the evidence provided","주어"],["V","is","동사"],["C","pretty much useless","보어"]],"chunks":[["Without such information,","그런 정보가 없으면",[]],["the “evidence” provided is pretty much useless.","제공된 근거는 거의 쓸모가 없다.",[["evidence를 수식하는 수동 분사","g13-11"]]]],"mnote":"evidence를 수식하는 수동 분사: 필기: provided는 앞의 근거를 수식한다. such information은 표본 선정과 조사 방식 정보를 받는다.","isSummary":false},{"title":"문장 12 · avoid 뒤 동명사","en":"Unfortunately, such advertisements are quite <span class=\"an\" data-n=\"전형적 ↔ atypical\"><span class=\"an-word\">typical</span></span>, <b class=\"sl\">/</b> and as consumers we just have to use our own judgment and avoid <span class=\"an ul\" data-n=\"avoid 뒤 동명사\"><span class=\"an-word\">taking</span></span> advertising claims too seriously.","tr":"안타깝게도 그런 광고는 매우 전형적이다 소비자인 우리는 자신의 판단을 사용하고 광고 주장을 지나치게 진지하게 받아들이지 말아야 한다.","sv":[["S","such advertisements / we","주어"],["V","are / have to use and avoid","동사"],["C","quite typical","보어"],["O","our own judgment / taking advertising claims too seriously","목적어"]],"chunks":[["Unfortunately, such advertisements are quite typical,","안타깝게도 그런 광고는 매우 전형적이다",[]],["and as consumers we just have to use our own judgment and avoid taking advertising claims too seriously.","소비자인 우리는 자신의 판단을 사용하고 광고 주장을 지나치게 진지하게 받아들이지 말아야 한다.",[["avoid 뒤 동명사","g13-12"]]]],"mnote":"avoid 뒤 동명사: 필기: avoid는 동명사를 목적어로 취한다. use와 avoid는 have to를 공유하며 typical의 반의어는 atypical이다.","isSummary":false}],"grammar":[{"group":"문장 1","items":[{"id":"g13-1","title":"복수 주어의 수 일치","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Many advertisements <mark>cite</mark> statistical surveys.</div><div class=\"def-box\">필기: cite는 인용하다이며 복수 advertisements에 맞춰 cite를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[cite / cites]</span></div>"}]},{"group":"문장 2","items":[{"id":"g13-2","title":"간접의문문의 어순","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>But we should be cautious because we usually do not know how these surveys <mark>are conducted</mark>.</div><div class=\"def-box\">필기: how 뒤에는 these surveys가 주어, are conducted가 동사인 평서문 어순이 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are conducted / are these surveys conducted]</span></div>"}]},{"group":"문장 3","items":[{"id":"g13-3","title":"비율 표현의 수 일치","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>For example, a toothpaste manufacturer once had a poster that said, “More than 80% of dentists <mark>recommend</mark> Smiley Toothpaste.”</div><div class=\"def-box\">80% of dentists는 복수 치과의사들을 가리키므로 recommend이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[recommend / recommends]</span></div>"}]},{"group":"문장 4","items":[{"id":"g13-4","title":"prefer A to B","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>This seems to say that most dentists prefer Smiley Toothpaste <mark>to other brands</mark>.</div><div class=\"def-box\">필기: prefer A to B는 B보다 A를 선호하다이다. 아직 실제 조사 결론이 아닌 광고가 주는 인상을 설명한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to other brands / than other brands]</span></div>"}]},{"group":"문장 5","items":[{"id":"g13-5","title":"allow + O + to V","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>But it turns out that the survey questions allowed the dentists <mark>to recommend</mark> more than one brand, and in fact another competitor’s brand was recommended just as often as Smiley Toothpaste!</div><div class=\"def-box\">필기: allowed가 동사, the dentists가 목적어, to recommend가 목적격 보어이다. 중복 추천이 가능해 선호라는 해석이 성립하지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to recommend / recommending]</span></div>"}]},{"group":"문장 6","items":[{"id":"g13-6","title":"게시되는 대상의 수동태","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>No wonder the UK Advertising Standards Authority ruled in 2007 that the poster was misleading and it could no longer <mark>be displayed</mark>.</div><div class=\"def-box\">포스터는 게시되는 대상이므로 could be displayed이다. 필기: rule은 판결을 내리다이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[be displayed / display]</span></div>"}]},{"group":"문장 7","items":[{"id":"g13-7","title":"회사를 수식하는 현재분사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>A similar case concerns a well-known cosmetics firm <mark>marketing</mark> a cream that is supposed to rapidly reduce wrinkles.</div><div class=\"def-box\">회사가 크림을 판매하는 주체라 marketing이다. that절은 cream을 수식한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[marketing / marketed]</span></div>"}]},{"group":"문장 8","items":[{"id":"g13-8","title":"근거를 수식하는 과거분사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>But the only evidence <mark>provided</mark> is that “76% of 50 women agreed.”</div><div class=\"def-box\">근거는 제공된 대상이므로 provided이다. 뒤의 that절은 보어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[provided / providing]</span></div>"}]},{"group":"문장 9","items":[{"id":"g13-9","title":"주어인 what 명사절","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>But <mark>what</mark> this means is that the evidence is based on just the personal opinions from a small sample with no objective measurement of their skin’s condition.</div><div class=\"def-box\">필기: what this means가 주어이고 that절이 보어이다. with no는 without의 의미로 객관적 측정이 없었음을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 10","items":[{"id":"g13-10","title":"간접의문문 평서문 어순","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>Furthermore, we are not told how <mark>these women were selected</mark>.</div><div class=\"def-box\">필기: how절에서 these women이 주어, were selected가 동사이다. 표본 선정 방식이 알려지지 않았다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[these women were selected / were these women selected]</span></div>"}]},{"group":"문장 11","items":[{"id":"g13-11","title":"evidence를 수식하는 수동 분사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>Without such information, the “evidence” <mark>provided</mark> is pretty much useless.</div><div class=\"def-box\">필기: provided는 앞의 근거를 수식한다. such information은 표본 선정과 조사 방식 정보를 받는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[provided / providing]</span></div>"}]},{"group":"문장 12","items":[{"id":"g13-12","title":"avoid 뒤 동명사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 12</span>Unfortunately, such advertisements are quite typical, and as consumers we just have to use our own judgment and avoid <mark>taking</mark> advertising claims too seriously.</div><div class=\"def-box\">필기: avoid는 동명사를 목적어로 취한다. use와 avoid는 have to를 공유하며 typical의 반의어는 atypical이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[taking / to take]</span></div>"}]}],"originalNumber":49,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>통계 조사 방식이 알려지지 않은 광고에 주의하자고 함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>치약 추천 조사는 여러 브랜드를 중복 추천할 수 있었음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>화장품 근거는 작은 표본의 주관적 의견일 뿐임</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>조사 정보가 부족하므로 광고 주장을 비판적으로 판단함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>광고 속 통계를 믿어도 될까</b><p>광고가 인용하는 수치만 믿기보다 조사 문항, 표본, 객관적 측정 여부를 확인하고 소비자가 스스로 판단해야 한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 2","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">But we should be cautious because we usually do not know how these surveys are conducted.</div><p>하지만 우리는 신중해야 한다 보통 이런 조사가 어떻게 실시되는지 모르기 때문이다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>5</td><td>중복 추천이 가능한 문항</td><td>하지만 조사 문항은 치과의사가 한 가지 이상 브랜드를 추천하도록 허용한 것으로 드러났다 실제로 경쟁 업체의 다른 브랜드도 Smiley 치약만큼 자주 추천되었다.</td></tr><tr><td>9</td><td>작은 표본·개인 의견·측정 부재</td><td>그러나 이것이 뜻하는 바는 피부 상태에 대한 객관적 측정 없이 작은 표본의 개인적 의견에만 근거한다는 것이다.</td></tr><tr><td>10</td><td>선정 과정도 알려지지 않음</td><td>더구나 우리는 듣지 못했다 이 여성들이 어떻게 선정되었는지를.</td></tr><tr><td>12</td><td>광고를 스스로 비판적으로 판단함</td><td>안타깝게도 그런 광고는 매우 전형적이다 소비자인 우리는 자신의 판단을 사용하고 광고 주장을 지나치게 진지하게 받아들이지 말아야 한다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-49","lesson":16,"type":"장문의 이해","title":"사교 두려움 극복이 더 어려운 이유","source":"2021년 6월 41~42번","page":101,"summary":"사교적 두려움에도 점진적 노출은 유용하지만 사람의 반응과 상황을 통제하기 어려워 단계를 적용하는 과정은 더 복잡하다.","footnote":"","sents":[{"title":"문장 1 · 가정법 과거의 호응","en":"If you were afraid of standing on balconies, <b class=\"sl\">/</b> you <span class=\"an ul\" data-n=\"가정법 과거의 호응\"><span class=\"an-word\">would</span></span> start on some lower floors and slowly work your way up to higher ones.","tr":"발코니에 서 있는 것을 두려워한다면 낮은 층에서 시작해 천천히 더 높은 층으로 올라갈 것이다.","sv":[["M","If you were afraid of standing on balconies","수식어"],["S","you","주어"],["V","would start / work","동사"],["M","on some lower floors / up to higher ones","수식어"]],"chunks":[["If you were afraid of standing on balconies,","발코니에 서 있는 것을 두려워한다면",[]],["you would start on some lower floors and slowly work your way up to higher ones.","낮은 층에서 시작해 천천히 더 높은 층으로 올라갈 것이다.",[["가정법 과거의 호응","g14-1"]]]],"mnote":"가정법 과거의 호응: were로 가정한 상황에 주절 would + 동사원형이 호응한다. ones는 floors를 대신한다.","isSummary":false},{"title":"문장 2 · way의 수동 관계","en":"It would be easy to face a fear of standing on high balconies <b class=\"sl\">/</b> in a way that’s totally <span class=\"an ul\" data-n=\"way의 수동 관계\"><span class=\"an-word\">controlled</span></span>.","tr":"높은 발코니에 서는 두려움에 직면하기는 쉬울 것이다 완전히 통제된 방식으로.","sv":[["S","It (가주어)","주어"],["V","would be","동사"],["C","easy","보어"],["X","to face a fear ... (진주어)","절·구조"],["M","in a way that’s totally controlled","수식어"]],"chunks":[["It would be easy to face a fear of standing on high balconies","높은 발코니에 서는 두려움에 직면하기는 쉬울 것이다",[]],["in a way that’s totally controlled.","완전히 통제된 방식으로.",[["way의 수동 관계","g14-2"]]]],"mnote":"way의 수동 관계: 방식이 통제되는 대상이므로 controlled이다. to face ...가 실제 주어이다.","isSummary":false},{"title":"문장 3 · 동명사 주어의 수 일치","en":"<span class=\"an st\" data-n=\"동명사 주어 · 전환\"><span class=\"an-word\">Socializing</span></span> <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"동명사 주어의 수 일치\"><span class=\"an-word\">is</span></span> trickier.","tr":"사람들과 사귀는 것은 더 까다롭다.","sv":[["S","Socializing","주어"],["V","is","동사"],["C","trickier","보어"]],"chunks":[["S :"g14-12","title":"동명사구 주어의 수 일치","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 12</span>This is not to say that facing your fears <mark>is pointless</mark> when socializing.</div><div class=\"def-box\">필기: facing your fears가 주어이고 when socializing은 when you are socializing에서 주어와 be동사가 생략된 것이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is pointless / are pointless]</span></div>"}]},{"group":"문장 13","items":[{"id":"g14-13","title":"주어의 핵 principles","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 13</span>The principles of gradual exposure <mark>are</mark> still very useful.</div><div class=\"def-box\">of gradual exposure를 제외한 핵심 주어 principles는 복수이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / is]</span></div>"}]},{"group":"문장 14","items":[{"id":"g14-14","title":"of 뒤 동명사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 14</span>The process of <mark>applying</mark> them is just messier, and knowing that before you start is helpful.</div><div class=\"def-box\">필기: applying은 적용하는 것이고 that은 적용 과정이 복잡하다는 사실을 받는 대명사이다. 두 번째 knowing구도 단수 주어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[applying / apply]</span></div>"}]}],"originalNumber":50,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>발코니 공포는 통제된 단계로 노출할 수 있음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>사람의 반응은 예측하기 어렵고 자신감에도 영향을 줌</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>원하는 사교 상황과 단계의 난도를 통제하기 어려움</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>점진적 노출의 원칙은 유용하되 적용의 복잡함을 알아야 함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>사교 두려움 극복이 더 어려운 이유</b><p>사교적 두려움에도 점진적 노출은 유용하지만 사람의 반응과 상황을 통제하기 어려워 단계를 적용하는 과정은 더 복잡하다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 14","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">The process of applying them is just messier, and knowing that before you start is helpful.</div><p>그 원칙을 적용하는 과정이 더 복잡할 뿐이며 시작 전에 그것을 아는 것이 도움이 된다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>발코니 공포는 통제된 단계가 가능함</td><td>높은 발코니에 서는 두려움에 직면하기는 쉬울 것이다 완전히 통제된 방식으로.</td></tr><tr><td>5</td><td>사람의 반응은 예측하기 어려움</td><td>여러분은 그들과 상호 작용해야 하며 그들의 반응은 예측 불가능할 수 있다.</td></tr><tr><td>9</td><td>사교 상황을 원하는 대로 만들 수 없음</td><td>여러분이 자신을 노출해야 할 사교 상황은 원할 때 마련되지 않을 수 있다 또는 상황이 통제된다고 느낄 만큼 잘 진행되지 않을 수 있다.</td></tr><tr><td>13</td><td>점진적 노출 자체는 여전히 유용함</td><td>점진적 노출의 원칙은 여전히 매우 유용하다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-50","lesson":16,"type":"장문의 이해","title":"불평은 회사를 위한 기회","source":"2021년 9월 41~42번","page":102,"summary":"고객의 불평은 고객 이탈보다 처리 비용이 적고 개선의 기회를 제공하므로 회사는 불만을 쉽게 제기할 수 있도록 해야 한다.","footnote":"","sents":[{"title":"문장 1 · 긴 주어의 핵 way","en":"The market’s way of telling a <span class=\"an\" data-n=\"회사\"><span class=\"an-word\">firm</span></span> about its failures <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"긴 주어의 핵 way\"><span class=\"an-word\">is</span></span> harsh and brief.","tr":"기업의 실패를 알려 주는 시장의 방식은 가혹하고 간단하다.","sv":[["S","T at if people just moistened the stamps properly, they would stick to any piece of paper.</div><div class=\"def-box\">made it clear에서 it은 가목적어이고 뒤 that절이 실제 내용이다. if절 안의 they는 stamps를 가리킨다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[it / that]</span></div>"}]},{"group":"문장 13","items":[{"id":"g15-13","title":"의문사 + to부정사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 13</span>What <mark>to do</mark>?</div><div class=\"def-box\">what to do는 무엇을 해야 할지라는 뜻으로 문제 해결 방향을 묻는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to do / doing]</span></div>"}]},{"group":"문장 14","items":[{"id":"g15-14","title":"educate + O + to V","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 14</span>Management didn’t take long to come to the conclusion that it would be more costly to try to educate its customers <mark>to wet</mark> each stamp rather than to add more glue.</div><div class=\"def-box\">필기: educate its customers to wet은 고객에게 적시도록 교육하는 구조이다. costly와 rather than을 통해 두 해결책의 비용을 비교한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to wet / wetting]</span></div>"}]},{"group":"문장 15","items":[{"id":"g15-15","title":"occur의 자동사 용법","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 15</span>The stamp producer was told to add more glue and the problem didn’t <mark>occur</mark> again.</div><div class=\"def-box\">필기: occur는 발생하다라는 자동사로 수동태를 쓰지 않는다. was told to add는 지시받은 수동태이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[occur / be occurred]</span></div>"}]},{"group":"문장 16","items":[{"id":"g15-16","title":"have + O + 동사원형","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 16</span>Since it is better for the firm to have buyers <mark>complain</mark> rather than go elsewhere, it is important to make it easier for dissatisfied customers to complain.</div><div class=\"def-box\">have buyers complain에서 원형 complain을 쓴다. 뒤의 for dissatisfied customers는 to complain의 의미상 주어이다. 필기: 다른 브랜드 구매보다 불평이 회사에 유리하다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[complain / to complain]</span></div>"}]}],"originalNumber":51,"pageEnd":103,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>시장의 실패 통보보다 불평은 저렴하고 개선을 돕는다고 함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>끈적이는 선크림의 불평을 신제품 기회로 활용함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>잘 붙지 않는 우표는 고객 교육 대신 풀을 늘려 해결함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>불만 고객이 떠나기보다 쉽게 불평하게 만드는 것이 중요함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>불평은 회사를 위한 기회</b><p>고객의 불평은 고객 이탈보다 처리 비용이 적고 개선의 기회를 제공하므로 회사는 불만을 쉽게 제기할 수 있도록 해야 한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 16","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">Since it is better for the firm to have buyers complain rather than go elsewhere, it is important to make it easier for dissatisfied customers to complain.</div><p>회사에는 구매자가 다른 곳으로 가기보다 불평하는 것이 더 낫기 때문에 불만족한 고객이 더 쉽게 불평하게 만드는 것이 중요하다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>불평의 비용·개선 이점</td><td>불평은 처리 비용이 더 적을 뿐 아니라 판매자가 개선하도록 만들 수도 있다.</td></tr><tr><td>7</td><td>불평을 신제품 기회로 활용함</td><td>그 회사는 끈적거리지 않는 제품을 개발하는 데 성공했고 첫해에 시장의 20퍼센트를 차지했다.</td></tr><tr><td>14</td><td>고객 교육과 제품 개선의 비용 비교</td><td>경영진은 고객에게 우표를 적시도록 교육하려는 것이 비용이 더 들 것이라는 결론에 금방 도달했다 풀을 더 넣는 것보다.</td></tr><tr><td>16</td><td>이탈보다 불평이 낫다는 결론</td><td>회사에는 구매자가 다른 곳으로 가기보다 불평하는 것이 더 낫기 때문에 불만족한 고객이 더 쉽게 불평하게 만드는 것이 중요하다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-51","lesson":16,"type":"장문의 이해","title":"대중 고등 교육이 맞은 평가의 모순","source":"2024년 9월 41~42번","page":104,"summary":"고등 교육 확대는 평생학습과 발전을 위한 피드백을 늘려야 하지만 현실의 대중 체제는 효율적 시험과 표준화된 피드백으로 성적에 집중하게 만든다.","footnote":"","sents":[{"title":"문장 1 · 단수 주어 education","en":"Higher education <span class=\"an ul\" data-n=\"단수 주어 education\"><span class=\"an-word\">has</span></span> grown from an elite to a <span class=\"an\" data-n=\"대중 체제\"><span class=\"an-word\">mass system</span></span> <b class=\"sl\">/</b> across the world.","tr":"고등 교육은 엘리트 체제에서 대중 체제로 성장해 왔다 전 세계에 걸쳐.","sv":[["S","Higher education","주어"],["V","has grown","동사"],["M","from an elite to a mass system / across the world","수식어"]],"chunks":[["Higher education has grown from an elite to a mass system","고등 교육은 엘리트 체제에서 대중 체제로 성장해 왔다",[["단수 주어 education","g16-1"]]],["across the world.","전 세계에 걸쳐.",[]]],"mnote":"단수 주어 education: education은 불가산 단수 취급이다. 필기: from A to B가 체제의 변화를 나타낸다.","isSummary":false},{"title":"문장 2 · occur의 자동사 용법","en":"In Europe and the USA, increased rates of participation <span class=\"an ul\" data-n=\"occur의 자동사 용법\"><span class=\"an-word\">occurred</span></span> <b class=\"sl\">/</b> in the decades after the Second World War.","tr":"유럽과 미국에서는 참여율 증가가 나타났다 제2차 세계 대전 이후 수십 년 동안.","sv":[["M","In Europe and the USA","수식어"],["S","increased rates of participation","주어"],["V","occurred","동사"],["M","in the decades after the Second World War","수식어"]],"chunks":[["In Europe and the USA, increased rates of partici uires efficient approaches to assessment, such as examinations and multiple-choice quizzes, with minimalist, impersonal, or standardised feedback, often causing students <mark>to focus</mark> more on grades than feedback.</div><div class=\"def-box\">학생들이 집중하게 하는 구조이므로 to focus이다. 필기: efficient는 다수 학생을 평가하려는 효율성을 뜻한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to focus / focusing]</span></div>"}]},{"group":"문장 9","items":[{"id":"g16-9","title":"with + O + 현재분사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>In contrast, the relatively small numbers of students in elite systems in the past allowed for closer relationships between students and their teachers, with formative feedback <mark>shaping</mark> the minds, academic skills, and even the characters of students.</div><div class=\"def-box\">피드백이 사고·기술·성격을 형성하는 능동 관계이므로 shaping이다. In contrast가 대중 체제와 과거 체제의 차이를 명시한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[shaping / shaped]</span></div>"}]}],"originalNumber":52,"pageEnd":105,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>엘리트 고등 교육이 세계적으로 대중 체제로 확대됨</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>이론상 평생학습과 발달을 위한 평가가 강화되어야 함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>현실의 대중 교육은 효율적 시험과 표준 피드백을 요구함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>과거 소수 학생 체제의 긴밀한 관계·형성적 피드백과 대비함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>대중 고등 교육이 맞은 평가의 모순</b><p>고등 교육 확대는 평생학습과 발전을 위한 피드백을 늘려야 하지만 현실의 대중 체제는 효율적 시험과 표준화된 피드백으로 성적에 집중하게 만든다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 7","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">In reality, socio-political changes to expand higher education have set up a ‘field of contradictions’ for assessment in higher education.</div><p>현실에서는 고등 교육을 확대하려는 사회 정치적 변화가 고등 교육 평가에 모순의 장을 만들어 왔다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>4</td><td>교육 규모와 구성의 다양화</td><td>고등 교육의 극적인 확대는 특징지어졌다 더 다양한 고등 교육 기관과 더 다채로운 학생 인구 구성으로.</td></tr><tr><td>6</td><td>이론상 평생학습 중심 평가</td><td>이론적으로 고숙련 노동력을 기르기 위한 고등 교육 확대는 학생 선발과 통제에서 시험의 역할을 줄여야 한다 평생학습을 가능하게 하는 평가, 학습을 위한 평가, 발전을 위한 피드백 중심의 접근을 시작하면서.</td></tr><tr><td>8</td><td>효율적 평가가 성적 집중을 유도함</td><td>대중 고등 교육은 최소한의 비개인적이거나 표준화된 피드백을 갖춘 시험·선다형 퀴즈 같은 효율적 평가 방식을 요구한다 이는 종종 학생이 피드백보다 성적에 더 집중하게 한다.</td></tr><tr><td>9</td><td>과거 체제의 긴밀한 피드백과 대비</td><td>대조적으로 과거 엘리트 체제의 상대적으로 적은 학생 수는 학생과 교사 사이의 더 긴밀한 관계를 허용했다 형성적 피드백이 학생의 사고와 학업 기술, 심지어 성격까지 형성하면서.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-52","lesson":16,"type":"장문의 이해","title":"로컬푸드는 늘 친환경일까","source":"2023년 9월 41~42번","page":106,"summary":"식품의 탄소 배출은 이동 거리만으로 판단할 수 없다. 생산 에너지, 운송 방식, 특히 적재량을 함께 살펴야 한다.","footnote":"","sents":[{"title":"문장 1 · 긴 주어의 핵 Claims","en":"Claims that local food production cut greenhouse gas emissions by reducing the burning of transportation fuel <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"긴 주어의 핵 Claims\"><span class=\"an-word\">are</span></span> usually not well founded.","tr":"지역 식품 생산이 운송 연료의 연소를 줄여 온실가스 배출을 줄인다는 주장들은 보통 충분한 근거가 없다.","sv":[["S","Claims that local food production cut greenhouse gas emissions ...","주어"],["V","are not founded","동사"],["M","usually / well","수식어"]],"chunks":[["Claims that local food production cut greenhouse gas emissions by reducing the burning of transportation fuel","지역 식품 생산이 운송 연료의 연소를 줄여 온실가스 배출을 줄인다는 주장들은",[]],["are usually not well founded.","보통 충분한 근거가 없다.",[["긴 주어의 핵 Claims","g17-1"]]]],"mnote":"긴 주어의 핵 Claims: 필기: that절은 Claims의 내용이며 주절 주어는 복수 Claims이다. that절 안의 cut은 주절 동사가 아니며 주절 are는 Claims에 일치한다.","isSummary":false},{"title":"문장 2 · 동명사구 주어와 수 일치","en":"Transport is the source of only <span class=\"an ul\" data-n=\"운송 부문 비율\"><span class=\"an-word\">11 percent</span></span> of greenhouse gas emissions within the food sector, <b class=\"sl\">/</b> so reducing the distance that food travels after it leaves the farm <span class=\"an ul\" data-n=\"동명사구 주어와 수 일치\"><span class=\"an-word\">is far less important</span></span> than reducing wasteful energy use on the farm.","tr":"운송은 식품 부문 온실가스 배출의 11퍼센트만 차지한다 따라서 농장을 떠난 뒤의 이동 거리를 줄이는 것은 농장의 낭비 에너지를 줄이는 것보다 훨씬 덜 중요하다.","sv":[["S","Transport / reducing the distance ...","주어"],["V","is / is","동사"],["C","the source of only 11 percent ... / far less important than ...","보어"]],"chunks":[["Transport is the source of only 11 percent of greenhouse gas emissions within the food sector,","운송은 식품 부문 온실가스 배출의 11퍼센트만 차지한다",[]],["so reducing the distance that food travels after it leaves the farm is far less important than reducing wasteful energy use on the farm.","따라서 농장을 떠난 뒤의 이동 거리를 줄이는 것은 농장의 낭비 에너지를 줄이는 것보다 훨씬 덜 중요하다.",[["동명사구 주어와 수 일치","g17-2"]]]],"mnote":"동명사구 주어와 수 일치: 필기: reducing ... 전체가 단수 주어이다. far는 비교급 less important를 강조한다.","isSummary":false},{"title":"문장 3 · food를 수식하는 현재분사","en":"Food <span class=\"an ul\" data-n=\"Food 수식\"><span class=\"an-word\">coming</span></span> from a distance can actually be better for the climate, <b class=\"sl\">/</b> depending on how it was grown.","tr":"멀리서 오는 식품이 실제로는 기후에 더 좋을 수 있다 어떻게 재배되었느냐에 따라.","sv":[["S","Food coming from a distance","주어"],["V","can be","동사"],["C","better for the climate","보어"],["M","depending on how it was grown","수식어"]],"chunks":[["Food coming from a distance can actually be better for the climate,","멀리서 오는 식품이 실제로는 기후에 더 좋을 수 있다",[["food를 수식하는 현재분사","g17-3"]]],["depending on how it was grown.","어떻게 재배되었느냐에 따라.",[]]],"mnote":"food를 수식하는 현재분사: 필기: coming from a distance가 Food를 수식하고 can be가 주절 동사이다. 재배 방식에 따라 결론이 달라진다.","isSummary":false},{"title":"문장 4 · 토마토의 수동 분사 수식","en":"For example, field-grown tomatoes <span class=\"an ul\" data-n=\"토마토의 수동 분사 수식\"><span class=\"an-word\">shipped</span></span> from Mexico in the winter months <b class=\"sl\">/</b> will have a smaller carbon footprint than local winter tomatoes grown in a greenhouse.","tr":"예를 들어 겨울철 멕시코에서 운송된 노지 재배 토마토는 온실에서 자란 지역의 겨울 토마토보다 탄소 발자국이 작을 것이다.","sv":[["S","field-grown tomatoes shipped from Mexico ...","주어"],["V","will have","동사"],["O","a smaller carbon footprint","목적어"],["M","than local winter tomatoes grown in a greenhouse","수식어"]],"chunks":[["For example, field-grown tomatoes shipped from Mexico in the winter months","예를 들어 겨울철 멕시코에서 운송된 노지 재배 토마토는",[["토마토의 수동 분사 수식","g17-4"]]],["will have a smaller carbon footprint than local winter tomatoes grown in a greenhouse.","온실에서 자란 지역의 겨울 토마토보다 탄소 발자국이 작을 것이다.",[]]],"mnote":"토마토의 수동 분사 수식: 토마토는 운송되는 대상이므로 shipped이다. 비교 대상의 tomatoes도 재배되는 대상이라 grown이다.","isSummary":false},{"title":"문장 5 · 관계절을 제외한 주어 meat","en":"In the United Kingdom, lamb meat that travels 11,000 miles from New Zealand <span class=\"an ul\" data-n=\"관계절을 제외한 주어 meat\"><span class=\"an-word\">generates</span></span> only one-quarter the carbon emissions per pound compared to British lamb <b class=\"sl\">/</b> because farmers in the United Kingdom raise their animals on <span class=\"an\" data-n=\"사료\"><span class=\"an-word\">feed</span></span> which must be produced using fossil fuels rather than on clover pastureland.","tr":"영국에서는 뉴질랜드에서 1만 1천 마일을 오는 양고기가 영국산보다 파운드당 탄소를 4분의 1만 배출한다 영국 농부들이 클로버 목초지 대신 화석 연료로 생산해야 하는 사료로 동물을 기르기 때문이다.","sv":[["S","lamb meat that travels 11,000 miles ...","주어"],["V","generates","동사"],["O","only one-quarter the carbon emissions per pound","목적어"],["M","because farmers ... raise ...","수식어"]],"chunks":[["In the United Kingdom, lamb meat that travels 11,000 miles from New Zealand generates only one-quarter the carbon emissions per pound compared to British lamb","영국에서는 뉴질랜드에서 1만 1천 마일을 오는 양고기가 영국산보다 파운드당 탄소를 4분의 1만 배출한다",[["관계절을 제외한 주어 meat","g17-5"]]],["because farmers in the United Kingdom raise their animals on feed which must be produced using fossil fuels rather than on clover pastureland.","영국 농부들이 클로버 목초지 대신 화석 연료로 생산해야 하는 사료로 동물을 기르기 때문이다.",[]]],"mnote":"관계절을 제외한 주어 meat: 주어 핵은 불가산 단수 meat이므로 generates이다. 필기: feed는 사료이며 because는 배출 차이의 원인을 제시한다.","isSummary":false},{"title":"문장 6 · 주어인 what 명사절","en":"When food does travel, <span class=\"an ul\" data-n=\"주어인 what 명사절\"><span class=\"an-word\">what</span></span> matters most is not the distance traveled <b class=\"sl\">/</b> but the travel mode (surface versus air), and most of all the <span class=\"an ul st\" data-n=\"적재량이 핵심\"><span class=\"an-word\">load size</span></span>.","tr":"식품이 이동할 때 가장 중요한 것은 이동 거리가 아니라 운송 방식, 즉 지상 대 항공이며 무엇보다 적재량이다.","sv":[["M","When food does travel","수식어"],["S","what matters most","주어"],["V","is","동사"],["C","not the distance traveled but the travel mode and the load size","보어"]],"chunks":[["When food does travel, what matters most is not the distance traveled","식품이 이동할 때 가장 중요한 것은 이동 거리가 아니라",[["주어인 what 명사절","g17-6"]]],["but the travel mode (surface versus air), and most of all the load size.","운송 방식, 즉 지상 대 항공이며 무엇보다 적재량이다.",[]]],"mnote":"주어인 what 명사절: 필기: not A but B로 거리와 방식·적재량을 대비한다. what matters most는 가장 중요한 것이라는 주어절이다.","isSummary":false},{"title":"문장 7 · 비교 대상 foods의 능동 수식","en":"<span class=\"an\" data-n=\"대량의 적재량\"><span class=\"an-word\">Bulk loads</span></span> of food can travel halfway around the world by ocean freight with a <span class=\"an ci st\" data-n=\"탄소 발자국이 더 작음\"><span class=\"an-word\">smaller</span></span> carbon footprint, per pound delivered, <b class=\"sl\">/</b> than foods <span class=\"an ul\" data-n=\"비교 대상 foods의 능동 수식\"><span class=\"an-word\">traveling</span></span> just a short distance but in much smaller loads.","tr":"대량 적재된 식품은 해상 화물로 지구 반 바퀴를 이동해도 배송 파운드당 탄소 발자국이 더 작을 수 있다 훨씬 적게 적재되어 짧은 거리만 이동하는 식품보다.","sv":[["S","Bulk loads of food","주어"],["V","can travel","동사"],["M","halfway around the world / by ocean freight / with a smaller carbon footprint","수식어"],["X","than foods traveling ...","절·구조"]],"chunks":[["Bulk loads of food can travel halfway around the world by ocean freight with a smaller carbon footprint, per pound delivered,","대량 적재된 식품은 해상 화물로 지구 반 바퀴를 이동해도 배송 파운드당 탄소 발자국이 더 작을 수 있다",[]],["than foods traveling just a short distance but in much smaller loads.","훨씬 적게 적재되어 짧은 거리만 이동하는 식품보다.",[["비교 대상 foods의 능동 수식","g17-7"]]]],"mnote":"비교 대상 foods의 능동 수식: 식품이 이동하는 능동 관계라 traveling이다. 필기: bulk loads는 대량 적재, freight는 화물 운송이다.","isSummary":false},{"title":"문장 8 · while 뒤 생략된 능동 진행 구조","en":"For example, 18-wheelers carry much larger loads than pickup trucks <b class=\"sl\">/</b> so they can move food 100 times as far while <span class=\"an ul\" data-n=\"while 뒤 생략된 능동 진행 구조\"><span class=\"an-word\">burning</span></span> only one-third as much gas per pound of food delivered.","tr":"예를 들어 18륜 대형 트럭은 픽업트럭보다 훨씬 더 많이 적재하므로 배송 식품 파운드당 연료를 3분의 1만 태우면서 식품을 100배 멀리 운송할 수 있다.","sv":[["S","18-wheelers / they","주어"],["V","carry / can move","동사"],["O","much larger loads / food","목적어"],["M","100 times as far / while burning ...","수식어"]],"chunks":[["For example, 18-wheelers carry much larger loads than pickup trucks","예를 들어 18륜 대형 트럭은 픽업트럭보다 훨씬 더 많이 적재하므로",[]],["so they can move food 100 times as far while burning only one-third as much gas per pound of food delivered.","배송 식품 파운드당 연료를 3분의 1만 태우면서 식품을 100배 멀리 운송할 수 있다.",[["while 뒤 생략된 능동 진행 구조","g17-8"]]]],"mnote":"while 뒤 생략된 능동 진행 구조: 트럭이 연료를 태우는 능동 관계이며 while they are burning에서 주어와 be동사가 생략되었다. 배수는 times as far로 표현한다.","isSummary":false}],"grammar":[{"group":"문장 1","items":[{"id":"g17-1","title":"긴 주어의 핵 Claims","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Claims that local food production cut greenhouse gas emissions by reducing the burning of transportation fuel <mark>are</mark> usually not well founded.</div><div class=\"def-box\">필기: that절은 Claims의 내용이며 주절 주어는 복수 Claims이다. that절 안의 cut은 주절 동사가 아니며 주절 are는 Claims에 일치한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / is]</span></div>"}]},{"group":"문장 2","items":[{"id":"g17-2","title":"동명사구 주어와 수 일치","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>Transport is the source of only 11 percent of greenhouse gas emissions within the food sector, so reducing the distance that food travels after it leaves the farm <mark>is far less important</mark> than reducing wasteful energy use on the farm.</div><div class=\"def-box\">필기: reducing ... 전체가 단수 주어이다. far는 비교급 less important를 강조한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is far less important / are far less important]</span></div>"}]},{"group":"문장 3","items":[{"id":"g17-3","title":"food를 수식하는 현재분사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>Food <mark>coming</mark> from a distance can actually be better for the climate, depending on how it was grown.</div><div class=\"def-box\">필기: coming from a distance가 Food를 수식하고 can be가 주절 동사이다. 재배 방식에 따라 결론이 달라진다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[coming / come]</span></div>"}]},{"group":"문장 4","items":[{"id":"g17-4","title":"토마토의 수동 분사 수식","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>For example, field-grown tomatoes <mark>shipped</mark> from Mexico in the winter months will have a smaller carbon footprint than local winter tomatoes grown in a greenhouse.</div><div class=\"def-box\">토마토는 운송되는 대상이므로 shipped이다. 비교 대상의 tomatoes도 재배되는 대상이라 grown이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[shipped / shipping]</span></div>"}]},{"group":"문장 5","items":[{"id":"g17-5","title":"관계절을 제외한 주어 meat","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>In the United Kingdom, lamb meat that travels 11,000 miles from New Zealand <mark>generates</mark> only one-quarter the carbon emissions per pound compared to British lamb because farmers in the United Kingdom raise their animals on feed which must be produced using fossil fuels rather than on clover pastureland.</div><div class=\"def-box\">주어 핵은 불가산 단수 meat이므로 generates이다. 필기: feed는 사료이며 because는 배출 차이의 원인을 제시한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[generates / generate]</span></div>"}]},{"group":"문장 6","items":[{"id":"g17-6","title":"주어인 what 명사절","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>When food does travel, <mark>what</mark> matters most is not the distance traveled but the travel mode (surface versus air), and most of all the load size.</div><div class=\"def-box\">필기: not A but B로 거리와 방식·적재량을 대비한다. what matters most는 가장 중요한 것이라는 주어절이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 7","items":[{"id":"g17-7","title":"비교 대상 foods의 능동 수식","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Bulk loads of food can travel halfway around the world by ocean freight with a smaller carbon footprint, per pound delivered, than foods <mark>traveling</mark> just a short distance but in much smaller loads.</div><div class=\"def-box\">식품이 이동하는 능동 관계라 traveling이다. 필기: bulk loads는 대량 적재, freight는 화물 운송이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[traveling / traveled]</span></div>"}]},{"group":"문장 8","items":[{"id":"g17-8","title":"while 뒤 생략된 능동 진행 구조","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>For example, 18-wheelers carry much larger loads than pickup trucks so they can move food 100 times as far while <mark>burning</mark> only one-third as much gas per pound of food delivered.</div><div class=\"def-box\">트럭이 연료를 태우는 능동 관계이며 while they are burning에서 주어와 be동사가 생략되었다. 배수는 times as far로 표현한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[burning / burned]</span></div>"}]}],"originalNumber":53,"pageEnd":107,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>로컬푸드가 운송 연료를 줄여 친환경이라는 주장에 의문을 제기함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>운송보다 농장 에너지 사용과 재배 방식이 중요함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>먼 곳의 노지 토마토·목초 사육 양고기가 더 적게 배출할 수 있음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>운송에서는 거리보다 방식과 적재량이 중요함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>로컬푸드는 늘 친환경일까</b><p>식품의 탄소 배출은 이동 거리만으로 판단할 수 없다. 생산 에너지, 운송 방식, 특히 적재량을 함께 살펴야 한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 6","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">When food does travel, what matters most is not the distance traveled but the travel mode (surface versus air), and most of all the load size.</div><p>식품이 이동할 때 가장 중요한 것은 이동 거리가 아니라 운송 방식, 즉 지상 대 항공이며 무엇보다 적재량이다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>운송보다 농장 에너지 절감이 중요함</td><td>운송은 식품 부문 온실가스 배출의 11퍼센트만 차지한다 따라서 농장을 떠난 뒤의 이동 거리를 줄이는 것은 농장의 낭비 에너지를 줄이는 것보다 훨씬 덜 중요하다.</td></tr><tr><td>4</td><td>노지 수입 토마토의 비교 사례</td><td>예를 들어 겨울철 멕시코에서 운송된 노지 재배 토마토는 온실에서 자란 지역의 겨울 토마토보다 탄소 발자국이 작을 것이다.</td></tr><tr><td>5</td><td>사육 방식이 양고기 배출량을 바꿈</td><td>영국에서는 뉴질랜드에서 1만 1천 마일을 오는 양고기가 영국산보다 파운드당 탄소를 4분의 1만 배출한다 영국 농부들이 클로버 목초지 대신 화석 연료로 생산해야 하는 사료로 동물을 기르기 때문이다.</td></tr><tr><td>8</td><td>대량 운송은 단위 중량당 연료를 줄임</td><td>예를 들어 18륜 대형 트럭은 픽업트럭보다 훨씬 더 많이 적재하므로 배송 식품 파운드당 연료를 3분의 1만 태우면서 식품을 100배 멀리 운송할 수 있다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-53","lesson":16,"type":"장문의 이해","title":"관계 속에서 드러나는 인간 본성","source":"2023년 11월 41~42번","page":108,"summary":"공의 경로가 여러 힘의 공동 작용을 나타내듯 인간 본성도 개인을 고립해서 보면 온전히 드러나지 않고 다른 사람과의 관계 속에서 나타난다.","footnote":"","sents":[{"title":"문장 1 · 공을 수식하는 수동 분사","en":"A ball <span class=\"an ul\" data-n=\"공을 수식하는 수동 분사\"><span class=\"an-word\">thrown</span></span> into the air is acted upon by the initial force given it, persisting as <span class=\"an\" data-n=\"관성\"><span class=\"an-word\">inertia</span></span> of movement and tending to carry it in the same straight line, <b class=\"sl\">/</b> and by the constant pull of gravity downward, as well as by the resistance of the air.","tr":"공중으로 던져진 공은 운동 관성으로 지속하며 같은 직선으로 나아가게 하는 초기 힘의 작용을 받는다 아래로 계속 당기는 중력과 공기 저항의 작용도 받는다.","sv":[["S","A ball thrown into the air","주어"],["V","is acted upon","동사"],["M","by the initial force given it / by the constant pull of gravity / by the resistance of the air","수식어"],["X","persisting ... and tending ...","절·구조"]],"chunks":[["A ball thrown into the air is acted upon by the initial force given it, persisting as inertia of movement and tending to carry it in the same straight line,","공중으로 던져진 공은 운동 관성으로 지속하며 같은 직선으로 나아가게 하는 초기 힘의 작용을 받는다",[["공을 수식하는 수동 분사","g18-1"]]],["and by the constant pull of gravity downward, as well as by the resistance of the air.","아래로 계속 당기는 중력과 공기 저항의 작용도 받는다.",[]]],"mnote":"공을 수식하는 수동 분사: 필기: 공은 던져진 대상이라 thrown이다. 세 by구가 공에 작용하는 세 힘을 병렬로 제시한다. inertia는 관성이다.","isSummary":false},{"title":"문장 2 · 단수 주어 It","en":"It <span class=\"an ul\" data-n=\"단수 주어 It\"><span class=\"an-word\">moves</span></span>, accordingly, <b class=\"sl\">/</b> in a curved path.","tr":"그에 따라 공은 움직인다 곡선 경로로.","sv":[["S","It","주어"],["V","moves","동사"],["M","accordingly / in a curved path","수식어"]],"chunks":[["It moves, accordingly,","그에 따라 공은 움직인다",[["단수 주어 It","g18-2"]]],["in a curved path.","곡선 경로로.",[]]],"mnote":"단수 주어 It: 공을 받는 It이 단수이므로 moves이다.","isSummary":false},{"title":"문장 3 · 힘을 수식하는 수동 분사","en":"Now the path does not represent the working of any particular force; there is simply the combination of the three elementary forces <span class=\"an ul\" data-n=\"힘을 수식하는 수동 분사\"><span class=\"an-word\">mentioned</span></span>; <b class=\"sl\">/</b> but in a real sense, there is something in the total action <span class=\"an\" data-n=\"그 외에\"><span class=\"an-word\">besides</span></span> the isolated action of three forces, <span class=\"an\" data-n=\"즉\"><span class=\"an-word\">namely</span></span>, their <span class=\"an ci st\" data-n=\"공동의\"><span class=\"an-word\">joint</span></span> action.","tr":"그 경로는 어떤 한 힘의 작용을 나타내는 것이 아니라 언급한 세 기본 힘의 결합이다 하지만 실제로 전체 작용에는 세 힘 각각의 고립된 작용을 넘는 것, 즉 공동 작용이 있다.","sv":[["S","the path","주어"],["V","does not represent","동사"],["O","the working of any particular force","목적어"],["X","there is ... / namely their joint action","절·구조"]],"chunks":[["Now the path does not represent the working of any particular force; there is simply the combination of the three elementary forces mentioned;","그 경로는 어떤 한 힘의 작용을 나타내는 것이 아니라 언급한 세 기본 힘의 결합이다",[["힘을 수식하는 수동 분사","g18-3"]]],["but in a real sense, there is something in the total action besides the isolated action of three forces, namely, their joint action.","하지만 실제로 전체 작용에는 세 힘 각각의 고립된 작용을 넘는 것, 즉 공동 작용이 있다.",[]]],"mnote":"힘을 수식하는 수동 분사: 언급된 세 힘이므로 mentioned이다. 필기: besides는 그 외에, namely는 즉, joint는 공동의라는 뜻이다.","isSummary":false},{"title":"문장 4 · 관계가 드러나는 수동태","en":"In the same way, when two or more human individuals are together, <b class=\"sl\">/</b> their mutual relationships and their arrangement into a group are things which <span class=\"an ul\" data-n=\"관계가 드러나는 수동태\"><span class=\"an-word\">would not be revealed</span></span> if we <span class=\"an\" data-n=\"국한시키다\"><span class=\"an-word\">confined</span></span> our attention to each individual separately.","tr":"같은 방식으로 두 명 이상의 사람이 함께 있을 때 그들의 상호 관계와 집단 배치는 각 개인에게 따로 주의를 한정했다면 드러나지 않을 것들이다.","sv":[["M","In the same way / when two or more human individuals are together","수식어"],["S","their mutual relationships and their arrangement into a group","주어"],["V","are","동사"],["C","things which would not be revealed if ...","보어"]],"chunks":[["In the same way, when two or more human individuals are together,","같은 방식으로 두 명 이상의 사람이 함께 있을 때",[]],["their mutual relationships and their arrangement into a group are things which would not be revealed if we confined our attention to each individual separately.","그들의 상호 관계와 집단 배치는 각 개인에게 따로 주의를 한정했다면 드러나지 않을 것들이다.",[["관계가 드러나는 수동태","g18-4"]]]],"mnote":"관계가 드러나는 수동태: 관계와 집단 배치는 드러나는 대상이라 be revealed이다. 필기: confined는 국한시키다이다. 공의 비유를 인간 집단에 적용한다.","isSummary":false},{"title":"문장 5 · 타인이 자극으로 작용하는 능동 관계","en":"The significance of group behavior is greatly increased in the case of human beings <b class=\"sl\">/</b> by the fact that some of the tendencies to action of the individual are related definitely to other persons, and could not be aroused except by other persons <span class=\"an ul\" data-n=\"타인이 자극으로 작용하는 능동 관계\"><span class=\"an-word\">acting</span></span> as stimuli.","tr":"인간에게 집단 행동의 중요성이 크게 커지는 이유는 개인의 어떤 행동 성향이 다른 사람과 명백히 관련되고 자극으로 작용하는 타인 없이는 유발될 수 없다는 사실 때문이다.","sv":[["S","The significance of group behavior","주어"],["V","is increased","동사"],["M","by the fact that ...","수식어"],["S","some of the tendencies to action ...","주어"],["V","are related / could not be aroused","동사"]],"chunks":[["The significance of group behavior is greatly increased in the case of human beings","인간에게 집단 행동의 중요성이 크게 커지는 이유는",[]],["by the fact that some of the tendencies to action of the individual are related definitely to other persons, and could not be aroused except by other persons acting as stimuli.","개인의 어떤 행동 성향이 다른 사람과 명백히 관련되고 자극으로 작용하는 타인 없이는 유발될 수 없다는 사실 때문이다.",[["타인이 자극으로 작용하는 능동 관계","g18-5"]]]],"mnote":"타인이 자극으로 작용하는 능동 관계: other persons가 자극 역할을 하는 능동 관계라 acting이다. that절은 fact의 구체적 내용을 설명한다.","isSummary":false},{"title":"문장 6 · 조동사 뒤 동사원형","en":"An individual in complete isolation would not <span class=\"an ul\" data-n=\"조동사 뒤 동사원형\"><span class=\"an-word\">reveal</span></span> their competitive tendencies, <b class=\"sl\">/</b> their tendencies towards the opposite sex, their protective tendencies towards children.","tr":"완전히 고립된 개인은 경쟁 성향을 드러내지 않을 것이다 이성에 대한 성향이나 아이들을 보호하려는 성향도.","sv":[["S","An individual in complete isolation","주어"],["V","would not reveal","동사"],["O","their competitive tendencies / their tendencies towards the opposite sex / their protective tendencies towards children","목적어"]],"chunks":[["An individual in complete isolation would not reveal their competitive tendencies,","완전히 고립된 개인은 경쟁 성향을 드러내지 않을 것이다",[["조동사 뒤 동사원형","g18-6"]]],["their tendencies towards the opposite sex, their protective tendencies towards children.","이성에 대한 성향이나 아이들을 보호하려는 성향도.",[]]],"mnote":"조동사 뒤 동사원형: would 뒤에는 원형 reveal이다. 세 성향은 모두 관계 속에서 드러나는 특성의 예시이다.","isSummary":false},{"title":"문장 7 · 관계 속에 놓이는 수동태","en":"This shows that the traits of human nature do not fully appear <b class=\"sl\">/</b> <span class=\"an st\" data-n=\"관계에 놓여야 비로소\"><span class=\"an-word\">until</span></span> the individual <span class=\"an ul\" data-n=\"관계 속에 놓이는 수동태\"><span class=\"an-word\">is brought</span></span> into relationships with other individuals.","tr":"이는 인간 본성의 특성이 온전히 나타나지 않음을 보여 준다 개인이 다른 개인들과의 관계에 놓일 때까지는.","sv":[["S","This / the traits of human nature","주어"],["V","shows / do not appear","동사"],["O","that ...","목적어"],["M","until the individual is brought into relationships ...","수식어"]],"chunks":[["This shows that the traits of human nature do not fully appear","이는 인간 본성의 특성이 온전히 나타나지 않음을 보여 준다",[]],["until the individual is brought into relationships with other individuals.","개인이 다른 개인들과의 관계에 놓일 때까지는.",[["관계 속에 놓이는 수동태","g18-7"]]]],"mnote":"관계 속에 놓이는 수동태: 필기에서 주제로 표시한 문장이다. not ... until ...은 관계 속에 놓여야 비로소 본성이 온전히 나타난다는 뜻이다.","isSummary":false}],"grammar":[{"group":"문장 1","items":[{"id":"g18-1","title":"공을 수식하는 수동 분사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>A ball <mark>thrown</mark> into the air is acted upon by the initial force given it, persisting as inertia of movement and tending to carry it in the same straight line, and by the constant pull of gravity downward, as well as by the resistance of the air.</div><div class=\"def-box\">필기: 공은 던져진 대상이라 thrown이다. 세 by구가 공에 작용하는 세 힘을 병렬로 제시한다. inertia는 관성이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[thrown / throwing]</span></div>"}]},{"group":"문장 2","items":[{"id":"g18-2","title":"단수 주어 It","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>It <mark>moves</mark>, accordingly, in a curved path.</div><div class=\"def-box\">공을 받는 It이 단수이므로 moves이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[moves / move]</span></div>"}]},{"group":"문장 3","items":[{"id":"g18-3","title":"힘을 수식하는 수동 분사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>Now the path does not represent the working of any particular force; there is simply the combination of the three elementary forces <mark>mentioned</mark>; but in a real sense, there is something in the total action besides the isolated action of three forces, namely, their joint action.</div><div class=\"def-box\">언급된 세 힘이므로 mentioned이다. 필기: besides는 그 외에, namely는 즉, joint는 공동의라는 뜻이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[mentioned / mentioning]</span></div>"}]},{"group":"문장 4","items":[{"id":"g18-4","title":"관계가 드러나는 수동태","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>In the same way, when two or more human individuals are together, their mutual relationships and their arrangement into a group are things which <mark>would not be revealed</mark> if we confined our attention to each individual separately.</div><div class=\"def-box\">관계와 집단 배치는 드러나는 대상이라 be revealed이다. 필기: confined는 국한시키다이다. 공의 비유를 인간 집단에 적용한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[would not be revealed / would not reveal]</span></div>"}]},{"group":"문장 5","items":[{"id":"g18-5","title":"타인이 자극으로 작용하는 능동 관계","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>The significance of group behavior is greatly increased in the case of human beings by the fact that some of the tendencies to action of the individual are related definitely to other persons, and could not be aroused except by other persons <mark>acting</mark> as stimuli.</div><div class=\"def-box\">other persons가 자극 역할을 하는 능동 관계라 acting이다. that절은 fact의 구체적 내용을 설명한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[acting / acted]</span></div>"}]},{"group":"문장 6","items":[{"id":"g18-6","title":"조동사 뒤 동사원형","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>An individual in complete isolation would not <mark>reveal</mark> their competitive  근거</th></tr></thead><tbody><tr><td>3</td><td>개별 힘을 넘는 공동 작용</td><td>그 경로는 어떤 한 힘의 작용을 나타내는 것이 아니라 언급한 세 기본 힘의 결합이다 하지만 실제로 전체 작용에는 세 힘 각각의 고립된 작용을 넘는 것, 즉 공동 작용이 있다.</td></tr><tr><td>4</td><td>개인만 보면 관계를 볼 수 없음</td><td>같은 방식으로 두 명 이상의 사람이 함께 있을 때 그들의 상호 관계와 집단 배치는 각 개인에게 따로 주의를 한정했다면 드러나지 않을 것들이다.</td></tr><tr><td>5</td><td>타인의 자극이 행동 성향을 유발함</td><td>인간에게 집단 행동의 중요성이 크게 커지는 이유는 개인의 어떤 행동 성향이 다른 사람과 명백히 관련되고 자극으로 작용하는 타인 없이는 유발될 수 없다는 사실 때문이다.</td></tr><tr><td>6</td><td>고립 상태에서 드러나지 않는 성향</td><td>완전히 고립된 개인은 경쟁 성향을 드러내지 않을 것이다 이성에 대한 성향이나 아이들을 보호하려는 성향도.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-54","lesson":16,"type":"장문의 이해","title":"과식은 몸에 새겨진 생존 습관","source":"2019년 9월 41~42번","page":110,"summary":"과식과 고열량 선호는 식량 부족 환경에서 생존을 도운 타고난 기제지만 풍요로운 새 환경에서는 그 습관을 바꾸어야 한다.","footnote":"","sents":[{"title":"문장 1 · 풍요를 수식하는 수동 관계절","en":"A quick look at history shows that humans have not always had the abundance of food <b class=\"sl\">/</b> that <span class=\"an ul\" data-n=\"풍요를 수식하는 수동 관계절\"><span class=\"an-word\">is enjoyed</span></span> throughout most of the developed world today.","tr":"역사를 빠르게 살펴보면 인간이 항상 음식의 풍요를 가졌던 것은 아님을 알 수 있다 오늘날 대부분의 선진 세계에서 누리는 것과 같은.","sv":[["S","A quick look at history","주어"],["V","shows","동사"],["O","that humans have not always had the abundance of food","목적어"],["X","that is enjoyed ...","절·구조"]],"chunks":[["A quick look at history shows that humans have not always had the abundance of 4","title":"전치사 from 뒤 동명사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>Overeating in those times was essential to ensure survival, and humans received satisfaction from <mark>eating</mark> more than was needed for immediate purposes.</div><div class=\"def-box\">from 뒤에는 eating이 온다. 필기: essential은 과거 부족 환경에서 과식이 필수적이었다는 뜻이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[eating / eat]</span></div>"}]},{"group":"문장 5","items":[{"id":"g19-5","title":"결과를 덧붙이는 분사구문","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>On top of that, the highest pleasure was derived from eating the most calorie-dense foods, <mark>resulting</mark> in a longer lasting energy reserve.</div><div class=\"def-box\">앞의 고열량 음식 섭취가 에너지 비축을 가져오는 결과를 현재분사 resulting으로 연결한다. 필기: reserve는 비축이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[resulting / resulted]</span></div>"}]},{"group":"문장 6","items":[{"id":"g19-6","title":"명사를 뒤에서 수식하는 형용사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>Even though there are parts of the world where, unfortunately, food is still scarce, most of the world’s population today has plenty of food <mark>available</mark> to survive and thrive.</div><div class=\"def-box\">필기: food available은 이용 가능한 음식이라는 후치 수식이다. Even though는 일부 지역과 전체 경향의 양보 관계이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[available / availably]</span></div>"}]},{"group":"문장 7","items":[{"id":"g19-7","title":"몸이 보상하는 능동 분사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>However, this abundance is new, and your body has not caught up, still naturally <mark>rewarding</mark> you for eating more than you need and for eating the most calorie-dense foods.</div><div class=\"def-box\">필기: However가 현재 환경과 몸의 반응 간 불일치를 드러낸다. 몸이 보상을 주는 주체이므로 rewarding이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[rewarding / rewarded]</span></div>"}]},{"group":"문장 8","items":[{"id":"g19-8","title":"명사를 수식하는 형용사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>These are <mark>innate</mark> habits and not simple addictions.</div><div class=\"def-box\">habits를 수식하는 형용사 innate이다. 선천적 습관과 단순 중독을 구별한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[innate / innately]</span></div>"}]},{"group":"문장 9","items":[{"id":"g19-9","title":"기제를 수식하는 수동 분사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>They are self-preserving mechanisms <mark>initiated</mark> by your body, ensuring your future survival, but they are irrelevant now.</div><div class=\"def-box\">기제는 몸에 의해 시작된 대상이라 initiated이다. 필기: self-preserving은 자기 보존의, irrelevant는 현재 환경과 관련 없는이라는 뜻이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[initiated / initiating]</span></div>"}]},{"group":"문장 10","items":[{"id":"g19-10","title":"need를 수식하는 to부정사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>Therefore, it is your responsibility to communicate with your body regarding the new environment of food abundance and the need <mark>to change</mark> the inborn habit of overeating.</div><div class=\"def-box\">the need to change는 바꿀 필요이다. 필기: regarding은 관하여라는 전치사이고 두 대상을 and로 연결한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to change / changing]</span></div>"}]}],"originalNumber":55,"pageEnd":111,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>역사적으로 식량이 부족하고 다음 식사가 불확실했음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>많이 먹고 고열량을 선호하는 보상이 생존과 에너지 비축을 도왔음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>오늘날 식량은 풍부해도 몸은 아직 과식에 보상함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>새 환경을 인식하고 오래된 과식 습관을 바꿀 책임이 있음</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>과식은 몸에 새겨진 생존 습관</b><p>과식과 고열량 선호는 식량 부족 환경에서 생존을 도운 타고난 기제지만 풍요로운 새 환경에서는 그 습관을 바꾸어야 한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 7","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">However, this abundance is new, and your body has not caught up, still naturally rewarding you for eating more than you need and for eating the most calorie-dense foods.</div><p>하지만 이런 풍요는 새로운 것이며 몸은 아직 따라잡지 못했다 필요한 것보다 많이 먹고 칼로리가 가장 높은 음식을 먹는 데 여전히 자연스럽게 보상하면서.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>3</td><td>불확실한 다음 식사가 과식을 유도함</td><td>그 결과 음식이 있을 때 사람들은 더 많이 먹곤 했다 다음 식사의 가능성이 불확실했기 때문이다.</td></tr><tr><td>5</td><td>고열량 섭취의 비축 이점</td><td>게다가 가장 큰 기쁨은 칼로리가 가장 높은 음식을 먹는 데서 얻어졌다 더 오래 지속되는 에너지 비축을 만들어 내면서.</td></tr><tr><td>7</td><td>새로운 풍요와 몸의 반응이 어긋남</td><td>하지만 이런 풍요는 새로운 것이며 몸은 아직 따라잡지 못했다 필요한 것보다 많이 먹고 칼로리가 가장 높은 음식을 먹는 데 여전히 자연스럽게 보상하면서.</td></tr><tr><td>10</td><td>새 환경에 맞추어 습관을 바꿀 책임</td><td>그러므로 음식이 풍부한 새로운 환경에 관해 몸과 소통하는 것은 여러분의 책임이다 그리고 타고난 과식 습관을 바꿀 필요에 관해서도.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-55","lesson":16,"type":"장문의 이해","title":"사물에도 의도를 부여하는 이유","source":"2024년 10월 41~42번","page":112,"summary":"인간이 모호한 사물이나 사건에 의도를 가정하는 의인화 편향은 포식자의 행동을 빠르게 판단해 생존하도록 돕던 기제에서 나왔다.","footnote":"","sents":[{"title":"문장 1 · 능동 분사구문","en":"From an early age, we assign purpose to objects and events, <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"능동 분사구문\"><span class=\"an-word\">preferring</span></span> this reasoning <span class=\"an\" data-n=\"prefer A to B\"><span class=\"an-word\">to random chance</span></span>.","tr":"어릴 때부터 우리는 사물과 사건에 목적을 부여한다 무작위 우연보다 이런 추론을 선호하면서.","sv":[["S","we","주어"],["V","assign","동사"],["O","purpose","목적어"],["M","to objects and events","수식어"],["X","preferring this reasoning to random chance","절·구조"]],"chunks":[["From an early age, we assign purpose to objects and events,","어릴 때부터 우리는 사물과 사건에 목적을 부여한다",[]],["preferring this reasoning to random chance.","무작위 우연보다 이런 추론을 선호하면서.",[["능동 분사구문","g20-1"]]]],"mnote":"능동 분사구문: 필기: prefer A to B는 B보다 A를 선호하다이다. 우리가 선호하는 능동 관계라 preferring이다.","isSummary":false},{"title":"문장 2 · want + O + to V","en":"Children assume, for instance, that pointy rocks are that way <b class=\"sl\">/</b> because they don’t want you <span class=\"an ul\" data-n=\"want + O + to V\"><span class=\"an-word\">to sit</span></span> on them.","tr":"예를 들어 아이들은 뾰족한 돌이 그렇게 생겼다고 가정한다 여러분이 자기 위에 앉는 것을 원하지 않기 때문에.","sv":[["S","Children","주어"],["V","assume","동사"],["O","that pointy rocks are that way","목적어"],["M","because they don’t want you to sit on them","수식어"]],"chunks":[["Children assume, for instance, that pointy rocks are that way","예를 들어 아이들은 뾰족한 돌이 그렇게 생겼다고 가정한다",[]],["because they don’t want you to sit on them.","여러분이 자기 위에 앉는 것을 원하지 않기 때문에.",[["want + O + to V","g20-2"]]]],"mnote":"want + O + to V: want you to sit은 너희가 앉기를 원한다는 구조이다. 돌에 욕구가 있는 것처럼 해석하는 의인화의 예시이다.","isSummary":false},{"title":"문장 3 · 간접의문문의 어순","en":"When we encounter something, <b class=\"sl\">/</b> we first need to determine what sort of thing <span class=\"an ul\" data-n=\"간접의문문의 어순\"><span class=\"an-word\">it is</span></span>.","tr":"무언가를 마주치면 우리는 먼저 그것이 어떤 종류인지
