=\"src-tag\">문장 3</span>You know that smell that <mark>hangs</mark> in the air after you’ve mowed the lawn?</div><div class=\"def-box\">관계절의 that은 단수 선행사 smell을 받으므로 hangs를 쓴다. 첫 that은 smell을 가리키는 지시한정사이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[hangs / hang]</span></div>"}]},{"group":"문장 4","items":[{"id":"g7-4","title":"발음에 따른 부정관사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>Yeah, that’s actually <mark>an</mark> SOS.</div><div class=\"def-box\">SOS는 첫 소리를 /es/로 읽어 모음 소리로 시작하므로 an을 쓴다. 철자의 모양이 아니라 발음으로 결정한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[an / a]</span></div>"}]},{"group":"문장 5","items":[{"id":"g7-5","title":"복수 주어와 동사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>Some plants <mark>use</mark> sound.</div><div class=\"def-box\">plants는 복수 주어이므로 use를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[use / uses]</span></div>"}]},{"group":"문장 6","items":[{"id":"g7-6","title":"선행사 있는 목적격 관계대명사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>Yes, sound, though at a frequency <mark>that</mark> we can’t hear.</div><div class=\"def-box\">frequency라는 선행사가 있고 hear의 목적어 자리가 비어 있으므로 that을 쓴다. 선행사를 포함하는 what으로 바꾸지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[that / what]</span></div>"}]},{"group":"문장 7","items":[{"id":"g7-7","title":"여부를 나타내는 간접의문문","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Researchers experimented with plants and microphones to see <mark>if</mark> they could record any trouble calls.</div><div class=\"def-box\">see if ...는 ‘~인지 알아보다’라는 뜻이다. 녹음 가능 여부를 확인하는 것이므로 여부를 나타내는 if가 필요하다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[if / that]</span></div>"}]},{"group":"문장 8","items":[{"id":"g7-8","title":"부사절의 주어·be 생략","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>They found that plants produce a high-frequency clicking noise when <mark>stressed</mark> and can make different sounds for different stressors.</div><div class=\"def-box\">when stressed는 when they are stressed에서 주어와 be동사를 생략한 형태이다. 식물은 스트레스를 받는 대상이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[stressed / stressing]</span></div>"}]},{"group":"문장 9","items":[{"id":"g7-9","title":"긴 주어의 핵심 명사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>The sound a plant makes when it’s not getting watered <mark>differs</mark> from the one it’ll make when a leaf is cut.</div><div class=\"def-box\">주어의 핵심은 단수 The sound이다. 뒤의 a plant makes ...는 수식절이므로 주절 동사는 differs이다. one은 sound를 대신한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[differs / differ]</span></div>"}]},{"group":"문장 10","items":[{"id":"g7-10","title":"be worth + 동명사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>However, it’s worth <mark>noting</mark> that experts don’t think plants are crying out in pain.</div><div class=\"def-box\">worth 뒤에는 동명사 noting이 온다. don’t think는 뒤 내용에 대한 부정을 앞의 think로 옮겨 표현한 구조이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[noting / to note]</span></div>"}]},{"group":"문장 11","items":[{"id":"g7-11","title":"that절 내부의 수 일치","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>It’s more likely that these reactions <mark>are</mark> knee-jerk survival actions.</div><div class=\"def-box\">that절의 주어 these reactions는 복수이므로 are를 쓴다. 문장 맨 앞 가주어 It에 이 동사를 맞추지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / is]</span></div>"}]},{"group":"문장 12","items":[{"id":"g7-12","title":"to부정사의 보어 용법","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 12</span>Plants are living organisms, and their main objective is <mark>to survive</mark>.</div><div class=\"def-box\">their main objective 뒤에서 목표의 내용을 설명하는 보어로 to survive를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to survive / survive]</span></div>"}]},{"group":"문장 13","items":[{"id":"g7-13","title":"전치사 for 뒤 동명사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 13</span>Scents and sounds are their tools for <mark>defending</mark> against things that might harm them.</div><div class=\"def-box\">tools for defending에서 전치사 for 뒤에는 동명사 defending이 온다. that은 things를 수식하는 주격 관계대명사이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[defending / defend]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 주제</b>식물은 냄새와 소리로 의사소통한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 냄새</b>잔디를 깎은 뒤의 냄새는 일종의 SOS 신호이다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 실험</b>스트레스 요인에 따라 서로 다른 고주파 소리가 나타난다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 해석</b>의식적인 고통의 울음보다 자동적인 생존 반응으로 이해한다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>식물은 냄새와 소리로 말한다</b><p>식물의 냄새와 고주파 소리는 고통을 의식적으로 호소하는 울음이라기보다 해로운 것에 대응하는 자동적인 생존 수단이다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">It’s more likely that these reactions are <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">knee-jerk survival actions</b></div><p>식물의 반응을 인간의 의식적인 고통 표현과 동일시하지 않고, 살아남기 위한 자동 반응으로 해석한다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>우리와 다른 방식의 소통</td><td>우리가 하는 방식과 같지는 않을지라도 식물은 의사소통을 할 수 있다.</td></tr><tr><td>2</td><td>냄새로 표현되는 불만</td><td>몇몇은 냄새를 통해 자신들의 불만을 표현한다.</td></tr><tr><td>3</td><td>깎은 잔디의 냄새</td><td>여러분은 잔디를 깎고 난 후 공기 중에 감도는 그 냄새를 알고 있는가?</td></tr><tr><td>4</td><td>익숙한 냄새가 SOS</td><td>그렇다, 그것은 사실 일종의 SOS 신호다.</td></tr><tr><td>5</td><td>두 번째 수단은 소리</td><td>어떤 식물은 소리를 사용한다.</td></tr><tr><td>6</td><td>사람에게 들리지 않는 주파수</td><td>그렇다, 비록 우리가 들을 수 없는 주파수에 있지만 소리다.</td></tr><tr><td>7</td><td>마이크로 식물의 소리 녹음</td><td>연구자는 식물이 곤경에 처했음을 알리는 소리를 녹음할 수 있는지 알아보기 위해 식물과 마이크를 사용해 실험했다.</td></tr><tr><td>8</td><td>스트레스별로 달라지는 소리</td><td>그들은 식물이 스트레스를 받을 때 고주파수의 딸깍거리는 소리를 내며 스트레스 요인에 따라 다른 소리를 낼 수 있다는 사실을 알아냈다.</td></tr><tr><td>9</td><td>물 부족과 잎 절단의 대비</td><td>식물이 물을 공급받지 못하고 있을 때 내는 소리와 잎이 잘릴 때 낼 소리가 다르다.</td></tr><tr><td>10</td><td>고통의 울음으로 해석하지 않기</td><td>하지만 전문가가 식물이 고통으로 울부짖고 있다고 보지는 않는다는 것에 주목할 가치가 있다.</td></tr><tr><td>11</td><td>자동적인 생존 행동</td><td>이러한 반응은 살아남기 위한 자동적인 행위일 가능성이 더 크다.</td></tr><tr><td>12</td><td>식물의 주된 목표</td><td>식물은 살아 있는 유기체이며 그들의 주요 목표는 살아남는 것이다.</td></tr><tr><td>13</td><td>해로운 것으로부터 지키는 도구</td><td>냄새와 소리는 자신에게 해를 끼칠 수도 있는 것에게서 지키기 위한 그들의 도구이다.</td></tr></tbody></table></div>"}]}},{"id":"11-08","lesson":11,"type":"빈칸 추론","title":"경험이 주의할 곳을 정한다","source":"2025년 6월 31번","page":55,"summary":"주의 집중과 과업 수행 능력은 지능의 단순한 차이보다 이전 경험과 환경에서 무엇을 학습했는지에 크게 좌우된다.","footnote":"* profoundly 심오하게 &nbsp; ** subtle 미묘한","sents":[{"title":"경험으로 주의를 예측","en":"In everyday life, <b class=\"sl\">/</b> we use previous experience to predict where <span class=\"an ul\" data-n=\"간접의문문 어순\"><span class=\"an-word\">we should</span></span> pay attention.","tr":"일상생활에서 우리는 어디에 집중해야 할지를 예측하기 위해 이전 경험을 사용한다.","sv":[["M","In everyday life","수식어"],["S","we","주어"],["V","use","동사"],["O","previous experience","목적어"],["M","to predict where we should pay attention","수식어"]],"chunks":[["In everyday life,","일상생활에서,",[]],["we use previous experience to predict where we should pay attention.","우리는 어디에 집중해야 할지를 예측하기 위해 이전 경험을 사용한다.",[["간접의문문 어순","g8-1"]]]],"mnote":"간접의문문 어순: predict의 목적어인 where절에서는 의문사 뒤에 주어 we와 동사 should pay가 온다. 의문문처럼 should we로 도치하지 않는다."},{"title":"환경이 기대를 만든다","en":"Different environments <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"복수 주어의 동사\"><span class=\"an-word\">create</span></span> different expectations.","tr":"다른 환경은 다른 기대를 만든다.","sv":[["S","Different environments","주어"],["V","create","동사"],["O","different expectations","목적어"]],"chunks":[["Different environments","다른 환경은",[]],["create different expectations.","다른 기대를 만든다.",[["복수 주어의 동사","g8-2"]]]],"mnote":"복수 주어의 동사: environments가 복수이므로 create를 쓴다."},{"title":"Diamond의 저서 사례","en":"This <span class=\"an ul\" data-n=\"수동태 be + 과거분사\"><span class=\"an-word\">was profoundly illustrated</span></span> by the scientist Jared Diamond <b class=\"sl\">/</b> in his book Guns, Germs, and Steel.","tr":"이것은 과학자 Jared Diamond의 저서인 Guns, Germs, and Steel에서 그에 의해 깊이 있게 설명되었다.","sv":[["S","This","주어"],["V","was illustrated","동사"],["M","profoundly / by the scientist Jared Diamond / in his book Guns, Germs, and Steel","수식어"]],"chunks":[["This was profoundly illustrated by the scientist Jared Diamond","이것은 과학자 Jared Diamond에 의해 깊이 있게 설명되었다",[["수동태 be + 과거분사","g8-3"]]],["in his book Guns, Germs, and Steel.","그의 저서인 Guns, Germs, and Steel에서.",[]]],"mnote":"수동태 be + 과거분사: This는 설명되는 대상이므로 was illustrated라는 수동태가 필요하다. by 이하는 설명한 사람을 나타낸다."},{"title":"뉴기니 정글을 돌아다닌 모험","en":"He describes an adventure <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"능동 의미의 -ing 구\"><span class=\"an-word\">wandering</span></span> through the New Guinea jungle with native New Guineans.","tr":"그는 New Guinea 원주민들과 함께 New Guinea 정글을 돌아다니는 모험을 묘사한다.","sv":[["S","He","주어"],["V","describes","동사"],["O","an adventure","목적어"],["X","wandering through the New Guinea jungle with native New Guineans","절·구조"]],"chunks":[["He describes an adventure","그는 모험을 묘사한다",[]],["wandering through the New Guinea jungle with native New Guineans.","New Guinea 원주민들과 함께 New Guinea 정글을 돌아다니는.",[["능동 의미의 -ing 구","g8-4"]]]],"mnote":"능동 의미의 -ing 구: wandering은 정글을 돌아다니는 활동을 덧붙인다. 수동의 의미로 wandered를 쓰는 구조가 아니다."},{"title":"서구식 과업에 서투른 원주민","en":"He relates that these natives tend to perform poorly <b class=\"sl\">/</b> at tasks Westerners <span class=\"an ul\" data-n=\"현재완료 수동태\"><span class=\"an-word\">have been trained</span></span> to do since childhood.","tr":"그는 이 원주민들이 서구인들이 어린 시절부터 훈련받아 온 과업을 잘 수행하지 못하는 경향이 있다고 말한다.","sv":[["S","He","주어"],["V","relates","동사"],["O","that these natives tend to perform poorly at tasks ...","목적어"],["X","Westerners have been trained to do since childhood (tasks를 수식)","절·구조"]],"chunks":[["He relates that these natives tend to perform poorly","그는 이 원주민들이 잘 수행하지 못하는 경향이 있다고 말한다",[]],["at tasks Westerners have been trained to do since childhood.","서구인들이 어린 시절부터 훈련받아 온 과업을.",[["현재완료 수동태","g8-5"]]]],"mnote":"현재완료 수동태: 서구인들은 훈련받은 대상이므로 have been trained를 쓴다. tasks 뒤에는 목적격 관계대명사가 생략되어 있다."},{"title":"서투름은 어리석음이 아님","en":"But they <b class=\"sl\">/</b> are <span class=\"an ul\" data-n=\"부정 의미의 부사 hardly\"><span class=\"an-word\">hardly</span></span> stupid.","tr":"하지만 그들은 멍청한 것은 아니다.","sv":[["S","they","주어"],["V","are","동사"],["C","hardly stupid","보어"]],"chunks":[["But they","하지만 그들은",[]],["are hardly stupid.","멍청한 것은 아니다.",[["부정 의미의 부사 hardly","g8-6"]]]],"mnote":"부정 의미의 부사 hardly: hardly는 ‘거의 ~않다’라는 뜻으로 어리석다는 판단을 부정한다. hard는 ‘열심히, 단단하게’ 등 다른 뜻이다."},{"title":"정글의 미묘한 변화를 감지","en":"They can detect the most subtle changes in the jungle, <b class=\"sl\">/</b> good for following the tracks of a predator or for <span class=\"an ul\" data-n=\"for 뒤 동명사의 병렬\"><span class=\"an-word\">finding</span></span> the way back home.","tr":"그들은 정글에서 가장 미묘한 변화를 감지할 수 있는데, 이는 포식자의 흔적을 추적하거나 집으로 돌아오는 길을 찾는 데 유용하다.","sv":[["S","They","주어"],["V","can detect","동사"],["O","the most subtle changes in the jungle","목적어"],["M","good for following ... or f where food exists, can build and tear down shelters with ease.</div><div class=\"def-box\">which insects to leave alone은 ‘어떤 곤충을 내버려 두어야 할지’라는 명사구로 know의 목적어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to leave / leaving]</span></div>"}]},{"group":"문장 9","items":[{"id":"g8-9","title":"과거완료의 과거분사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>Diamond, who <mark>had never spent</mark> time in such places, has no ability to pay attention to these things.</div><div class=\"def-box\">had 뒤에는 과거분사 spent를 쓴다. who절은 Diamond의 이전 정글 경험 부재를 덧붙이는 계속적 관계절이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[had never spent / had never spend]</span></div>"}]},{"group":"문장 10","items":[{"id":"g8-10","title":"if 생략 가정법 도치","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span><mark>Were he</mark> to be tested on such tasks, he also would perform poorly.</div><div class=\"def-box\">If he were to be tested에서 if를 생략하면 Were he to be tested가 된다. 미래의 가정적 상황에 대한 주절은 would+동사원형이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[Were he / Was he]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 원리</b>이전 경험을 이용해 어디에 주의를 기울일지 예측한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 사례</b>Diamond가 뉴기니 정글에서 원주민과 함께 다닌다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 대조</b>원주민은 서구식 과업에는 서툴러도 정글의 변화를 알아채는 데 능하다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 결론</b>정글 경험이 없는 Diamond 역시 정글 과업을 시험받으면 서툴 것이다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>경험이 주의할 곳을 정한다</b><p>주의 집중과 과업 수행 능력은 지능의 단순한 차이보다 이전 경험과 환경에서 무엇을 학습했는지에 크게 좌우된다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">In everyday life, we <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">use previous experience to predict where we should pay attention</b></div><p>같은 사람이 어느 과업을 잘하는지는 경험과 환경에 따라 달라진다. 원주민의 서구식 과업과 Diamond의 정글 과업을 대칭적으로 비교한다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>경험으로 주의를 예측</td><td>일상생활에서 우리는 어디에 집중해야 할지를 예측하기 위해 이전 경험을 사용한다.</td></tr><tr><td>2</td><td>환경이 기대를 만든다</td><td>다른 환경은 다른 기대를 만든다.</td></tr><tr><td>3</td><td>Diamond의 저서 사례</td><td>이것은 과학자 Jared Diamond의 저서인 Guns, Germs, and Steel에서 그에 의해 깊이 있게 설명되었다.</td></tr><tr><td>4</td><td>뉴기니 정글을 돌아다닌 모험</td><td>그는 New Guinea 원주민들과 함께 New Guinea 정글을 돌아다니는 모험을 묘사한다.</td></tr><tr><td>5</td><td>서구식 과업에 서투른 원주민</td><td>그는 이 원주민들이 서구인들이 어린 시절부터 훈련받아 온 과업을 잘 수행하지 못하는 경향이 있다고 말한다.</td></tr><tr><td>6</td><td>서투름은 어리석음이 아님</td><td>하지만 그들은 멍청한 것은 아니다.</td></tr><tr><td>7</td><td>정글의 미묘한 변화를 감지</td><td>그들은 정글에서 가장 미묘한 변화를 감지할 수 있는데, 이는 포식자의 흔적을 추적하거나 집으로 돌아오는 길을 찾는 데 유용하다.</td></tr><tr><td>8</td><td>정글 생활에 필요한 지식</td><td>그들은 어느 곤충을 내버려 두어야 할지 알며, 어디에 음식이 있는지 알고, 피난처를 쉽게 만들고 철거할 수 있다.</td></tr><tr><td>9</td><td>Diamond에게 없는 경험</td><td>그러한 장소에서 시간을 보내 본 적이 없는 Diamond는 이러한 것들에 주의를 기울일 수 있는 능력이 없다.</td></tr><tr><td>10</td><td>시험을 받는다면 그도 서툴 것</td><td>그가 그런 과업들에 대해 시험을 본다면 그 역시 잘하지 못할 것이다.</td></tr></tbody></table></div>"}]}},{"id":"11-09","lesson":11,"type":"빈칸 추론","title":"신제품 가격은 처음엔 낮춰라","source":"2025년 6월 32번","page":56,"summary":"신제품 출시 초기에는 소유감 때문에 과도한 가격을 고집하기보다 초기 가격과 수익을 희생해서라도 충분한 시장 수용을 확보해야 한다.","footnote":"* entrepreneur 기업가 &nbsp; ** tremendous 엄청난","sents":[{"title":"노력 후 저지르는 가격 책정 실수","en":"Most entrepreneurs put in tremendous amounts of time and effort <b class=\"sl\">/</b> in creating and <span class=\"an ul\" data-n=\"전치사 뒤 동명사의 병렬\"><span class=\"an-word\">launching</span></span> new products and services <b class=\"sl\">/</b> and then make the mistake of overpricing them.","tr":"대부분의 기업가들은 새로운 제품과 서비스를 만들고 출시하는 데 엄청난 시간과 노력을 들이며, 그런 다음 그것들의 가격을 너무 비싸게 책정하는 실수를 저지른다.","sv":[["S","Most entrepreneurs","주어"],["V","put in / make","동사"],["O","tremendous amounts of time and effort / the mistake of overpricing them","목적어"],["M","in creating and launching new products and services","수식어"]],"chunks":[["Most entrepreneurs put in tremendous amounts of time and effort","대부분의 기업가들은 엄청난 시간과 노력을 들이며",[]],["in creating and launching new products and services","새로운 제품과 서비스를 만들고 출시하는 데",[["전치사 뒤 동명사의 병렬","g9-1"]]],["and then make the mistake of overpricing them.","그런 다음 그것들의 가격을 너무 비싸게 책정하는 실수를 저지른다.",[]]],"mnote":"전치사 뒤 동명사의 병렬: in 뒤에서 creating과 launching이 and로 연결되므로 둘 다 동명사 형태를 쓴다."},{"title":"소유감이 왜곡하는 가치 인식","en":"They have created something they care deeply about, <b class=\"sl\">/</b> it’s theirs, <b class=\"sl\">/</b> and this powerful sense of ownership <span class=\"an ul\" data-n=\"주어의 핵심 sense와 수 일치\"><span class=\"an-word\">distorts</span></span> their perception of value <b class=\"sl\">/</b> which causes them to overprice their products.","tr":"그들은 자신이 매우 소중히 여기는 무언가를 만들었고 그것은 그들의 것이며, 이 강한 소유감은 가치에 대한 그들의 인식을 왜곡시켜 그들의 제품 가격을 너무 높게 책정하게 만든다.","sv":[["S","They / it / this powerful sense of ownership","주어"],["V","have created / is / distorts","동사"],["O","something they care deeply about / their perception of value","목적어"],["X","which causes them to overprice their products","절·구조"]],"chunks":[["They have created something they care deeply about,","그들은 자신이 매우 소중히 여기는 무언가를 만들었고,",[]],["it’s theirs,","그것은 그들의 것이며,",[]],["and this powerful sense of ownership distorts their perception of value","이 강한 소유감은 가치에 대한 그들의 인식을 왜곡시켜",[["주어의 핵심 sense와 수 일치","g9-2"]]],["which causes them to overprice their products.","그들의 제품 가격을 너무 높게 책정하게 만든다.",[]]],"mnote":"주어의 핵심 sense와 수 일치: 주어의 핵심은 단수 sense이며 of ownership은 수식어이다. 따라서 distorts를 쓴다."},{"title":"가격 인하를 꺼리는 기업가들","en":"While many of them are quick to realize that their initial prices are too high, <b class=\"sl\">/</b> not all these people are happy or willing <span class=\"an ul\" data-n=\"be willing to V\"><span class=\"an-word\">to drop</span></span> their prices <b class=\"sl\">/</b> to make their products more attractive.","tr":"그들 중 많은 이들은 초기 가격이 너무 높다는 것을 빠르게 깨닫기는 하지만, 이 모든 사람이 그들의 제품을 더 매력적으로 만들기 위해 가격을 낮추는 것을 좋아하거나 내켜하지는 않는다.","sv":[["M","While many of them are quick to realize ...","수식어"],["S","not all these people","주어"],["V","are","동사"],["C","happy or willing to drop their prices","보어"],["M","to make their products more attractive","수식어"]],"chunks":[["While many of them are quick to realize that their initial prices are too high,","그들 중 많은 이들은 초기 가격이 너무 높다는 것을 빠르게 깨닫기는 하지만,",[]],["not all these people are happy or willing to drop their prices","이 모든 사람이 가격을 낮추는 것을 좋아하거나 내켜하지는 않는다",[["be willing to V","g9-3"]]],["to make their products more attractive.","그들의 제품을 더 매력적으로 만들기 위해.",[]]],"mnote":"be willing to V: willing 뒤에는 to부정사 to drop이 온다. not all은 ‘모두가 그런 것은 아니다’라는 부분부정이다."},{"title":"사업 실패를 부르는 비싼 실수","en":"And this can be a very costly mistake <b class=\"sl\">/</b> that may <span class=\"an ul\" data-n=\"lead to + 명사\"><span class=\"an-word\">lead to</span></span> the failure of their new business.","tr":"그리고 이것은 그들의 새로운 사업의 실패를 초래할 수 있는 손해가 매우 큰 실수가 될 수 있다.","sv":[["S","this","주어"],["V","can be","동사"],["C","a very costly mistake","보어"],["X","that may lead to the failure of their new business","절·구조"]],"chunks":[["And this can be a very costly mistake","그리고 이것은 손해가 매우 큰 실수가 될 수 있다",[]],["that may lead to the failure of their new business.","그들의 새로운 사업의 실패를 초래할 수 있는.",[["lead to + 명사","g9-4"]]]],"mnote":"lead to + 명사: lead to the failure는 ‘실패를 초래하다’이다. 이때 to는 전치사이며 뒤에는 명사 the failure가 온다."},{"title":"초기에는 시장 수용을 우선 확보","en":"When you launch a new product or service, <b class=\"sl\">/</b> your priority should be to get <span class=\"an ul\" data-n=\"명사구를 수식하는 형용사\"><span class=\"an-word\">sufficient</span></span> market adoption as soon as possible <b class=\"sl\">/</b> and you should be ready to sacrifice your initial prices and profits <b class=\"sl\">/</b> to achieve this aim.","tr":"새로운 제품이나 서비스를 출시할 때 당신의 우선순위는 가능한 한 빨리 충분한 시장 수용을 확보하는 것이어야 하며, 당신은 이 목표를 달성하기 위해 초기 가격과 수익을 희생할 준비가 되어 있어야 한다.","sv":[["M","When you launch a new product or service","수식어"],["S","your priority / you","주어"],["V","should be / should be","동사"],["C","to get sufficient market adoption / ready to sacrifice your initial prices and profits","보어"],["M","as soon as possible / to achieve this aim","수식어"]],"chunks":[["When you launch a new product or service,","새로운 제품이나 서비스를 출시할 때,",[]],["your priority should be to get sufficient market adoption as soon as possible","당신의 우선순위는 가능한 한 빨리 충분한 시장 수용을 확보하는 것이어야 하며,",[["명사구를 수식하는 형용사","g9-5"]]],["and you should be ready to sacrifice your initial prices and profits","당신은 초기 가격과 수익을 희생할 준비가 되어 있어야 한다",[]],["to achieve this aim.","이 목표를 달성하기 위해.",[]]],"mnote":"명사구를 수식하는 형용사: market adoption이라는 명사구 앞에서 ‘충분한’을 뜻하는 형용사 sufficient를 쓴다."},{"title":"판매량 확보 이후의 가격 인상","en":"Once you <span class=\"an ul\" data-n=\"시간 부사절의 현재시제\"><span class=\"an-word\">have</span></span> strong sales volumes, <b class=\"sl\">/</b> you can increase your prices to maximize your profits.","tr":"일단 당신이 높은 판매량을 확보하게 되면 당신은 수익을 극대화하기 위해 가격을 인상할 수 있다.","sv":[["M","Once you have strong sales volumes","수식어"],["S","you","주어"],["V","can increase","동사"],["O","your prices","목적어"],["M","to maximize your profits","수식어"]],"chunks":[["Once you have strong sales volumes,","일단 당신이 높은 판매량을 확보하게 되면,",[["시간 부사절의 현재시제","g9-6"]]],["you can increase your prices to maximize your profits.","당신은 수익을 극대화하기 위해 가격을 인상할 수 있다.",[]]],"mnote":"시간 부사절의 현재시제: Once가 이끄는 시간 부사절에서는 미래 상황을 말해도 현재시제 have를 쓴다. 주절에서 can increase로 이후의 행동을 나타낸다."}],"grammar":[{"group":"문장 1","items":[{"id":"g9-1","title":"전치사 뒤 동명사의 병렬","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Most entrepreneurs put in tremendous amounts of time and effort in creating and <mark>launching</mark> new products and services and then make the mistake of overpricing them.</div><div class=\"def-box\">in 뒤에서 creating과 launching이 and로 연결되므로 둘 다 동명사 형태를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[launching / launch]</span></div>"}]},{"group":"문장 2","items":[{"id":"g9-2","title":"주어의 핵심 sense와 수 일치","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>They have created something they care deeply about, it’s theirs, and this powerful sense of ownership <mark>distorts</mark> their perception of value which causes them to overprice their products.</div><div class=\"def-box\">주어의 핵심은 단수 sense이며 of ownership은 수식어이다. 따라서 distorts를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[distorts / distort]</span></div>"}]},{"group":"문장 3","items":[{"id":"g9-3","title":"be willing to V","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>While many of them are quick to realize that their initial prices are too high, not all these people are happy or willing <mark>to drop</mark> their prices to make their products more attractive.</div><div class=\"def-box\">willing 뒤에는 to부정사 to drop이 온다. not all은 ‘모두가 그런 것은 아니다’라는 부분부정이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to drop / dropping]</span></div>"}]},{"group":"문장 4","items":[{"id":"g9-4","title":"lead to + 명사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>And this can be a very costly mistake that may <mark>lead to</mark> the failure of their new business.</div><div class=\"def-box\">lead to the failure는 ‘실패를 초래하다’이다. 이때 to는 전치사이며 뒤에는 명사 the failure가 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[lead to / lead]</span></div>"}]},{"group":"문장 5","items":[{"id":"g9-5","title":"명사구를 수식하는 형용사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>When you launch a new product or service, your priority should be to get <mark>sufficient</mark> market adoption as soon as possible and you should be ready to sacrifice your initial prices and profits to achieve this aim.</div><div class=\"def-box\">market adoption이라는 명사구 앞에서 ‘충분한’을 뜻하는 형용사 sufficient를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[sufficient / sufficiently]</span></div>"}]},{"group":"문장 6","items":[{"id":"g9-6","title":"시간 부사절의 현재시제","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>Once you <mark>have</mark> strong sales volumes, you can increase your prices to maximize your profits.</div><div class=\"def-box\">Once가 이끄는 시간 부사절에서는 미래 상황을 말해도 현재시제 have를 쓴다. 주절에서 can increase로 이후의 행동을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[have / will have]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 문제</b>개발에 많은 노력을 들인 기업가가 신제품 가격을 지나치게 높게 책정한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 원인</b>강한 소유감이 가치에 대한 인식을 왜곡한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 위험</b>가격 인하를 거부하면 사업 실패로 이어질 수 있다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 대안</b>처음에는 시장 수용을 확보하고 판매량이 커진 뒤 가격을 올린다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>신제품 가격은 처음엔 낮춰라</b><p>신제품 출시 초기에는 소유감 때문에 과도한 가격을 고집하기보다 초기 가격과 수익을 희생해서라도 충분한 시장 수용을 확보해야 한다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">When you launch a new product or service, your priority should be to <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span> and you should be ready to sacrifice your initial prices and profits to achieve this aim.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">get sufficient market adoption as soon as possible</b></div><p>목적은 항상 싸게 파는 것이 아니라 초기 시장 수용을 우선 확보하는 것이다. 이후 판매량이 충분해지면 가격을 올릴 수 있다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>노력 후 저지르는 가격 책정 실수</td><td>대부분의 기업가들은 새로운 제품과 서비스를 만들고 출시하는 데 엄청난 시간과 노력을 들이며, 그런 다음 그것들의 가격을 너무 비싸게 책정하는 실수를 저지른다.</td></tr><tr><td>2</td><td>소유감이 왜곡하는 가치 인식</td><td>그들은 자신이 매우 소중히 여기는 무언가를 만들었고 그것은 그들의 것이며, 이 강한 소유감은 가치에 대한 그들의 인식을 왜곡시켜 그들의 제품 가격을 너무 높게 책정하게 만든다.</td></tr><tr><td>3</td><td>가격 인하를 꺼리는 기업가들</td><td>그들 중 많은 이들은 초기 가격이 너무 높다는 것을 빠르게 깨닫기는 하지만, 이 모든 사람이 그들의 제품을 더 매력적으로 만들기 위해 가격을 낮추는 것을 좋아하거나 내켜하지는 않는다.</td></tr><tr><td>4</td><td>사업 실패를 부르는 비싼 실수</td><td>그리고 이것은 그들의 새로운 사업의 실패를 초래할 수 있는 손해가 매우 큰 실수가 될 수 있다.</td></tr><tr><td>5</td><td>초기에는 시장 수용을 우선 확보</td><td>새로운 제품이나 서비스를 출시할 때 당신의 우선순위는 가능한 한 빨리 충분한 시장 수용을 확보하는 것이어야 하며, 당신은 이 목표를 달성하기 위해 초기 가격과 수익을 희생할 준비가 되어 있어야 한다.</td></tr><tr><td>6</td><td>판매량 확보 이후의 가격 인상</td><td>일단 당신이 높은 판매량을 확보하게 되면 당신은 수익을 극대화하기 위해 가격을 인상할 수 있다.</td></tr></tbody></table></div>"}]}},{"id":"11-10","lesson":11,"type":"빈칸 추론","title":"천천히 적게 낳아 잘 키우는 전략","source":"2025년 6월 33번","page":57,"summary":"인간·유인원·코끼리는 적은 수의 자손에게 시간과 에너지를 많이 투자하여 생존과 번식에 성공하는 자손의 비율을 높이는 전략을 쓴다.","footnote":"* ape 유인원 &nbsp; ** offspring 자손 &nbsp; *** litter 한 배에 난 새끼","sents":[{"title":"에너지를 더 들여 천천히 번식","en":"In most respects, humans are one of a relatively small number of species <b class=\"sl\">/</b> that evolved a very different strategy of <span class=\"an ul\" data-n=\"전치사 of 뒤 동명사\"><span class=\"an-word\">investing</span></span> more energy <b class=\"sl\">/</b> to reproduce more slowly.","tr":"대부분의 측면에서 인간은 더 많은 에너지를 투자해 더 천천히 번식하는 매우 다른 전략을 진화시킨 비교적 소수의 종들 중 하나이다.","sv":[["M","In most respects","수식어"],["S","humans","주어"],["V","are","동사"],["C","one of a relatively small number of species","보어"],["X","that evolved a very different strategy of investing more energy to reproduce more slowly","절·구조"]],"chunks":[["In most respects, humans are one of a relatively small number of species","대부분의 측면에서 인간은 비교적 소수의 종들 중 하나이다",[]],["that evolved a very different strategy of investing more energy","더 많은 에너지를 투자하는 매우 다른 전략을 진화시킨",[["전치사 of 뒤 동명사","g10-1"]]],["to reproduce more slowly.","더 천천히 번식하기 위해.",[]]],"mnote":"전치사 of 뒤 동명사: a strategy of investing에서 of 뒤에는 동명사가 온다. to reproduce는 에너지 투자의 목적을 나타낸다."},{"title":"적게 낳고 양육에 많이 투자","en":"Like apes and elephants, <b class=\"sl\">/</b> we mature at a leisurely pace, grow large bodies, and have few babies <b class=\"sl\">/</b> but devote much time and energy to <span class=\"an ul\" data-n=\"devote A to + 동명사\"><span class=\"an-word\">raising</span></span> them well.","tr":"유인원과 코끼리와 마찬가지로 우리는 천천히 성숙하고 몸집을 크게 키우며 새끼들을 적게 낳지만 그들을 잘 키우는 데 많은 시간과 에너지를 투자한다.","sv":[["S","we","주어"],["V","mature / grow / have / devote","동사"],["O","large bodies / few babies / much time and energy","목적어"],["M","Like apes and elephants / to raising them well","수식어"]],"chunks":[["Like apes and elephants,","유인원과 코끼리와 마찬가지로,",[]],["we mature at a leisurely pace, grow large bodies, and have few babies","우리는 천천히 성숙하고 몸집을 크게 키우며 새끼들을 적게 낳지만",[]],["but devote much time and energy to raising them well.","그들을 잘 키우는 데 많은 시간과 에너지를 투자한다.",[["devote A to + 동명사","g10-2"]]]],"mnote":"devote A to + 동명사: devote time and energy to raising에서 to는 전치사이므로 raising을 쓴다. to부정사로 착각하지 않도록 한다."},{"title":"적은 수와 높은 생존 비율", "g10-4"]]]],"mnote":"수량을 수식하는 부사: approximately가 twelve-month라는 기간 표현을 수식하므로 부사형을 쓴다."},{"title":"생쥐 새끼의 낮은 생존","en":"However, <b class=\"sl\">/</b> the vast majority of her pups die <span class=\"an ul\" data-n=\"주어 상태를 나타내는 형용사\"><span class=\"an-word\">young</span></span>.","tr":"그러나 그 새끼 대부분은 어릴 때 죽는다.","sv":[["M","However","수식어"],["S","the vast majority of her pups","주어"],["V","die","동사"],["C","young (죽을 때의 상태)","보어"]],"chunks":[["However,","그러나,",[]],["the vast majority of her pups die young.","그 새끼 대부분은 어릴 때 죽는다.",[["주어 상태를 나타내는 형용사","g10-5"]]]],"mnote":"주어 상태를 나타내는 형용사: die young은 ‘어린 상태로 죽다’이며 young이 주어의 상태를 설명한다. 부사 youngly는 쓰지 않는다."},{"title":"늦고 드물게 낳는 유인원과 코끼리","en":"In contrast, a chimp or elephant mother <span class=\"an ul\" data-n=\"does 뒤 동사원형\"><span class=\"an-word\">does not reproduce</span></span> until she is at least twelve years old, <b class=\"sl\">/</b> and she gives birth to only one infant every five or six years <b class=\"sl\">/</b> over the next thirty or so years.","tr":"반면 침팬지나 코끼리 어미는 최소 12살이 될 때까지 번식을 하지 않으며, 이후 30년 정도에 걸쳐 5년 또는 6년마다 단 한 마리의 새끼만 낳는다.","sv":[["M","In contrast / until she is at least twelve years old","수식어"],["S","a chimp or elephant mother / she","주어"],["V","does not reproduce / gives birth","동사"],["M","to only one infant / every five or six years / over the next thirty or so years","수식어"]],"chunks":[["In contrast, a chimp or elephant mother does not reproduce until she is at least twelve years old,","반면 침팬지나 코끼리 어미는 최소 12살이 될 때까지 번식을 하지 않으며,",[["does 뒤 동사원형","g10-6"]]],["and she gives birth to only one infant every five or six years","단 한 마리의 새끼만 5년 또는 6년마다 낳는다",[]],["over the next thirty or so years.","이후 30년 정도에 걸쳐.",[]]],"mnote":"does 뒤 동사원형: 단수 주어 때문에 does를 썼으므로 뒤 본동사는 원형 reproduce를 쓴다. not ... until은 ‘~할 때가 되어서야’라는 의미이다."},{"title":"절반은 부모가 된다","en":"About half of these offspring <b class=\"sl\">/</b> make it to <span class=\"an ul\" data-n=\"도달점을 나타내는 전치사 to\"><span class=\"an-word\">becoming</span></span> p -4","title":"수량을 수식하는 부사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>A house mouse can become a mother when she is just five weeks old, has four to ten pups per litter, and can have a new litter every two months over the course of her <mark>approximately</mark> twelve-month life.</div><div class=\"def-box\">approximately가 twelve-month라는 기간 표현을 수식하므로 부사형을 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[approximately / approximate]</span></div>"}]},{"group":"문장 5","items":[{"id":"g10-5","title":"주어 상태를 나타내는 형용사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>However, the vast majority of her pups die <mark>young</mark>.</div><div class=\"def-box\">die young은 ‘어린 상태로 죽다’이며 young이 주어의 상태를 설명한다. 부사 youngly는 쓰지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[young / youngly]</span></div>"}]},{"group":"문장 6","items":[{"id":"g10-6","title":"does 뒤 동사원형","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>In contrast, a chimp or elephant mother <mark>does not reproduce</mark> until she is at least twelve years old, and she gives birth to only one infant every five or six years over the next thirty or so years.</div><div class=\"def-box\">단수 주어 때문에 does를 썼으므로 뒤 본동사는 원형 reproduce를 쓴다. not ... until은 ‘~할 때가 되어서야’라는 의미이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[does not reproduce / does not reproduces]</span></div>"}]},{"group":"문장 7","items":[{"id":"g10-7","title":"도달점을 나타내는 전치사 to","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>About half of these offspring make it to <mark>becoming</mark> parents.</div><div class=\"def-box\">make it to becoming에서 to는 전치사이므로 동명사 becoming이 온다. make it은 성공적으로 도달한다는 의미이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[becoming / become]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 전략</b>천천히 성숙하고 적게 낳으며 양육에 많이 투자한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 성공 이유</b>자손 수는 적어도 살아남아 번식하는 비율이 높다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 생쥐</b>빨리 많이 낳지만 대부분 어린 나이에 죽는다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 유인원·코끼리</b>늦고 드물게 낳지만 약 절반은 부모가 된다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>천천히 적게 낳아 잘 키우는 전략</b><p>인간·유인원·코끼리는 적은 수의 자손에게 시간과 에너지를 많이 투자하여 생존과 번식에 성공하는 자손의 비율을 높이는 전략을 쓴다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">This unusual strategy succeeds because while apes and elephants produce fewer babies than mice, <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">a larger percentage of their offspring survive to then reproduce</b></div><p>번식 전략의 성패는 새끼의 절대 수만이 아니라 살아남아 다시 번식하는 비율로 판단해야 한다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>에너지를 더 들여 천천히 번식</td><td>대부분의 측면에서 인간은 더 많은 에너지를 투자해 더 천천히 번식하는 매우 다른 전략을 진화시킨 비교적 소수의 종들 중 하나이다.</td></tr><tr><td>2</td><td>적게 낳고 양육에 많이 투자</td><td>유인원과 코끼리와 마찬가지로 우리는 천천히 성숙하고 몸집을 크게 키우며 새끼들을 적게 낳지만 그들을 잘 키우는 데 많은 시간과 에너지를 투자한다.</td></tr><tr><td>3</td><td>적은 수와 높은 생존 비율</td><td>유인원과 코끼리는 생쥐보다 더 적은 수의 새끼를 낳지만 그들의 새끼 중 더 높은 비율이 살아남아서 번식하기 때문에 이 특이한 전략은 성공한다.</td></tr><tr><td>4</td><td>빨리 자주 낳는 생쥐</td><td>생쥐는 생후 5주 만에 어미가 될 수 있으며 한 배에서 4마리에서 10마리의 새끼를 낳고, 약 12개월의 생애 동안 2개월마다 새로운 새끼들을 낳을 수 있다.</td></tr><tr><td>5</td><td>생쥐 새끼의 낮은 생존</td><td>그러나 그 새끼 대부분은 어릴 때 죽는다.</td></tr><tr><td>6</td><td>늦고 드물게 낳는 유인원과 코끼리</td><td>반면 침팬지나 코끼리 어미는 최소 12살이 될 때까지 번식을 하지 않으며, 이후 30년 정도에 걸쳐 5년 또는 6년마다 단 한 마리의 새끼만 낳는다.</td></tr><tr><td>7</td><td>절반은 부모가 된다</td><td>이러한 새끼 중 절반 정도가 부모가 되는 데 성공한다.</td></tr></tbody></table></div>"}]}},{"id":"11-11","lesson":11,"type":"빈칸 추론","title":"과학자들은 왜 결과를 공개할까","source":"2025년 6월 34번","page":58,"summary":"과학자는 결과와 데이터를 공개해 상호 검토·반박·후속 연구를 가능하게 하고 사회 전체의 지식을 늘리며, 서로의 연구에 의존한다.","footnote":"* derive 도출하다 &nbsp; ** refute 반박하다","sents":[{"title":"발견을 혼자 간직하지 않는다","en":"When scientists make an important new discovery or experimentally prove some hypothesis, <b class=\"sl\">/</b> they do not, in general, keep that information to themselves <b class=\"sl\">/</b> so that they alone can consider its meaning and <span class=\"an ul\" data-n=\"조동사 뒤 동사 병렬\"><span class=\"an-word\">derive</span></span> additional theories from it.","tr":"과학자들은 중요한 새로운 발견을 하거나 실험적으로 어떤 가설을 증명할 때, 일반적으로 그들만이 그것의 의미를 고려하고 그것으로부터 추가적인 이론을 도출할 수 있도록 그 정보를 자기만 가지고 있지 않는다.","sv":[["M","When scientists make ... or prove ...","수식어"],["S","they","주어"],["V","do not keep","동사"],["O","that information","목적어"],["M","to themselves / so that they alone can consider ... and derive ...","수식어"]],"chunks":[["When scientists make an important new discovery or experimentally prove some hypothesis,","과학자들은 중요한 새로운 발견을 하거나 실험적으로 어떤 가설을 증명할 때,",[]],["they do not, in general, keep that information to themselves","일반적으로 그 정보를 자기만 가지고 있지 않는다",[]],["so that they alone can consider its meaning and derive additional theories from it.","그들만이 그것의 의미를 고려하고 그것으로부터 추가적인 이론을 도출할 수 있도록.",[["조동사 뒤 동사 병렬","g11-1"]]]],"mnote":"조동사 뒤 동사 병렬: so that절에서 can 뒤에 consider와 derive가 and로 연결되므로 둘 다 동사원형을 쓴다."},{"title":"발표하고 검토에 개방","en":"Instead, <b class=\"sl\">/</b> they publish their results and make their data <span class=\"an ul\" data-n=\"make + 목적어 + 형용사 보어\"><span class=\"an-word\">available</span></span> for inspection.","tr":"대신 그들은 자신의 결과를 발표하고 그들의 데이터가 점검 가능하도록 한다.","sv":[["M","Instead","수식어"],["S","they","주어"],["V","publish / make","동사"],["O","their results / their data","목적어"],["C","available","보어"],["M","for inspection","수식어"]],"chunks":[["Instead,","대신,",[]],["they publish their results and make their data available for inspection.","그들은 자신의 결과를 발표하고 그들의 데이터가 점검 가능하도록 한다.",[["make + 목적어 + 형용사 보어","g11-2"]]]],"mnote":"make + 목적어 + 형용사 보어: make their data available에서 available은 데이터의 상태를 설명하는 형용사 보어이다."},{"title":"재검토와 반박의 가능성","en":"This makes <span class=\"an ul\" data-n=\"가목적어 it와 진목적어 to부정사\"><span class=\"an-word\">it possible</span></span> for other scientists <b class=\"sl\">/</b> to reconsider their data and possibly refute their conclusions.","tr":"이것은 다른 과학자들이 그들의 데이터를 재고하고 어쩌면 그들의 결론을 반박하는 것을 가능하게 한다.","sv":[["S","This","주어"],["V","makes","동사"],["O","it (가목적어)","목적어"],["C","possible","보어"],["X","for other scientists to reconsider their data and possibly refute their conclusions (진목적어)","절·구조"]],"chunks":[["This makes it possible for other scientists","이것은 다른 과학자들에게 가능하게 한다",[["가목적어 it와 진목적어 to부정사","g11-3"]]],["to reconsider their data and possibly refute their conclusions.","그들의 데이터를 재고하고 어쩌면 그들의 결론을 반박하는 것을.",[]]],"mnote":"가목적어 it와 진목적어 to부정사: makes it possible에서 it은 가목적어, possible은 목적격 보어이며 긴 to부정사구가 진목적어이다. for other scientists는 to부정사의 의미상 주어이다."},{"title":"새 가설과 실험을 위한 데이터","en":"More important, though, <b class=\"sl\">/</b> it makes it possible for other scientists to use that data <b class=\"sl\">/</b> to construct new hypotheses and <span class=\"an ul\" data-n=\"to부정사 안의 동사 병렬\"><span class=\"an-word\">perform</span></span> new experiments.","tr":"하지만 더 중요한 것은 이것이 다른 과학자들이 새로운 가설들을 세우고 새로운 실험들을 수행하기 위하여 그 데이터를 사용하는 것을 가능하게 한다는 것이다.","sv":[["M","More important, though","수식어"],["S","it","주어"],["V","makes","동사"],["O","it (가목적어)","목적어"],["C","possible","보어"],["X","for other scientists to use that data ... (진목적어)","절·구조"]],"chunks":[["More important, though,","하지만 더 중요한 것은,",[]],["it makes it possible for other scientists to use that data","이것이 다른 과학자들이 그 데이터를 사용하는 것을 가능하도록 한다는 것이다",[]],["to construct new hypotheses and perform new experiments.","새로운 가설들을 세우고 새로운 실험들을 수행하기 위하여.",[["to부정사 안의 동사 병렬","g11-4"]]]],"mnote":"to부정사 안의 동사 병렬: 목적을 나타내는 to construct와 (to) perform이 and로 병렬 연결된다. 두 번째 동사 앞의 to는 생략될 수 있다."},{"title":"정보 확산과 사회 전체의 지식","en":"The assumption is that society as a whole will end up <span class=\"an ul\" data-n=\"end up + 동명사\"><span class=\"an-word\">knowing</span></span> more <b class=\"sl\">/</b> if information is spread as widely as possible, <b class=\"sl\">/</b> rather than being limited to a few people.","tr":"가정은 정보가 소수의 사람들에게 제한되기보다 가능한 한 널리 확산된다면 결국 사회 전체가 더 많은 것을 알게 될 것이라는 것이다.","sv":[["S","The assumption","주어"],["V","is","동사"],["C","that society as a whole will end up knowing more ...","보어"],["M","if information is spread ... rather than being limited ...","수식어"]],"chunks":[["The assumption is that society as a whole will end up knowing more","가정은 사회 전체가 결국 더 많은 것을 알게 될 것이라는 것이다",[["end up + 동명사","g11-5"]]],["if information is spread as widely as possible,","정보가 가능한 한 널리 확산된다면,",[]],["rather than being limited to a few people.","소수의 사람들에게 제한되기보다.",[]]],"mnote":"end up + 동명사: end up knowing은 ‘결국 알게 되다’라는 표현이다. end up 뒤에는 동명사가 온다."},{"title":"과학자 사이의 상호 의존","en":"In a strict sense, <b class=\"sl\">/</b> every scientist <span class=\"an ul\" data-n=\"every + 단수명사 + 단수동사\"><span class=\"an-word\">depends</span></span> on the work of other scientists.","tr":"엄밀한 의미에서 모든 과학자는 다른 과학자들의 연구에 의존한다.","sv":[["M","In a strict sense","수식어"],["S","every scientist","주어"],["V","depends","동사"],["M","on the work of other scientists","수식어"]],"chunks":[["In a strict sense,","엄밀한 의미에서,",[]],["every scientist depends on the work of other scientists.","모든 과학자는 다른 과학자들의 연구에 의존한다.",[["every + 단수명사 + 단수동사","g11-6"]]]],"mnote":"every + 단수명사 + 단수동사: every scientist는 단수 취급하므로 depends를 쓴다. 뒤의 other scientists는 전치사구 안의 명사로 주어가 아니다."}],"grammar":[{"group":"문장 1","items":[{"id":"g11-1","title":"조동사 뒤 동사 병렬","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>When scientists make an important new discovery or experimentally prove some hypothesis, they do not, in general, keep that information to themselves so that they alone can consider its meaning and <mark>derive</mark> additional theories from it.</div><div class=\"def-box\">so that절에서 can 뒤에 consider와 derive가 and로 연결되므로 둘 다 동사원형을 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[derive / deriving]</span></div>"}]},{"group":"문장 2","items":[{"id":"g11-2","title":"make + 목적어 + 형용사 보어","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>Instead, they publish their results and make their data <mark>available</mark> for inspection.</div><div class=\"def-box\">make their data available에서 available은 데이터의 상태를 설명하는 형용사 보어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[available / availably]</span></div>"}]},{"group":"문장 3","items":[{"id":"g11-3","title":"가목적어 it와 진목적어 to부정사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>This makes <mark>it possible</mark> for other scientists to reconsider their data and possibly refute their conclusions.</div><div class=\"def-box\">makes it possible에서 it은 가목적어, possible은 목적격 보어이며 긴 to부정사구가 진목적어이다. for other scientists는 to부정사의 의미상 주어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[it possible / possible it]</span></div>"}]},{"group":"문장 4","items":[{"id":"g11-4","title":"to부정사 안의 동사 병렬","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>More important, though, it makes it possible for other scientists to use that data to construct new hypotheses and <mark>perform</mark> new experiments.</div><div class=\"def-box\">목적을 나타내는 to construct와 (to) perform이 and로 병렬 연결된다. 두 번째 동사 앞의 to는 생략될 수 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[perform / performing]</span></div>"}]},{"group":"문장 5","items":[{"id":"g11-5","title":"end up + 동명사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>The assumption is that society as a whole will end up <mark>knowing</mark> more if information is spread as widely as possible, rather than being limited to a few people.</div><div class=\"def-box\">end up knowing은 ‘결국 알게 되다’라는 표현이다. end up 뒤에는 동명사가 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[knowing / to know]</span></div>"}]},{"group":"문장 6","items":[{"id":"g11-6","title":"every + 단수명사 + 단수동사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>In a strict sense, every scientist <mark>depends</mark> on the work of other scientists.</div><div class=\"def-box\">every scientist는 단수 취급하므로 depends를 쓴다. 뒤의 other scientists는 전치사구 안의 명사로 주어가 아니다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[depends / depend]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 부정</b>과학자는 발견을 자기 혼자만 간직하지 않는다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 공개</b>결과를 발표하고 데이터를 검토할 수 있게 한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 효과</b>다른 연구자가 재고·반박하고 새 가설과 실험을 수행한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 결론</b>지식의 확산으로 사회가 더 많이 알게 되며 과학자는 서로의 연구에 의존한다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>과학자들은 왜 결과를 공개할까</b><p>과학자는 결과와 데이터를 공개해 상호 검토·반박·후속 연구를 가능하게 하고 사회 전체의 지식을 늘리며, 서로의 연구에 의존한다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">In a strict sense, <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">every scientist depends on the work of other scientists</b></div><p>결과의 공개는 단순한 검증을 넘어서 새로운 연구의 재료를 제공한다. 과학 발전은 고립된 개인이 아니라 연결된 연구들의 누적으로 이루어진다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>발견을 혼자 간직하지 않는다</td><td>과학자들은 중요한 새로운 발견을 하거나 실험적으로 어떤 가설을 증명할 때, 일반적으로 그들만이 그것의 의미를 고려하고 그것으로부터 추가적인 이론을 도출할 수 있도록 그 정보를 자기만 가지고 있지 않는다.</td></tr><tr><td>2</td><td>발표하고 검토에 개방</td><td>대신 그들은 자신의 결과를 발표하고 그들의 데이터가 점검 가능하도록 한다.</td></tr><tr><td>3</td><td>재검토와 반박의 가능성</td><td>이것은 다른 과학자들이 그들의 데이터를 재고하고 어쩌면 그들의 결론을 반박하는 것을 가능하게 한다.</td></tr><tr><td>4</td><td>새 가설과 실험을 위한 데이터</td><td>하지만 더 중요한 것은 이것이 다른 과학자들이 새로운 가설들을 세우고 새로운 실험들을 수행하기 위하여 그 데이터를 사용하는 것을 가능하게 한다는 것이다.</td></tr><tr><td>5</td><td>정보 확산과 사회 전체의 지식</td><td>가정은 정보가 소수의 사람들에게 제한되기보다 가능한 한 널리 확산된다면 결국 사회 전체가 더 많은 것을 알게 될 것이라는 것이다.</td></tr><tr><td>6</td><td>과학자 사이의 상호 의존</td><td>엄밀한 의미에서 모든 과학자는 다른 과학자들의 연구에 의존한다.</td></tr></tbody></table></div>"}]}},{"id":"11-12","lesson":11,"type":"빈칸 추론","title":"기쁨도 슬픔도 결국 제자리로","source":"2025년 9월 31번","page":59,"summary":"좋고 나쁜 경험은 기분을 바꾸지만 인간은 시간이 지나면서 적응하여 개인의 기본 행복 수준으로 돌아가는 경향이 있다.","footnote":"* euphoria (극도의) 행복감","sents":[{"title":"매 순간의 경험만으로 정해지지 않는 감정","en":"Whether we feel happy or sad, content or discontent, <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"whether 명사절 주어\"><span class=\"an-word\">is not determined</span></span> merely by each individual successive moment of life experience <b class=\"sl\">/</b> — a good thing happens and I’m happy, a bad thing happens and I’m sad.","tr":"우리가 행복하거나 슬프거나, 만족스럽거나 불만족스러운 것은 좋은 일이 일어나면 행복하고 나쁜 일이 일어나면 슬픈 것처럼 단지 삶의 경험의 각각의 개별적인 연속적인 순간에 의해 결정되지 않는다.","sv":[["S","Whether we feel happy or sad, content or discontent","주어"],["V","is not determined","동사"],["M","merely by each individual successive moment of life experience","수식어"],["X","a good thing happens ... (부연 설명)","절·구조"]],"chunks":[["Whether we feel happy or sad, content or discontent,","우리가 행복하거나 슬프거나, 만족스럽거나 불만족스러운 것은,",[]],["is not determined merely by each individual successive moment of life experience","단지 삶의 경험의 각각의 개별적인 연속적인 순간에 의해 결정되지 않는다",[["whether 명사절 주어","g12-1"]]],["— a good thing happens and I’m happy, a bad thing happens and I’m sad.","— 좋은 일이 일어나면 행복하고, 나쁜 일이 일어나면 슬픈 것처럼.",[]]],"mnote":"whether 명사절 주어: Whether we feel ... 전체가 하나의 명사절 주어이므로 단수 동사 is를 쓴다. 감정이 경험에 의해 결정되는 관계이므로 수동태이다."},{"title":"경험이 우리를 완전히 바꾸지는 않음","en":"While our experiences affect our mood, <b class=\"sl\">/</b> we are not <span class=\"an ul\" data-n=\"수동태의 과거분사\"><span class=\"an-word\">blown</span></span> in a completely new direction by each gust of wind.","tr":"우리의 경험은 우리의 기분에 영향을 미치지만 우리는 각 돌풍에 의해 완전히 새로운 방향으로 날아가지 않는다.","sv":[["M","While our experiences affect our mood","수식어"],["S","we","주어"],["V","are not blown","동사"],["M","in a completely new direction / by each gust of wind","수식어"]],"chunks":[["While our experiences affect our mood,","우리의 경험은 우리의 기분에 영향을 미치지만,",[]],["we are not blown in a completely new direction by each gust of wind.","우리는 각 돌풍에 의해 완전히 새로운 방향으로 날아가지 않는다.",[["수동태의 과거분사","g12-2"]]]],"mnote":"수동태의 과거분사: be동사 뒤에서 수동태를 이루므로 blow의 과거분사 blown을 쓴다. blew는 과거형이다."},{"title":"개인의 기본 행복 수준으로 복귀","en":"As humans, we adjust <b class=\"sl\">/</b> — to new information and events both good and bad — <b class=\"sl\">/</b> and <span class=\"an ul\" data-n=\"and로 연결된 주절 동사\"><span class=\"an-word\">return</span></span> to our personal default level of well-being.","tr":"인간으로서 우리는 좋을 뿐 아니라 나쁘기도 한 새로운 정보와 사건들에 적응하고 우리의 개인적인 기본 행복 수준으로 돌아간다.","sv":[["M","As humans / to new information and events both good and bad","수식어"],["S","we","주어"],["V","adjust / return","동사"],["M","to our personal default level of well-being","수식어"]],"chunks":[["As humans, we adjust","인간으로서 우리는 적응하고",[]],["— to new information and events both good and bad —","— 좋을 뿐 아니라 나쁘기도 한 새로운 정보와 사건들에 —",[]],["and return to our personal default level of well-being.","우리의 개인적인 기본 행복 수준으로 돌아간다.",[["and로 연결된 주절 동사","g12-3"]]]],"mnote":"and로 연결된 주절 동사: 주어 we에 대해 adjust와 return이 and로 연결된 병렬 동사이다. 중간의 대시는 부연 표현이므로 문장의 뼈대를 끊지 않는다."},{"title":"수위를 찾는 물의 비유","en":"There will be highs and lows, <b class=\"sl\">/</b> but over time, like water <span class=\"an ul\" data-n=\"명사를 수식하는 능동 분사\"><span class=\"an-word\">seeking</span></span> its own level, we are pulled toward our baseline <b class=\"sl\">/</b> — back up after bad news and back down after good.","tr":"기복은 있을 것이지만 시간이 지나면서 고유한 수위를 찾는 물처럼 우리는 우리의 기준선으로 끌려가는데, 나쁜 소식 후에는 다시 올라오고 좋은 소식 후에는 다시 내려온다.","sv":[["X","There will be highs and lows","절·구조"],["S","we","주어"],["V","are pulled","동사"],["M","over time / like water seeking its own level / toward our baseline","수식어"]],"chunks":[["There will be highs and lows,","기복은 있을 것이지만,",[]],["but over time, like water seeking its own level, we are pulled toward our baseline","시간이 지나면서 고유한 수위를 찾는 물처럼 우리는 우리의 기준선으로 끌려가는데",[["명사를 수식하는 능동 분사","g12-4"]]],["— back up after bad news and back down after good.","— 나쁜 소식 후에는 다시 올라오고 좋은 소식 후에는 다시 내려온다.",[]]],"mnote":"명사를 수식하는 능동 분사: 물이 자기 수위를 찾는 능동 관계이므로 seeking을 쓴다. like water ...는 기준선 복귀를 설명하는 비유이다."},{"title":"첫사랑과 이별도 약해진다","en":"The euphoria of first love fades, <b class=\"sl\">/</b> and so <span class=\"an ul\" data-n=\"so + 조동사 + 주어 도치\"><span class=\"an-word\">does</span></span> the despair of a break-up.","tr":"첫사랑의 행복감은 사라지고 결별의 절망도 그렇다.","sv":[["S","The euphoria of first love / the despair of a break-up","주어"],["V","fades / does (= fades)","동사"],["X","so + 조동사 + 주어: 긍정 내용의 반복","절·구조"]],"chunks":[["The euphoria of first love fades,","첫사랑의 행복감은 사라지고,",[]],["and so does the despair of a break-up.","결별의 절망도 그렇다.",[["so + 조동사 + 주어 도치","g12-5"]]]],"mnote":"so + 조동사 + 주어 도치: 앞의 fades는 일반동사이고 뒤의 주어 despair가 단수이므로 so does the despair ...가 된다. does는 fades를 대신한다."},{"title":"장난감이 영원한 행복을 줄 것이라는 믿음","en":"This tendency is best seen with little kids and their toy joy: <b class=\"sl\">/</b> When they get <span class=\"an ul\" data-n=\"get의 목적어인 what 명사절\"><span class=\"an-word\">what</span></span> they’ve longed for, <b class=\"sl\">/</b> they believe they will be happy for the rest of their lives.","tr":"이 경향은 어린아이들과 그들의 장난감 기쁨에서 가장 잘 보여진다. 그들이 간절히 원하던 것을 얻을 때 그들은 남은 인생 동안 행복할 것이라고 믿는다.","sv":[["S","This tendency / they","주어"],["V","is seen / believe","동사"],["M","with little kids and their toy joy / When they get what they’ve longed for","수식어"],["O","they will be happy for the rest of their lives","목적어"]],"chunks":[["This tendency is best seen with little kids and their toy joy:","이 경향은 어린아이들과 그들의 장난감 기쁨에서 가장 잘 보여진다:",[]],["When they get what they’ve longed for,","그들이 간절히 원하던 것을 얻을 때,",[["get의 목적어인 what 명사절","g12-6"]]],["they believe they will be happy for the rest of their lives.","그들은 남은 인생 동안 행복할 것이라고 믿는다.",[]]],"mnote":"get의 목적어인 what 명사절: what they’ve longed for는 ‘그들이 간절히 원해 온 것’이라는 뜻이며 get의 목적어이다. for의 목적어 자리도 what이 담당한다."},{"title":"처음 몇 분 동안은 그렇다","en":"And for the first few minutes of the rest of their lives, <b class=\"sl\">/</b> they <span class=\"an ul\" data-n=\"보어 happy의 생략\"><span class=\"an-word\">are</span></span>.","tr":"그리고 그들의 남은 인생의 처음 몇 분 동안 그들은 그렇다.","sv":[["M","for the first few minutes of the rest of their lives","수식어"],["S","they","주어"],["V","are","동사"],["C","(happy: 앞 문장에서 생략)","보어"]],"chunks":[["And for the first few minutes of the rest of their lives,","그리고 그들의 남은 인생의 처음 몇 분 동안,",[]],["they are.","그들은 그렇다.",[["보어 happy의 생략","g12-7"]]]],"mnote":"보어 happy의 생략: they are 뒤에는 앞 문장의 happy가 생략되어 있다. be happy의 구조를 이어받으므로 do로 바꿀 수 없다."},{"title":"아이도 어른처럼 적응한다","en":"But then the kids <b class=\"sl\">/</b> — like adults — <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"삽입어를 제외한 수 일치\"><span class=\"an-word\">adapt</span></span>.","tr":"하지만 그다음에 아이들은 어른들처럼 적응한다.","sv":[["S","the kids","주어"],["M","then / like adults","수식어"],["V","adapt","동사"]],"chunks":[["But then the kids","하지만 그다음에 아이들은",[]],["— like adults —","— 어른들처럼 —",[]],["adapt.","적응한다.",[["삽입어를 제외한 수 일치","g12-8"]]]],"mnote":"삽입어를 제외한 수 일치: 주어 the kids는 복수이므로 adapt를 쓴다. like adults는 삽입된 비교 표현이다."}],"grammar":[{"group":"문장 1","items":[{"id":"g12-1","title":"whether 명사절 주어","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Whether we feel happy or sad, content or discontent, <mark>is not determined</mark> merely by each individual successive moment of life experience — a good thing happens and I’m happy, a bad thing happens and I’m sad.</div><div class=\"def-box\">Whether we feel ... 전체가 하나의 명사절 주어이므로 단수 동사 is를 쓴다. 감정이 경험에 의해 결정되는 관계이므로 수동태이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is not determined / are not determined]</span></div>"}]},{"group":"문장 2","items":[{"id":"g12-2","title":"수동태의 과거분사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>While our experiences affect our mood, we are not <mark>blown</mark> in a completely new direction by each gust of wind.</div><div class=\"def-box\">be동사 뒤에서 수동태를 이루므로 blow의 과거분사 blown을 쓴다. blew는 과거형이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[blown / blew]</span></div>"}]},{"group":"문장 3","items":[{"id":"g12-3","title":"and로 연결된 주절 동사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>As humans, we adjust — to new information and events both good and bad — and <mark>return</mark> to our personal default level of well-being.</div><div class=\"def-box\">주어 we에 대해 adjust와 return이 and로 연결된 병렬 동사이다. 중간의 대시는 부연 표현이므로 문장의 뼈대를 끊지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[return / returning]</span></div>"}]},{"group":"문장 4","items":[{"id":"g12-4","title":"명사를 수식하는 능동 분사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>There will be highs and lows, but over time, like water <mark>seeking</mark> its own level, we are pulled toward our baseline — back up after bad news and back down after good.</div><div class=\"def-box\">물이 자기 수위를 찾는 능동 관계이므로 seeking을 쓴다. like water ...는 기준선 복귀를 설명하는 비유이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[seeking / sought]</span></div>"}]},{"group":"문장 5","items":[{"id":"g12-5","title":"so + 조동사 + 주어 도치","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>The euphoria of first love fades, and so <mark>does</mark> the despair of a break-up.</div><div class=\"def-box\">앞의 fades는 일반동사이고 뒤의 주어 despair가 단수이므로 so does the despair ...가 된다. does는 fades를 대신한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[does / is]</span></div>"}]},{"group":"문장 6","items":[{"id":"g12-6","title":"get의 목적어인 what 명사절","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>This tendency is best seen with little kids and their toy joy: When they get <mark>what</mark> they’ve longed for, they believe they will be happy for the rest of their lives.</div><div class=\"def-box\">what they’ve longed for는 ‘그들이 간절히 원해 온 것’이라는 뜻이며 get의 목적어이다. for의 목적어 자리도 what이 담당한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 7","items":[{"id":"g12-7","title":"보어 happy의 생략","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>And for the first few minutes of the rest of their lives, they <mark>are</mark>.</div><div class=\"def-box\">they are 뒤에는 앞 문장의 happy가 생략되어 있다. be happy의 구조를 이어받으므로 do로 바꿀 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / do]</span></div>"}]},{"group":"문장 8","items":[{"id":"g12-8","title":"삽입어를 제외한 수 일치","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>But then the kids — like adults — <mark>adapt</mark>.</div><div class=\"def-box\">주어 the kids는 복수이므로 adapt를 쓴다. like adults는 삽입된 비교 표현이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[adapt / adapts]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 문제 제기</b>감정은 매 순간의 좋은 일과 나쁜 일만으로 결정되지 않는다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 주장</b>사람은 경험에 적응하고 기본 행복 수준으로 돌아간다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 비유·사례</b>제 수위를 찾는 물처럼 첫사랑과 이별의 감정도 약해진다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 예시</b>장난감을 얻은 아이도 잠시 행복한 뒤 적응한다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>기쁨도 슬픔도 결국 제자리로</b><p>좋고 나쁜 경험은 기분을 바꾸지만 인간은 시간이 지나면서 적응하여 개인의 기본 행복 수준으로 돌아가는 경향이 있다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">As humans, we adjust — to new information and events both good and bad — and <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">return to our personal default level of well-being</b></div><p>기쁜 일과 슬픈 일 양쪽 모두에서 기준선으로 복귀한다. 장난감 사례는 강렬한 행복이 계속될 것이라는 믿음과 실제 적응을 대비한다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>매 순간의 경험만으로 정해지지 않는 감정</td><td>우리가 행복하거나 슬프거나, 만족스럽거나 불만족스러운 것은 좋은 일이 일어나면 행복하고 나쁜 일이 일어나면 슬픈 것처럼 단지 삶의 경험의 각각의 개별적인 연속적인 순간에 의해 결정되지 않는다.</td></tr><tr><td>2</td><td>경험이 우리를 완전히 바꾸지는 않음</td><td>우리의 경험은 우리의 기분에 영향을 미치지만 우리는 각 돌풍에 의해 완전히 새로운 방향으로 날아가지 않는다.</td></tr><tr><td>3</td><td>개인의 기본 행복 수준으로 복귀</td><td>인간으로서 우리는 좋을 뿐 아니라 나쁘기도 한 새로운 정보와 사건들에 적응하고 우리의 개인적인 기본 행복 수준으로 돌아간다.</td></tr><tr><td>4</td><td>수위를 찾는 물의 비유</td><td>기복은 있을 것이지만 시간이 지나면서 고유한 수위를 찾는 물처럼 우리는 우리의 기준선으로 끌려가는데, 나쁜 소식 후에는 다시 올라오고 좋은 소식 후에는 다시 내려온다.</td></tr><tr><td>5</td><td>첫사랑과 이별도 약해진다</td><td>첫사랑의 행복감은 사라지고 결별의 절망도 그렇다.</td></tr><tr><td>6</td><td>장난감이 영원한 행복을 줄 것이라는 믿음</td><td>이 경향은 어린아이들과 그들의 장난감 기쁨에서 가장 잘 보여진다. 그들이 간절히 원하던 것을 얻을 때 그들은 남은 인생 동안 행복할 것이라고 믿는다.</td></tr><tr><td>7</td><td>처음 몇 분 동안은 그렇다</td><td>그리고 그들의 남은 인생의 처음 몇 분 동안 그들은 그렇다.</td></tr><tr><td>8</td><td>아이도 어른처럼 적응한다</td><td>하지만 그다음에 아이들은 어른들처럼 적응한다.</td></tr></tbody></table></div>"}]}},{"id":"11-13","lesson":11,"type":"빈칸 추론","title":"수면 부족은 결국 따라잡는다","source":"2025년 9월 32번","page":60,"summary":"깨어 있는 동안 아데노신이 축적되고 자는 동안 분해되는 피드백 때문에 수면 빚이 쌓이며, 필요한 양보다 적은 잠에 익숙해질 수 없다.","footnote":"* compound 화합물 &nbsp; ** accumulation 축적","sents":[{"title":"미뤄도 피할 수 없는 수면 욕구","en":"Although you may put off <span class=\"an ul\" data-n=\"put off + 동명사\"><span class=\"an-word\">going</span></span> to sleep in order to squeeze more activities into your day, <b class=\"sl\">/</b> eventually your need for sleep becomes overwhelming <b class=\"sl\">/</b> and you are forced to get some sleep.","tr":"비록 당신은 하루에 더 많은 활동을 밀어 넣기 위해 잠자는 것을 미룰 수 있지만, 결국 당신의 수면에 대한 필요는 압도적이게 되고 당신은 잠을 잘 수밖에 없게 된다.","sv":[["M","Although you may put off going to sleep ...","수식어"],["S","your need for sleep / you","주어"],["V","becomes / are forced","동사"],["C","overwhelming","보어"],["X","to get some sleep","절·구조"]],"chunks":[["Although you may put off going to sleep in order to squeeze more activities into your day,","비록 당신은 하루에 더 많은 활동을 밀어 넣기 위해 잠자는 것을 미룰 수 있지만,",[["put off + 동명사","g13-1"]]],["eventually your need for sleep becomes overwhelming","결국 당신의 수면에 대한 필요는 압도적이게 되고",[]],["and you are forced to get some sleep.","당신은 잠을 잘 수밖에 없게 된다.",[]]],"mnote":"put off + 동명사: put off는 ‘미루다’라는 뜻으로 뒤에 동명사 going이 온다. in order to squeeze는 활동을 더 넣으려는 목적을 나타낸다."},{"title":"아데노신이라는 화합물","en":"This daily drive for sleep appears to be due, in part, <b class=\"sl\">/</b> to a compound <span class=\"an ul\" data-n=\"명사를 수식하는 과거분사\"><span class=\"an-word\">known</span></span> as adenosine.","tr":"이러한 매일의 수면 욕구는 부분적으로 아데노신이라고 알려진 화합물 때문으로 보인다.","sv":[["S","This daily drive for sleep","주어"],["V","appears","동사"],["X","to be due, in part, to a compound known as adenosine","절·구조"]],"chunks":[["This daily drive for sleep appears to be due, in part,","이러한 매일의 수면 욕구는 부분적으로 기인하는 것으로 보인다",[]],["to a compound known as adenosine.","아데노신이라고 알려진 화합물에.",[["명사를 수식하는 과거분사","g13-2"]]]],"mnote":"명사를 수식하는 과거분사: compound는 아데노신이라는 이름으로 알려진 대상이므로 known을 쓴다. known as는 ‘~로 알려진’이라는 뜻이다."},{"title":"깨어 있는 동안 쌓이는 물질","en":"This natural chemical builds up in your blood <b class=\"sl\">/</b> as time awake <span class=\"an ul\" data-n=\"time을 핵심으로 하는 주어\"><span class=\"an-word\">increases</span></span>.","tr":"이 자연 화학물질은 깨어 있는 시간이 증가할수록 당신의 혈액 속에 쌓인다.","sv":[["S","This natural chemical","주어"],["V","builds up","동사"],["M","in your blood / as time awake increases","수식어"]],"chunks":[["This natural chemical builds up in your blood","이 자연 화학물질은 당신의 혈액 속에 쌓인다",[]],["as time awake increases.","깨어 있는 시간이 증가할수록.",[["time을 핵심으로 하는 주어","g13-3"]]]],"mnote":"time을 핵심으로 하는 주어: as절의 주어는 단수명사 time이고 awake는 깨어 있는 상태를 덧붙이므로 동사는 increases이다."},{"title":"자는 동안 분해되는 물질","en":"While you sleep, <b class=\"sl\">/</b> your body <span class=\"an ul\" data-n=\"단수명사 body와 동사\"><span class=\"an-word\">breaks</span></span> down the adenosine.","tr":"당신이 자는 동안 당신의 몸은 아데노신을 분해한다.","sv":[["M","While you sleep","수식어"],["S","your body","주어"],["V","breaks down","동사"],["O","the adenosine","목적어"]],"chunks":[["While you sleep,","당신이 자는 동안,",[]],["your body breaks down the adenosine.","당신의 몸은 아데노신을 분해한다.",[["단수명사 body와 동사","g13-4"]]]],"mnote":"단수명사 body와 동사: 주절 주어 your body는 단수이므로 breaks를 쓴다. while절의 you를 주절 주어로 착각하지 않는다."},{"title":"잃은 잠의 추적과 수면 유도","en":"Thus, this molecule may be what your body uses <b class=\"sl\">/</b> to keep track of lost sleep and to trigger sleep when <span class=\"an ul\" data-n=\"when + 과거분사 생략절\"><span class=\"an-word\">needed</span></span>.","tr":"따라서 이 분자는 당신의 몸이 놓쳐 버린 수면을 추적하고 필요할 때 수면을 유도하는 데 사용하는 것일지도 모른다.","sv":[["M","Thus","수식어"],["S","this molecule","주어"],["V","may be","동사"],["C","what your body uses","보어"],["M","to keep track of lost sleep and to trigger sleep when needed","수식어"]],"chunks":[["Thus, this molecule may be what your body uses","따라서 이 분자는 당신의 몸이 사용하는 것일지도 모른다",[]],["to keep track of lost sleep and to trigger sleep when needed.","당신의 몸이 놓쳐 버린 수면을 추적하고 필요할 때 수면을 유도하는 데.",[["when + 과거분사 생략절","g13-5"]]]],"mnote":"when + 과거분사 생략절: when needed는 when sleep is needed의 생략 표현이다. 수면이 필요한 대상이므로 과거분사 needed를 쓴다."},{"title":"축적되는 수면 빚","en":"An accumulation of adenosine and other factors might explain why, <b class=\"sl\">/</b> after several nights of less than optimal amounts of sleep, <b class=\"sl\">/</b> you build up a sleep debt that you must make up by <span class=\"an ul\" data-n=\"수단의 by + 동명사\"><span class=\"an-word\">sleeping</span></span> longer than normal.","tr":"아데노신의 축적과 다른 요인들은 당신이 최적의 수면량에 미치지 못한 며칠 밤 후에 왜 평소보다 더 오래 잠으로써 보충해야 하는 수면 빚을 쌓는지를 설명할 수도 있다.","sv":[["S","An accumulation of adenosine and other factors","주어"],["V","might explain","동사"],["O","why ... you build up a sleep debt ...","목적어"],["X","that you must make up by sleeping longer than normal (sleep debt를 수식)","절·구조"]],"chunks":[["An accumulation of adenosine and other factors might explain why,","아데노신의 축적과 다른 요인들은 왜 그런지를 설명할 수도 있다,",[]],["after several nights of less than optimal amounts of sleep,","최적의 수면량에 미치지 못한 며칠 밤 후에,",[]],["you build up a sleep debt that you must make up by sleeping longer than normal.","당신이 평소보다 더 오래 잠으로써 보충해야 하는 수면 빚을 쌓는지를.",[["수단의 by + 동명사","g13-6"]]]],"mnote":"수단의 by + 동명사: by sleeping longer는 ‘더 오래 잠으로써’라는 수단이다. 전치사 by 뒤에 동명사를 쓴다."},{"title":"적은 잠에 익숙해질 수 없음","en":"Because of such built-in molecular feedback, <b class=\"sl\">/</b> you can’t become accustomed to <span class=\"an ul\" data-n=\"accustomed to + 동명사\"><span class=\"an-word\">getting</span></span> less sleep than your body needs.","tr":"이러한 내재된 분자적 피드백 때문에 당신은 당신의 몸이 필요한 것보다 더 적은 잠을 자는 것에 익숙해질 수 없다.","sv":[["M","Because of such built-in molecular feedback","수식어"],["S","you","주어"],["V","can’t become","동사"],["C","accustomed","보어"],["M","to getting less sleep than your body needs","수식어"]],"chunks":[["Because of such built-in molecular feedback,","이러한 내재된 분자적 피드백 때문에,",[]],["you can’t become accustomed to getting less sleep than your body needs.","당신은 당신의 몸이 필요한 것보다 더 적은 잠을 자는 것에 익숙해질 수 없다.",[["accustomed to + 동명사","g13-7"]]]],"mnote":"accustomed to + 동명사: become accustomed to에서 to는 전치사이므로 동명사 getting이 온다. ‘~에 익숙해지다’라는 표현이다."},{"title":"결국 따라오는 부족","en":"Eventually, <b class=\"sl\">/</b> a lack of sleep <span class=\"an ul\" data-n=\"주어 lack의 단수 일치\"><span class=\"an-word\">catches</span></span> up with you.","tr":"결국 수면 부족은 당신을 따라잡는다.","sv":[["M","Eventually","수식어"],["S","a lack of sleep","주어"],["V","catches up","동사"],["M","with you","수식어"]],"chunks":[["Eventually,","결국,",[]],["a lack of sleep catches up with you.","수면 부족은 당신을 따라잡는다.",[["주어 lack의 단수 일치","g13-8"]]]],"mnote":"주어 lack의 단수 일치: 주어의 핵심은 단수 lack이다. of sleep은 수식어이므로 catches를 쓴다. catch up with는 결국 영향을 미친다는 뜻이다."}],"grammar":[{"group":"문장 1","items":[{"id":"g13-1","title":"put off + 동명사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Although you may put off <mark>going</mark> to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep.</div><div class=\"def-box\">put off는 ‘미루다’라는 뜻으로 뒤에 동명사 going이 온다. in order to squeeze는 활동을 더 넣으려는 목적을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[going / to go]</span></div>"}]},{"group":"문장 2","items":[{"id":"g13-2","title":"명사를 수식하는 과거분사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>This daily drive for sleep appears to be due, in part, to a compound <mark>known</mark> as adenosine.</div><div class=\"def-box\">compound는 아데노신이라는 이름으로 알려진 대상이므로 known을 쓴다. known as는 ‘~로 알려진’이라는 뜻이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[known / knowing]</span></div>"}]},{"group":"문장 3","items":[{"id":"g13-3","title":"time을 핵심으로 하는 주어","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>This natural chemical builds up in your blood as time awake <mark>increases</mark>.</div><div class=\"def-box\">as절의 주어는 단수명사 time이고 awake는 깨어 있는 상태를 덧붙이므로 동사는 increases이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[increases / increase]</span></div>"}]},{"group":"문장 4","items":[{"id":"g13-4","title":"단수명사 body와 동사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>While you sleep, your body <mark>breaks</mark> down the adenosine.</div><div class=\"def-box\">주절 주어 your body는 단수이므로 breaks를 쓴다. while절의 you를 주절 주어로 착각하지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[breaks / break]</span></div>"}]},{"group":"문장 5","items":[{"id":"g13-5","title":"when + 과거분사 생략절","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when <mark>needed</mark>.</div><div class=\"def-box\">when needed는 when sleep is needed의 생략 표현이다. 수면이 필요한 대상이므로 과거분사 needed를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[needed / needing]</span></div>"}]},{"group":"문장 6","items":[{"id":"g13-6","title":"수단의 by + 동명사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by <mark>sleeping</mark> longer than normal.</div><div class=\"def-box\">by sleeping longer는 ‘더 오래 잠으로써’라는 수단이다. 전치사 by 뒤에 동명사를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[sleeping / sleep]</span></div>"}]},{"group":"문장 7","items":[{"id":"g13-7","title":"accustomed to + 동명사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Because of such built-in molecular feedback, you can’t become accustomed to <mark>getting</mark> less sleep than your body needs.</div><div class=\"def-box\">become accustomed to에서 to는 전치사이므로 동명사 getting이 온다. ‘~에 익숙해지다’라는 표현이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[getting / get]</span></div>"}]},{"group":"문장 8","items":[{"id":"g13-8","title":"주어 lack의 단수 일치","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>Eventually, a lack of sleep <mark>catches</mark> up with you.</div><div class=\"def-box\">주어의 핵심은 단수 lack이다. of sleep은 수식어이므로 catches를 쓴다. catch up with는 결국 영향을 미친다는 뜻이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[catches / catch]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 도입</b>잠을 미뤄도 결국 수면 욕구가 압도한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 기제</b>아데노신은 깨어 있으면 쌓이고 자는 동안 분해된다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 결과</b>잃은 잠을 추적하는 피드백으로 수면 빚을 보충하게 된다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 결론</b>필요한 양보다 적은 수면에 익숙해질 수 없고 부족은 결국 따라잡는다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>수면 부족은 결국 따라잡는다</b><p>깨어 있는 동안 아데노신이 축적되고 자는 동안 분해되는 피드백 때문에 수면 빚이 쌓이며, 필요한 양보다 적은 잠에 익숙해질 수 없다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">Because of such built-in molecular feedback, you <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">can’t become accustomed to getting less sleep than your body needs</b></div><p>깨어 있는 동안의 축적과 수면 중의 분해가 몸의 피드백을 이룬다. 의지로 잠을 미뤄도 수면 부족 자체가 사라지지는 않는다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>미뤄도 피할 수 없는 수면 욕구</td><td>비록 당신은 하루에 더 많은 활동을 밀어 넣기 위해 잠자는 것을 미룰 수 있지만, 결국 당신의 수면에 대한 필요는 압도적이게 되고 당신은 잠을 잘 수밖에 없게 된다.</td></tr><tr><td>2</td><td>아데노신이라는 화합물</td><td>이러한 매일의 수면 욕구는 부분적으로 아데노신이라고 알려진 화합물 때문으로 보인다.</td></tr><tr><td>3</td><td>깨어 있는 동안 쌓이는 물질</td><td>이 자연 화학물질은 깨어 있는 시간이 증가할수록 당신의 혈액 속에 쌓인다.</td></tr><tr><td>4</td><td>자는 동안 분해되는 물질</td><td>당신이 자는 동안 당신의 몸은 아데노신을 분해한다.</td></tr><tr><td>5</td><td>잃은 잠의 추적과 수면 유도</td><td>따라서 이 분자는 당신의 몸이 놓쳐 버린 수면을 추적하고 필요할 때 수면을 유도하는 데 사용하는 것일지도 모른다.</td></tr><tr><td>6</td><td>축적되는 수면 빚</td><td>아데노신의 축적과 다른 요인들은 당신이 최적의 수면량에 미치지 못한 며칠 밤 후에 왜 평소보다 더 오래 잠으로써 보충해야 하는 수면 빚을 쌓는지를 설명할 수도 있다.</td></tr><tr><td>7</td><td>적은 잠에 익숙해질 수 없음</td><td>이러한 내재된 분자적 피드백 때문에 당신은 당신의 몸이 필요한 것보다 더 적은 잠을 자는 것에 익숙해질 수 없다.</td></tr><tr><td>8</td><td>결국 따라오는 부족</td><td>결국 수면 부족은 당신을 따라잡는다.</td></tr></tbody></table></div>"}]}},{"id":"11-14","lesson":11,"type":"빈칸 추론","title":"정확함은 쓰임새에 달려 있다","source":"2025년 9월 33번","page":61,"summary":"불확실성의 중요성과 수치의 충분한 정밀도는 사용 목적에 따라 달라진다. 일출 시각을 아는 일과 태양 근처에 위성을 보내는 일은 요구하는 정확도가 다르다.","footnote":"* significant digit 유효 숫자","sents":[{"title":"불확실성의 중요성은 상대적","en":"One of the things that makes uncertainty difficult for members of the public <span class=\"an ul\" data-n=\"for + 의미상 주어 + to부정사\"><span class=\"an-word\">to appreciate</span></span> <b class=\"sl\">/</b> is that the significance of uncertainty is relative.","tr":"대중이 불확실성을 이해하기 어렵게 만드는 것들 중 하나는 불확실성의 중요성이 상대적이라는 것이다.","sv":[["S","One of the things that makes uncertainty difficult for members of the public to appreciate","주어"],["V","is","동사"],["C","that the significance of uncertainty is relative","보어"]],"chunks":[["One of the things that makes uncertainty difficult for members of the public to appreciate","대중이 불확실성을 이해하기 어렵게 만드는 것들 중 하나는",[["for + 의미상 주어 + to부정사","g14-1"]]],["is that the significance of uncertainty is relative.","불확실성의 중요성이 상대적이라는 것이다.",[]]],"mnote":"for + 의미상 주어 + to부정사: difficult for members of the public to appreciate에서 for 이하는 to부정사의 의미상 주어를 나타낸다. uncertainty는 appreciate의 의미상 목적어이다."},{"title":"여섯 자리 유효 숫자의 거리","en":"Take, for example, the distance between Earth and the sun: <b class=\"sl\">/</b> 1.49597 × 10⁸ km, <b class=\"sl\">/</b> as <span class=\"an ul\" data-n=\"수동 의미의 분사\"><span class=\"an-word\">measured</span></span> at one point during the year.","tr":"지구와 태양 사이의 거리, 즉 연중 한 지점에서 측정된 1.49597 × 10⁸km의 예를 들어 보자.","sv":[["X","명령문: 주어 you 생략","절·구조"],["V","Take","동사"],["O","the distance between Earth and the sun","목적어"],["M","for example / as measured at one point during the year","수식어"]],"chunks":[["Take, for example, the distance between Earth and the sun:","지구와 태양 사이의 거리의 예를 들어 보자:",[]],["1.49597 × 10⁸ km,","1.49597 × 10⁸km,",[]],["as measured at one point during the year.","즉 연중 한 지점에서 측정된.",[["수동 의미의 분사","g14-2"]]]],"mnote":"수동 의미의 분사: 거리는 측정하는 주체가 아니라 측정된 대상이므로 measured를 쓴다. as measured는 as it is measured의 생략으로 이해할 수 있다."},{"title":"정밀해 보이는 수치","en":"This seems relatively precise; <b class=\"sl\">/</b> after all, using six significant digits <span class=\"an ul\" data-n=\"동명사구 주어의 단수 일치\"><span class=\"an-word\">means</span></span> I know the distance <b class=\"sl\">/</b> to an accuracy of one part in a million or so.","tr":"이것은 상대적으로 정확해 보이지만, 결국 여섯 자리의 유효 숫자를 사용하는 것은 백만 분의 일 정도의 정확도로 그 거리를 알고 있다는 것을 의미한다.","sv":[["S","This / using six significant digits","주어"],["V","seems / means","동사"],["C","relatively precise","보어"],["O","(that) I know the distance to an accuracy of one part in a million or so","목적어"]],"chunks":[["This seems relatively precise;","이것은 상대적으로 정확해 보이지만,",[]],["after all, using six significant digits means I know the distance","결국 여섯 자리의 유효 숫자를 사용하는 것은 그 거리를 알고 있다는 것을 의미한다",[["동명사구 주어의 단수 일치","g14-3"]]],["to an accuracy of one part in a million or so.","백만 분의 일 정도의 정확도로.",[]]],"mnote":"동명사구 주어의 단수 일치: using six significant digits 전체가 주어인 동명사구이므로 단수 동사 means를 쓴다. digits가 복수라고 mean을 쓰지 않는다."},{"title":"작은 상대 오차와 큰 실제 거리","en":"However, if the next digit is uncertain, <b class=\"sl\">/</b> that means the uncertainty in knowing the precise Earth–sun distance <b class=\"sl\">/</b> is <span class=\"an ul\" data-n=\"비교급 + than\"><span class=\"an-word\">larger</span></span> than the distance between New York and Chicago!","tr":"하지만 만약 다음 숫자가 불확실하다면, 그것은 지구와 태양의 정확한 거리를 아는 것에 있어서의 불확실성이 뉴욕과 시카고의 거리보다 더 크다는 것을 의미한다!","sv":[["M","However / if the next digit is uncertain","수식어"],["S","that","주어"],["V","means","동사"],["O","(that) the uncertainty ... is larger than the distance between New York and Chicago","목적어"]],"chunks":[["However, if the next digit is uncertain,","하지만 만약 다음 숫자가 불확실하다면,",[]],["that means the uncertainty in knowing the precise Earth–sun distance","그것은 지구와 태양의 정확한 거리를 아는 것에 있어서의 불확실성이",[]],["is larger than the distance between New York and Chicago!","뉴욕과 시카고의 거리보다 더 크다는 것을 의미한다!",[["비교급 + than","g14-4"]]]],"mnote":"비교급 + than: 두 거리의 크기를 비교하므로 larger than을 쓴다. largest는 최상급이므로 이 비교 구조에 맞지 않는다."},{"title":"정확성은 목적에 달려 있음","en":"Whether or not the quoted number is “precise” <b class=\"sl\">/</b> therefore <span class=\"an ul\" data-n=\"whether 명사절 주어의 수 일치\"><span class=\"an-word\">depends</span></span> on what I’m intending to do with it.","tr":"따라서 인용된 숫자가 ‘정확한지’ 아닌
