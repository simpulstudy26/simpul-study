,"mnote":"동사를 수식하는 비교 부사: 거리를 아는 정확한 방식을 나타내어 know를 수식하므로 부사 accurately를 쓴다. more accurately는 더 정확하게라는 비교 표현이다."}],"grammar":[{"group":"문장 1","items":[{"id":"g14-1","title":"for + 의미상 주어 + to부정사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>One of the things that makes uncertainty difficult for members of the public <mark>to appreciate</mark> is that the significance of uncertainty is relative.</div><div class=\"def-box\">difficult for members of the public to appreciate에서 for 이하는 to부정사의 의미상 주어를 나타낸다. uncertainty는 appreciate의 의미상 목적어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to appreciate / appreciating]</span></div>"}]},{"group":"문장 2","items":[{"id":"g14-2","title":"수동 의미의 분사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>Take, for example, the distance between Earth and the sun: 1.49597 × 10⁸ km, as <mark>measured</mark> at one point during the year.</div><div class=\"def-box\">거리는 측정하는 주체가 아니라 측정된 대상이므로 measured를 쓴다. as measured는 as it is measured의 생략으로 이해할 수 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[measured / measuring]</span></div>"}]},{"group":"문장 3","items":[{"id":"g14-3","title":"동명사구 주어의 단수 일치","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>This seems relatively precise; after all, using six significant digits <mark>means</mark> I know the distance to an accuracy of one part in a million or so.</div><div class=\"def-box\">using six significant digits 전체가 주어인 동명사구이므로 단수 동사 means를 쓴다. digits가 복수라고 mean을 쓰지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[means / mean]</span></div>"}]},{"group":"문장 4","items":[{"id":"g14-4","title":"비교급 + than","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>However, if the next digit is uncertain, that means the uncertainty in knowing the precise Earth–sun distance is <mark>larger</mark> than the distance between New York and Chicago!</div><div class=\"def-box\">두 거리의 크기를 비교하므로 larger than을 쓴다. largest는 최상급이므로 이 비교 구조에 맞지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[larger / largest]</span></div>"}]},{"group":"문장 5","items":[{"id":"g14-5","title":"whether 명사절 주어의 수 일치","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>Whether or not the quoted number is “precise” therefore <mark>depends</mark> on what I’m intending to do with it.</div><div class=\"def-box\">whether절 전체가 하나의 주어이므로 단수 동사 depends를 쓴다. what절은 전치사 on의 목적어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[depends / depend]</span></div>"}]},{"group":"문장 6","items":[{"id":"g14-6","title":"명사를 수식하는 수동 분사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>If I care only about what minute the sun will rise tomorrow, then the number <mark>quoted</mark> here is fine.</div><div class=\"def-box\">number는 인용된 대상이므로 quoted가 뒤에서 수식한다. quoting은 숫자가 무언가를 인용하는 능동 의미가 되어 문맥에 맞지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[quoted / quoting]</span></div>"}]},{"group":"문장 7","items":[{"id":"g14-7","title":"동사를 수식하는 비교 부사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>If I want to send a satellite to orbit just above the sun, however, then I would need to know distances more <mark>accurately</mark>.</div><div class=\"def-box\">거리를 아는 정확한 방식을 나타내어 know를 수식하므로 부사 accurately를 쓴다. more accurately는 더 정확하게라는 비교 표현이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[accurately / accurate]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 주장</b>불확실성의 중요성은 상대적이다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 수치 사례</b>지구와 태양 사이 거리를 여섯 자리 유효 숫자로 제시한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 한계</b>다음 자리의 불확실성은 실제 거리로 보면 클 수 있다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 판단 기준</b>일출 시각 예측에는 충분해도 위성 궤도 계산에는 더 높은 정확도가 필요하다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>정확함은 쓰임새에 달려 있다</b><p>불확실성의 중요성과 수치의 충분한 정밀도는 사용 목적에 따라 달라진다. 일출 시각을 아는 일과 태양 근처에 위성을 보내는 일은 요구하는 정확도가 다르다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">Whether or not the quoted number is “precise” therefore <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">depends on what I’m intending to do with it</b></div><p>같은 수치라도 목적에 따라 충분한 정확도인지가 달라진다. 유효 숫자가 많다는 사실만으로 모든 용도에 충분하다고 결론 내릴 수 없다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>불확실성의 중요성은 상대적</td><td>대중이 불확실성을 이해하기 어렵게 만드는 것들 중 하나는 불확실성의 중요성이 상대적이라는 것이다.</td></tr><tr><td>2</td><td>여섯 자리 유효 숫자의 거리</td><td>지구와 태양 사이의 거리, 즉 연중 한 지점에서 측정된 1.49597 × 10⁸km의 예를 들어 보자.</td></tr><tr><td>3</td><td>정밀해 보이는 수치</td><td>이것은 상대적으로 정확해 보이지만, 결국 여섯 자리의 유효 숫자를 사용하는 것은 백만 분의 일 정도의 정확도로 그 거리를 알고 있다는 것을 의미한다.</td></tr><tr><td>4</td><td>작은 상대 오차와 큰 실제 거리</td><td>하지만 만약 다음 숫자가 불확실하다면, 그것은 지구와 태양의 정확한 거리를 아는 것에 있어서의 불확실성이 뉴욕과 시카고의 거리보다 더 크다는 것을 의미한다!</td></tr><tr><td>5</td><td>정확성은 목적에 달려 있음</td><td>따라서 인용된 숫자가 ‘정확한지’ 아닌지는 내가 그것으로 무엇을 하려고 하느냐에 따라 다르다.</td></tr><tr><td>6</td><td>일출 시각에는 충분한 숫자</td><td>만약 내가 내일 태양이 몇 분에 뜰지에만 관심이 있다면 여기 인용된 숫자로 괜찮다.</td></tr><tr><td>7</td><td>위성 궤도에는 더 높은 정확도</td><td>하지만 만약 내가 태양 바로 위에 궤도를 돌 위성을 보내고 싶다면 나는 더 정확하게 거리를 알 필요가 있을 것이다.</td></tr></tbody></table></div>"}]}},{"id":"15-15","lesson":15,"type":"요약","title":"유인원은 남의 착각을 알아챌까","source":"2018년 9월 40번","page":63,"summary":"유인원은 다른 사람이 현실에 대한 잘못된 믿음을 가지고 있는지를 구별하고 그 이해를 도움 행동에 활용한다.","footnote":"","sents":[{"title":"문장 1 · 분사의 능동과 긴 주어","en":"At the Leipzig Zoo in Germany, 34 zoo chimpanzees <span class=\"ul\">and</span> orangutans <span class=\"an ul\" data-n=\"분사의 능동과 긴 주어\"><span class=\"an-word\">participating</span></span> in a study <b class=\"sl\">/</b> were each individually tested in a room, <b class=\"sl\">/</b> where they were put in front of two boxes.","tr":"독일 Leipzig Zoo에서 한 연구에 참여하는 34마리의 침팬지와 오랑우탄은 각각 방에서 개별적으로 실험의 대상이 되었는데, 그곳에서 두 개의 상자 앞에 놓였다.","sv":[["S","34 zoo chimpanzees and orangutans participating in a study","주어"],["V","were tested","동사"],["M","at the Leipzig Zoo / in a room","수식어"],["X","where they were put in front of two boxes","절·구조"]],"chunks":[["At the Leipzig Zoo in Germany, 34 zoo chimpanzees and orangutans participating in a study","독일 Leipzig Zoo에서 한 연구에 참여하는 34마리의 침팬지와 오랑우탄은",[["분사의 능동과 긴 주어","g1-1"]]],["were each individually tested in a room,","각각 방에서 개별적으로 실험의 대상이 되었는데,",[]],["where they were put in front of two boxes.","그곳에서 두 개의 상자 앞에 놓였다.",[]]],"mnote":"분사의 능동과 긴 주어: participating은 유인원이 연구에 참여하는 능동 관계를 나타낸다. 주어는 chimpanzees and orangutans이므로 주절 동사는 were이다.","isSummary":false},{"title":"문장 2 · 조동사 뒤 병렬 동사","en":"An experimenter would place an object inside one box <b class=\"sl\">/</b> and <span class=\"an ul\" data-n=\"조동사 뒤 병렬 동사\"><span class=\"an-word\">leave</span></span> the room.","tr":"한 실험자가 한 상자 안에 물건을 놓고 방을 떠나곤 했다.","sv":[["S","An experimenter","주어"],["V","would place / leave","동사"],["O","an object / the room","목적어"]],"chunks":[["An experimenter would place an object inside one box","한 실험자가 한 상자 안에 물건을 놓고",[]],["and leave the room.","방을 떠나곤 했다.",[["조동사 뒤 병렬 동사","g1-2"]]]],"mnote":"조동사 뒤 병렬 동사: would 뒤에 place와 leave가 and로 병렬 연결되어 모두 동사원형을 쓴다.","isSummary":false},{"title":"문장 3 · 세 동사의 병렬","en":"Another experimenter would enter the room, <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"세 동사의 병렬\"><span class=\"an-word\">move</span></span> the object into the other box and exit.","tr":"또 다른 실험자는 방에 들어와 물건을 다른 상자로 옮기고 나가곤 했다.","sv":[["S","Another experimenter","주어"],["V","would enter / move / exit","동사"],["O","the room / the object","목적어"]],"chunks":[["Another experimenter would enter the room,","또 다른 실험자는 방에 들어와",[]],["move the object into the other box and exit.","물건을 다른 상자로 옮기고 나가곤 했다.",[["세 동사의 병렬","g1-3"]]]],"mnote":"세 동사의 병렬: enter, move, exit가 would를 공유한다. 물건을 옮긴 사람은 두 번째 실험자이다.","isSummary":false},{"title":"문장 4 · help + 목적어 + 동사원형","en":"When the first experimenter returned and tried <span class=\"ci\">retrieving</span> the object from the first box, <b class=\"sl\">/</b> the great ape would help the experimenter <span class=\"an ul\" data-n=\"help + 목적어 + 동사원형\"><span class=\"an-word\">open</span></span> the second box, <b class=\"sl\">/</b> which <span class=\"an\" data-n=\"유인원\"><span class=\"an-word\">it</span></span> knew the object had been transferred to.","tr":"첫 실험자가 돌아와 첫 상자에서 물건을 꺼내려 했을 때, 유인원은 실험자가 두 번째 상자를 열도록 도왔는데, 유인원은 물건이 그곳으로 옮겨졌음을 알고 있었다.","sv":[["M","When the first experimenter returned and tried retrieving ...","수식어"],["S","the great ape","주어"],["V","would help","동사"],["O","the experimenter","목적어"],["X","open the second box (목적격 보어)","절·구조"]],"chunks":[["When the first experimenter returned and tried retrieving the object from the first box,","첫 실험자가 돌아와 첫 상자에서 물건을 꺼내려 했을 때,",[]],["the great ape would help the experimenter open the second box,","유인원은 실험자가 두 번째 상자를 열도록 도왔는데,",[["help + 목적어 + 동사원형","g1-4"]]],["which it knew the object had been transferred to.","유인원은 물건이 그곳으로 옮겨졌음을 알고 있었다.",[]]],"mnote":"help + 목적어 + 동사원형: 필기: help는 5형식으로 쓰여 목적어 뒤에 동사원형 또는 to부정사를 받는다. which절의 it은 유인원을 가리킨다.","isSummary":false},{"title":"문장 5 · 지각동사 see의 목적격 보어","en":"<span class=\"ul\">However</span>, most apes in the study did not help the first experimenter open the second box <b class=\"sl\">/</b> if the first experimenter was still in the room <b class=\"sl\">/</b> to see the second experimenter <span class=\"an ul\" data-n=\"지각동사 see의 목적격 보어\"><span class=\"an-word\">move</span></span> the item.","tr":"하지만 연구의 대부분의 유인원은 첫 실험자가 두 번째 상자를 열도록 돕지 않았다 첫 실험자가 방에 계속 있어서 두 번째 실험자가 물건을 옮기는 것을 본 경우에는.","sv":[["S","most apes","주어"],["V","did not help","동사"],["O","the first experimenter","목적어"],["X","open the second box","절·구조"],["M","if ... to see the second experimenter move the item","수식어"]],"chunks":[["However, most apes in the study did not help the first experimenter open the second box","하지만 연구의 대부분의 유인원은 첫 실험자가 두 번째 상자를 열도록 돕지 않았다",[]],["if the first experimenter was still in the room","첫 실험자가 방에 계속 있어서",[]],["to see the second experimenter move the item.","두 번째 실험자가 물건을 옮기는 것을 본 경우에는.",[["지각동사 see의 목적격 보어","g1-5"]]]],"mnote":"지각동사 see의 목적격 보어: 필기: see + 목적어 + 동사원형 move이며 moving도 가능하다. to move는 이 구조의 목적격 보어로 쓸 수 없다.","isSummary":false},{"title":"문장 6 · 복수 주어와 명사절 목적어","en":"<span class=\"st\">The findings</span> <span class=\"an ul\" data-n=\"복수 주어와 명사절 목적어\"><span class=\"an-word\">show</span></span> <b class=\"sl\">/</b> the great apes understood when the first experimenter still thought the item was where he or she last left it.","tr":"연구 결과는 유인원들이 첫 실험자가 물건이 마지막으로 둔 곳에 있다고 여전히 생각하는 상황을 이해했음을 보여 준다.","sv":[["S","The findings","주어"],["V","show","동사"],["O","(that) the great apes understood ...","목적어"]],"chunks":[["The findings show","연구 결과는 보여 준다",[["복수 주어와 명사절 목적어","g1-6"]]],["the great apes understood when the first experimenter still thought the item was where he or she last left it.","유인원들이 첫 실험자가 물건이 마지막으로 둔 곳에 있다고 여전히 생각하는 상황을 이해했음을.",[]]],"mnote":"복수 주어와 명사절 목적어: 필기에서 주제로 표시한 문장이다. findings는 복수이므로 show이며 뒤에는 목적어절의 that이 생략되어 있다.","isSummary":false},{"title":"요약문 · 본문 전체의 핵심","en":"According to the study, great apes can distinguish <span class=\"an ul\" data-n=\"요약문의 여부 명사절\"><span class=\"an-word\">whether</span></span> or not people have a(n) false belief about reality <b class=\"sl\">/</b> and use this understanding to help people.","tr":"이 연구에 따르면 유인원은 사람이 현실에 대해 잘못된 믿음을 갖는지 구별하고 이러한 이해를 사람을 돕는 데 사용할 수 있다.","sv":[["S","great apes","주어"],["V","can distinguish / use","동사"],["O","whether or not ... / this understanding","목적어"],["M","to help people","수식어"]],"chunks":[["According to the study, great apes can distinguish whether or not people have a(n) false belief about reality","이 연구에 따르면 유인원은 사람이 현실에 대해 잘못된 믿음을 갖는지 구별하고",[["요약문의 여부 명사절","g1-7"]]],["and use this understanding to help people.","이러한 이해를 사람을 돕는 데 사용할 수 있다.",[]]],"mnote":"요약문의 여부 명사절: whether or not은 ‘~인지 아닌지’를 뜻한다. distinguish와 use가 can을 공유하며 본문 실험을 능력과 활용이라는 두 요소로 압축한다.","isSummary":true}],"grammar":[{"group":"문장 1","items":[{"id":"g1-1","title":"분사의 능동과 긴 주어","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>At the Leipzig Zoo in Germany, 34 zoo chimpanzees and orangutans <mark>participating</mark> in a study were each individually tested in a room, where they were put in front of two boxes.</div><div class=\"def-box\">participating은 유인원이 연구에 참여하는 능동 관계를 나타낸다. 주어는 chimpanzees and orangutans이므로 주절 동사는 were이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[participating / participated]</span></div>"}]},{"group":"문장 2","items":[{"id":"g1-2","title":"조동사 뒤 병렬 동사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>An experimenter would place an object inside one box and <mark>leave</mark> the room.</div><div class=\"def-box\">would 뒤에 place와 leave가 and로 병렬 연결되어 모두 동사원형을 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[leave / leaving]</span></div>"}]},{"group":"문장 3","items":[{"id":"g1-3","title":"세 동사의 병렬","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>Another experimenter would enter the room, <mark>move</mark> the object into the other box and exit.</div><div class=\"def-box\">enter, move, exit가 would를 공유한다. 물건을 옮긴 사람은 두 번째 실험자이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[move / moving]</span></div>"}]},{"group":"문장 4","items":[{"id":"g1-4","title":"help + 목적어 + 동사원형","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>When the first experimenter returned and tried retrieving the object from the first box, the great ape would help the experimenter <mark>open</mark> the second box, which it knew the object had been transferred to.</div><div class=\"def-box\">필기: help는 5형식으로 쓰여 목적어 뒤에 동사원형 또는 to부정사를 받는다. which절의 it은 유인원을 가리킨다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[open / opening]</span></div>"}]},{"group":"문장 5","items":[{"id":"g1-5","title":"지각동사 see의 목적격 보어","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>However, most apes in the study did not help the first experimenter open the second box if the first experimenter was still in the room to see the second experimenter <mark>move</mark> the item.</div><div class=\"def-box\">필기: see + 목적어 + 동사원형 move이며 moving도 가능하다. to move는 이 구조의 목적격 보어로 쓸 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[move / to move]</span></div>"}]},{"group":"문장 6","items":[{"id":"g1-6","title":"복수 주어와 명사절 목적어","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>The findings <mark>show</mark> the great apes understood when the first experimenter still thought the item was where he or she last left it.</div><div class=\"def-box\">필기에서 주제로 표시한 문장이다. findings는 복수이므로 show이며 뒤에는 목적어절의 that이 생략되어 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[show / shows]</span></div>"}]},{"group":"문장 7","items":[{"id":"g1-7","title":"요약문의 여부 명사절","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>According to the study, great apes can distinguish <mark>whether</mark> or not people have a(n) false belief about reality and use this understanding to help people.</div><div class=\"def-box\">whether or not은 ‘~인지 아닌지’를 뜻한다. distinguish와 use가 can을 공유하며 본문 실험을 능력과 활용이라는 두 요소로 압축한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[whether / that]</span></div>"}]}],"originalNumber":16,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>두 상자 앞에서 침팬지·오랑우탄을 개별 실험함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>첫 실험자가 없을 때 다른 사람이 물건을 옮김</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>옮긴 것을 모르는 실험자에게는 두 번째 상자를 열어 줌</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>이동을 본 실험자에게는 같은 도움을 주지 않음</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">According to the study, great apes can distinguish whether or not people have a(n) false belief about reality and use this understanding to help people.</div><p>이 연구에 따르면 유인원은 사람이 현실에 대해 잘못된 믿음을 갖는지 구별하고 이러한 이해를 사람을 돕는 데 사용할 수 있다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">false belief</td><td>문장 4: 첫 실험자가 돌아와 첫 상자에서 물건을 꺼내려 했을 때, 유인원은 실험자가 두 번째 상자를 열도록 도왔는데, 유인원은 물건이 그곳으로 옮겨졌음을 알고 있었다. / 문장 5: 하지만 연구의 대부분의 유인원은 첫 실험자가 두 번째 상자를 열도록 돕지 않았다 첫 실험자가 방에 계속 있어서 두 번째 실험자가 물건을 옮기는 것을 본 경우에는. / 문장 6: 연구 결과는 유인원들이 첫 실험자가 물건이 마지막으로 둔 곳에 있다고 여전히 생각하는 상황을 이해했음을 보여 준다.</td></tr><tr><td class=\"en\">help</td><td>문장 4: 첫 실험자가 돌아와 첫 상자에서 물건을 꺼내려 했을 때, 유인원은 실험자가 두 번째 상자를 열도록 도왔는데, 유인원은 물건이 그곳으로 옮겨졌음을 알고 있었다. / 문장 5: 하지만 연구의 대부분의 유인원은 첫 실험자가 두 번째 상자를 열도록 돕지 않았다 첫 실험자가 방에 계속 있어서 두 번째 실험자가 물건을 옮기는 것을 본 경우에는.</td></tr></tbody></table></div><div class=\"note\">실제 위치를 아는지 모르는지에 따라 도움 행동이 달라진다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-16","lesson":15,"type":"요약","title":"음악은 어떻게 슬픔을 전할까","source":"2020년 9월 40번","page":64,"summary":"음악의 감정 표현을 문화적으로 학습한 연관으로 보는 입장과 음악·감정의 유사성으로 보는 입장을 대비한다.","footnote":"","sents":[{"title":"문장 1 · 수식절을 제외한 주어의 핵","en":"One way that music could express emotion <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"수식절을 제외한 주어의 핵\"><span class=\"an-word\">is</span></span> simply through a <span class=\"ci st\">learned</span> association.","tr":"음악이 감정을 표현할 수 있는 한 방법은 단순히 학습된 연관을 통해서이다.","sv":[["S","One way that music could express emotion","주어"],["V","is","동사"],["C","through a learned association","보어"]],"chunks":[["One way that music could express emotion","음악이 감정을 표현할 수 있는 한 방법은",[]],["is simply through a learned association.","단순히 학습된 연관을 통해서이다.",[["수식절을 제외한 주어의 핵","g2-1"]]]],"mnote":"수식절을 제외한 주어의 핵: 필기: 주어의 핵은 단수 One way이다. that music could express emotion은 way를 수식하므로 동사는 is이다.","isSummary":false},{"title":"문장 2 · 음악을 수식하는 수동 분사","en":"Perhaps there is nothing naturally sad <b class=\"sl\">/</b> about a piece of music in a minor key, or <span class=\"an ul\" data-n=\"음악을 수식하는 수동 분사\"><span class=\"an-word\">played</span></span> slowly with low notes.","tr":"단조이거나 낮은 음으로 느리게 연주되는 악곡에 본질적으로 슬픈 무언가가 있는 것은 아닐 것이다.","sv":[["X","there is nothing naturally sad","절·구조"],["M","about a piece of music in a minor key, or played slowly with low notes","수식어"]],"chunks":[["Perhaps there is nothing naturally sad","아마 본질적으로 슬픈 무언가가 있는 것은 아닐 것이다",[]],["about a piece of music in a minor key, or played slowly with low notes.","단조이거나 낮은 음으로 느리게 연주되는 악곡에.",[["음악을 수식하는 수동 분사","g2-2"]]]],"mnote":"음악을 수식하는 수동 분사: 악곡은 연주되는 대상이므로 played를 쓴다. nothing naturally sad에서는 형용사 sad가 nothing을 뒤에서 수식한다.","isSummary":false},{"title":"문장 3 · learn to V와 associate A with B","en":"Maybe we have just come to hear certain kinds of music as sad <b class=\"sl\">/</b> because we have learned <span class=\"an ul\" data-n=\"learn to V와 associate A with B\"><span class=\"an-word\">to associate</span></span> them in our culture with sad events like funerals.","tr":"우리가 문화 속에서 음악을 장례식 같은 슬픈 일과 연관시키는 것을 학습했기 때문에 어떤 종류의 음악을 슬프게 듣게 되었을 뿐일지도 모른다.","sv":[["S","we","주어"],["V","have come to hear","동사"],["O","certain kinds of music","목적어"],["X","as sad","절·구조"],["M","because we have learned to associate ...","수식어"]],"chunks":[["Maybe we have just come to hear certain kinds of music as sad","우리는 어떤 종류의 음악을 슬프게 듣게 되었을 뿐일지도 모른다",[]],["because we have learned to associate them in our culture with sad events like funerals.","문화 속에서 그것들을 장례식 같은 슬픈 일과 연관시키는 것을 학습했기 때문이다.",[["learn to V와 associate A with B","g2-3"]]]],"mnote":"learn to V와 associate A with B: learn to associate는 ‘연관시키는 것을 배우다’이며 associate them with sad events에서 them은 음악을 받는다.","isSummary":false},{"title":"문장 4 · have difficulty (in) -ing","en":"If this view is correct, <b class=\"sl\">/</b> we should have difficulty <span class=\"an ul\" data-n=\"have difficulty (in) -ing\"><span class=\"an-word\">interpreting</span></span> the emotions expressed in culturally unfamiliar music.","tr":"이 관점이 옳다면 우리는 문화적으로 친숙하지 않은 음악에 표현된 감정을 이해하는 데 어려움이 있을 것이다.","sv":[["M","If this view is correct","수식어"],["S","we","주어"],["V","should have","동사"],["O","difficulty interpreting the emotions ...","목적어"]],"chunks":[["If this view is correct,","이 관점이 옳다면",[]],["we should have difficulty interpreting the emotions expressed in culturally unfamiliar music.","우리는 문화적으로 친숙하지 않은 음악에 표현된 감정을 이해하는 데 어려움이 있을 것이다.",[["have difficulty (in) -ing","g2-4"]]]],"mnote":"have difficulty (in) -ing: 필기: difficulty 뒤의 in은 생략 가능하며 interpreting은 동명사이다. expressed는 감정이 표현된 수동 관계이다.","isSummary":false},{"title":"문장 5 · 보어 강조에 따른 도치","en":"Totally <span class=\"an ul ci st\" data-n=\"보어 강조에 따른 도치\"><span class=\"an-word\">opposed</span></span> to this view is the position <b class=\"sl\">/</b> that the link between music and emotion is one of <span class=\"ci st\">resemblance</span>.","tr":"이 관점에 완전히 반대되는 것은 음악과 감정의 연결 고리가 유사성이라는 입장이다.","sv":[["C","Totally opposed to this view","보어"],["V","is","동사"],["S","the position","주어"],["X","that the link between music and emotion is one of resemblance","절·구조"]],"chunks":[["Totally opposed to this view is the position","이 관점에 완전히 반대되는 것은 입장이다",[["보어 강조에 따른 도치","g2-5"]]],["that the link between music and emotion is one of resemblance.","음악과 감정의 연결 고리가 유사성이라는.",[]]],"mnote":"보어 강조에 따른 도치: 필기: C+V+S 순서이다. 원래 주어는 the position이고 Totally opposed to this view가 앞으로 나온 보어이다. that절은 position의 내용이다.","isSummary":false},{"title":"문장 6 · 동사를 수식하는 부사","en":"For example, when we feel sad <b class=\"sl\">/</b> we move <span class=\"an ul\" data-n=\"동사를 수식하는 부사\"><span class=\"an-word\">slowly</span></span> and speak slowly and in a low-pitched voice.","tr":"예를 들어 슬프다고 느낄 때 우리는 느리게 움직이고 느리게 낮은 목소리로 말한다.","sv":[["M","when we feel sad","수식어"],["S","we","주어"],["V","move / speak","동사"],["M","slowly / in a low-pitched voice","수식어"]],"chunks":[["For example, when we feel sad","예를 들어 슬프다고 느낄 때",[]],["we move slowly and speak slowly and in a low-pitched voice.","우리는 느리게 움직이고 느리게 낮은 목소리로 말한다.",[["동사를 수식하는 부사","g2-6"]]]],"mnote":"동사를 수식하는 부사: move와 speak를 수식하므로 slowly이다. low-pitched는 명사 voice를 수식하는 형용사이다.","isSummary":false},{"title":"문장 7 · as 뒤의 형용사 상태","en":"Thus when we hear slow, low music, <b class=\"sl\">/</b> we hear it as <span class=\"an ul\" data-n=\"as 뒤의 형용사 상태\"><span class=\"an-word\">sad</span></span>.","tr":"따라서 느리고 낮은 음의 음악을 들을 때 우리는 그것을 슬프게 듣는다.","sv":[["M","when we hear slow, low music","수식어"],["S","we","주어"],["V","hear","동사"],["O","it","목적어"],["X","as sad","절·구조"]],"chunks":[["Thus when we hear slow, low music,","따라서 느리고 낮은 음의 음악을 들을 때",[]],["we hear it as sad.","우리는 그것을 슬프게 듣는다.",[["as 뒤의 형용사 상태","g2-7"]]]],"mnote":"as 뒤의 형용사 상태: hear it as sad는 ‘그 음악을 슬픈 것으로 듣다’이다. sad는 음악의 성격을 나타내고 hear의 방식을 나타내는 sadly와 다르다.","isSummary":false},{"title":"문장 8 · difficulty (in) -ing와 little","en":"If this view is correct, <b class=\"sl\">/</b> we should have little difficulty <span class=\"an ul\" data-n=\"difficulty (in) -ing와 little\"><span class=\"an-word\">understanding</span></span> the emotion expressed in culturally unfamiliar music.","tr":"이 관점이 옳다면 문화적으로 친숙하지 않은 음악에 표현된 감정을 이해하는 데 어려움이 거의 없을 것이다.","sv":[["M","If this view is correct","수식어"],["S","we","주어"],["V","should have","동사"],["O","little difficulty understanding ...","목적어"]],"chunks":[["If this view is correct,","이 관점이 옳다면",[]],["we should have little difficulty understanding the emotion expressed in culturally unfamiliar music.","문화적으로 친숙하지 않은 음악에 표현된 감정을 이해하는 데 어려움이 거의 없을 것이다.",[["difficulty (in) -ing와 little","g2-8"]]]],"mnote":"difficulty (in) -ing와 little: 필기: understanding은 동명사이다. little difficulty는 ‘어려움이 거의 없음’이므로 앞 관점의 예측과 반대이다.","isSummary":false},{"title":"요약문 · 본문 전체의 핵심","en":"It is believed that emotion expressed in music can be <span class=\"an ul\" data-n=\"조동사를 포함한 수동태\"><span class=\"an-word\">understood</span></span> through a culturally learned association <b class=\"sl\">/</b> or it can be understood due to the similarity between music and emotion.","tr":"음악에 표현된 감정은 문화적으로 학습된 연관을 통해 이해할 수 있다고 믿어지거나 음악과 감정 사이의 유사성 때문에 이해할 수 있다고 믿어진다.","sv":[["S","It (가주어)","주어"],["V","is believed","동사"],["X","that emotion ... can be understood ... or it can be understood ... (진주어)","절·구조"]],"chunks":[["It is believed that emotion expressed in music can be understood through a culturally learned association","음악에 표현된 감정은 문화적으로 학습된 연관을 통해 이해할 수 있다고 믿어지거나",[["조동사를 포함한 수동태","g2-9"]]],["or it can be understood due to the similarity between music and emotion.","음악과 감정 사이의 유사성 때문에 이해할 수 있다고 믿어진다.",[["조동사를 포함한 수동태","g2-9"]]]],"mnote":"조동사를 포함한 수동태: 감정은 이해되는 대상이므로 can be understood이다. 요약문은 or로 서로 다른 두 설명을 나란히 압축한다.","isSummary":true}],"grammar":[{"group":"문장 1","items":[{"id":"g2-1","title":"수식절을 제외한 주어의 핵","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>One way that music could express emotion <mark>is</mark> simply through a learned association.</div><div class=\"def-box\">필기: 주어의 핵은 단수 One way이다. that music could express emotion은 way를 수식하므로 동사는 is이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is / are]</span></div>"}]},{"group":"문장 2","items":[{"id":"g2-2","title":"음악을 수식하는 수동 분사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>Perhaps there is nothing naturally sad about a piece of music in a minor key, or <mark>played</mark> slowly with low notes.</div><div class=\"def-box\">악곡은 연주되는 대상이므로 played를 쓴다. nothing naturally sad에서는 형용사 sad가 nothing을 뒤에서 수식한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[played / playing]</span></div>"}]},{"group":"문장 3","items":[{"id":"g2-3","title":"learn to V와 associate A with B","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>Maybe we have just come to hear certain kinds of music as sad because we have learned <mark>to associate</mark> them in our culture with sad events like funerals.</div><div class=\"def-box\">learn to associate는 ‘연관시키는 것을 배우다’이며 associate them with sad events에서 them은 음악을 받는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to associate / associating]</span></div>"}]},{"group":"문장 4","items":[{"id":"g2-4","title":"have difficulty (in) -ing","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>If this view is correct, we should have difficulty <mark>interpreting</mark> the emotions expressed in culturally unfamiliar music.</div><div class=\"def-box\">필기: difficulty 뒤의 in은 생략 가능하며 interpreting은 동명사이다. expressed는 감정이 표현된 수동 관계이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[interpreting / to interpret]</span></div>"}]},{"group":"문장 5","items":[{"id":"g2-5","title":"보어 강조에 따른 도치","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>Totally <mark>opposed</mark> to this view is the position that the link between music and emotion is one of resemblance.</div><div class=\"def-box\">필기: C+V+S 순서이다. 원래 주어는 the position이고 Totally opposed to this view가 앞으로 나온 보어이다. that절은 position의 내용이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[opposed / opposing]</span></div>"}]},{"group":"문장 6","items":[{"id":"g2-6","title":"동사를 수식하는 부사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>For example, when we feel sad we move <mark>slowly</mark> and speak slowly and in a low-pitched voice.</div><div class=\"def-box\">move와 speak를 수식하므로 slowly이다. low-pitched는 명사 voice를 수식하는 형용사이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[slowly / slow]</span></div>"}]},{"group":"문장 7","items":[{"id":"g2-7","title":"as 뒤의 형용사 상태","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Thus when we hear slow, low music, we hear it as <mark>sad</mark>.</div><div class=\"def-box\">hear it as sad는 ‘그 음악을 슬픈 것으로 듣다’이다. sad는 음악의 성격을 나타내고 hear의 방식을 나타내는 sadly와 다르다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[sad / sadly]</span></div>"}]},{"group":"문장 8","items":[{"id":"g2-8","title":"difficulty (in) -ing와 little","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>If this view is correct, we should have little difficulty <mark>understanding</mark> the emotion expressed in culturally unfamiliar music.</div><div class=\"def-box\">필기: understanding은 동명사이다. little difficulty는 ‘어려움이 거의 없음’이므로 앞 관점의 예측과 반대이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[understanding / to understand]</span></div>"}]},{"group":"문장 9","items":[{"id":"g2-9","title":"조동사를 포함한 수동태","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>It is believed that emotion expressed in music can be <mark>understood</mark> through a culturally learned association or it can be understood due to the similarity between music and emotion.</div><div class=\"def-box\">감정은 이해되는 대상이므로 can be understood이다. 요약문은 or로 서로 다른 두 설명을 나란히 압축한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[understood / understanding]</span></div>"}]}],"originalNumber":17,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>학습된 연관: 장례식 등의 문화 경험과 음악이 연결됨</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>이 입장이 맞으면 낯선 문화 음악의 감정 해석은 어려움</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>유사성: 슬플 때의 느린 움직임·낮은 목소리와 닮음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>이 입장이 맞으면 낯선 음악도 감정 이해가 어렵지 않음</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">It is believed that emotion expressed in music can be understood through a culturally learned association or it can be understood due to the similarity between music and emotion.</div><p>음악에 표현된 감정은 문화적으로 학습된 연관을 통해 이해할 수 있다고 믿어지거나 음악과 감정 사이의 유사성 때문에 이해할 수 있다고 믿어진다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">learned association</td><td>문장 1: 음악이 감정을 표현할 수 있는 한 방법은 단순히 학습된 연관을 통해서이다. / 문장 3: 우리가 문화 속에서 음악을 장례식 같은 슬픈 일과 연관시키는 것을 학습했기 때문에 어떤 종류의 음악을 슬프게 듣게 되었을 뿐일지도 모른다. / 문장 4: 이 관점이 옳다면 우리는 문화적으로 친숙하지 않은 음악에 표현된 감정을 이해하는 데 어려움이 있을 것이다.</td></tr><tr><td class=\"en\">similarity</td><td>문장 5: 이 관점에 완전히 반대되는 것은 음악과 감정의 연결 고리가 유사성이라는 입장이다. / 문장 6: 예를 들어 슬프다고 느낄 때 우리는 느리게 움직이고 느리게 낮은 목소리로 말한다. / 문장 7: 따라서 느리고 낮은 음의 음악을 들을 때 우리는 그것을 슬프게 듣는다. / 문장 8: 이 관점이 옳다면 문화적으로 친숙하지 않은 음악에 표현된 감정을 이해하는 데 어려움이 거의 없을 것이다.</td></tr></tbody></table></div><div class=\"note\">문화 학습과 음악·감정의 닮음이라는 두 관점을 모두 요약해야 한다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-17","lesson":15,"type":"요약","title":"가치를 적는 일기가 삶을 바꾼다","source":"2022년 11월 40번","page":65,"summary":"개인적 가치를 기준으로 일상을 성찰하는 일기는 경험을 새롭게 해석하게 하여 삶의 의미를 느끼게 한다.","footnote":"","sents":[{"title":"문장 1 · one of + 복수명사 주어","en":"One of the most powerful tools to find meaning in our lives <span class=\"an ul\" data-n=\"one of + 복수명사 주어\"><span class=\"an-word\">is</span></span> <span class=\"an\" data-n=\"성찰적\"><span class=\"an-word\">reflective</span></span> journaling <b class=\"sl\">/</b> — thinking back on and writing about what has happened to us.","tr":"우리 삶의 의미를 찾는 가장 강력한 도구 중 하나는 성찰적 일기 쓰기이다 — 우리에게 일어난 일을 돌아보고 그것에 대해 쓰는 것이다.","sv":[["S","One of the most powerful tools ...","주어"],["V","is","동사"],["C","reflective journaling","보어"],["X","thinking back on and writing about what has happened to us","절·구조"]],"chunks":[["One of the most powerful tools to find meaning in our lives is reflective journaling","우리 삶의 의미를 찾는 가장 강력한 도구 중 하나는 성찰적 일기 쓰기이다",[["one of + 복수명사 주어","g3-1"]]],["— thinking back on and writing about what has happened to us.","— 우리에게 일어난 일을 돌아보고 그것에 대해 쓰는 것이다.",[]]],"mnote":"one of + 복수명사 주어: 필기: 주어의 핵은 One이므로 동사는 is이다. tools가 복수여도 주절 동사를 are로 바꾸지 않는다.","isSummary":false},{"title":"문장 2 · ask + 목적어 + to부정사","en":"In the 1990s, Stanford University researchers asked <span class=\"an\" data-n=\"대학생\"><span class=\"an-word\">undergraduate students</span></span> on spring break <span class=\"an ul\" data-n=\"ask + 목적어 + to부정사\"><span class=\"an-word\">to journal</span></span> about their most important personal values and their daily activities; <b class=\"sl\">/</b> others were asked to write about only the good things that happened to them in the day.","tr":"1990년대 Stanford University 연구자들은 봄방학 중인 학부생들에게 가장 중요한 개인 가치와 하루의 활동을 쓰도록 요청했다. 다른 학생들에게는 그날 있었던 좋은 일만 쓰도록 요청했다.","sv":[["S","researchers / others","주어"],["V","asked / were asked","동사"],["O","undergraduate students","목적어"],["X","to journal ... / to write ...","절·구조"]],"chunks":[["In the 1990s, Stanford University researchers asked undergraduate students on spring break to journal about their most important personal values and their daily activities;","1990년대 Stanford University 연구자들은 봄방학 중인 학부생들에게 가장 중요한 개인 가치와 하루의 활동을 쓰도록 요청했다.",[["ask + 목적어 + to부정사","g3-2"]]],["others were asked to write about only the good things that happened to them in the day.","다른 학생들에게는 그날 있었던 좋은 일만 쓰도록 요청했다.",[]]],"mnote":"ask + 목적어 + to부정사: 필기: asked students to journal에서 to부정사는 목적격 보어이며 수동태 others were asked to write에서도 to를 유지한다.","isSummary":false},{"title":"문장 3 · 선행사가 있는 관계대명사","en":"Three weeks later, the students <span class=\"an ul\" data-n=\"선행사가 있는 관계대명사\"><span class=\"an-word\">who</span></span> had written about their values were happier, healthier, and more confident about their ability to handle stress <b class=\"sl\">/</b> than the ones who had only focused on the good stuff.","tr":"3주 뒤 자신의 가치를 쓴 학생들은 더 행복하고 건강하며 스트레스 대처 능력에 자신이 있었다 좋은 일만 쓴 학생들보다.","sv":[["S","the students who had written about their values","주어"],["V","were","동사"],["C","happier, healthier, and more confident","보어"],["M","than the ones ...","수식어"]],"chunks":[["Three weeks later, the students who had written about their values were happier, healthier, and more confident about their ability to handle stress","3주 뒤 자신의 가치를 쓴 학생들은 더 행복하고 건강하며 스트레스 대처 능력에 자신이 있었다",[["선행사가 있는 관계대명사","g3-3"]]],["than the ones who had only focused on the good stuff.","좋은 일만 쓴 학생들보다.",[["선행사가 있는 관계대명사","g3-3"]]]],"mnote":"선행사가 있는 관계대명사: students와 ones가 선행사이므로 이를 수식하는 who를 쓴다. had written은 비교 시점 이전의 일기 쓰기를 나타낸다.","isSummary":false},{"title":"문장 4 · 전치사 by 뒤 동명사","en":"By <span class=\"an ul\" data-n=\"전치사 by 뒤 동명사\"><span class=\"an-word\">reflecting</span></span> on how their daily activities supported their values, <b class=\"sl\">/</b> students had gained a new perspective on those activities and choices.","tr":"일상의 활동이 자신의 가치를 어떻게 뒷받침하는지 성찰함으로써 학생들은 그 활동과 선택에 대한 새로운 관점을 얻었다.","sv":[["M","By reflecting on how ...","수식어"],["S","students","주어"],["V","had gained","동사"],["O","a new perspective","목적어"]],"chunks":[["By reflecting on how their daily activities supported their values,","일상의 활동이 자신의 가치를 어떻게 뒷받침하는지 성찰함으로써",[["전치사 by 뒤 동명사","g3-4"]]],["students had gained a new perspective on those activities and choices.","학생들은 그 활동과 선택에 대한 새로운 관점을 얻었다.",[]]],"mnote":"전치사 by 뒤 동명사: by reflecting은 수단을 나타낸다. how절은 전치사 on의 목적어이며 평서문 어순이다.","isSummary":false},{"title":"문장 5 · and로 연결된 복수 주어","en":"Little stresses and <span class=\"an\" data-n=\"귀찮은 일\"><span class=\"an-word\">hassles</span></span> <span class=\"an ul\" data-n=\"and로 연결된 복수 주어\"><span class=\"an-word\">were</span></span> now demonstrations <b class=\"sl\">/</b> of their values in action.","tr":"작은 스트레스와 귀찮은 일들은 이제 자신의 가치가 행동으로 실현되는 것을 보여 주는 것이었다.","sv":[["S","Little stresses and hassles","주어"],["V","were","동사"],["C","demonstrations of their values in action","보어"]],"chunks":[["Little stresses and hassles were now demonstrations","작은 스트레스와 귀찮은 일들은 이제 보여 주는 것이었다",[["and로 연결된 복수 주어","g3-5"]]],["of their values in action.","자신의 가치가 행동으로 실현되는 것을.",[]]],"mnote":"and로 연결된 복수 주어: stresses and hassles를 복수로 받아 were를 쓴다. 필기: hassles는 귀찮은 일이라는 뜻이다.","isSummary" "isSummary":false},{"title":"문장 3 · have to 수동태","en":"However, these approaches had to <span class=\"an ul\" data-n=\"have to 수동태\"><span class=\"an-word\">be modified</span></span> <b class=\"sl\">/</b> to account for the differences between genetic and cultural transmission.","tr":"하지만 이러한 접근법은 유전 전달과 문화 전파의 차이를 설명하기 위해 수정되어야 했다.","sv":[["S","these approaches","주어"],["V","had to be modified","동사"],["M","to account for the differences ...","수식어"]],"chunks":[["However, these approaches had to be modified","하지만 이러한 접근법은 수정되어야 했다",[["have to 수동태","g6-3"]]],["to account for the differences between genetic and cultural transmission.","유전 전달과 문화 전파의 차이를 설명하기 위해.",[]]],"mnote":"have to 수동태: 접근법은 수정되는 대상이므로 had to be modified이다. account for는 설명하다는 필기가 있다.","isSummary":false},{"title":"문장 4 · expect + O + to부정사","en":"For example, we do not expect the cultural transmission <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"expect + O + to부정사\"><span class=\"an-word\">to follow</span></span> the rules of genetic transmission <span class=\"an\" data-n=\"엄격히\"><span class=\"an-word\">strictly</span></span>.","tr":"예를 들어 우리는 문화 전파가 유전 전달의 규칙을 엄격하게 따를 것이라고 예상하지 않는다.","sv":[["S","we","주어"],["V","do not expect","동사"],["O","the cultural transmission","목적어"],["X","to follow the rules ...","절·구조"]],"chunks":[["For example, we do not expect the cultural transmission","예를 들어 우리는 문화 전파가",[]],["to follow the rules of genetic transmission strictly.","유전 전달의 규칙을 엄격하게 따를 것이라고 예상하지 않는다.",[["expect + O + to부정사","g6-4"]]]],"mnote":"expect + O + to부정사: expect 뒤에 목적어와 to부정사 목적격 보어가 온다. strictly는 따르는 방식을 나타낸다.","isSummary":false},{"title":"문장 5 · be likely to V","en":"If two biological parents have different forms of a cultural trait, <b class=\"sl\">/</b> their child is not necessarily equally likely <span class=\"an ul\" data-n=\"be likely to V\"><span class=\"an-word\">to acquire</span></span> the mother’s or father’s form of that trait.","tr":"생물학적 두 부모의 문화적 특성이 서로 다르다면 아이가 어머니 또는 아버지의 특성을 얻을 확률이 반드시 같은 것은 아니다.","sv":[["M","If ...","수식어"],["S","their child","주어"],["V","is","동사"],["C","not necessarily equally likely to acquire ...","보어"]],"chunks":[["If two biological parents have different forms of a cultural trait,","생물학적 두 부모의 문화적 특성이 서로 다르다면",[]],["their child is not necessarily equally likely to acquire the mother’s or father’s form of that trait.","아이가 어머니 또는 아버지의 특성을 얻을 확률이 반드시 같은 것은 아니다.",[["be likely to V","g6-5"]]]],"mnote":"be likely to V: be likely to acquire는 획득할 가능성을 나타낸다. not necessarily는 ‘반드시 그런 것은 아니다’라는 부분부정이다.","isSummary":false},{"title":"문장 6 · not only A but also B 병렬","en":"Further, a child can acquire cultural traits not only from its parents but also <span class=\"an ul\" data-n=\"not only A but also B 병렬\"><span class=\"an-word\">from nonparental adults and peers</span></span>; <b class=\"sl\">/</b> thus, the frequency of a cultural trait in the population is <span class=\"an ci st\" data-n=\"유의미한 = meaningful\"><span class=\"an-word\">relevant</span></span> beyond just the probability that an individual’s parents had that trait.","tr":"더욱이 아이는 부모뿐 아니라 부모가 아닌 성인과 또래로부터도 문화적 특성을 얻을 수 있다. 따라서 집단 내 문화 특성의 빈도는 부모가 그 특성을 가졌을 확률을 넘어 유의미하다.","sv":[["S","a child / the frequency of a cultural trait","주어"],["V","can acquire / is","동사"],["O","cultural traits","목적어"],["C","relevant beyond just the probability ...","보어"]],"chunks":[["Further, a child can acquire cultural traits not only from its parents but also from nonparental adults and peers;","더욱이 아이는 부모뿐 아니라 부모가 아닌 성인과 또래로부터도 문화적 특성을 얻을 수 있다.",[["not only A but also B 병렬","g6-6"]]],["thus, the frequency of a cultural trait in the population is relevant beyond just the probability that an individual’s parents had that trait.","따라서 집단 내 문화 특성의 빈도는 부모가 그 특성을 가졌을 확률을 넘어 유의미하다.",[]]],"mnote":"not only A but also B 병렬: from its parents와 from nonparental adults and peers가 대칭이다. 필기: relevant는 meaningful, 유의미한이다.","isSummary":false},{"title":"요약문 · 본문 전체의 핵심","en":"Early cultural evolution models used the similarity between culture and genes <b class=\"sl\">/</b> but had to be revised <span class=\"an ul\" data-n=\"이유를 나타내는 since\"><span class=\"an-word\">since</span></span> cultural transmission allows for more diverse factors than genetic transmission.","tr":"초기 문화 진화 모델은 문화와 유전자 사이의 유사성을 사용했지만 문화 전파가 유전 전달보다 더 다양한 요인을 허용하기 때문에 수정되어야 했다.","sv":[["S","Early cultural evolution models","주어"],["V","used / had to be revised","동사"],["O","the similarity ...","목적어"],["M","since cultural transmission allows for ...","수식어"]],"chunks":[["Early cultural evolution models used the similarity between culture and genes","초기 문화 진화 모델은 문화와 유전자 사이의 유사성을 사용했지만",[]],["but had to be revised since cultural transmission allows for more diverse factors than genetic transmission.","문화 전파가 유전 전달보다 더 다양한 요인을 허용하기 때문에 수정되어야 했다.",[["이유를 나타내는 since","g6-7"]]]],"mnote":"이유를 나타내는 since: since절은 모델 수정의 이유를 나타낸다. 요약문은 초기 유사성과 수정이 필요한 차이를 함께 담는다.","isSummary":true}],"grammar":[{"group":"문장 1","items":[{"id":"g6-1","title":"by 뒤 동명사 병렬","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Many of the first models of cultural evolution drew noticeable connections between culture and genes by using concepts from theoretical population genetics and <mark>applying</mark> them to culture.</div><div class=\"def-box\">필기: using과 applying이 and로 병렬 연결되며 them은 concepts를 받는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[applying / apply]</span></div>"}]},{"group":"문장 2","items":[{"id":"g6-2","title":"핵심 주어 patterns 수 일치","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>Cultural patterns of transmission, innovation, and selection <mark>are</mark> conceptually likened to genetic processes of transmission, mutation, and selection.</div><div class=\"def-box\">필기: patterns는 복수이며 be likened to는 ‘~에 비유되다’라는 수동 표현이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / is]</span></div>"}]},{"group":"문장 3","items":[{"id":"g6-3","title":"have to 수동태","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>However, these approaches had to <mark>be modified</mark> to account for the differences between genetic and cultural transmission.</div><div class=\"def-box\">접근법은 수정되는 대상이므로 had to be modified이다. account for는 설명하다는 필기가 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[be modified / modify]</span></div>"}]},{"group":"문장 4","items":[{"id":"g6-4","title":"expect + O + to부정사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>For example, we do not expect the cultural transmission <mark>to follow</mark> the rules of genetic transmission strictly.</div><div class=\"def-box\">expect 뒤에 목적어와 to부정사 목적격 보어가 온다. strictly는 따르는 방식을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to follow / following]</span></div>"}]},{"group":"문장 5","items":[{"id":"g6-5","title":"be likely to V","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>If two biological parents have different forms of a cultural trait, their child is not necessarily equally likely <mark>to acquire</mark> the mother’s or father’s form of that trait.</div><div class=\"def-box\">be likely to acquire는 획득할 가능성을 나타낸다. not necessarily는 ‘반드시 그런 것은 아니다’라는 부분부정이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to acquire / acquiring]</span></div>"}]},{"group":"문장 6","items":[{"id":"g6-6","title":"not only A but also B 병렬","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>Further, a child can acquire cultural traits not only from its parents but also <mark>from nonparental adults and peers</mark>; thus, the frequency of a cultural trait in the population is relevant beyond just the probability that an individual’s parents had that trait.</div><div class=\"def-box\">from its parents와 from nonparental adults and peers가 대칭이다. 필기: relevant는 meaningful, 유의미한이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[from nonparental adults and peers / to nonparental adults and peers]</span></div>"}]},{"group":"문장 7","items":[{"id":"g6-7","title":"이유를 나타내는 since","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Early cultural evolution models used the similarity between culture and genes but had to be revised <mark>since</mark> cultural transmission allows for more diverse factors than genetic transmission.</div><div class=\"def-box\">since절은 모델 수정의 이유를 나타낸다. 요약문은 초기 유사성과 수정이 필요한 차이를 함께 담는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[since / unless]</span></div>"}]}],"originalNumber":21,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>초기 모델은 집단 유전학 개념을 문화에 적용함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>전파·혁신·선택을 전달·돌연변이·선택에 비유함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>문화는 부모 외 성인·또래에게도 배울 수 있음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>문화의 다양한 전달 요인을 반영하도록 모델을 수정함</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">Early cultural evolution models used the similarity between culture and genes but had to be revised since cultural transmission allows for more diverse factors than genetic transmission.</div><p>초기 문화 진화 모델은 문화와 유전자 사이의 유사성을 사용했지만 문화 전파가 유전 전달보다 더 다양한 요인을 허용하기 때문에 수정되어야 했다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">similarity</td><td>문장 1: 문화 진화의 많은 초기 모델은 이론 집단 유전학의 개념을 사용하고 문화에 적용함으로써 문화와 유전자 사이에 주목할 만한 접점을 이끌어 냈다. / 문장 2: 전파, 혁신, 선택의 문화적 방식은 전달, 돌연변이, 선택의 유전적 과정에 개념적으로 비유된다.</td></tr><tr><td class=\"en\">diverse factors</td><td>문장 3: 하지만 이러한 접근법은 유전 전달과 문화 전파의 차이를 설명하기 위해 수정되어야 했다. / 문장 4: 예를 들어 우리는 문화 전파가 유전 전달의 규칙을 엄격하게 따를 것이라고 예상하지 않는다. / 문장 5: 생물학적 두 부모의 문화적 특성이 서로 다르다면 아이가 어머니 또는 아버지의 특성을 얻을 확률이 반드시 같은 것은 아니다. / 문장 6: 더욱이 아이는 부모뿐 아니라 부모가 아닌 성인과 또래로부터도 문화적 특성을 얻을 수 있다. 따라서 집단 내 문화 특성의 빈도는 부모가 그 특성을 가졌을 확률을 넘어 유의미하다.</td></tr></tbody></table></div><div class=\"note\">초기 유사성의 차용과 더 다양한 문화 전파 요인 때문에 필요한 수정이라는 대조이다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-21","lesson":15,"type":"요약","title":"오이를 던진 원숭이의 항의","source":"2024년 9월 40번","page":69,"summary":"원숭이는 자기 보상이 그대로여도 다른 원숭이와 비교하여 불평등을 느끼면 이익을 포기하고 보상을 거부한다.","footnote":"","sents":[{"title":"문장 1 · 복수 선행사 관계절","en":"Capuchins — New World Monkeys that <span class=\"an ul\" data-n=\"복수 선행사 관계절\"><span class=\"an-word\">live</span></span> in large social groups — <b class=\"sl\">/</b> will, <span class=\"br\">in captivity</span>, trade with people all day long, especially if food is involved.","tr":"큰 사회 집단에 사는 신세계원숭이 Capuchin은 갇힌 상태에서, 특히 먹이가 관련되면 온종일 사람과 거래한다.","sv":[["S","Capuchins","주어"],["X","New World Monkeys that live in large social groups","절·구조"],["V","will trade","동사"],["M","in captivity / with people ...","수식어"]],"chunks":[["Capuchins — New World Monkeys that live in large social groups —","큰 사회 집단에 사는 신세계원숭이 Capuchin은",[["복수 선행사 관계절","g7-1"]]],["will, in captivity, trade with people all day long, especially if food is involved.","갇힌 상태에서, 특히 먹이가 관련되면 온종일 사람과 거래한다.",[]]],"mnote":"복수 선행사 관계절: Monkeys가 복수이므로 관계절 동사는 live이다. 대시는 Capuchins를 부연한다.","isSummary":false},{"title":"문장 2 · 명사 수식 to부정사","en":"<span class=\"an\" data-n=\"원숭이\"><span class=\"an-word\">I</span></span> give you this rock <b class=\"sl\">/</b> and you give me a treat <span class=\"an ul\" data-n=\"명사 수식 to부정사\"><span class=\"an-word\">to eat</span></span>.","tr":"내가 네게 이 돌을 주고 너는 내게 먹을 간식을 준다.","sv":[["S","I / you","주어"],["V","give / give","동사"],["O","you this rock / me a treat","목적어"],["X","to eat (treat 수식)","절·구조"]],"chunks":[["I give you this rock","내가 네게 이 돌을 주고",[]],["and you give me a treat to eat.","너는 내게 먹을 간식을 준다.",[["명사 수식 to부정사","g7-2"]]]],"mnote":"명사 수식 to부정사: a treat to eat은 먹을 간식이다. 필기: I는 원숭이의 입장에서 하는 말이다.","isSummary":false},{"title":"문장 3 · 목적격 관계대명사 생략","en":"If you put two monkeys in cages next to each other, and offer them both slices of cucumber for the rocks <span class=\"an ul\" data-n=\"목적격 관계대명사 생략\"><span class=\"an-word\">they already have</span></span>, <b class=\"sl\">/</b> they will happily eat the cucumbers.","tr":"두 원숭이를 나란한 우리에 두고 이미 가진 돌의 대가로 둘 다 오이 조각을 받으면 그들은 오이를 기쁘게 먹을 것이다.","sv":[["M","If you put ... and offer ...","수식어"],["S","they","주어"],["V","will eat","동사"],["O","the cucumbers","목적어"],["M","happily","수식어"]],"chunks":[["If you put two monkeys in cages next to each other, and offer them both slices of cucumber for the rocks they already have,","두 원숭이를 나란한 우리에 두고 이미 가진 돌의 대가로 둘 다 오이 조각을 받으면",[["목적격 관계대명사 생략","g7-3"]]],["they will happily eat the cucumbers.","그들은 오이를 기쁘게 먹을 것이다.",[]]],"mnote":"목적격 관계대명사 생략: the rocks 뒤 관계절은 목적어가 빠진 they already have이며 them을 중복하지 않는다.","isSummary":false},{"title":"문장 4 · 독립분사구문의 의미상 주어","en":"If, however, you give one monkey grapes instead — grapes <span class=\"an ul\" data-n=\"독립분사구문의 의미상 주어\"><span class=\"an-word\">being</span></span> universally preferred to cucumbers — <b class=\"sl\">/</b> the monkey that is still receiving cucumbers will begin to throw them back at the experimenter.","tr":"하지만 한 원숭이에게 대신 포도를 주면, 포도는 보편적으로 오이보다 선호되는데, 여전히 오이를 받는 원숭이는 그것을 실험자에게 던지기 시작한다.","sv":[["M","If ...","수식어"],["X","grapes being universally preferred to cucumbers","절·구조"],["S","the monkey that is still receiving cucumbers","주어"],["V","will begin","동사"],["O","to throw them back ...","목적어"]],"chunks":[["If, however, you give one monkey grapes instead — grapes being universally preferred to cucumbers —","하지만 한 원숭이에게 대신 포도를 주면, 포도는 보편적으로 오이보다 선호되는데,",[["독립분사구문의 의미상 주어","g7-4"]]],["the monkey that is still receiving cucumbers will begin to throw them back at the experimenter.","여전히 오이를 받는 원숭이는 그것을 실험자에게 던지기 시작한다.",[]]],"mnote":"독립분사구문의 의미상 주어: 필기: grapes가 being preferred의 의미상 주어이며 분사구문이므로 being을 쓴다. them은 오이를 가리킨다.","isSummary":false},{"title":"문장 5 · make + O + 형용사 보어","en":"Even though she is still getting “paid” the same amount for her effort of sourcing rocks, and so her particular situation has not changed, <b class=\"sl\">/</b> the <span class=\"ci st\">comparison</span> to another makes the situation <span class=\"an ul\" data-n=\"make + O + 형용사 보어\"><span class=\"an-word\">unfair</span></span>.","tr":"돌을 모은 노력에 같은 양의 보상을 받고 상황이 바뀌지 않았더라도 다른 원숭이와의 비교가 그 상황을 부당하게 만든다.","sv":[["M","Even though ...","수식어"],["S","the comparison to another","주어"],["V","makes","동사"],["O","the situation","목적어"],["C","unfair","보어"]],"chunks":[["Even though she is still getting “paid” the same amount for her effort of sourcing rocks, and so her particular situation has not changed,","돌을 모은 노력에 같은 양의 보상을 받고 상황이 바뀌지 않았더라도",[]],["the comparison to another makes the situation unfair.","다른 원숭이와의 비교가 그 상황을 부당하게 만든다.",[["make + O + 형용사 보어","g7-5"]]]],"mnote":"make + O + 형용사 보어: 필기: comparison이 주어이며 makes the situation unfair는 5형식이다. unfair는 상황의 상태를 나타낸다.","isSummary":false},{"title":"문장 6 · be willing to V","en":"Furthermore, <span class=\"an\" data-n=\"오이를 받는 원숭이\"><span class=\"an-word\">she</span></span> is now willing <span class=\"an ul\" data-n=\"be willing to V\"><span class=\"an-word\">to abandon</span></span> all gains — the cucumbers themselves — <b class=\"sl\">/</b> to communicate her displeasure to the experimenter.","tr":"게다가 이제 그녀는 실험자에게 불쾌감을 전달하기 위해 모든 이익, 곧 오이 자체를 기꺼이 포기한다.","sv":[["S","she","주어"],["V","is","동사"],["C","willing to abandon all gains","보어"],["M","to communicate her displeasure ...","수식어"]],"chunks":[["Furthermore, she is now willing to abandon all gains — the cucumbers themselves —","게다가 이제 그녀는 모든 이익, 곧 오이 자체를 기꺼이 포기한다",[["be willing to V","g7-6"]]],["to communicate her displeasure to the experimenter.","실험자에게 불쾌감을 전달하기 위해.",[]]],"mnote":"be willing to V: 기꺼이 포기하다는 willing to abandon으로 표현한다. gains는 오이 자체라는 부연이 있다.","isSummary":false},{"title":"요약문 · 본문 전체의 핵심","en":"According to the passage, if the Capuchin monkey realizes the inequality in rewards compared to another monkey, <b class=\"sl\">/</b> she will reject her rewards to express her feelings about the treatment, despite <span class=\"an ul\" data-n=\"despite 뒤 동명사\"><span class=\"an-word\">getting</span></span> exactly the same rewards as before.","tr":"이 글에 따르면 Capuchin 원숭이가 다른 원숭이와 비교해 보상의 불평등을 알아차리면 이전과 같은 보상을 받더라도 대우에 대한 감정을 표현하기 위해 보상을 거부한다.","sv":[["M","if ... / despite getting ...","수식어"],["S","she","주어"],["V","will reject","동사"],["O","her rewards","목적어"],["M","to express her feelings ...","수식어"]],"chunks":[["According to the passage, if the Capuchin monkey realizes the inequality in rewards compared to another monkey,","이 글에 따르면 Capuchin 원숭이가 다른 원숭이와 비교해 보상의 불평등을 알아차리면",[]],["she will reject her rewards to express her feelings about the treatment, despite getting exactly the same rewards as before.","이전과 같은 보상을 받더라도 대우에 대한 감정을 표현하기 위해 보상을 거부한다.",[["despite 뒤 동명사","g7-7"]]]],"mnote":"despite 뒤 동명사: despite는 전치사이므로 getting을 쓴다. 요약의 핵심은 보상의 절대량이 아니라 비교에 의한 불평등이다.","isSummary":true}],"grammar":[{"group":"문장 1","items":[{"id":"g7-1","title":"복수 선행사 관계절","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Capuchins — New World Monkeys that <mark>live</mark> in large social groups — will, in captivity, trade with people all day long, especially if food is involved.</div><div class=\"def-box\">Monkeys가 복수이므로 관계절 동사는 live이다. 대시는 Capuchins를 부연한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[live / lives]</span></div>"}]},{"group":"문장 2","items":[{"id":"g7-2","title":"명사 수식 to부정사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>I give you this rock and you give me a treat <mark>to eat</mark>.</div><div class=\"def-box\">a treat to eat은 먹을 간식이다. 필기: I는 원숭이의 입장에서 하는 말이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to eat / eating]</span></div>"}]},{"group":"문장 3","items":[{"id":"g7-3","title":"목적격 관계대명사 생략","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>If you put two monkeys in cages next to each other, and offer them both slices of cucumber for the rocks <mark>they already have</mark>, they will happily eat the cucumbers.</div><div class=\"def-box\">the rocks 뒤 관계절은 목적어가 빠진 they already have이며 them을 중복하지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[they already have / they already have them]</span></div>"}]},{"group":"문장 4","items":[{"id":"g7-4","title":"독립분사구문의 의미상 주어","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>If, however, you give one monkey grapes instead — grapes <mark>being</mark> universally preferred to cucumbers — the monkey that is still receiving cucumbers will begin to throw them back at the experimenter.</div><div class=\"def-box\">필기: grapes가 being preferred의 의미상 주어이며 분사구문이므로 being을 쓴다. them은 오이를 가리킨다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[being / been]</span></div>"}]},{"group":"문장 5","items":[{"id":"g7-5","title":"make + O + 형용사 보어","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>Even though she is still getting “paid” the same amount for her effort of sourcing rocks, and so her particular situation has not changed, the comparison to another makes the situation <mark>unfair</mark>.</div><div class=\"def-box\">필기: comparison이 주어이며 makes the situation unfair는 5형식이다. unfair는 상황의 상태를 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[unfair / unfairly]</span></div>"}]},{"group":"문장 6","items":[{"id":"g7-6","title":"be willing to V","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>Furthermore, she is now willing <mark>to abandon</mark> all gains — the cucumbers themselves — to communicate her displeasure to the experimenter.</div><div class=\"def-box\">기꺼이 포기하다는 willing to abandon으로 표현한다. gains는 오이 자체라는 부연이 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to abandon / abandoning]</span></div>"}]},{"group":"문장 7","items":[{"id":"g7-7","title":"despite 뒤 동명사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>According to the passage, if the Capuchin monkey realizes the inequality in rewards compared to another monkey, she will reject her rewards to express her feelings about the treatment, despite <mark>getting</mark> exactly the same rewards as before.</div><div class=\"def-box\">despite는 전치사이므로 getting을 쓴다. 요약의 핵심은 보상의 절대량이 아니라 비교에 의한 불평등이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[getting / get]</span></div>"}]}],"originalNumber":22,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>돌을 건네면 오이를 주는 거래를 두 원숭이와 진행함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>둘 다 오이를 받을 때는 기쁘게 먹음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>한 원숭이에게 선호되는 포도를 주면 다른 원숭이가 오이를 던짐</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>자기 보상은 같아도 비교로 부당함을 느껴 거부함</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">According to the passage, if the Capuchin monkey realizes the inequality in rewards compared to another monkey, she will reject her rewards to express her feelings about the treatment, despite getting exactly the same rewards as before.</div><p>이 글에 따르면 Capuchin 원숭이가 다른 원숭이와 비교해 보상의 불평등을 알아차리면 이전과 같은 보상을 받더라도 대우에 대한 감정을 표현하기 위해 보상을 거부한다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">inequality</td><td>문장 4: 하지만 한 원숭이에게 대신 포도를 주면, 포도는 보편적으로 오이보다 선호되는데, 여전히 오이를 받는 원숭이는 그것을 실험자에게 던지기 시작한다. / 문장 5: 돌을 모은 노력에 같은 양의 보상을 받고 상황이 바뀌지 않았더라도 다른 원숭이와의 비교가 그 상황을 부당하게 만든다.</td></tr><tr><td class=\"en\">reject</td><td>문장 5: 돌을 모은 노력에 같은 양의 보상을 받고 상황이 바뀌지 않았더라도 다른 원숭이와의 비교가 그 상황을 부당하게 만든다. / 문장 6: 게다가 이제 그녀는 실험자에게 불쾌감을 전달하기 위해 모든 이익, 곧 오이 자체를 기꺼이 포기한다.</td></tr></tbody></table></div><div class=\"note\">원숭이 자신의 보상은 그대로이지만 비교에 의한 불평등 때문에 보상을 포기한다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-22","lesson":15,"type":"요약","title":"같은 5달러, 다른 할인 효과","source":"2019년 11월 40번","page":70,"summary":"같은 5달러 할인도 최초 가격에서 차지하는 비율에 따라 가치가 다르게 인식된다.","footnote":"","sents":[{"title":"문장 1 · 주어의 핵 perception","en":"The perception of the same amount of discount on a product <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"주어의 핵 perception\"><span class=\"an-word\">depends</span></span> on its <span class=\"ci\">relation</span> to the initial price.","tr":"상품의 같은 할인액에 대한 인식은 최초 가격과의 관계에 달려 있다.","sv":[["S","T 한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[positively / positive]</span></div>"}]}],"originalNumber":27,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>보통은 예상에 맞는 옷차림을 선호함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>예외적으로 규범을 조금 어긴 사람에 대한 반응을 연구함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>빨간 나비넥타이·운동화가 지위와 능력 평가를 높임</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>약간의 일탈이 사회적 비용을 감수할 힘의 신호가 됨</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">A series of studies show that people view an individual positively when the individual only slightly challenges the norm for what people should wear.</div><p>일련의 연구는 그 사람이 무엇을 입어야 하는지의 규범에 아주 약간 도전할 때 사람들이 그 개인을 긍정적으로 봄을 보여 준다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">positively</td><td>문장 4: 한 상황에서 정장 차림 행사에 참석한 남자가 빨간 나비넥타이를 맸을 때 더 높은 지위와 능력이 있는 것으로 보였다. / 문장 5: 연구자들은 독특함을 중시하는 것이 강의하면서 빨간 운동화를 신은 교수의 지위와 능력에 대한 청중 평가를 높였음을 발견했다. / 문장 6: 결과는 사람들이 규범에서 약간 벗어나는 행동을 긍정적으로 판단함을 시사한다 그런 행동의 사회적 비용을 감수할 만큼 개인이 강하다는 신호이기 때문이다.</td></tr><tr><td class=\"en\">slightly challenges</td><td>문장 2: 일반적으로 이런 판단을 조사한 연구는 사람들이 예상에 맞는 의복을 선호함을 발견한다 — 수술복을 입은 외과의사, 파란 옷을 입은 남자아이처럼 — 한 가지 주목할 예외가 있다. / 문장 3: 2014년 6월 Journal of Consumer Research 기사에 발표된 일련의 연구는 확립된 규범을 아주 약간 어긴 사람에 대한 관찰자의 반응을 탐구했다. / 문장 6: 결과는 사람들이 규범에서 약간 벗어나는 행동을 긍정적으로 판단함을 시사한다 그런 행동의 사회적 비용을 감수할 만큼 개인이 강하다는 신호이기 때문이다.</td></tr></tbody></table></div><div class=\"note\">아주 약간의 규범 이탈이라는 정도와 긍정적 평가의 방향을 보존한다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\ tal projects, <b class=\"sl\">/</b> which could be changed by <span class=\"an ul\" data-n=\"by 뒤 동명사\"><span class=\"an-word\">adopting</span></span> a(n) inclusive design.","tr":"장애가 있는 사람의 요구는 디지털 프로젝트에서 종종 간과되어 왔으며 이는 포용적 디자인을 채택함으로써 바뀔 수 있다.","sv":[["S","The needs of people with disabilities","주어"],["V","have been overlooked","동사"],["X","which could be changed ...","절·구조"],["M","by adopting an inclusive design","수식어"]],"chunks":[["The needs of people with disabilities have often been overlooked in digital projects,","장애가 있는 사람의 요구는 디지털 프로젝트에서 종종 간과되어 왔으며",[]],["which could be changed by adopting a(n) inclusive design.","이는 포용적 디자인을 채택함으로써 바뀔 수 있다.",[["by 뒤 동명사","g13-6"]]]],"mnote":"by 뒤 동명사: by adopting은 해결 수단을 나타낸다. 요약은 간과된 요구라는 문제와 포용적 설계라는 해결을 연결한다.","isSummary":true}],"grammar":[{"group":"문장 1","items":[{"id":"g13-1","title":"how + to부정사의 동사 병렬","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Over the last several decades, scholars have developed standards for how best to create, organize, present, and <mark>preserve</mark> digital information for future generations.</div><div class=\"def-box\">to create, organize, present, preserve가 병렬이며 to를 공유한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[preserve / preserving]</span></div>"}]},{"group":"문장 2","items":[{"id":"g13-2","title":"what절과 복수 보어의 수 일치","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>What has remained neglected for the most part, however, <mark>are</mark> the needs of people with disabilities.</div><div class=\"def-box\">필기: 원문은 복수 보어 the needs를 받아 are를 쓴다. what절이 복수 대상을 뜻할 때 이런 일치가 가능하다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / be]</span></div>"}]},{"group":"문장 3","items":[{"id":"g13-3","title":"have difficulty -ing","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>As a result, many of the otherwise most valuable digital resources are useless for people who are deaf or hard of hearing, as well as for people who are blind, have low vision, or have difficulty <mark>distinguishing</mark> particular colors.</div><div class=\"def-box\">색 구분에 어려움이 있다는 뜻으로 difficulty 뒤에 동명사 distinguishing이 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[distinguishing / to distinguish]</span></div>"}]},{"group":"문장 4","items":[{"id":"g13-4","title":"능동의 분사 수식","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>While professionals working in educational technology and commercial web design have made significant progress in meeting the needs of such users, some scholars <mark>creating</mark> digital projects all too often fail to take these needs into account.</div><div class=\"def-box\">scholars가 프로젝트를 만드는 주체이므로 creating이다. 필기: such users는 앞의 장애가 있는 사용자들을 받는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[creating / created]</span></div>"}]},{"group":"문장 5","items":[{"id":"g13-5","title":"가정법 과거","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>This situation would be much improved if more projects <mark>embraced</mark> the idea that we should always keep the largest possible audience in mind as we make design decisions, ensuring that our final product serves the needs of those with disabilities as well as those without.</div><div class=\"def-box\">필기: if절 과거형 embraced와 주절 would be improved가 가정적 대안을 나타낸다. ensuring은 결과를 덧붙이는 분사구문이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[embraced / will embrace]</span></div>"}]},{"group":"문장 6","items":[{"id":"g13-6","title":"by 뒤 동명사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>The needs of people with disabilities have often been overlooked in digital projects, which could be changed by <mark>adopting</mark> a(n) inclusive design.</div><div class=\"def-box\">by adopting은 해결 수단을 나타낸다. 요약은 간과된 요구라는 문제와 포용적 설계라는 해결을 연결한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[adopting / adopt]</span></div>"}]}],"originalNumber":28,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>디지털 정보를 만들고 보존하는 표준을 발전시킴</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>장애인의 요구를 간과해 가치 있는 자료도 쓸 수 없는 경우가 생김</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>일부 업계와 달리 학술 프로젝트는 접근성을 놓치기도 함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>장애 유무와 관계없이 많은 사용자를 고려한 포용적 설계가 필요함</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">The needs of people with disabilities have often been overlooked in digital projects, which could be changed by adopting a(n) inclusive design.</div><p>장애가 있는 사람의 요구는 디지털 프로젝트에서 종종 간과되어 왔으며 이는 포용적 디자인을 채택함으로써 바뀔 수 있다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">overlooked</td><td>문장 2: 하지만 대부분 여전히 무시되어 온 것은 장애가 있는 사람들의 요구이다. / 문장 3: 그 결과 달리 보면 가장 가치 있는 많은 디지털 자원이 청각 장애인뿐 아니라 시각 장애, 저시력, 색 구분의 어려움이 있는 사람들에게 무용지물이다. / 문장 4: 교육 기술과 상업 웹 디자인 전문가들은 이런 사용자의 요구 충족에서 상당히 진전했지만 디지털 프로젝트를 만드는 일부 학자는 너무 자주 이런 요구를 고려하지 못한다.</td></tr><tr><td class=\"en\">inclusive</td><td>문장 5: 더 많은 프로젝트가 설계할 때 가능한 한 넓은 사용자를 염두에 두어야 한다는 생각을 받아들이면 상황은 크게 개선될 것이다 최종 결과물이 장애가 있는 사람과 없는 사람 모두의 요구를 충족하도록 하면서.</td></tr></tbody></table></div><div class=\"note\">장애인의 요구 간과라는 문제를 포용적 설계로 바꿀 수 있다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-28","lesson":15,"type":"요약","title":"행동을 바꾸려면 무엇을 강조할까","source":"2017년 11월 40번","page":76,"summary":"새 행동을 안전하게 느끼면 변화의 보상을, 위험하게 느끼면 변화하지 않을 때의 손실을 강조해야 한다.","footnote":"","sents":[{"title":"문장 1 · of 뒤 동명사의 병렬","en":"If you want to modify people’s behavior, <b class=\"sl\">/</b> is it better to highlight the benefits of <span class=\"an ul\" data-n=\"of 뒤 동명사의 병렬\"><span class=\"an-word\">changing</span></span> or the costs of not changing?","tr":"사람들의 행동을 수정하고 싶다면 변화의 이익과 변화하지 않을 비용 중 무엇을 강조하는 것이 더 좋은가?","sv":[["M","If you want to modify ...","수식어"],["S","it (가주어)","주어"],["V","is","동사"],["C","better","보어"],["X","to highlight ... (진주어)","절·구조"]],"chunks":[["If you want to modify people’s behavior,","사람들의 행동을 수정하고 싶다면",[]],["is it better to highlight the benefits of changing or the costs of not changing?","변화의 이익과 변화하지 않을 비용 중 무엇을 강조하는 것이 더 좋은가?",[["of 뒤 동명사의 병렬","g14-1"]]]],"mnote":"of 뒤 동명사의 병렬: the benefits of changing과 the costs of not changing이 비교된다.","isSummary":false},{"title":"문장 2 · 전치사 뒤 whether절","en":"According to Peter Salovey, one of the originators of the concept of emotional intelligence, <b class=\"sl\">/</b> it depends on <span class=\"an ul\" data-n=\"전치사 뒤 whether절\"><span class=\"an-word\">whether</span></span> they perceive the new behavior as <span class=\"ul st\">safe or risky</span>.","tr":"감정 지능 개념의 창시자 중 한 명인 Peter Salovey에 따르면 그것은 새 행동을 안전하다고 인식하는지 위험하다고 인식하는지에 달려 있다.","sv":[["S","it","주어"],["V","depends","동사"],["M","on whether they perceive the new behavior as safe or risky","수식어"]],"chunks":[["According to Peter Salovey, one of the originators of the concept of emotional intelligence,","감정 지능 개념의 창시자 중 한 명인 Peter Salovey에 따르면",[]],["it depends on whether they perceive the new behavior as safe or risky.","그것은 새 행동을 안전하다고 인식하는지 위험하다고 인식하는지에 달려 있다.",[["전치사 뒤 whether절","g14-2"]]]],"mnote":"전치사 뒤 whether절: 필기: whether절은 전치사 on의 목적어이다. 전치사 뒤에는 if 대신 whether를 쓴다.","isSummary":false},{"title":"문장 3 · 선행사가 있는 관계대명사","en":"If they think the behavior is safe, we should emphasize all the good things <span class=\"an ul\" data-n=\"선행사가 있는 관계대명사\"><span class=\"an-word\">that</span></span> will happen if they do it <b class=\"sl\">/</b> — they’ll want to act immediately to obtain those certain gains.","tr":"그 행동이 안전하다고 생각하면 실행할 때 일어날 좋은 점을 강조해야 한다 — 그들은 확실한 이익을 얻기 위해 즉시 행동하고 싶어 할 것이다.","sv":[["M","If they think ...","수식어"],["S","we / they","주어"],["V","should emphasize / will want","동사"],["O","all the good things / to act ...","목적어"]],"chunks":[["If they think the behavior is safe, we should emphasize all the good things that will happen if they do it","그 행동이 안전하다고 생각하면 실행할 때 일어날 좋은 점을 강조해야 한다",[["선행사가 있는 관계대명사","g14-3"]]],["— they’ll want to act immediately to obtain those certain gains.","— 그들은 확실한 이익을 얻기 위해 즉시 행동하고 싶어 할 것이다.",[]]],"mnote":"선행사가 있는 관계대명사: all the good things를 수식하는 관계절이므로 that을 쓰며 what은 선행사를 겸한다.","isSummary":false},{"title":"문장 4 · doesn’t 뒤 원형","en":"But when people believe a behavior is risky, <b class=\"sl\">/</b> that approach doesn’t <span class=\"an ul\" data-n=\"doesn’t 뒤 원형\"><span class=\"an-word\">work</span></span>.","tr":"하지만 행동이 위험하다고 믿을 때 그런 접근은 효과가 없다.","sv":[["M","when people believe ...","수식어"],["S","that approach","주어"],["V","doesn’t work","동사"]],"chunks":[["But when people believe a behavior is risky,","하지만 행동이 위험하다고 믿을 때",[]],["that approach doesn’t work.","그런 접근은 효과가 없다.",[["doesn’t 뒤 원형","g14-4"]]]],"mnote":"doesn’t 뒤 원형: doesn’t 뒤에는 동사원형 work이다.","isSummary":false},{"title":"문장 5 · 복수 주어 benefits","en":"They’re already comfortable with the <span class=\"an\" data-n=\"현재 상태\"><span class=\"an-word\">status quo</span></span>, <b class=\"sl\">/</b> so the benefits of change <span class=\"an ul\" data-n=\"복수 주어 benefits\"><span class=\"an-word\">aren’t</span></span> attractive, and the stop system kicks in.","tr":"그들은 이미 현재 상태를 편하게 느끼므로 변화의 혜택은 매력적이지 않고 정지 시스템이 작동한다.","sv":[["S","They / the benefits of change / the stop system","주어"],["V","are / aren’t / kicks in","동사"],["C","comfortable / attractive","보어"]],"chunks":[["They’re already comfortable with the status quo,","그들은 이미 현재 상태를 편하게 느끼므로",[]],["so the benefits of change aren’t attractive, and the stop system kicks in.","변화의 혜택은 매력적이지 않고 정지 시스템이 작동한다.",[["복수 주어 benefits","g14-5"]]]],"mnote":"복수 주어 benefits: benefits가 복수이므로 aren’t이다. 필기: status quo는 현재 상태이다.","isSummary":false},{"title":"문장 6 · to부정사 안의 병렬","en":"Instead, we need to <span class=\"an\" data-n=\"불안정하게 하다\"><span class=\"an-word\">destabilize</span></span> the status quo <b class=\"sl\">/</b> and <span class=\"an ul\" data-n=\"to부정사 안의 병렬\"><span class=\"an-word\">emphasize</span></span> the bad things that will happen if they don’t change.","tr":"대신 우리는 현재 상태를 불안정하게 하고 변하지 않으면 일어날 나쁜 일을 강조해야 한다.","sv":[["S","we","주어"],["V","need","동사"],["O","to destabilize ... and emphasize ...","목적어"]],"chunks":[["Instead, we need to destabilize the status quo","대신 우리는 현재 상태를 불안정하게 하고",[]],["and emphasize the bad things that will happen if they don’t change.","변하지 않으면 일어날 나쁜 일을 강조해야 한다.",[["to부정사 안의 병렬","g14-6"]]]],"mnote":"to부정사 안의 병렬: to destabilize와 (to) emphasize가 병렬이다. 필기: destabilize는 불안정하게 만들다.","isSummary":false},{"title":"문장 7 · 동명사구 주어","en":"<span class=\"an ul\" data-n=\"동명사구 주어\"><span class=\"an-word\">Taking</span></span> a risk is more appealing <b class=\"sl\">/</b> when they’re faced with a guaranteed loss if they don’t.","tr":"그렇게 하지 않으면 확실한 손실에 직면할 때 위험을 감수하는 것이 더 매력적이다.","sv":[["S","Taking a risk","주어"],["V","is","동사"],["C","more appealing","보어"],["M","when they’re faced ...","수식어"]],"chunks":[["Taking a risk is more appealing","위험을 감수하는 것이 더 매력적이다",[["동명사구 주어","g14-7"]]],["when they’re faced with a guaranteed loss if they don’t.","그렇게 하지 않으면 확실한 손실에 직면할 때.",[]]],"mnote":"동명사구 주어: 주어로 쓰인 Taking a risk는 단수이다. 문장 끝 don’t 뒤에는 ta ,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>따뜻한 신체 접촉이 건강한 관계에 중요함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>뜨거운 커피를 든 사람은 상대를 더 따뜻하게 평가함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>뜨거운 팩을 든 사람은 친구에게 선물을 주는 경향이 큼</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>감정의 활성화가 의도 없이 이후 맥락의 판단에도 이어짐</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">Experiencing physical warmth promotes interpersonal warmth, which happens in an automatic way.</div><p>신체적 따뜻함을 경험하는 것은 대인관계의 따뜻함을 증진시키며 이는 자동적인 방식으로 일어난다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">physical warmth</td><td>문장 1: 최근 연구는 다른 사람과의 건강한 관계를 위한 따뜻한 신체 접촉의 중요성을 지적한다. / 문장 2: 한 연구에서 잠시 뜨거운 커피를 든 참가자는 차가운 커피를 든 경우보다 상대가 더 따뜻한 성격, 곧 관대하고 친절한 성격을 가졌다고 판단했다. / 문장 3: 다른 연구에서 뜨거운 팩을 든 참가자는 차가운 팩을 든 경우보다 자신을 위한 물건 대신 친구를 위한 선물을 고르는 경향이 높았다. / 문장 4: 이러한 발견은 신체적 따뜻함의 단순한 접촉 경험이 대인관계의 따뜻한 감정을 활성화함을 보여 준다.</td></tr><tr><td class=\"en\">automatic</td><td>문장 5: 게다가 이렇게 일시적으로 증가한 대인관계의 따뜻한 감정 활성화는 다른 사람에 대한 판단에 의도하지 않은 방식으로 영향을 준다. / 문장 6: 한 상황에서 활성화된 그런 감정은 이후 한동안 지속되고 본인이 인식하지 못한 채 이후 상황의 판단과 행동에 영향을 준다.</td></tr></tbody></table></div><div class=\"note\">물리적 따뜻함이 대인 감정을 활성화하며 그 영향은 의식적인 계획 없이 일어난다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id= havior of a child, which implies that parents should focus on reducing the attention to negatives while rewarding positive behaviors.</div><p>트릭 처벌은 아이의 원하지 않는 행동을 강화하며 이는 부모가 긍정 행동을 보상하면서 부정적 행동에 대한 관심을 줄여야 함을 시사한다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">reinforces</td><td>문장 3: 아이가 무언가를 하지 못하게 단념시키는 대신 그것은 그 행동을 하도록 장려한다. / 문장 4: 예를 들어 Hugh는 자신이 남동생을 때릴 때 어머니가 꾸짖는다는 것을 배운다. / 문장 5: 외로운 아이에게 꾸중을 듣는 것은 눈에 띄지 않는다고 느끼는 것보다 훨씬 낫기 때문에 그는 동생을 계속 때릴 것이다.</td></tr><tr><td class=\"en\">rewarding</td><td>문장 7: 예를 들어 어머니는 Hugh가 일정 기간 동생을 때리지 않았을 때 칭찬할 수 있다. / 문장 8: 어머니는 아이가 동생을 때리도록 내버려 둘 수 없지만 부정적 측면을 계속 지적하는 대신 긍정적 측면을 보상할 수 있다. / 문장 9: 이런 방식으로 어떤 부모라도 트릭 처벌을 피할 수 있다.</td></tr></tbody></table></div><div class=\"note\">부정 행동에 대한 관심은 줄이고 긍정 행동을 보상하는 대안을 요약한다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-33","lesson":15,"type":"요약","title":"새 문제에는 비선형적 사고를","source":"2025년 3월 40번","page":81,"summary":"논리적 선형 사고는 익숙한 문제에는 유용하지만 새로운 정보와 아이디어에는 한계가 있어 비선형적인 창의적 사고가 필요하다.","footnote":"","sents":[{"title":"문장 1 · 동사를 수식하는 부사","en":"In the course of trying to solve a problem with an invention, <b class=\"sl\">/</b> you may encounter a <span class=\"an\" data-n=\"저항의 벽\"><span class=\"an-word\">brick wall of resistance</span></span> when you try to think your way <span class=\"an ul ci st\" data-n=\"동사를 수식하는 부사\"><span class=\"an-word\">logically</span></span> through the problem.","tr":"발명품의 문제를 해결하려는 과정에서 논리적으로 문제
