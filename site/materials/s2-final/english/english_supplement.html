<!DOCTYPE html>
<html lang="ko" class="simpul-material">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 부교재 학습 | 2026-2학기 기말고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --primary:var(--c-2563eb); --primary-light:var(--c-eff6ff);
  --green:var(--c-16a34a);   --green-light:var(--c-f0fdf4);
  --purple:var(--c-7c3aed);  --purple-light:var(--c-f5f3ff);
  --orange:var(--c-ea580c);  --orange-light:var(--c-fff7ed);
  --teal:var(--c-0d9488);    --teal-light:var(--c-f0fdfa);
  --rose:var(--c-e11d48);    --rose-light:var(--c-fff1f2);
  --ink:var(--c-d6263b);
  --bg:var(--c-f8fafc); --surface:var(--c-ffffff); --border:var(--c-e2e8f0);
  --text:var(--c-0f172a); --text-sec:var(--c-475569);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --en:'Source Serif 4',Georgia,'Times New Roman',serif;
  --pen:'Nanum Pen Script','Noto Sans KR',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14.5px;line-height:1.8;color:var(--text);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* ── Header ── */
.page-header{position:sticky;top:0;z-index:50;background:var(--c-ffffff);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.header-inner{max-width:980px;margin:0 auto;padding:12px 20px 10px}
.header-inner.has-tabs{padding-bottom:0}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:12px;color:var(--text-sec)}
.crumbs button{border:none;background:none;color:var(--primary);font-size:12px;font-weight:500;padding:0 2px}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{color:var(--c-cbd5e1);padding:0 3px}
.crumbs .here{font-weight:700;color:var(--text)}
.page-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.badge-unit{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--primary-light);color:var(--primary)}
.badge-unit.rose{background:var(--rose-light);color:var(--rose)}
.tab-bar{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.tab-bar::-webkit-scrollbar{display:none}
.tab-group-label{font-size:10.5px;color:var(--text-sec);opacity:.6;padding:0 4px 0 10px;white-space:nowrap;user-select:none}
.tab-group-label:first-child{padding-left:0}
.tab-btn{display:flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:none;border-bottom:3px solid transparent;padding:9px 10px 8px;font-size:13.5px;color:var(--text-sec);font-weight:500}
.tab-btn:hover{color:var(--text)}
.tab-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10.5px;font-weight:700;background:var(--c-e2e8f0);color:var(--text-sec)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.tab-btn.active .tab-num{background:var(--primary);color:var(--c-ffffff)}

/* ── Layout ── */
.content-wrap{max-width:980px;margin:0 auto;padding:28px 20px 100px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.unit-banner{display:inline-block;font-size:12px;font-weight:500;padding:3px 12px;border-radius:999px;background:var(--c-ffffff);border:1px solid var(--border);color:var(--text-sec);margin-bottom:14px}
.section-title{font-size:17.5px;font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--primary);margin:30px 0 14px;scroll-margin-top:150px}
.tab-panel>.section-title:first-of-type{margin-top:4px}
.subsection-title{font-size:14.5px;font-weight:700;border-left:3px solid var(--primary);padding-left:9px;margin:20px 0 10px}
.sub2-title{display:inline-block;font-size:13px;font-weight:700;background:var(--c-f1f5f9);padding:2px 10px;border-radius:6px;margin:12px 0 6px}
p.lead{color:var(--text-sec);font-size:13.5px;margin-bottom:12px}

/* ── Home / Lesson ── */
.home-head h1{font-size:24px;font-weight:900;letter-spacing:-.5px}
.home-head p{color:var(--text-sec);font-size:13.5px;margin-top:2px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px}
.lesson-card{text-align:left;background:var(--c-ffffff);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.lesson-card:hover{border-color:var(--primary)}
.lesson-no{font-size:34px;font-weight:900;line-height:1;color:var(--text)}
.lesson-no small{font-size:16px;font-weight:700;margin-left:2px;color:var(--text-sec)}
.lesson-meta{font-size:12.5px;color:var(--text-sec)}
.type-section{margin-top:22px}
.type-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--rose);margin-bottom:12px}
.type-head .cnt{font-size:12px;font-weight:500;color:var(--text-sec)}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.p-card{text-align:left;background:var(--c-ffffff);border:1px solid var(--border);border-left:4px solid var(--rose);border-radius:10px;padding:12px 14px}
.p-card:hover{border-color:var(--rose);background:var(--rose-light)}
.p-card .pid{font-size:20px;font-weight:900}
.p-card .pv{font-family:inherit;font-size:14px;font-weight:600;color:var(--c-334155);margin-top:6px;line-height:1.55}
.p-card .p-card-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.class-passage{display:inline-flex;align-items:center;white-space:nowrap;font-size:12px;font-weight:700;line-height:1.6;color:var(--c-92400e);background:var(--c-fffbeb);border:1px solid var(--c-fcd34d);border-radius:999px;padding:2px 9px;vertical-align:middle}
#ptitle .class-passage{margin-left:8px}
.empty{background:var(--c-ffffff);border:1px dashed var(--c-cbd5e1);border-radius:12px;padding:24px;text-align:center;color:var(--text-sec)}

/* ── Box library ── */
.def-box,.green-box,.purple-box,.teal-box,.orange-box,.rose-box{border-left:4px solid var(--primary);background:var(--primary-light);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;font-size:13.5px}
.green-box{border-color:var(--green);background:var(--green-light)}
.purple-box{border-color:var(--purple);background:var(--purple-light)}
.teal-box{border-color:var(--teal);background:var(--teal-light)}
.orange-box{border-color:var(--orange);background:var(--orange-light)}
.rose-box{border-color:var(--rose);background:var(--rose-light)}
.note,.tip,.warning{border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px}
.note{background:var(--c-fefce8);border:1px solid var(--c-fde047)}
.tip{background:var(--green-light);border:1px solid var(--c-bbf7d0)}
.warning{background:var(--rose-light);border:1px solid var(--c-fecdd3)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin:1px 2px;background:var(--c-f1f5f9);color:var(--c-334155);white-space:nowrap}
.badge-blue{background:var(--primary-light);color:var(--primary)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.badge-teal{background:var(--teal-light);color:var(--teal)}
.badge-rose{background:var(--rose-light);color:var(--rose)}
button.badge{border:none}
button.badge:hover{filter:brightness(.95);text-decoration:underline}
.en{font-family:var(--en);font-size:1.06em}

.factor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.factor-grid.three{grid-template-columns:repeat(3,1fr)}
.factor-card{background:var(--c-ffffff);border:1px solid var(--border);border-top:4px solid var(--primary);border-radius:8px;padding:12px 14px;font-size:13px}
.factor-card h4{font-size:14px;margin-bottom:4px}
.factor-card.green{border-top-color:var(--green)}.factor-card.purple{border-top-color:var(--purple)}
.factor-card.orange{border-top-color:var(--orange)}.factor-card.teal{border-top-color:var(--teal)}
.factor-card.rose{border-top-color:var(--rose)}.factor-card.gray{border-top-color:var(--c-94a3b8)}

.table-wrap{overflow-x:auto;margin:10px 0}
.cmp-table,.ex-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--c-ffffff)}
.cmp-table th,.cmp-table td,.ex-table th,.ex-table td{border:1px solid var(--border);padding:8px 10px;vertical-align:top;text-align:left}
.cmp-table thead th{background:var(--primary);color:var(--c-ffffff)}
.cmp-table.orange-th thead th{background:var(--orange)}
.cmp-table.teal-th thead th{background:var(--teal)}
.cmp-table tbody td:first-child{font-weight:700;color:var(--c-1e3a8a);white-space:nowrap}
.ex-table thead th{background:var(--c-334155);color:var(--c-ffffff)}

.stage-row{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:12px 0}
.stage-item{flex:1 1 180px;background:var(--c-ffffff);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12.5px}
.stage-item b{display:block;font-size:13.5px;margin-bottom:2px}
.stage-item.hi{border:2px solid var(--rose);background:var(--rose-light)}
.flow-arrow{align-self:center;color:var(--c-94a3b8);font-weight:700}

.rule-card{background:var(--c-ffffff);border:2px solid var(--primary);border-radius:10px;padding:14px 16px;margin:14px 0;scroll-margin-top:150px}
.rule-card.green{border-color:var(--green)}.rule-card.purple{border-color:var(--purple)}
.rule-card.orange{border-color:var(--orange)}.rule-card.teal{border-color:var(--teal)}
.rule-card.rose{border-color:var(--rose)}
.rule-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rule-head h3{font-size:15px}
.rule-num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--c-ffffff);font-size:12px;font-weight:700}
.rule-card.green .rule-num{background:var(--green)}.rule-card.purple .rule-num{background:var(--purple)}
.rule-card.orange .rule-num{background:var(--orange)}.rule-card.teal .rule-num{background:var(--teal)}
.rule-card.rose .rule-num{background:var(--rose)}
.src-line{font-family:var(--en);font-size:15px;background:var(--c-f8fafc);border-radius:6px;padding:8px 12px;margin:8px 0;line-height:1.7}
.src-line mark{background:var(--c-fef08a);padding:0 2px;border-radius:2px}
.src-tag{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:11px;color:var(--text-sec);margin-right:6px}
.exam-line{font-size:13px;margin-top:6px}
.exam-line .en{background:var(--orange-light);padding:1px 6px;border-radius:4px}

.totop{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:none;background:var(--primary);color:var(--c-ffffff);font-size:18px;box-shadow:0 4px 12px rgba(37,99,235,.35);z-index:60}

/* ── Passage (필기 레이어) ── */
.layer-bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;align-items:center}
.layer-bar .lbl{font-size:12px;color:var(--text-sec);margin-right:2px}
.lay-btn{border:1px solid var(--border);background:var(--c-ffffff);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--text-sec);font-weight:500}
.lay-btn.on{background:var(--text);color:var(--c-ffffff);border-color:var(--text)}
.lay-btn.pen.on{background:var(--ink);border-color:var(--ink)}
.passage{background:var(--c-ffffff);border:1px solid var(--border);border-radius:12px;padding:18px 26px 14px;box-shadow:var(--shadow)}
.sent{position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--border)}
.sent:last-of-type{border-bottom:none}
.sent-num{position:absolute;left:0;top:18px;width:28px;height:28px;border-radius:50%;border:none;background:var(--text);color:var(--c-ffffff);font-weight:700;font-size:13px}
.sent-num:hover{background:var(--primary)}
.sent-en{font-family:var(--en);font-size:18.5px;line-height:3.1;color:var(--c-111827);transition:filter .2s}
.sent-tr{display:none;font-size:13.5px;color:var(--c-334155);background:var(--primary-light);border-radius:8px;padding:8px 12px;margin:2px 0 6px;line-height:1.75}
.sent.open .sent-tr,.passage.show-tr .sent-tr{display:block}
.mnote{display:none;font-family:var(--pen);color:var(--ink);font-size:21px;line-height:1.3;margin:0 0 6px}
.passage.notes .mnote{display:block}
.footnote{font-size:12.5px;color:var(--text-sec);text-align:right;margin-top:6px}
.an,.st,.ci,.br,.ul{position:relative}
.passage.notes .an::after{content:attr(data-n);position:absolute;left:50%;top:calc(100% - 4px);transform:translateX(-50%);font-family:var(--pen);font-size:19px;line-height:1;color:var(--ink);white-space:nowrap;pointer-events:none}
.passage.notes .st::before{content:"";position:absolute;right:-7px;top:-.85em;font-size:12px;line-height:1;color:var(--ink)}
.passage.notes .ci{box-shadow:0 0 0 1.5px var(--ink);border-radius:40%;padding:0 2px}
.passage.notes .ul{text-decoration:underline;text-decoration-color:var(--ink);text-decoration-thickness:1.5px;text-underline-offset:4px}
.passage.notes .br::before{content:"(";color:var(--ink);font-weight:600}
.passage.notes .br::after{content:")";color:var(--ink);font-weight:600}
.passage.notes .br.sq::before{content:"["}
.passage.notes .br.sq::after{content:"]"}
.sl{display:none}
.passage.chunks .sl{display:inline;color:var(--primary);font-weight:700;padding:0 4px;font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}

/* ── 문장 해부 ── */
.s-card{background:var(--c-ffffff);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow);scroll-margin-top:150px}
.s-card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.s-card-head h3{font-size:15.5px}
.s-card-head .spacer{flex:1}
.mini-btn{border:1px solid var(--border);background:var(--c-ffffff);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text-sec)}
.mini-btn.on{background:var(--text);color:var(--c-ffffff);border-color:var(--text)}
.sv-row{display:flex;flex-wrap:wrap;gap:8px 6px;margin:6px 0 12px}
.sv-seg{display:flex;flex-direction:column;align-items:center;max-width:100%}
.sv-seg .t{font-family:var(--en);font-size:14.5px;padding:2px 8px;border-radius:6px;background:var(--c-f1f5f9);border-bottom:3px solid var(--c-94a3b8);text-align:center}
.sv-seg .r{font-size:11px;font-weight:700;margin-top:2px;color:var(--c-64748b)}
.sv-seg.S .t{border-color:var(--primary);background:var(--primary-light)}.sv-seg.S .r{color:var(--primary)}
.sv-seg.V .t{border-color:var(--rose);background:var(--rose-light)}.sv-seg.V .r{color:var(--rose)}
.sv-seg.O .t{border-color:var(--green);background:var(--green-light)}.sv-seg.O .r{color:var(--green)}
.sv-seg.C .t{border-color:var(--purple);background:var(--purple-light)}.sv-seg.C .r{color:var(--purple)}
.sv-seg.M .t{border-color:var(--teal);background:var(--teal-light)}.sv-seg.M .r{color:var(--teal)}
.sv-seg.X .t{border-color:var(--orange);background:var(--orange-light)}.sv-seg.X .r{color:var(--orange)}
.chunk-table{width:100%;border-collapse:collapse;font-size:13px}
.chunk-table th{background:var(--c-334155);color:var(--c-ffffff);padding:6px 10px;text-align:left;font-weight:600}
.chunk-table td{border-bottom:1px solid var(--border);padding:7px 10px;vertical-align:top}
.chunk-table td.no{color:var(--c-94a3b8);width:28px;font-weight:700}
.chunk-table td.ck{font-family:var(--en);font-size:14.5px;width:46%}
.chunk-table td.ko{color:var(--c-334155)}
.s-card.hide-ko td.ko{color:transparent;background:repeating-linear-gradient(-45deg,var(--c-f1f5f9),var(--c-f1f5f9) 6px,var(--c-e2e8f0) 6px,var(--c-e2e8f0) 12px);cursor:pointer;border-radius:4px}
.s-card.hide-ko td.ko.peek{color:var(--c-334155);background:var(--c-fef9c3)}
.s-card.hide-ko td.ko .badge{visibility:hidden}
.s-card.hide-ko td.ko.peek .badge{visibility:visible}

/* ── 훈련 ── */
.drill{background:var(--c-ffffff);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
.drill-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.drill-top .score{font-size:12.5px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:2px 10px;border-radius:999px}
.drill-top .spacer{flex:1}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ch-item{padding:10px 0;border-bottom:1px dashed var(--border)}
.ch-item:last-child{border-bottom:none}
.ch-s{font-family:var(--en);font-size:15px;line-height:1.9}
.ch-s .n{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:12px;font-weight:700;color:var(--c-94a3b8);margin-right:6px}
.ch-opt{font-family:var(--en);font-size:14.5px;border:1.5px solid var(--c-cbd5e1);background:var(--c-ffffff);border-radius:6px;padding:0 9px;margin:0 2px;line-height:1.6}
.ch-opt:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.ch-opt.correct{background:var(--green-light);border-color:var(--green);color:var(--green);font-weight:600}
.ch-opt.wrong{background:var(--rose-light);border-color:var(--rose);color:var(--rose);text-decoration:line-through}
.ch-opt:disabled{cursor:default}
.ch-exp{font-size:12.5px;margin-top:4px;padding:5px 10px;border-radius:6px}
.ch-exp.ok{background:var(--green-light);color:var(--c-14532d)}
.ch-exp.no{background:var(--rose-light);color:var(--c-881337)}
.act-btn{border:none;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;background:var(--primary);color:var(--c-ffffff)}
.act-btn.ghost{background:var(--c-ffffff);color:var(--text-sec);border:1px solid var(--border)}
.act-btn.ghost.on{background:var(--text);color:var(--c-ffffff);border-color:var(--text)}

/* 훈련 3: 문장 속 어휘 해석 */
.vt-item{padding:12px 0 14px;border-bottom:1px dashed var(--border)}
.vt-item:last-child{border-bottom:none}
.vt-en{font-family:var(--en);font-size:16px;line-height:2;color:var(--c-111827)}
.vt-ko{font-size:14px;line-height:2.3;color:var(--c-334155);background:var(--c-f8fafc);border-radius:8px;padding:6px 12px;margin-top:4px}
.vt-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--text-sec);background:var(--c-e2e8f0);border-radius:4px;padding:0 6px;margin-right:8px;line-height:1.7}
.voc-sn{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--text);color:var(--c-ffffff);font-size:11px;vertical-align:2px;margin-right:6px}
.voc-w{text-decoration:underline;text-decoration-color:var(--primary);text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;font-weight:600;color:var(--c-1e3a8a)}
.voc-w.ok{text-decoration-color:var(--green);color:var(--green)}
.voc-w.no{text-decoration-color:var(--rose);color:var(--rose)}
