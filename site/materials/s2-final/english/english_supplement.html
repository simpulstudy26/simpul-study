const PASSAGES=[{"id":"11-01","lesson":11,"type":"빈칸 추론","title":"고통의 크기는 마음먹기에 달렸다","source":"2024년 10월 32번","page":48,"summary":"우리가 느끼는 고통의 정도는 육체적 자극 자체뿐 아니라 그 고통을 마음속에서 어떻게 해석하는지와 관련된다.","footnote":"","sents":[{"title":"고통을 구성하는 마음","en":"How much we suffer <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"명사절 주어의 수 일치\"><span class=\"an-word\">relates</span></span> to <b class=\"sl\">/</b> how we frame the pain in our mind.","tr":"우리가 얼마나 고통받는지는 우리가 고통을 우리의 마음에서 어떻게 구성하는지와 관련된다.","sv":[["S","How much we suffer","주어"],["V","relates","동사"],["M","to how we frame the pain in our mind","수식어"]],"chunks":[["How much we suffer","우리가 얼마나 고통받는지는",[]],["relates to","관련된다",[["명사절 주어의 수 일치","g1-1"]]],["how we frame the pain in our mind.","우리가 고통을 우리의 마음에서 어떻게 구성하는지와.",[]]],"mnote":"명사절 주어의 수 일치: How much we suffer 전체가 하나의 명사절 주어이므로 단수 동사 relates를 쓴다. 두 how절 모두 의문문 어순이 아닌 주어+동사 어순이다."},{"title":"극심한 통증과 정신적 고통의 구별","en":"When 1500m runners push themselves into extreme pain to win a race <b class=\"sl\">/</b> — their muscles <span class=\"an ul\" data-n=\"독립분사구문과 능동\"><span class=\"an-word\">screaming</span></span> and their lungs exploding with oxygen deficit, <b class=\"sl\">/</b> they don’t psychologically suffer much.","tr":"1500미터 달리기 선수가 경주에서 이기기 위해 스스로를 극심한 고통으로 밀어붙일 때, 그들의 근육이 비명을 지르고 그들의 폐가 산소 부족으로 폭발하면서도 그들은 정신적으로 많이 고통받지 않는다.","sv":[["M","When 1500m runners push themselves into extreme pain to win a race","수식어"],["X","their muscles screaming and their lungs exploding with oxygen deficit","절·구조"],["S","they","주어"],["V","don’t suffer","동사"],["M","psychologically / much","수식어"]],"chunks":[["When 1500m runners push themselves into extreme pain to win a race","1500미터 달리기 선수가 경주에서 이기기 위해 스스로를 극심한 고통으로 밀어붙일 때",[]],["— their muscles screaming and their lungs exploding with oxygen deficit,","— 그들의 근육이 비명을 지르고 그들의 폐가 산소 부족으로 폭발하면서,",[["독립분사구문과 능동","g1-2"]]],["they don’t psychologically suffer much.","그들은 정신적으로 많이 고통받지 않는다.",[]]],"mnote":"독립분사구문과 능동: their muscles가 screaming의 의미상 주어이다. 근육이 비명을 지르는 능동 관계이므로 현재분사를 쓰며, their lungs exploding도 같은 구조로 병렬 연결된다."},{"title":"고통과 친구가 되는 선수들","en":"In fact, ultra-marathon runners <b class=\"sl\">/</b> — those people who are crazy enough to push themselves beyond the normal boundaries of human endurance, covering distances of 50–100km or more over many hours, <b class=\"sl\">/</b> talk about <span class=\"an ul\" data-n=\"전치사 뒤 동명사\"><span class=\"an-word\">making</span></span> friends with their pain.","tr":"사실 울트라 마라톤 선수들, 즉 여러 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가며 인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인 사람들은 그들의 고통과 친구가 되는 것에 대해 이야기한다.","sv":[["S","ultra-marathon runners","주어"],["X","those people who are crazy enough to push themselves beyond the normal boundaries of human endurance","절·구조"],["V","talk","동사"],["M","about making friends with their pain","수식어"]],"chunks":[["In fact, ultra-marathon runners","사실 울트라 마라톤 선수들은",[]],["— those people who are crazy enough to push themselves beyond the normal boundaries of human endurance, covering distances of 50–100km or more over many hours,","— 즉, 여러 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가며 인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인 사람들은,",[]],["talk about making friends with their pain.","그들의 고통과 친구가 되는 것에 대해 이야기한다.",[["전치사 뒤 동명사","g1-3"]]]],"mnote":"전치사 뒤 동명사: about은 전치사이므로 뒤에는 동명사 making이 온다. enough to push는 ‘밀어붙일 만큼 충분히’라는 정도를 나타낸다."},{"title":"가치 있다고 믿으면 좋은 아픔","en":"When a patient has paid for some form of passive back pain therapy and the practitioner pushes deeply into a painful part of a patient’s back to mobilise it, <b class=\"sl\">/</b> the patient calls that <span class=\"an ul\" data-n=\"call + 목적어 + 목적격 보어\"><span class=\"an-word\">good pain</span></span> <b class=\"sl\">/</b> if he or she believes this type of deep pressure treatment will be of value, <b class=\"sl\">/</b> even though the practitioner is pushing right into the patient’s sore tissues.","tr":"한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고 의사가 그것을 풀어 주기 위해 환자 등의 아픈 부분을 깊게 눌렀을 때, 비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면 환자는 그것을 좋은 아픔이라고 부른다.","sv":[["M","When a patient has paid ... and the practitioner pushes ...","수식어"],["S","the patient","주어"],["V","calls","동사"],["O","that","목적어"],["C","good pain","보어"],["M","if he or she believes ... / even though ...","수식어"]],"chunks":[["When a patient has paid for some form of passive back pain therapy and the practitioner pushes deeply into a painful part of a patient’s back to mobilise it,","한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고 의사가 그것을 풀어 주기 위해 환자 등의 아픈 부분을 깊게 눌렀을 때,",[]],["the patient calls that good pain","환자는 그것을 좋은 아픔이라고 부른다",[["call + 목적어 + 목적격 보어","g1-4"]]],["if he or she believes this type of deep pressure treatment will be of value,","만약 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면,",[]],["even though the practitioner is pushing right into the patient’s sore tissues.","비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도.",[]]],"mnote":"call + 목적어 + 목적격 보어: calls that good pain에서 that은 목적어이고 good pain은 그 목적어를 부르는 이름인 명사구 보어이다. good은 명사 pain을 수식하므로 부사 well로 바꿀 수 없다."}],"grammar":[{"group":"문장 1","items":[{"id":"g1-1","title":"명사절 주어의 수 일치","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>How much we suffer <mark>relates</mark> to how we frame the pain in our mind.</div><div class=\"def-box\">How much we suffer 전체가 하나의 명사절 주어이므로 단수 동사 relates를 쓴다. 두 how절 모두 의문문 어순이 아닌 주어+동사 어순이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[relates / relate]</span></div>"}]},{"group":"문장 2","items":[{"id":"g1-2","title":"독립분사구문과 능동","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>When 1500m runners push themselves into extreme pain to win a race — their muscles <mark>screaming</mark> and their lungs exploding with oxygen deficit, they don’t psychologically suffer much.</div><div class=\"def-box\">their muscles가 screaming의 의미상 주어이다. 근육이 비명을 지르는 능동 관계이므로 현재분사를 쓰며, their lungs exploding도 같은 구조로 병렬 연결된다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[screaming / screamed]</span></div>"}]},{"group":"문장 3","items":[{"id":"g1-3","title":"전치사 뒤 동명사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>In fact, ultra-marathon runners — those people who are crazy enough to push themselves beyond the normal boundaries of human endurance, covering distances of 50–100km or more over many hours, talk about <mark>making</mark> friends with their pain.</div><div class=\"def-box\">about은 전치사이므로 뒤에는 동명사 making이 온다. enough to push는 ‘밀어붙일 만큼 충분히’라는 정도를 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[making / make]</span></div>"}]},{"group":"문장 4","items":[{"id":"g1-4","title":"call + 목적어 + 목적격 보어","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>When a patient has paid for some form of passive back pain therapy and the practitioner pushes deeply into a painful part of a patient’s back to mobilise it, the patient calls that <mark>good pain</mark> if he or she believes this type of deep pressure treatment will be of value, even though the practitioner is pushing right into the patient’s sore tissues.</div><div class=\"def-box\">calls that good pain에서 that은 목적어이고 good pain은 그 목적어를 부르는 이름인 명사구 보어이다. good은 명사 pain을 수식하므로 부사 well로 바꿀 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[good pain / well pain]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 주장</b>고통의 정도는 마음속에서 고통을 구성하는 방식과 관련된다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 운동 사례</b>달리기 선수들은 극심한 육체적 고통 속에서도 정신적으로는 덜 괴로워한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 확장</b>울트라 마라톤 선수들은 고통과 친구가 되는 것을 이야기한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 치료 사례</b>치료가 가치 있다고 믿는 환자는 아픈 압박을 좋은 아픔이라고 부른다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>고통의 크기는 마음먹기에 달렸다</b><p>우리가 느끼는 고통의 정도는 육체적 자극 자체뿐 아니라 그 고통을 마음속에서 어떻게 해석하는지와 관련된다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">How much we suffer relates to <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">how we frame the pain in our mind</b></div><p>달리기와 치료 사례 모두 같은 자극도 목표·가치에 대한 해석에 따라 다르게 경험할 수 있음을 보여 준다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>고통을 구성하는 마음</td><td>우리가 얼마나 고통받는지는 우리가 고통을 우리의 마음에서 어떻게 구성하는지와 관련된다.</td></tr><tr><td>2</td><td>극심한 통증과 정신적 고통의 구별</td><td>1500미터 달리기 선수가 경주에서 이기기 위해 스스로를 극심한 고통으로 밀어붙일 때, 그들의 근육이 비명을 지르고 그들의 폐가 산소 부족으로 폭발하면서도 그들은 정신적으로 많이 고통받지 않는다.</td></tr><tr><td>3</td><td>고통과 친구가 되는 선수들</td><td>사실 울트라 마라톤 선수들, 즉 여러 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가며 인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인 사람들은 그들의 고통과 친구가 되는 것에 대해 이야기한다.</td></tr><tr><td>4</td><td>가치 있다고 믿으면 좋은 아픔</td><td>한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고 의사가 그것을 풀어 주기 위해 환자 등의 아픈 부분을 깊게 눌렀을 때, 비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면 환자는 그것을 좋은 아픔이라고 부른다.</td></tr></tbody></table></div>"}]}},{"id":"11-02","lesson":11,"type":"빈칸 추론","title":"왜 제품은 세 가지 버전으로 나올까","source":"2024년 10월 33번","page":49,"summary":"더 비싼 세 번째 모델을 제시하면 소비자는 가격과 기능의 절충안인 중간 모델을 선택하게 된다.","footnote":"","sents":[{"title":"세 버전의 이유를 발견하다","en":"When I worked for a large electronics company that manufactured laser and ink-jet printers, <b class=\"sl\">/</b> I soon discovered <b class=\"sl\">/</b> why <span class=\"an ul\" data-n=\"간접의문문의 어순\"><span class=\"an-word\">there are</span></span> often three versions of many consumer goods.","tr":"내가 레이저와 잉크젯 프린터를 생산했던 큰 전자 회사에서 일했을 때, 나는 왜 많은 소비 상품에 종종 세 가지 버전이 있는지를 곧 발견했다.","sv":[["M","When I worked for a large electronics company that manufactured laser and ink-jet printers","수식어"],["S","I","주어"],["V","discovered","동사"],["O","why there are often three versions of many consumer goods","목적어"]],"chunks":[["When I worked for a large electronics company that manufactured laser and ink-jet printers,","내가 레이저와 잉크젯 프린터를 생산했던 큰 전자 회사에서 일했을 때,",[]],["I soon discovered","나는 곧 발견했다",[]],["why there are often three versions of many consumer goods.","왜 많은 소비 상품에 종종 세 가지 버전이 있는지를.",[["간접의문문의 어순","g2-1"]]]],"mnote":"간접의문문의 어순: discovered의 목적어인 why절은 why+평서문 어순이다. 존재를 나타내는 there are를 그대로 쓰고 are there로 도치하지 않는다."},{"title":"한 버전만 만들 때의 손실","en":"If the manufacturer makes only one version of its product, <b class=\"sl\">/</b> people who bought it might have been willing <span class=\"an ul\" data-n=\"be willing to V\"><span class=\"an-word\">to spend</span></span> more money, <b class=\"sl\">/</b> so the company is losing some income.","tr":"만약 생산자가 그 제품의 오직 한 가지 버전만 만든다면, 그것을 구매했던 사람들은 기꺼이 더 많은 돈을 쓰려고 했을 수도 있어서 회사는 일부 수입을 잃을 것이다.","sv":[["M","If the manufacturer makes only one version of its product","수식어"],["S","people who bought it","주어"],["V","might have been","동사"],["C","willing to spend more money","보어"],["X","so the company is losing some income","절·구조"]],"chunks":[["If the manufacturer makes only one version of its product,","만약 생산자가 그 제품의 오직 한 가지 버전만 만든다면,",[]],["people who bought it might have been willing to spend more money,","그것을 구매했던 사람들은 기꺼이 더 많은 돈을 쓰려고 했을 수도 있어서,",[["be willing to V","g2-2"]]],["so the company is losing some income.","회사는 일부 수입을 잃을 것이다.",[]]],"mnote":"be willing to V: be willing to spend는 ‘기꺼이 돈을 쓰려 하다’이다. willing 뒤에는 to부정사가 오며 might have been은 과거에 대한 가능성을 나타낸다."},{"title":"두 버전에서는 저가 선택","en":"If the company offers two versions, one with more features and more expensive than the other, <b class=\"sl\">/</b> people will compare the two models <b class=\"sl\">/</b> and still buy the <span class=\"an ul\" data-n=\"둘 사이의 비교급\"><span class=\"an-word\">less expensive</span></span> one.","tr":"만약 회사가 두 버전을 제공하는데 한 버전이 나머지보다 더 많은 기능과 더 비싼 가격을 가진다면, 사람들은 두 모델을 비교하고 여전히 덜 비싼 것을 살 것이다.","sv":[["M","If the company offers two versions, one with more features and more expensive than the other","수식어"],["S","people","주어"],["V","will compare / buy","동사"],["O","the two models / the less expensive one","목적어"]],"chunks":[["If the company offers two versions, one with more features and more expensive than the other,","만약 회사가 두 버전을 제공하는데 한 버전이 나머지보다 더 많은 기능과 더 비싼 가격을 가진다면,",[]],["people will compare the two models","사람들은 두 모델을 비교하고",[]],["and still buy the less expensive one.","여전히 덜 비싼 것을 살 것이다.",[["둘 사이의 비교급","g2-3"]]]],"mnote":"둘 사이의 비교급: 두 모델 중 덜 비싼 것을 뜻하므로 less expensive를 쓴다. one은 앞서 나온 model을 대신한다."},{"title":"고가 모델이 바꾸는 선택","en":"But if the company introduces a third model with even more features and more expensive than the other two, <b class=\"sl\">/</b> sales of the second model <span class=\"an ul\" data-n=\"수식어를 제외한 주어의 수 일치\"><span class=\"an-word\">go</span></span> up; <b class=\"sl\">/</b> many people like the features of the most expensive model, but not the price.","tr":"하지만 회사가 나머지 두 개보다 훨씬 더 많은 기능과 더 비싼 가격을 가진 세 번째 모델을 출시한다면 두 번째 모델의 판매가 증가하는데, 많은 사람은 가장 비싼 모델의 기능을 좋아하지만 그것의 가격은 좋아하지 않기 때문이다.","sv":[["M","if the company introduces a third model ...","수식어"],["S","sales of the second model","주어"],["V","go up","동사"],["X","many people like the features ... but not the price","절·구조"]],"chunks":[["But if the company introduces a third model with even more features and more expensive than the other two,","하지만 회사가 나머지 두 개보다 훨씬 더 많은 기능과 더 비싼 가격을 가진 세 번째 모델을 출시한다면,",[]],["sales of the second model go up;","두 번째 모델의 판매가 증가하는데,",[["수식어를 제외한 주어의 수 일치","g2-4"]]],["many people like the features of the most expensive model, but not the price.","많은 사람은 가장 비싼 모델의 기능을 좋아하지만 그것의 가격은 좋아하지 않기 때문이다.",[]]],"mnote":"수식어를 제외한 주어의 수 일치: 주어의 핵심은 복수명사 sales이다. of the second model은 수식어이므로 단수 model에 동사를 맞추지 않는다."},{"title":"중간 제품의 절충 장점","en":"The middle item has more features <span class=\"an ul\" data-n=\"비교급 + than\"><span class=\"an-word\">than</span></span> the least expensive one, <b class=\"sl\">/</b> and it is less expensive than the fanciest model.","tr":"중간 제품은 가장 저렴한 제품보다 더 많은 기능이 있고 가장 고급 모델보다는 덜 비싸다.","sv":[["S","The middle item / it","주어"],["V","has / is","동사"],["O","more features","목적어"],["C","less expensive","보어"],["M","than the least expensive one / than the fanciest model","수식어"]],"chunks":[["The middle item has more features than the least expensive one,","중간 제품은 가장 저렴한 제품보다 더 많은 기능이 있고,",[["비교급 + than","g2-5"]]],["and it is less expensive than the fanciest model.","가장 고급 모델보다는 덜 비싸다.",[["비교급 + than","g2-5"]]]],"mnote":"비교급 + than: more features와 less expensive는 비교급 표현이며 비교 대상을 이끄는 than이 필요하다."},{"title":"알아채지 못한 가격 조종","en":"They buy the middle item, <b class=\"sl\">/</b> unaware that they <span class=\"an ul\" data-n=\"현재완료 수동태\"><span class=\"an-word\">have been manipulated</span></span> by the presence of the higher-priced item.","tr":"그들은 더 비싼 가격의 제품의 존재에 의해 자신이 조종되었다는 것을 알지 못한 채 중간 제품을 구입한다.","sv":[["S","They","주어"],["V","buy","동사"],["O","the middle item","목적어"],["X","unaware that they have been manipulated by the presence of the higher-priced item","절·구조"]],"chunks":[["They buy the middle item,","그들은 중간 제품을 구입한다,",[]],["unaware that they have been manipulated by the presence of the higher-priced item.","더 비싼 가격의 제품의 존재에 의해 자신이 조종되었다는 것을 알지 못한 채.",[["현재완료 수동태","g2-6"]]]],"mnote":"현재완료 수동태: 소비자는 조종하는 주체가 아니라 조종된 대상이므로 have been manipulated를 쓴다. unaware는 주어 They의 상태를 덧붙인다."}],"grammar":[{"group":"문장 1","items":[{"id":"g2-1","title":"간접의문문의 어순","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>When I worked for a large electronics company that manufactured laser and ink-jet printers, I soon discovered why <mark>there are</mark> often three versions of many consumer goods.</div><div class=\"def-box\">discovered의 목적어인 why절은 why+평서문 어순이다. 존재를 나타내는 there are를 그대로 쓰고 are there로 도치하지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[there are / are there]</span></div>"}]},{"group":"문장 2","items":[{"id":"g2-2","title":"be willing to V","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>If the manufacturer makes only one version of its product, people who bought it might have been willing <mark>to spend</mark> more money, so the company is losing some income.</div><div class=\"def-box\">be willing to spend는 ‘기꺼이 돈을 쓰려 하다’이다. willing 뒤에는 to부정사가 오며 might have been은 과거에 대한 가능성을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to spend / spending]</span></div>"}]},{"group":"문장 3","items":[{"id":"g2-3","title":"둘 사이의 비교급","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>If the company offers two versions, one with more features and more expensive than the other, people will compare the two models and still buy the <mark>less expensive</mark> one.</div><div class=\"def-box\">두 모델 중 덜 비싼 것을 뜻하므로 less expensive를 쓴다. one은 앞서 나온 model을 대신한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[less expensive / least expensive]</span></div>"}]},{"group":"문장 4","items":[{"id":"g2-4","title":"수식어를 제외한 주어의 수 일치","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>But if the company introduces a third model with even more features and more expensive than the other two, sales of the second model <mark>go</mark> up; many people like the features of the most expensive model, but not the price.</div><div class=\"def-box\">주어의 핵심은 복수명사 sales이다. of the second model은 수식어이므로 단수 model에 동사를 맞추지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[go / goes]</span></div>"}]},{"group":"문장 5","items":[{"id":"g2-5","title":"비교급 + than","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>The middle item has more features <mark>than</mark> the least expensive one, and it is less expensive than the fanciest model.</div><div class=\"def-box\">more features와 less expensive는 비교급 표현이며 비교 대상을 이끄는 than이 필요하다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[than / as]</span></div>"}]},{"group":"문장 6","items":[{"id":"g2-6","title":"현재완료 수동태","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>They buy the middle item, unaware that they <mark>have been manipulated</mark> by the presence of the higher-priced item.</div><div class=\"def-box\">소비자는 조종하는 주체가 아니라 조종된 대상이므로 have been manipulated를 쓴다. unaware는 주어 They의 상태를 덧붙인다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[have been manipulated / have manipulated]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 발견</b>많은 소비 상품에는 세 가지 버전이 있다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 한·두 버전</b>한 버전은 추가 수입을 놓치고, 두 버전은 저가 모델로 선택이 쏠린다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 세 버전</b>더 비싼 모델이 나오면 중간 모델 판매가 늘어난다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 결론</b>소비자는 고가 제품의 존재에 영향을 받은 줄 모른 채 중간 제품을 산다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>왜 제품은 세 가지 버전으로 나올까</b><p>더 비싼 세 번째 모델을 제시하면 소비자는 가격과 기능의 절충안인 중간 모델을 선택하게 된다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">They buy the middle item, unaware that they have been manipulated by <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">the presence of the higher-priced item</b></div><p>중간 모델의 기능이 바뀌지 않아도 더 비싼 선택지가 생기면 비교 기준이 달라져 중간 모델이 매력적으로 보인다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>세 버전의 이유를 발견하다</td><td>내가 레이저와 잉크젯 프린터를 생산했던 큰 전자 회사에서 일했을 때, 나는 왜 많은 소비 상품에 종종 세 가지 버전이 있는지를 곧 발견했다.</td></tr><tr><td>2</td><td>한 버전만 만들 때의 손실</td><td>만약 생산자가 그 제품의 오직 한 가지 버전만 만든다면, 그것을 구매했던 사람들은 기꺼이 더 많은 돈을 쓰려고 했을 수도 있어서 회사는 일부 수입을 잃을 것이다.</td></tr><tr><td>3</td><td>두 버전에서는 저가 선택</td><td>만약 회사가 두 버전을 제공하는데 한 버전이 나머지보다 더 많은 기능과 더 비싼 가격을 가진다면, 사람들은 두 모델을 비교하고 여전히 덜 비싼 것을 살 것이다.</td></tr><tr><td>4</td><td>고가 모델이 바꾸는 선택</td><td>하지만 회사가 나머지 두 개보다 훨씬 더 많은 기능과 더 비싼 가격을 가진 세 번째 모델을 출시한다면 두 번째 모델의 판매가 증가하는데, 많은 사람은 가장 비싼 모델의 기능을 좋아하지만 그것의 가격은 좋아하지 않기 때문이다.</td></tr><tr><td>5</td><td>중간 제품의 절충 장점</td><td>중간 제품은 가장 저렴한 제품보다 더 많은 기능이 있고 가장 고급 모델보다는 덜 비싸다.</td></tr><tr><td>6</td><td>알아채지 못한 가격 조종</td><td>그들은 더 비싼 가격의 제품의 존재에 의해 자신이 조종되었다는 것을 알지 못한 채 중간 제품을 구입한다.</td></tr></tbody></table></div>"}]}},{"id":"11-03","lesson":11,"type":"빈칸 추론","title":"기후 변화가 이야기가 될 수 없을 때","source":"2024년 10월 34번","page":50,"summary":"기후 변화가 삶 전체를 뒤덮는 현실이 되면 그것을 멀리 있는 이야기로 소비할 수 없고, 사람들은 기후 위기 안에서 현실을 외면하는 이야기를 만들게 된다.","footnote":"","sents":[{"title":"현실이 픽션 장르를 지울 때","en":"On-screen, climate disaster is everywhere you look, <b class=\"sl\">/</b> but the scope of the world’s climate transformation may just as quickly eliminate the climate-fiction genre <b class=\"sl\">/</b> — indeed eliminate any effort <span class=\"an ul\" data-n=\"effort를 수식하는 to부정사\"><span class=\"an-word\">to tell</span></span> the story of warming, which could grow too large and too obvious even for Hollywood.","tr":"영화상 기후 재난은 여러분이 보는 어디에나 있지만, 세계의 기후 변화의 범위는 그것만큼이나 빨리 기후 픽션 장르를 없앨지도 모르고, 실제로 온난화 이야기를 하고자 하는 노력도 없애 버릴지 모른다. 온난화는 할리우드에서조차 다루기에는 너무 커지고 너무 명백해질 수 있다.","sv":[["S","climate disaster / the scope of the world’s climate transformation","주어"],["V","is / may eliminate","동사"],["C","everywhere you look","보어"],["O","the climate-fiction genre / any effort to tell the story of warming","목적어"]],"chunks":[["On-screen, climate disaster is everywhere you look,","영화상 기후 재난은 여러분이 보는 어디에나 있지만,",[]],["but the scope of the world’s climate transformation may just as quickly eliminate the climate-fiction genre","세계의 기후 변화의 범위는 그것만큼이나 빨리 기후 픽션 장르를 없앨지도 모르고",[]],["— indeed eliminate any effort to tell the story of warming, which could grow too large and too obvious even for Hollywood.","— 실제로 온난화 이야기를 하고자 하는 노력도 없애 버리는데, 그것은 할리우드에서조차 너무 커지고 너무 명백해질 것이다.",[["effort를 수식하는 to부정사","g3-1"]]]],"mnote":"effort를 수식하는 to부정사: any effort to tell the story에서 to tell은 ‘이야기하려는 노력’이라는 뜻으로 effort를 뒤에서 수식한다."},{"title":"주변적일 때 가능한 이야기","en":"You can tell stories ‘about’ climate change <b class=\"sl\">/</b> while it still <span class=\"an ul\" data-n=\"시간절의 주어와 동사\"><span class=\"an-word\">seems</span></span> a marginal feature of human life.","tr":"기후 변화가 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에는 여러분은 그것에 관한 이야기를 할 수 있을 것이다.","sv":[["S","You","주어"],["V","can tell","동사"],["O","stories ‘about’ climate change","목적어"],["M","while it still seems a marginal feature of human life","수식어"]],"chunks":[["You can tell stories ‘about’ climate change","여러분은 기후 변화에 관한 이야기를 할 수 있을 것이다",[]],["while it still seems a marginal feature of human life.","그것이 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에는.",[["시간절의 주어와 동사","g3-2"]]]],"mnote":"시간절의 주어와 동사: while절의 주어 it은 climate change를 받는 단수 대명사이므로 seems를 쓴다."},{"title":"영향으로부터 벗어날 수 없음","en":"But when the temperature rises by three or four more degrees, <b class=\"sl\">/</b> hardly anyone will be able to feel <span class=\"an ul\" data-n=\"feel + 형용사적 과거분사\"><span class=\"an-word\">isolated</span></span> from its impacts.","tr":"하지만 기온이 3도 혹은 4도 이상 상승할 때는 아무도 그것의 영향으로부터 고립되었다고 느낄 수 없을 것이다.","sv":[["M","when the temperature rises by three or four more degrees","수식어"],["S","hardly anyone","주어"],["V","will be able to feel","동사"],["C","isolated from its impacts","보어"]],"chunks":[["But when the temperature rises by three or four more degrees,","하지만 기온이 3도 혹은 4도 이상 상승할 때는,",[]],["hardly anyone will be able to feel isolated from its impacts.","아무도 그것의 영향으로부터 고립되었다고 느낄 수 없을 것이다.",[["feel + 형용사적 과거분사","g3-3"]]]],"mnote":"feel + 형용사적 과거분사: 사람은 영향에서 분리된 상태를 느끼므로 수동 의미의 isolated가 보어로 온다. hardly anyone은 ‘거의 아무도 ~않다’이다."},{"title":"지평선 전체로 퍼진 현실","en":"And so as climate change expands across the horizon, <b class=\"sl\">/</b> it may cease <span class=\"an ul\" data-n=\"cease + to부정사\"><span class=\"an-word\">to be</span></span> a story.","tr":"그리고 기후 변화가 지평선을 넘어 확장될 때 그것은 이야기가 되기를 멈출 것이다.","sv":[["M","as climate change expands across the horizon","수식어"],["S","it","주어"],["V","may cease","동사"],["O","to be a story","목적어"]],"chunks":[["And so as climate change expands across the horizon,","그리고 기후 변화가 지평선을 넘어 확장될 때,",[]],["it may cease to be a story.","그것은 이야기가 되기를 멈출 것이다.",[["cease + to부정사","g3-4"]]]],"mnote":"cease + to부정사: cease to be는 ‘더 이상 ~이지 않게 되다’이다. cease 뒤에 동사원형 be만을 바로 놓을 수 없다."},{"title":"창밖의 현실을 왜 픽션으로 보는가","en":"Why watch or read climate fiction <b class=\"sl\">/</b> about the world you can see <span class=\"an ul\" data-n=\"동사를 수식하는 부사\"><span class=\"an-word\">plainly</span></span> out your own window?","tr":"왜 여러분 자신의 창문 밖으로 뚜렷하게 볼 수 있는 세상에 대한 기후 픽션을 보거나 읽겠는가?","sv":[["X","Why + 동사원형: 수사의문문","절·구조"],["V","watch or read","동사"],["O","climate fiction","목적어"],["M","about the world (that) you can see plainly out your own window","수식어"]],"chunks":[["Why watch or read climate fiction","왜 기후 픽션을 보거나 읽겠는가",[]],["about the world you can see plainly out your own window?","여러분 자신의 창문 밖으로 뚜렷하게 볼 수 있는 세상에 대한?",[["동사를 수식하는 부사","g3-5"]]]],"mnote":"동사를 수식하는 부사: see를 수식하여 ‘뚜렷하게 보다’를 뜻하므로 부사 plainly를 쓴다. the world 뒤에는 목적격 관계대명사가 생략되어 있다."},{"title":"아직 남아 있는 현실 도피의 즐거움","en":"At the moment, stories <span class=\"an ul\" data-n=\"명사를 수식하는 현재분사\"><span class=\"an-word\">illustrating</span></span> global warming <b class=\"sl\">/</b> can still offer an escapist pleasure, <b class=\"sl\">/</b> even if that pleasure often comes in the form of horror.","tr":"비록 그 즐거움이 종종 공포의 형태로 올지라도 지금 당장은 지구 온난화를 묘사하는 이야기가 현실 도피적인 즐거움을 여전히 제공할 수 있다.","sv":[["S","stories illustrating global warming","주어"],["V","can offer","동사"],["O","an escapist pleasure","목적어"],["M","At the moment / even if that pleasure often comes in the form of horror","수식어"]],"chunks":[["At the moment, stories illustrating global warming","지금 당장은 지구 온난화를 묘사하는 이야기가",[["명사를 수식하는 현재분사","g3-6"]]],["can still offer an escapist pleasure,","현실 도피적인 즐거움을 여전히 제공할 수 있다,",[]],["even if that pleasure often comes in the form of horror.","비록 그 즐거움이 종종 공포의 형태로 올지라도.",[]]],"mnote":"명사를 수식하는 현재분사: 이야기가 온난화를 묘사하는 능동 관계이므로 illustrating을 쓴다. 뒤의 global warming은 illustrating의 목적어이다."},{"title":"about에서 within으로","en":"But when we can no longer pretend that climate suffering is distant — in time or in place — <b class=\"sl\">/</b> we will stop <span class=\"an ul\" data-n=\"stop + 동명사와 의미 구별\"><span class=\"an-word\">pretending</span></span> about it <b class=\"sl\">/</b> and start pretending within it.","tr":"하지만 우리가 더 이상 기후 고통이 시간적으로 또는 장소적으로 멀리 있다고 가장할 수 없을 때, 우리는 그것에 대해 가장하는 것을 멈추고 그것 내에서 가장하기 시작할 것이다.","sv":[["M","when we can no longer pretend that climate suffering is distant","수식어"],["S","we","주어"],["V","will stop / start","동사"],["O","pretending about it / pretending within it","목적어"]],"chunks":[["But when we can no longer pretend that climate suffering is distant — in time or in place —","하지만 우리가 더 이상 기후 고통이 시간적으로 또는 장소적으로 멀리 있다고 가장할 수 없을 때,",[]],["we will stop pretending about it","우리는 그것에 대해 가장하는 것을 멈추고",[["stop + 동명사와 의미 구별","g3-7"]]],["and start pretending within it.","그것 내에서 가장하기 시작할 것이다.",[["stop + 동명사와 의미 구별","g3-7"]]]],"mnote":"stop + 동명사와 의미 구별: stop pretending은 ‘가장하는 것을 멈추다’이고 stop to pretend는 ‘가장하기 위해 다른 일을 멈추다’이므로 문맥이 달라진다."}],"grammar":[{"group":"문장 1","items":[{"id":"g3-1","title":"effort를 수식하는 to부정사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>On-screen, climate disaster is everywhere you look, but the scope of the world’s climate transformation may just as quickly eliminate the climate-fiction genre — indeed eliminate any effort <mark>to tell</mark> the story of warming, which could grow too large and too obvious even for Hollywood.</div><div class=\"def-box\">any effort to tell the story에서 to tell은 ‘이야기하려는 노력’이라는 뜻으로 effort를 뒤에서 수식한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to tell / telling]</span></div>"}]},{"group":"문장 2","items":[{"id":"g3-2","title":"시간절의 주어와 동사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>You can tell stories ‘about’ climate change while it still <mark>seems</mark> a marginal feature of human life.</div><div class=\"def-box\">while절의 주어 it은 climate change를 받는 단수 대명사이므로 seems를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[seems / seem]</span></div>"}]},{"group":"문장 3","items":[{"id":"g3-3","title":"feel + 형용사적 과거분사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>But when the temperature rises by three or four more degrees, hardly anyone will be able to feel <mark>isolated</mark> from its impacts.</div><div class=\"def-box\">사람은 영향에서 분리된 상태를 느끼므로 수동 의미의 isolated가 보어로 온다. hardly anyone은 ‘거의 아무도 ~않다’이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[isolated / isolating]</span></div>"}]},{"group":"문장 4","items":[{"id":"g3-4","title":"cease + to부정사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>And so as climate change expands across the horizon, it may cease <mark>to be</mark> a story.</div><div class=\"def-box\">cease to be는 ‘더 이상 ~이지 않게 되다’이다. cease 뒤에 동사원형 be만을 바로 놓을 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to be / be]</span></div>"}]},{"group":"문장 5","items":[{"id":"g3-5","title":"동사를 수식하는 부사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>Why watch or read climate fiction about the world you can see <mark>plainly</mark> out your own window?</div><div class=\"def-box\">see를 수식하여 ‘뚜렷하게 보다’를 뜻하므로 부사 plainly를 쓴다. the world 뒤에는 목적격 관계대명사가 생략되어 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[plainly / plain]</span></div>"}]},{"group":"문장 6","items":[{"id":"g3-6","title":"명사를 수식하는 현재분사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>At the moment, stories <mark>illustrating</mark> global warming can still offer an escapist pleasure, even if that pleasure often comes in the form of horror.</div><div class=\"def-box\">이야기가 온난화를 묘사하는 능동 관계이므로 illustrating을 쓴다. 뒤의 global warming은 illustrating의 목적어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[illustrating / illustrated]</span></div>"}]},{"group":"문장 7","items":[{"id":"g3-7","title":"stop + 동명사와 의미 구별","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>But when we can no longer pretend that climate suffering is distant — in time or in place — we will stop <mark>pretending</mark> about it and start pretending within it.</div><div class=\"def-box\">stop pretending은 ‘가장하는 것을 멈추다’이고 stop to pretend는 ‘가장하기 위해 다른 일을 멈추다’이므로 문맥이 달라진다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[pretending / to pretend]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 현재</b>기후 재난은 화면에서 이야기로 다뤄진다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 조건</b>기후 변화가 주변적이고 멀게 느껴질 때 이야기가 가능하다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 전환</b>온도가 더 올라 영향에서 벗어날 수 없으면 이야기와 현실의 거리가 사라진다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 결론</b>그것에 대해 상상하기보다 그 안에서 다른 것을 상상하게 된다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>기후 변화가 이야기가 될 수 없을 때</b><p>기후 변화가 삶 전체를 뒤덮는 현실이 되면 그것을 멀리 있는 이야기로 소비할 수 없고, 사람들은 기후 위기 안에서 현실을 외면하는 이야기를 만들게 된다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">But when we can no longer pretend that climate suffering is distant — in time or in place — we will <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">stop pretending about it and start pretending within it</b></div><p>about과 within의 대비는 멀리서 위기를 다루는 허구와 위기가 현실이 된 뒤 그 현실 안에서 만드는 허구의 차이를 보여 준다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>현실이 픽션 장르를 지울 때</td><td>영화상 기후 재난은 여러분이 보는 어디에나 있지만, 세계의 기후 변화의 범위는 그것만큼이나 빨리 기후 픽션 장르를 없앨지도 모르고, 실제로 온난화 이야기를 하고자 하는 노력도 없애 버릴지 모른다. 온난화는 할리우드에서조차 다루기에는 너무 커지고 너무 명백해질 수 있다.</td></tr><tr><td>2</td><td>주변적일 때 가능한 이야기</td><td>기후 변화가 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에는 여러분은 그것에 관한 이야기를 할 수 있을 것이다.</td></tr><tr><td>3</td><td>영향으로부터 벗어날 수 없음</td><td>하지만 기온이 3도 혹은 4도 이상 상승할 때는 아무도 그것의 영향으로부터 고립되었다고 느낄 수 없을 것이다.</td></tr><tr><td>4</td><td>지평선 전체로 퍼진 현실</td><td>그리고 기후 변화가 지평선을 넘어 확장될 때 그것은 이야기가 되기를 멈출 것이다.</td></tr><tr><td>5</td><td>창밖의 현실을 왜 픽션으로 보는가</td><td>왜 여러분 자신의 창문 밖으로 뚜렷하게 볼 수 있는 세상에 대한 기후 픽션을 보거나 읽겠는가?</td></tr><tr><td>6</td><td>아직 남아 있는 현실 도피의 즐거움</td><td>비록 그 즐거움이 종종 공포의 형태로 올지라도 지금 당장은 지구 온난화를 묘사하는 이야기가 현실 도피적인 즐거움을 여전히 제공할 수 있다.</td></tr><tr><td>7</td><td>about에서 within으로</td><td>하지만 우리가 더 이상 기후 고통이 시간적으로 또는 장소적으로 멀리 있다고 가장할 수 없을 때, 우리는 그것에 대해 가장하는 것을 멈추고 그것 내에서 가장하기 시작할 것이다.</td></tr></tbody></table></div>"}]}},{"id":"11-04","lesson":11,"type":"빈칸 추론","title":"Plato가 말한 진정한 아름다움","source":"2025년 3월 31번","page":51,"summary":"미의 형상은 특정한 색·모양·크기가 없는 추상적 관념으로, 우리가 보는 모든 아름다운 것 속에 존재한다.","footnote":"","sents":[{"title":"아름다운 사물은 부분적 반영","en":"Plato argued that <b class=\"sl\">/</b> when you see something <span class=\"an ul\" data-n=\"선행사가 있는 주격 관계대명사\"><span class=\"an-word\">that strikes</span></span> you as beautiful, <b class=\"sl\">/</b> you are really just seeing a partial reflection of true beauty, <b class=\"sl\">/</b> just as a painting or even a photograph only captures part of the real thing.","tr":"Plato는 여러분이 자신에게 아름답다는 인상을 주는 무언가를 볼 때, 마치 그림이나 사진조차 실재하는 것의 일부만을 포착하는 것처럼 여러분은 실제로는 진정한 아름다움의 부분적인 반영을 보고 있을 뿐이라고 주장했다.","sv":[["S","Plato","주어"],["V","argued","동사"],["O","that ... you are really just seeing a partial reflection of true beauty","목적어"],["M","when ... / just as ...","수식어"]],"chunks":[["Plato argued that","Plato는 주장했다",[]],["when you see something that strikes you as beautiful,","여러분이 자신에게 아름답다는 인상을 주는 무언가를 볼 때,",[["선행사가 있는 주격 관계대명사","g4-1"]]],["you are really just seeing a partial reflection of true beauty,","여러분은 실제로는 진정한 아름다움의 부분적인 반영을 보고 있을 뿐이라고,",[]],["just as a painting or even a photograph only captures part of the real thing.","마치 그림이나 사진조차 실재하는 것의 일부만을 포착하는 것처럼.",[]]],"mnote":"선행사가 있는 주격 관계대명사: something이라는 선행사가 있으므로 뒤에는 that이 온다. what은 선행사를 포함하므로 something 뒤에 같은 방식으로 쓸 수 없다."},{"title":"형상에 없는 구체적 속성","en":"True beauty, or <span class=\"an ul\" data-n=\"선행사를 포함한 관계대명사 what\"><span class=\"an-word\">what</span></span> Plato calls the Form of Beauty, <b class=\"sl\">/</b> has no particular color, shape, or size.","tr":"진정한 아름다움, 즉 Plato가 미의 형상이라고 부르는 것은 특정한 색상, 모양, 혹은 크기를 갖고 있지 않다.","sv":[["S","True beauty, or what Plato calls the Form of Beauty","주어"],["V","has","동사"],["O","no particular color, shape, or size","목적어"]],"chunks":[["True beauty, or what Plato calls the Form of Beauty,","진정한 아름다움, 즉 Plato가 미의 형상이라고 부르는 것은,",[["선행사를 포함한 관계대명사 what","g4-2"]]],["has no particular color, shape, or size.","특정한 색상, 모양, 혹은 크기를 갖고 있지 않다.",[]]],"mnote":"선행사를 포함한 관계대명사 what: what Plato calls the Form of Beauty는 ‘Plato가 미의 형상이라고 부르는 것’이라는 명사절이며 True beauty를 다시 설명한다."},{"title":"숫자 5와 같은 추상적 관념","en":"Rather, it is an <span class=\"an ul\" data-n=\"명사를 수식하는 형용사\"><span class=\"an-word\">abstract</span></span> idea, <b class=\"sl\">/</b> like the number five.","tr":"오히려 그것은 숫자 5처럼 추상적인 관념이다.","sv":[["S","it","주어"],["V","is","동사"],["C","an abstract idea","보어"],["M","like the number five","수식어"]],"chunks":[["Rather, it is an abstract idea,","오히려 그것은 추상적인 관념이다,",[["명사를 수식하는 형용사","g4-3"]]],["like the number five.","숫자 5처럼.",[]]],"mnote":"명사를 수식하는 형용사: idea를 직접 수식하는 것은 형용사 abstract이다. abstractly는 부사이므로 이 자리에 쓸 수 없다."},{"title":"숫자의 표현과 숫자 자체의 구별","en":"You can make drawings of the number five in blue or red ink, big or small, <b class=\"sl\">/</b> but the number five <span class=\"an ul\" data-n=\"강조 용법의 재귀대명사\"><span class=\"an-word\">itself</span></span> is none of those things.","tr":"여러분은 숫자 5의 그림을 파란색이나 빨간색 잉크로, 크게나 작게 만들 수 있지만 숫자 5 자체는 그런 것들 중 어느 것도 아니다.","sv":[["S","You / the number five itself","주어"],["V","can make / is","동사"],["O","drawings of the number five","목적어"],["C","none of those things","보어"]],"chunks":[["You can make drawings of the number five in blue or red ink, big or small,","여러분은 숫자 5의 그림을 파란색이나 빨간색 잉크로, 크게나 작게 만들 수 있지만,",[]],["but the number five itself is none of those things.","숫자 5 자체는 그런 것들 중 어느 것도 아니다.",[["강조 용법의 재귀대명사","g4-4"]]]],"mnote":"강조 용법의 재귀대명사: the number five는 단수 개념이므로 그 자체를 강조하는 itself를 쓴다."},{"title":"물리적 형태의 부재","en":"It <span class=\"an ul\" data-n=\"단수 주어 It의 동사\"><span class=\"an-word\">has</span></span> <b class=\"sl\">/</b> no physical form.","tr":"그것은 구체적인 형태를 가지고 있지 않다.","sv":[["S","It","주어"],["V","has","동사"],["O","no physical form","목적어"]],"chunks":[["It has","그것은 가지고 있지 않다",[["단수 주어 It의 동사","g4-5"]]],["no physical form.","구체적인 형태를.",[]]],"mnote":"단수 주어 It의 동사: It은 숫자 5라는 추상적 개념을 받는 단수 대명사이므로 has를 쓴다."},{"title":"삼각형의 관념을 생각하기","en":"<span class=\"an ul\" data-n=\"명령문의 동사원형\"><span class=\"an-word\">Think</span></span> of the idea of a triangle, <b class=\"sl\">/</b> for example.","tr":"예를 들어 삼각형이라는 관념을 생각해 보라.","sv":[["X","명령문: 주어 you 생략","절·구조"],["V","Think","동사"],["M","of the idea of a triangle / for example","수식어"]],"chunks":[["Think of the idea of a triangle,","삼각형이라는 관념을 생각해 보라,",[["명령문의 동사원형","g4-6"]]],["for example.","예를 들어.",[]]],"mnote":"명령문의 동사원형: 명령문은 주어 you가 생략되고 동사원형 Think로 시작한다."},{"title":"모든 삼각형 안에 있는 관념","en":"Although it has no particular color or size, <b class=\"sl\">/</b> it somehow <span class=\"an ul\" data-n=\"주어와 동사의 수 일치\"><span class=\"an-word\">lies</span></span> within each and every triangle you see.","tr":"그것은 특정한 색상이나 크기가 없을지라도 당신이 보는 각각의 모든 삼각형 속에 어떻게든 존재한다.","sv":[["M","Although it has no particular color or size","수식어"],["S","it","주어"],["V","lies","동사"],["M","within each and every triangle (that) you see","수식어"]],"chunks":[["Although it has no particular color or size,","그것은 특정한 색상이나 크기가 없을지라도,",[]],["it somehow lies within each and every triangle you see.","당신이 보는 각각의 모든 삼각형 속에 어떻게든 존재한다.",[["주어와 동사의 수 일치","g4-7"]]]],"mnote":"주어와 동사의 수 일치: 주절의 주어 it은 삼각형의 관념을 받는 단수 대명사이므로 lies를 쓴다. each and every는 뒤의 단수명사 triangle을 수식한다."},{"title":"같은 원리를 아름다움에 적용","en":"Plato thought <b class=\"sl\">/</b> the same <span class=\"an ul\" data-n=\"명사절 안의 단수 주어\"><span class=\"an-word\">was</span></span> true of beauty.","tr":"Plato는 아름다움도 마찬가지라고 생각했다.","sv":[["S","Plato","주어"],["V","thought","동사"],["O","(that) the same was true of beauty","목적어"]],"chunks":[["Plato thought","Plato는 생각했다",[]],["the same was true of beauty.","아름다움도 마찬가지라고.",[["명사절 안의 단수 주어","g4-8"]]]],"mnote":"명사절 안의 단수 주어: thought 뒤에는 접속사 that이 생략되었으며, 명사절의 주어 the same을 단수로 받아 was를 쓴다."},{"title":"모든 아름다운 것 속의 형상","en":"The Form of Beauty somehow lies <b class=\"sl\">/</b> within each and every beautiful <span class=\"an ul\" data-n=\"each and every + 단수명사\"><span class=\"an-word\">thing</span></span> you see.","tr":"미의 원형은 당신이 보는 각각의 모든 아름다운 것 속에 어떻게든 존재한다.","sv":[["S","The Form of Beauty","주어"],["V","lies","동사"],["M","somehow / within each and every beautiful thing (that) you see","수식어"]],"chunks":[["The Form of Beauty somehow lies","미의 원형은 어떻게든 존재한다",[]],["within each and every beautiful thing you see.","당신이 보는 각각의 모든 아름다운 것 속에.",[["each and every + 단수명사","g4-9"]]]],"mnote":"each and every + 단수명사: each and every 뒤에는 단수명사 thing이 온다. you see는 목적격 관계대명사가 생략된 관계절이다."}],"grammar":[{"group":"문장 1","items":[{"id":"g4-1","title":"선행사가 있는 주격 관계대명사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Plato argued that when you see something <mark>that strikes</mark> you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing.</div><div class=\"def-box\">something이라는 선행사가 있으므로 뒤에는 that이 온다. what은 선행사를 포함하므로 something 뒤에 같은 방식으로 쓸 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[that strikes / what strikes]</span></div>"}]},{"group":"문장 2","items":[{"id":"g4-2","title":"선행사를 포함한 관계대명사 what","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>True beauty, or <mark>what</mark> Plato calls the Form of Beauty, has no particular color, shape, or size.</div><div class=\"def-box\">what Plato calls the Form of Beauty는 ‘Plato가 미의 형상이라고 부르는 것’이라는 명사절이며 True beauty를 다시 설명한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 3","items":[{"id":"g4-3","title":"명사를 수식하는 형용사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>Rather, it is an <mark>abstract</mark> idea, like the number five.</div><div class=\"def-box\">idea를 직접 수식하는 것은 형용사 abstract이다. abstractly는 부사이므로 이 자리에 쓸 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[abstract / abstractly]</span></div>"}]},{"group":"문장 4","items":[{"id":"g4-4","title":"강조 용법의 재귀대명사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>You can make drawings of the number five in blue or red ink, big or small, but the number five <mark>itself</mark> is none of those things.</div><div class=\"def-box\">the number five는 단수 개념이므로 그 자체를 강조하는 itself를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[itself / themselves]</span></div>"}]},{"group":"문장 5","items":[{"id":"g4-5","title":"단수 주어 It의 동사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>It <mark>has</mark> no physical form.</div><div class=\"def-box\">It은 숫자 5라는 추상적 개념을 받는 단수 대명사이므로 has를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[has / have]</span></div>"}]},{"group":"문장 6","items":[{"id":"g4-6","title":"명령문의 동사원형","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span><mark>Think</mark> of the idea of a triangle, for example.</div><div class=\"def-box\">명령문은 주어 you가 생략되고 동사원형 Think로 시작한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[Think / Thinking]</span></div>"}]},{"group":"문장 7","items":[{"id":"g4-7","title":"주어와 동사의 수 일치","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Although it has no particular color or size, it somehow <mark>lies</mark> within each and every triangle you see.</div><div class=\"def-box\">주절의 주어 it은 삼각형의 관념을 받는 단수 대명사이므로 lies를 쓴다. each and every는 뒤의 단수명사 triangle을 수식한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[lies / lie]</span></div>"}]},{"group":"문장 8","items":[{"id":"g4-8","title":"명사절 안의 단수 주어","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>Plato thought the same <mark>was</mark> true of beauty.</div><div class=\"def-box\">thought 뒤에는 접속사 that이 생략되었으며, 명사절의 주어 the same을 단수로 받아 was를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[was / were]</span></div>"}]},{"group":"문장 9","items":[{"id":"g4-9","title":"each and every + 단수명사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>The Form of Beauty somehow lies within each and every beautiful <mark>thing</mark> you see.</div><div class=\"def-box\">each and every 뒤에는 단수명사 thing이 온다. you see는 목적격 관계대명사가 생략된 관계절이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[thing / things]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 주장</b>구체적 아름다움은 진정한 아름다움의 부분적 반영이다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 정의</b>미의 형상은 색·모양·크기가 없는 추상적 관념이다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 유추</b>숫자 5와 삼각형의 관념은 특정 표현에 한정되지 않는다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 적용</b>미의 형상도 각각의 모든 아름다운 것 속에 존재한다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>Plato가 말한 진정한 아름다움</b><p>미의 형상은 특정한 색·모양·크기가 없는 추상적 관념으로, 우리가 보는 모든 아름다운 것 속에 존재한다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">The Form of Beauty somehow <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">lies within each and every beautiful thing you see</b></div><p>추상적인 숫자·삼각형과 그 구체적 표현의 관계를 미의 형상과 아름다운 사물의 관계에 적용한다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>아름다운 사물은 부분적 반영</td><td>Plato는 여러분이 자신에게 아름답다는 인상을 주는 무언가를 볼 때, 마치 그림이나 사진조차 실재하는 것의 일부만을 포착하는 것처럼 여러분은 실제로는 진정한 아름다움의 부분적인 반영을 보고 있을 뿐이라고 주장했다.</td></tr><tr><td>2</td><td>형상에 없는 구체적 속성</td><td>진정한 아름다움, 즉 Plato가 미의 형상이라고 부르는 것은 특정한 색상, 모양, 혹은 크기를 갖고 있지 않다.</td></tr><tr><td>3</td><td>숫자 5와 같은 추상적 관념</td><td>오히려 그것은 숫자 5처럼 추상적인 관념이다.</td></tr><tr><td>4</td><td>숫자의 표현과 숫자 자체의 구별</td><td>여러분은 숫자 5의 그림을 파란색이나 빨간색 잉크로, 크게나 작게 만들 수 있지만 숫자 5 자체는 그런 것들 중 어느 것도 아니다.</td></tr><tr><td>5</td><td>물리적 형태의 부재</td><td>그것은 구체적인 형태를 가지고 있지 않다.</td></tr><tr><td>6</td><td>삼각형의 관념을 생각하기</td><td>예를 들어 삼각형이라는 관념을 생각해 보라.</td></tr><tr><td>7</td><td>모든 삼각형 안에 있는 관념</td><td>그것은 특정한 색상이나 크기가 없을지라도 당신이 보는 각각의 모든 삼각형 속에 어떻게든 존재한다.</td></tr><tr><td>8</td><td>같은 원리를 아름다움에 적용</td><td>Plato는 아름다움도 마찬가지라고 생각했다.</td></tr><tr><td>9</td><td>모든 아름다운 것 속의 형상</td><td>미의 원형은 당신이 보는 각각의 모든 아름다운 것 속에 어떻게든 존재한다.</td></tr></tbody></table></div>"}]}},{"id":"11-05","lesson":11,"type":"빈칸 추론","title":"질문보다 관찰을 말해 주기","source":"2025년 3월 32번","page":52,"summary":"감정적인 자녀와 대화할 때는 이유를 연속해서 묻기보다 관찰한 것을 말하고 반응을 기다리는 것이 효과적이다.","footnote":"","sents":[{"title":"질문보다 관찰 공유가 효과적","en":"As you listen to your child in an emotional moment, <b class=\"sl\">/</b> be aware that sharing simple observations usually <span class=\"an ul\" data-n=\"동명사구 주어와 단수 동사\"><span class=\"an-word\">works</span></span> better than asking questions <b class=\"sl\">/</b> to get a conversation rolling.","tr":"여러분이 어떤 감정적인 순간에 놓인 자녀의 말을 들을 때, 대화가 계속 굴러가게 하기 위해 질문을 하는 것보다 단순한 관찰 결과를 공유하는 것이 대개는 더 효과적임을 인식하라.","sv":[["M","As you listen to your child in an emotional moment","수식어"],["V","be","동사"],["C","aware","보어"],["X","that sharing simple observations usually works better than asking questions","절·구조"]],"chunks":[["As you listen to your child in an emotional moment,","여러분이 어떤 감정적인 순간에 놓인 자녀의 말을 들을 때,",[]],["be aware that sharing simple observations usually works better than asking questions","질문을 하는 것보다 단순한 관찰 결과를 공유하는 것이 대개는 더 효과적임을 인식하라",[["동명사구 주어와 단수 동사","g5-1"]]],["to get a conversation rolling.","대화가 계속 굴러가게 하기 위해.",[]]],"mnote":"동명사구 주어와 단수 동사: that절의 주어는 sharing simple observations 전체이며, 동명사구를 단수로 취급하므로 works를 쓴다. observations에 수를 맞추지 않는다."},{"title":"이유를 모르는 아이","en":"You may ask your child “Why <span class=\"an ul\" data-n=\"직접의문문의 어순\"><span class=\"an-word\">do you feel</span></span> sad?” <b class=\"sl\">/</b> and she may not have a clue.","tr":"여러분이 자녀에게 “왜 슬픈 기분이 드니?”라고 물으면 그녀는 짐작조차 못 할 수도 있다.","sv":[["S","You / she","주어"],["V","may ask / may not have","동사"],["O","your child “Why do you feel sad?” / a clue","목적어"]],"chunks":[["You may ask your child “Why do you feel sad?”","여러분이 자녀에게 “왜 슬픈 기분이 드니?”라고 물으면",[["직접의문문의 어순","g5-2"]]],["and she may not have a clue.","그녀는 짐작조차 못 할 수도 있다.",[]]],"mnote":"직접의문문의 어순: 인용부호 안은 아이에게 직접 하는 질문이므로 Why+do+주어+동사원형 순서이다. 간접의문문의 평서문 어순과 구별한다."},{"title":"당장 떠오르지 않는 답","en":"As a child, <b class=\"sl\">/</b> she may not <span class=\"an ul\" data-n=\"조동사 뒤 동사원형\"><span class=\"an-word\">have</span></span> an answer on the tip of her tongue.","tr":"아이로서 그녀는 답이 당장 떠오르지 않을지도 모른다.","sv":[["M","As a child","수식어"],["S","she","주어"],["V","may not have","동사"],["O","an answer","목적어"],["M","on the tip of her tongue","수식어"]],"chunks":[["As a child,","아이로서,",[]],["she may not have an answer on the tip of her tongue.","그녀는 답이 당장 떠오르지 않을지도 모른다.",[["조동사 뒤 동사원형","g5-3"]]]],"mnote":"조동사 뒤 동사원형: may 뒤에는 동사원형 have가 온다. on the tip of one’s tongue은 ‘혀끝에서 맴도는, 곧 떠오를 듯한’이라는 표현이다."},{"title":"여러 가지 가능한 원인","en":"Maybe she’s feeling sad about her parents’ arguments, <b class=\"sl\">/</b> or because she feels overtired, <b class=\"sl\">/</b> or she’s <span class=\"an ul\" data-n=\"감정을 느끼는 주체의 과거분사\"><span class=\"an-word\">worried</span></span> about a piano recital.","tr":"어쩌면 그녀는 부모님의 말다툼에 대해 슬픔을 느끼고 있거나, 극도로 지쳤기 때문이거나, 혹은 피아노 연주회를 걱정할지도 모른다.","sv":[["S","she","주어"],["V","is feeling / feels / is","동사"],["C","sad / overtired / worried","보어"],["M","about her parents’ arguments / about a piano recital","수식어"]],"chunks":[["Maybe she’s feeling sad about her parents’ arguments,","어쩌면 그녀는 부모님의 말다툼에 대해 슬픔을 느끼고 있거나,",[]],["or because she feels overtired,","극도로 지쳤기 때문이거나,",[]],["or she’s worried about a piano recital.","혹은 피아노 연주회를 걱정할지도 모른다.",[["감정을 느끼는 주체의 과거분사","g5-4"]]]],"mnote":"감정을 느끼는 주체의 과거분사: 아이가 걱정을 느끼는 상태이므로 be worried about을 쓴다. worrying은 ‘걱정을 일으키는’이라는 다른 뜻이 될 수 있다."},{"title":"설명할 수도 못할 수도 있음","en":"But she may or may not be able <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"be able to V\"><span class=\"an-word\">to explain</span></span> any of this.","tr":"그러나 그녀는 이것 중 어떤 것을 설명할 수도 있고 못할 수도 있다.","sv":[["S","she","주어"],["V","may or may not be","동사"],["C","able to explain any of this","보어"]],"chunks":[["But she may or may not be able","그러나 그녀는 할 수도 있고 못할 수도 있다",[]],["to explain any of this.","이것 중 어떤 것을 설명하는 것을.",[["be able to V","g5-5"]]]],"mnote":"be able to V: be able 뒤에는 to부정사가 와서 ‘설명할 수 있다’라는 뜻을 이룬다."},{"title":"답을 해도 정당화가 걱정됨","en":"And even when she does <span class=\"an ul\" data-n=\"강조 do 뒤 동사원형\"><span class=\"an-word\">come</span></span> up with an answer, <b class=\"sl\">/</b> she might be worried that the answer is not good enough <b class=\"sl\">/</b> to justify the feeling.","tr":"그리고 그녀가 정말로 답이 떠오를 때조차도 그녀는 그 대답이 그 감정을 정당화하기에는 충분히 좋지 않다고 걱정할 수도 있다.","sv":[["M","even when she does come up with an answer","수식어"],["S","she","주어"],["V","might be","동사"],["C","worried","보어"],["X","that the answer is not good enough to justify the feeling","절·구조"]],"chunks":[["And even when she does come up with an answer,","그리고 그녀가 정말로 답이 떠오를 때조차도,",[["강조 do 뒤 동사원형","g5-6"]]],["she might be worried that the answer is not good enough","그녀는 그 대답이 충분히 좋지 않다고 걱정할 수도 있다",[]],["to justify the feeling.","그 감정을 정당화하기에는.",[]]],"mnote":"강조 do 뒤 동사원형: does는 ‘정말로’를 강조하는 조동사이다. 따라서 뒤에는 원형 come을 쓰며 comes로 중복 변화시키지 않는다."},{"title":"연속 질문은 침묵으로","en":"Under these circumstances, <b class=\"sl\">/</b> a series of questions can just make a child <span class=\"an ul\" data-n=\"make + 목적어 + 형용사 보어\"><span class=\"an-word\">silent</span></span>.","tr":"이러한 상황에서는 연속된 질문들이 그저 자녀를 침묵하게 만들 수 있다.","sv":[["M","Under these circumstances","수식어"],["S","a series of questions","주어"],["V","can make","동사"],["O","a child","목적어"],["C","silent","보어"]],"chunks":[["Under these circumstances,","이러한 상황에서는,",[]],["a series of questions can just make a child silent.","연속된 질문들이 그저 자녀를 침묵하게 만들 수 있다.",[["make + 목적어 + 형용사 보어","g5-7"]]]],"mnote":"make + 목적어 + 형용사 보어: make a child silent에서 silent는 아이의 결과 상태를 설명하는 형용사 보어이다. make를 수식하는 부사 silently와 다르다."},{"title":"알아챈 것을 그대로 말하기","en":"It’s better <b class=\"sl\">/</b> to simply reflect <span class=\"an ul\" data-n=\"선행사 포함 what 목적어절\"><span class=\"an-word\">what</span></span> you notice.","tr":"여러분이 인지한 것을 단순히 나타내는 것이 더 낫다.","sv":[["S","It (가주어)","주어"],["V","is","동사"],["C","better","보어"],["X","to simply reflect what you notice (진주어)","절·구조"]],"chunks":[["It’s better","더 낫다",[]],["to simply reflect what you notice.","여러분이 인지한 것을 단순히 나타내는 것이.",[["선행사 포함 what 목적어절","g5-8"]]]],"mnote":"선행사 포함 what 목적어절: what you notice는 ‘여러분이 알아챈 것’이라는 명사절로 reflect의 목적어이다. notice의 목적어도 what이 담당한다."},{"title":"관찰을 말하고 반응 기다리기","en":"You can say, “You seem a little tired today,” <b class=\"sl\">/</b> or, “I noticed that you frowned when I mentioned the recital,” <b class=\"sl\">/</b> and <span class=\"an ul\" data-n=\"조동사에 연결된 동사 병렬\"><span class=\"an-word\">wait</span></span> for her response.","tr":"여러분은 “너 오늘 조금 피곤해 보이네.”라고 말하거나 “내가 연주회 얘기를 꺼냈을 때 네가 얼굴을 찡그린 것을 알아챘어.”라고 말하고 그녀의 반응을 기다릴 수 있다.","sv":[["S","You","주어"],["V","can say / wait","동사"],["O","“You seem a little tired today,” or “I noticed ...”","목적어"],["M","for her response","수식어"]],"chunks":[["You can say, “You seem a little tired today,”","여러분은 “너 오늘 조금 피곤해 보이네.”라고 말하거나,",[]],["or, “I noticed that you frowned when I mentioned the recital,”","“내가 연주회 얘기를 꺼냈을 때 네가 얼굴을 찡그린 것을 알아챘어.”라고 말하고,",[]],["and wait for her response.","그녀의 반응을 기다릴 수 있다.",[["조동사에 연결된 동사 병렬","g5-9"]]]],"mnote":"조동사에 연결된 동사 병렬: can 뒤에 say와 wait가 and로 병렬 연결된다. 따라서 wait도 동사원형을 쓴다."}],"grammar":[{"group":"문장 1","items":[{"id":"g5-1","title":"동명사구 주어와 단수 동사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>As you listen to your child in an emotional moment, be aware that sharing simple observations usually <mark>works</mark> better than asking questions to get a conversation rolling.</div><div class=\"def-box\">that절의 주어는 sharing simple observations 전체이며, 동명사구를 단수로 취급하므로 works를 쓴다. observations에 수를 맞추지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[works / work]</span></div>"}]},{"group":"문장 2","items":[{"id":"g5-2","title":"직접의문문의 어순","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>You may ask your child “Why <mark>do you feel</mark> sad?” and she may not have a clue.</div><div class=\"def-box\">인용부호 안은 아이에게 직접 하는 질문이므로 Why+do+주어+동사원형 순서이다. 간접의문문의 평서문 어순과 구별한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[do you feel / you feel]</span></div>"}]},{"group":"문장 3","items":[{"id":"g5-3","title":"조동사 뒤 동사원형","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>As a child, she may not <mark>have</mark> an answer on the tip of her tongue.</div><div class=\"def-box\">may 뒤에는 동사원형 have가 온다. on the tip of one’s tongue은 ‘혀끝에서 맴도는, 곧 떠오를 듯한’이라는 표현이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[have / has]</span></div>"}]},{"group":"문장 4","items":[{"id":"g5-4","title":"감정을 느끼는 주체의 과거분사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>Maybe she’s feeling sad about her parents’ arguments, or because she feels overtired, or she’s <mark>worried</mark> about a piano recital.</div><div class=\"def-box\">아이가 걱정을 느끼는 상태이므로 be worried about을 쓴다. worrying은 ‘걱정을 일으키는’이라는 다른 뜻이 될 수 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[worried / worrying]</span></div>"}]},{"group":"문장 5","items":[{"id":"g5-5","title":"be able to V","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>But she may or may not be able <mark>to explain</mark> any of this.</div><div class=\"def-box\">be able 뒤에는 to부정사가 와서 ‘설명할 수 있다’라는 뜻을 이룬다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to explain / explaining]</span></div>"}]},{"group":"문장 6","items":[{"id":"g5-6","title":"강조 do 뒤 동사원형","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>And even when she does <mark>come</mark> up with an answer, she might be worried that the answer is not good enough to justify the feeling.</div><div class=\"def-box\">does는 ‘정말로’를 강조하는 조동사이다. 따라서 뒤에는 원형 come을 쓰며 comes로 중복 변화시키지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[come / comes]</span></div>"}]},{"group":"문장 7","items":[{"id":"g5-7","title":"make + 목적어 + 형용사 보어","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Under these circumstances, a series of questions can just make a child <mark>silent</mark>.</div><div class=\"def-box\">make a child silent에서 silent는 아이의 결과 상태를 설명하는 형용사 보어이다. make를 수식하는 부사 silently와 다르다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[silent / silently]</span></div>"}]},{"group":"문장 8","items":[{"id":"g5-8","title":"선행사 포함 what 목적어절","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>It’s better to simply reflect <mark>what</mark> you notice.</div><div class=\"def-box\">what you notice는 ‘여러분이 알아챈 것’이라는 명사절로 reflect의 목적어이다. notice의 목적어도 what이 담당한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 9","items":[{"id":"g5-9","title":"조동사에 연결된 동사 병렬","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>You can say, “You seem a little tired today,” or, “I noticed that you frowned when I mentioned the recital,” and <mark>wait</mark> for her response.</div><div class=\"def-box\">can 뒤에 say와 wait가 and로 병렬 연결된다. 따라서 wait도 동사원형을 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[wait / waiting]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 권고</b>질문보다 단순한 관찰을 공유하라.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 문제</b>아이는 감정의 이유를 모르거나 설명하지 못할 수 있다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 결과</b>답을 요구하는 연속 질문은 아이를 침묵시킬 수 있다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 대안</b>피곤함이나 표정 변화를 말하고 아이의 반응을 기다린다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>질문보다 관찰을 말해 주기</b><p>감정적인 자녀와 대화할 때는 이유를 연속해서 묻기보다 관찰한 것을 말하고 반응을 기다리는 것이 효과적이다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">It’s better to <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">simply reflect what you notice</b></div><p>아이가 즉시 감정을 설명해야 한다는 부담을 덜어 주는 관찰의 공유가 대화를 이어 가게 한다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>질문보다 관찰 공유가 효과적</td><td>여러분이 어떤 감정적인 순간에 놓인 자녀의 말을 들을 때, 대화가 계속 굴러가게 하기 위해 질문을 하는 것보다 단순한 관찰 결과를 공유하는 것이 대개는 더 효과적임을 인식하라.</td></tr><tr><td>2</td><td>이유를 모르는 아이</td><td>여러분이 자녀에게 “왜 슬픈 기분이 드니?”라고 물으면 그녀는 짐작조차 못 할 수도 있다.</td></tr><tr><td>3</td><td>당장 떠오르지 않는 답</td><td>아이로서 그녀는 답이 당장 떠오르지 않을지도 모른다.</td></tr><tr><td>4</td><td>여러 가지 가능한 원인</td><td>어쩌면 그녀는 부모님의 말다툼에 대해 슬픔을 느끼고 있거나, 극도로 지쳤기 때문이거나, 혹은 피아노 연주회를 걱정할지도 모른다.</td></tr><tr><td>5</td><td>설명할 수도 못할 수도 있음</td><td>그러나 그녀는 이것 중 어떤 것을 설명할 수도 있고 못할 수도 있다.</td></tr><tr><td>6</td><td>답을 해도 정당화가 걱정됨</td><td>그리고 그녀가 정말로 답이 떠오를 때조차도 그녀는 그 대답이 그 감정을 정당화하기에는 충분히 좋지 않다고 걱정할 수도 있다.</td></tr><tr><td>7</td><td>연속 질문은 침묵으로</td><td>이러한 상황에서는 연속된 질문들이 그저 자녀를 침묵하게 만들 수 있다.</td></tr><tr><td>8</td><td>알아챈 것을 그대로 말하기</td><td>여러분이 인지한 것을 단순히 나타내는 것이 더 낫다.</td></tr><tr><td>9</td><td>관찰을 말하고 반응 기다리기</td><td>여러분은 “너 오늘 조금 피곤해 보이네.”라고 말하거나 “내가 연주회 얘기를 꺼냈을 때 네가 얼굴을 찡그린 것을 알아챘어.”라고 말하고 그녀의 반응을 기다릴 수 있다.</td></tr></tbody></table></div>"}]}},{"id":"11-06","lesson":11,"type":"빈칸 추론","title":"땀으로 감정을 재는 법","source":"2025년 3월 33번","page":53,"summary":"감정에 따른 무의식적인 땀과 피부 전도도 변화를 측정하면 주관적인 감정의 강도를 객관적인 수치로 나타낼 수 있다.","footnote":"* sweat gland 땀샘","sents":[{"title":"감정에 따라 변하는 전기 전도","en":"Our skin conducts electricity more or less <span class=\"an ul\" data-n=\"동사를 수식하는 부사\"><span class=\"an-word\">efficiently</span></span>, <b class=\"sl\">/</b> depending on our emotions.","tr":"우리의 피부는 우리의 감정에 따라 전기를 더 효율적으로 또는 덜 효율적으로 전도한다.","sv":[["S","Our skin","주어"],["V","conducts","동사"],["O","electricity","목적어"],["M","more or less efficiently / depending on our emotions","수식어"]],"chunks":[["Our skin conducts electricity more or less efficiently,","우리의 피부는 전기를 더 효율적으로 또는 덜 효율적으로 전도한다,",[["동사를 수식하는 부사","g6-1"]]],["depending on our emotions.","우리의 감정에 따라.",[]]],"mnote":"동사를 수식하는 부사: 전도하는 방식의 효율을 나타내며 conducts를 수식하므로 부사 efficiently를 쓴다."},{"title":"알아차리기 힘든 미량의 땀","en":"We know that when we’re emotionally <span class=\"an ul\" data-n=\"감정 자극을 받는 수동 의미\"><span class=\"an-word\">stimulated</span></span> — stressed, sad, any intense emotion, really — <b class=\"sl\">/</b> our bodies sweat a tiny bit, <b class=\"sl\">/</b> so little we might not even notice.","tr":"우리는 감정적으로 자극되었을 때, 즉 정말로 스트레스를 받거나 슬프거나 어떤 강렬한 감정을 느낄 때, 우리 몸이 너무 적어서 알아차리지도 못할 정도로 땀을 아주 약간 흘린다는 것을 안다.","sv":[["S","We","주어"],["V","know","동사"],["O","that ... our bodies sweat a tiny bit","목적어"],["M","when we’re emotionally stimulated / so little (that) we might not even notice","수식어"]],"chunks":[["We know that when we’re emotionally stimulated — stressed, sad, any intense emotion, really —","우리가 감정적으로 자극되었을 때, 즉 정말로 스트레스를 받거나 슬프거나 어떤 강렬한 감정일 때,",[["감정 자극을 받는 수동 의미","g6-2"]]],["our bodies sweat a tiny bit,","우리 몸은 땀을 아주 약간 흘린다는 것을 안다,",[]],["so little we might not even notice.","너무 적어서 알아차리지도 못할 정도로.",[]]],"mnote":"감정 자극을 받는 수동 의미: 우리가 감정적으로 자극받은 상태이므로 are stimulated를 쓴다. so little 뒤에는 결과절의 that이 생략되어 있다."},{"title":"땀이 나면 전도도가 높아짐","en":"And when those tiny drops of sweat appear, <b class=\"sl\">/</b> our skin gets more electrically <span class=\"an ul\" data-n=\"get + 형용사 보어\"><span class=\"an-word\">conductive</span></span>.","tr":"그리고 이 작은 땀방울이 나타날 때 우리의 피부는 전기적으로 더 전도력이 있는 상태가 된다.","sv":[["M","when those tiny drops of sweat appear","수식어"],["S","our skin","주어"],["V","gets","동사"],["C","more electrically conductive","보어"]],"chunks":[["And when those tiny drops of sweat appear,","그리고 이 작은 땀방울이 나타날 때,",[]],["our skin gets more electrically conductive.","우리의 피부는 전기적으로 더 전도력이 있는 상태가 된다.",[["get + 형용사 보어","g6-3"]]]],"mnote":"get + 형용사 보어: gets는 상태 변화를 나타내며 피부의 상태를 설명하는 형용사 conductive가 보어로 온다."},{"title":"의식과 무관한 땀샘 활동","en":"This change in sweat gland activity happens completely <b class=\"sl\">/</b> without your conscious mind <span class=\"an ul\" data-n=\"without + 명사 + 분사\"><span class=\"an-word\">having</span></span> much say in the matter.","tr":"이러한 땀샘 활동의 변화는 여러분의 의식이 그 상황에 그다지 관여하지 않은 채 일어난다.","sv":[["S","This change in sweat gland activity","주어"],["V","happens","동사"],["M","completely / without your conscious mind having much say in the matter","수식어"]],"chunks":[["This change in sweat gland activity happens completely","이러한 땀샘 활동의 변화는 완전히 일어난다",[]],["without your conscious mind having much say in the matter.","여러분의 의식이 그 상황에 그다지 관여하지 않은 채.",[["without + 명사 + 분사","g6-4"]]]],"mnote":"without + 명사 + 분사: without 뒤에서 your conscious mind가 having의 의미상 주어이다. ‘의식이 별로 관여하지 않은 채’라는 부대 상황을 나타낸다."},{"title":"강한 감정과 활동 증가","en":"If you feel emotionally intense, <b class=\"sl\">/</b> you’re going to <span class=\"an ul\" data-n=\"be going to + 동사원형\"><span class=\"an-word\">notice</span></span> an increase in sweat gland activity.","tr":"만약 여러분이 감정적으로 강렬하게 느낀다면 여러분은 땀샘 활동의 증가를 알아차릴 것이다.","sv":[["M","If you feel emotionally intense","수식어"],["S","you","주어"],["V","are going to notice","동사"],["O","an increase in sweat gland activity","목적어"]],"chunks":[["If you feel emotionally intense,","만약 여러분이 감정적으로 강렬하게 느낀다면,",[]],["you’re going to notice an increase in sweat gland activity.","여러분은 땀샘 활동의 증가를 알아차릴 것이다.",[["be going to + 동사원형","g6-5"]]]],"mnote":"be going to + 동사원형: 미래를 나타내는 be going to 뒤에는 동사원형 notice가 온다."},{"title":"주관적 상태에 객관적 값 부여","en":"This is particularly useful from a scientific viewpoint, <b class=\"sl\">/</b> because it allows us <span class=\"an ul\" data-n=\"allow + 목적어 + to부정사\"><span class=\"an-word\">to put</span></span> an objective value on a subjective state of mind.","tr":"이는 특히 과학적 관점에서 유용한데, 그것이 우리가 주관적인 마음 상태에 객관적인 값을 부여할 수 있게 해 주기 때문이다.","sv":[["S","This / it","주어"],["V","is / allows","동사"],["C","particularly useful","보어"],["O","us","목적어"],["X","to put an objective value on a subjective state of mind (목적격 보어)","절·구조"]],"chunks":[["This is particularly useful from a scientific viewpoint,","이는 특히 과학적 관점에서 유용한데,",[]],["because it allows us to put an objective value on a subjective state of mind.","그것이 우리가 객관적인 값을 주관적인 마음 상태에 부여할 수 있게 해 주기 때문이다.",[["allow + 목적어 + to부정사","g6-6"]]]],"mnote":"allow + 목적어 + to부정사: allows us to put에서 us는 목적어, to put은 목적격 보어이다. allow는 목적어 뒤에 to부정사를 요구한다."},{"title":"약한 전류로 감정 측정하기","en":"We can actually measure your emotional state <b class=\"sl\">/</b> by <span class=\"an ul\" data-n=\"수단의 by + 동명사\"><span class=\"an-word\">tracking</span></span> how your body subconsciously sweats, <b class=\"sl\">/</b> by running a bit of electricity through your skin.","tr":"우리는 실제로 여러분의 신체가 의식하지 못한 채 어떻게 땀을 흘리는지를 추적하고, 피부를 통해 약간의 전류를 흐르게 함으로써 여러분의 감정적 상태를 측정할 수 있다.","sv":[["S","We","주어"],["V","can measure","동사"],["O","your emotional state","목적어"],["M","by tracking ... / by running ...","수식어"]],"chunks":[["We can actually measure your emotional state","우리는 실제로 여러분의 감정적 상태를 측정할 수 있다",[]],["by tracking how your body subconsciously sweats,","여러분의 신체가 의식하지 못한 채 어떻게 땀을 흘리는지를 추적함으로써,",[["수단의 by + 동명사","g6-7"]]],["by running a bit of electricity through your skin.","그리고 피부를 통해 약간의 전류를 흐르게 함으로써.",[]]],"mnote":"수단의 by + 동명사: 전치사 by 뒤에는 동명사 tracking과 running이 온다. how your body ...는 tracking의 목적어인 간접의문문이다."},{"title":"감정의 강도를 숫자로 바꾸기","en":"We can then turn the subjective, subconscious experience of emotional intensity <b class=\"sl\">/</b> into an objective number <b class=\"sl\">/</b> by figuring out how good your skin gets at <span class=\"an ul\" data-n=\"전치사 at 뒤 동명사\"><span class=\"an-word\">transferring</span></span> an electrical current.","tr":"그다음에 여러분의 피부가 전류를 얼마나 잘 전달하는지 계산함으로써 우리는 감정적 강도의 주관적이고 잠재의식적인 경험을 객관적인 숫자로 바꿀 수 있다.","sv":[["S","We","주어"],["V","can turn","동사"],["O","the subjective, subconscious experience of emotional intensity","목적어"],["M","into an objective number / by figuring out ...","수식어"]],"chunks":[["We can then turn the subjective, subconscious experience of emotional intensity","그다음에 우리는 감정적 강도의 주관적이고 잠재의식적인 경험을 바꿀 수 있다",[]],["into an objective number","객관적인 숫자로",[]],["by figuring out how good your skin gets at transferring an electrical current.","여러분의 피부가 전류를 얼마나 잘 전달하는지 계산함으로써.",[["전치사 at 뒤 동명사","g6-8"]]]],"mnote":"전치사 at 뒤 동명사: good at transferring에서 at은 전치사이므로 뒤에는 동명사 transferring이 온다. turn A into B는 A를 B로 바꾸다이다."}],"grammar":[{"group":"문장 1","items":[{"id":"g6-1","title":"동사를 수식하는 부사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>Our skin conducts electricity more or less <mark>efficiently</mark>, depending on our emotions.</div><div class=\"def-box\">전도하는 방식의 효율을 나타내며 conducts를 수식하므로 부사 efficiently를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[efficiently / efficient]</span></div>"}]},{"group":"문장 2","items":[{"id":"g6-2","title":"감정 자극을 받는 수동 의미","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>We know that when we’re emotionally <mark>stimulated</mark> — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice.</div><div class=\"def-box\">우리가 감정적으로 자극받은 상태이므로 are stimulated를 쓴다. so little 뒤에는 결과절의 that이 생략되어 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[stimulated / stimulating]</span></div>"}]},{"group":"문장 3","items":[{"id":"g6-3","title":"get + 형용사 보어","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>And when those tiny drops of sweat appear, our skin gets more electrically <mark>conductive</mark>.</div><div class=\"def-box\">gets는 상태 변화를 나타내며 피부의 상태를 설명하는 형용사 conductive가 보어로 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[conductive / conductively]</span></div>"}]},{"group":"문장 4","items":[{"id":"g6-4","title":"without + 명사 + 분사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>This change in sweat gland activity happens completely without your conscious mind <mark>having</mark> much say in the matter.</div><div class=\"def-box\">without 뒤에서 your conscious mind가 having의 의미상 주어이다. ‘의식이 별로 관여하지 않은 채’라는 부대 상황을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[having / have]</span></div>"}]},{"group":"문장 5","items":[{"id":"g6-5","title":"be going to + 동사원형","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>If you feel emotionally intense, you’re going to <mark>notice</mark> an increase in sweat gland activity.</div><div class=\"def-box\">미래를 나타내는 be going to 뒤에는 동사원형 notice가 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[notice / noticing]</span></div>"}]},{"group":"문장 6","items":[{"id":"g6-6","title":"allow + 목적어 + to부정사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>This is particularly useful from a scientific viewpoint, because it allows us <mark>to put</mark> an objective value on a subjective state of mind.</div><div class=\"def-box\">allows us to put에서 us는 목적어, to put은 목적격 보어이다. allow는 목적어 뒤에 to부정사를 요구한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to put / put]</span></div>"}]},{"group":"문장 7","items":[{"id":"g6-7","title":"수단의 by + 동명사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>We can actually measure your emotional state by <mark>tracking</mark> how your body subconsciously sweats, by running a bit of electricity through your skin.</div><div class=\"def-box\">전치사 by 뒤에는 동명사 tracking과 running이 온다. how your body ...는 tracking의 목적어인 간접의문문이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[tracking / track]</span></div>"}]},{"group":"문장 8","items":[{"id":"g6-8","title":"전치사 at 뒤 동명사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at <mark>transferring</mark> an electrical current.</div><div class=\"def-box\">good at transferring에서 at은 전치사이므로 뒤에는 동명사 transferring이 온다. turn A into B는 A를 B로 바꾸다이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[transferring / transfer]</span></div>"}]}],"flow":{"tabLabel":"흐름·빈칸 근거","sections":[{"id":"a-flow","icon":"","title":"글의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1 관찰</b>감정에 따라 피부의 전기 전도도가 달라진다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2 기제</b>강한 감정은 무의식적인 발한을 늘리고 전도도를 높인다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3 측정</b>피부에 약한 전류를 흘려 전도도를 측정한다.</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4 의의</b>주관적인 감정 상태에 객관적 수치를 부여한다.</div></div>"},{"id":"a-summary","icon":"","title":"주제·요약","html":"<div class=\"purple-box\"><b>땀으로 감정을 재는 법</b><p>감정에 따른 무의식적인 땀과 피부 전도도 변화를 측정하면 주관적인 감정의 강도를 객관적인 수치로 나타낼 수 있다.</p></div>"},{"id":"a-blank","icon":"","title":"핵심 표현 빈칸 연습","html":"<p class=\"lead\">원문 핵심 표현을 빈칸으로 바꾼 학습용 문제입니다.</p><div class=\"rule-card rose\"><div class=\"src-line\">This is particularly useful from a scientific viewpoint, because it allows us to <span style=\"display:inline-block;min-width:180px;border-bottom:2px solid var(--rose)\">&nbsp;</span>.</div><button class=\"act-btn\" onclick=\"this.nextElementSibling.hidden=false;this.hidden=true\">정답·근거 확인</button><div hidden><div class=\"green-box\"><b class=\"en\">put an objective value on a subjective state of mind</b></div><p>무의식적인 땀과 전기 전도도는 주관적으로만 느끼던 감정을 외부에서 측정 가능한 값으로 바꿔 주는 연결 고리이다.</p></div></div>"},{"id":"a-evidence","icon":"","title":"문장별 내용 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할·핵심</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>감정에 따라 변하는 전기 전도</td><td>우리의 피부는 우리의 감정에 따라 전기를 더 효율적으로 또는 덜 효율적으로 전도한다.</td></tr><tr><td>2</td><td>알아차리기 힘든 미량의 땀</td><td>우리는 감정적으로 자극되었을 때, 즉 정말로 스트레스를 받거나 슬프거나 어떤 강렬한 감정을 느낄 때, 우리 몸이 너무 적어서 알아차리지도 못할 정도로 땀을 아주 약간 흘린다는 것을 안다.</td></tr><tr><td>3</td><td>땀이 나면 전도도가 높아짐</td><td>그리고 이 작은 땀방울이 나타날 때 우리의 피부는 전기적으로 더 전도력이 있는 상태가 된다.</td></tr><tr><td>4</td><td>의식과 무관한 땀샘 활동</td><td>이러한 땀샘 활동의 변화는 여러분의 의식이 그 상황에 그다지 관여하지 않은 채 일어난다.</td></tr><tr><td>5</td><td>강한 감정과 활동 증가</td><td>만약 여러분이 감정적으로 강렬하게 느낀다면 여러분은 땀샘 활동의 증가를 알아차릴 것이다.</td></tr><tr><td>6</td><td>주관적 상태에 객관적 값 부여</td><td>이는 특히 과학적 관점에서 유용한데, 그것이 우리가 주관적인 마음 상태에 객관적인 값을 부여할 수 있게 해 주기 때문이다.</td></tr><tr><td>7</td><td>약한 전류로 감정 측정하기</td><td>우리는 실제로 여러분의 신체가 의식하지 못한 채 어떻게 땀을 흘리는지를 추적하고, 피부를 통해 약간의 전류를 흐르게 함으로써 여러분의 감정적 상태를 측정할 수 있다.</td></tr><tr><td>8</td><td>감정의 강도를 숫자로 바꾸기</td><td>그다음에 여러분의 피부가 전류를 얼마나 잘 전달하는지 계산함으로써 우리는 감정적 강도의 주관적이고 잠재의식적인 경험을 객관적인 숫자로 바꿀 수 있다.</td></tr></tbody></table></div>"}]}},{"id":"11-07","lesson":11,"type":"빈칸 추론","title":"식물은 냄새와 소리로 말한다","source":"2025년 3월 34번","page":54,"summary":"식물의 냄새와 고주파 소리는 고통을 의식적으로 호소하는 울음이라기보다 해로운 것에 대응하는 자동적인 생존 수단이다.","footnote":"* scent 냄새 &nbsp; ** mow (잔디를) 깎다 &nbsp; *** knee-jerk 자동적인","sents":[{"title":"우리와 다른 방식의 소통","en":"Plants can communicate, <b class=\"sl\">/</b> although not in the same way we <span class=\"an ul\" data-n=\"대동사 do\"><span class=\"an-word\">do</span></span>.","tr":"우리가 하는 방식과 같지는 않을지라도 식물은 의사소통을 할 수 있다.","sv":[["S","Plants","주어"],["V","can communicate","동사"],["M","although not in the same way we do","수식어"]],"chunks":[["Plants can communicate,","식물은 의사소통을 할 수 있다,",[]],["although not in the same way we do.","우리가 하는 방식과 같지는 않을지라도.",[["대동사 do","g7-1"]]]],"mnote":"대동사 do: we do에서 do는 앞의 communicate를 대신한다. communicate는 일반동사이므로 be동사 are로 대신하지 않는다."},{"title":"냄새로 표현되는 불만","en":"Some <span class=\"an ul\" data-n=\"복수 대상을 받는 Some\"><span class=\"an-word\">express</span></span> their discontent <b class=\"sl\">/</b> through scents.","tr":"몇몇은 냄새를 통해 자신들의 불만을 표현한다.","sv":[["S","Some","주어"],["V","express","동사"],["O","their discontent","목적어"],["M","through scents","수식어"]],"chunks":[["Some express their discontent","몇몇은 자신들의 불만을 표현한다",[["복수 대상을 받는 Some","g7-2"]]],["through scents.","냄새를 통해.",[]]],"mnote":"복수 대상을 받는 Some: Some은 some plants를 뜻하는 복수 주어이므로 동사원형 형태 express를 쓴다."},{"title":"깎은 잔디의 냄새","en":"You know that smell <b class=\"sl\">/</b> that <span class=\"an ul\" data-n=\"관계절 동사의 수 일치\"><span class=\"an-word\">hangs</span></span> in the air after you’ve mowed the lawn nes <b class=\"sl\">/</b> to see <span class=\"an ul\" data-n=\"여부를 나타내는 간접의문문\"><span class=\"an-word\">if</span></span> they could record any trouble calls.","tr":"연구자는 식물이 곤경에 처했음을 알리는 소리를 녹음할 수 있는지 알아보기 위해 식물과 마이크를 사용해 실험했다.","sv":[["S","Researchers","주어"],["V","experimented","동사"],["M","with plants and microphones / to see if they could record any trouble calls","수식어"]],"chunks":[["Researchers experimented with plants and microphones","연구자는 식물과 마이크를 사용해 실험했다",[]],["to see if they could record any trouble calls.","식물이 곤경에 처했음을 알리는 소리를 녹음할 수 있는지 알아보기 위해.",[["여부를 나타내는 간접의문문","g7-7"]]]],"mnote":"여부를 나타내는 간접의문문: see if ...는 ‘~인지 알아보다’라는 뜻이다. 녹음 가능 여부를 확인하는 것이므로 여부를 나타내는 if가 필요하다."},{"title":"스트레스별로 달라지는 소리","en":"They found that plants produce a high-frequency clicking noise when <span class=\"an ul\" data-n=\"부사절의 주어·be 생략\"><span class=\"an-word\">stressed</span></span> <b class=\"sl\">/</b> and can make different sounds for different stressors.","tr":"그들은 식물이 스트레스를 받을 때 고주파수의 딸깍거리는 소리를 내며 스트레스 요인에 따라 다른 소리를 낼 수 있다는 사실을 알아냈다.","sv":[["S","They","주어"],["V","found","동사"],["O","that plants produce ... and can make ...","목적어"],["X","when stressed = when they are stressed","절·구조"]],"chunks":[["They found that plants produce a high-frequency clicking noise when stressed","그들은 식물이 스트레스를 받을 때 고주파수의 딸깍거리는 소리를 내며,",[["부사절의 주어·be 생략","g7-8"]]],["and can make different sounds for different stressors.","스트레스 요인에 따라 다른 소리를 낼 수 있다는 사실을 알아냈다.",[]]],"mnote":"부사절의 주어·be 생략: when stressed는 when they are stressed에서 주어와 be동사를 생략한 형태이다. 식물은 스트레스를 받는 대상이다."},{"title":"물 부족과 잎 절단의 대비","en":"The sound a plant makes when it’s not getting watered <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"긴 주어의 핵심 명사\"><span class=\"an-word\">differs</span></span> from the one it’ll make when a leaf is cut.","tr":"식물이 물을 공급받지 못하고 있을 때 내는 소리와 잎이 잘릴 때 낼 소리가 다르다.","sv":[["S","The sound (that) a plant makes when it’s not getting watered","주어"],["V","differs","동사"],["M","from the one (that) it’ll make
