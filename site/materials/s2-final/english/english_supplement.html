":"이를 위해 비선형적 방식으로 작업하는 법을 배우면 가장 효과적일 것이다. 즉 창의적인 뇌를 사용하라.","sv":[["S","you","주어"],["V","will be","동사"],["C","most effective","보어"],["M","if you learn to operate in a nonlinear manner","수식어"],["X","use your creative brain (명령문)","절·구조"]],"chunks":[["For this you will be most effective if you learn to operate in a nonlinear manner;","이를 위해 비선형적 방식으로 작업하는 법을 배우면 가장 효과적일 것이다.",[["명사를 수식하는 형용사","g19-6"]]],["that is, use your creative brain.","즉 창의적인 뇌를 사용하라.",[]]],"mnote":"명사를 수식하는 형용사: manner를 수식하므로 nonlinear이다. 필기: that is는 즉, your creative brain은 비선형적 사고의 비유이다.","isSummary":false},{"title":"문장 7 · keep + 동명사","en":"<span class=\"an\" data-n=\"다시 말해\"><span class=\"an-word\">Stated differently</span></span>, if you think in a linear manner, <b class=\"sl\">/</b> you’ll tend to be <span class=\"an\" data-n=\"보수적인\"><span class=\"an-word\">conservative</span></span> and keep <span class=\"an ul\" data-n=\"keep + 동명사\"><span class=\"an-word\">coming</span></span> up with techniques which are already known.","tr":"다시 말해 선형적 방식으로 생각하면 보수적이 되어 이미 알려진 기술만 계속 떠올리는 경향이 있을 것이다.","sv":[["M","Stated differently / if ...","수식어"],["S","you","주어"],["V","will tend / keep","동사"],["X","to be conservative / coming up with techniques ...","절·구조"]],"chunks":[["Stated differently, if you think in a linear manner,","다시 말해 선형적 방식으로 생각하면",[]],["you’ll tend to be conservative and keep coming up with techniques which are already known.","보수적이 되어 이미 알려진 기술만 계속 떠올리는 경향이 있을 것이다.",[["keep + 동명사","g19-7"]]]],"mnote":"keep + 동명사: 필기: keep coming up with는 계속 떠올리다이며 conservative는 보수적인이다.","isSummary":false},{"title":"문장 8 · 보어인 what 명사절","en":"This, of course, is just <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"보어인 what 명사절\"><span class=\"an-word\">what</span></span> you don’t want.","tr":"물론 이것은 바로 여러분이 원하지 않는 것이다.","sv":[["S","This","주어"],["V","is","동사"],["C","what you don’t want","보어"]],"chunks":[["This, of course, is just","물론 이것은 바로",[]],["what you don’t want.","여러분이 원하지 않는 것이다.",[["보어인 what 명사절","g19-8"]]]],"mnote":"보어인 what 명사절: what은 want의 목적어를 겸하며 보어절 전체는 ‘원하지 않는 것’을 뜻한다.","isSummary":false},{"title":"요약문 · 본문 전체의 핵심","en":"Logical thinking works well with familiar problems but falls short in dealing with new ideas, <b class=\"sl\">/</b> for <span class=\"an ul\" data-n=\"전치사 + 관계대명사\"><span class=\"an-word\">which</span></span> creative thinking is needed to come up with innovative solutions.","tr":"논리적 사고는 익숙한 문제에 잘 작동하지만 새로운 아이디어를 다루는 데는 부족하며 이를 위해 혁신적 해결책을 떠올리는 창의적 사고가 필요하다.","sv":[["S","Logical thinking / creative thinking","주어"],["V","works / falls short / is needed","동사"],["M","with familiar problems / in dealing with new ideas","수식어"]],"chunks":[["Logical thinking works well with familiar problems but falls short in dealing with new ideas,","논리적 사고는 익숙한 문제에 잘 작동하지만 새로운 아이디어를 다루는 데는 부족하며",[]],["for which creative thinking is needed to come up with innovative solutions.","이를 위해 혁신적 해결책을 떠올리는 창의적 사고가 필요하다.",[["전치사 + 관계대명사","g19-9"]]]],"mnote":"전치사 + 관계대명사: 쉼표 뒤 for which는 앞의 새 아이디어를 다루는 상황에 연결되며 전치사 뒤 that은 쓸 수 없다.","isSummary":true}],"grammar":[{"group":"문장 1","items":[{"id":"g19-1","title":"동사를 수식하는 부사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 1</span>In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way <mark>logically</mark> through the problem.</div><div class=\"def-box\">필기: logically는 논리적으로, a brick wall of resistance는 저항의 벽을 뜻한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[logically / logical]</span></div>"}]},{"group":"문장 2","items":[{"id":"g19-2","title":"계속적 관계절의 단수 선행사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 2</span>Such logical thinking is a linear type of process, which <mark>uses</mark> our reasoning skills.</div><div class=\"def-box\">which는 단수 process를 받으므로 uses이다. Such는 앞의 논리적 사고를 가리킨다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[uses / use]</span></div>"}]},{"group":"문장 3","items":[{"id":"g19-3","title":"of의 목적어 what절","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>This works fine when we’re operating in the area of <mark>what</mark> we know or have experienced.</div><div class=\"def-box\">what은 know와 have experienced의 목적어를 겸하여 ‘알거나 경험한 것’을 뜻한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 4","items":[{"id":"g19-4","title":"need to V","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>However, when we need to <mark>deal</mark> with new information, ideas, and viewpoints, linear thinking will often come up short.</div><div class=\"def-box\">need 뒤에 to부정사 to deal이 온다. 필기: come up short는 fall short, be insufficient와 같다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[deal / dealing]</span></div>"}]},{"group":"문장 5","items":[{"id":"g19-5","title":"삽입어를 제외한 주어","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>On the other hand, creativity by definition <mark>involves</mark> the application of new information to old problems and the conception of new viewpoints and ideas.</div><div class=\"def-box\">by definition은 삽입 수식어이며 단수 creativity가 주어이므로 involves이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[involves / involve]</span></div>"}]},{"group":"문장 6","items":[{"id":"g19-6","title":"명사를 수식하는 형용사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>For this you will be most effective if you learn to operate in a <mark>nonlinear</mark> manner; that is, use your creative brain.</div><div class=\"def-box\">manner를 수식하므로 nonlinear이다. 필기: that is는 즉, your creative brain은 비선형적 사고의 비유이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[nonlinear / nonlinearly]</span></div>"}]},{"group":"문장 7","items":[{"id":"g19-7","title":"keep + 동명사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Stated differently, if you think in a linear manner, you’ll tend to be conservative and keep <mark>coming</mark> up with techniques which are already known.</div><div class=\"def-box\">필기: keep coming up with는 계속 떠올리다이며 conservative는 보수적인이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[coming / to come]</span></div>"}]},{"group":"문장 8","items":[{"id":"g19-8","title":"보어인 what 명사절","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>This, of course, is just <mark>what</mark> you don’t want.</div><div class=\"def-box\">what은 want의 목적어를 겸하며 보어절 전체는 ‘원하지 않는 것’을 뜻한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 9","items":[{"id":"g19-9","title":"전치사 + 관계대명사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>Logical thinking works well with familiar problems but falls short in dealing with new ideas, for <mark>which</mark> creative thinking is needed to come up with innovative solutions.</div><div class=\"def-box\">쉼표 뒤 for which는 앞의 새 아이디어를 다루는 상황에 연결되며 전치사 뒤 that은 쓸 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[which / that]</span></div>"}]}],"originalNumber":34,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>논리적 사고는 추론을 쓰는 선형 과정임</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>알고 있거나 경험한 문제에는 잘 작동함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>새 정보·관점에는 선형 사고가 부족할 수 있음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>새 해법에는 비선형적 창의 사고가 필요함</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">Logical thinking works well with familiar problems but falls short in dealing with new ideas, for which creative thinking is needed to come up with innovative solutions.</div><p>논리적 사고는 익숙한 문제에 잘 작동하지만 새로운 아이디어를 다루는 데는 부족하며 이를 위해 혁신적 해결책을 떠올리는 창의적 사고가 필요하다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">falls short</td><td>문장 3: 이것은 우리가 알거나 경험해 본 영역에서 작업할 때 잘 작동한다. / 문장 4: 그러나 새로운 정보와 아이디어와 관점을 다뤄야 할 때 선형적 사고는 종종 충분하지 않을 것이다. / 문장 7: 다시 말해 선형적 방식으로 생각하면 보수적이 되어 이미 알려진 기술만 계속 떠올리는 경향이 있을 것이다.</td></tr><tr><td class=\"en\">creative thinking</td><td>문장 5: 반면 창의성은 정의상 기존 문제에 새 정보를 적용하는 것과 새로운 관점과 아이디어를 구상하는 것을 포함한다. / 문장 6: 이를 위해 비선형적 방식으로 작업하는 법을 배우면 가장 효과적일 것이다. 즉 창의적인 뇌를 사용하라.</td></tr></tbody></table></div><div class=\"note\">익숙한 문제와 새 아이디어의 대조를 통해 창의적 사고의 필요성을 드러낸다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-34","lesson":15,"type":"요약","title":"우리는 왜 일단 믿고 볼까","source":"2025년 6월 40번","page":82,"summary":"인간은 정신적 노력을 아끼는 경향 때문에 받은 정보를 의심하기보다 우선 진실로 받아들이는 편향이 있다.","footnote":"","sents":[{"title":"문장 1 · 동격 or와 단수명사","en":"There <span class=\"an ul\" data-n=\"동격 or와 단수명사\"><span class=\"an-word\">is</span></span> a natural assumption of truth, or a truth bias <b class=\"sl\">/</b> when humans communicate with one another.","tr":"인간이 서로 소통할 때 진실에 대한 자연스러운 가정, 곧 진실 편향이 있다.","sv":[["X","There is a natural assumption of truth, or a truth bias","절·구조"],["M","when humans communicate ...","수식어"]],"chunks":[["There is a natural assumption of truth, or a truth bias","진실에 대한 자연스러운 가정, 곧 진실 편향이 있다",[["동격 or와 단수명사","g20-1"]]],["when humans communicate with one another.","인간이 서로 소통할 때.",[]]],"mnote":"동격 or와 단수명사: or a truth bias는 assumption을 다시 부르는 동격 표현이므로 단수 동사 is이다.","isSummary":false},{"title":"문장 2 · 내용을 설명하는 that 보어절","en":"In other words, when we’re listening to others or reading their words, <b class=\"sl\">/</b> our automatic assumption is <span class=\"an ul\" data-n=\"내용을 설명하는 that 보어절\"><span class=\"an-word\">that</span></span> the other person is telling the truth.","tr":"다시 말해 다른 사람의 말을 듣거나 글을 읽을 때 자동적인 가정은 상대가 진실을 말하고 있다는 것이다.","sv":[["M","when we’re listening ... or reading ...","수식어"],["S","our automatic assumption","주어"],["V","is","동사"],["C","that the other person is telling the truth","보어"]],"chunks":[["In other words, when we’re listening to others or reading their words,","다시 말해 다른 사람의 말을 듣거나 글을 읽을 때",[]],["our automatic assumption is that the other person is telling the truth.","자동적인 가정은 상대가 진실을 말하고 있다는 것이다.",[["내용을 설명하는 that 보어절","g20-2"]]]],"mnote":"내용을 설명하는 that 보어절: 보어절 내부는 주어와 목적어를 갖춘 완전한 문장이므로 that이 연결한다.","isSummary":false},{"title":"문장 3 · 단수 대명사 주어","en":"This usually <span class=\"an ul\" data-n=\"단수 대명사 주어\"><span class=\"an-word\">works</span></span> out fine.","tr":"이것은 보통 잘 작동한다.","sv":[["S","This","주어"],["V","works out","동사"],["M","usually / fine","수식어"]],"chunks":[["This usually works out fine.","이것은 보통 잘 작동한다.",[["단수 대명사 주어","g20-3"]]]],"mnote":"단수 대명사 주어: This는 진실 편향을 받는 단수 주어이므로 works이다.","isSummary":false},{"title":"문장 4 · 간접의문문 평서문 어순","en":"If you ask someone <span class=\"an ul\" data-n=\"간접의문문 평서문 어순\"><span class=\"an-word\">where the restroom is</span></span> located or if it’s raining outside, <b class=\"sl\">/</b> you can safely assume that most people will not lie in their responses.","tr":"누군가에게 화장실이 어디 있는지나 밖에 비가 오는지를 물으면 대부분의 사람이 거짓으로 대답하지 않을 것이라 가정할 수 있다.","sv":[["M","If you ask someone where ... or if ...","수식어"],["S","you","주어"],["V","can assume","동사"],["O },{"title":"문장 7 · seem의 형용사 보어","en":"For the most part, humans are “<span class=\"an ci st\" data-n=\"인지적 구두쇠\"><span class=\"an-word\">cognitive misers</span></span>,” <b class=\"sl\">/</b> which means we typically don’t expend more mental effort than seems <span class=\"an ul\" data-n=\"seem의 형용사 보어\"><span class=\"an-word\">necessary</span></span> in a given situation.","tr":"대부분의 경우 인간은 인지적 구두쇠이며 이는 주어진 상황에서 필요해 보이는 것보다 더 많은 정신적 노력을 보통 들이지 않는다는 뜻이다.","sv":[["S","humans","주어"],["V","are","동사"],["C","cognitive misers","보어"],["X","which means ...","절·구조"]],"chunks":[["For the most part, humans are “cognitive misers,”","대부분의 경우 인간은 인지적 구두쇠이며",[]],["which means we typically don’t expend more mental effort than seems necessary in a given situation.","이는 주어진 상황에서 필요해 보이는 것보다 더 많은 정신적 노력을 보통 들이지 않는다는 뜻이다.",[["seem의 형용사 보어","g20-7"]]]],"mnote":"seem의 형용사 보어: 필기: cognitive misers는 인지적 구두쇠를 뜻한다. seems necessary에서 필요한 상태를 형용사가 나타낸다.","isSummary":false},{"title":"문장 8 · 보어인 to부정사","en":"It makes sense, then, that when we see something online, even if it is fake, <b class=\"sl\">/</b> <span class=\"ul st\">our default is</span> <span class=\"an ul\" data-n=\"보어인 to부정사\"><span class=\"an-word\">to believe</span></span> it, at least at first.","tr":"따라서 온라인에서 무언가를 볼 때 그것이 가짜여도 적어도 처음에는 믿는 것이 기본값이라는 것은 이치에 맞다.","sv":[["S","It (가주어)","주어"],["V","makes sense","동사"],["X","that ... our default is to believe it (진주어)","절·구조"]],"chunks":[["It makes sense, then, that when we see something online, even if it is fake,","따라서 온라인에서 무언가를 볼 때 그것이 가짜여도",[]],["our default is to believe it, at least at first.","적어도 처음에는 믿는 것이 기본값이라는 것은 이치에 맞다.",[["보어인 to부정사","g20-8"]]]],"mnote":"보어인 to부정사: 필기: our default is to believe it이 핵심이다. even if는 가정적 양보를 나타낸다.","isSummary":false},{"title":"요약문 · 본문 전체의 핵심","en":"We humans are unlikely <span class=\"an ul\" data-n=\"be unlikely to V\"><span class=\"an-word\">to doubt</span></span> the truth of information we receive, <b class=\"sl\">/</b> due to our te an class=\"src-tag\">문장 8</span>It makes sense, then, that when we see something online, even if it is fake, our default is <mark>to believe</mark> it, at least at first.</div><div class=\"def-box\">필기: our default is to believe it이 핵심이다. even if는 가정적 양보를 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to believe / believing it to]</span></div>"}]},{"group":"문장 9","items":[{"id":"g20-9","title":"be unlikely to V","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>We humans are unlikely <mark>to doubt</mark> the truth of information we receive, due to our tendency to save mental effort.</div><div class=\"def-box\">가능성이 낮음을 나타내는 unlikely 뒤에는 to부정사가 온다. 요약은 진실 편향과 노력 절약의 원인을 연결한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to doubt / doubting]</span></div>"}]}],"originalNumber":35,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>소통할 때 상대의 말을 진실로 가정하는 진실 편향이 있음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>보통은 유용하지만 모두 의심하면 소통이 어려워짐</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>의심하고 믿지 않기로 선택하려면 추가 정신 단계가 필요함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>인지적 구두쇠인 인간은 온라인 가짜 정보도 일단 믿기 쉬움</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">We humans are unlikely to doubt the truth of information we receive, due to our tendency to save mental effort.</div><p>우리 인간은 정신적 노력을 아끼는 경향 때문에 받는 정보의 진실성을 의심하지 않으려 한다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">unlikely to doubt</td><td>문장 1: 인간이 서로 소통할 때 진실에 대한 자연스러운 가정, 곧 진실 편향이 있다. / 문장 2: 다시 말해 다른 사람의 말을 듣거나 글을 읽을 때 자동적인 가정은 상대가 진실을 말하고 있다는 것이다. / 문장 3: 이것은 보통 잘 작동한다. / 문장 4: 누군가에게 화장실이 어디 있는지나 밖에 비가 오는지를 물으면 대부분의 사람이 거짓으로 대답하지 않을 것이라 가정할 수 있다. / 문장 5: 그들이 말하는 모든 것이 거짓이라고 가정한다면 누군가와 대화하는 것이 얼마나 어려울지 상상해 보라.</td></tr><tr><td class=\"en\">mental effort</td><td>문장 6: 실제로 진술의 진실성을 의심하고 믿지 않기로 선택하는 것은 추가적인 정신 단계를 요구한다. / 문장 7: 대부분의 경우 인간은 인지적 구두쇠이며 이는 주어진 상황에서 필요해 보이는 것보다 더 많은 정신적 노력을 보통 들이지 않는다는 뜻이다. / 문장 8: 따라서 온라인에서 무언가를 볼 때 그것이 가짜여도 적어도 처음에는 믿는 것이 기본값이라는 것은 이치에 맞다.</td></tr></tbody></table></div><div class=\"note\">의심에는 추가 정신 단계가 들기 때문에 일단 믿는 편향이 나타난다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"15-35","lesson":15,"type":"요약","title":"카메라처럼 보지 못하는 눈","source":"2025년 9월 40번","page":83,"summary":"인간의 시각은 사물의 용도와 관계에 따른 선입견과 위계의 영향을 받아 있는 그대로 보기를 방해받지만 카메라는 기계적으로 기록한다.","footnote":"","sents":[{"title":"문장 1 · 수동태","en":"Vision is <span class=\"an ul\" data-n=\"수동태\"><span class=\"an-word\">influenced</span></span> <b class=\"sl\">/</b> by our <span class=\"ci st\">preconceptions</span> about reality.","tr":"시각은 현실에 대한 우리의 선입견에 의해 영향을 받는다.","sv":[["S","Vision","주어"],["V","is influenced","동사"],["M","by our preconceptions about reality","수식어"]],"chunks":[["Vision is influenced","시각은 영향을 받는다",[["수동태","g21-1"]]],["by our preconceptions about reality.","현실에 대한 우리의 선입견에 의해.",[]]],"mnote":"수동태: 필기에서 주제로 표시했다. 시각은 선입견의 영향을 받는 대상이다.","isSummary":false},{"title":"문장 2 · 복수 선행사 hierarchies","en":"In viewing a scene, we establish <span class=\"ul\">unconscious hierarchies</span> <b class=\"sl\">/</b> that <span class=\"an ul\" data-n=\"복수 선행사 hierarchies\"><span class=\"an-word\" rk> only shapes and colors.</div><div class=\"def-box\">like the human eye는 삽입 수식어이며 주어 camera가 단수이므로 sees이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[sees / see]</span></div>"}]},{"group":"문장 7","items":[{"id":"g21-7","title":"동사 documents를 수식하는 부사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>It documents the world <mark>impartially</mark> through a lens that is similar to the eye.</div><div class=\"def-box\">필기: document는 기록하다이고 impartially는 공정하게라는 뜻으로 강조되어 있다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[impartially / impartial]</span></div>"}]},{"group":"문장 8","items":[{"id":"g21-8","title":"not A but B 동사 병렬","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>When we look at them carefully, photographs are often surprising because they don’t interpret confusing details but simply <mark>serve</mark> them up to us with a mechanical indifference.</div><div class=\"def-box\">interpret와 serve가 대조된다. 필기: indifference는 apathy, detachment와 통하는 무관심이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[serve / serving]</span></div>"}]},{"group":"문장 9","items":[{"id":"g21-9","title":"명사를 수식하는 형용사","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>And because of their flatness, photographs often contain areas that appear as <mark>unrecognizable</mark> colors and shapes.</div><div class=\"def-box\">colors and shapes를 수식하므로 형용사 unrecognizable이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[unrecognizable / unrecognizably]</span></div>"}]},{"group":"문장 10","items":[{"id":"g21-10","title":"수동의 분사 수식","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>Our visual perception is shaped by an established hierarchy <mark>based</mark> on functional relationships, which interrupts our ability to see objects as they truly are, unlike the objective perspective of a camera.</div><div class=\"def-box\">위계는 기능적 관계에 근거한 대상이므로 based on이 수식한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[based / basing]</span></div>"}]}],"originalNumber":36,"flow":{"tabLabel":"흐름·요약 연결","sections":[{"id":"a-flow","icon":"","title":"본문의 흐름","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>시각은 현실에 대한 선입견과 순간적 우선순위의 영향을 받음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>망치는 사용하는 각도로 떠올리고 위에서 본 모습은 잘 떠올리지 않음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>기능적 관계가 시각적 기대를 만들어 카메라처럼 보기를 방해함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>카메라는 해석 없이 기록하므로 사진 속 모습이 낯설게 느껴짐</div></div>"},{"id":"a-summary","icon":"","title":"원문 요약문","html":"<p class=\"lead\">마지막 문장은 위 본문 전체를 요약한 문장입니다.</p><div class=\"green-box\"><div class=\"en\">Our visual perception is shaped by an established hierarchy based on functional relationships, which interrupts our ability to see objects as they truly are, unlike the objective perspective of a camera.</div><p>우리의 시각적 인식은 기능적 관계에 근거한 확립된 위계에 의해 형성되며 이는 카메라의 객관적 시각과 달리 사물을 있는 그대로 보는 능력을 방해한다.</p></div>"},{"id":"a-summary-links","icon":"","title":"요약 표현과 본문 근거","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>요약 표현</th><th>본문에서 확인할 근거</th></tr></thead><tbody><tr><td class=\"en\">functional relationships</td><td>문장 2: 한 장면을 보면서 우리는 사물과의 기능적 관계와 순간적 우선순위를 반영하는 무의식적인 위계를 확립한다. / 문장 3: 예를 들어 마음의 눈으로 망치를 시각화할 때 우리는 옆모습이나 사용 준비가 된 각도로 망치를 보는 경향이 있다. / 문장 4: 사람은 망치를 위에서 본 모습으로는 아마 시각화하지 않을 것이다 손잡이가 망치 머리에 가려지도록. / 문장 5: 우리가 사물과 맺는 기능적 관계는 카메라처럼 보는 능력을 방해하는 시각적 기대를 만든다.</td></tr><tr><td class=\"en\">objective perspective</td><td>문장 6: 카메라는 인간의 눈처럼 형태와 색깔만 본다. / 문장 7: 그것은 눈과 비슷한 렌즈를 통해 세상을 공평하게 기록한다. / 문장 8: 사진을 자세히 보면 종종 놀랍다 사진은 혼란스러운 세부를 해석하지 않고 기계적 무관심으로 그대로 제시하기 때문이다. / 문장 9: 사진의 평면성 때문에 사진에는 알아보기 어려운 색과 형태로 보이는 영역이 종종 포함된다.</td></tr></tbody></table></div><div class=\"note\">인간의 기능적 기대와 카메라의 비해석적 기록을 대비한다.</div>"},{"id":"a-summary-drill","icon":"","title":"요약문 빈칸 연습","html":"<p class=\"lead\">원문 요약문에서 두 핵심 표현을 빈칸으로 바꾼 연습입니다.</p><div class=\"drill\"><div class=\"drill-top\"><span>두 빈칸에 들어갈 표현을 고르세요.</span><span class=\"spacer\"></span><span class=\"score\" id=\"summary-score\"></span><button class=\"act-btn ghost\" onclick=\"resetSummary()\">다시 하기</button></div><div id=\"summary-box\"></div><div id=\"summary-feedback\"></div></div>"}]}},{"id":"16-36","lesson":16,"type":"장문의 이해","title":"심장을 지키는 최적의 취침 시간","source":"2022년 6월 41~42번","page":84,"summary":"밤 10~11시 취침과 낮은 심장 질환 위험의 관련성을 관찰하고 체내 시계와 아침빛으로 그 가능성을 설명한다. 연구는 확정적 인과관계를 제시하지 않는다.","footnote":"","sents":[{"title":"문장 1 · 긴 주어의 수 일치","en":"U.K. researchers say <b class=\"sl\">/</b> a bedtime of between 10 p.m. and 11 p.m. <span class=\"an ul\" data-n=\"긴 주어의 수 일치\"><span class=\"an-word\">is</span></span> best.","tr":"영국 연구원들은 말한다 밤 10시와 11시 사이의 취침 시간이 가장 좋다고.","sv":[["S","U.K. researchers","주어"],["V","say","동사"],["O","(that) a bedtime ... is best","목적어"]],"chunks":[["U.K. researchers say","영국 연구원들은 말한다",[]],["a bedtime of between 10 p.m. and 11 p.m. is best.","밤 10시와 11시 사이의 취침 시간이 가장 좋다고.",[["긴 주어의 수 일치","g1-1"]]]],"mnote":"긴 주어의 수 일치: 주어의 핵은 단수 a bedtime이다. of between ...은 시간대를 수식하며 say 뒤 목적어절의 that은 생략되었다.","isSummary":false},{"title":"문장 2 · 관계절 뒤 주절 동사","en":"They say people who go to sleep between these times <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"관계절 뒤 주절 동사\"><span class=\"an-word\">have</span></span> a lower risk of heart disease.","tr":"그들은 이 시간 사이에 잠드는 사람들이 심장 질환의 위험이 더 낮다고 말한다.","sv":[["S","They / people who go to sleep ...","주어"],["V","say / have","동사"],["O","a lower risk of heart disease","목적어"]],"chunks":[["They say people who go to sleep between these times","그들은 이 시간 사이에 잠드는 사람들이",[]],["have a lower risk of heart disease.","심장 질환의 위험이 더 낮다고 말한다.",[["관계절 뒤 주절 동사","g1-2"]]]],"mnote":"관계절 뒤 주절 동사: who go to sleep ...은 people을 수식한다. 목적어절 주어가 복수 people이므로 have이다.","isSummary":f ed on his research and the effects of bedtimes on the health of our heart.","자신의 연구와 취침 시간이 심장 건강에 미치는 영향에 관해 언급했다.",[]]],"mnote":"one of 복수명사: one of the authors는 여러 저자 중 한 명이다. 주어의 핵은 One이며 Dr. David Plans는 동격이다.","isSummary":false},{"title":"문장 9 · be likely to V","en":"He said the study could not give a certain cause for their results, <b class=\"sl\">/</b> but it suggests that early or late bedtimes may be more likely <span class=\"an ul ul st\" data-n=\"체내 시계를 방해하다\"><span class=\"an-word\">to disrupt</span></span> the body clock, with negative consequences for <span class=\"an\" data-n=\"심장 혈관의\"><span class=\"an-word\">cardiovascular</span></span> health.","tr":"그는 연구가 결과의 확실한 원인을 제시할 수는 없지만 이르거나 늦은 취침이 체내 시계를 방해할 가능성이 더 크고 심혈관 건강에 부정적 결과를 가져올 수 있음을 시사한다고 말했다.","sv":[["S","He / the study / it","주어"],["V","said / could not give / suggests","동사"],["O","a certain cause / that ...","목적어"],["M","with negative consequences ...","수식어"]],"chunks":[["He said the study could not give a certain cause for their results,","그는 연구가 결과의 확실한 원인을 제시할 수는 없지만",[]],["but it suggests that early or late bedtimes may be more likely to disrupt the body clock, with negative consequences for cardiovascular health.","이르거나 늦은 취침이 체내 시계를 방해할 가능성이 더 크고 심혈관 건강에 부정적 결과를 가져올 수 있음을 시사한다고 말했다.",[["be likely to V","g1-9"]]]],"mnote":"be likely to V: be likely to disrupt는 방해할 가능성이 있다는 뜻이다. 필기: disrupt the body clock은 핵심 표현이며 cardiovascular는 심장 혈관의 뜻이다. but 앞의 인과관계 한계도 함께 읽는다.","isSummary":false},{"title":"문장 10 · 전치사 of 뒤 동명사","en":"He said that it was important for our body to wake up to the morning light, <b class=\"sl\">/</b> and that the worst time to go to bed was after midnight because it may reduce the <span class=\"an ci\" data-n=\"가능성\"><span class=\"an-word\">likelihood</span></span> of <span class=\"an ul\" data-n=\"전치사 of 뒤 동명사\"><span class=\"an-word\">seeing</span></span> morning light which <span class=\"an ul st\" data-n=\"체내 시계를 재설정하는 아침빛\"><span class=\"an-word\">resets</span>< ss=\"def-box\">조사 결과를 서술하는 동사는 showed이다. showing은 별도 조동사 없이 정동사가 될 수 없다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[showed / showing]</span></div>"}]},{"group":"문장 7","items":[{"id":"g1-7","title":"비교급과 than","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>They went to bed earlier or later <mark>than</mark> the ideal 10 p.m. to 11 p.m. timeframe.</div><div class=\"def-box\">earlier와 later는 비교급이므로 비교 대상을 than으로 연결한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[than / as]</span></div>"}]},{"group":"문장 8","items":[{"id":"g1-8","title":"one of 복수명사","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>One of the <mark>authors</mark> of the study, Dr. David Plans, commented on his research and the effects of bedtimes on the health of our heart.</div><div class=\"def-box\">one of the authors는 여러 저자 중 한 명이다. 주어의 핵은 One이며 Dr. David Plans는 동격이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[authors / author]</span></div>"}]},{"group":"문장 9","items":[{"id":"g1-9","title":"be likely to V","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>He said the study could not give a certain cause for their results, but it suggests that early or late bedtimes may be more likely <mark>to disrupt</mark> the body clock, with negative consequences for cardiovascular health.</div><div class=\"def-box\">be likely to disrupt는 방해할 가능성이 있다는 뜻이다. 필기: disrupt the body clock은 핵심 표현이며 cardiovascular는 심장 혈관의 뜻이다. but 앞의 인과관계 한계도 함께 읽는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to disrupt / disrupting]</span></div>"}]},{"group":"문장 10","items":[{"id":"g1-10","title":"전치사 of 뒤 동명사","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>He said that it was important for our body to wake up to the morning light, and that the worst time to go to bed was after midnight because it may reduce the likelihood of <mark>seeing</mark> morning light which resets the body clock.</div><div class=\"def-box\">likelihood of seeing에서 of 뒤에는 동명사이다. 두 that절이 said의 목적어로 병렬 연결된다. which resets ...는 morning light를 수식하며 단수 resets를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[seeing / see]</span></div>"}]},{"group":"문장 11","items":[{"id":"g1-11","title":"체내 시계의 수동태","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>He added that we risk cardiovascular disease if our body clock <mark>is not reset</mark> properly.</div><div class=\"def-box\">체내 시계가 재설정되는 대상이므로 is not reset이다. if절은 위험이 발생하는 조건을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is not reset / does not reset]</span></div>"}]}],"originalNumber":37,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>10~11시 취침과 낮은 위험의 연관성을 제시함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>8만 명의 수면 자료를 수집하고 건강을 추적함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>이상 시간보다 이르거나 늦게 잔 집단에서 심장 문제가 나타남</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>인과 확정의 한계를 밝히며 체내 시계·아침빛으로 설명함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>심장을 지키는 최적의 취침 시간</b><p>밤 10~11시 취침과 낮은 심장 질환 위험의 관련성을 관찰하고 체내 시계와 아침빛으로 그 가능성을 설명한다. 연구는 확정적 인과관계를 제시하지 않는다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 9","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">He said the study could not give a certain cause for their results, but it suggests that early or late bedtimes may be more likely to disrupt the body clock, with negative consequences for cardiovascular health.</div><p>그는 연구가 결과의 확실한 원인을 제시할 수는 없지만 이르거나 늦은 취침이 체내 시계를 방해할 가능성이 더 크고 심혈관 건강에 부정적 결과를 가져올 수 있음을 시사한다고 말했다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>관찰된 연관성</td><td>그들은 이 시간 사이에 잠드는 사람들이 심장 질환의 위험이 더 낮다고 말한다.</td></tr><tr><td>4</td><td>수면 자료 수집 방법</td><td>자원자들은 7일 동안 특별한 시계를 착용해야 했다 연구원들이 그들의 수면 시간과 기상 시간 자료를 모을 수 있도록.</td></tr><tr><td>9</td><td>인과 확정의 한계와 해석</td><td>그는 연구가 결과의 확실한 원인을 제시할 수는 없지만 이르거나 늦은 취침이 체내 시계를 방해할 가능성이 더 크고 심혈관 건강에 부정적 결과를 가져올 수 있음을 시사한다고 말했다.</td></tr><tr><td>10</td><td>체내 시계·아침빛 설명</td><td>그는 우리 몸이 아침빛에 맞추어 일어나는 것이 중요하며 가장 나쁜 취침 시간은 자정 이후인데 체내 시계를 재설정하는 아침빛을 볼 가능성을 줄일 수 있기 때문이라고 말했다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-37","lesson":16,"type":"장문의 이해","title":"반복이 뇌를 다시 연결한다","source":"2021년 3월 41~42번","page":85,"summary":"새로운 기술이 처음에 어색하더라도 반복해야 해당 행동에 관여하는 뉴런의 연결이 강화되어 자연스럽게 사용할 수 있다.","footnote":"","sents":[{"title":"문장 1 · 전치사 at 뒤 동명사","en":"As kids, we worked hard at <span class=\"an ul\" data-n=\"전치사 at 뒤 동명사\"><span class=\"an-word\">learning</span></span> to ride a bike; <b class=\"sl\">/</b> when we fell off, we got back on again, until it became <span class=\"an ul\" data-n=\"제2의 천성 · 습관\"><span class=\"an-word\">second nature</span></span> to us.","tr":"어릴 때 우리는 자전거 타기를 배우려고 열심히 노력했다. 넘어지면 그것이 제2의 천성이 될 때까지 다시 올라탔다.","sv":[["S","we / it","주어"],["V","worked / fell / got / became","동사"],["M","As kids / at learning ... / when ... / until ...","수식어"]],"chunks":[["As kids, we worked hard at learning to ride a bike;","어릴 때 우리는 자전거 타기를 배우려고 열심히 노력했다.",[["전치사 at 뒤 동명사","g2-1"]]],["when we fell off, we got back on again, until it became second nature to us.","넘어지면 그것이 제2의 천성이 될 때까지 다시 올라탔다.",[]]],"mnote":"전치사 at 뒤 동명사: work hard at learning에서 at 뒤에는 동명사 learning이 온다. second nature는 반복하여 자연스러워진 습관이다.","isSummary":false},{"title":"문장 2 · before 뒤 동명사","en":"But when we try something new in our adult lives <b class=\"sl\">/</b> we’ll usually make just one attempt before <span class=\"an ul\" data-n=\"before 뒤 동명사\"><span class=\"an-word\">judging</span></span> whether it’s worked.","tr":"하지만 성인이 되어 새로운 것을 시도할 때 우리는 보통 효과가 있었는지 판단하기 전에 단 한 번만 시도한다.","sv":[["M","when we try something new ...","수식어"],["S","we","주어"],["V","will make","동사"],["O","just one attempt","목적어"],["M","before judging whether it’s worked","수식어"]],"chunks":[["But when we try something new in our adult lives","하지만 성인이 되어 새로운 것을 시도할 때",[]],["we’ll usually make just one attempt before judging whether it’s worked.","우리는 보통 효과가 있었는지 판단하기 전에 단 한 번만 시도한다.",[["before 뒤 동명사","g2-2"]]]],"mnote":"before 뒤 동명사: 필기: 전치사 before 뒤 judging이며 whether it’s worked는 판단의 내용인 여부 명사절이다. something new는 형용사가 대명사를 뒤에서 수식한다.","isSummary":false},{"title":"문장 3 · feel 뒤 형용사 보어","en":"If we don’t succeed the first time, or if it feels a little <span class=\"an ul\" data-n=\"feel 뒤 형용사 보어\"><span class=\"an-word\">awkward</span></span>, <b class=\"sl\">/</b> we’ll tell ourselves it wasn’t a success rather than giving it another shot.","tr":"처음에 성공하지 못하거나 조금 어색하게 느껴지면 우리는 다시 시도하기보다 성공이 아니었다고 스스로에게 말한다.","sv":[["M","If ... or if ...","수식어"],["S","we","주어"],["V","will tell","동사"],["O","ourselves / (that) it wasn’t a success","목적어"],["M","rather than giving it another shot","수식어"]],"chunks":[["If we don’t succeed the first time, or if it feels a little awkward,","처음에 성공하지 못하거나 조금 어색하게 느껴지면",[["feel 뒤 형용사 보어","g2-3"]]],["we’ll tell ourselves it wasn’t a success rather than giving it another shot.","우리는 다시 시도하기보다 성공이 아니었다고 스스로에게 말한다.",[]]],"mnote":"feel 뒤 형용사 보어: feels awkward에서 상태를 나타내는 형용사 awkward가 보어이다. 필기: tell ourselves + 내용절은 간접목적어와 직접목적어의 구조이다.","isSummary":false},{"title":"문장 4 · of 뒤 동명사","en":"That’s a shame, <b class=\"sl\">/</b> because <span class=\"an ul st\" data-n=\"뇌 재연결 과정의 핵심\"><span class=\"an-word\">repetition</span></span> is central to the process of <span class=\"an ul\" data-n=\"of 뒤 동명사\"><span class=\"an-word\">rewiring</span></span> our brains.","tr":"그것은 안타까운 일이다 반복은 뇌를 다시 연결하는 과정의 핵심이기 때문이다.","sv":[["S","That / repetition","주어"],["V","is / is","동사"],["C","a shame / central","보어"],["M","to the process of rewiring our brains","수식어"]],"chunks":[["That’s a shame,","그것은 안타까운 일이다",[]],["because repetition is central to the process of rewiring our brains.","반복은 뇌를 다시 연결하는 과정의 핵심이기 때문이다.",[["of 뒤 동명사","g2-4"]]]],"mnote":"of 뒤 동명사: of rewiring은 다시 연결하는 과정이라는 뜻이다. 필기에서 주제로 표시한 문장으로, 반복이 필요한 이유를 제시한다.","isSummary":false},{"title":"문장 5 · idea의 동격절","en":"Consider the idea <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"idea의 동격절\"><span class=\"an-word\">that</span></span> your brain has a network of neurons.","tr":"생각을 고려해 보라 뇌에는 뉴런의 연결망이 있다는.","sv":[["V","Consider","동사"],["O","the idea","목적어"],["X","that your brain has a network of neurons (동격절)","절·구조"]],"chunks":[["Consider the idea","생각을 고려해 보라",[]],["that your brain has a network of neurons.","뇌에는 뉴런의 연결망이 있다는.",[["idea의 동격절","g2-5"]]]],"mnote":"idea의 동격절: 필기: that절은 idea의 구체적 내용을 설명하며 완전한 문장이다. 선행사를 포함한 what으로 바꾸지 않는다.","isSummary":false},{"title":"문장 6 · remember to V","en":"They will connect with each other <b class=\"sl\">/</b> whenever you remember <span class=\"an ul\" data-n=\"remember to V\"><span class=\"an-word\">to use</span></span> a brain-friendly feedback technique.","tr":"그것들은 서로 연결될 것이다 뇌에 친화적인 피드백 기술을 사용하는 것을 기억할 때마다.","sv":[["S","They","주어"],["V","will connect","동사"],["M","with each other / whenever you remember to use ...","수식어"]],"chunks":[["They will connect with each other", v class=\"exam-line\">시험 형태: <span class=\"en\">[rewiring / rewire]</span></div>"}]},{"group":"문장 5","items":[{"id":"g2-5","title":"idea의 동격절","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>Consider the idea <mark>that</mark> your brain has a network of neurons.</div><div class=\"def-box\">필기: that절은 idea의 구체적 내용을 설명하며 완전한 문장이다. 선행사를 포함한 what으로 바꾸지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[that / what]</span></div>"}]},{"group":"문장 6","items":[{"id":"g2-6","title":"remember to V","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>They will connect with each other whenever you remember <mark>to use</mark> a brain-friendly feedback technique.</div><div class=\"def-box\">remember to use는 사용해야 할 것을 기억해 실행한다는 뜻이다. 필기: whenever는 완전한 절을 이끌어 매번이라는 조건을 덧붙인다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to use / using]</span></div>"}]},{"group":"문장 7","items":[{"id":"g2-7","title":"앞 절을 받는 계속적 관계절","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>Those connections aren’t very reliable at first, <mark>which</mark> may make your first efforts a little hit-and-miss.</div><div class=\"def-box\">which는 연결이 아직 안정적이지 않다는 앞 절의 상황을 받아 그 결과를 설명한다. make + O + C 구조이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[which / what]</span></div>"}]},{"group":"문장 8","items":[{"id":"g2-8","title":"과거분사의 후치 수식","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>You might remember one of the steps <mark>involved</mark>, and not the others.</div><div class=\"def-box\">involved는 관련된 단계라는 뜻으로 steps를 뒤에서 수식한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[involved / involving]</span></div>"}]},{"group":"문장 9","items":[{"id":"g2-9","title":"관계절 뒤 주절 수 일치","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>But scientists have a saying: “neurons that fire together, <mark>wire</mark> together.”</div><div class=\"def-box\">주어 neurons가 복수이므로 fire와 wire 모두 복수 동사이다. 필기: 비유적 문장은 함께 활동하는 뉴런의 연결이 강화된다는 함축적 의미이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[wire / wires]</span></div>"}]},{"group":"문장 10","items":[{"id":"g2-10","title":"주어 repetition의 수 일치","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>In other words, repetition of an action <mark>strengthens</mark> the connections between the neurons involved in that action.</div><div class=\"def-box\">필기에서 strengthens를 강조했다. 단수 주어 repetition이 동사의 수를 결정하며 of an action은 수식어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[strengthens / strengthen]</span></div>"}]},{"group":"문장 11","items":[{"id":"g2-11","title":"the 비교급 상관 구문","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>That means the more times you try using that new feedback technique, the <mark>more easily</mark> it will come to you when you need it.</div><div class=\"def-box\">필기: the more ... the more ...는 더 많이 할수록 더 그렇다는 뜻이다. come을 수식하므로 부사 easily의 비교급이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[more easily / more easy]</span></div>"}]}],"originalNumber":38,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>자전거는 반복해서 배우지만 성인은 한 번 시도하고 판단함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>실패했다고 그만두는 것은 뇌를 재연결하는 반복의 기회를 잃음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>초기 뉴런 연결은 불안정하지만 함께 활성화되면 강해짐</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>새 피드백 기술을 자주 시도할수록 필요할 때 쉽게 사용함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>반복이 뇌를 다시 연결한다</b><p>새로운 기술이 처음에 어색하더라도 반복해야 해당 행동에 관여하는 뉴런의 연결이 강화되어 자연스럽게 사용할 수 있다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 4","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">That’s a shame, because repetition is central to the process of rewiring our brains.</div><p>그것은 안타까운 일이다 반복은 뇌를 다시 연결하는 과정의 핵심이기 때문이다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>1</td><td>반복해서 배운 어린 시절</td><td>어릴 때 우리는 자전거 타기를 배우려고 열심히 노력했다. 넘어지면 그것이 제2의 천성이 될 때까지 다시 올라탔다.</td></tr><tr><td>3</td><td>성인의 성급한 실패 판단</td><td>처음에 성공하지 못하거나 조금 어색하게 느껴지면 우리는 다시 시도하기보다 성공이 아니었다고 스스로에게 말한다.</td></tr><tr><td>10</td><td>반복이 뉴런 연결을 강화함</td><td>다시 말해 어떤 행동의 반복은 그 행동에 관여하는 뉴런들 사이의 연결을 강화한다.</td></tr><tr><td>11</td><td>필요할 때 더 쉽게 기술을 사용함</td><td>이는 새로운 피드백 기술을 더 많이 사용해 볼수록 필요할 때 더 쉽게 떠오른다는 뜻이다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-38","lesson":16,"type":"장문의 이해","title":"눈과 뇌가 함께 만드는 시각","source":"2022년 11월 41~42번","page":86,"summary":"시각은 눈이 영상을 전달하는 것만으로 완성되지 않는다. 눈과 뇌가 협력하며 뇌도 시각 정보를 해석하는 법을 배워야 한다.","footnote":"","sents":[{"title":"문장 1 · 과거의 사건을 서술하는 동사","en":"Mike May <span class=\"an ul\" data-n=\"과거의 사건을 서술하는 동사\"><span class=\"an-word\">lost</span></span> his sight <b class=\"sl\">/</b> at the age of three.","tr":"Mike May는 시력을 잃었다 세 살 때.","sv":[["S","Mike May","주어"],["V","lost","동사"],["O","his sight","목적어"],["M","at the age of three","수식어"]],"chunks":[["Mike May lost his sight","Mike May는 시력을 잃었다",[["과거의 사건을 서술하는 동사","g3-1"]]],["at the age of three.","세 살 때.",[]]],"mnote":"과거의 사건을 서술하는 동사: 세 살 때 일어난 사건을 과거 동사 lost로 서술한다.","isSummary":false},{"title":"문장 2 · spend 시간 -ing","en":"Because he had spent the majority of his life <span class=\"an ul\" data-n=\"spend 시간 -ing\"><span class=\"an-word\">adapting</span></span> to being blind — and even <span class=\"an ci\" data-n=\"기르다 · 경력을 쌓다\"><span class=\"an-word\">cultivating</span></span> a skiing career in this state — <b class=\"sl\">/</b> his other senses <span class=\"an ci\" data-n=\"다른 감각으로 보완\"><span class=\"an-word\">compensated</span></span> by growing stronger.","tr":"그는 삶의 대부분을 실명 상태에 적응하고 심지어 그 상태에서 스키 경력을 쌓으며 보냈기 때문에 다른 감각들이 더 강해짐으로써 이를 보완했다.","sv":[["M","Because he had spent ... adapting ... and cultivating ...","수식어"],["S","his other senses","주어"],["V","compensated","동사"],["M","by growing stronger","수식어"]],"chunks":[["Because he had spent the majority of his life adapting to being blind — and even cultivating a skiing career in this state —","그는 삶의 대부분을 실명 상태에 적응하고 심지어 그 상태에서 스키 경력을 쌓으며 보냈기 때문에",[["spend 시간 -ing","g3-2"]]],["his other senses compensated by growing stronger.","다른 감각들이 더 강해짐으로써 이를 보완했다.",[]]],"mnote":"spend 시간 -ing: 필기: spent 시간 adapting이며 cultivating이 병렬 연결된다. adapt to의 to는 전치사라 being이 온다. cultivate는 기르다, 쌓다의 뜻이다.","isSummary":false},{"title":"문장 3 · 시력이 회복되는 수동태","en":"However, when his sight <span class=\"an ul\" data-n=\"시력이 회복되는 수동태\"><span class=\"an-word\">was restored</span></span> through a surgery in his forties, <b class=\"sl\">/</b> his entire perception of reality was disrupted.","tr":"그러나 40대에 수술을 통해 시력이 회복되었을 때 현실에 대한 그의 전체 인식은 혼란에 빠졌다.","sv":[["M","when his sight was restored ...","수식어"],["S","his entire perception of reality","주어"],["V","was disrupted","동사"]],"chunks":[["However, when his sight was restored through a surgery in his forties,","그러나 40대에 수술을 통해 시력이 회복되었을 때",[["시력이 회복되는 수동태","g3-3"]]],["his entire perception of reality was disrupted.","현실에 대한 그의 전체 인식은 혼란에 빠졌다.",[]]],"mnote":"시력이 회복되는 수동태: 시력은 회복되는 대상이므로 was restored이다. However는 회복에 대한 예상과 실제 혼란을 대비한다.","isSummary":false},{"title":"문장 4 · so 형용사 that 결과절","en":"Instead of being thrilled that he could see now, as he’d expected, <b class=\"sl\">/</b> his brain was <span class=\"an ul\" data-n=\"so 형용사 that 결과절\"><span class=\"an-word\">so overloaded</span></span> with new visual stimuli that the world became a frightening and overwhelming place.","tr":"예상했던 것처럼 이제 볼 수 있다는 사실에 기뻐하기는커녕 그의 뇌는 새로운 시각 자극에 너무 압도되어 세상이 무섭고 감당하기 힘든 곳이 되었다.","sv":[["M","Instead of being thrilled ... / as he’d expected","수식어"],["S","his brain","주어"],["V","was overloaded","동사"],["X","so ... that the world became ...","절·구조"]],"chunks":[["Instead of being thrilled that he could see now, as he’d expected,","예상했던 것처럼 이제 볼 수 있다는 사실에 기뻐하기는커녕",[]],["his brain was so overloaded with new visual stimuli that the world became a frightening and overwhelming place.","그의 뇌는 새로운 시각 자극에 너무 압도되어 세상이 무섭고 감당하기 힘든 곳이 되었다.",[["so 형용사 that 결과절","g3-4"]]]],"mnote":"so 형용사 that 결과절: 필기: so overloaded ... that ...은 너무 압도되어 결과적으로 그러해졌다는 구조이다. stimuli는 stimulus의 복수형이다.","isSummary":false},{"title":"문장 5 · leave + O + 목적격 보어","en":"After he’d learned to know his family through touch and smell, <b class=\"sl\">/</b> he found that he couldn’t recognize his children with his eyes, and this left him <span class=\"an ul\" data-n=\"leave + O + 목적격 보어\"><span class=\"an-word\">puzzled</span></span>.","tr":"촉각과 후각으로 가족을 알아보는 법을 배운 뒤에 그는 눈으로는 자녀를 알아볼 수 없다는 사실을 알았고, 이는 그를 당혹스럽게 했다.","sv":[["M","After he’d learned ...","수식어"],["S","he / this","주어"],["V","found / left","동사"],["O","that ... / him","목적어"],["C","puzzled","보어"]],"chunks":[["After he’d learned to know his family through touch and smell,","촉각과 후각으로 가족을 알아보는 법을 배운 뒤에",[]],["he found that he couldn’t recognize his children with his eyes, and this left him puzzled.","그는 눈으로는 자녀를 알아볼 수 없다는 사실을 알았고, 이는 그를 당혹스럽게 했다.",[["leave + O + 목적격 보어","g3-5"]]]],"mnote":"leave + O + 목적격 보어: 필기: this left him puzzled는 5형식이다. 그가 당혹감을 느끼는 수동적 상태이므로 puzzled를 쓴다.","isSummary":false},{"title":"문장 6 · become 뒤 형용사 비교급","en":"Skiing also became a lot <span class=\"an ul\" data-n=\"become 뒤 형용사 비교급\"><span class=\"an-word\">harder</span></span> <b class=\"sl\">/</b> as he struggled to adapt to the visual stimulation.","tr":"스키 타기도 훨씬 어려워졌다 시각 자극에 적응하려고 애쓰면서.","sv":[["S","Skiing","주어"],["V","became","동사"],["C","a lot harder","보어"],["M","as he struggled to adapt ...","수식어"]],"chunks":[["Skiing also became a lot harder","스키 타기도 훨씬 어려워졌다",[["become 뒤 형용사 비교급","g3-6"]]],["as he struggled to adapt to the visual stimulation.","시각 자극에 적응하려고 애쓰면서.",[]]],"mnote":"become 뒤 형용사 비교급: became 뒤에는 상태를 나타내는 harder가 보어로 온다. a lot은 비교급을 강조한다.","isSummary":false},{"title":"문장 7 · occur는 자동사","en":"This confusion <span class=\"an ul ci\" data-n=\"자동사 · 수동태 불가\"><span class=\"an-word\">occurred</span></span> <b class=\"sl\">/</b> because his brain hadn’t yet learned to see.","tr":"이 혼란은 발생했다 그의 뇌가 아직 보는 법을 배우지 못했기 때문이다.","sv":[["S","This confusion","주어"],["V","occurred","동사"],["M","because his brain hadn’t yet learned to see","수식어"]],"chunks":[["This confusion occurred","이 혼란은 발생했다",[["occur는 자동사","g3-7"]]],["because his brain hadn’t yet learned to see.","그의 뇌가 아직 보는 법을 배우지 못했기 때문이다.",[]]],"mnote":"occur는 자동사: 필기: occur는 발생하다라는 자동사이므로 수동태 was occurred로 쓰지 않는다.","isSummary":false},{"title":"문장 8 · 주어 advances와 수 일치","en":"Though we often tend to assume our eyes function as video cameras which relay information to our brain, <b class=\"sl\">/</b> advances in neuroscientific research <span class=\"an ul\" data-n=\"주어 advances와 수 일치\"><span class=\"an-word\">have</span></span> proven that this is actually not the case.","tr":"우리는 흔히 눈이 정보를 뇌에 전달하는 비디오카메라처럼 기능한다고 생각하지만 신경과학 연구의 발전은 실제로는 그렇지 않음을 입증했다.","sv":[["M","Though we often tend to assume ...","수식어"],["S","advances in neuroscientific research","주어"],["V","have proven","동사"],["O","that this is ac ,"items":[{"id":"g3-6","title":"become 뒤 형용사 비교급","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>Skiing also became a lot <mark>harder</mark> as he struggled to adapt to the visual stimulation.</div><div class=\"def-box\">became 뒤에는 상태를 나타내는 harder가 보어로 온다. a lot은 비교급을 강조한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[harder / hardly]</span></div>"}]},{"group":"문장 7","items":[{"id":"g3-7","title":"occur는 자동사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>This confusion <mark>occurred</mark> because his brain hadn’t yet learned to see.</div><div class=\"def-box\">필기: occur는 발생하다라는 자동사이므로 수동태 was occurred로 쓰지 않는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[occurred / was occurred]</span></div>"}]},{"group":"문장 8","items":[{"id":"g3-8","title":"주어 advances와 수 일치","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>Though we often tend to assume our eyes function as video cameras which relay information to our brain, advances in neuroscientific research <mark>have</mark> proven that this is actually not the case.</div><div class=\"def-box\">주어의 핵은 복수 advances이다. 필기: Though는 통념과 연구 결과의 양보·대조 관계를 나타내며 assume 뒤 내용절의 that이 생략되었다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[have / has]</span></div>"}]},{"group":"문장 9","items":[{"id":"g3-9","title":"주어의 핵 the way","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>Instead, sight is a collaborative effort between our eyes and our brains, and the way we process visual reality <mark>depends</mark> on the way these two communicate.</div><div class=\"def-box\">필기: collaborative가 핵심이다. 뒤 절의 주어는 단수 the way이며 we process visual reality는 이를 수식한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[depends / depend]</span></div>"}]},{"group":"문장 10","items":[{"id":"g3-10","title":"communication의 수 일치","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>If communication between our eyes and our brains <mark>is disturbed</mark>, our perception of reality is altered accordingly.</div><div class=\"def-box\">필기: between our eyes and our brains는 수식어이고 주어 communication이 단수이므로 is이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is disturbed / are disturbed]</span></div>"}]},{"group":"문장 11","items":[{"id":"g3-11","title":"긴 주어의 핵 process","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>And because other areas of May’s brain had adapted to process information primarily through his other senses, the process of learning how to see <mark>was</mark> more difficult than he’d anticipated.</div><div class=\"def-box\">단수 process가 주어의 핵이다. learning how to see는 보는 법을 배우는 것이라는 수식어이다. 필기: anticipated는 예상했다의 뜻이며 difficult가 사례의 결론이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[was / were]</span></div>"}]}],"originalNumber":39,"pageEnd":87,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>어릴 때 실명한 May는 다른 감각을 발달시킴</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>수술로 시력을 되찾았지만 새로운 시각 자극에 혼란을 느낌</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>눈이 카메라라는 통념과 달리 뇌도 보는 법을 배워야 함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>다른 감각에 적응한 뇌 때문에 시각 학습이 더 어려웠음</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>눈과 뇌가 함께 만드는 시각</b><p>시각은 눈이 영상을 전달하는 것만으로 완성되지 않는다. 눈과 뇌가 협력하며 뇌도 시각 정보를 해석하는 법을 배워야 한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 9","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">Instead, sight is a collaborative effort between our eyes and our brains, and the way we process visual reality depends on the way these two communicate.</div><p>대신 시각은 눈과 뇌 사이의 협력 작업이며 시각적 현실을 처리하는 방식은 이 둘이 소통하는 방식에 달려 있다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>실명에 대한 다른 감각의 적응</td><td>그는 삶의 대부분을 실명 상태에 적응하고 심지어 그 상태에서 스키 경력을 쌓으며 보냈기 때문에 다른 감각들이 더 강해짐으로써 이를 보완했다.</td></tr><tr><td>5</td><td>회복 후 가족도 알아보지 못함</td><td>촉각과 후각으로 가족을 알아보는 법을 배운 뒤에 그는 눈으로는 자녀를 알아볼 수 없다는 사실을 알았고, 이는 그를 당혹스럽게 했다.</td></tr><tr><td>7</td><td>뇌가 보는 법을 아직 배우지 못함</td><td>이 혼란은 발생했다 그의 뇌가 아직 보는 법을 배우지 못했기 때문이다.</td></tr><tr><td>11</td><td>이전 적응 때문에 시각 학습이 어려움</td><td>그리고 May의 뇌의 다른 영역은 주로 다른 감각으로 정보를 처리하도록 적응해 있었기 때문에 보는 법을 배우는 과정은 그가 예상했던 것보다 더 어려웠다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-39","lesson":16,"type":"장문의 이해","title":"농업이 바꾼 인간 사회","source":"2023년 6월 41~42번","page":88,"summary":"농업의 지속적인 잉여 생산은 비농민을 부양하고 인구 증가와 도시 집중, 직업 전문화를 이끌어 생활 수준과 사회 안정성을 높였다.","footnote":"","sents":[{"title":"문장 1 · 복수 주어의 형태","en":"Early hunter-gatherer <span class=\"an ul\" data-n=\"복수 주어의 형태\"><span class=\"an-word\">societies</span></span> <b class=\"sl\">/</b> had minimal structure.","tr":"초기 수렵 채집 사회는 최소한의 구조를 가지고 있었다.","sv":[["S","Early hunter-gatherer societies","주어"],["V","had","동사"],["O","minimal structure","목적어"]],"chunks":[["Early hunter-gatherer societies","초기 수렵 채집 사회는",[["복수 주어의 형태","g4-1"]]],["had minimal structure.","최소한의 구조를 가지고 있었다.",[]]],"mnote":"복수 주어의 형태: 여러 초기 수렵 채집 사회를 말하므로 복수 societies이다. 과거 동사는 had이다.","isSummary":false},{"title":"문장 2 · 문장의 과거 동사","en":"A chief or group of elders <b class=\"sl\">/</b> usually <span class=\"an ul\" data-n=\"문장의 과거 동사\"><span class=\"an-word\">led</span></span> the camp or village.","tr":"추장이나 장로 집단이 보통 야영지나 마을을 이끌었다.","sv":[["S","A chief or group of elders","주어"],["V","led","동사"],["O","the camp or village","목적어"],["M","usually","수식어"]],"chunks":[["A chief or group of elders","추장이나 장로 집단이",[]],["usually led the camp or village.","보통 야영지나 마을을 이끌었다.",[["문장의 과거 동사","g4-2"]]]],"mnote":"문장의 과거 동사: 주어 뒤에는 이끌었다는 정동사 led가 필요하다.","isSummary":false},{"title":"문장 3 · 주어 surpluses의 수 일치","en":"Most of these leaders had to hunt and gather along with the other members <b class=\"sl\">/</b> because the <span class=\"an\" data-n=\"잉여\"><span class=\"an-word\">surpluses</span></span> of food and other vital resources <span class=\"an ul\" data-n=\"주어 surpluses의 수 일치\"><span class=\"an-word\">were</span></span> seldom sufficient to support a full-time chief or village council.","tr":"이러한 지도자의 대부분은 다른 구성원들과 함께 사냥과 채집을 해야 했다 식량과 필수 자원의 잉여가 전업 추장이나 마을 의회를 부양할 만큼 충분한 경우가 드물었기 때문이다.","sv":[["S","Most of these leaders / the surpluses ...","주어"],["V","had to hunt and gather / were","동사"],["C","seldom sufficient","보어"],["M","to support ...","수식어"]],"chunks":[["Most of these leaders had to hunt and gather along with the other members","이러한 지도자의 대부분은 다른 구성원들과 함께 사냥과 채집을 해야 했다",[]],["because the surpluses of food and other vital resources were seldom sufficient to support a full-time chief or village council.","식량과 필수 자원의 잉여가 전업 추장이나 마을 의회를 부양할 만큼 충분한 경우가 드물었기 때문이다.",[["주어 surpluses의 수 일치","g4-3"]]]],"mnote":"주어 surpluses의 수 일치: 주어 핵이 복수 surpluses이므로 were이다. 필기: surplus는 잉여이고 sufficient to support는 부양하기에 충분하다는 뜻이다.","isSummary":false},{"title":"문장 4 · 주절의 동사","en":"The development of agriculture <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"주절의 동사\"><span class=\"a lity to recognize familiar sequences and patterns.</div><p>각각의 경우 기억의 범위는 늘어난다 익숙한 순서와 패턴을 알아보는 능력에 의해.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>3</td><td>무작위 배치에서는 차이가 줄어듦</td><td>이제 같은 말들을 가져다가 체스판에 무작위로 놓아 보라 그러면 그 차이는 훨씬 줄어든다.</td></tr><tr><td>4</td><td>익숙한 패턴이 우위의 조건임</td><td>전문가의 강점은 익숙한 패턴에만 있다 즉 이전에 기억 속에 저장된 패턴이다.</td></tr><tr><td>7</td><td>음악에서 확인한 같은 원리</td><td>음악 교육을 받은 사람은 음표가 관습적 순서를 따를 때 교육받지 않은 사람보다 짧은 악보의 순서를 더 정확하게 재현할 수 있지만 음표가 무작위로 배열되면 그 강점은 크게 줄어든다.</td></tr><tr><td>9</td><td>발레에서도 익숙한 루틴이 유리함</td><td>숙련된 발레 무용수는 덜 숙련된 무용수보다 더 긴 스텝 순서를 반복할 수 있으며 무작위로 배열된 스텝보다 하나의 루틴을 이루는 스텝 순서를 더 잘 반복할 수 있다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-42","lesson":16,"type":"장문의 이해","title":"대화, 언어의 근원이자 목적","source":"2020년 11월 41~42번","page":92,"summary":"언어는 고립된 단어나 문장보다 대화와 인간의 상호 작용을 위해 생겨나고 진화했으며 문법과 이야기도 대화에 부차적이다.","footnote":"","sents":[{"title":"문장 1 · 선행사를 포함한 what","en":"Like all humans, the first Homo species to begin the long difficult process of constructing a language <span class=\"an\" data-n=\"맨 처음부터\"><span class=\"an-word\">from scratch</span></span> <b class=\"sl\">/</b> almost certainly never said entirely <span class=\"an ul\" data-n=\"선행사를 포함한 what\"><span class=\"an-word\">what</span></span> was on their minds.","tr":"모든 인간처럼 맨 처음부터 언어를 구성하는 길고 힘든 과정을 시작한 최초의 Homo 종도 거의 틀림없이 마음속에 있는 것을 전부 말하지는 않았다.","sv":[["S","the first Homo species to begin ...","주어"],["V","said","동사"],["O","what was on their minds","목적어"],["M","Like all humans / almost certainly never / entirely","수식어"]],"chunks":[["Like all humans, the first Homo species to begin the long difficult process of constructing a language from scratch","모든 인간처럼 맨 처음부터 언어를 구성하는 길고 힘든 과정을 시작한 최초의 Homo 종도",[]],["almost certainly never said entirely what was on their minds.","거의 틀림없이 마음속에 있는 것을 전부 말하지는 않았다.",[["선행사를 포함한 what","g7-1"]]]],"mnote":"선행사를 포함한 what: said의 목적어 what was on their minds는 마음속에 있던 것이라는 명사절이다. 필기: from scratch는 맨 처음부터이다.","isSummary":false},{"title":"문장 2 · 조동사 have 과거분사","en":"At the same time, these primitive hominins <b class=\"sl\">/</b> would not have simply <span class=\"an ul\" data-n=\"조동사 have 과거분사\"><span class=\"an-word\">made</span></span> random sounds or gestures.","tr":"동시에 이 원시 호미닌들은 단순히 무작위의 소리를 내거나 몸짓을 하지는 않았을 것이다.","sv":[["S","these primitive hominins","주어"],["V","would not have made","동사"],["O","random sounds or gestures","목적어"],["M","At the same time / simply","수식어"]],"chunks":[["At the same time, these primitive hominins","동시에 이 원시 호미닌들은",[]],["would not have simply made random sounds or gestures.","단순히 무작위의 소리를 내거나 몸짓을 하지는 않았을 것이다.",[["조동사 have 과거분사","g7-2"]]]],"mnote":"조동사 have 과거분사: 과거에 대한 추정 would have made 구조이므로 과거분사 made가 온다.","isSummary":false},{"title":"문장 3 · 삽입절을 포함한 관계절","en":"Instead, they would have used <span class=\"an\" data-n=\"의사소통 수단\"><span class=\"an-word\">means</span></span> to communicate <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"삽입절을 포함한 관계절\"><span class=\"an-word\">that</span></span> they believed others would understand.","tr":"대신 그들은 의사소통 수단을 사용했을 것이다 다른 사람들이 이해하리라고 자신들이 믿었던.","sv":[["S","they","주어"],["V","would have used","동사"],["O","means to communicate","목적어"],["X","that they believed others would understand","절·구조"]],"chunks":[["Instead, they would have used means esses는 같은 주어 It에 연결된 현재 동사이다. 필기: aspiration은 열망이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[expresses / expressing]</span></div>"}]},{"group":"문장 11","items":[{"id":"g7-11","title":"불가산 명사 language","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>But all language <mark>is</mark> ultimately at the service of human interaction.</div><div class=\"def-box\">all이 붙어도 여기서 language는 불가산 단수 취급이다. But은 다양한 기능을 궁극적 목적으로 수렴한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[is / are]</span></div>"}]},{"group":"문장 12","items":[{"id":"g7-12","title":"삽입구를 제외한 주어 components","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 12</span>Other components of language — things like grammar and stories — <mark>are</mark> secondary to conversation.</div><div class=\"def-box\">대시 안의 부연을 제외하면 복수 components가 주어이다. 결론은 대화의 우선성이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / is]</span></div>"}]}],"originalNumber":43,"pageEnd":93,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>최초 인류도 모든 뜻을 말하지 않고 청자의 추론을 기대함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>언어의 기원을 이해하려면 대화를 우선해야 함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>언어는 첫 단어보다 첫 대화와 함께 본격적으로 시작됨</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>사회를 세우는 언어의 궁극적 목적은 인간 상호 작용임</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>대화, 언어의 근원이자 목적</b><p>언어는 고립된 단어나 문장보다 대화와 인간의 상호 작용을 위해 생겨나고 진화했으며 문법과 이야기도 대화에 부차적이다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 11","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">But all language is ultimately at the service of human interaction.</div><p>하지만 모든 언어는 궁극적으로 인간의 상호 작용을 위한 것이다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>3</td><td>청자가 이해할 수단을 사용함</td><td>대신 그들은 의사소통 수단을 사용했을 것이다 다른 사람들이 이해하리라고 자신들이 믿었던.</td></tr><tr><td>4</td><td>청자의 추론과 맥락 지식</td><td>그들은 청자가 빈틈을 메울 수 있다고도 생각했다 그리고 발화된 것을 해석하기 위해 문화와 세계에 관한 지식을 연결할 수 있다고.</td></tr><tr><td>8</td><td>첫 대화가 근원이자 목적임</td><td>언어는 최초의 대화와 함께 비로소 본격적으로 시작되었다 대화는 언어의 근원이자 목적이다.</td></tr><tr><td>12</td><td>문법과 이야기는 대화에 부차적임</td><td>언어의 다른 구성 요소들, 즉 문법이나 이야기 같은 것은 대화에 부차적이다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-43","lesson":16,"type":"장문의 이해","title":"건강은 유전자만이 아닌 우리 손에","source":"2021년 11월 41~42번","page":94,"summary":"건강이 유전자에 의해 전적으로 결정된다는 관점을 넘어서 환경과의 다양한 상호 작용을 이해하면 건강 변화에 능동적으로 참여할 수 있다.","footnote":"","sents":[{"title":"문장 1 · 이론을 수식하는 수동 분사","en":"Since the turn of the twentieth century we’ve believed in genetic causes of diagnoses <b class=\"sl\">/</b> — a theory <span class=\"an ul\" data-n=\"이론을 수식하는 수동 분사\"><span class=\"an-word\">called</span></span> <span class=\"an\" data-n=\"유전자 결정론\"><span class=\"an-word\">genetic determinism</span></span>.","tr":"20세기로 접어든 이래 우리는 진단의 유전적 원인을 믿어 왔다 유전자 결정론이라고 불리는 이론이다.","sv":[["M","Since the turn of the twentieth century","수식어"],["S","we","주어"],["V","have believed","동사"],["M","in genetic causes of diagnoses","수식어"],["X","a theory called genetic determinism","절·구조"]],"chunks":[["Since the turn of the twentieth century we’ve believed in genetic causes of diagnoses","20세기로 접어든 이래 우리는 진단의 유전적 원인을 믿어 왔다",[]],["— a theory called genetic determinism.","유전자 결정론이라고 불리는 이론이다.",[["이론을 수식하는 수동 분사","g8-1"]]]],"mnote":"이론을 수식하는 수동 분사: 이론이 유전자 결정론으로 불리는 수동 관계라 called이다. Since 이후의 지속은 현재완료로 나타낸다.","isSummary":false},{"title":"문장 2 · 결정되는 대상의 수동태","en":"Under this model, our genes and subsequent health <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"결정되는 대상의 수동태\"><span class=\"an-word\">are determined</span></span> at birth.","tr":"이 모델에서 우리의 유전자와 그 이후의 건강은 태어날 때 결정된다.","sv":[["S","our genes and subsequent health","주어"],["V","are determined","동사"],["M","Under this model / at birth","수식어"]],"chunks":[["Under this model, our genes and subsequent health","이 모델에서 우리의 유전자와 그 이후의 건강은",[]],["are determined at birth.","태어날 때 결정된다.",[["결정되는 대상의 수동태","g8-2"]]]],"mnote":"결정되는 대상의 수동태: 유전자와 건강을 결정되는 대상으로 보는 모형을 설명하므로 수동태이다.","isSummary":false},{"title":"문장 3 · be destined to V","en":"We are “<span class=\"an ul\" data-n=\"함축: 유전자가 결정함\"><span class=\"an-word\">destined</span></span>” <span class=\"an ul\" data-n=\"be destined to V\"><span class=\"an-word\">to inherit</span></span> certain diseases <b class=\"sl\">/</b> based on the misfortune of our DNA.","tr":"우리는 특정 질병을 물려받을 운명이라고 여겨진다 우리 DNA의 불행에 근거하여.","sv":[["S","We","주어"],["V","are","동사"],["C","destined to inherit certain diseases","보어"],["M","based on the misfortune of our DNA","수식어"]],"chunks":[["We are “destined” to inherit certain diseases","우리는 특정 질병을 물려받을 운명이라고 여겨진다",[["be destined to V","g8-3"]]],["based on the misfortune of our DNA.","우리 DNA의 불행에 근거하여.",[]]],"mnote":"be destined to V: 필기: destined의 함축은 유전자가 결정한다는 관점이다. 필자의 최종 주장이 아니라 앞서 소개한 결정론의 설명이다.","isSummary":false},{"title":"문장 4 · doesn’t 뒤 동사원형","en":"Genetic determinism doesn’t <span class=\"an ul\" data-n=\"doesn’t 뒤 동사원형\"><span class=\"an-word\">consider</span></span> the role of family backgrounds, traumas, habits, <b class=\"sl\">/<  <mark>consider</mark> the role of family backgrounds, traumas, habits, or anything else within the environment.</div><div class=\"def-box\">단수 주어의 부정은 doesn’t consider이다. 여러 환경 요인이 결정론에서 빠지는 한계를 제시한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[consider / considers]</span></div>"}]},{"group":"문장 5","items":[{"id":"g8-5","title":"복수 주어의 보어 명사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>In this dynamic we are not active <mark>participants</mark> in our own health and wellness.</div><div class=\"def-box\">we를 받는 참여자는 복수 participants로 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[participants / participant]</span></div>"}]},{"group":"문장 6","items":[{"id":"g8-6","title":"조동사 뒤 동사원형","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>Why would we <mark>be</mark>?</div><div class=\"def-box\">would 뒤에는 be이다. 앞 문장의 능동적인 참여자를 생략한 수사의문문으로 결정론의 수동성을 드러낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[be / being]</span></div>"}]},{"group":"문장 7","items":[{"id":"g8-7","title":"가주어와 진주어","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>If something is predetermined, it’s not necessary <mark>to look</mark> at anything beyond our DNA.</div><div class=\"def-box\">it은 가주어이고 to look ...가 진주어이다. 앞서 설명한 유전자 결정론에서 따라 나오는 결론이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to look / looking]</span></div>"}]},{"group":"문장 8","items":[{"id":"g8-8","title":"the 비교급 상관 구문","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>But the more science has learned about the body and its interaction with the environment around it in its various forms, from our nutrition to our relationships to our racially oppressive systems, the more <mark>complicated</mark> the story becomes.</div><div class=\"def-box\">필기: the more ... the more ...가 연결된다. becomes 뒤에는 이야기의 상태인 형용사 complicated가 온다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[complicated / complicatedly]</span></div>"}]},{"group":"문장 9","items":[{"id":"g8-9","title":"선행사 interactions와 수 일치","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>We are not merely expressions of coding but products of a remarkable variety of interactions <mark>that are</mark> both within and outside of our control.</div><div class=\"def-box\">필기: not ... but ...은 유전 암호만의 표현과 다양한 상호 작용의 산물을 대비한다. 관계절 주어 that은 복수 interactions를 받는다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[that are / that is]</span></div>"}]},{"group":"문장 10","items":[{"id":"g8-10","title":"narrative의 내용절","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>Once we see beyond the narrative <mark>that</mark> genetics are destiny, we can take ownership of our health.</div><div class=\"def-box\">필기: that genetics are destiny는 이야기의 내용인 동격절이다. Once는 일단 그러하면이라는 조건·시간을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[that / what]</span></div>"}]},{"group":"문장 11","items":[{"id":"g8-11","title":"allow + O + to V","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>This allows us <mark>to see</mark> how “choiceless” we once were and empowers us with the ability to create real and lasting change.</div><div class=\"def-box\">필기: allows us to see는 5형식이며 allows와 empowers가 병렬이다. how choiceless we once were는 평서문 어순의 간접의문절이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to see / seeing]</span></div>"}]}],"originalNumber":44,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>유전자 결정론은 출생 시 건강의 운명이 정해진다고 봄</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>그 관점은 환경을 무시하여 우리를 수동적으로 만듦</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>과학은 건강을 다양한 내외부 상호 작용의 산물로 설명함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>유전자가 운명이라는 이야기를 넘어서면 변화를 만들 수 있음</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>건강은 유전자만이 아닌 우리 손에</b><p>건강이 유전자에 의해 전적으로 결정된다는 관점을 넘어서 환경과의 다양한 상호 작용을 이해하면 건강 변화에 능동적으로 참여할 수 있다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 9","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">We are not merely expressions of coding but products of a remarkable variety of interactions that are both within and outside of our control.</div><p>우리는 단순히 유전 암호의 표현이 아니라 우리의 통제 안과 밖에 있는 놀랍도록 다양한 상호 작용의 산물이다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>4</td><td>결정론이 환경 요인을 무시함</td><td>유전자 결정론은 가정 환경, 정신적 충격, 습관의 역할을 고려하지 않는다 환경 속의 그 밖의 어떤 것의 역할도.</td></tr><tr><td>8</td><td>환경과의 상호 작용이 설명을 바꿈</td><td>그러나 과학이 신체와 영양·관계·인종적 억압 체계 등 다양한 주변 환경과의 상호 작용을 더 많이 알아낼수록 그 이야기는 더욱 복잡해진다.</td></tr><tr><td>9</td><td>여러 상호 작용의 산물임</td><td>우리는 단순히 유전 암호의 표현이 아니라 우리의 통제 안과 밖에 있는 놀랍도록 다양한 상호 작용의 산물이다.</td></tr><tr><td>10</td><td>건강의 주도권을 가질 수 있음</td><td>유전자가 운명이라는 이야기를 넘어서 보게 되면 우리는 자신의 건강에 대한 주도권을 가질 수 있다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-44","lesson":16,"type":"장문의 이해","title":"머리에서 가슴으로 가는 여정","source":"2022년 분노와 불행에서 벗어날 수 있다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 13","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">It helps to remember that a piece of us resides in every person we meet.</div><p>기억하는 것이 도움이 된다 우리가 만나는 모든 사람 속에 우리 자신의 일부가 있다는 것을.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>공감으로 불행을 줄일 수 있음</td><td>우리가 이 여정을 한다면 세상에서 겪는 불행을 줄일 수 있다.</td></tr><tr><td>7</td><td>우리를 방해하는 일상 사례</td><td>줄에서 무심코 앞에 끼어드는 쇼핑객을 사랑하려고 해 보면 어떨까 차로 끼어드는 운전자, 배로 다이빙해 물을 튀기는 수영자, 우리 글에 나쁜 온라인 후기를 쓰는 독자도.</td></tr><tr><td>8</td><td>타인도 우리 같은 인간임</td><td>우리를 비참하게 하는 모든 사람은 우리처럼 인간이다 아마도 할 수 있는 최선을 다하며 부모나 자녀나 친구에게 깊이 사랑받는.</td></tr><tr><td>9</td><td>우리도 같은 실수를 함</td><td>그리고 우리는 몇 번이나 무심코 줄에서 누군가의 앞에 끼어들었는가?</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-45","lesson":16,"type":"장문의 이해","title":"고통스러운 쾌락의 비밀","source":"2024년 6월 41~42번","page":96,"summary":"실제 위험이 없음을 알 때 약간의 고통은 안전한 위협이 되어 통제감과 쾌감을 준다. 매운맛과 동물의 보상 학습을 비교한다.","footnote":"","sents":[{"title":"문장 1 · 목적의 in order to V","en":"All humans, to an extent, seek activities that cause a degree of pain in order <span class=\"an ul\" data-n=\"목적의 in order to V\"><span class=\"an-word\">to experience</span></span> pleasure, <b class=\"sl\">/</b> whether this is found in spicy food, strong massages, or stepping into a too-cold or too-hot bath.","tr":"모든 인간은 어느 정도 쾌락을 경험하기 위해 약간의 고통을 유발하는 활동을 추구한다 매운 음식이나 강한 마사지, 너무 차갑거나 뜨거운 욕조에 들어가는 것이든.","sv":[["S","All humans","주어"],["V","seek","동사"],["O","activities that cause a degree of pain","목적어"],["M","in order to experience pleasure / whether ...","수식어"]],"chunks":[["All humans, to an extent, seek activities that cause a degree of pain in order to experience pleasure,","모든 인간은 어느 정도 쾌락을 경험하기 위해 약간의 고통을 유발하는 활동을 추구한다",[["목적의 in order to V","g10-1"]]],["whether this is found in spicy food, strong massages, or stepping into a too-cold or too-hot bath.","매운 음식이나 강한 마사지, 너무 차갑거나 뜨거운 욕조에 들어가는 것이든.",[]]],"mnote":"목적의 in order to V: 필기: in order to는 목적이다. activities that cause ...는 고통을 유발하는 활동이라는 관계절이며 cause는 복수 선행사에 일치한다.","isSummary":false},{"title":"문장 2 · 보어 역할의 명사절","en":"The key is <b class=\"sl\">/</b> <span class=\"an ul\" data-n=\"보어 역할의 명사절\"><span class=\"an-word\">that</span></span> it is a ‘<span class=\"an st\" data-n=\"실제로는 안전한 위협\"><span class=\"an-word\">safe threat</span></span>’.","tr":"핵심은 그것이 안전한 위협이라는 점이다.","sv":[["S","The key","주어"],["V","is","동사"],["C","that it is a safe threat","보어"]],"chunks":[["The key is","핵심은",[]],["that it is a ‘safe threat’.","그것이 안전한 위협이라는 점이다.",[["보어 역할의 명사절","g10-2"]]]],"mnote":"보어 역할의 명사절: that 뒤 it is a safe threat는 완전한 문장이며 그 사실이 보어이다.","isSummary":false},{"title":"문장 3 · perceive + O + to V","en":"The brain perceives the stimulus <span class=\"an ul\" data-n=\"perceive + O + to V\"><span class=\"an-word\">to be</span></span> painful <b class=\"sl\">/</b> but ultimately non-threatening.","tr":"뇌는 자극이 고통스럽다고 인식하지만 궁극적으로는 위협적이지 않다고 본다.","sv":[["S","The brain","주어"],["V","perceives","동사"],["O","the stimulus","목적어"],["X","to be painful but ultimately non-threatening","절·구조"]],"chunks":[["The brain perceives the stimulus to be painful","뇌는 자극이 고통스럽다고 인식하지만",[["perceive + O + to V","g10-3"]]],["but ultimately non-threatening.","궁극적으로는 위협적이지 않다고 본다.",[]]],"mnote":"perceive + -harm is to have the pain always directly <mark>associated</mark> with a pleasurable reward.</div><div class=\"def-box\">필기: have the pain associated는 고통이 보상과 연결된 상태가 되게 하는 5형식이다. 동물은 별도의 보상 연결이 필요하다는 대조이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[associated / associating]</span></div>"}]}],"originalNumber":46,"pageEnd":97,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>사람은 쾌락을 위해 약간의 고통을 추구함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>실제로 안전한 위협이라 고통을 통제하는 보상을 느낌</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>매운맛은 위험 수용체를 자극하지만 안전함을 알아 즐기게 됨</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>고통 자체를 추구하는 인간과 보상을 연결해야 하는 동물을 대비함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>고통스러운 쾌락의 비밀</b><p>실제 위험이 없음을 알 때 약간의 고통은 안전한 위협이 되어 통제감과 쾌감을 준다. 매운맛과 동물의 보상 학습을 비교한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 2","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">The key is that it is a ‘safe threat’.</div><p>핵심은 그것이 안전한 위협이라는 점이다.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>3</td><td>고통스럽지만 실제 위협은 아님</td><td>뇌는 자극이 고통스럽다고 인식하지만 궁극적으로는 위협적이지 않다고 본다.</td></tr><tr><td>7</td><td>통제감을 통한 보상</td><td>이 보상 같은 효과는 비롯된다 고통을 통제한다는 느낌에서.</td></tr><tr><td>10</td><td>안전함을 아는 데서 쾌감이 생김</td><td>몸이 위험 신호를 보내지만 실제로는 완전히 안전하다는 것을 아는 것은 쾌감을 만들어 낸다.</td></tr><tr><td>13</td><td>동물은 별도의 보상 연결이 필요함</td><td>과학자들이 동물이 고추를 좋아하거나 자해하도록 훈련해 온 유일한 방법은 고통이 언제나 즐거운 보상과 직접 연결되게 하는 것이다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\ 두꺼비 소시지를 먹였다 두꺼비를 피하도록 조건화하면서.</td></tr><tr><td>8</td><td>사회적 학습으로 행동이 퍼짐</td><td>다른 주머니고양이들도 이 건설적인 행동을 모방했다 사회적 학습 과정을 통해.</td></tr><tr><td>10</td><td>모방 본능 덕분에 최소 개입으로 구함</td><td>주머니고양이는 최소한의 인간 개입으로 구해졌다 생태학자들이 그 동물의 자연적인 모방 본능을 이용할 수 있었기 때문이다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-47","lesson":16,"type":"장문의 이해","title":"규범을 모르면 생기는 문화 간 오해","source":"2024년 3월 41~42번","page":99,"summary":"문화마다 행동을 평가하는 규범이 달라 번역 가능한 감사 표현을 알아도 언제 사용해야 하는지 모르면 오해가 생길 수 있다.","footnote":"","sents":[{"title":"문장 1 · 분사구문의 병렬","en":"Norms are everywhere, <b class=\"sl\">/</b> defining what is “normal” and <span class=\"an ul\" data-n=\"분사구문의 병렬\"><span class=\"an-word\">guiding</span></span> our interpretations of social life <span class=\"an\" data-n=\"매 순간\"><span class=\"an-word\">at every turn</span></span>.","tr":"규범은 어디에나 있다 무엇이 정상인지 정하고 매 순간 사회생활에 대한 우리의 해석을 이끌면서.","sv":[["S","Norms","주어"],["V","are","동사"],["C","everywhere","보어"],["X","defining what is normal and guiding our interpretations ...","절·구조"]],"chunks":[["Norms are everywhere,","규범은 어디에나 있다",[]],["defining what is “normal” and guiding our interpretations of social life at every turn.","무엇이 정상인지 정하고 매 순간 사회생활에 대한 우리의 해석을 이끌면서.",[["분사구문의 병렬","g12-1"]]]],"mnote":"분사구문의 병렬: defining과 guiding은 규범이 행하는 능동적 작용으로 병렬이다. 필기: what is normal은 정의하는 내용인 명사절이다.","isSummary":false},{"title":"문장 2 · 병렬 동사원형","en":"As a simple example, there is a norm in Anglo society to say
