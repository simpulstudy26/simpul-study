ct <mark>quickly</mark>, given its probable intention to kill you.</div><div class=\"def-box\">반응하는 속도를 나타내므로 quickly이다. given은 여기서 고려하면이라는 전치사적 표현이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[quickly / quick]</span></div>"}]},{"group":"문장 13","items":[{"id":"g20-13","title":"realize 뒤 완전한 내용절","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 13</span>By the time you have realized <mark>that</mark> the design of its teeth and claws could kill you, you are dead.</div><div class=\"def-box\">the design ... could kill you는 완전한 문장이므로 that이다. 구조 분석의 시간이 생존에 너무 늦음을 과장하여 보여 준다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[that / what]</span></div>"}]},{"group":"문장 14","items":[{"id":"g20-14","title":"동명사구 주어","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 14</span>So, assuming intent, without detailed design analysis or understanding of the physics, <mark>has</mark> saved your life.</div><div class=\"def-box\">assuming intent 전체가 하나의 단수 주어이므로 has이다. 의도 추론이 생존에 유리했다는 사례의 결론이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[has / have]</span></div>"}]}],"originalNumber":56,"pageEnd":113,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>어릴 때부터 우연보다 사물과 사건의 목적을 선호함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>의도를 부여하면 존재의 행동을 빨리 예측할 수 있음</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>생존을 위해 익숙한 인간의 정신 특성으로 모호한 대상을 해석함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>사자의 구조를 분석하기 전 의도를 가정하는 것이 생명을 구함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>사물에도 의도를 부여하는 이유</b><p>인간이 모호한 사물이나 사건에 의도를 가정하는 의인화 편향은 포식자의 행동을 빠르게 판단해 생존하도록 돕던 기제에서 나왔다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 10","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">Therefore, we tend to assume intention even where there is none.</div><p>그러므로 우리는 의도를 가정하는 경향이 있다 아무 의도도 없는 곳에서도.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>목적을 부여하는 아동의 예</td><td>예를 들어 아이들은 뾰족한 돌이 그렇게 생겼다고 가정한다 여러분이 자기 위에 앉는 것을 원하지 않기 때문에.</td></tr><tr><td>5</td><td>의도 추론으로 빠르게 판단함</td><td>그러나 동물이나 심지어 사물에 의도를 부여하면 그 존재가 보일 법한 행동에 대해 빠르게 결정할 수 있다.</td></tr><tr><td>6</td><td>포식자를 피하는 생존상의 이점</td><td>이것은 수렵 채집 시절에 필수적이었다 포식자에게 잡아먹히지 않기 위해.</td></tr><tr><td>14</td><td>분석보다 빠른 의도 가정이 생명을 구함</td><td>따라서 자세한 구조 분석이나 물리적 현상의 이해 없이 의도를 가정하는 것은 여러분의 생명을 구해 왔다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-56","lesson":16,"type":"장문의 이해","title":"숫자는 중립적인 언어가 아니다","source":"2025년 3월 41~42번","page":114,"summary":"숫자는 현실을 더 정확하게 모두 담아내지 못하며 중요한 맥락과 인간의 고통을 지울 수 있으므로 수량화할 때 신중해야 한다.","footnote":"","sents":[{"title":"문장 1 · for 뒤 동명사","en":"Some researchers view spoken languages <b class=\"sl\">/</b> as <span class=\"an ci st\" data-n=\"불완전한\"><span class=\"an-word\">incomplete</span></span> devices for <span class=\"an ul\" data-n=\"for 뒤 동명사\"><span class=\"an-word\">capturing</span></span> precise differences.","tr":"일부 연구자는 구어를 여긴다 정밀한 차이를 포착하는 데 불완전한 도구로.","sv":[["S","Some researchers","주어"],["V","view","동사"],["O","spoken languages","목적 다고 여김</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>필자는 수량화가 가치 있는 정보를 없앤다고 반박함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>시험 점수는 학교·사교육·가정·불안의 맥락을 반영하지 못함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>통계가 고통을 지워 거리를 만들 수 있으므로 신중해야 함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>숫자는 중립적인 언어가 아니다</b><p>숫자는 현실을 더 정확하게 모두 담아내지 못하며 중요한 맥락과 인간의 고통을 지울 수 있으므로 수량화할 때 신중해야 한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 13","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">Quantify with caution.</div><p>수량화하라 신중하게.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>3</td><td>숫자로 바꾸어도 더 정확해지지는 않음</td><td>하지만 묘사 언어가 숫자로 바뀌어도 우리는 더 큰 정확성으로 나아가지는 않는다.</td></tr><tr><td>8</td><td>점수가 지워 버리는 학생의 맥락</td><td>이 숫자는 그들이 다닌 학교의 질을 설명하지 못한다 개인 교습, 지지적인 부모, 시험 불안 등의 여부도.</td></tr><tr><td>10</td><td>통계는 고통을 담지 못함</td><td>범죄, 노숙, 질병의 확산에 대한 통계는 사람의 고통에 대해 아무것도 말하지 않는다.</td></tr><tr><td>12</td><td>눈물이 지워진 인간이라는 비유</td><td>통계는 인간이다 눈물이 닦여 버린.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-57","lesson":16,"type":"장문의 이해","title":"신용카드가 씀씀이를 키우는 이유","source":"2025년 6월 41~42번","page":116,"summary":"카드 결제는 지불을 추상화해 돈을 잃는 고통을 덜 느끼게 하므로 현금보다 지출과 입찰액이 커질 수 있다.","footnote":"","sents":[{"title":"문장 1 · 동명사구 주어의 수 일치","en":"Paying with plastic fundamentally <span class=\"an ul\" data-n=\"동명사구 주어의 수 일치\"><span class=\"an-word\">changes</span></span> the way we spend money, <b class=\"sl\">/</b> altering the calculus of our financial decisions.","tr":"신용카드로 지불하는 것은 돈을 쓰는 방식을 근본적으로 바꾼다 재정적 결정의 계산법을 변화시키면서.","sv":[["S","Paying with plastic","주어"],["V","changes","동사"],["O","the way we spend money","목적어"],["X","altering the calculus of our financial decisions","절·구조"]],"chunks":[["Paying with plastic fundamentally changes the way we spend money,","신용카드로 지불하는 것은 돈을 쓰는 방식을 근본적으로 바꾼다",[["동명사구 주어의 수 일치","g22-1"]]],["altering the calculus of our financial decisions.","재정적 결정의 계산법을 변화시키면서.",[]]],"mnote":"동명사구 주어의 수 일치: Paying with plastic 전체가 단수 주어이다. 필기: altering은 앞 행동의 결과를 덧붙이는 능동 분사이다.","isSummary":false},{"title":"문장 2 · be동사 뒤 형용사 비교급","en":"When you buy something with cash, <b class=\"sl\">/</b> the purchase involves an actual loss — your wallet is <span class=\"an\" data-n=\"말 그대로\"><span class=\"an-word\">literally</span></span> <span class=\"an ul\" data-n=\"be동사 뒤 형용사 비교급\"><span class=\"an-word\">lighter</span></span>.","tr":"현금으로 무언가를 사면 그 구매는 실제 손실을 수반한다. 지갑이 말 그대로 더 가벼워진다.","sv":[["M","When you buy something with cash","수식어"],["S","the purchase / your wallet","주어"],["V","involves / is","동사"],["O","an actual loss","목적어"],["C","literally lighter","보어"]],"chunks":[["When you buy something with cash,","현금으로 무언가를 사면",[]],["the purchase involves an actual loss — your wallet is literally lighter.","그 구매는 실제 손실을 수반한다. 지갑이 말 그대로 더 가벼워진다.",[["be동사 뒤 형용사 비교급","g22-2"]]]],"mnote":"be동사 뒤 형용사 비교급: 지갑의 상태를 나타내므로 lighter이다. 필기: literally는 말 그대로이다.","isSummary":false},{"title":"문장 3 · make + O + 형용사 보어","en":"Credit cards, however, make the purchase <span class=\"an ul ci st\" data-n=\"5형식 목적격 보어\"><span class=\"an-word\">abstract</span></span> <b class=\"sl\">/</b> so that you don’t really feel the downside of spend \">집단별 평균을 냈다는 과거 정동사 averaged가 필요하다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[averaged / averaging]</span></div>"}]},{"group":"문장 10","items":[{"id":"g22-10","title":"배수 + as 원급 as","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>It turns out that the average credit card bid was twice <mark>as high as</mark> the average cash bid.</div><div class=\"def-box\">twice as high as는 두 배 높다는 배수 비교이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[as high as / higher as]</span></div>"}]},{"group":"문장 11","items":[{"id":"g22-11","title":"be동사 뒤 형용사 보어","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>When people used their credit cards, their bids were much more <mark>careless</mark>.</div><div class=\"def-box\">필기: careless를 강조했다. bids의 성격을 나타내므로 형용사이며 much는 비교급을 강조한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[careless / carelessly]</span></div>"}]},{"group":"문장 12","items":[{"id":"g22-12","title":"need를 수식하는 to부정사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 12</span>They no longer felt the need <mark>to limit</mark> their expenses.</div><div class=\"def-box\">지출을 제한할 필요라는 명사구이다. 필기에서 주제의 결론으로 표시한 문장이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to limit / limiting]</span></div>"}]}],"originalNumber":58,"pageEnd":117,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>결제 방식이 재정적 판단을 바꾼다고 주장함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>현금은 실제 손실을 느끼게 하지만 카드는 구매를 추상화함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>뇌 영상 연구와 지불 고통의 마비라는 설명을 제시함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>경매 실험에서 카드 집단의 평균 입찰액이 두 배로 나타남</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>신용카드가 씀씀이를 키우는 이유</b><p>카드 결제는 지불을 추상화해 돈을 잃는 고통을 덜 느끼게 하므로 현금보다 지출과 입찰액이 커질 수 있다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 12","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">They no longer felt the need to limit their expenses.</div><p>그들은 더 이상 필요를 느끼지 못했다 지출을 억제할.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>2</td><td>현금은 실제 손실을 드러냄</td><td>현금으로 무언가를 사면 그 구매는 실제 손실을 수반한다. 지갑이 말 그대로 더 가벼워진다.</td></tr><tr><td>3</td><td>카드가 지불을 추상화함</td><td>그러나 신용카드는 구매를 추상적으로 만들어 돈을 쓰는 부정적인 면을 실제로 느끼지 못하게 한다.</td></tr><tr><td>5</td><td>지불의 고통에 둔감해짐</td><td>Carnegie Mellon의 신경경제학자 George Lowenstein이 말하듯 신용카드의 본질은 뇌가 지불의 고통에 무뎌지게 한다.</td></tr><tr><td>10</td><td>카드 입찰액이 현금의 두 배임</td><td>평균 카드 입찰액이 평균 현금 입찰액보다 두 배 높았던 것으로 나타났다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}},{"id":"16-58","lesson":16,"type":"장문의 이해","title":"도와드릴까요가 최악의 말인 이유","source":"2025년 9월 41~42번","page":118,"summary":"상투적인 도움 제안은 고객을 방어적으로 만들 수 있으므로 구체적인 질문과 압박 없는 환경, 스스로 둘러볼 여유를 제공해야 한다.","footnote":"","sents":[{"title":"문장 1 · encourage + O + to V","en":"“May I help you?” are the worst four words that a <span class=\"an\" data-n=\"소매의\"><span class=\"an-word\">retail</span></span> salesperson can utter <b class=\"sl\">/</b> because they don’t encourage the customer <span cla  class=\"src-tag\">문장 2</span>The four words usually draw out a negative response that <mark>stops</mark> cold a sales transaction.</div><div class=\"def-box\">필기: stop cold는 완전히 막다, transaction은 거래이다. 단수 response를 받는 that절 동사는 stops이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[stops / stop]</span></div>"}]},{"group":"문장 3","items":[{"id":"g23-3","title":"긴 주어의 핵 Examples","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 3</span>Examples of better questions to use when approaching customers <mark>are</mark> “Is there anything in particular that you are looking for?” and “Are you shopping for a gift?”</div><div class=\"def-box\">주어의 핵은 복수 Examples이다. when approaching은 when salespeople are approaching에서 주어와 be동사가 생략된 형태이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[are / is]</span></div>"}]},{"group":"문장 4","items":[{"id":"g23-4","title":"가정법 과거","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 4</span>If a fashion salesperson approached you with “May I help you?” chances are you <mark>would</mark> feel the salesperson didn’t care.</div><div class=\"def-box\">approached라는 가정에 would feel이 호응한다. chances are는 그럴 가능성이 있다는 표현이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[would / will]</span></div>"}]},{"group":"문장 5","items":[{"id":"g23-5","title":"접근 방식의 수동태","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 5</span>This line is a rote approach that is so <mark>overused</mark> by untrained and uninterested salespeople.</div><div class=\"def-box\">접근 방식이 남용되는 대상이므로 overused이다. 필기: rote는 기계적인이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[overused / overusing]</span></div>"}]},{"group":"문장 6","items":[{"id":"g23-6","title":"on 뒤 동명사","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 6</span>In fact, most of us shudder in horror on <mark>hearing</mark> these words.</div><div class=\"def-box\">on hearing은 듣자마자라는 뜻이다. 필기: shudder는 몸서리치다, 떨다이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[hearing / hear]</span></div>"}]},{"group":"문장 7","items":[{"id":"g23-7","title":"단수 주어 customer와 병렬 동사","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 7</span>The very meaning of the question “May I help you?” suggests that the customer is in trouble of some sort and <mark>needs</mark> rescuing.</div><div class=\"def-box\">목적어절에서 is와 needs는 단수 customer를 공유한다. need rescuing은 구해질 필요가 있다는 수동 의미이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[needs / need]</span></div>"}]},{"group":"문장 8","items":[{"id":"g23-8","title":"단수 주어 This","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 8</span>This almost always <mark>puts</mark> the customer on the defense.</div><div class=\"def-box\">This가 단수라 puts이며 목적어의 상태를 on the defense로 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[puts / put]</span></div>"}]},{"group":"문장 9","items":[{"id":"g23-9","title":"양보 조건 even if","color":"purple","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 9</span>“No, thank you” is usually the immediate response, <mark>even if</mark> the customer is actually in need of assistance.</div><div class=\"def-box\">실제 도움이 필요한 경우에도 거절한다는 양보 관계이다. 필기: assistance는 도움이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[even if / only if]</span></div>"}]},{"group":"문장 10","items":[{"id":"g23-10","title":"선행사를 포함한 what","color":"orange","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 10</span>The subconscious thought by the customer is often “I’m smart enough to figure out <mark>what</mark> I want, and I don’t need your help!”</div><div class=\"def-box\">figure out의 목적어 what I want는 내가 원하는 것이라는 명사절이다. enough to는 충분한 능력을 나타낸다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[what / that]</span></div>"}]},{"group":"문장 11","items":[{"id":"g23-11","title":"감정·상태의 수동 분사","color":"teal","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 11</span>If customers feel <mark>pressured</mark> or cornered, then salespeople won’t make any sales.</div><div class=\"def-box\">필기: cornered는 궁지에 몰린이다. 고객이 압박을 받는 상태이므로 pressured와 cornered를 쓴다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[pressured / pressuring]</span></div>"}]},{"group":"문장 12","items":[{"id":"g23-12","title":"사역동사 make의 목적격 보어","color":"rose","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 12</span>The approach has to promote a comfortable environment that makes customers <mark>feel</mark> there is no rush.</div><div class=\"def-box\">makes customers feel에서 customers가 목적어, 원형 feel이 목적격 보어이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[feel / to feel]</span></div>"}]},{"group":"문장 13","items":[{"id":"g23-13","title":"want to V","color":"","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 13</span>Furthermore, if customers just want <mark>to look</mark> around, they should feel that it is all right to do so.</div><div class=\"def-box\">want to look around는 둘러보고 싶다이다. do so는 look around를 대신한다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[to look / looking]</span></div>"}]},{"group":"문장 14","items":[{"id":"g23-14","title":"keep + O + 형용사 보어","color":"green","star":true,"body":"<div class=\"src-line\"><span class=\"src-tag\">문장 14</span>In situations where customers really do want to look around on their own, salespeople should give customers their business cards and keep themselves <mark>accessible</mark> in case customers have questions or concerns.</div><div class=\"def-box\">keep themselves accessible에서 themselves의 상태를 나타내는 형용사 accessible을 쓴다. give와 keep이 should를 공유하며 in case는 그럴 경우에 대비하여라는 뜻이다.</div><div class=\"exam-line\">시험 형태: <span class=\"en\">[accessible / accessibly]</span></div>"}]}],"originalNumber":59,"pageEnd":119,"flow":{"tabLabel":"흐름·장문 이해","sections":[{"id":"a-flow","icon":"","title":"장문 전체의 전개","html":"<div class=\"stage-row\"><div class=\"stage-item \"><b>1</b>상투적인 도움 질문이 부정 반응과 거래 중단을 부른다고 함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>2</b>구체적인 상품·선물 질문을 대안으로 제시함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item \"><b>3</b>도움이 필요하다는 암시가 고객의 방어심과 즉각 거절을 유발함</div><span class=\"flow-arrow\">→</span><div class=\"stage-item hi\"><b>4</b>서두를 필요 없는 환경과 혼자 둘러볼 자유·연락 수단을 제공함</div></div>"},{"id":"a-summary","icon":"","title":"제목과 요지","html":"<div class=\"purple-box\"><b>도와드릴까요가 최악의 말인 이유</b><p>상투적인 도움 제안은 고객을 방어적으로 만들 수 있으므로 구체적인 질문과 압박 없는 환경, 스스로 둘러볼 여유를 제공해야 한다.</p></div>"},{"id":"a-key","icon":"","title":"중심 판단 문장 · 12","html":"<div class=\"rule-card purple\"><div class=\"src-line en\">The approach has to promote a comfortable environment that makes customers feel there is no rush.</div><p>접근 방식은 편안한 환경을 조성해야 한다 고객이 서두를 필요가 없다고 느끼게 하는.</p></div>"},{"id":"a-evidence","icon":"","title":"주장과 사례의 연결","html":"<div class=\"table-wrap\"><table class=\"ex-table\"><thead><tr><th>문장</th><th>역할</th><th>본문 근거</th></tr></thead><tbody><tr><td>3</td><td>구체적인 질문이라는 대안</td><td>고객에게 다가갈 때 사용할 더 나은 질문의 예는 특별히 찾는 것이 있나요와 선물을 쇼핑하시나요이다.</td></tr><tr><td>7</td><td>도움 질문에 담긴 곤경의 암시</td><td>도와드릴까요라는 질문의 의미 자체는 암시한다 고객이 어떤 곤경에 처해 구출이 필요하다고.</td></tr><tr><td>11</td><td>압박감은 판매를 막음</td><td>고객이 압박받거나 궁지에 몰렸다고 느끼면 판매원은 어떤 판매도 하지 못할 것이다.</td></tr><tr><td>14</td><td>혼자 둘러볼 자유와 접근 가능성 유지</td><td>고객이 정말 혼자 둘러보고 싶은 상황에서는 판매원이 명함을 주고 질문이나 걱정이 생기면 고객이 찾아올 수 있는 상태를 유지해야 한다.</td></tr></tbody></table></div>"},{"id":"a-title","icon":"","title":"제목 범위 확인","html":"<p class=\"lead\">개별 사례에만 치우치거나 본문과 반대인 제목을 피하고 글 전체를 포괄하는 제목을 고르세요.</p><div class=\"drill\"><div class=\"drill-top\"><span>장문 제목 연습</span><span class=\"spacer\"></span><button class=\"act-btn ghost\" onclick=\"resetTitle()\">다시 하기</button></div><div id=\"title-box\"></div><div id=\"title-feedback\"></div></div>"},{"id":"a-reading","icon":"","title":"장문 독해 점검","html":"<div class=\"note\">제목은 주장과 모든 사례를 함께 설명해야 합니다. 문맥상 어휘는 대조·인과의 방향과 연결해서 판단하세요. 본문 정독에서 연결어와 필기를 확인한 뒤 문제 풀기 탭에서 어휘 문제를 풀어 보세요.</div>"}]}}];
function passageNumber(p){return String(p.id).split('-').pop().padStart(2,'0');}
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function plainText(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('.sl').forEach(e=>e.remove());return d.textContent.replace(/\s+/g,' ').trim();}
function circled(n){return n<=20?String.fromCharCode(0x2460+n-1):'('+n+')';}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function typeIcon(t){return (TYPE_META[t]||{icon:''}).icon;}
function lessons(){return [...new Set([...UNITS.map(u=>u.lesson),...PASSAGES.map(p=>p.lesson)])].sort((a,b)=>a-b);}
function unitTypes(l){const base=UNITS.filter(u=>u.lesson===l).map(u=>u.type);return [...new Set([...base,...typesOf(PASSAGES.filter(p=>p.lesson===l))])];}
function typesOf(list){const ts=[...new Set(list.map(p=>p.type))];return ts.sort((a,b)=>{const ia=TYPE_ORDER.indexOf(a),ib=TYPE_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});}
function sortId(a,b){return a.id.localeCompare(b.id,undefined,{numeric:true});}

let P=null;                 // 현재 지문
const STORE={};             // 지문별 훈련 진행 상태 (새로고침 전까지 유지)
function S(){
  if(!STORE[P.id])STORE[P.id]={gram:[],word:[],vocab:{vals:[],res:[],show:false},order:[],orderFb:'',scr:null};
  return STORE[P.id];
}

function go(hash){if(location.hash===hash)route();else location.hash=hash;}
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(h.startsWith('P/')){const p=PASSAGES.find(x=>x.id===h.slice(2));if(p){renderStudy(p);return;}}
  if(h.startsWith('L/')){const l=Number(h.slice(2));if(lessons().includes(l)){renderLesson(l);return;}}
  renderHome();
}
function setHeader(crumbs,titleHtml,tabsHtml){
  $('crumbs').innerHTML=crumbs.map((c,i)=>i===crumbs.length-1?`<span class="here">${c[0]}</span>`:`<button onclick="go('${c[1]}')">${c[0]}</button><span class="sep">›</span>`).join('');
  $('ptitle').innerHTML=titleHtml;
  $('tabbar').innerHTML=tabsHtml||'';
  $('tabbar').style.display=tabsHtml?'flex':'none';
  $('hdr').classList.toggle('has-tabs',!!tabsHtml);
  window.scrollTo({top:0});
}

const CLASS_PASSAGES = new Set();
function classPassageBadge(p){return CLASS_PASSAGES.has(p.id)?'<span class="class-passage"> 수업 지문</span>':'';}

function renderHome(){
  P=null;
  document.body.removeAttribute('data-lesson');
  document.title=`${APP_TITLE} | ${APP_SUB}`;
  setHeader([[APP_SUB,'#/']],APP_TITLE);
  $('view').innerHTML=`
    <div class="home-head"><h1>단원 선택</h1><p>11과 · 15과 · 16과 · 총 58개 지문 · 본문부터 문제 풀기까지</p></div>
    <div class="lesson-grid">${lessons().map(l=>{
      const list=PASSAGES.filter(p=>p.lesson===l);
      return `<button class="lesson-card" data-lesson="${l}" onclick="go('#/L/${l}')">
        <span class="lesson-no">${l}<small>과</small></span>
        <span>${unitTypes(l).map(t=>`<span class="badge badge-rose">${typeIcon(t)} ${esc(t)}</span>`).join('')}</span>
        <span class="lesson-meta">${list.length?`지문 ${list.length}개`:'지문 준비 중'}</span></button>`;}).join('')}</div>`;
}

function renderLesson(l){
  P=null;
  document.body.dataset.lesson=String(l);
  const list=PASSAGES.filter(p=>p.lesson===l);
  document.title=`${l}과 | ${APP_TITLE}`;
  setHeader([[APP_SUB,'#/'],[`${l}과`,`#/L/${l}`]],`${l}과 <span class="badge-unit">지문 ${list.length}개</span>`);
  $('view').innerHTML=unitTypes(l).map(t=>{
    const ps=list.filter(p=>p.type===t).sort(sortId);
    return `<section class="type-section">
      <div class="type-head">${typeIcon(t)} ${esc(t)} <span class="cnt">${ps.length}지문</span></div>

const TABS=[
  {group:'읽기',label:'본문 정독'},
  {group:null,label:'문장 해부'},
  {group:'정리',label:'어법 포인트'},
  {group:null,label:null},            /* flow.tabLabel */
  {group:'문제',label:'문제 풀기'},
  {group:'지도',label:'한눈에 보기'}
];
function switchTab(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  window.scrollTo({top:0,behavior:'smooth'});
}
function goTo(tabIdx,anchorId){
  switchTab(tabIdx);
  if(anchorId)setTimeout(()=>{const el=$(anchorId);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},120);
}

function renderStudy(p){
  P=p;
  document.body.dataset.lesson=String(p.lesson);
  document.title=`${passageNumber(p)} | ${APP_TITLE}`;
  const tabs=TABS.map((t,i)=>(t.group?`<span class="tab-group-label">${t.group}</span>`:'')+
    `<button class="tab-btn${i===0?' active':''}" onclick="switchTab(${i})"><span class="tab-num">${i+1}</span>${esc(t.label||p.flow.tabLabel)}</button>`).join('');
  setHeader([[APP_SUB,'#/'],[`${p.lesson}과`,`#/L/${p.lesson}`],[p.type,`#/L/${p.lesson}`],[passageNumber(p),'']],
    `${esc(passageNumber(p))} <span class="badge-unit">${p.lesson}과</span><span class="badge-unit rose">${typeIcon(p.type)} ${esc(p.type)}</span>${classPassageBadge(p)}`,tabs);
  $('view').innerHTML=[panelRead(),panelDissect(),panelGrammar(),panelFlow(),panelDrills(),panelMap()]
    .map((h,i)=>`<section class="tab-panel${i===0?' active':''}" id="panel-${i}">${h}</section>`).join('');
}

  </div>

  <div class="drill"><div class="drill-top"><span>${P.lesson===15?'요약문을 제외한 본문의 단락을':'주어진 문장 다음에 이어질 내용을'} 순서대로 ${d.order.boxes.map(b=>'('+b.k+')').join('')}를 누르세요. 다시 누르면 취소됩니다.</span></div>
   <div class="ord-given"><b style="font-family:'Noto Sans KR'">주어진 글</b> ${esc(plainText(P.sents[d.order.given].en))}</div>
   <div id="ord-boxes"></div><div class="ord-seq" id="ord-seq"></div>
   <div class="btn-row"><button class="act-btn" onclick="checkOrder()">채점하기</button><button class="act-btn ghost" onclick="resetOrder()">다시 하기</button></div>
   <div id="ord-fb"></div>
  </div>

  <h2 class="section-title" id="d-scr"> 훈련 5 · 영작 배열</h2>
  <div class="drill"><div class="drill-top"><span>단어를 눌러 우리말에 맞게 배열하세요. 배열한 단어를 누르면 되돌아갑니다.</span><span class="spacer"></span><span class="score" id="scr-score"></span></div><div id="scr-box"></div></div>`;
}

/* 훈련 1·2 */
function renderChoice(key){
  const data=P.drills[key],st=S()[key];
  $(key+'-box').innerHTML=data.map((d,i)=>{
    const pick=st[i],done=pick!==undefined;
    const opts=d.o.map((o,j)=>{
      let c='ch-opt';if(done){if(j===d.a)c+=' correct';else if(j===pick)c+=' wrong';}
      return `<button class="${c}" ${done?'disabled':''} onclick="pickChoice('${key}',${i},${j})">${esc(o)}</button>`;
    }).join(' / ');
    const no=d.s>=0?(P.sents[d.s].isSummary?'요약문':`문장 ${d.s+1}`):`${i+1}`;
    return `<div class="ch-item"><div class="ch-s"><span class="n">${no}</span>${esc(d.pre)}[ ${opts} ]${esc(d.post)}</div>${done?`<div class="ch-exp ${pick===d.a?'ok':'no'}">${pick===d.a?'':'X'} ${esc(d.e)}</div>`:''}</div>`;
  }).join('');
  const ans=st.filter(v=>v!==undefined).length,cor=data.filter((d,i)=>st[i]===d.a).length;
  $(key+'-score').textContent=`${cor} / ${ans} 정답 · ${ans}/${data.length}문항`;
}
function pickChoice(key,i,j){S()[key][i]=j;renderChoice(key);}
function resetChoice(key){S()[key]=[];renderChoice(key);}

/* 훈련 3 : 문장 대응 어휘 해석 */
function vocabNorm(s){return String(s||'').replace(/[\s.,·~()\-'"]/g,'');}
function vocabLayout(){
  /* 영어 등장 순서대로 번호를 매기고, 영어/한국어 위치를 계산 */
  const V=P.drills.vocab;let n=0;
  return P.sents.map((s,si)=>{
    const en=plainText(s.en),ko=plainText(s.tr);
    const items=V.map((v,vi)=>({...v,vi})).filter(v=>v.s===si)
      .map(v=>({...v,ep:en.indexOf(v.en),kp:ko.indexOf(v.ko)}))
      .sort((a,b)=>a.ep-b.ep);
    items.forEach(v=>{v.no=++n;});
    return {si,en,ko,items};
  });
}
function markUp(text,items,posKey,lenKey,make){
  let cur=0,out='';
  items.filter(v=>v[posKey]>=0).slice().sort((a,b)=>a[posKey]-b[posKey]).forEach(v=>{
    if(v[posKey]<cur)return;
    out+=esc(text.slice(cur,v[posKey]))+make(v);
    cur=v[posKey]+v[lenKey].length;
  });
  return out+esc(text.slice(cur));
}
function renderVocab(){
  const st=S().vocab,L=vocabLayout();
  const total=P.drills.vocab.length;
  $('vocab-box').innerHTML=L.map(r=>{
    const enHtml=markUp(r.en,r.items,'ep','en',v=>{
      const res=st.res[v.vi];
      return `<span class="voc-w${res===true?' ok':res===false?' no':''}" onclick="focusVocab(${v.vi})"><sup>${v.no}</sup>${esc(v.en)}</span>`;});
    const koHtml=markUp(r.ko,r.items,'kp','ko',v=>{
      const res=st.res[v.vi];
      const w=Math.max(56,[...v.ko].length*15+18);
      return `<span class="vt-blank"><sup>${v.no}</sup><input id="voc-${v.vi}" autocomplete="off" aria-label="${v.no}번 빈칸" style="width:${w}px" value="${esc(st.vals[v.vi]||'')}" class="${res===true?'ok':res===false?'no':''}" oninput="S().vocab.vals[${v.vi}]=this.value" onkeydown="vocabKey(event,${v.no})">${st.show?`<span class="voc-key">${esc(v.ko)}</span>`:''}</span>`;});
    return `<div class="vt-item"><div class="vt-en"><span class="voc-sn">${P.sents[r.si].isSummary?'요약':r.si+1}</span>${enHtml}</div><div class="vt-ko"><span class="vt-tag">해석</span>${koHtml}</div></div>`;
  }).join('');
  const c=st.res.filter(x=>x===true).length;
  $('vocab-score').textContent=st.res.length?`${c} / ${total} 정답`:`빈칸 ${total}개`;
  const b=$('vocab-show');if(b){b.classList.toggle('on',st.show);b.textContent=st.show?'정답 숨기기':'정답 보기';}
}
function vocabKey(e,no){
  if(e.key!=='Enter')return;
  e.preventDefault();
  const next=vocabLayout().flatMap(r=>r.items).find(v=>v.no===no+1);
  if(next)focusVocab(next.vi);
}
function focusVocab(i){
  const inp=$('voc-'+i);if(!inp)return;
  inp.focus({preventScroll:true});
  inp.scrollIntoView({behavior:'smooth',block:'center'});
}
function checkVocab(){
  const V=P.drills.vocab,st=S().vocab;
  st.res=V.map((v,i)=>{const n=vocabNorm(st.vals[i]);return n.length>0&&v.k.some(k=>n.includes(vocabNorm(k)));});
  renderVocab();
}
function toggleVocabShow(){S().vocab.show=!S().vocab.show;renderVocab();}
function resetVocab(){S().vocab={vals:[],res:[],show:false};renderVocab();}

/* 훈련 4 : 순서 */
function renderOrder(){
  const O=P.drills.order,seq=S().order;
  $('ord-boxes').innerHTML=O.boxes.map(b=>`<button class="ord-box${seq.includes(b.k)?' used':''}" onclick="pickOrder('${b.k}')"><b>(${b.k})</b>${esc(b.ss.map(si=>plainText(P.sents[si].en)).join(' '))}</button>`).join('');
  $('ord-seq').innerHTML=O.boxes.map((b,i)=>`<span class="ord-slot${seq[i]?' filled':''}">${seq[i]?'('+seq[i]+')':''}</span>`).join('<span class="flow-arrow">→</span>');
  $('ord-fb').innerHTML=S().orderFb;
}
function pickOrder(k){
  const st=S(),i=st.order.indexOf(k);
  if(i>=0)st.order.splice(i,1);else if(st.order.length<P.drills.order.boxes.length)st.order.push(k);
  st.orderFb='';renderOrder();
}
function checkOrder(){
  const O=P.drills.order,st=S();
  if(st.order.length<O.boxes.length)st.orderFb='<div class="ch-exp no">모든 단락을 순서대로 눌러 주세요.</div>';
  else{const ok=st.order.join()===O.answer.join();
    st.orderFb=`<div class="ch-exp ${ok?'ok':'no'}">${ok?' 정답!':'X 정답은 '+O.answer.map(k=>'('+k+')').join(' → ')}<br>${esc(O.exp)}</div>`;}
  renderOrder();
}
function resetOrder(){S().order=[];S().orderFb='';renderOrder();}

/* 훈련 5 : 배열 */
function newScr(i){
  const words=P.drills.scr[i].s.replace(/\.$/,'').split(' ').map((w,k)=>({w,k}));
  let pool=shuffle(words);
  if(pool.map(x=>x.k).join()===words.map(x=>x.k).join())pool=pool.reverse();
  return {pool,ans:[],result:null,show:false};
}
function renderScr(){
  const all=S().scr;
  $('scr-box').innerHTML=P.drills.scr.map((d,i)=>{const st=all[i];return `<div class="scr-item">
    <div class="scr-ko">${d.isSummary?'요약문':i+1}. ${esc(d.ko)}</div>
    <div class="scr-ans${st.result===true?' ok':st.result===false?' no':''}">${st.ans.map((t,p)=>`<button class="tok" onclick="scrBack(${i},${p})">${esc(t.w)}</button>`).join('')}</div>
    <div class="scr-pool">${st.pool.map((t,p)=>`<button class="tok" onclick="scrPick(${i},${p})">${esc(t.w)}</button>`).join('')}</div>
    <div class="btn-row" style="margin-top:0"><button class="act-btn" onclick="scrCheck(${i})">확인</button><button class="act-btn ghost" onclick="scrShow(${i})">정답 보기</button><button class="act-btn ghost" onclick="scrReset(${i})">다시 섞기</button></div>
    ${st.result===false?'<div class="ch-exp no">X 순서를 다시 확인해 보세요.</div>':''}
    ${st.result===true?'<div class="ch-exp ok"> 정답!</div>':''}
    ${st.show?`<div class="scr-key">${esc(d.s)}</div>`:''}</div>`;}).join('');
  $('scr-score').textContent=`${all.filter(s=>s.result===true).length} / ${all.length} 완성`;
}
function scrPick(i,p){const st=S().scr[i];st.ans.push(st.pool.splice(p,1)[0]);st.result=null;renderScr();}
function scrBack(i,p){const st=S().scr[i];st.pool.push(st.ans.splice(p,1)[0]);st.result=null;renderScr();}
function scrCheck(i){const st=S().scr[i];st.result=st.pool.length===0&&st.ans.map(t=>t.w).join(' ')===P.drills.scr[i].s.replace(/\.$/,'');renderScr();}
function scrShow(i){S().scr[i].show=true;renderScr();}
function scrReset(i){S().scr[i]=newScr(i);renderScr();}

/* ── 탭 6 : 한눈에 보기 ── */
function panelMap(){
  const G=grammarNumbered();
  const root=(tab,color,icon,label,inner)=>`<div class="map-root ${color}"><button class="map-root-head" onclick="goTo(${tab})"><span class="tabno">탭 ${tab+1}</span>${icon} ${esc(label)}</button><div class="map-children">${inner}</div></div>`;
  return `
  <div class="unit-banner"> ${esc(passageNumber(P))} 전체 구조 지도</div>
  <h2 class="section-title"> 한눈에 보기</h2>
  <div class="tip">클릭하면 해당 탭과 위치로 이동합니다. 색이 칠해진 큰 제목은 탭 전체로, 작은 칸은 세부 설명 위치로 스크롤됩니다.</div>
  ${root(0,'','','본문 정독',`<div class="map-group"><button class="map-node" onclick="goTo(0,'a-read')">본문 + 레이어</button><div class="map-subrow">${['필기','끊어 읽기','해석 열기'].map(x=>`<button class="map-subchip" onclick="goTo(0,'a-read')">${x}</button>`).join('')}</div></div>`)}
  ${root(1,'teal','','문장 해부',P.sents.map((s,i)=>`<button class="map-node" onclick="goTo(1,'a-s${i+1}')">${s.isSummary?'요약':i+1} ${esc(s.title)}</button>`).join(''))}
  ${root(2,'purple','','어법 포인트',G.map(g=>`<div class="map-group"><button class="map-node" onclick="goTo(2,'${g.items[0].id}')">${esc(g.group)}</button><div class="map-subrow">${g.items.map(it=>`<button class="map-subchip" onclick="goTo(2,'${it.id}')">${it.num} ${esc(it.title)}</button>`).join('')}</div></div>`).join(''))}
  ${root(3,'orange','',P.flow.tabLabel,P.flow.sections.map(s=>`<button class="map-node" onclick="goTo(3,'${s.id}')">${esc(s.title)}</button>`).join(''))}
  ${root(4,'green','','문제 풀기',[['d-gram','1 어법 선택'],['d-word','2 문맥 어휘 선택'],['d-vocab','3 문장 속 어휘 해석'],['d-order','4 글의 순서'],['d-scr','5 영작 배열']].map(x=>`<button class="map-node" onclick="goTo(4,'${x[0]}')">${x[1]}</button>`).join(''))}`;
}



function renderSummary(){
 const data=P.drills.summary,st=S().summary||(S().summary=[]);
 const text=plainText(P.sents[P.sents.length-1].en);let cursor=0,out='';
 data.map((d,i)=>({...d,i})).sort((a,b)=>a.at-b.at).forEach(d=>{
  out+=esc(text.slice(cursor,d.at));
  const pick=st[d.i],done=pick!==undefined;
  out+='<span class="badge badge-green">'+String.fromCharCode(65+d.i)+'</span>[ '+d.o.map((o,j)=>{
   const cls=done?(j===d.a?' correct':j===pick?' wrong':''):'';
   return '<button class="ch-opt'+cls+'" '+(done?'disabled':'')+' onclick="pickSummary('+d.i+','+j+')">'+esc(o)+'</button>';
  }).join(' / ')+' ]';cursor=d.at+d.en.length;
 });
 out+=esc(text.slice(cursor));$('summary-box').innerHTML=out;
 const answered=st.filter(x=>x!==undefined).length,correct=data.filter((d,i)=>st[i]===d.a).length;
 $('summary-score').textContent=correct+' / '+answered+' 정답 · '+answered+'/'+data.length+'문항';
 $('summary-feedback').innerHTML=data.map((d,i)=>st[i]===undefined?'':'<div class="ch-exp '+(st[i]===d.a?'ok':'no')+'"><b>'+String.fromCharCode(65+i)+' · '+esc(d.o[d.a])+'</b><br>'+esc(d.e)+'</div>').join('');
}
function pickSummary(i,j){(S().summary||(S().summary=[]))[i]=j;renderSummary();}
function resetSummary(){S().summary=[];renderSummary();}


function renderTitle(){
 const d=P.drills.title,j=S().titleChoice,done=j!==undefined;
 $('title-box').innerHTML=d.o.map((text,i)=>'<button class="ch-opt title-opt'+(done?(i===d.a?' correct':i===j?' wrong':''):'')+'" '+(done?'disabled':'')+' onclick="pickTitle('+i+')">'+(i+1)+'. '+esc(text)+'</button>').join('');
 $('title-feedback').innerHTML=done?'<div class="ch-exp '+(j===d.a?'ok':'no')+'"><b>'+(j===d.a?'정답!':'정답: '+(d.a+1)+'번')+'</b><p>'+esc(d.e)+'</p><p>전체 주장과 근거를 포괄하는 제목입니다. 반대 주장이나 일부 사례에만 한정된 제목과 구별하세요.</p></div>':'';
}
function pickTitle(j){S().titleChoice=j;renderTitle();}
function resetTitle(){delete S().titleChoice;renderTitle();}

window.addEventListener('hashchange',route);route();
</script></body></html>
