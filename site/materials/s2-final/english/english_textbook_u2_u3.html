<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 교과서 Unit 2 · Unit 3 — 필기 기반 정독 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --paper:var(--c-f6f3ec); --card:var(--c-ffffff); --ink:var(--c-1d1b18); --ink2:var(--c-5b554c); --ink3:var(--c-8c857a); --line:var(--c-e6e0d4); --line2:var(--c-f0ebe1);
  --pen:var(--c-2846b8); --pen-bg:var(--c-eef1fc);
  --role:var(--c-c2410c); --rc:var(--c-7c3aed); --md:var(--c-0e8a7d); --nc:var(--c-d97706); --pl:var(--c-e11d48);
  --plus:var(--c-6b7280); --plus-bg:var(--c-f3f4f6);
  --acc:var(--c-d1336f); --acc2:var(--c-6d3fc0); --acc-bg:var(--c-fcf0f5);
  --yellow:var(--c-e0a800); --blue:var(--c-2b59c3); --red:var(--c-c8371d);
  --r:16px; --sh:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.05);
}
body[data-unit="u3"]{ --acc:var(--c-2b59c3); --acc2:var(--c-c8371d); --acc-bg:var(--c-eef3fc); }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.serif{font-family:'Source Serif 4',Georgia,serif}

/* ===== Top bar ===== */
.topbar{background:var(--ink);color:var(--c-f6f3ec)}
.topbar-in{max-width:920px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.85}
.brand b{color:var(--c-ffd27a);font-weight:900}
.unit-switch{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.unit-switch button{border:0;background:transparent;color:var(--c-d8d2c6);font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;display:flex;align-items:center;gap:7px}
.unit-switch button.on{background:var(--c-f6f3ec);color:var(--ink)}
.dots{display:inline-flex;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ===== Hero ===== */
.hero{background:var(--acc-bg);border-bottom:1px solid var(--line)}
.hero-in{max-width:920px;margin:0 auto;padding:26px 18px 22px;position:relative}
.hero .kicker{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.08em}
.hero h1{font-family:'Source Serif 4',Georgia,serif;font-size:34px;line-height:1.15;font-weight:700;margin:4px 0 6px;letter-spacing:-.01em}
.hero .kr{font-size:14px;color:var(--ink2)}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;font-weight:500;background:var(--c-ffffff);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink2)}
.stripe{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:16px;max-width:260px}
.stripe span{flex:1}

/* ===== Tabs ===== */
.tabs{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:920px;margin:0 auto;padding:10px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--c-ffffff);color:var(--ink2);font-size:13.5px;font-weight:500;padding:7px 13px;border-radius:999px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab .ic{font-size:14px}
.tab.on{background:var(--ink);color:var(--c-ffffff);border-color:var(--ink);font-weight:700}
.tab.on .ic{filter:none}

main{max-width:920px;margin:0 auto;padding:22px 14px 110px}
.panel{display:none}.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.sec-h{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{font-size:19px;font-weight:900;letter-spacing:-.01em}
.sec-h p{font-size:13px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.lead{font-size:13.5px;color:var(--ink2);background:var(--c-ffffff);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}

/* ===== Reading panel ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend b{font-family:'Source Serif 4',serif;font-size:16px}
.lg-pen{font-family:'Nanum Pen Script',cursive;font-size:18px;color:var(--pen)}
.lg-role{font:700 10.5px ui-monospace,Menlo,monospace;color:var(--role);border:1px solid var(--c-f3c7a8);border-radius:4px;padding:0 4px}
.toggles{display:flex;gap:6px}
.tg{border:1px solid var(--line);background:var(--c-ffffff);color:var(--ink3);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px}
.tg.on{background:var(--pen-bg);color:var(--pen);border-color:var(--c-c9d2f5)}

.para{margin-bottom:22px;overflow:visible;scroll-margin-top:64px}
.para-h{border-radius:var(--r) var(--r) 0 0}
.para-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2);background:linear-gradient(90deg,var(--acc-bg),var(--c-ffffff) 70%)}
.pno{font-family:'Source Serif 4',serif;font-size:30px;font-weight:700;color:var(--acc);line-height:1;min-width:42px}
.para-h .t{font-weight:700;font-size:15.5px;line-height:1.35}
.para-h .s{font-size:12px;color:var(--ink3)}
.who{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--c-ffffff);background:var(--acc2);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sent{display:grid;grid-template-columns:26px 1fr;gap:6px 10px;padding:12px 18px 14px;border-bottom:1px solid var(--line2)}
.sent:last-child{border-bottom:0}
.snum{width:22px;height:22px;border-radius:50%;background:var(--line2);color:var(--ink3);font:700 11px/22px 'Noto Sans KR';text-align:center;margin-top:10px}
.en{font-family:'Source Serif 4',Georgia,serif;font-size:18.5px;line-height:2.6;color:var(--ink);word-break:keep-all}
.en i{font-style:italic}
.ko{font-size:14px;color:var(--ink2);line-height:1.7;margin-top:6px;padding-left:10px;border-left:3px solid var(--line)}
.snotes{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.note{font-size:13px;line-height:1.55;padding:5px 10px 5px 30px;border-radius:9px;position:relative}
.note.n{background:var(--pen-bg);color:var(--c-1f3590)}
.note.n::before{content:"✍";position:absolute;left:10px;top:5px}
.note.p{background:var(--plus-bg);color:var(--c-374151)}
.note.p::before{content:"＋";position:absolute;left:10px;top:5px;font-weight:700;color:var(--plus)}

.gw,.rw{position:relative;display:inline-block;line-height:1.35;text-indent:0}
.gw::before{content:attr(data-g);position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:1px;white-space:nowrap;font-family:'Nanum Pen Script',cursive;font-size:16px;color:var(--pen);line-height:1;font-style:normal;font-weight:400;pointer-events:none}
.rw::after{content:attr(data-r);position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:1px;white-space:nowrap;font:700 10.5px ui-monospace,Menlo,Consolas,monospace;color:var(--role);line-height:1;font-style:normal;pointer-events:none}
.gw.rw::before{bottom:100%}
.rc::before{content:"[";color:var(--rc);font-weight:700;margin-right:1px}
.rc::after{content:"]";color:var(--rc);font-weight:700;margin-left:1px}
.md::before{content:"(";color:var(--md);font-weight:700}
.md::after{content:")";color:var(--md);font-weight:700}
.nc::before{content:"〈";color:var(--nc);font-weight:700}
.nc::after{content:"〉";color:var(--nc);font-weight:700}
u.pl{text-decoration:underline;text-decoration-color:var(--pl);text-decoration-thickness:2px;text-underline-offset:5px}
mark{background:linear-gradient(transparent 55%,var(--c-ffe58a) 55%);color:inherit;padding:0 1px}

body.hide-struct .rc::before,body.hide-struct .rc::after,body.hide-struct .md::before,body.hide-struct .md::after,body.hide-struct .nc::before,body.hide-struct .nc::after{content:none}
body.hide-struct .rw::after{display:none}
body.hide-struct u.pl{text-decoration:none}
body.hide-gloss .gw::before{display:none}
body.hide-gloss .snotes{display:none}
body.hide-ko .ko{display:none}
body.hide-struct.hide-gloss .en{line-height:1.85}

/* ===== Overview ===== */
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{padding:16px 18px}
.box h3{font-size:15px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.flow .st{flex:1 1 150px;background:var(--c-ffffff);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.flow .st b{display:block;font-size:12px;color:var(--acc);font-weight:900}
.flow .st span{font-size:13.5px;font-weight:500}
.flow .ar{align-self:center;color:var(--ink3);font-weight:900}
.claim{background:var(--ink);color:var(--c-f6f3ec);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.7;margin-top:12px}
.claim .serif{font-size:15.5px;color:var(--c-ffd27a)}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.bar-row{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:8px;font-size:12.5px}
.bar-tr{height:14px;background:var(--line2);border-radius:7px;overflow:hidden}
.bar-fl{height:100%;background:var(--acc);border-radius:7px}
.bar-v{font-weight:900;text-align:right;font-family:'Source Serif 4',serif;font-size:15px}
.src{font-size:11.5px;color:var(--ink3);margin-top:8px}
.persona{padding:0;overflow:hidden}
.persona .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;color:var(--c-ffffff)}
.persona .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:900;font-size:16px}
.persona .ph b{font-size:16px;display:block;line-height:1.2}
.persona .ph small{font-size:12px;opacity:.9}
.persona dl{display:grid;grid-template-columns:78px 1fr;gap:0;font-size:13px}
.persona dt,.persona dd{padding:8px 12px;border-top:1px solid var(--line2)}
.persona dt{font-weight:700;color:var(--ink3);font-size:12px;background:var(--c-fbfaf7)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.trio div{background:var(--acc-bg);border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:700}
.trio small{display:block;font-family:'Source Serif 4',serif;font-weight:400;font-size:12.5px;color:var(--ink2);font-style:italic}

.cboard{display:flex;flex-direction:column;gap:12px}
.crow{display:grid;grid-template-columns:62px 1fr;gap:0;overflow:hidden}
.cside{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c-ffffff);font-weight:900;font-size:13px;writing-mode:horizontal-tb;gap:4px;padding:8px 4px;text-align:center}
.cside .sw{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.6)}
.cpair{display:grid;grid-template-columns:1fr auto 1fr}
.art{padding:12px 14px}
.art .nm{font-weight:900;font-size:14.5px}
.art .wk{font-family:'Source Serif 4',serif;font-style:italic;font-size:13px;color:var(--ink2)}
.art .em{display:inline-block;margin:6px 0 4px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.art ul{padding-left:16px;font-size:12.8px;color:var(--ink2)}
.vs{display:flex;align-items:center;justify-content:center;padding:0 2px}
.vs span{writing-mode:vertical-rl;font-family:'Source Serif 4',serif;font-style:italic;font-size:12.5px;color:var(--ink3);border-left:1px dashed var(--line);border-right:1px dashed var(--line);padding:6px 3px}
.trap{display:flex;flex-direction:column;gap:8px}
.trap div{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;background:var(--c-ffffff);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trap div b.x{color:var(--pl)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums div{background:var(--c-ffffff);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.nums b{display:block;font-family:'Source Serif 4',serif;font-size:24px;line-height:1.1;color:var(--acc)}
.nums span{font-size:12px;color:var(--ink2)}

/* ===== Paraphrase ===== */
.pgroup{margin-bottom:18px}
.pg-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:900;font-size:14px}
.pg-h .pno-s{font-family:'Source Serif 4',serif;color:var(--acc);font-size:18px}
.pp-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pp{padding:13px 15px}
.pp-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.pp-w{font-family:'Source Serif 4',serif;font-weight:700;font-size:18.5px;line-height:1.25}
.pp-ko{font-family:'Nanum Pen Script',cursive;font-size:20px;color:var(--pen);line-height:1.1}
.pp-ko.mine{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13px;color:var(--ink3);font-weight:500}
.eqs{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 8px}
.eq{font-family:'Source Serif 4',serif;font-size:14.5px;border-radius:8px;padding:2px 9px;background:var(--pen-bg);color:var(--c-1f3590);border:1px solid var(--c-d6ddf8)}
.eq::before{content:"= ";font-weight:700;color:var(--pen)}
.eq.ap{background:var(--c-fff7ec);color:var(--c-8a4b06);border-color:var(--c-f6dcb4)}
.eq.ap::before{content:"≈ ";color:var(--nc)}
.eq.long{font-size:13.5px;line-height:1.5}
.pp-tip{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.pp-ctx{font-family:'Source Serif 4',serif;font-size:13.8px;color:var(--ink2);line-height:1.6;border-top:1px dashed var(--line);padding-top:8px}
.pp-ctx .rf{font-family:'Noto Sans KR';font-size:11px;font-weight:700;color:var(--ink3);margin-right:4px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lk{padding:12px 14px}
.lk h4{font-size:14px;font-weight:900;margin-bottom:6px}
.lk .ch{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:'Source Serif 4',serif;font-size:14px}
.lk .ch em{font-style:normal;background:var(--line2);border-radius:6px;padding:1px 7px}
.lk .ch sup{font-family:'Noto Sans KR';font-size:10px;color:var(--acc);font-weight:700}
.lk p{font-size:12.5px;color:var(--ink2);margin-top:6px}
.banks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bank{padding:0;overflow:hidden}
.bank .bh{padding:9px 14px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px}
.bank .bh .sw{width:14px;height:14px;border-radius:4px}
.bank .bb{padding:10px 14px 13px;display:flex;flex-direction:column;gap:6px}
.bank .ln{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bank .ln b{font-size:12px;color:var(--ink3);min-width:64px}
.bank .w{font-family:'Source Serif 4',serif;font-size:14.5px;background:var(--c-ffffff);border:1px solid var(--line);border-radius:7px;padding:1px 8px}

/* ===== Grammar ===== */
.gfilter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.gf{border:1px solid var(--line);background:var(--c-ffffff);font-size:12.5px;font-weight:700;color:var(--ink2);padding:5px 12px;border-radius:999px}
.gf.on{background:var(--ink);border-color:var(--ink);color:var(--c-ffffff)}
.gcards{display:flex;flex-direction:column;gap:12px}
.gc{overflow:hidden}
.gc-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.gno{font-family:'Source Serif 4',serif;font-weight:700;font-size:20px;color:var(--acc);min-width:28px}
.gc-h h3{font-size:15.5px;font-weight:900;line-height:1.35;flex:1}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge.n{background:var(--pen-bg);color:var(--pen)}
.badge.p{background:var(--plus-bg);color:var(--plus)}
.gc-b{padding:12px 16px;font-size:14px}
.gc-b p+p{margin-top:6px}
.gc-b .formula{display:inline-block;font-family:'Source Serif 4',serif;font-size:15.5px;background:var(--c-fbfaf6);border:1px solid var(--line);border-radius:8px;padding:3px 10px;margin:2px 0}
.gt{width:100%;border-collapse:collapse;font-size:13.2px;margin:6px 0}
.gt th,.gt td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.gt th{background:var(--c-fbfaf6);font-weight:700;font-size:12.5px;color:var(--ink2)}
.gt td.e{font-family:'Source Serif 4',serif;font-size:14px}
.gex{background:var(--c-fcfbf8);border-top:1px solid var(--line2);padding:4px 16px 10px}
.gex .ex{padding:8px 0 4px;border-bottom:1px dashed var(--line)}
.gex .ex:last-child{border-bottom:0}
.gex .en{font-size:16px;line-height:2.45}
.gex .ko{font-size:13px}
.gex .tag{font-size:11px;font-weight:700;color:var(--ink3)}
.gex .why{font-size:12.8px;color:var(--c-1f3590);margin-top:4px}

/* ===== Drill ===== */
.drill-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dbtn{border:1px solid var(--line);background:var(--c-ffffff);font-size:13px;font-weight:700;color:var(--ink2);padding:7px 14px;border-radius:999px}
.dbtn.pri{background:var(--ink);color:var(--c-ffffff);border-color:var(--ink)}
.dcount{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.dlist{display:flex;flex-direction:column;gap:10px}
.di{padding:13px 16px;display:grid;grid-template-columns:30px 1fr;gap:4px 10px}
.di .no{font-family:'Source Serif 4',serif;font-weight:700;color:var(--acc);font-size:17px}
.di .de{font-family:'Source Serif 4',serif;font-size:16.5px;line-height:1.65}
.di .de u{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2.5px;text-underline-offset:4px;font-weight:700}
.di .dk{font-size:14.3px;color:var(--ink2);line-height:1.9;grid-column:2}
.di .rf{grid-column:2;font-size:11px;color:var(--ink3);font-weight:700}
.blank{display:inline-block;min-width:3.2em;border:0;border-bottom:2px solid var(--acc);background:var(--acc-bg);color:transparent;font-size:14.3px;font-weight:700;padding:0 6px;border-radius:5px 5px 0 0;line-height:1.55;vertical-align:baseline;transition:.15s;user-select:none}
.blank.open{color:var(--acc);background:var(--c-ffffff)}

.totop{position:fixed;right:16px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--c-ffffff);font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.totop.show{opacity:1;pointer-events:auto}
footer{text-align:center;font-size:12px;color:var(--ink3);padding:10px 0 30px}

@media (max-width:680px){
  .hero h1{font-size:27px}
  .en{font-size:17px;line-height:2.55}
  .sent{padding:10px 12px 12px;grid-template-columns:20px 1fr;gap:4px 8px}
  .snum{width:20px;height:20px;line-height:20px;font-size:10px}
  .para-h{padding:12px 12px}

    [`The first artist is Vincent van Gogh.`, `첫 번째 화가는 빈센트 반 고흐이다.`, []],
    [`According to research, the French city of Arles, [[{where|= in which} van Gogh spent his later years,]] had {exceptionally|= unusually} bright and {intense|강렬한} sunlight.`,
     `연구에 따르면, 반 고흐가 말년을 보낸 프랑스 도시 아를은 유난히 밝고 강렬한 햇빛을 지니고 있었다.`,
     ['where = in which = and in the French city of Arles (관계부사 계속적 용법)',
      'exceptionally = unusually (Vocabulary Plus)',
      '+ 주어 the French city of Arles, [where …,] → 동사 had']],
    [`Van Gogh expressed the sunlight, energy, and the joy of life [[he felt there]] through bright yellow colors.`,
     `반 고흐는 그곳에서 느낀 햇빛, 에너지, 그리고 삶의 기쁨을 밝은 노란색으로 표현했다.`,
     ['the joy of life [he felt there]: 앞 명사를 꾸미는 절 — 목적격 관계대명사 생략']],
    [`During his short life of 37 years, he created more than 900 paintings, [[around 300 of which {feature|~을 특징으로 하다} mostly yellow]].`,
     `37년의 짧은 생애 동안 그는 900점이 넘는 그림을 그렸는데, 그중 약 300점은 주로 노란색을 특징으로 한다.`,
     ['★ more than 900 paintings, around 300 of which feature mostly yellow',
      '= more than 900 paintings, and around 300 of them feature mostly yellow',
      'feature ⓥ: ~을 특징으로 하다']],
    [`The series of paintings called *Sunflowers* includes some of his most {recognizable|유명한} works.`,
     `'해바라기'라고 불리는 그림 연작에는 그의 가장 유명한 작품 몇 점이 포함되어 있다.`,
     ['recognizable = well-known, iconic, renowned, distinguished',
      '-able: recognizable / measurable / usable',
      '+ 주어 The series (of paintings called …) → 단수 동사 includes']],
    [`Some have said that his preference for yellow in his artwork was due to a medical condition [[that {forced^5V} {him^O} {to see^O.C.} mainly yellow]].`,
     `어떤 이들은 그의 작품 속 노란색에 대한 선호가 그로 하여금 주로 노란색을 보게 만든 질환 때문이었다고 말해 왔다.`,
     ['[that …]: a medical condition을 꾸미는 관계사절',
      'force + O + to V (5형식)']],
    [`While this may be true, we can also see his use of blue, orange, and other colors, and these combinations of colors {serve|역할을 하다} to emphasize his joy being conveyed.`,
     `이것이 사실일 수도 있지만, 우리는 그가 파란색, 주황색, 그리고 다른 색들을 사용한 것도 볼 수 있으며, 이러한 색의 조합은 전달되고 있는 그의 기쁨을 강조하는 역할을 한다.`,
     ['serve to V: ~하는 역할을 하다',
      'joy 관련: joy, delight, brightness, liveliness, vibrancy']]
  ]},
  {n:3, who:'Hopper', title:'Edward Hopper — 노랑 = 외로움', sub:'p.67 · Nighthawks (1942) · Automat (1927)', s:[
    [`Van Gogh used yellow to express joy, but Edward Hopper's use of yellow expresses loneliness.`,
     `반 고흐는 기쁨을 표현하기 위해 노란색을 사용했지만, 에드워드 호퍼의 노란색 사용은 외로움을 표현한다.`,
     ['+ but: 반 고흐(기쁨)와 호퍼(외로움)의 대조 — 같은 노랑, 다른 감정']],
    [`Hopper lived in New York City for nearly six decades, and he created paintings (({depicting|묘사하다} urban scenes [[that showed <<how even familiar surroundings could {cause^5V} the {viewer^O} {to feel^O.C.} a sense of loneliness>>]])).`,
     `호퍼는 거의 60년 동안 뉴욕시에 살았고, 익숙한 환경조차 어떻게 보는 이로 하여금 외로움을 느끼게 할 수 있는지를 보여 주는 도시 풍경을 묘사한 그림들을 그렸다.`,
     ['depict = illustrate, portray, render → 시각적으로 구현·표현하다',
      'cause + O + to V (5형식)',
      '+ (depicting …) 안에 [that …] 관계사절, 그 안에 〈how …〉 명사절이 겹쳐 있음']],
    [`Hopper's *Nighthawks* is a good example of this.`,
     `호퍼의 '밤을 지새우는 사람들(Nighthawks)'은 이것의 좋은 예이다.`,
     ['Nighthawks: 심야의 인물들, 밤을 지새우는 사람들']],
    [`There are four people in the same {diner|식당}, but they're clearly not together.`,
     `같은 식당에 네 사람이 있지만, 그들은 분명히 함께 있는 것이 아니다.`, []],
    [`The bright yellow walls create a dramatic {contrast|대조} to the darkness outside, emphasizing <<how people can be in the same space __and__ feel apart>>.`,
     `밝은 노란색 벽은 바깥의 어둠과 극적인 대조를 이루며, 사람들이 어떻게 같은 공간에 있으면서도 서로 동떨어져 있다고 느낄 수 있는지를 강조한다.`,
     ['feel apart: to feel emotionally distant or disconnected from each other even though people are physically in the same place.',
      'can be … and feel …: 병렬',
      '+ emphasizing …: 앞 내용에 이어지는 분사구문']],
    [`In Hopper's *Automat*, the feeling of loneliness is {even|비교급 강조} more direct.`,
     `호퍼의 '자판기 식당(Automat)'에서는 외로움의 감정이 훨씬 더 직접적이다.`,
     ['direct = apparent, evident, immediate',
      'Automat: 자판기 식당',
      '+ 비교급 강조: even / much / still / far / a lot + 비교급']],
    [`The yellow lights lead the viewer's eye to the yellow hat of the woman, and the cool {shades|음영, 색조} of the other colors {contrast with|~와 대조하다} the warm yellow, emphasizing that she's on her own.`,
     `노란 조명은 보는 이의 시선을 그 여자의 노란 모자로 이끌고, 다른 색들의 차가운 색조는 따뜻한 노란색과 대조를 이루어 그녀가 혼자라는 것을 강조한다.`,
     ['contrast ⓥ with: ~와 대조하다 (앞 문장의 명사 contrast와 비교)',
      'loneliness 관련: loneliness, isolation, alienation(소외감), detachment(무심함)',
      '+ on one\'s own: 혼자']]
  ]},
  {n:4, who:'Kim Whanki', title:'Kim Whanki — 파랑 = 고향에 대한 그리움', sub:'p.68 · Tranquility 5-IV-73 var(--c-331100) (1973)', s:[
    [`The color blue can produce a calming effect.`, `파란색은 마음을 진정시키는 효과를 낼 수 있다.`, []],
    [`Even during his days in Paris and New York, Kim Whanki never forgot his Korean identity.`,
     `파리와 뉴욕에서 지내던 시절에도, 김환기는 한국인으로서의 정체성을 결코 잊지 않았다.`, []],
    [`The blue sky and blue seas __reminded__ {him^A} __of__ {Sinan^B}, his home in Korea, {which|= and it} {inspired^5V} {him^O} {to create^O.C.} paintings ((filled with various shades of blue)).`,
     `푸른 하늘과 푸른 바다는 그에게 한국의 고향인 신안을 떠올리게 했고, 그것은 그가 다양한 색조의 파란색으로 가득 찬 그림을 그리도록 영감을 주었다.`,
     ['remind A of B: A에게 B를 떠올리게 하다',
      'Sinan, his home in Korea: 동격 (Sinan = his home in Korea)',
      ', which = and it / inspire + O + to V (5형식)',
      '+ (filled with …): 과거분사구가 paintings를 뒤에서 수식']],
    [`His use of blue was an expression of how much he missed the place [[{he|(which)} grew up in]].`,
     `그의 파란색 사용은 그가 자란 곳을 얼마나 그리워했는지를 표현한 것이었다.`,
     ['the place (which) he grew up in: 목적격 관계대명사 생략, 전치사 in은 절 끝에 남음']],
    [`In *Tranquility 5-IV-73 #310*, the waves of deep blue and light blue dots {bring up|떠오르게 하다} images of the sea or the sky.`,
     `'고요 5-IV-73 var(--c-331100)'에서 짙은 파란색과 옅은 파란색 점들의 물결은 바다나 하늘의 이미지를 떠오르게 한다.`,
     ['bring up = evoke, call to mind',
      'Tranquility 5-IV-73 #310: 고요함 1973.4.5',
      '+ 주어 the waves (of … dots) → 복수 동사 bring']],
    [`Kim Whanki said that he painted each dot as he thought of friends and loved ones from home.`,
     `김환기는 고향의 친구들과 사랑하는 사람들을 생각하며 점 하나하나를 그렸다고 말했다.`,
     ['그리움, 향수: nostalgia, longing, reminiscence',
      '소속감, 애착: a sense of belonging, attachment']]
  ]},
  {n:5, who:'Matisse', title:'Henri Matisse — 파랑 = 자유', sub:'p.68 · Polynesia, the Sky / the Sea (1946)', s:[
    [`On the other hand, Henri Matisse's blue {speaks of|~에 대해 말하다} freedom.`,
     `반면에, 앙리 마티스의 파란색은 자유에 대해 말한다.`,
     ['speak of = show, suggest',
      '+ On the other hand: 김환기(그리움)와 마티스(자유)의 대조']],
    [`*Polynesia, the Sky* and *Polynesia, the Sea* are two Matisse works [[that have an interesting similarity]].`,
     `'폴리네시아, 하늘'과 '폴리네시아, 바다'는 흥미로운 유사점을 지닌 마티스의 두 작품이다.`, []],
    [`In his later years, Matisse had cancer surgery, {which|= and it} {left^5V} {him^O} {unable^O.C.} ((to stand)) and paint in front of an easel.`,
     `말년에 마티스는 암 수술을 받았는데, 그것은 그를 이젤 앞에 서서 그림을 그릴 수 없게 만들었다.`,
     [', which = and it / leave + O + 형용사(O.C.) — 5형식',
      '+ unable to stand and paint: to 뒤에 stand와 paint가 병렬']],
    [`Instead of painting, he created artwork ((by gluing paper cut-outs __and__ then painting details)).`,
     `그림을 그리는 대신, 그는 오려 낸 종이를 붙이고 그다음에 세부를 칠하는 방식으로 작품을 만들었다.`,
     ['by gluing … and then painting …: 전치사 by 뒤에 동명사 병렬']],
    [`Although his physical difficulties __prevented__ {him^A} __from__ {doing^B} many things, he still remembered the freedom [[he experienced (({while|~하는 동안} swimming in the Tahitian sea))]], looking through the salt water down to the sea floor and up towards the sky.`,
     `비록 그의 신체적 어려움이 그가 많은 일을 하는 것을 막았지만, 그는 타히티 바다에서 수영하는 동안 소금물 너머로 바다 밑바닥을 내려다보고 하늘을 올려다보며 경험했던 자유를 여전히 기억했다.`,
     ['prevent A from B: A가 B하는 것을 막다',
      'prevent = keep, stop, prohibit, ban, forbid, inhibit, hinder',
      'the freedom [he experienced …]: 목적격 관계대명사 생략',
      'while swimming: ~하는 동안 (접속사 + -ing)',
      '자유: freedom, release / 회복탄력성: resilience / 초월: transcendence']]
  ]},
  {n:6, who:'Gorman · Monet', title:'R.C. Gorman & Claude Monet — 빨강 = 생명·자연', sub:'p.69 · Navajo Velvet (2004) · Autumn Effect at Argenteuil (1873)', s:[
    [`Our last color is red, [[{which|= and it} is often {associated with|= connected to} life and energy]].`,
     `우리의 마지막 색은 빨간색인데, 그것은 흔히 생명과 에너지와 연관된다.`,
     ['associate A with B: A와 B와 관련이 있다 (= connect A with B)',
      'be associated with = be connected to',
      '빨강 관련: life, energy / 대자연 mother nature / 우주 cosmos / 강인함 inner strength / 우아함 elegant / 생명력 vitality / 풍요로움 abundance, fertility']],
    [`R.C. Gorman, (({known as|~로서 알려진} the Picasso of Native American art)), may have felt the same way when he created *Navajo Velvet*.`,
     `아메리카 원주민 미술의 피카소로 알려진 R.C. 고먼은 '나바호 벨벳'을 그렸을 때 같은 감정을 느꼈을지도 모른다.`,
     ['(known as …): 주어 R.C. Gorman을 설명하는 삽입 분사구',
      '+ may have p.p.: ~했을지도 모른다 (과거에 대한 추측)']],
    [`The painting depicts a woman ((sitting on the ground, deep in thought)).`,
     `그 그림은 깊은 생각에 잠긴 채 땅에 앉아 있는 한 여인을 묘사한다.`,
     ['+ (sitting …): 현재분사구가 a woman을 뒤에서 수식']],
    [`Her {figure|모습, 모양} ((in a red dress)) {resembles|~와 닮아있다} a huge mountain against the background of the deep, starry blue night, suggesting the relationship between her and nature.`,
     `빨간 드레스를 입은 그녀의 모습은 별이 빛나는 깊고 푸른 밤을 배경으로 거대한 산을 닮아 있어, 그녀와 자연 사이의 관계를 암시한다.`,
     ['suggesting the relationship between her and nature = blending human and natural elements',
      '+ resemble: 전치사 없이 바로 목적어 (resemble with ✕)']],
    [`Sometimes red is used to express the beauty of nature.`,
     `때때로 빨간색은 자연의 아름다움을 표현하는 데 사용된다.`, []],
    [`Claude Monet's *Autumn Effect at Argenteuil* shows how the artist celebrated beautiful autumn moments.`,
     `클로드 모네의 '아르장퇴유의 가을 효과'는 그 화가가 아름다운 가을의 순간들을 어떻게 찬미했는지를 보여 준다.`, []],
    [`The bright reds in the painting symbolize the amazing and {transformative|변화시키는 힘이 있는} power of nature.`,
     `그 그림 속 밝은 빨간색들은 자연의 놀랍고도 변화시키는 힘을 상징한다.`,
     ['symbolize = represent, embody, signify (→ 의미하다)',
      'the amazing and transformative power (of nature) = the seasonal beauty']],
    [`The painting captures the dramatic moment when the forest turns bright red and is reflected on the surface of the river.`,
     `그 그림은 숲이 밝은 빨간색으로 변하고 강의 수면에 비치는 극적인 순간을 포착한다.`,
     ['관련 표현: the fall landscape, rich/vibrant autumnal colors',
      '+ the moment when …: 관계부사 when / turns(V1) and is reflected(V2) 병렬']]
  ]}
  ],

  overview:`
  <div class="sec-h"><h2>색채 비교 보드</h2><p>같은 색 · 다른 감정 — 두 화가씩 짝지어 비교·대조</p></div>
  <div class="cboard">
    <div class="card crow">
      <div class="cside" style="background:var(--c-d9a300)"><span class="sw" style="background:var(--c-ffd23f)"></span>노랑</div>
      <div class="cpair">
        <div class="art"><div class="nm">Vincent van Gogh <small style="color:var(--c-8c857a)">¶2</small></div><div class="wk">Sunflowers (1889) · The Yellow House (1888)</div>
          <span class="em" style="background:var(--c-fff4c7);color:var(--c-8a6200)">기쁨 joy</span>
          <ul><li>말년을 보낸 아를의 유난히 밝고 강렬한 햇빛</li><li>그곳에서 느낀 햇빛·에너지·삶의 기쁨을 밝은 노랑으로</li><li>파랑·주황 등과의 색 조합이 기쁨을 강조</li></ul></div>
        <div class="vs"><span>but</span></div>
        <div class="art"><div class="nm">Edward Hopper <small style="color:var(--c-8c857a)">¶3</small></div><div class="wk">Nighthawks (1942) · Automat (1927)</div>
          <span class="em" style="background:var(--c-fff4c7);color:var(--c-8a6200)">외로움 loneliness</span>
          <ul><li>익숙한 환경조차 외로움을 느끼게 하는 도시 풍경</li><li>Nighthawks: 밝은 노란 벽 ↔ 바깥의 어둠</li><li>Automat: 노란 조명 → 여자의 노란 모자, 차가운 색조 ↔ 따뜻한 노랑</li></ul></div>
      </div>
    </div>
    <div class="card crow">
      <div class="cside" style="background:var(--c-2b59c3)"><span class="sw" style="background:var(--c-5d8bf0)"></span>파랑</div>
      <div class="cpair">
        <div class="art"><div class="nm">Kim Whanki <small style="color:var(--c-8c857a)">¶4</small></div><div class="wk">Tranquility 5-IV-73 var(--c-331100) (1973)</div>
          <span class="em" style="background:var(--c-e5edfd);color:var(--c-1f3f94)">고향 그리움</span>
          <ul><li>파리·뉴욕에서도 한국인 정체성을 잊지 않음</li><li>푸른 하늘·바다 → 고향 신안을 떠올림</li><li>점 하나하나 = 고향의 친구들과 사랑하는 사람들</li></ul></div>
        <div class="vs"><span>On the other hand</span></div>
        <div class="art"><div class="nm">Henri Matisse <small style="color:var(--c-8c857a)">¶5</small></div><div class="wk">Polynesia, the Sky · Polynesia, the Sea (1946)</div>
          <span class="em" style="background:var(--c-e5edfd);color:var(--c-1f3f94)">자유 freedom</span>
          <ul><li>말년의 암 수술 → 이젤 앞에 서서 그릴 수 없음</li><li>종이 오려 붙이기 + 세부 칠하기로 작품 제작</li><li>타히티 바다에서 수영하며 느낀 자유를 기억</li></ul></div>
      </div>
    </div>
    <div class="card crow">
      <div class="cside" style="background:var(--c-c8371d)"><span class="sw" style="background:var(--c-f0634a)"></span>빨강</div>
      <div class="cpair">
        <div class="art"><div class="nm">R.C. Gorman <small style="color:var(--c-8c857a)">¶6</small></div><div class="wk">Navajo Velvet (2004)</div>
          <span class="em" style="background:var(--c-fde8e3);color:var(--c-9a2a14)">생명·에너지</span>
          <ul><li>아메리카 원주민 미술의 피카소</li><li>깊은 생각에 잠겨 땅에 앉은 여인, 빨간 드레스</li><li>별빛 푸른 밤을 배경으로 거대한 산을 닮음 → 여인과 자연의 관계</li></ul></div>
        <div class="vs"><span>Sometimes</span></div>

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mk(s){
  s = s.replace(/<</g,'\u0001').replace(/>>/g,'\u0002');
  s = esc(s);
  s = s.replace(/\{([^{}|^]+?)(?:\|([^{}^]+?))?(?:\^([^{}]+?))?\}/g, (m,w,g,r)=>{
    if(!g && !r) return w;
    const cls = (g?'gw':'')+(g&&r?' ':'')+(r?'rw':'');
    return `<span class="${cls}"${g?` data-g="${g.replace(/"/g,'&quot;')}"`:''}${r?` data-r="${r.replace(/"/g,'&quot;')}"`:''}>${w}</span>`;
  });
  return s
    .replace(/\[\[/g,'<span class="rc">').replace(/\]\]/g,'</span>')
    .replace(/\(\(/g,'<span class="md">').replace(/\)\)/g,'</span>')
    .replace(/\u0001/g,'<span class="nc">').replace(/\u0002/g,'</span>')
    .replace(/__(.+?)__/g,'<u class="pl">$1</u>')
    .replace(/==(.+?)==/g,'<mark>$1</mark>')
    .replace(/\*([^*]+)\*/g,'<i>$1</i>');
}
function plain(s){
  return s.replace(/\{([^{}|^]+?)(?:\|[^{}^]+?)?(?:\^[^{}]+?)?\}/g,'$1')
          .replace(/<<|>>|\[\[|\]\]|\(\(|\)\)|__|==/g,'').replace(/\*/g,'');
}

}

    h += `<div class="sec-h"><h2>주제별 표현 은행</h2><p>작품 옆에 필기한 감정·이미지 어휘</p></div><div class="banks">`;
    u.banks.forEach(b=>{
      h += `<div class="card bank"><div class="bh" style="background:${b.c}14"><span class="sw" style="background:${b.c}"></span>${esc(b.t)}</div><div class="bb">${
        b.l.map(([k,ws])=>`<div class="ln">${k?`<b>${esc(k)}</b>`:''}${ws.map(w=>`<span class="w">${esc(w)}</span>`).join('')}</div>`).join('')
      }</div></div>`;
    });
    h += `</div>`;
  }
  h += `<div class="sec-h"><h2>문단을 넘나드는 연결 고리</h2><p>같은 의미 · 같은 구조가 다시 나오는 곳</p></div><div class="links">`;
  u.links.forEach(l=>{
    h += `<div class="card lk"><h4>${l.t}</h4><div class="ch">${l.ch.map(([w,p])=>`<em>${esc(w)}${p?` <sup>${p}</sup>`:''}</em>`).join('')}</div><p>${esc(l.d)}</p></div>`;
  });
  return h + `</div>`;
}

let gFilter = 'all';
function rGram(u){
  const list = u.grammar.filter(g=>gFilter==='all'||g.s===gFilter);
  let h = `<div class="gfilter">
    <button class="gf${gFilter==='all'?' on':''}" data-g="all">전체 ${u.grammar.length}</button>
    <button class="gf${gFilter==='n'?' on':''}" data-g="n">✍ 필기 ${u.grammar.filter(g=>g.s==='n').length}</button>
    <button class="gf${gFilter==='p'?' on':''}" data-g="p">＋ 보충 ${u.grammar.filter(g=>g.s==='p').length}</button></div><div class="gcards">`;
  list.forEach(g=>{
    const no = u.grammar.indexOf(g)+1;
    h += `<div class="card gc"><div class="gc-h"><span class="gno">${String(no).padStart(2,'0')}</span><h3>${esc(g.t)}</h3><span class="badge ${g.s}">${g.s==='n'?'✍ 필기':'＋ 보충'}</span></div><div class="gc-b">${g.b}</div>`;
    if(g.ex.length){
      h += `<div class="gex">`;
      g.ex.forEach(e=>{
        const r = typeof e==='string'? e : e.r, s = sent(u,r);
        h += `<div class="ex"><span class="tag">본문 ¶${r.replace('-','·')}</span><p class="en">${mk(s[0])}</p><p class="ko">${esc(s[1])}</p>${e.why?`<div class="why">→ ${esc(e.why)}</div>`:''}</div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  });
  return h + `</div>`;
}

function rDrill(u){
  let h = `<div class="lead">영어 문장의 <b>밑줄 친 표현</b>이 한국어 해석의 어느 부분인지 떠올린 뒤, 빈칸을 눌러 확인하세요. 독해와 어휘를 한 번에 훈련합니다.</div>
    <div class="drill-bar"><button class="dbtn pri" id="dAll">전체 정답 보기</button><button class="dbtn" id="dHide">전체 가리기</button><button class="dbtn" id="dShuf">순서 섞기</button><span class="dcount" id="dCount"></span></div><div class="dlist" id="dlist">`;
  u.drill.forEach((d,i)=>{
    const s = sent(u,d.r), en = plain(s[0]), ko = s[1];
    const ei = en.indexOf(d.w), ki = ko.indexOf(d.a);
    const enH = esc(en.slice(0,ei))+'<u>'+esc(d.w)+'</u>'+esc(en.slice(ei+d.w.length));
    const koH = esc(ko.slice(0,ki))+`<button class="blank" data-a="${esc(d.a)}" style="min-width:${Math.max(3.2,d.a.length*0.95+1)}em">${esc(d.a)}</button>`+esc(ko.slice(ki+d.a.length));
    h += `<div class="card di"><span class="no">${i+1}</span><div class="de">${enH}</div><div class="dk">${koH}</div><div class="rf">¶${d.r.replace('-','·')} · ${esc(d.w)}</div></div>`;
  });
  return h + `</div>`;
}

const PRACTICE = {"u2": ["<a class=\"m-practice\" target=\"_top\" href=\"../../../cloud.html?s=english&amp;u=%EA%B5%90%EA%B3%BC%EC%84%9C%20Unit%202%20%C2%B7%20%EC%96%B4%ED%9C%98\"><span class=\"m-practice-ico\" aria-hidden=\"true\">📝</span><span class=\"m-practice-txt\"><b>어휘 문제</b><small>교과서 Unit 2 · 어휘 · 14문제 · 5문제씩 풀어요</small></span><span class=\"m-practice-go\">무한 문제로 풀기 →</span></a>", "<a class=\"m-practice\" target=\"_top\" href=\"../../../cloud.html?s=english&amp;u=%EA%B5%90%EA%B3%BC%EC%84%9C%20Unit%202%20%C2%B7%20%EC%96%B4%ED%9C%98%20O/X\"><span class=\"m-practice-ico\" aria-hidden=\"true\">📝</span><span class=\"m-practice-txt\"><b>어휘 O/X 문제</b><small>교과서 Unit 2 · 어휘 O/X · 13문제 · 5문제씩 풀어요</small></span><span class=\"m-practice-go\">무한 문제로 풀기 →</span></a>"], "u3": ["<a class=\"m-practice\" target=\"_top\" href=\"../../../cloud.html?s=english&amp;u=%EA%B5%90%EA%B3%BC%EC%84%9C%20Unit%203%20%C2%B7%20%EC%96%B4%ED%9C%98\"><span class=\"m-practice-ico\" aria-hidden=\"true\">📝</span><span class=\"m-practice-txt\"><b>어휘 문제</b><small>교과서 Unit 3 · 어휘 · 15문제 · 5문제씩 풀어요</small></span><span class=\"m-practice-go\">무한 문제로 풀기 →</span></a>", "<a class=\"m-practice\" target=\"_top\" href=\"../../../cloud.html?s=english&amp;u=%EA%B5%90%EA%B3%BC%EC%84%9C%20Unit%203%20%C2%B7%20%EC%96%B4%ED%9C%98%20O/X\"><span class=\"m-practice-ico\" aria-hidden=\"true\">📝</span><span class=\"m-practice-txt\"><b>어휘 O/X 문제</b><small>교과서 Unit 3 · 어휘 O/X · 15문제 · 5문제씩 풀어요</small></span><span class=\"m-practice-go\">무한 문제로 풀기 →</span></a>"]};
function rPractice(u){ return `<div class="lead">이 단원의 어휘 문제(뜻 고르기·O/X)는 무한 문제에서 풀어요.</div><div class="m-practice-wrap">${(PRACTICE[u.id]||[]).join('')}</div>`; }
const R = {overview:rOverview, text:rText, para:rPara, gram:rGram, drill:rPractice};

function renderShell(){
  const u = U();
  document.body.dataset.unit = u.id;
  document.getElementById('unitSwitch').innerHTML = UNITS.map((x,i)=>`<button class="${i===S.unit?'on':''}" data-u="${i}"><span class="dots">${x.dots.map(c=>`<i style="background:${c}"></i>`).join('')}</span>${x.short}</button>`).join('');
  document.getElementById('hero').innerHTML = `<div class="kicker">${esc(u.kicker)}</div><h1>${esc(u.title)}</h1><div class="kr">${esc(u.kr)}</div><div class="chips">${u.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div><div class="stripe">${u.dots.map(c=>`<span style="background:${c}"></span>`).join('')}</div>`;
  document.getElementById('tabs').innerHTML = TABS.map((t,i)=>`<button class="tab${i===S.tab?' on':''}" data-tab="${i}"><span class="ic">${t.ic}</span>${t.l}</button>`).join('');
  document.getElementById('main').innerHTML = TABS.map((t,i)=>`<div class="panel${i===S.tab?' on':''}" id="panel-${t.k}">${i===S.tab?R[t.k](u):''}</div>`).join('');
  afterRender();
  save();
}
function switchTab(i){
  S.tab = i;
  document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on', j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>{
    p.classList.toggle('on', j===i);
    if(j===i) p.innerHTML = R[TABS[j].k](U());
  });
  afterRender();
  const tb = document.querySelector('.tab.on'); if(tb && tb.scrollIntoView) tb.scrollIntoView({inline:'center', block:'nearest'});
  const nav = document.querySelector('.tabs');
  if(window.scrollY > nav.offsetTop) window.scrollTo({top:nav.offsetTop, behavior:'smooth'});
  save();
}
function updateCount(){
  const c = document.getElementById('dCount'); if(!c) return;
  const all = document.querySelectorAll('.blank').length, open = document.querySelectorAll('.blank.open').length;
  c.textContent = `확인 ${open} / ${all}`;
}
function afterRender(){
  updateCount();
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.u!=null){ S.unit = +t.dataset.u; gFilter='all'; renderShell(); window.scrollTo({top:0}); return; }
  if(t.dataset.tab!=null){ switchTab(+t.dataset.tab); return; }
  if(t.dataset.t){ document.body.classList.toggle(t.dataset.t); t.classList.toggle('on'); save(); return; }
  if(t.dataset.g){ gFilter = t.dataset.g; document.getElementById('panel-gram').innerHTML = rGram(U()); return; }
  if(t.classList.contains('blank')){ t.classList.toggle('open'); updateCount(); return; }
  if(t.id==='dAll'){ document.querySelectorAll('.blank').forEach(b=>b.classList.add('open')); updateCount(); return; }
  if(t.id==='dHide'){ document.querySelectorAll('.blank').forEach(b=>b.classList.remove('open')); updateCount(); return; }
  if(t.id==='dShuf'){
    const l = document.getElementById('dlist'), items = [...l.children];
    for(let i=items.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [items[i],items[j]] = [items[j],items[i]]; }
    items.forEach((it,i)=>{ it.querySelector('.no').textContent = i+1; l.appendChild(it); });
    return;
  }
  if(t.id==='totop'){ window.scrollTo({top:0, behavior:'smooth'}); }
});
window.addEventListener('scroll', ()=>{ document.getElementById('totop').classList.toggle('show', window.scrollY > 500); }, {passive:true});

renderShell();
</script>
