<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>/* 저장된 화면 모드를 먼저 적용해 깜빡임을 막는다 (기본 다크) */try{if(localStorage.getItem('simpul.theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
  <title>인터넷 연결 없음 · 심풀스터디</title>
  <link rel="stylesheet" href="./styles/site.css">
</head>
<body>
  <header class="site-header"><div class="wrap"><span class="site-logo"><img src="./assets/simpul-logo-white.png" alt="심풀스터디" width="695" height="257"></span></div></header>
  <main class="wrap">
    <div class="page-head">
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>자료는 인터넷에서 불러와요. Wi-Fi나 데이터 연결을 확인한 뒤 다시 시도해 주세요.</p>
    </div>
    <button class="btn btn-primary" type="button" onclick="location.reload()">다시 불러오기</button>
  </main>
</body>
</html>
